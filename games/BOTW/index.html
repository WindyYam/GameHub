/**
 * Chunked LOD Terrain Streaming System covering a 3,360m x 3,360m open world
 * (12 x 12 chunks of 280m x 280m, 3 LOD levels with seamless analytic normals & edge skirts).
 */
function createTerrainSystem(texLib, assetManager) {
  const GRID_N = 16;
  const CHUNK_SIZE = (WORLD_HALF * 2.0) / GRID_N; // 775m
  const LOD_SEGS = [56, 24, 10];
  const SKIRT_DEPTH = 34.0;
  const MAX_CACHE = 160;

  const root = new THREE.Group();

  const mat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 0.88,
    metalness: 0.02
  });
  mat.fog = false;
  mat.customProgramCacheKey = () => 'botw_terrain_chunk_pbr_v2';

  mat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, ATMO_UNIFORMS);

    shader.uniforms.uGrassMap = { value: texLib.grass.map };
    shader.uniforms.uGrassNormal = { value: texLib.grass.normalMap };
    shader.uniforms.uDirtMap = { value: texLib.dirt.map };
    shader.uniforms.uDirtNormal = { value: texLib.dirt.normalMap };
    shader.uniforms.uRockMap = { value: texLib.cliffRock.map };
    shader.uniforms.uRockNormal = { value: texLib.cliffRock.normalMap };
    shader.uniforms.uShoreMap = { value: texLib.shore.map };
    shader.uniforms.uShoreNormal = { value: texLib.shore.normalMap };
    shader.uniforms.uWaterLevel = { value: WATER_LEVEL };

    shader.vertexShader = shader.vertexShader
      .replace(
        '#include <common>',
        /* glsl */`
        #include <common>
        varying vec3 vAtmoWPos;
        varying vec3 vAtmoWNorm;
        `
      )
      .replace(
        '#include <project_vertex>',
        /* glsl */`
        #include <project_vertex>
        {
          vec4 awp = modelMatrix * vec4(transformed, 1.0);
          vAtmoWPos = awp.xyz;
          vAtmoWNorm = normalize(mat3(modelMatrix) * objectNormal);
        }
        `
      );

    shader.fragmentShader = shader.fragmentShader
      .replace(
        '#include <common>',
        /* glsl */`
        #include <common>
        uniform sampler2D uGrassMap;
        uniform sampler2D uGrassNormal;
        uniform sampler2D uDirtMap;
        uniform sampler2D uDirtNormal;
        uniform sampler2D uRockMap;
        uniform sampler2D uRockNormal;
        uniform sampler2D uShoreMap;
        uniform sampler2D uShoreNormal;
        uniform float uWaterLevel;
        varying vec3 vAtmoWPos;
        varying vec3 vAtmoWNorm;
        ${ATMO_GLSL_PARS}

        vec3 sampleDualAlbedo(sampler2D tex, vec2 worldXZ, float scaleNear, float scaleFar) {
          vec3 a = texture2D(tex, worldXZ * scaleNear).rgb;
          vec3 b = texture2D(tex, worldXZ * scaleFar + vec2(0.37, 0.71)).rgb;
          return mix(a, b, 0.36);
        }

        vec3 sampleDualNormal(sampler2D tex, vec2 worldXZ, float scaleNear, float scaleFar) {
          vec3 a = texture2D(tex, worldXZ * scaleNear).xyz * 2.0 - 1.0;
          vec3 b = texture2D(tex, worldXZ * scaleFar + vec2(0.37, 0.71)).xyz * 2.0 - 1.0;
          return normalize(vec3(a.xy * 0.72 + b.xy * 0.45, 1.0));
        }
        `
      )
      .replace(
        '#include <color_fragment>',
        /* glsl */`
        #include <color_fragment>
        float tCustomRoughness = 0.88;
        vec3 tPerturbedWorldNorm = normalize(vAtmoWNorm);
        {
          vec3 wPos = vAtmoWPos;
          vec3 wNorm = normalize(vAtmoWNorm);
          float slope = 1.0 - clamp(wNorm.y, 0.0, 1.0);

          float macroA = atmoFbm(wPos.xz * 0.012);
          float macroB = atmoFbm(wPos.xz * 0.052 + vec2(7.3, -4.1));
          float microN = atmoNoise(wPos.xz * 0.25);

          // 1) Emerald Highland & Valley Meadow Grass
          vec3 grassTex = sampleDualAlbedo(uGrassMap, wPos.xz, 0.32, 0.055);
          vec3 grassNormT = sampleDualNormal(uGrassNormal, wPos.xz, 0.32, 0.055);
          vec3 lushTint = mix(vec3(0.68, 0.82, 0.56), vec3(1.16, 1.10, 0.74), smoothstep(0.28, 0.78, macroA * 0.65 + macroB * 0.35));
          float valleyLush = smoothstep(28.0, 10.0, wPos.y);
          lushTint = mix(lushTint, vec3(0.75, 0.93, 0.60), valleyLush * 0.32);
          // Subtle dry ochre transition in far-eastern canyon foothills (x > 1850)
          float desertMask = smoothstep(1850.0, 2600.0, wPos.x) * smoothstep(-2900.0, -1800.0, wPos.z);
          lushTint = mix(lushTint, vec3(1.14, 0.92, 0.62), desertMask * 0.62);
          vec3 grassAlbedo = grassTex * lushTint;

          // 2) Winding Dirt Trail & 74m Overlook Grit
          vec3 dirtTex = sampleDualAlbedo(uDirtMap, wPos.xz, 0.50, 0.10);
          vec3 dirtNormT = sampleDualNormal(uDirtNormal, wPos.xz, 0.50, 0.10);

          float pathX = 18.0 + 28.0 * sin(wPos.z * 0.014 + 0.35) + 16.0 * cos(wPos.z * 0.007) + (wPos.z < -180.0 ? (wPos.z + 180.0) * 0.08 : 0.0);
          float pathDist = abs(wPos.x - pathX) + (macroB - 0.5) * 1.4;
          float valleyZone = smoothstep(-32.0, -68.0, wPos.z) * smoothstep(-480.0, -340.0, wPos.z);
          float pathMask = smoothstep(3.8, 1.4, pathDist) * valleyZone * smoothstep(0.32, 0.10, slope);

          float crestDist = length((wPos.xz - vec2(0.0, 1.0)) * vec2(0.85, 0.7));
          float crestDirt = smoothstep(6.2 + macroB * 2.0, 1.8, crestDist) * smoothstep(68.0, 73.5, wPos.y);
          float ruinPathDist = length((wPos.xz - vec2(-7.5, 0.5)) * vec2(0.6, 0.85));
          float ruinDirt = smoothstep(5.8, 2.2, ruinPathDist) * smoothstep(68.0, 73.0, wPos.y);

          float dirtWeight = clamp(max(pathMask * 0.88 + crestDirt * 0.72 + ruinDirt * 0.55, desertMask * 0.42), 0.0, 0.94);

          // 3) Triplanar Stratified Cliff Rock
          vec3 triW = pow(abs(wNorm), vec3(4.0));
          triW /= max(triW.x + triW.y + triW.z, 0.0001);
          float rScale = 0.075;
          float rScaleFar = 0.014;

          vec3 rColX = mix(texture2D(uRockMap, wPos.zy * rScale).rgb, texture2D(uRockMap, wPos.zy * rScaleFar).rgb, 0.38);
          vec3 rColY = mix(texture2D(uRockMap, wPos.xz * rScale).rgb, texture2D(uRockMap, wPos.xz * rScaleFar).rgb, 0.38);
          vec3 rColZ = mix(texture2D(uRockMap, wPos.xy * rScale).rgb, texture2D(uRockMap, wPos.xy * rScaleFar).rgb, 0.38);
          vec3 rockTint = mix(mix(vec3(0.84, 0.82, 0.86), vec3(1.12, 1.04, 0.94), macroA), vec3(1.18, 0.84, 0.64), desertMask * 0.68);
          vec3 rockAlbedo = (rColX * triW.x + rColY * triW.y + rColZ * triW.z) * rockTint;

          vec3 rnX = texture2D(uRockNormal, wPos.zy * rScale).xyz * 2.0 - 1.0;
          vec3 rnY = texture2D(uRockNormal, wPos.xz * rScale).xyz * 2.0 - 1.0;
          vec3 rnZ = texture2D(uRockNormal, wPos.xy * rScale).xyz * 2.0 - 1.0;
          vec3 triNormOffset = vec3(0.0, rnX.y, rnX.x) * triW.x + vec3(rnY.x, 0.0, rnY.y) * triW.y + vec3(rnZ.x, rnZ.y, 0.0) * triW.z;

          float rockMask = smoothstep(0.14, 0.31, slope + (macroB - 0.5) * 0.14);
          float cliffLipRock = smoothstep(0.09, 0.22, slope) * smoothstep(32.0, 62.0, wPos.y);
          float rimDist = length(wPos.xz + vec2(-150.0, 1500.0));
          float mtnRock = smoothstep(55.0, 145.0, wPos.y + macroA * 24.0) * smoothstep(2300.0, 3250.0, rimDist);
          rockMask = clamp(max(rockMask, max(cliffLipRock * 0.86, mtnRock * 0.94)), 0.0, 1.0);

          // 4) High-Altitude Procedural Snowline on 360-deg Alpine Peaks (r > 2400m)
          float snowMask = smoothstep(185.0, 290.0, wPos.y + macroA * 32.0) * smoothstep(0.28, 0.62, wNorm.y) * smoothstep(2400.0, 3400.0, rimDist);
          vec3 snowAlbedo = vec3(0.76, 0.81, 0.89);

          // 5) Crisp Lake Shoreline Rim
          vec3 shoreAlbedo = sampleDualAlbedo(uShoreMap, wPos.xz, 0.30, 0.08) * vec3(0.84, 0.80, 0.70);
          vec3 shoreNormT = sampleDualNormal(uShoreNormal, wPos.xz, 0.30, 0.08);
          float shoreMask = smoothstep(uWaterLevel + 0.30 + macroB * 0.12, uWaterLevel + 0.02, wPos.y);
          float wetBand = smoothstep(uWaterLevel + 0.22, uWaterLevel - 0.10, wPos.y);
          shoreAlbedo *= mix(1.0, 0.46, wetBand);

          vec3 albedo = mix(grassAlbedo, dirtTex, dirtWeight);
          albedo = mix(albedo, shoreAlbedo, shoreMask * (1.0 - rockMask * 0.65));
          albedo = mix(albedo, rockAlbedo, rockMask);
          albedo = mix(albedo, snowAlbedo, snowMask * 0.90);
          albedo *= (0.93 + 0.14 * microN);
          diffuseColor.rgb = albedo;

          float rVal = mix(0.89, 0.85, dirtWeight);
          rVal = mix(rVal, mix(0.76, 0.20, wetBand), shoreMask * (1.0 - rockMask * 0.65));
          rVal = mix(rVal, 0.78, rockMask);
          rVal = mix(rVal, 0.62, snowMask);
          tCustomRoughness = rVal;

          vec3 tangentW = normalize(vec3(1.0, 0.0, 0.0) - wNorm * wNorm.x);
          vec3 bitangentW = normalize(cross(wNorm, tangentW));
          vec3 planarNormT = normalize(mix(mix(grassNormT, dirtNormT, dirtWeight), shoreNormT, shoreMask * 0.8));
          vec3 planarPerturb = tangentW * planarNormT.x + bitangentW * planarNormT.y;

          tPerturbedWorldNorm = normalize(
            wNorm +
            planarPerturb * (1.0 - rockMask) * 0.86 +
            triNormOffset * (0.40 + rockMask * 1.10)
          );
        }
        `
      )
      .replace(
        '#include <roughnessmap_fragment>',
        `#include <roughnessmap_fragment>\nroughnessFactor = tCustomRoughness;`
      )
      .replace(
        '#include <normal_fragment_maps>',
        `#include <normal_fragment_maps>\nnormal = normalize(mat3(viewMatrix) * tPerturbedWorldNorm);`
      )
      .replace(
        '#include <lights_fragment_begin>',
        /* glsl */`
        #include <lights_fragment_begin>
        {
          float cShad = sampleCloudShadow(vAtmoWPos.xz, uTime, uSunDir);
          reflectedLight.directDiffuse *= cShad;
          reflectedLight.directSpecular *= cShad;
        }
        `
      )
      .replace(
        '#include <fog_fragment>',
        `gl_FragColor.rgb = applyRealisticAtmosphere(gl_FragColor.rgb, vAtmoWPos, cameraPosition);`
      );
  };

  if (assetManager) {
    assetManager.registerMaterial('terrainChunkPBR', mat);
  }

  const tmpNorm = new THREE.Vector3();

  /**
   * Builds a chunk BufferGeometry with analytic normals along borders + downward 16m
   * perimeter skirts so adjacent LOD0/LOD1/LOD2 chunks never expose T-junction cracks.
   */
  function buildChunkGeometry(cxIdx, czIdx, segs) {
    const startX = -WORLD_HALF + cxIdx * CHUNK_SIZE;
    const startZ = -WORLD_HALF + czIdx * CHUNK_SIZE;
    const step = CHUNK_SIZE / segs;
    const stride = segs + 1;
    const topCount = stride * stride;
    const skirtVerts = stride * 4;
    const totalVerts = topCount + skirtVerts;

    const pos = new Float32Array(totalVerts * 3);
    const norm = new Float32Array(totalVerts * 3);
    const uv = new Float32Array(totalVerts * 2);

    for (let iz = 0; iz <= segs; iz++) {
      const wz = startZ + iz * step;
      for (let ix = 0; ix <= segs; ix++) {
        const wx = startX + ix * step;
        const wy = getTerrainHeight(wx, wz);
        getTerrainNormal(wx, wz, tmpNorm);
        const vi = iz * stride + ix;
        pos[vi * 3] = wx;
        pos[vi * 3 + 1] = wy;
        pos[vi * 3 + 2] = wz;
        norm[vi * 3] = tmpNorm.x;
        norm[vi * 3 + 1] = tmpNorm.y;
        norm[vi * 3 + 2] = tmpNorm.z;
        uv[vi * 2] = wx / CHUNK_SIZE;
        uv[vi * 2 + 1] = wz / CHUNK_SIZE;
      }
    }

    const indices = [];
    for (let iz = 0; iz < segs; iz++) {
      for (let ix = 0; ix < segs; ix++) {
        const a = iz * stride + ix;
        const b = a + 1;
        const c = a + stride;
        const d = c + 1;
        indices.push(a, c, b, b, c, d);
      }
    }

    // Perimeter downward skirts along North (iz=0), South (iz=segs), West (ix=0), East (ix=segs)
    let skCursor = topCount;
    function addSkirt(edgeTopIndices, flipWinding) {
      const baseSk = skCursor;
      for (let k = 0; k < edgeTopIndices.length; k++) {
        const ti = edgeTopIndices[k];
        pos[skCursor * 3] = pos[ti * 3];
        pos[skCursor * 3 + 1] = pos[ti * 3 + 1] - SKIRT_DEPTH;
        pos[skCursor * 3 + 2] = pos[ti * 3 + 2];
        norm[skCursor * 3] = norm[ti * 3];
        norm[skCursor * 3 + 1] = norm[ti * 3 + 1];
        norm[skCursor * 3 + 2] = norm[ti * 3 + 2];
        uv[skCursor * 2] = uv[ti * 2];
        uv[skCursor * 2 + 1] = uv[ti * 2 + 1];
        skCursor++;
      }
      for (let k = 0; k < edgeTopIndices.length - 1; k++) {
        const t0 = edgeTopIndices[k];
        const t1 = edgeTopIndices[k + 1];
        const s0 = baseSk + k;
        const s1 = baseSk + k + 1;
        if (flipWinding) {
          indices.push(t0, t1, s0, t1, s1, s0);
        } else {
          indices.push(t0, s0, t1, t1, s0, s1);
        }
      }
    }

    const north = [];
    const south = [];
    const west = [];
    const east = [];
    for (let k = 0; k <= segs; k++) {
      north.push(k);
      south.push(segs * stride + k);
      west.push(k * stride);
      east.push(k * stride + segs);
    }
    addSkirt(north, true);
    addSkirt(south, false);
    addSkirt(west, false);
    addSkirt(east, true);

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(norm, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    geo.setIndex(indices);
    geo.computeBoundingSphere();
    return geo;
  }

  // LRU Geometry Cache (never evicts currently active chunk geometry!)
  const geoCache = new Map();
  let useTick = 0;

  function acquireChunkGeo(chunk, lod) {
    const key = `${chunk.cxIdx}_${chunk.czIdx}_${lod}`;
    useTick++;
    let entry = geoCache.get(key);
    if (!entry) {
      if (geoCache.size >= MAX_CACHE) {
        let oldestKey = null;
        let oldestTick = Infinity;
        geoCache.forEach((v, k) => {
          if (!v.pinned && v.lastUsed < oldestTick) {
            oldestTick = v.lastUsed;
            oldestKey = k;
          }
        });
        if (oldestKey) {
          const dead = geoCache.get(oldestKey);
          dead.geo.dispose();
          geoCache.delete(oldestKey);
        }
      }
      entry = {
        geo: buildChunkGeometry(chunk.cxIdx, chunk.czIdx, LOD_SEGS[lod]),
        lastUsed: useTick,
        pinned: false
      };
      geoCache.set(key, entry);
    }
    entry.lastUsed = useTick;
    return entry;
  }

  function applyChunkLod(chunk, lod) {
    if (chunk.activeEntry) chunk.activeEntry.pinned = false;
    const entry = acquireChunkGeo(chunk, lod);
    entry.pinned = true;
    chunk.activeEntry = entry;
    chunk.lod = lod;
    chunk.mesh.geometry = entry.geo;
    chunk.mesh.castShadow = lod === 0;
  }

  const chunks = [];
  for (let czIdx = 0; czIdx < GRID_N; czIdx++) {
    for (let cxIdx = 0; cxIdx < GRID_N; cxIdx++) {
      const centerX = -WORLD_HALF + (cxIdx + 0.5) * CHUNK_SIZE;
      const centerZ = -WORLD_HALF + (czIdx + 0.5) * CHUNK_SIZE;
      const dummyGeo = new THREE.BufferGeometry();
      const mesh = new THREE.Mesh(dummyGeo, mat);
      mesh.receiveShadow = true;
      mesh.castShadow = false;
      root.add(mesh);
      dummyGeo.dispose();

      const chunk = {
        cxIdx,
        czIdx,
        centerX,
        centerZ,
        lod: -1,
        activeEntry: null,
        mesh
      };
      const dSpawn = Math.hypot(centerX, centerZ);
      const dCity = Math.hypot(centerX + 560, centerZ + 680);
      const initLod = (dSpawn < 1100 || dCity < 1000) ? 0 : (dSpawn < 2450 ? 1 : 2);
      applyChunkLod(chunk, initLod);
      chunks.push(chunk);
    }
  }

  // Dedicated high-resolution Overlook Promontory Cap (240m x 240m @ 3.75m segs) for razor-sharp foreground cliffs!
  {
    const capGeo = new THREE.PlaneGeometry(240, 240, 64, 64);
    capGeo.rotateX(-Math.PI / 2);
    const cp = capGeo.attributes.position;
    const cn = capGeo.attributes.normal;
    for (let i = 0; i < cp.count; i++) {
      const lx = cp.getX(i);
      const lz = cp.getZ(i) - 45.0;
      const edgeFade = Math.max(Math.abs(lx), Math.abs(cp.getZ(i))) / 120.0;
      const drop = edgeFade > 0.92 ? ((edgeFade - 0.92) / 0.08) * 3.5 : 0.0;
      const gy = getTerrainHeight(lx, lz) - drop + 0.04;
      getTerrainNormal(lx, lz, tmpNorm);
      cp.setXYZ(i, lx, gy, lz);
      cn.setXYZ(i, tmpNorm.x, tmpNorm.y, tmpNorm.z);
    }
    const capMat = mat.clone();
    capMat.onBeforeCompile = mat.onBeforeCompile;
    capMat.customProgramCacheKey = () => 'botw_terrain_hero_cap';
    capMat.polygonOffset = true;
    capMat.polygonOffsetFactor = -1;
    capMat.polygonOffsetUnits = -1;
    const capMesh = new THREE.Mesh(capGeo, capMat);
    capMesh.receiveShadow = true;
    capMesh.castShadow = true;
    root.add(capMesh);
  }

  const lastCam = new THREE.Vector3(1e9, 1e9, 1e9);

  function update(camera, force = false) {
    if (!force && camera.position.distanceToSquared(lastCam) < 400.0) {
      let anyPending = false;
      for (let i = 0; i < chunks.length; i++) {
        if (chunks[i].pending) {
          anyPending = true;
          break;
        }
      }
      if (!anyPending) return;
    } else {
      lastCam.copy(camera.position);
    }

    const camX = camera.position.x;
    const camZ = camera.position.z;
    const queue = [];

    for (let i = 0; i < chunks.length; i++) {
      const c = chunks[i];
      const d = Math.hypot(c.centerX - camX, c.centerZ - camZ);
      const desiredLod = d < 960.0 ? 0 : d < 2450.0 ? 1 : 2;
      if (desiredLod !== c.lod) {
        c.pending = true;
        queue.push({ chunk: c, desiredLod, dist: d });
      } else {
        c.pending = false;
      }
    }

    if (queue.length > 0) {
      queue.sort((a, b) => a.dist - b.dist);
      const budget = force ? queue.length : 4;
      for (let i = 0; i < Math.min(budget, queue.length); i++) {
        const item = queue[i];
        applyChunkLod(item.chunk, item.desiredLod);
        item.chunk.pending = false;
      }
    }
  }

  function getStats() {
    let lod0 = 0, lod1 = 0, lod2 = 0;
    for (let i = 0; i < chunks.length; i++) {
      if (chunks[i].lod === 0) lod0++;
      else if (chunks[i].lod === 1) lod1++;
      else lod2++;
    }
    return {
      totalChunks: chunks.length,
      lod0,
      lod1,
      lod2,
      worldMeters: WORLD_HALF * 2
    };
  }

  return { root, update, getStats };
}

// ==================== water.js ====================
function createWaterSystem(texLib, assetManager, lodManager) {
  const group = new THREE.Group();

  const waterW = 3100;
  const waterD = 3000;
  const centerX = 960;
  const centerZ = -1460;

  const waterGeo = new THREE.PlaneGeometry(waterW, waterD, 200, 200);
  waterGeo.rotateX(-Math.PI / 2);

  const pos = waterGeo.attributes.position;
  const depths = new Float32Array(pos.count);
  for (let i = 0; i < pos.count; i++) {
    const wx = pos.getX(i) + centerX;
    const wz = pos.getZ(i) + centerZ;
    const terrainY = getTerrainHeight(wx, wz);
    depths[i] = WATER_LEVEL - terrainY;
  }
  waterGeo.setAttribute('aDepth', new THREE.BufferAttribute(depths, 1));

  const waterMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    fog: false,
    uniforms: {
      uTime: ATMO_UNIFORMS.uTime,
      uSunDir: ATMO_UNIFORMS.uSunDir,
      uBSunDir: ATMO_UNIFORMS.uBSunDir,
      uSunColor: ATMO_UNIFORMS.uSunColor,
      uHazeCool: ATMO_UNIFORMS.uHazeCool,
      uHazeWarm: ATMO_UNIFORMS.uHazeWarm,
      uMistColor: ATMO_UNIFORMS.uMistColor,
      uFogDensity: ATMO_UNIFORMS.uFogDensity,
      uCloudCoverage: ATMO_UNIFORMS.uCloudCoverage,
      uCloudShadowStrength: ATMO_UNIFORMS.uCloudShadowStrength,
      uNightFactor: ATMO_UNIFORMS.uNightFactor,
      uBAerialColor: ATMO_UNIFORMS.uBAerialColor,
      uBAerialSunColor: ATMO_UNIFORMS.uBAerialSunColor,
      uBAerialSunColor2: ATMO_UNIFORMS.uBAerialSunColor2,
      uBAerialDensity: ATMO_UNIFORMS.uBAerialDensity,
      uBAerialFalloff: ATMO_UNIFORMS.uBAerialFalloff,
      uBAerialHigh: ATMO_UNIFORMS.uBAerialHigh,
      uBAerialLobe: ATMO_UNIFORMS.uBAerialLobe,
      uBAerialFar: ATMO_UNIFORMS.uBAerialFar,
      uBAerialFlat: ATMO_UNIFORMS.uBAerialFlat,
      uBAerialCore: ATMO_UNIFORMS.uBAerialCore,
      uNormalA: { value: texLib.waterNormalA },
      uNormalB: { value: texLib.waterNormalB }
    },
    vertexShader: /* glsl */`
      attribute float aDepth;
      uniform float uTime;
      varying vec3 vWorldPos;
      varying float vDepth;
      void main() {
        vDepth = aDepth;
        vec3 p = position;
        // Subtle wind wave amplitude damped near shallow shoreline
        float waveMask = smoothstep(0.0, 1.4, aDepth);
        p.y += (sin(p.x * 0.19 + uTime * 1.65) * 0.055 + cos(p.z * 0.23 - uTime * 1.25) * 0.045) * waveMask;
        vec4 wp = modelMatrix * vec4(p, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */`
      uniform sampler2D uNormalA;
      uniform sampler2D uNormalB;
      varying vec3 vWorldPos;
      varying float vDepth;
      ${ATMO_GLSL_PARS}

      void main() {
        if (vDepth <= 0.005) discard;

        vec3 vDir = normalize(cameraPosition - vWorldPos);
        float camDist = length(cameraPosition - vWorldPos);
        mat2 rotA = mat2(0.80, 0.60, -0.60, 0.80);
        mat2 rotB = mat2(0.50, -0.866, 0.866, 0.50);
        vec2 uvA = (rotA * vWorldPos.xz) * 0.017 + vec2(uTime * 0.016, uTime * 0.010);
        vec2 uvB = (rotB * vWorldPos.xz) * 0.039 + vec2(-uTime * 0.014, uTime * 0.019);
        vec2 uvC = vWorldPos.xz * 0.097 + vec2(uTime * 0.023, -uTime * 0.018);

        vec3 nA = texture2D(uNormalA, uvA).xyz * 2.0 - 1.0;
        vec3 nB = texture2D(uNormalB, uvB).xyz * 2.0 - 1.0;
        vec3 nC = texture2D(uNormalA, uvC).xyz * 2.0 - 1.0;

        float distRippleAtten = mix(1.0, 0.22, smoothstep(80.0, 900.0, camDist));
        float rippleScale = mix(0.20, 0.34, smoothstep(0.0, 2.2, vDepth)) * distRippleAtten;
        vec3 n = normalize(vec3(
          (nA.x + nB.x * 0.82 + nC.x * 0.20 * distRippleAtten) * rippleScale,
          1.0,
          (nA.y + nB.y * 0.82 + nC.y * 0.20 * distRippleAtten) * rippleScale
        ));

        // Beer-Lambert optical water depth absorption (deep sapphire/cerulean inland lake)
        float shallow = exp(-vDepth * 0.60);
        vec3 shallowTint = vec3(0.035, 0.18, 0.20);
        vec3 midTint = vec3(0.014, 0.095, 0.165);
        vec3 deepTint = vec3(0.008, 0.040, 0.105);
        vec3 waterBody = mix(deepTint, midTint, exp(-vDepth * 0.24));
        waterBody = mix(waterBody, shallowTint, shallow);
        waterBody *= mix(1.0, 0.52, uNightFactor);

        // Sky reflection synchronized with calibrated day/night sky & Babylon haze
        vec3 reflDir = reflect(-vDir, n);
        vec3 skyHaze = mix(bblHazeColor(reflDir), vec3(0.06, 0.16, 0.32), 0.32 * (1.0 - uNightFactor));
        vec3 skyZen = mix(vec3(0.08, 0.21, 0.42), vec3(0.014, 0.032, 0.088), uNightFactor);
        vec3 skyRefl = mix(skyHaze, skyZen, smoothstep(0.0, 0.30, max(reflDir.y, 0.04)));
        float cosTheta = clamp(dot(n, vDir), 0.0, 1.0);
        float fresnel = 0.025 + 0.975 * pow(1.0 - cosTheta, 5.0);

        float cloudShad = sampleCloudShadow(vWorldPos.xz, uTime, uSunDir);
        vec3 col = mix(waterBody * (0.45 + 0.55 * cloudShad), skyRefl, clamp(fresnel * 0.72, 0.10, 0.56));

        // Sun glitter crossfading to lunar shimmer across twilight
        vec3 halfV = normalize(uSunDir + vDir);
        float specTight = pow(max(dot(n, halfV), 0.0), 320.0);
        float specBroad = pow(max(dot(n, halfV), 0.0), 38.0);
        float dayGlint = 1.0 - smoothstep(0.10, 0.55, uNightFactor);
        col += uSunColor * (specTight * 1.85 + specBroad * 0.14) * cloudShad * dayGlint;

        vec3 moonDir = normalize(vec3(0.538, 0.707, 0.459));
        vec3 moonHalf = normalize(moonDir + vDir);
        float moonSpec = pow(max(dot(n, moonHalf), 0.0), 180.0) * 0.42 + pow(max(dot(n, moonHalf), 0.0), 26.0) * 0.06;
        col += vec3(0.58, 0.74, 0.96) * moonSpec * smoothstep(0.35, 0.90, uNightFactor);

        // Organic pulsing shoreline foam
        float foamNoise = atmoFbm(vWorldPos.xz * 0.42 + vec2(uTime * 0.18, -uTime * 0.12));
        float waveEdge = 0.28 + 0.12 * sin(uTime * 1.9 + vWorldPos.x * 0.35 + vWorldPos.z * 0.3);
        float foamBand = smoothstep(waveEdge, 0.03, vDepth) * smoothstep(0.42, 0.74, foamNoise + (0.20 - vDepth) * 0.75);
        vec3 foamCol = mix(vec3(0.42, 0.48, 0.52), uSunColor * 0.65, 0.32 * dayGlint) * mix(1.0, 0.35, uNightFactor);
        col = mix(col, foamCol, clamp(foamBand * 0.72, 0.0, 0.75));

        col = bblAerial(col, vWorldPos);

        float alpha = smoothstep(0.005, 0.35, vDepth) * mix(0.76, 0.96, clamp(1.0 - shallow + fresnel, 0.0, 1.0));
        alpha = max(alpha, foamBand * 0.78);
        gl_FragColor = vec4(col, clamp(alpha, 0.0, 0.97));
      }
    `
  });

  const waterMesh = new THREE.Mesh(waterGeo, waterMat);
  waterMesh.position.set(centerX, WATER_LEVEL, centerZ);
  group.add(waterMesh);

  // Shoreline cattails / marsh reeds via LODInstancedBatch
  const reedGeo = createReedClusterGeo();
  const reedMat = new THREE.MeshStandardMaterial({
    color: 0x627332,
    roughness: 0.78,
    side: THREE.DoubleSide
  });
  enhancePBRMaterial(reedMat, {
    cacheKey: 'botw_reed_pbr',
    isFoliage: true,
    windStrength: 0.09,
    subsurfaceStrength: 0.3
  });

  const dummy = new THREE.Object3D();
  const norm = new THREE.Vector3();
  const reedInsts = [];

  for (let i = 0; i < 3200 && reedInsts.length < 340; i++) {
    const rx = -125.0 + hash2(i, 701) * 2150.0;
    const rz = -2550.0 + hash2(i, 709) * 2380.0;
    const ry = getTerrainHeight(rx, rz);
    if (ry < WATER_LEVEL - 0.55 || ry > WATER_LEVEL + 0.55) continue;
    getTerrainNormal(rx, rz, norm);
    if (norm.y < 0.85) continue;

    const s = 0.75 + hash2(i, 719) * 0.7;
    dummy.position.set(rx, ry - 0.05, rz);
    dummy.rotation.set(0, hash2(i, 727) * Math.PI * 2, 0);
    dummy.scale.set(s, s * (0.85 + hash2(i, 733) * 0.45), s);
    dummy.updateMatrix();
    reedInsts.push({ x: rx, y: ry, z: rz, matrix: dummy.matrix.clone() });
  }

  if (assetManager && lodManager && reedInsts.length > 0) {
    assetManager.registerPrefab('shore_reeds', {
      lods: [{ geo: reedGeo, mat: reedMat, dist: 145, castShadow: false, maxVisible: 260 }]
    });
    const reedBatch = createLODInstancedBatch(assetManager, 'shore_reeds', reedInsts, { cellSize: 110, maxDist: 145 });
    group.add(reedBatch.group);
    lodManager.addBatch(reedBatch);
  }

  // Shimmering Distant Waterfall Cascade plunging down eastern bay cliffs
  const wfGeo = new THREE.PlaneGeometry(36.0, 56.0, 10, 22);
  const wfPos = wfGeo.attributes.position;
  for (let i = 0; i < wfPos.count; i++) {
    const x = wfPos.getX(i);
    const y = wfPos.getY(i);
    const t = 1.0 - (y + 13.0) / 26.0;
    const zCurve = Math.sin(t * Math.PI * 0.52) * 6.5;
    const spread = 1.0 + t * 0.32;
    wfPos.setXYZ(i, x * spread, y, zCurve);
  }
  wfGeo.computeVertexNormals();

  const wfMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    fog: false,
    uniforms: {
      uTime: ATMO_UNIFORMS.uTime,
      uSunDir: ATMO_UNIFORMS.uSunDir,
      uBSunDir: ATMO_UNIFORMS.uBSunDir,
      uSunColor: ATMO_UNIFORMS.uSunColor,
      uHazeCool: ATMO_UNIFORMS.uHazeCool,
      uHazeWarm: ATMO_UNIFORMS.uHazeWarm,
      uMistColor: ATMO_UNIFORMS.uMistColor,
      uFogDensity: ATMO_UNIFORMS.uFogDensity,
      uCloudCoverage: ATMO_UNIFORMS.uCloudCoverage,
      uCloudShadowStrength: ATMO_UNIFORMS.uCloudShadowStrength,
      uNightFactor: ATMO_UNIFORMS.uNightFactor,
      uBAerialColor: ATMO_UNIFORMS.uBAerialColor,
      uBAerialSunColor: ATMO_UNIFORMS.uBAerialSunColor,
      uBAerialSunColor2: ATMO_UNIFORMS.uBAerialSunColor2,
      uBAerialDensity: ATMO_UNIFORMS.uBAerialDensity,
      uBAerialFalloff: ATMO_UNIFORMS.uBAerialFalloff,
      uBAerialHigh: ATMO_UNIFORMS.uBAerialHigh,
      uBAerialLobe: ATMO_UNIFORMS.uBAerialLobe,
      uBAerialFar: ATMO_UNIFORMS.uBAerialFar,
      uBAerialFlat: ATMO_UNIFORMS.uBAerialFlat,
      uBAerialCore: ATMO_UNIFORMS.uBAerialCore
    },
    vertexShader: /* glsl */`
      varying vec2 vUv;
      varying vec3 vWorldPos;
      void main() {
        vUv = uv;
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */`
      varying vec2 vUv;
      varying vec3 vWorldPos;
      ${ATMO_GLSL_PARS}
      void main() {
        vec2 fUv = vec2(vUv.x * 5.5, vUv.y * 3.0 + uTime * 1.45);
        float n1 = atmoFbm(fUv);
        float n2 = atmoFbm(fUv * 2.3 + vec2(0.0, uTime * 1.1));
        float streaks = smoothstep(0.32, 0.72, n1 * 0.6 + n2 * 0.4);
        float edgeMask = smoothstep(0.0, 0.22, vUv.x) * smoothstep(1.0, 0.78, vUv.x);
        float bottomSplash = smoothstep(0.28, 0.0, vUv.y);
        float alpha = clamp((streaks * 0.75 + bottomSplash * 0.45 + 0.18) * edgeMask, 0.0, 0.88);
        vec3 baseWater = mix(vec3(0.18, 0.34, 0.38), vec3(0.75, 0.85, 0.90), streaks * 0.8 + bottomSplash * 0.5);
        vec3 lit = baseWater * mix(vec3(0.45, 0.55, 0.70), uSunColor * 1.05, 0.65 * (1.0 - uNightFactor * 0.75));
        lit = applyRealisticAtmosphere(lit, vWorldPos, cameraPosition);
        gl_FragColor = vec4(lit, alpha);
      }
    `
  });

  const wfMesh = new THREE.Mesh(wfGeo, wfMat);
  wfMesh.position.set(1985, WATER_LEVEL + 24.0, -1155);
  wfMesh.rotation.y = -0.78; // facing southwest toward the overlook camera
  group.add(wfMesh);

  // Waterfall plunge mist cloud at splash pool base
  const splashMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    fog: false,
    uniforms: {
      uTime: ATMO_UNIFORMS.uTime,
      uSunDir: ATMO_UNIFORMS.uSunDir,
      uBSunDir: ATMO_UNIFORMS.uBSunDir,
      uSunColor: ATMO_UNIFORMS.uSunColor,
      uHazeCool: ATMO_UNIFORMS.uHazeCool,
      uHazeWarm: ATMO_UNIFORMS.uHazeWarm,
      uMistColor: ATMO_UNIFORMS.uMistColor,
      uFogDensity: ATMO_UNIFORMS.uFogDensity,
      uCloudCoverage: ATMO_UNIFORMS.uCloudCoverage,
      uCloudShadowStrength: ATMO_UNIFORMS.uCloudShadowStrength,
      uNightFactor: ATMO_UNIFORMS.uNightFactor,
      uBAerialColor: ATMO_UNIFORMS.uBAerialColor,
      uBAerialSunColor: ATMO_UNIFORMS.uBAerialSunColor,
      uBAerialSunColor2: ATMO_UNIFORMS.uBAerialSunColor2,
      uBAerialDensity: ATMO_UNIFORMS.uBAerialDensity,
      uBAerialFalloff: ATMO_UNIFORMS.uBAerialFalloff,
      uBAerialHigh: ATMO_UNIFORMS.uBAerialHigh,
      uBAerialLobe: ATMO_UNIFORMS.uBAerialLobe,
      uBAerialFar: ATMO_UNIFORMS.uBAerialFar,
      uBAerialFlat: ATMO_UNIFORMS.uBAerialFlat,
      uBAerialCore: ATMO_UNIFORMS.uBAerialCore
    },
    vertexShader: `varying vec2 vUv; varying vec3 vWorldPos; void main(){ vUv = uv; vec4 wp = modelMatrix * vec4(position,1.0); vWorldPos = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }`,
    fragmentShader: /* glsl */`
      varying vec2 vUv; varying vec3 vWorldPos;
      ${ATMO_GLSL_PARS}
      void main() {
        vec2 c = vUv * 2.0 - 1.0;
        float r = 1.0 - dot(c, c);
        if (r <= 0.0) discard;
        float n = atmoFbm(vUv * 4.5 + vec2(0.0, -uTime * 0.45));
        float a = pow(r, 1.7) * smoothstep(0.28, 0.75, n) * 0.55;
        vec3 col = mix(uMistColor, uSunColor * 0.9, 0.4 * (1.0 - uNightFactor));
        col = applyRealisticAtmosphere(col, vWorldPos, cameraPosition);
        gl_FragColor = vec4(col, a);
      }
    `
  });
  const splashMesh = new THREE.Mesh(new THREE.PlaneGeometry(58, 28), splashMat);
  splashMesh.position.set(1972, WATER_LEVEL + 4.5, -1145);
  splashMesh.rotation.y = -0.78;
  group.add(splashMesh);

  return group;
}

function createReedClusterGeo() {
  const positions = [];
  const normals = [];
  const blades = 7;
  for (let b = 0; b < blades; b++) {
    const a = (b / blades) * Math.PI * 2 + (b % 2) * 0.3;
    const lean = 0.18 + (b % 3) * 0.08;
    const h = 1.25 + (b % 3) * 0.35;
    const w = 0.045;
    const dx = Math.cos(a);
    const dz = Math.sin(a);
    const px = -dz * w;
    const pz = dx * w;

    const x0 = dx * 0.12;
    const z0 = dz * 0.12;
    const xt = x0 + dx * lean;
    const zt = z0 + dz * lean;

    // Tapered quad strip (2 triangles)
    positions.push(
      x0 - px, 0, z0 - pz,
      x0 + px, 0, z0 + pz,
      xt, h, zt
    );
    for (let k = 0; k < 3; k++) normals.push(dx * 0.3, 0.9, dz * 0.3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  return geo;
}

// ==================== foliage.js ====================
function createCurvedCard(width, height, bend = 0.18) {
  const geo = new THREE.PlaneGeometry(width, height, 2, 2);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i);
    const nx = x / (width * 0.5);
    const ny = y / (height * 0.5);
    pos.setZ(i, -(nx * nx + ny * ny) * bend);
  }
  geo.computeVertexNormals();
  return geo;
}

/** Crossed 4-triangle vertical billboard sprite geometry for LOD2 distant trees. */
function createTreeImpostorGeometry(w = 6.2, h = 8.4) {
  const g1 = new THREE.PlaneGeometry(w, h);
  g1.translate(0, h * 0.48, 0);
  const g2 = g1.clone();
  g2.rotateY(Math.PI * 0.5);
  return mergeGeometries([g1, g2]);
}

function createCrossedCanopyGeo(cards, w, h, centerY) {
  const parts = [];
  for (let i = 0; i < cards; i++) {
    const c = new THREE.PlaneGeometry(w, h);
    c.rotateY((i / cards) * Math.PI);
    c.rotateX((i % 2 === 0 ? 1 : -1) * 0.18);
    c.translate(0, centerY, 0);
    const ni = c.index ? c.toNonIndexed() : c;
    const cols = new Float32Array(ni.attributes.position.count * 3).fill(0.92);
    ni.setAttribute('color', new THREE.BufferAttribute(cols, 3));
    parts.push(ni);
  }
  return mergeGeometries(parts);
}

// =========================================================================
// 1. MULTI-LOD TREE SPECIES GEOMETRY BUILDERS
// =========================================================================
function createOakLODGeos() {
  const trunkParts = [];
  const mainTrunk = new THREE.CylinderGeometry(0.24, 0.56, 4.4, 8, 4);
  mainTrunk.translate(0, 2.2, 0);
  const mp = mainTrunk.attributes.position;
  for (let i = 0; i < mp.count; i++) {
    const y = mp.getY(i);
    const rootFlare = Math.exp(-y * 1.4) * 0.25;
    const x = mp.getX(i);
    const z = mp.getZ(i);
    const ang = Math.atan2(z, x);
    const flare = 1.0 + rootFlare * (1.0 + 0.5 * Math.cos(ang * 4.0));
    mp.setXYZ(i, x * flare + Math.sin(y * 0.55) * 0.18, y, z * flare + Math.cos(y * 0.4) * 0.1);
  }
  mainTrunk.computeVertexNormals();
  trunkParts.push(mainTrunk);

  const boughSpecs = [
    { rx: 0.52, ry: 0.3, rz: 0.45, len: 2.6, y: 3.4 },
    { rx: -0.48, ry: 1.9, rz: -0.42, len: 2.5, y: 3.6 },
    { rx: 0.35, ry: 3.4, rz: -0.52, len: 2.4, y: 3.5 },
    { rx: -0.42, ry: 5.0, rz: 0.48, len: 2.5, y: 3.7 }
  ];
  boughSpecs.forEach((b) => {
    const g = new THREE.CylinderGeometry(0.08, 0.20, b.len, 6, 2);
    g.translate(0, b.len * 0.5, 0);
    g.rotateX(b.rx);
    g.rotateZ(b.rz);
    g.rotateY(b.ry);
    g.translate(0, b.y, 0);
    trunkParts.push(g);
  });
  const trunkLod0 = mergeGeometries(trunkParts);

  const trunkLod1 = new THREE.CylinderGeometry(0.20, 0.46, 4.4, 5, 1);
  trunkLod1.translate(0, 2.2, 0);

  const cardParts = [];
  const crownCenter = new THREE.Vector3(0, 5.4, 0);
  const tmpN = new THREE.Vector3();
  for (let i = 0; i < 24; i++) {
    const golden = i * 2.3999632;
    const t = i / 24;
    const shell = i < 7 ? 0.58 : 1.0;
    const rad = (1.35 + (i % 4) * 0.38) * shell;
    const heightOff = (t - 0.35) * 2.6;
    const cx = Math.cos(golden) * rad;
    const cz = Math.sin(golden) * rad;
    const cy = 5.2 + heightOff + (1.0 - Math.abs(t - 0.5)) * 0.7;
    const cardW = 2.4 + (i % 3) * 0.35;
    const card = createCurvedCard(cardW, cardW, 0.24);
    card.rotateX((hash2(i, 11) - 0.5) * 1.45);
    card.rotateY(golden + hash2(i, 13) * 1.2);
    card.rotateZ((hash2(i, 17) - 0.5) * 1.3);
    card.translate(cx, cy, cz);

    const ni = card.index ? card.toNonIndexed() : card;
    const p = ni.attributes.position;
    const n = ni.attributes.normal;
    const colors = new Float32Array(p.count * 3);
    for (let k = 0; k < p.count; k++) {
      const vx = p.getX(k), vy = p.getY(k), vz = p.getZ(k);
      tmpN.set(vx - crownCenter.x, (vy - crownCenter.y) * 1.15, vz - crownCenter.z).normalize();
      n.setXYZ(k, n.getX(k) * 0.3 + tmpN.x * 0.7, n.getY(k) * 0.3 + tmpN.y * 0.7, n.getZ(k) * 0.3 + tmpN.z * 0.7);
      const distOut = Math.hypot(vx - crownCenter.x, vy - crownCenter.y, vz - crownCenter.z);
      const ao = THREE.MathUtils.clamp(0.45 + (distOut / 2.8) * 0.52 + (vy - 4.0) * 0.08, 0.38, 1.05);
      colors[k * 3] = colors[k * 3 + 1] = colors[k * 3 + 2] = ao;
    }
    ni.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    cardParts.push(ni);
  }
  const canopyLod0 = mergeGeometries(cardParts);
  const canopyLod1 = createCrossedCanopyGeo(4, 4.6, 4.2, 5.2);
  const impostorLod2 = createTreeImpostorGeometry(6.2, 8.2);

  return { trunkLod0, trunkLod1, canopyLod0, canopyLod1, impostorLod2 };
}

function createPineLODGeos() {
  const trunk = new THREE.CylinderGeometry(0.10, 0.42, 7.6, 7, 3);
  trunk.translate(0, 3.8, 0);
  const trunkLod0 = trunk.index ? trunk.toNonIndexed() : trunk;
  const trunkLod1 = new THREE.CylinderGeometry(0.10, 0.38, 7.4, 5, 1);
  trunkLod1.translate(0, 3.7, 0);

  const cardParts = [];
  const tiers = [
    { y: 2.0, r: 2.35, count: 6, pitch: 0.44 },
    { y: 3.0, r: 2.05, count: 6, pitch: 0.42 },
    { y: 4.0, r: 1.72, count: 5, pitch: 0.38 },
    { y: 5.0, r: 1.38, count: 5, pitch: 0.35 },
    { y: 6.0, r: 1.02, count: 4, pitch: 0.30 },
    { y: 6.9, r: 0.72, count: 3, pitch: 0.26 }
  ];

  tiers.forEach((tier, ti) => {
    for (let j = 0; j < tier.count; j++) {
      const ang = (j / tier.count) * Math.PI * 2 + ti * 0.75;
      const card = createCurvedCard(tier.r * 1.45, tier.r * 1.35, 0.16);
      card.translate(0, tier.r * 0.42, 0);
      card.rotateX(-Math.PI * 0.5 + tier.pitch);
      card.rotateY(ang);
      card.translate(0, tier.y, 0);

      const ni = card.index ? card.toNonIndexed() : card;
      const p = ni.attributes.position;
      const colors = new Float32Array(p.count * 3);
      for (let k = 0; k < p.count; k++) {
        const rad = Math.hypot(p.getX(k), p.getZ(k));
        const ao = THREE.MathUtils.clamp(0.45 + (rad / (tier.r * 1.2)) * 0.48 + (ti / 5) * 0.14, 0.40, 1.05);
        colors[k * 3] = colors[k * 3 + 1] = colors[k * 3 + 2] = ao;
      }
      ni.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      cardParts.push(ni);
    }
  });

  for (let s = 0; s < 2; s++) {
    const topCard = createCurvedCard(1.0, 1.5, 0.08);
    topCard.rotateY(s * Math.PI * 0.5);
    topCard.translate(0, 7.6, 0);
    const ni = topCard.index ? topCard.toNonIndexed() : topCard;
    ni.setAttribute('color', new THREE.BufferAttribute(new Float32Array(ni.attributes.position.count * 3).fill(1.0), 3));
    cardParts.push(ni);
  }

  const canopyLod0 = mergeGeometries(cardParts);
  const canopyLod1 = createCrossedCanopyGeo(3, 3.8, 5.8, 4.6);
  const impostorLod2 = createTreeImpostorGeometry(5.6, 8.8);

  return { trunkLod0, trunkLod1, canopyLod0, canopyLod1, impostorLod2 };
}

function createBirchLODGeos() {
  const trunkParts = [];
  const main = new THREE.CylinderGeometry(0.14, 0.28, 5.4, 7, 4);
  main.translate(0, 2.7, 0);
  const mp = main.attributes.position;
  for (let i = 0; i < mp.count; i++) {
    const y = mp.getY(i);
    mp.setX(i, mp.getX(i) + Math.sin(y * 0.5) * 0.22);
  }
  main.computeVertexNormals();
  trunkParts.push(main);

  const fork = new THREE.CylinderGeometry(0.07, 0.13, 2.6, 6, 2);
  fork.translate(0, 1.3, 0);
  fork.rotateZ(-0.42);
  fork.translate(0.15, 3.2, 0.05);
  trunkParts.push(fork);
  const trunkLod0 = mergeGeometries(trunkParts);
  const trunkLod1 = new THREE.CylinderGeometry(0.13, 0.25, 5.3, 5, 1);
  trunkLod1.translate(0, 2.65, 0);

  const cardParts = [];
  for (let i = 0; i < 18; i++) {
    const a = i * 2.39996;
    const t = i / 18;
    const r = 0.8 + (i % 3) * 0.42;
    const card = createCurvedCard(1.95, 1.95, 0.18);
    card.rotateX((hash2(i, 31) - 0.5) * 1.4);
    card.rotateY(a);
    card.rotateZ((hash2(i, 37) - 0.5) * 1.2);
    card.translate(Math.cos(a) * r + 0.12, 4.3 + t * 2.5, Math.sin(a) * r);
    const ni = card.index ? card.toNonIndexed() : card;
    const p = ni.attributes.position;
    const colors = new Float32Array(p.count * 3);
    for (let k = 0; k < p.count; k++) {
      const ao = THREE.MathUtils.clamp(0.58 + t * 0.42, 0.5, 1.02);
      colors[k * 3] = colors[k * 3 + 1] = colors[k * 3 + 2] = ao;
    }
    ni.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    cardParts.push(ni);
  }
  const canopyLod0 = mergeGeometries(cardParts);
  const canopyLod1 = createCrossedCanopyGeo(3, 3.6, 3.8, 5.4);
  const impostorLod2 = createTreeImpostorGeometry(5.2, 7.6);

  return { trunkLod0, trunkLod1, canopyLod0, canopyLod1, impostorLod2 };
}

function createPalmLODGeos() {
  const trunkLod0 = new THREE.CylinderGeometry(0.15, 0.27, 7.8, 7, 6);
  trunkLod0.translate(0, 3.9, 0);
  const p0 = trunkLod0.attributes.position;
  for (let i = 0; i < p0.count; i++) {
    const y = p0.getY(i);
    const bend = Math.pow(Math.max(0.0, y / 7.8), 1.7) * 0.72;
    p0.setX(i, p0.getX(i) + bend);
  }
  trunkLod0.computeVertexNormals();

  const trunkLod1 = new THREE.CylinderGeometry(0.14, 0.25, 7.8, 5, 1);
  trunkLod1.translate(0, 3.9, 0);

  const fronds = [];
  for (let f = 0; f < 8; f++) {
    const a = (f / 8) * Math.PI * 2;
    const card = createCurvedCard(1.65, 3.4, -0.45);
    card.translate(0, 1.55, 0);
    card.rotateX(-1.12 - (f % 2) * 0.16);
    card.rotateY(a);
    card.translate(0.72, 7.65, 0);
    const ni = card.index ? card.toNonIndexed() : card;
    const cols = new Float32Array(ni.attributes.position.count * 3).fill(1.0);
    ni.setAttribute('color', new THREE.BufferAttribute(cols, 3));
    fronds.push(ni);
  }
  const canopyLod0 = mergeGeometries(fronds);
  const canopyLod1 = createCrossedCanopyGeo(3, 4.4, 2.2, 7.8);
  const impostorLod2 = createTreeImpostorGeometry(5.4, 9.2);

  return { trunkLod0, trunkLod1, canopyLod0, canopyLod1, impostorLod2 };
}

// =========================================================================
// 2. TEXTURE-SIMPLIFIED GRASS & GROUNDCOVER CLUSTER GEOMETRIES
// =========================================================================
function createTexturedGrassGeometry(crossed = true, w = 1.02, h = 0.76) {
  const q1 = new THREE.PlaneGeometry(w, h);
  q1.translate(0, h * 0.46, 0);
  if (!crossed) return q1;
  const q2 = q1.clone();
  q2.rotateY(Math.PI * 0.46);
  q2.rotateZ(0.08);
  return mergeGeometries([q1, q2]);
}

function createCrossedClusterGeo(cards, w, h, tilt = 0.35, bend = 0.14) {
  const parts = [];
  for (let i = 0; i < cards; i++) {
    const ang = (i / cards) * Math.PI * 2 + hash2(i, 71) * 0.65;
    const wVar = w * (0.78 + hash2(i, 73) * 0.42);
    const hVar = h * (0.75 + hash2(i, 79) * 0.48);
    const tVar = tilt * (0.65 + hash2(i, 83) * 0.75);
    const c = createCurvedCard(wVar, hVar, bend * (0.8 + hash2(i, 89) * 0.5));
    c.translate(0, hVar * 0.45, 0);
    c.rotateX(tVar);
    c.rotateZ((hash2(i, 97) - 0.5) * 0.25);
    c.rotateY(ang);
    parts.push(c);
  }
  return mergeGeometries(parts);
}

/**

  const pineLeafMat = new THREE.MeshStandardMaterial({

  });

    cacheKey: 'botw_pine_leaf',
    isFoliage: true,

  });

  const birchLeafMat = new THREE.MeshStandardMaterial({
    map: texLib.leafBirch,

  enhancePBRMaterial(birchLeafMat, {

  const palmLeafMat = new THREE.MeshStandardMaterial({

  function makeImpostorMat(tex, key) {

  [
    ['oak', oakGeos],
    ['pine', pineGeos],
    ['birch', birchGeos],

  ].forEach(([sp, geos]) => {

  [
    ['oak_trunk', oakTrunkMat],
    ['birch_trunk', birchTrunkMat],
    ['oak_leaf', oakLeafMat],
    ['pine_leaf', pineLeafMat],
    ['birch_leaf', birchLeafMat],
    ['palm_leaf', palmLeafMat],
    ['oak_imp', oakImpMat],
    ['pine_imp', pineImpMat],
    ['birch_imp', birchImpMat],

  ].forEach(([id, m]) => assetManager.registerMaterial(id, m));

  assetManager.registerPrefab('oak_trunk', {
    lods: [
      { geo: oakGeos.trunkLod0, mat: oakTrunkMat, dist: 120, castShadow: true, maxVisible: 420 },

  assetManager.registerPrefab('oak_canopy', {
    lods: [
      { geo: oakGeos.canopyLod0, mat: oakLeafMat, dist: 120, castShadow: true, maxVisible: 420 },
      { geo: oakGeos.canopyLod1, mat: oakLeafMat, dist: 270, castShadow: false, maxVisible: 760 },
      { geo: oakGeos.impostorLod2, mat: oakImpMat, dist: 920, castShadow: false, maxVisible: 1800 }
    ]
  });

  assetManager.registerPrefab('pine_trunk', {
    lods: [
      { geo: pineGeos.trunkLod0, mat: oakTrunkMat, dist: 130, castShadow: true, maxVisible: 460 },
      { geo: pineGeos.trunkLod1, mat: oakTrunkMat, dist: 290, castShadow: false, maxVisible: 840 }
    ]
  });
  assetManager.registerPrefab('pine_canopy', {
    lods: [
      { geo: pineGeos.canopyLod0, mat: pineLeafMat, dist: 130, castShadow: true, maxVisible: 460 },
      { geo: pineGeos.canopyLod1, mat: pineLeafMat, dist: 290, castShadow: false, maxVisible: 840 },
      { geo: pineGeos.impostorLod2, mat: pineImpMat, dist: 980, castShadow: false, maxVisible: 2200 }

  });

  assetManager.registerPrefab('birch_trunk', {
    lods: [
      { geo: birchGeos.trunkLod0, mat: birchTrunkMat, dist: 110, castShadow: true, maxVisible: 260 },
      { geo: birchGeos.trunkLod1, mat: birchTrunkMat, dist: 250, castShadow: false, maxVisible: 480 }
    ]
  });
  assetManager.registerPrefab('birch_canopy', {
    lods: [
      { geo: birchGeos.canopyLod0, mat: birchLeafMat, dist: 110, castShadow: true, maxVisible: 260 },
      { geo: birchGeos.canopyLod1, mat: birchLeafMat, dist: 250, castShadow: false, maxVisible: 480 },
      { geo: birchGeos.impostorLod2, mat: birchImpMat, dist: 860, castShadow: false, maxVisible: 900 }
    ]

  assetManager.registerPrefab('palm_trunk', {
    lods: [
      { geo: palmGeos.trunkLod0, mat: oakTrunkMat, dist: 130, castShadow: true, maxVisible: 180 },
      { geo: palmGeos.trunkLod1, mat: oakTrunkMat, dist: 280, castShadow: false, maxVisible: 260 }
    ]
  });
  assetManager.registerPrefab('palm_canopy', {
    lods: [
      { geo: palmGeos.canopyLod0, mat: palmLeafMat, dist: 130, castShadow: true, maxVisible: 180 },
      { geo: palmGeos.canopyLod1, mat: palmLeafMat, dist: 280, castShadow: false, maxVisible: 260 },
      { geo: palmGeos.impostorLod2, mat: palmImpMat, dist: 850, castShadow: false, maxVisible: 280 }
    ]
  });

  // -------------------------------------------------------------------------
  // B. PLACE ~2,950 FOREST TREES ACROSS THE 3.36 KM OPEN WORLD
  // -------------------------------------------------------------------------
  const oakPalette = [
    new THREE.Color(0x9cb36c), new THREE.Color(0x88a45c), new THREE.Color(0xb2be64),
    new THREE.Color(0x7c9858), new THREE.Color(0xc2ac56)
  ];
  const pinePalette = [new THREE.Color(0x96b888), new THREE.Color(0x84a878), new THREE.Color(0xa6c292)];
  const birchPalette = [new THREE.Color(0xb6c866), new THREE.Color(0xa6bc5c), new THREE.Color(0xc8c456)];
  const palmPalette = [new THREE.Color(0x8eb84e), new THREE.Color(0x7aa442)];

  const oakTrunkInsts = [];
  const oakCanopyInsts = [];
  const pineTrunkInsts = [];
  const pineCanopyInsts = [];
  const birchTrunkInsts = [];
  const birchCanopyInsts = [];
  const palmTrunkInsts = [];
  const palmCanopyInsts = [];

  function pushTree(trunkArr, canopyArr, x, y, z, rx, ry, rz, sx, sy, sz, col) {
    dummy.position.set(x, y, z);
    dummy.rotation.set(rx, ry, rz);
    dummy.scale.set(sx, sy, sz);
    dummy.updateMatrix();
    const mat4 = dummy.matrix.clone();
    trunkArr.push({ x, y, z, matrix: mat4 });
    canopyArr.push({ x, y, z, matrix: mat4, color: col });
  }

  // Hero Overlook & Scenic Lake Island Signature Trees
  {
    const bx = -14.8, bz = -4.2;
    pushTree(birchTrunkInsts, birchCanopyInsts, bx, getTerrainHeight(bx, bz) - 0.35, bz, 0.04, 0.8, 0.03, 1.15, 1.15, 1.15, birchPalette[0]);
    const px = 15.6, pz = -3.8;
    pushTree(pineTrunkInsts, pineCanopyInsts, px, getTerrainHeight(px, pz) - 0.35, pz, -0.03, 2.1, -0.04, 1.22, 1.25, 1.22, pinePalette[0]);

    for (const [ix, iz, sc] of [[335, -678, 1.35], [346, -685, 1.15], [970, -1470, 1.45], [992, -1488, 1.25], [1515, -955, 1.30]]) {
      const iy = getTerrainHeight(ix, iz);
      if (iy > WATER_LEVEL + 0.8) {
        pushTree(pineTrunkInsts, pineCanopyInsts, ix, iy - 0.35, iz, 0.02, ix * 0.7, -0.02, sc, sc * 1.1, sc, pinePalette[1]);
      }
    }
  }

  // Procedural multi-biome woodlands across [-2800, +2800] (protecting city parcels/streets & Overlook cliff!)
  for (let i = 0; i < 16500 && (oakTrunkInsts.length + pineTrunkInsts.length + birchTrunkInsts.length) < 3300; i++) {
    const nearValley = i < 2400;
    const tx = nearValley ? (hash2(i, 211) - 0.5) * 950.0 : (hash2(i, 211) - 0.45) * 5200.0;
    const tz = nearValley ? -42.0 - hash2(i, 223) * 750.0 : -80.0 - hash2(i, 223) * 4200.0;

    if (isInCityBounds(tx, tz, 9.0)) continue;
    if (isOnRoadOrHighway(tx, tz, 6.8)) continue;
    if (tx > 1950 && tz > -2800) continue; // Eastern red-rock canyon stays arid
    if (tz > -45 && tx > -45 && tx < 45) continue;
    if (tx > -28 && tx < 160 && tz > -220 && tz < -40) continue; // Overlook-to-Lake sight corridor
    if (Math.abs(tx - getPathCenterX(tz)) < 5.0 && tz < -25 && tz > -480) continue;

    const grove = fbm2(tx * 0.0042, tz * 0.0042, 3);
    if (grove < -0.18 && hash2(i, 219) < 0.78) continue;

    const ty = getTerrainHeight(tx, tz);
    if (ty < WATER_LEVEL + 1.8 || ty > 145.0) continue;
    getTerrainNormal(tx, tz, norm);
    if (norm.y < 0.78) continue;

    const roll = hash2(i, 239);
    const scale = 1.25 + hash2(i, 227) * 1.05;
    const scaleY = scale * (0.9 + hash2(i, 229) * 0.3);
    const rx = (hash2(i, 231) - 0.5) * 0.06;
    const ry = hash2(i, 233) * Math.PI * 2;
    const rz = (hash2(i, 237) - 0.5) * 0.06;

    const preferPine = ty > 32.0 || Math.hypot(tx, tz + 1400) > 1500;
    if (preferPine && roll < 0.76) {
      const col = pinePalette[Math.floor(hash2(i, 241) * pinePalette.length)].clone();
      col.offsetHSL((hash2(i, 243) - 0.5) * 0.02, 0, (hash2(i, 247) - 0.5) * 0.08);
      pushTree(pineTrunkInsts, pineCanopyInsts, tx, ty - 0.35, tz, rx, ry, rz, scale, scaleY, scale, col);
    } else if (roll > 0.78) {
      const col = birchPalette[Math.floor(hash2(i, 251) * birchPalette.length)].clone();
      col.offsetHSL((hash2(i, 257) - 0.5) * 0.03, 0, (hash2(i, 263) - 0.5) * 0.06);
      pushTree(birchTrunkInsts, birchCanopyInsts, tx, ty - 0.35, tz, rx, ry, rz, scale, scaleY, scale, col);
    } else {
      const col = oakPalette[Math.floor(hash2(i, 269) * oakPalette.length)].clone();
      col.offsetHSL((hash2(i, 271) - 0.5) * 0.03, 0, (hash2(i, 277) - 0.5) * 0.08);
      pushTree(oakTrunkInsts, oakCanopyInsts, tx, ty - 0.35, tz, rx, ry, rz, scale, scaleY, scale, col);
    }
  }

  // Southern & western city perimeter woodland belt softening the aerial urban fringe
  for (let i = 0; i < 650; i++) {
    const isSouth = i % 2 === 0;
    const tx = isSouth ? -1680.0 + hash2(i, 311) * 1560.0 : -1740.0 + hash2(i, 313) * 150.0;
    const tz = isSouth ? -235.0 + hash2(i, 317) * 155.0 : -1720.0 + hash2(i, 331) * 1520.0;
    if (isInCityBounds(tx, tz, 6.0) || isOnRoadOrHighway(tx, tz, 7.5)) continue;
    const ty = getTerrainHeight(tx, tz);
    if (ty < WATER_LEVEL + 1.5 || ty > 85.0) continue;
    getTerrainNormal(tx, tz, norm);
    if (norm.y < 0.80) continue;
    const s = 1.15 + hash2(i, 337) * 0.75;
    const sy = s * (0.95 + hash2(i, 347) * 0.25);
    const ry = hash2(i, 349) * Math.PI * 2;
    if (hash2(i, 353) < 0.35) {
      const col = birchPalette[Math.floor(hash2(i, 359) * birchPalette.length)].clone();
      pushTree(birchTrunkInsts, birchCanopyInsts, tx, ty - 0.35, tz, 0, ry, 0, s, sy, s, col);
    } else {
      const col = oakPalette[Math.floor(hash2(i, 367) * oakPalette.length)].clone();
      pushTree(oakTrunkInsts, oakCanopyInsts, tx, ty - 0.35, tz, 0, ry, 0, s, sy, s, col);
    }
    if (oakTrunkInsts.length + birchTrunkInsts.length > 2600) break;
  }

  // Waterfront Promenade Date Palms following curved Lakefront Quay (skipping Marina Pier at z = -560!)
  for (let pz = -1700; pz <= -200; pz += 38) {
    if (Math.abs(pz + 560.0) < 16.0) continue;
    const qx = getQuayX(pz);
    pushTree(palmTrunkInsts, palmCanopyInsts, qx - 8.0, CITY_BOUNDS.y + 0.28, pz, 0.02, pz * 0.6, 0.03, 1.10, 1.04 + (pz % 3) * 0.07, 1.10, palmPalette[0]);
  }
  // Grand Civic Axis landscaped promenade palms along sidewalk curb (West of Waterfront Plaza)
  for (let px = -1400; px <= -180; px += 46) {
    if (px > getQuayX(-560.0) - 24.0) continue;
    if (Math.abs(px + 460) < 18 || Math.abs(px + 920) < 18) continue;
    const pz = -560.0 - (px + 225.0) * (0.08 / 0.9968) - 11.4;
    pushTree(palmTrunkInsts, palmCanopyInsts, px, getCityTerraceY(px, pz) + 0.16, pz, 0.02, px * 0.7, 0.01, 1.0, 1.05, 1.0, palmPalette[1]);
  }

  const treeBatches = [
    createLODInstancedBatch(assetManager, 'oak_trunk', oakTrunkInsts, { cellSize: 220, maxDist: 450 }),
    createLODInstancedBatch(assetManager, 'oak_canopy', oakCanopyInsts, { cellSize: 220, maxDist: 1650 }),
    createLODInstancedBatch(assetManager, 'pine_trunk', pineTrunkInsts, { cellSize: 220, maxDist: 480 }),
    createLODInstancedBatch(assetManager, 'pine_canopy', pineCanopyInsts, { cellSize: 220, maxDist: 1850 }),
    createLODInstancedBatch(assetManager, 'birch_trunk', birchTrunkInsts, { cellSize: 220, maxDist: 420 }),
    createLODInstancedBatch(assetManager, 'birch_canopy', birchCanopyInsts, { cellSize: 220, maxDist: 1550 }),
    createLODInstancedBatch(assetManager, 'palm_trunk', palmTrunkInsts, { cellSize: 220, maxDist: 420 }),
    createLODInstancedBatch(assetManager, 'palm_canopy', palmCanopyInsts, { cellSize: 220, maxDist: 1550 })
  ];
  treeBatches.forEach((b) => {
    group.add(b.group);
    if (lodManager) lodManager.addBatch(b);
  });

  // -------------------------------------------------------------------------
  // C. TEXTURE-SIMPLIFIED WORLD-STREAMED GRASS (4-TRI LOD0 / 2-TRI LOD1 QUADS)
  // -------------------------------------------------------------------------
  const GRASS_LOD0_MAX = 12000;
  const GRASS_LOD1_MAX = 5000;
  const grassLod0Geo = assetManager.registerGeometry('grass_lod0', createTexturedGrassGeometry(true, 1.18, 0.66));
  const grassLod1Geo = assetManager.registerGeometry('grass_lod1', createTexturedGrassGeometry(false, 1.24, 0.70));

  const grassCardMat = new THREE.ShaderMaterial({
    side: THREE.DoubleSide,
    fog: false,
    uniforms: Object.assign({}, ATMO_UNIFORMS, { uGrassCard: { value: texLib.grassCard } }),
    vertexShader: /* glsl */`
      uniform float uTime;
      uniform vec3 uPlayerPos;
      varying vec2 vUv;
      varying vec3 vWorldPos;
      varying vec3 vWorldNorm;
      varying vec3 vTint;
      varying float vGust;

      void main() {
        vUv = uv;
        #ifdef USE_INSTANCING_COLOR
          vTint = instanceColor;
        #else
          vTint = vec3(1.0);
        #endif

        vec4 instOrigin = modelMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
        float tip = uv.y;

        // Smooth distance-based vertical fade beyond 95m so streamed grass melts into terrain
        float camDist = length(instOrigin.xz - cameraPosition.xz);
        float fadeH = 1.0 - smoothstep(92.0, 124.0, camDist);

        float w1 = sin(instOrigin.x * 0.16 + instOrigin.z * 0.13 - uTime * 2.25);
        float w2 = cos(instOrigin.x * 0.34 - instOrigin.z * 0.27 + uTime * 1.55) * 0.45;
        float wind = (w1 + w2) * 0.20 * tip * tip;

        vec3 localPos = position;
        localPos.y *= fadeH;
        vec4 wp = modelMatrix * instanceMatrix * vec4(localPos, 1.0);
        wp.x += wind;
        wp.z += wind * 0.55;

        // Player & vehicle wheel grass parting
        vec2 toG = wp.xz - uPlayerPos.xz;
        float dP = length(toG);
        float vDist = abs(instOrigin.y - uPlayerPos.y);
        float push = smoothstep(1.85, 0.25, dP) * smoothstep(2.2, 0.4, vDist) * tip;
        if (dP > 0.001) {
          wp.xz += normalize(toG) * push * 0.55;
          wp.y -= push * 0.20;
        }

        vWorldPos = wp.xyz;
        vWorldNorm = normalize(mat3(modelMatrix) * mat3(instanceMatrix) * normal);
        vGust = 0.88 + 0.12 * w1;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */`
      uniform sampler2D uGrassCard;
      varying vec2 vUv;
      varying vec3 vWorldPos;
      varying vec3 vWorldNorm;
      varying vec3 vTint;
      varying float vGust;
      ${ATMO_GLSL_PARS}

      void main() {
        vec4 card = texture2D(uGrassCard, vUv);
        float camDist = length(vWorldPos - cameraPosition);
        // Subtle distance alpha inflation preserves mid-range density without harsh cutoff
        float alphaBoost = mix(1.0, 1.32, smoothstep(24.0, 95.0, camDist));
        if (card.a * alphaBoost < 0.34) discard;

        vec3 vDir = normalize(cameraPosition - vWorldPos);
        vec3 n = normalize(vWorldNorm);
        if (!gl_FrontFacing) n = -n;
        // Blend slightly toward sky-up normal for natural lush turf lighting on crossed cards
        n = normalize(mix(n, vec3(0.0, 1.0, 0.0), 0.65));

        // uGrassCard is SRGBColorSpace -> WebGL2 hardware linearizes on sample; no double gamma!
        vec3 albedo = card.rgb * vTint;
        albedo *= mix(0.66, 1.16, smoothstep(0.0, 0.55, vUv.y)); // soft root AO

        float cloudShad = sampleCloudShadow(vWorldPos.xz, uTime, uSunDir);
        float ndl = clamp(dot(n, uSunDir) * 0.65 + 0.42, 0.26, 1.0);
        vec3 ambient = mix(uHazeCool * 0.22, vec3(0.06, 0.09, 0.04), 0.55) * mix(0.45, 1.0, vUv.y);
        vec3 direct = uSunColor * ndl * cloudShad * (1.0 - uNightFactor * 0.82);

        float backlit = pow(max(dot(-vDir, uSunDir), 0.0), 3.0);
        vec3 sss = uSunColor * backlit * vUv.y * 0.32 * cloudShad * (1.0 - uNightFactor * 0.85);

        vec3 col = albedo * (ambient + direct * 0.94) + sss;
        col *= vGust;
        col = applyRealisticAtmosphere(col, vWorldPos, cameraPosition);
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });

  const grassLod0Inst = new THREE.InstancedMesh(grassLod0Geo, grassCardMat, GRASS_LOD0_MAX);
  const grassLod1Inst = new THREE.InstancedMesh(grassLod1Geo, grassCardMat, GRASS_LOD1_MAX);
  grassLod0Inst.frustumCulled = false;
  grassLod1Inst.frustumCulled = false;
  const initCol = new THREE.Color(1, 1, 1);
  for (let i = 0; i < GRASS_LOD0_MAX; i++) grassLod0Inst.setColorAt(i, initCol);
  for (let i = 0; i < GRASS_LOD1_MAX; i++) grassLod1Inst.setColorAt(i, initCol);
  group.add(grassLod0Inst, grassLod1Inst);

  // World-Cell Streaming Cache (28m x 28m deterministic procedural grass cells)
  const GRASS_CELL = 28.0;
  const GRASS_RADIUS = 124.0;
  const grassCellCache = new Map();
  let cellTick = 0;

  function buildGrassCell(cx, cz) {
    const items = [];
    const originX = cx * GRASS_CELL;
    const originZ = cz * GRASS_CELL;
    const distFromOrigin = Math.hypot(originX + 14, originZ + 14);
    const tuftBudget = distFromOrigin < 64 ? 240 : 68;

    for (let i = 0; i < tuftBudget; i++) {
      const seedA = cx * 73856093 ^ cz * 19349663 ^ (i * 83492791);
      const gx = originX + hash2(seedA, 17) * GRASS_CELL;
      const gz = originZ + hash2(seedA, 31) * GRASS_CELL;

      if (Math.hypot(gx - 1.2, gz - 7.2) < 2.0) continue;
      if (Math.hypot(gx, gz) < 1.15) continue;
      if (isInCityBounds(gx, gz, 4.0)) continue;
      if (isOnRoadOrHighway(gx, gz, 4.0)) continue;
      if (gx > 1850 && gz > -2400) continue;
      if (gz < -28 && gz > -480 && Math.abs(gx - getPathCenterX(gz)) < 3.0 + hash2(seedA, 41) * 1.4) continue;
      if (Math.hypot(gx + 10.5, gz + 0.5) < 3.2 && hash2(seedA, 43) < 0.72) continue;

      const gy = getTerrainHeight(gx, gz);
      if (gy < WATER_LEVEL + 1.1 || gy > 125.0) continue;
      getTerrainNormal(gx, gz, norm);
      if (norm.y < 0.80) continue;

      const fg = Math.hypot(gx, gz) < 32.0;
      const hScale = fg ? (0.48 + hash2(seedA, 59) * 0.34) : (0.78 + hash2(seedA, 59) * 0.52);
      const wScale = 0.85 + hash2(seedA, 61) * 0.55;

      dummy.position.set(gx, gy - 0.04, gz);
      dummy.rotation.set(
        (hash2(seedA, 67) - 0.5) * 0.18,
        hash2(seedA, 71) * Math.PI * 2,
        (hash2(seedA, 73) - 0.5) * 0.18
      );
      dummy.scale.set(wScale, hScale, wScale);
      dummy.updateMatrix();

      const patch = fbm2(gx * 0.045, gz * 0.045, 2);
      const color = new THREE.Color(
        0.90 + patch * 0.24 + (hash2(seedA, 79) - 0.5) * 0.12,
        0.96 + patch * 0.14 + (hash2(seedA, 83) - 0.5) * 0.10,
        0.84 + (hash2(seedA, 89) - 0.5) * 0.10
      );
      items.push({ x: gx, y: gy, z: gz, matrix: dummy.matrix.clone(), color });
    }
    return items;
  }

  function acquireGrassCell(cx, cz) {
    const key = `${cx},${cz}`;
    cellTick++;
    let entry = grassCellCache.get(key);
    if (!entry) {
      if (grassCellCache.size >= 165) {
        let oldK = null;
        let oldT = Infinity;
        grassCellCache.forEach((v, k) => {
          if (v.last < oldT) {
            oldT = v.last;
            oldK = k;
          }
        });
        if (oldK) grassCellCache.delete(oldK);
      }
      entry = { items: buildGrassCell(cx, cz), last: cellTick };
      grassCellCache.set(key, entry);
    } else {
      entry.last = cellTick;
    }
    return entry.items;
  }

  const lastGrassCam = new THREE.Vector3(1e9, 1e9, 1e9);
  const lastGrassDir = new THREE.Vector3();
  const grassTmpDir = new THREE.Vector3();
  const grassFrustum = new THREE.Frustum();
  const grassProj = new THREE.Matrix4();
  const cellSphere = new THREE.Sphere(new THREE.Vector3(), GRASS_CELL * 0.85);
  let activeGrassCounts = { lod0: 0, lod1: 0, cellsVisible: 0 };

  function updateGrass(camera, force = false) {
    camera.getWorldDirection(grassTmpDir);
    const moved = camera.position.distanceToSquared(lastGrassCam) > 36.0; // > 6m
    const rotated = grassTmpDir.dot(lastGrassDir) < 0.985;
    if (!force && !moved && !rotated) return;

    lastGrassCam.copy(camera.position);
    lastGrassDir.copy(grassTmpDir);

    camera.updateMatrixWorld();
    grassProj.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
    grassFrustum.setFromProjectionMatrix(grassProj);

    const camX = camera.position.x;
    const camZ = camera.position.z;
    const minCx = Math.floor((camX - GRASS_RADIUS) / GRASS_CELL);
    const maxCx = Math.floor((camX + GRASS_RADIUS) / GRASS_CELL);
    const minCz = Math.floor((camZ - GRASS_RADIUS) / GRASS_CELL);
    const maxCz = Math.floor((camZ + GRASS_RADIUS) / GRASS_CELL);

    let c0 = 0;
    let c1 = 0;
    let cellsVis = 0;

    for (let cz = minCz; cz <= maxCz; cz++) {
      for (let cx = minCx; cx <= maxCx; cx++) {
        const midX = (cx + 0.5) * GRASS_CELL;
        const midZ = (cz + 0.5) * GRASS_CELL;
        const dCell = Math.hypot(midX - camX, midZ - camZ);
        if (dCell > GRASS_RADIUS + 20.0) continue;

        const approxY = getTerrainHeight(midX, midZ);
        cellSphere.center.set(midX, approxY + 1.0, midZ);
        if (!grassFrustum.intersectsSphere(cellSphere)) continue;

        cellsVis++;
        const items = acquireGrassCell(cx, cz);
        for (let i = 0; i < items.length; i++) {
          const it = items[i];
          const dSq = (it.x - camX) * (it.x - camX) + (it.z - camZ) * (it.z - camZ);
          if (dSq < 54.0 * 54.0) {
            if (c0 < GRASS_LOD0_MAX) {
              grassLod0Inst.setMatrixAt(c0, it.matrix);
              grassLod0Inst.setColorAt(c0, it.color);
              c0++;
            }
          } else if (dSq < GRASS_RADIUS * GRASS_RADIUS) {
            if (c1 < GRASS_LOD1_MAX) {
              grassLod1Inst.setMatrixAt(c1, it.matrix);
              grassLod1Inst.setColorAt(c1, it.color);
              c1++;
            }
          }
        }
      }
    }

    grassLod0Inst.count = c0;
    grassLod1Inst.count = c1;
    grassLod0Inst.instanceMatrix.needsUpdate = true;
    grassLod1Inst.instanceMatrix.needsUpdate = true;
    if (grassLod0Inst.instanceColor) grassLod0Inst.instanceColor.needsUpdate = true;
    if (grassLod1Inst.instanceColor) grassLod1Inst.instanceColor.needsUpdate = true;
    activeGrassCounts = { lod0: c0, lod1: c1, cellsVisible: cellsVis };
  }

  // -------------------------------------------------------------------------
  // D. MULTI-LOD GROUNDCOVER FLORA (FERNS, SHRUBS, WILDFLOWERS)
  // -------------------------------------------------------------------------
  const fernGeo0 = createCrossedClusterGeo(6, 1.05, 0.95, 0.72, 0.24);
  const fernGeo1 = createCrossedClusterGeo(3, 1.05, 0.95, 0.65, 0.14);
  const fernMat = new THREE.MeshStandardMaterial({
    map: texLib.fernCard,
    alphaTest: 0.38,
    side: THREE.DoubleSide,
    roughness: 0.74
  });
  enhancePBRMaterial(fernMat, { cacheKey: 'botw_fern', isFoliage: true, windStrength: 0.08, subsurfaceStrength: 0.42 });

  const shrubGeo0 = createCrossedClusterGeo(5, 1.55, 1.05, 0.42, 0.20);
  const shrubGeo1 = createCrossedClusterGeo(2, 1.65, 1.05, 0.30, 0.10);
  const shrubMat = new THREE.MeshStandardMaterial({
    map: texLib.shrubCard,
    alphaTest: 0.40,
    side: THREE.DoubleSide,
    roughness: 0.78
  });
  enhancePBRMaterial(shrubMat, { cacheKey: 'botw_shrub', isFoliage: true, windStrength: 0.09, subsurfaceStrength: 0.38 });

  const flowerGeo0 = createCrossedClusterGeo(3, 0.65, 0.50, 0.16, 0.09);
  const flowerMat = new THREE.MeshStandardMaterial({
    map: texLib.flowerCard,
    alphaTest: 0.40,
    side: THREE.DoubleSide,
    roughness: 0.70
  });
  enhancePBRMaterial(flowerMat, { cacheKey: 'botw_flower', isFoliage: true, windStrength: 0.07, subsurfaceStrength: 0.45 });

  assetManager.registerPrefab('fern', {
    lods: [
      { geo: fernGeo0, mat: fernMat, dist: 60, castShadow: true, maxVisible: 420 },
      { geo: fernGeo1, mat: fernMat, dist: 120, castShadow: false, maxVisible: 520 }
    ]
  });
  assetManager.registerPrefab('shrub', {
    lods: [
      { geo: shrubGeo0, mat: shrubMat, dist: 75, castShadow: true, maxVisible: 380 },
      { geo: shrubGeo1, mat: shrubMat, dist: 170, castShadow: false, maxVisible: 620 }
    ]
  });
  assetManager.registerPrefab('flower', {
    lods: [
      { geo: flowerGeo0, mat: flowerMat, dist: 65, castShadow: false, maxVisible: 700 }
    ]
  });

  const fernInsts = [];
  const shrubInsts = [];
  const flowerInsts = [];

  for (let i = 0; i < 2400 && fernInsts.length < 780; i++) {
    const fg = i < 260;
    const fx = fg ? (hash2(i, 301) - 0.5) * 44 : (hash2(i, 307) - 0.5) * 900;
    const fz = fg ? (hash2(i, 311) - 0.5) * 34 : -26 - hash2(i, 313) * 650;
    if (isInCityBounds(fx, fz, 5.0) || isOnRoadOrHighway(fx, fz, 4.5)) continue;
    if (Math.hypot(fx - 0.4, fz - 7.6) < 4.5 || Math.hypot(fx, fz) < 2.6) continue;
    if (fg && Math.abs(fx) < 3.4 && fz < 2.0 && fz > -5.5) continue;
    const fy = getTerrainHeight(fx, fz);
    if (fy < WATER_LEVEL + 1.2 || fy > 76) continue;
    getTerrainNormal(fx, fz, norm);
    if (norm.y < 0.78) continue;

    const s = (fg ? 0.40 : 0.78) + hash2(i, 317) * (fg ? 0.28 : 0.52);
    dummy.position.set(fx, fy - 0.05, fz);
    dummy.rotation.set((hash2(i, 329) - 0.5) * 0.14, hash2(i, 331) * Math.PI * 2, (hash2(i, 337) - 0.5) * 0.14);
    dummy.scale.set(s, s * (0.85 + hash2(i, 347) * 0.3), s);
    dummy.updateMatrix();
    fernInsts.push({ x: fx, y: fy, z: fz, matrix: dummy.matrix.clone() });
  }

  for (let i = 0; i < 2600 && shrubInsts.length < 760; i++) {
    const fg = i < 100;
    const sx = fg ? (hash2(i, 401) - 0.5) * 48 : (hash2(i, 409) - 0.5) * 1100;
    const sz = fg ? (hash2(i, 419) - 0.5) * 32 : -34 - hash2(i, 421) * 780;
    if (isInCityBounds(sx, sz, 6.0) || isOnRoadOrHighway(sx, sz, 5.5)) continue;
    if (fg && (Math.hypot(sx, sz) < 8.5 || sz < 0.5)) continue;
    if (Math.abs(sx - getPathCenterX(sz)) < 5.5) continue;
    const sy = getTerrainHeight(sx, sz);
    if (sy < WATER_LEVEL + 1.4 || sy > 82) continue;
    getTerrainNormal(sx, sz, norm);
    if (norm.y < 0.80) continue;

    const s = (fg ? 0.55 : 0.80) + hash2(i, 431) * 0.85;
    dummy.position.set(sx, sy - 0.10, sz);
    dummy.rotation.set(0, hash2(i, 433) * Math.PI * 2, 0);
    dummy.scale.set(s, s * 0.85, s);
    dummy.updateMatrix();
    shrubInsts.push({ x: sx, y: sy, z: sz, matrix: dummy.matrix.clone() });
  }

  for (let i = 0; i < 2400 && flowerInsts.length < 950; i++) {
    const fg = i < 420;
    const wx = fg ? (hash2(i, 501) - 0.5) * 38 : (hash2(i, 509) - 0.5) * 780;
    const wz = fg ? (hash2(i, 521) - 0.5) * 28 : -28 - hash2(i, 523) * 580;
    if (isInCityBounds(wx, wz, 5.0) || isOnRoadOrHighway(wx, wz, 4.5)) continue;
    if (Math.hypot(wx - 0.4, wz - 7.6) < 4.0) continue;
    if (Math.abs(wx) < 1.8 && wz > -1 && wz < 8) continue;
    const wy = getTerrainHeight(wx, wz);
    if (wy < WATER_LEVEL + 1.3 || wy > 75) continue;
    getTerrainNormal(wx, wz, norm);
    if (norm.y < 0.83) continue;

    const s = 0.65 + hash2(i, 541) * 0.65;
    dummy.position.set(wx, wy - 0.03, wz);
    dummy.rotation.set(0, hash2(i, 547) * Math.PI * 2, 0);
    dummy.scale.set(s, s, s);
    dummy.updateMatrix();
    flowerInsts.push({ x: wx, y: wy, z: wz, matrix: dummy.matrix.clone() });
  }

  [
    createLODInstancedBatch(assetManager, 'fern', fernInsts, { cellSize: 110, maxDist: 120 }),
    createLODInstancedBatch(assetManager, 'shrub', shrubInsts, { cellSize: 110, maxDist: 170 }),
    createLODInstancedBatch(assetManager, 'flower', flowerInsts, { cellSize: 110, maxDist: 65 })
  ].forEach((b) => {
    group.add(b.group);
    if (lodManager) lodManager.addBatch(b);
  });

  function getStats() {
    return {
      ...activeGrassCounts,
      totalTrees: oakTrunkInsts.length + pineTrunkInsts.length + birchTrunkInsts.length + palmTrunkInsts.length
    };
  }

  return { root: group, update: updateGrass, getStats };
}

// ==================== landmarks.js ====================
/**
 * Generates an angular fractured granite rock outcrop using multi-plane cleavage
 * & ridged rock erosion (never smooth sphere blobs or honeycomb plates).
 */
function createCragRockGeometry(seed = 1, detail = 3) {
  const geo = new THREE.IcosahedronGeometry(1.0, detail);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();

  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const nx = v.x + seed * 3.7;
    const ny = v.y - seed * 2.1;
    const nz = v.z + seed * 5.3;

    const macro = fbm2(nx * 0.9 + ny * 0.4, nz * 0.9 - ny * 0.35, 3);
    const ridge = ridgedFbm2(nx * 1.45, nz * 1.45 + ny * 1.1, 3);
    // Subtle stratified cliff step & cleaved angular sides
    const ledge = Math.sin(v.y * 5.2 + macro * 2.5) * 0.055;
    const cleave = Math.abs(v.x * 0.6 + v.z * 0.8) * 0.08;
    const scale = 0.88 + macro * 0.22 + (ridge - 0.5) * 0.26 + ledge - cleave;

    v.multiplyScalar(scale);
    if (v.y < -0.22) v.y *= 0.65;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}

/** Creates a subtly chipped, weathered masonry block geometry (no razor-sharp CG corners). */
function createWeatheredBlockGeo(w, h, d, seed = 1) {
  const geo = new THREE.BoxGeometry(w, h, d, 4, 4, 4);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i);
    const z = pos.getZ(i);
    const edgeFactor =
      (Math.abs(x) / (w * 0.5) > 0.72 ? 1 : 0) +
      (Math.abs(y) / (h * 0.5) > 0.72 ? 1 : 0) +
      (Math.abs(z) / (d * 0.5) > 0.72 ? 1 : 0);
    const chip = fbm2(x * 2.4 + y * 1.9 + seed, z * 2.4 - y * 1.5, 2) * (0.018 + edgeFactor * 0.025);
    pos.setXYZ(i, x + chip, y + chip * 0.6, z - chip);
  }
  geo.computeVertexNormals();
  return geo;
}

function createTriplanarRockMaterial(texLib) {
  const mat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 0.86,
    metalness: 0.03
  });
  mat.fog = false;
  mat.customProgramCacheKey = () => 'botw_triplanar_rock_moss_v2';
  mat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, ATMO_UNIFORMS);
    shader.uniforms.uRockMap = { value: texLib.cliffRock.map };
    shader.uniforms.uRockNorm = { value: texLib.cliffRock.normalMap };

    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>\nvarying vec3 vAtmoWPos;\nvarying vec3 vAtmoWNorm;`)
      .replace(
        '#include <project_vertex>',
        `#include <project_vertex>\n{\nvec4 awp = vec4(transformed, 1.0);\n#ifdef USE_INSTANCING\nawp = instanceMatrix * awp;\n#endif\nawp = modelMatrix * awp;\nvAtmoWPos = awp.xyz;\nvec3 awn = objectNormal;\n#ifdef USE_INSTANCING\nawn = mat3(instanceMatrix) * awn;\n#endif\nvAtmoWNorm = normalize(mat3(modelMatrix) * awn);\n}`
      );

    shader.fragmentShader = shader.fragmentShader
      .replace(
        '#include <common>',
        `#include <common>\nuniform sampler2D uRockMap;\nuniform sampler2D uRockNorm;\nvarying vec3 vAtmoWPos;\nvarying vec3 vAtmoWNorm;\n${ATMO_GLSL_PARS}`
      )
      .replace(
        '#include <color_fragment>',
        /* glsl */`
        #include <color_fragment>
        vec3 rPerturbedNorm = normalize(vAtmoWNorm);
        {
          vec3 wPos = vAtmoWPos;
          vec3 wn = normalize(vAtmoWNorm);
          vec3 tw = pow(abs(wn), vec3(4.0));
          tw /= max(tw.x + tw.y + tw.z, 0.0001);
          float rs = 0.22;
          vec3 cx = texture2D(uRockMap, wPos.zy * rs).rgb;
          vec3 cy = texture2D(uRockMap, wPos.xz * rs).rgb;
          vec3 cz = texture2D(uRockMap, wPos.xy * rs).rgb;
          vec3 col = cx * tw.x + cy * tw.y + cz * tw.z;

          vec3 nx = texture2D(uRockNorm, wPos.zy * rs).xyz * 2.0 - 1.0;
          vec3 ny = texture2D(uRockNorm, wPos.xz * rs).xyz * 2.0 - 1.0;
          vec3 nz = texture2D(uRockNorm, wPos.xy * rs).xyz * 2.0 - 1.0;
          vec3 nOff = vec3(0.0, nx.y, nx.x) * tw.x + vec3(ny.x, 0.0, ny.y) * tw.y + vec3(nz.x, nz.y, 0.0) * tw.z;
          rPerturbedNorm = normalize(wn + nOff * 0.9);

          // Brighter sunlit granite strata & lush emerald-olive moss so foreground crags read clearly even in shadow
          col *= 1.54;
          float mNoise = atmoFbm(wPos.xz * 0.42);
          float topMask = smoothstep(0.36, 0.78, wn.y + (mNoise - 0.5) * 0.38);
          vec3 mossCol = mix(vec3(0.16, 0.24, 0.045), vec3(0.32, 0.40, 0.08), mNoise);
          diffuseColor.rgb = mix(col, mossCol, topMask * 0.52);
        }
        `
      )
      .replace(
        '#include <normal_fragment_maps>',
        `#include <normal_fragment_maps>\nnormal = normalize(mat3(viewMatrix) * rPerturbedNorm);`
      )
      .replace(
        '#include <lights_fragment_begin>',
        `#include <lights_fragment_begin>\nfloat cShad = sampleCloudShadow(vAtmoWPos.xz, uTime, uSunDir);\nreflectedLight.directDiffuse *= cShad;\nreflectedLight.directSpecular *= cShad;`
      )
      .replace(
        '#include <fog_fragment>',
        `gl_FragColor.rgb = applyRealisticAtmosphere(gl_FragColor.rgb, vAtmoWPos, cameraPosition);`
      );
  };
  return mat;
}

function createLandmarks(texLib, assetManager, lodManager) {
  const root = new THREE.Group();

  // Shared PBR Materials
  const cragRockMat = createTriplanarRockMaterial(texLib);

  const masonryMat = new THREE.MeshStandardMaterial({
    map: texLib.masonry.map,
    normalMap: texLib.masonry.normalMap,
    normalScale: new THREE.Vector2(1.3, 1.3),
    roughnessMap: texLib.masonry.roughnessMap,
    roughness: 0.84,
    metalness: 0.04
  });
  enhancePBRMaterial(masonryMat, {
    cacheKey: 'botw_masonry_moss',
    mossStrength: 0.52
  });

  const castleStoneMat = new THREE.MeshStandardMaterial({
    map: texLib.masonry.map,
    normalMap: texLib.masonry.normalMap,
    color: 0x626c7d,
    roughness: 0.82,
    metalness: 0.08
  });
  enhancePBRMaterial(castleStoneMat, { cacheKey: 'botw_castle_stone', cloudShadows: false });

  const castleRoofMat = new THREE.MeshStandardMaterial({
    color: 0x2c3b54,
    roughness: 0.55,
    metalness: 0.22
  });
  enhancePBRMaterial(castleRoofMat, { cacheKey: 'botw_castle_roof', cloudShadows: false });

  const calamityPillarMat = new THREE.MeshStandardMaterial({
    map: texLib.sheikah.map,
    normalMap: texLib.sheikah.normalMap,
    emissive: new THREE.Color(0xff421c),
    emissiveMap: texLib.sheikah.emissiveMap,
    emissiveIntensity: 0.65,
    color: 0x3b3440,
    roughness: 0.65,
    metalness: 0.28
  });
  enhancePBRMaterial(calamityPillarMat, { cacheKey: 'botw_calamity_pillar', cloudShadows: false });

  const mesaMat = new THREE.MeshStandardMaterial({
    map: texLib.cliffRock.map,
    normalMap: texLib.cliffRock.normalMap,
    color: 0xc29372,
    roughness: 0.88,
    metalness: 0.02
  });
  enhancePBRMaterial(mesaMat, { cacheKey: 'botw_mesa_rock', cloudShadows: false });

  const woodMat = new THREE.MeshStandardMaterial({
    map: texLib.barkOak.map,
    normalMap: texLib.barkOak.normalMap,
    roughness: 0.88
  });
  enhancePBRMaterial(woodMat, { cacheKey: 'botw_prop_wood' });

  // =========================================================================
  // 1. HERO FOREGROUND CRAGGY BOULDERS, CLIFF LEDGES & SCATTERED VALLEY STONES
  // =========================================================================
  const rockGeoA = createCragRockGeometry(1, 3);
  const rockGeoB = createCragRockGeometry(7, 3);

      const z = p.getZ(i);
      const ang = Math.atan2(z, x);
      const r = Math.hypot(x, z);
      if (r > rTop * 0.45) {
        const fluteWave = Math.max(0, Math.cos(ang * flutes));
        const endMask = smoothstep(-height * 0.45, -height * 0.32, y) * smoothstep(height * 0.45, height * 0.32, y);
        const chip = fbm2(x * 3.1 + y * 2.2, z * 3.1, 2) * 0.018;
        const scale = 1.0 - fluteWave * 0.085 * endMask + chip;
        p.setXYZ(i, x * scale, y, z * scale);

    }
    geo.computeVertexNormals();
    return geo;
  }
