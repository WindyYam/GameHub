function buildTrafficRoutes(city) {
  // Route 4 & Route 5: Ring Expressway & Causeway Two-Way Loop
  const routeHwyA = [];
  const routeHwyB = [];
  for (let i = 0; i < HIGHWAY_SAMPLES.length; i += 4) {
    const s = HIGHWAY_SAMPLES[i];
    const nx = -s.tz;
    const nz = s.tx;
    routeHwyA.push({ x: s.x + nx * 3.5, z: s.z + nz * 3.5, hwY: s.y });
  }
  for (let i = HIGHWAY_SAMPLES.length - 1; i >= 0; i -= 4) {
    const s = HIGHWAY_SAMPLES[i];
    const nx = -s.tz;
    const nz = s.tx;
    routeHwyB.push({ x: s.x - nx * 3.5, z: s.z - nz * 3.5, hwY: s.y });
  }

  const cityRoutes = city && city.trafficRoutes ? city.trafficRoutes : [
    [{ x: -195, z: -555 }, { x: -740, z: -610 }, { x: -740, z: -245 }, { x: -195, z: -245 }],
    [{ x: -460, z: -1075 }, { x: -920, z: -1050 }, { x: -920, z: -245 }, { x: -460, z: -245 }],
    [{ x: -190, z: -556 }, { x: -1420, z: -655 }, { x: -1420, z: -685 }, { x: -190, z: -582 }],
    [{ x: -140, z: -1650 }, { x: -140, z: -240 }, { x: -460, z: -240 }, { x: -460, z: -1650 }]
  ];

  return [...cityRoutes, routeHwyA, routeHwyB];
}

/** Creates 28 multi-LOD GTA vehicles with sculpted bodywork, autonomous city/highway traffic, police chase & carjacking. */
function createVehicleSystem(texLib, city, assetManager, lodManager) {
  const root = new THREE.Group();
  const cars = [];
  const routes = buildTrafficRoutes(city);

  const rubberMat = new THREE.MeshStandardMaterial({ color: 0x16181c, roughness: 0.88, metalness: 0.06 });
  const rimMat = new THREE.MeshStandardMaterial({ color: 0xd4dbe3, roughness: 0.22, metalness: 0.88 });
  const glassMat = new THREE.MeshStandardMaterial({ color: 0x0e1822, roughness: 0.08, metalness: 0.82 });
  const chromeMat = new THREE.MeshStandardMaterial({ color: 0xdce2ea, roughness: 0.20, metalness: 0.92 });
  const underMat = new THREE.MeshStandardMaterial({ color: 0x121418, roughness: 0.92 });
  const cargoBoxMat = new THREE.MeshStandardMaterial({ color: 0xe6e8ec, roughness: 0.64, metalness: 0.12 });
  const plateMat = new THREE.MeshStandardMaterial({ color: 0xf0e4b4, roughness: 0.5 });
  const headLightMat = new THREE.MeshBasicMaterial({ color: 0xfff8e2 });
  const driverShirtMat = new THREE.MeshStandardMaterial({ color: 0x3b6fa8, roughness: 0.8 });
  const driverSkinMat = new THREE.MeshStandardMaterial({ color: 0xe2b18c, roughness: 0.72 });

  [rubberMat, rimMat, glassMat, chromeMat, underMat, cargoBoxMat].forEach((m, i) => {
    enhancePBRMaterial(m, { cacheKey: `botw_car_shared_${i}` });
  });

  // Soft ground contact shadow decal + optional night headlight glow cone
  const shCanvas = document.createElement('canvas');
  shCanvas.width = 64;
  shCanvas.height = 128;
  const sctx = shCanvas.getContext('2d');
  const grad = sctx.createRadialGradient(32, 64, 6, 32, 64, 34);
  grad.addColorStop(0, 'rgba(0,0,0,0.68)');
  grad.addColorStop(0.65, 'rgba(0,0,0,0.34)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  sctx.fillStyle = grad;
  sctx.fillRect(0, 0, 64, 128);
  const shadowTex = new THREE.CanvasTexture(shCanvas);
  const contactShadowMat = new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false });

  const beamCanvas = document.createElement('canvas');
  beamCanvas.width = 64;
  beamCanvas.height = 128;
  const bctx = beamCanvas.getContext('2d');
  const bGrad = bctx.createLinearGradient(0, 128, 0, 0);
  bGrad.addColorStop(0.0, 'rgba(255, 244, 210, 0.42)');
  bGrad.addColorStop(0.55, 'rgba(255, 240, 195, 0.14)');
  bGrad.addColorStop(1.0, 'rgba(255, 240, 195, 0.0)');
  bctx.fillStyle = bGrad;
  bctx.beginPath();
  bctx.moveTo(22, 128);
  bctx.lineTo(42, 128);
  bctx.lineTo(64, 0);
  bctx.lineTo(0, 0);
  bctx.closePath();
  bctx.fill();
  const beamTex = new THREE.CanvasTexture(beamCanvas);
  const headlightBeamMat = new THREE.MeshBasicMaterial({
    map: beamTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.0
  });

  function createCarLOD(typeKey, paintHex) {
    const spec = ARCHETYPES[typeKey];
    const lod = new THREE.LOD();
    const tiltPivot = new THREE.Group();

    const paintMat = new THREE.MeshStandardMaterial({
      color: paintHex,
      roughness: typeKey === 'truck' ? 0.36 : 0.16,
      metalness: typeKey === 'truck' ? 0.35 : 0.78
    });
    enhancePBRMaterial(paintMat, { cacheKey: 'botw_car_paint', cloudShadows: false });

    const whiteDoorMat = new THREE.MeshStandardMaterial({ color: 0xf2f4f8, roughness: 0.20, metalness: 0.48 });
    enhancePBRMaterial(whiteDoorMat, { cacheKey: 'botw_car_pdwhite', cloudShadows: false });

    const tailMat = new THREE.MeshBasicMaterial({ color: 0xc21e1e });
    const beaconRedMat = new THREE.MeshBasicMaterial({ color: 0x330808 });
    const beaconBlueMat = new THREE.MeshBasicMaterial({ color: 0x081638 });

    const wheelY = spec.wheelR;
    const chassisBase = wheelY - 0.04;
    const halfL = spec.length * 0.5;
    const bh = spec.bodyH;
    const ch = spec.cabH;
    const bodyBaseY = chassisBase + 0.14;

    // Ground soft contact shadow + night headlight cone
    const sh = new THREE.Mesh(new THREE.PlaneGeometry(spec.width * 1.24, spec.length * 1.14), contactShadowMat);
    sh.rotation.x = -Math.PI / 2;
    sh.position.y = 0.03;
    tiltPivot.add(sh);

    const beamMesh = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 9.5), headlightBeamMat);
    beamMesh.rotation.x = -Math.PI / 2;
    beamMesh.position.set(0, 0.08, -halfL - 4.75);
    tiltPivot.add(beamMesh);

    // Dark recessed underbody + wheel well arches
    const underMesh = new THREE.Mesh(new THREE.BoxGeometry(spec.width * 0.94, 0.22, spec.length * 1.01), underMat);
    underMesh.position.y = chassisBase + 0.11;
    tiltPivot.add(underMesh);

    if (spec.isTruck) {
      // Sculpted Cab-Over Front + White Freight Cargo Box
      const cabMesh = new THREE.Mesh(new THREE.BoxGeometry(spec.width * 0.94, 1.85, 1.85), paintMat);
      cabMesh.position.set(0, chassisBase + 1.05, -halfL + 0.96);
      cabMesh.castShadow = cabMesh.receiveShadow = true;
      const ws = new THREE.Mesh(new THREE.BoxGeometry(spec.width * 0.88, 0.72, 0.08), glassMat);
      ws.position.set(0, chassisBase + 1.48, -halfL + 0.04);
      const cargo = new THREE.Mesh(new THREE.BoxGeometry(spec.width * 0.98, 2.25, spec.length - 2.15), cargoBoxMat);
      cargo.position.set(0, chassisBase + 1.32, 0.98);
      cargo.castShadow = cargo.receiveShadow = true;
      tiltPivot.add(cabMesh, ws, cargo);
    } else {
      // Sculpted aerodynamic ExtrudeGeometry automotive chassis + greenhouse
      const hoodY = bh * (typeKey === 'supercar' ? 0.56 : 0.75);
      const roofRearZ = typeKey === 'suv' ? spec.cabZ + spec.cabLen * 0.47 : spec.cabZ + spec.cabLen * 0.43;
      const roofRearY = typeKey === 'suv' ? bh + ch : bh + ch * 0.96;
      const roofFrontZ = spec.cabZ - spec.cabLen * 0.25;
      const cowlZ = -halfL * 0.27;

      const prof = new THREE.Shape();
      prof.moveTo(-halfL, 0.07);
      prof.lineTo(-halfL * 0.94, 0.0);
      prof.lineTo(halfL * 0.94, 0.0);
      prof.lineTo(halfL, 0.07);
      prof.lineTo(halfL, bh * 0.88);
      prof.lineTo(halfL * 0.76, bh);
      prof.lineTo(roofRearZ, roofRearY);
      prof.lineTo(roofFrontZ, bh + ch);
      prof.lineTo(cowlZ, bh + 0.04);
      prof.lineTo(-halfL * 0.93, hoodY);
      prof.lineTo(-halfL, bh * 0.42);
      prof.closePath();

      const bodyW = spec.width - 0.14;
      const shellGeo = new THREE.ExtrudeGeometry(prof, {
        depth: bodyW, bevelEnabled: true, bevelThickness: 0.07, bevelSize: 0.06, bevelSegments: 2
      });
      shellGeo.translate(0, 0, -bodyW * 0.5);
      shellGeo.rotateY(-Math.PI / 2);
      shellGeo.computeVertexNormals();

      const shellMesh = new THREE.Mesh(shellGeo, paintMat);
      shellMesh.position.y = bodyBaseY;
      shellMesh.castShadow = shellMesh.receiveShadow = true;
      tiltPivot.add(shellMesh);

      if (spec.isPolice) {
        const doorBand = new THREE.Mesh(new THREE.BoxGeometry(spec.width + 0.02, bh * 0.86, spec.cabLen * 0.90), whiteDoorMat);
        doorBand.position.set(0, bodyBaseY + bh * 0.46, spec.cabZ);
        const roofCap = new THREE.Mesh(new THREE.BoxGeometry(spec.width * 0.78, 0.08, spec.cabLen * 0.65), whiteDoorMat);
        roofCap.position.set(0, bodyBaseY + bh + ch + 0.04, spec.cabZ + 0.1);
        const pushBar = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.34, 0.12), underMat);
        pushBar.position.set(0, bodyBaseY + bh * 0.38, -halfL - 0.10);
        tiltPivot.add(doorBand, roofCap, pushBar);
      }

      if (spec.stripes) {
        for (const sx of [-0.18, 0.18]) {
          const st = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.03, halfL * 1.15), whiteDoorMat);
          st.position.set(sx, bodyBaseY + hoodY + 0.09, -halfL * 0.38);
          tiltPivot.add(st);
        }
      }

      const windLen = Math.hypot(roofFrontZ - cowlZ, ch - 0.04);
      const windPitch = Math.atan2(ch - 0.04, roofFrontZ - cowlZ);
      const frontGlass = new THREE.Mesh(new THREE.BoxGeometry(bodyW * 0.92, 0.06, windLen), glassMat);
      frontGlass.position.set(0, bodyBaseY + bh + ch * 0.52 + 0.05, (roofFrontZ + cowlZ) * 0.5 - 0.04);
      frontGlass.rotation.x = windPitch;

      const rearEndZ = halfL * 0.76;
      const rearGlassLen = Math.hypot(rearEndZ - roofRearZ, roofRearY - bh);
      const rearGlassPitch = -Math.atan2(roofRearY - bh, rearEndZ - roofRearZ);
      const rearGlass = new THREE.Mesh(new THREE.BoxGeometry(bodyW * 0.94, 0.07, rearGlassLen), glassMat);
      rearGlass.position.set(0, bodyBaseY + (bh + roofRearY) * 0.5 + 0.08, (roofRearZ + rearEndZ) * 0.5 + 0.05);
      rearGlass.rotation.x = rearGlassPitch;

      const sideWin = new THREE.Mesh(new THREE.BoxGeometry(bodyW + 0.15, ch * 0.66, (roofRearZ - roofFrontZ) * 1.15), glassMat);
      sideWin.position.set(0, bodyBaseY + bh + ch * 0.44, spec.cabZ);
      tiltPivot.add(frontGlass, rearGlass, sideWin);

      for (const sx of [-1, 1]) {
        const mirror = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.09, 0.12), paintMat);
        mirror.position.set(sx * (spec.width * 0.53), bodyBaseY + bh + 0.08, cowlZ - 0.05);
        tiltPivot.add(mirror);
      }
    }

    // Grille, Rear Diffuser, Twin Chrome Exhausts, License Plates, Headlights & Taillights
    const grille = new THREE.Mesh(new THREE.BoxGeometry(spec.width * 0.48, 0.19, 0.09), chromeMat);
    grille.position.set(0, bodyBaseY + bh * 0.34, -halfL - 0.04);
    const rearDiffuser = new THREE.Mesh(new THREE.BoxGeometry(spec.width * 0.88, 0.16, 0.14), underMat);
    rearDiffuser.position.set(0, bodyBaseY + 0.09, halfL + 0.04);
    const tailBezel = new THREE.Mesh(new THREE.BoxGeometry(spec.width * 0.88, 0.15, 0.08), underMat);
    tailBezel.position.set(0, bodyBaseY + bh * 0.64, halfL + 0.02);
    const rearPlate = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.18, 0.05), plateMat);
    rearPlate.position.set(0, bodyBaseY + bh * 0.32, halfL + 0.06);
    tiltPivot.add(grille, rearDiffuser, tailBezel, rearPlate);

    for (const ex of [-0.46, 0.46]) {
      const exhaustGeo = new THREE.CylinderGeometry(0.052, 0.052, 0.18, 10);
      exhaustGeo.rotateX(Math.PI * 0.5);
      const exhaust = new THREE.Mesh(exhaustGeo, chromeMat);
      exhaust.position.set(ex, bodyBaseY + 0.10, halfL + 0.07);
      tiltPivot.add(exhaust);
    }

    for (const sx of [-1, 1]) {
      const hl = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.10, 0.09), headLightMat);
      hl.position.set(sx * spec.width * 0.36, bodyBaseY + bh * 0.48, -halfL - 0.04);
      const tl = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.10, 0.09), tailMat);
      tl.position.set(sx * spec.width * 0.34, bodyBaseY + bh * 0.64, halfL + 0.05);
      tiltPivot.add(hl, tl);
    }
    const tailStrip = new THREE.Mesh(new THREE.BoxGeometry(spec.width * 0.72, 0.04, 0.08), tailMat);
    tailStrip.position.set(0, bodyBaseY + bh * 0.64, halfL + 0.05);
    tiltPivot.add(tailStrip);

    // Sports Wing / SUV Rails / Taxi Sign / Police Lightbar
    if (spec.spoiler) {
      const wing = new THREE.Mesh(new THREE.BoxGeometry(spec.width * 0.90, 0.05, 0.28), paintMat);
      wing.position.set(0, bodyBaseY + bh + 0.24, halfL * 0.88);
      tiltPivot.add(wing);
      for (const sx of [-1, 1]) {
        const st = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.24, 0.12), underMat);
        st.position.set(sx * 0.54, bodyBaseY + bh + 0.12, halfL * 0.88);
        tiltPivot.add(st);
      }
    }
    if (spec.roofRails) {
      for (const sx of [-1, 1]) {
        const rail = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.08, spec.cabLen * 0.80), chromeMat);
        rail.position.set(sx * spec.width * 0.33, bodyBaseY + bh + ch + 0.08, spec.cabZ);
        tiltPivot.add(rail);
      }
    }
    if (spec.isTaxi) {
      const taxiTop = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.20, 0.26), new THREE.MeshBasicMaterial({ color: 0xffe466 }));
      taxiTop.position.set(0, bodyBaseY + bh + ch + 0.12, spec.cabZ - 0.1);
      tiltPivot.add(taxiTop);
    }
    if (spec.isPolice) {
      const barBase = new THREE.Mesh(new THREE.BoxGeometry(spec.width * 0.62, 0.08, 0.26), underMat);
      barBase.position.set(0, bodyBaseY + bh + ch + 0.08, spec.cabZ - 0.1);
      const redPod = new THREE.Mesh(new THREE.BoxGeometry(spec.width * 0.26, 0.11, 0.22), beaconRedMat);
      redPod.position.set(-spec.width * 0.16, bodyBaseY + bh + ch + 0.13, spec.cabZ - 0.1);

      bluePod.position.set(spec.width * 0.16, bodyBaseY + bh + ch + 0.13, spec.cabZ - 0.1);
      tiltPivot.add(barBase, redPod, bluePod);

    const flameMat = new THREE.MeshBasicMaterial({ color: 0x48e8ff, transparent: true, opacity: 0.9 });

    const zFront = -spec.length * 0.31;
    const zRear = spec.length * 0.31;
    const xWheel = spec.width * 0.47;

    [
      { x: -xWheel, z: zFront, front: true },

      { x: -xWheel, z: zRear, front: false },
      { x: xWheel, z: zRear, front: false }
    ].forEach((w) => {
      const wGrp = new THREE.Group();
      const tire = new THREE.Mesh(tireGeo, rubberMat);
      tire.castShadow = true;
      const hub = new THREE.Mesh(hubGeo, rimMat);
      wGrp.add(tire, hub);
      wheelMeshes.push(wGrp);

      if (w.front) {
        const steerPivot = new THREE.Group();
        steerPivot.position.set(w.x, wheelY, w.z);
        steerPivot.add(wGrp);
        tiltPivot.add(steerPivot);
        frontPivots.push(steerPivot);
      } else {
        wGrp.position.set(w.x, wheelY, w.z);
        tiltPivot.add(wGrp);
      }
    });

    // LOD1 (95..240m): Clean simplified silhouette (chassis + cab)
    const lod1Group = new THREE.Group();
    const l1Body = new THREE.Mesh(new THREE.BoxGeometry(spec.width * 0.96, bh + 0.15, spec.length * 0.98), paintMat);
    l1Body.position.y = chassisBase + bh * 0.5 + 0.1;
    const l1Cab = new THREE.Mesh(new THREE.BoxGeometry(spec.width * 0.84, ch + 0.1, spec.cabLen), glassMat);
    l1Cab.position.set(0, chassisBase + bh + ch * 0.5, spec.cabZ);
    lod1Group.add(l1Body, l1Cab);

    // LOD2 (> 240m): Single colored hull proxy (4-corner city/highway traffic from overlooks!)
    const lod2Group = new THREE.Group();
    const l2Hull = new THREE.Mesh(new THREE.BoxGeometry(spec.width, bh + ch * 0.85, spec.length), paintMat);
    l2Hull.position.y = chassisBase + (bh + ch * 0.85) * 0.5;
    lod2Group.add(l2Hull);

    lod.addLevel(tiltPivot, 0);
    lod.addLevel(lod1Group, 95);
    lod.addLevel(lod2Group, 240);
    root.add(lod);
    if (lodManager) lodManager.addLODObject(lod);

    return {
      carGrp: lod,
      tiltPivot,
      frontPivots,
      wheelMeshes,
      tailMat,
      beaconRedMat,
      beaconBlueMat,
      flames,
      driverMesh
    };
  }

  // Spawn 28 GTA Vehicles: 13 City AI + 7 Highway AI + 5 Curated Parked Hero Cars + 3 Police Interceptors
  const spawnList = [
    // City AI Traffic (Routes 0..3)
    { type: 'supercar', color: 0xd41e26, route: 0, wp: 0, t: 0.15, ai: true },
    { type: 'sedan',    color: 0xb8c2cc, route: 0, wp: 1, t: 0.45, ai: true },
    { type: 'suv',      color: 0x2a4d6e, route: 0, wp: 2, t: 0.35, ai: true },
    { type: 'taxi',     color: 0xeeb422, route: 0, wp: 3, t: 0.55, ai: true },
    { type: 'muscle',   color: 0xe68822, route: 1, wp: 0, t: 0.25, ai: true },
    { type: 'truck',    color: 0x3b5878, route: 1, wp: 1, t: 0.60, ai: true },
    { type: 'sedan',    color: 0x1e2228, route: 1, wp: 2, t: 0.40, ai: true },
    { type: 'taxi',     color: 0xeeb422, route: 2, wp: 0, t: 0.22, ai: true },
    { type: 'suv',      color: 0xdadce0, route: 2, wp: 1, t: 0.50, ai: true },
    { type: 'muscle',   color: 0x266248, route: 2, wp: 2, t: 0.35, ai: true },
    { type: 'sedan',    color: 0x623648, route: 3, wp: 0, t: 0.30, ai: true },
    { type: 'truck',    color: 0x823028, route: 3, wp: 1, t: 0.48, ai: true },
    { type: 'taxi',     color: 0xeeb422, route: 3, wp: 2, t: 0.62, ai: true },

    // Ring Highway Cruisers (last 2 routes = Ring Expressway outer & inner loops)
    { type: 'supercar', color: 0xf0c224, route: routes.length - 2, wp: 2,  t: 0.30, ai: true },
    { type: 'sedan',    color: 0x385a82, route: routes.length - 2, wp: 12, t: 0.40, ai: true },
    { type: 'truck',    color: 0x2b3e50, route: routes.length - 2, wp: 24, t: 0.50, ai: true },
    { type: 'suv',      color: 0xc2c8d0, route: routes.length - 2, wp: 36, t: 0.20, ai: true },
    { type: 'muscle',   color: 0x982026, route: routes.length - 1, wp: 6,  t: 0.35, ai: true },
    { type: 'sedan',    color: 0x526458, route: routes.length - 1, wp: 20, t: 0.45, ai: true },
    { type: 'supercar', color: 0xe8e8ec, route: routes.length - 1, wp: 38, t: 0.55, ai: true },

    // 5 Parked Stealable Hero Cars at Key City Landmarks (Citadel Blvd, Waterfront Marina, Midtown)
    { type: 'supercar', color: 0x1c68d8, x: -324.0, z: -551.8, yaw: -Math.PI * 0.5 + 0.08, ai: false },
    { type: 'muscle',   color: 0xcc2228, x: -162.0, z: -552.0, yaw: 0.0, ai: false },
    { type: 'suv',      color: 0x2a2e36, x: -460.0, z: -566.0, yaw: 0.25, ai: false },
    { type: 'taxi',     color: 0xeeb422, x: -346.0, z: -550.2, yaw: Math.PI * 0.5 + 0.08, ai: false },
    { type: 'sedan',    color: 0xbec6cf, x: -740.0, z: -598.0, yaw: 0.0, ai: false },

    // 3 LSPD Police Interceptors
    { type: 'police', color: 0x141820, route: 0, wp: 2,  t: 0.70, ai: true },
    { type: 'police', color: 0x141820, route: 3, wp: 3,  t: 0.25, ai: true },
    { type: 'police', color: 0x141820, route: routes.length - 1, wp: 18, t: 0.30, ai: true }
  ];

  spawnList.forEach((cfg, idx) => {
    const spec = ARCHETYPES[cfg.type];
    const visuals = createCarLOD(cfg.type, cfg.color);
    let pos, yaw;
    if (cfg.route !== undefined) {
      const r = routes[cfg.route];
      const wpIdx0 = cfg.wp % r.length;
      const a = r[wpIdx0];
      const b = r[(wpIdx0 + 1) % r.length];
      const wx = a.x + (b.x - a.x) * cfg.t;
      const wz = a.z + (b.z - a.z) * cfg.t;
      pos = new THREE.Vector3(wx, getCityGroundY(wx, wz), wz);
      yaw = Math.atan2(-(b.x - a.x), -(b.z - a.z));
    } else {
      pos = new THREE.Vector3(cfg.x, getCityGroundY(cfg.x, cfg.z), cfg.z);
      yaw = cfg.yaw;
    }

    visuals.driverMesh.visible = cfg.ai;
    visuals.carGrp.position.copy(pos);
    visuals.carGrp.rotation.y = yaw;

    cars.push({
      id: `car_${idx}`,
      type: cfg.type,
      spec,
      ...visuals,
      pos,
      yaw,
      steerAngle: 0,
      speed: 0,
      wheelSpin: 0,
      hp: 260,
      hasAiDriver: cfg.ai,
      isPlayerDriven: false,
      routeIdx: cfg.route ?? 0,
      wpIdx: ((cfg.wp ?? 0) + 1) % routes[cfg.route ?? 0].length,
      stunTimer: 0,
      shakeTimer: 0
    });
  });

  // Pooled Tire Dust / Burnout Smoke Particles
  const DUST_COUNT = 80;
  const dustPos = new Float32Array(DUST_COUNT * 3);
  const dustAge = new Float32Array(DUST_COUNT).fill(1);
  const dustGeo = new THREE.BufferGeometry();
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
  dustGeo.setAttribute('aAge', new THREE.BufferAttribute(dustAge, 1));
  const dustMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    fog: false,
    vertexShader: /* glsl */`
      attribute float aAge;
      varying float vAge;
      void main() {
        vAge = aAge;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aAge < 0.98 ? clamp((14.0 + aAge * 26.0) / max(-mv.z, 1.0), 2.0, 18.0) : 0.0;
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: /* glsl */`
      varying float vAge;
      void main() {
        if (vAge >= 0.98) discard;
        float d = length(gl_PointCoord - 0.5) * 2.0;
        if (d > 1.0) discard;
        float a = (1.0 - d) * (1.0 - vAge) * 0.42;
        gl_FragColor = vec4(0.76, 0.75, 0.72, a);
      }
    `
  });
  const dustPoints = new THREE.Points(dustGeo, dustMat);
  dustPoints.frustumCulled = false;
  root.add(dustPoints);
  let dustCursor = 0;

  function emitDust(x, y, z) {
    dustPos[dustCursor * 3] = x + (Math.random() - 0.5) * 0.45;
    dustPos[dustCursor * 3 + 1] = y + 0.18;
    dustPos[dustCursor * 3 + 2] = z + (Math.random() - 0.5) * 0.45;
    dustAge[dustCursor] = 0.02;
    dustCursor = (dustCursor + 1) % DUST_COUNT;
  }

  function resolveCarBuildingCollisions(car) {
    const rad = car.spec.width * 0.52;
    for (let i = 0; i < city.colliders.length; i++) {
      const c = city.colliders[i];
      if (car.pos.x + rad > c.minX && car.pos.x - rad < c.maxX && car.pos.z + rad > c.minZ && car.pos.z - rad < c.maxZ) {
        const dl = Math.abs(car.pos.x - c.minX);
        const dr = Math.abs(c.maxX - car.pos.x);
        const dt = Math.abs(car.pos.z - c.minZ);
        const db = Math.abs(c.maxZ - car.pos.z);
        const m = Math.min(dl, dr, dt, db);
        if (m === dl) car.pos.x = c.minX - rad;
        else if (m === dr) car.pos.x = c.maxX + rad;
        else if (m === dt) car.pos.z = c.minZ - rad;
        else car.pos.z = c.maxZ + rad;
        car.speed *= -0.28;
        car.shakeTimer = 0.25;
      }
    }
  }

  function alignCarToTerrain(car, dt) {
    const cy = getCityGroundY(car.pos.x, car.pos.z);
    car.pos.y = cy;

    const sinY = Math.sin(car.yaw);
    const cosY = Math.cos(car.yaw);
    const fX = car.pos.x - sinY * 1.4;
    const fZ = car.pos.z - cosY * 1.4;
    const rX = car.pos.x + sinY * 1.4;
    const rZ = car.pos.z + cosY * 1.4;
    const rightX = car.pos.x + cosY * 0.85;
    const rightZ = car.pos.z - sinY * 0.85;
    const leftX = car.pos.x - cosY * 0.85;
    const leftZ = car.pos.z + sinY * 0.85;

    const pitch = clamp((getCityGroundY(fX, fZ) - getCityGroundY(rX, rZ)) / 2.8, -0.45, 0.45);
    const roll = clamp((getCityGroundY(leftX, leftZ) - getCityGroundY(rightX, rightZ)) / 1.7, -0.35, 0.35);

    const speedRatio = clamp(Math.abs(car.speed) / car.spec.topSpeed, 0, 1);
    const bodyRoll = -car.steerAngle * speedRatio * 0.095;
    const shake = car.shakeTimer > 0 ? Math.sin(performance.now() * 0.05) * 0.04 : 0;

    car.tiltPivot.rotation.x = THREE.MathUtils.lerp(car.tiltPivot.rotation.x, pitch + shake, Math.min(1, 10 * dt));
    car.tiltPivot.rotation.z = THREE.MathUtils.lerp(car.tiltPivot.rotation.z, roll + bodyRoll, Math.min(1, 10 * dt));
  }

  function findNearestCar(pos, maxDist = 5.8) {
    let best = null;
    let bestDist = maxDist;
    for (let i = 0; i < cars.length; i++) {
      const car = cars[i];
      if (car.isPlayerDriven) continue;
      const d = Math.hypot(car.pos.x - pos.x, car.pos.z - pos.z);
      if (d < bestDist) {
        bestDist = d;
        best = car;
      }
    }
    return best ? { car: best, dist: bestDist } : null;
  }

  function enterOrRobCar(car) {
    if (!car) return { stolen: false };
    const wasAi = car.hasAiDriver;
    if (wasAi) {
      city.spawnFleeingDriver(car.pos.x, car.pos.z, car.yaw);
      city.panicNear(car.pos.x, car.pos.z, 18.0);
      car.hasAiDriver = false;
    }
    car.isPlayerDriven = true;
    car.driverMesh.visible = true;
    car.stunTimer = 0;
    car.speed = Math.min(car.speed, 6.0);
    return { stolen: wasAi, label: car.spec.label };
  }

  function exitCar(car) {
    if (!car) return null;
    car.isPlayerDriven = false;
    car.driverMesh.visible = false;
    car.flames.forEach((f) => { f.visible = false; });
    const cosY = Math.cos(car.yaw);
    const sinY = Math.sin(car.yaw);
    const ex = car.pos.x - cosY * 2.25;
    const ez = car.pos.z + sinY * 2.25;
    return new THREE.Vector3(ex, getCityGroundY(ex, ez), ez);
  }

  function damageCar(car, dmg = 25, impactDir = null) {
    if (!car) return;
    car.hp = Math.max(0, car.hp - dmg);
    car.shakeTimer = 0.35;
    if (car.hasAiDriver) {
      car.hasAiDriver = false;
      car.driverMesh.visible = false;
      car.speed *= 0.2;
      city.spawnFleeingDriver(car.pos.x, car.pos.z, car.yaw);
      city.panicNear(car.pos.x, car.pos.z, 16.0);
    } else if (impactDir) {
      car.pos.x += impactDir.x * 0.25;
      car.pos.z += impactDir.z * 0.25;
    }
  }

  function update(dt, time, driveInput, playerState, wantedStars, callbacks = {}) {
    const night = ATMO_UNIFORMS.uNightFactor.value;
    headlightBeamMat.opacity = night > 0.22 ? clamp((night - 0.22) * 1.1, 0, 0.72) : 0.0;

    for (let i = 0; i < DUST_COUNT; i++) {
      if (dustAge[i] < 1.0) {
        dustAge[i] = Math.min(1.0, dustAge[i] + dt * 1.6);
        dustPos[i * 3 + 1] += dt * 0.9;
      }
    }
    dustGeo.attributes.position.needsUpdate = true;
    dustGeo.attributes.aAge.needsUpdate = true;

    for (let i = 0; i < cars.length; i++) {
      const car = cars[i];
      if (car.shakeTimer > 0) car.shakeTimer = Math.max(0, car.shakeTimer - dt);
      if (car.stunTimer > 0) car.stunTimer = Math.max(0, car.stunTimer - dt);

      if (car.spec.isPolice) {
        const sirenActive = wantedStars > 0 && (car.hasAiDriver || car.isPlayerDriven);
        if (sirenActive) {
          const redPhase = Math.floor(time * 9.0) % 2 === 0;
          car.beaconRedMat.color.setHex(redPhase ? 0xff2424 : 0x260606);
          car.beaconBlueMat.color.setHex(redPhase ? 0x061430 : 0x2e8eff);
        } else {
          car.beaconRedMat.color.setHex(0x400a0a);
          car.beaconBlueMat.color.setHex(0x0a1c42);
        }
      }

      if (car.isPlayerDriven) {
        const throttle = driveInput.throttle;
        const steer = driveInput.steer;
        const handbrake = driveInput.handbrake;
        const nitro = driveInput.nitro && throttle > 0.1;

        const maxFwd = nitro ? car.spec.topSpeed * 1.32 : car.spec.topSpeed;
        const accelForce = nitro ? car.spec.accel * 1.55 : car.spec.accel;

        if (handbrake) {
          car.speed = THREE.MathUtils.lerp(car.speed, 0, Math.min(1, 2.8 * dt));
        } else if (throttle > 0.05) {
          car.speed = Math.min(maxFwd, car.speed + accelForce * throttle * dt);
        } else if (throttle < -0.05) {
          if (car.speed > 1.0) car.speed = Math.max(0, car.speed - 36.0 * dt);
          else car.speed = Math.max(-16.0, car.speed + 18.0 * throttle * dt);
        } else {
          car.speed *= Math.pow(0.28, dt);
          if (Math.abs(car.speed) < 0.05) car.speed = 0;
        }

        car.steerAngle = THREE.MathUtils.lerp(car.steerAngle, -steer * 0.46, Math.min(1, 9.0 * dt));
        const speedTurnFactor = clamp(Math.abs(car.speed) / 6.5, 0, 1);
        const dirSign = car.speed >= -0.1 ? 1 : -1;
        const driftBoost = handbrake && Math.abs(car.speed) > 6.0 ? 1.45 : 1.0;
        car.yaw += car.steerAngle * car.spec.turnRate * speedTurnFactor * dirSign * driftBoost * dt;

        car.pos.x -= Math.sin(car.yaw) * car.speed * dt;
        car.pos.z -= Math.cos(car.yaw) * car.speed * dt;
        car.pos.x = clamp(car.pos.x, -5600, 5600);
        car.pos.z = clamp(car.pos.z, -5600, 5600);

        car.flames.forEach((fl) => {
          fl.visible = nitro;
          if (nitro) fl.scale.z = 0.8 + Math.sin(time * 40.0) * 0.28;
        });
        if ((handbrake && Math.abs(car.speed) > 7.0) || (nitro && Math.random() < 0.45)) {
          emitDust(car.pos.x, car.pos.y, car.pos.z);
        }
        car.tailMat.color.setHex((throttle < -0.05 || handbrake) ? 0xff3b30 : 0x9e1818);

        const absSpd = Math.abs(car.speed);
        if (absSpd > 6.5) {
          const hitDir = new THREE.Vector3(-Math.sin(car.yaw), 0, -Math.cos(car.yaw)).multiplyScalar(car.speed >= 0 ? 1 : -1);
          for (let n = 0; n < city.npcs.length; n++) {
            const npc = city.npcs[n];
            if (npc.state === 'down' || npc.state === 'standby') continue;
            if (Math.hypot(npc.pos.x - car.pos.x, npc.pos.z - car.pos.z) < 2.2) {
              const ko = city.damageNpc(npc, absSpd * 3.5, hitDir, callbacks);
              if (ko && callbacks.onCrime) callbacks.onCrime(npc.role === 'police' ? 2 : 1);
            }
          }
        }
      } else if (car.hasAiDriver && car.stunTimer <= 0) {
        let targetX, targetZ;
        const isHighway = car.routeIdx >= routes.length - 2;
        let targetCruise = car.spec.isPolice && wantedStars > 0 ? 25.0 : isHighway ? 20.0 : 12.5;

        if (car.spec.isPolice && wantedStars > 0) {
          targetX = playerState.pos.x;
          targetZ = playerState.pos.z;
          const distP = Math.hypot(targetX - car.pos.x, targetZ - car.pos.z);
          if (distP < 5.5) targetCruise = 2.5;
        } else {
          const route = routes[car.routeIdx];
          const wp = route[car.wpIdx];
          targetX = wp.x;
          targetZ = wp.z;
          if (Math.hypot(targetX - car.pos.x, targetZ - car.pos.z) < 4.8) {
            car.wpIdx = (car.wpIdx + 1) % route.length;
          }
        }

        const desiredYaw = Math.atan2(-(targetX - car.pos.x), -(targetZ - car.pos.z));
        let diff = desiredYaw - car.yaw;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        car.yaw += clamp(diff, -2.1 * dt, 2.1 * dt);
        car.steerAngle = clamp(diff * 0.65, -0.4, 0.4);

        let blocked = false;
        const fwdX = -Math.sin(car.yaw);
        const fwdZ = -Math.cos(car.yaw);

        const dPlayer = Math.hypot(playerState.pos.x - car.pos.x, playerState.pos.z - car.pos.z);
        if (!car.spec.isPolice && !playerState.inVehicle && dPlayer < 7.0) {
          const dotP = ((playerState.pos.x - car.pos.x) * fwdX + (playerState.pos.z - car.pos.z) * fwdZ) / Math.max(dPlayer, 0.01);
          if (dotP > 0.65) blocked = true;
        }
        for (let j = 0; j < cars.length; j++) {
          if (j === i) continue;
          const other = cars[j];
          const dOther = Math.hypot(other.pos.x - car.pos.x, other.pos.z - car.pos.z);
          if (dOther < 9.0) {
            const dotO = ((other.pos.x - car.pos.x) * fwdX + (other.pos.z - car.pos.z) * fwdZ) / Math.max(dOther, 0.01);
            if (dotO > 0.72) blocked = true;
          }
        }

        const wantSpd = blocked ? 0.0 : targetCruise;
        car.speed = THREE.MathUtils.lerp(car.speed, wantSpd, Math.min(1, (blocked ? 5.5 : 2.5) * dt));
        car.pos.x += fwdX * car.speed * dt;
        car.pos.z += fwdZ * car.speed * dt;
        car.tailMat.color.setHex(blocked ? 0xff3b30 : 0x9e1818);
      } else {
        car.speed *= Math.pow(0.15, dt);
        car.pos.x -= Math.sin(car.yaw) * car.speed * dt;
        car.pos.z -= Math.cos(car.yaw) * car.speed * dt;
        car.steerAngle = THREE.MathUtils.lerp(car.steerAngle, 0, Math.min(1, 5.0 * dt));
        car.tailMat.color.setHex(0x8a1818);
      }

      resolveCarBuildingCollisions(car);
      alignCarToTerrain(car, dt);

      car.wheelSpin += (car.speed / car.spec.wheelR) * dt;
      for (let w = 0; w < car.wheelMeshes.length; w++) {
        car.wheelMeshes[w].rotation.x = -car.wheelSpin;
      }
      for (let fp = 0; fp < car.frontPivots.length; fp++) {
        car.frontPivots[fp].rotation.y = car.steerAngle;
      }

      car.carGrp.position.copy(car.pos);
      car.carGrp.rotation.y = car.yaw;
    }

    // Soft car-to-car bumper elastic separation
    for (let i = 0; i < cars.length; i++) {
      for (let j = i + 1; j < cars.length; j++) {
        const a = cars[i];
        const b = cars[j];
        const dx = b.pos.x - a.pos.x;
        const dz = b.pos.z - a.pos.z;
        const d = Math.hypot(dx, dz);
        const minD = 3.2;
        if (d > 0.01 && d < minD) {
          const push = (minD - d) * 0.5;
          const nx = dx / d;
          const nz = dz / d;
          a.pos.x -= nx * push;
          a.pos.z -= nz * push;
          b.pos.x += nx * push;
          b.pos.z += nz * push;
          a.pos.y = getCityGroundY(a.pos.x, a.pos.z);
          b.pos.y = getCityGroundY(b.pos.x, b.pos.z);
          a.carGrp.position.copy(a.pos);
          b.carGrp.position.copy(b.pos);
        }
      }
    }
  }

  return {
    root,
    cars,
    findNearestCar,
    enterOrRobCar,
    exitCar,
    damageCar,
    update
  };
}

// ==================== combat.js ====================
/**
 * Creates the BotW x GTA combat & crime systems:
 * - 3-hit melee sword combo with animated 3D energy crescent
 * - 360-degree stamina spin attack with expanding golden-cyan shockwave ring
 * - Sheikah Energy Bolt projectile shots (on-foot & GTA car drive-by!)
 * - Pooled spark bursts, player health/wanted stars/cash tracking
 */
function createCombatSystem(scene, adventurer, city, vehicles) {
  const root = new THREE.Group();
  scene.add(root);

  const state = {
    health: 100,
    maxHealth: 100,
    cash: 0,
    wantedStars: 0,
    wantedDecay: 0,
    cameraShake: 0,
    invulnTimer: 0,
    attackTimer: 0,
    attackDuration: 0,
    attackMode: 'none', // 'combo1' | 'combo2' | 'combo3' | 'spin'
    comboIndex: 0,
    comboResetTimer: 0,
    hitApplied: false,
    shotCooldown: 0
  };

  // Expanding 360 Spin Shockwave Ring
  const waveMat = new THREE.MeshBasicMaterial({
    color: 0x62f2ff,
    transparent: true,
    opacity: 0,
    side: THREE.DoubleSide,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const shockRing = new THREE.Mesh(new THREE.RingGeometry(0.65, 1.0, 32), waveMat);
  shockRing.rotation.x = -Math.PI / 2;
  shockRing.visible = false;
  root.add(shockRing);
  let shockAge = 0;

  // Pooled Energy Bolt Projectiles
  const bolts = [];
  const boltGeo = new THREE.SphereGeometry(0.18, 10, 8);
  boltGeo.scale(0.85, 0.85, 2.2);
  const boltMat = new THREE.MeshBasicMaterial({ color: 0x6ef4ff });
  const boltHaloMat = new THREE.MeshBasicMaterial({
    color: 0xffd268,
    transparent: true,
    opacity: 0.65,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  for (let i = 0; i < 16; i++) {
    const m = new THREE.Group();
    const core = new THREE.Mesh(boltGeo, boltMat);
    const halo = new THREE.Mesh(new THREE.SphereGeometry(0.32, 8, 6), boltHaloMat);
    m.add(core, halo);
    m.visible = false;
    root.add(m);
    bolts.push({ mesh: m, pos: new THREE.Vector3(), vel: new THREE.Vector3(), life: 0, active: false });
  }

  // Pooled Hit Spark Particles
  const SPARK_MAX = 96;
  const sparkPos = new Float32Array(SPARK_MAX * 3);
  const sparkVel = new Float32Array(SPARK_MAX * 3);
  const sparkLife = new Float32Array(SPARK_MAX).fill(1.0);
  const sparkGeo = new THREE.BufferGeometry();
  sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
  sparkGeo.setAttribute('aLife', new THREE.BufferAttribute(sparkLife, 1));
  const sparkMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    fog: false,
    vertexShader: /* glsl */`
      attribute float aLife;
      varying float vLife;
      void main() {
        vLife = aLife;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aLife < 0.98 ? clamp((18.0 * (1.0 - aLife)) / max(-mv.z, 1.0), 2.0, 14.0) : 0.0;
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: /* glsl */`
      varying float vLife;
      void main() {
        if (vLife >= 0.98) discard;
        float d = length(gl_PointCoord - 0.5) * 2.0;
        if (d > 1.0) discard;
        vec3 col = mix(vec3(0.45, 0.96, 1.25), vec3(1.2, 0.85, 0.25), vLife);
        gl_FragColor = vec4(col, (1.0 - d) * (1.0 - vLife));
      }
    `
  });
  const sparkPoints = new THREE.Points(sparkGeo, sparkMat);
  sparkPoints.frustumCulled = false;
  root.add(sparkPoints);
  let sparkCursor = 0;

  function emitSparks(pos, count = 12) {
    for (let i = 0; i < count; i++) {
      const idx = sparkCursor;
      sparkPos[idx * 3] = pos.x;
      sparkPos[idx * 3 + 1] = pos.y + 0.9;
      sparkPos[idx * 3 + 2] = pos.z;
      const a = Math.random() * Math.PI * 2;
      const sp = 3.5 + Math.random() * 6.5;
      sparkVel[idx * 3] = Math.cos(a) * sp;
      sparkVel[idx * 3 + 1] = 2.0 + Math.random() * 5.0;
      sparkVel[idx * 3 + 2] = Math.sin(a) * sp;
      sparkLife[idx] = 0.02;
      sparkCursor = (sparkCursor + 1) % SPARK_MAX;
    }
  }

  function addWanted(amount = 1) {
    state.wantedStars = clamp(state.wantedStars + amount, 0, 5);
    state.wantedDecay = 22.0;
  }

  function rewardNpcKo(npc) {
    state.cash += npc.cashReward || 25;
    if (npc.role === 'police') addWanted(2);
    else if (npc.role === 'civilian') addWanted(1);
    else state.wantedDecay = Math.max(state.wantedDecay, 8.0);
  }

  function triggerLightAttack(player, callbacks = {}) {
    if (player.inVehicle) {
      return triggerEnergyShot(player, player.yaw, callbacks);
    }
    if (state.attackTimer > 0.14) return false;
    state.comboIndex = state.comboResetTimer > 0 ? (state.comboIndex % 3) + 1 : 1;
    state.comboResetTimer = 0.85;
    state.attackMode = `combo${state.comboIndex}`;
    state.attackDuration = state.comboIndex === 3 ? 0.38 : 0.30;
    state.attackTimer = state.attackDuration;
    state.hitApplied = false;
    if (callbacks.onSlash) callbacks.onSlash(state.comboIndex);
    return true;
  }

  function triggerSpinAttack(player, callbacks = {}) {
    if (player.inVehicle || player.stamina < 0.25 || player.exhausted) return false;
    if (state.attackTimer > 0.12) return false;
    player.stamina = Math.max(0, player.stamina - 0.28);
    if (player.stamina <= 0.02) player.exhausted = true;

    state.attackMode = 'spin';
    state.attackDuration = 0.48;
    state.attackTimer = 0.48;
    state.hitApplied = false;
    shockRing.position.set(player.pos.x, player.pos.y + 0.15, player.pos.z);
    shockRing.scale.set(0.4, 0.4, 0.4);
    shockRing.visible = true;
    shockAge = 0.01;
    if (callbacks.onSpin) callbacks.onSpin();
    return true;
  }

  function triggerEnergyShot(player, aimYaw, callbacks = {}) {
    if (state.shotCooldown > 0) return false;
    state.shotCooldown = 0.26;
    const b = bolts.find((x) => !x.active) || bolts[0];
    b.active = true;
    b.life = 1.35;
    const sinY = Math.sin(aimYaw);
    const cosY = Math.cos(aimYaw);
    const originY = player.pos.y + (player.inVehicle ? 1.15 : 1.35);
    b.pos.set(player.pos.x - sinY * 1.4, originY, player.pos.z - cosY * 1.4);
    b.vel.set(-sinY * 68.0, -2.5, -cosY * 68.0);
    b.mesh.position.copy(b.pos);
    b.mesh.rotation.y = aimYaw;
    b.mesh.visible = true;
    city.panicNear(player.pos.x, player.pos.z, 15.0);
    if (callbacks.onBolt) callbacks.onBolt();
    return true;
  }

  function applyMeleeStrike(player, range, dmg, is360, callbacks = {}) {
    const fwdX = -Math.sin(player.yaw);
    const fwdZ = -Math.cos(player.yaw);
    let landed = false;

    for (let i = 0; i < city.npcs.length; i++) {
      const npc = city.npcs[i];
      if (npc.state === 'down' || npc.state === 'standby') continue;
      const dx = npc.pos.x - player.pos.x;
      const dz = npc.pos.z - player.pos.z;
      const dist = Math.hypot(dx, dz);
      if (dist > range) continue;
      if (!is360 && dist > 0.35) {
        const dot = (dx * fwdX + dz * fwdZ) / dist;
        if (dot < -0.15) continue;
      }
      const knock = new THREE.Vector3(dx, 0, dz).normalize();
      const ko = city.damageNpc(npc, dmg, knock, {
        onNpcKo: (koNpc) => {
          rewardNpcKo(koNpc);
          if (callbacks.onKill) callbacks.onKill(koNpc);
        }
      });
      if (!ko && npc.role === 'police') addWanted(1);
      emitSparks(npc.pos, 14);
      landed = true;
    }

    for (let i = 0; i < vehicles.cars.length; i++) {
      const car = vehicles.cars[i];
      if (car.isPlayerDriven) continue;
      const dx = car.pos.x - player.pos.x;
      const dz = car.pos.z - player.pos.z;
      const dist = Math.hypot(dx, dz);
      if (dist < range + 0.9) {
        vehicles.damageCar(car, dmg, new THREE.Vector3(dx, 0, dz).normalize());
        addWanted(1);
        emitSparks(car.pos, 10);
        landed = true;
      }
    }

    if (landed) {
      state.cameraShake = is360 ? 0.32 : 0.18;
      if (callbacks.onImpact) callbacks.onImpact();
    }
    city.panicNear(player.pos.x, player.pos.z, 12.0);
  }

  function update(dt, player, callbacks = {}) {
    state.shotCooldown = Math.max(0, state.shotCooldown - dt);
    state.comboResetTimer = Math.max(0, state.comboResetTimer - dt);
    state.invulnTimer = Math.max(0, state.invulnTimer - dt);
    state.cameraShake = Math.max(0, state.cameraShake - dt * 1.4);

    if (state.wantedStars > 0) {
      state.wantedDecay -= dt;
      if (state.wantedDecay <= 0) {
        state.wantedStars = Math.max(0, state.wantedStars - 1);
        state.wantedDecay = state.wantedStars > 0 ? 16.0 : 0.0;
      }
    } else {
      state.health = Math.min(state.maxHealth, state.health + dt * 3.0);
    }

    // Update Hit Sparks
    for (let i = 0; i < SPARK_MAX; i++) {
      if (sparkLife[i] < 1.0) {
        sparkLife[i] = Math.min(1.0, sparkLife[i] + dt * 2.2);
        sparkPos[i * 3] += sparkVel[i * 3] * dt;
        sparkPos[i * 3 + 1] += sparkVel[i * 3 + 1] * dt;
        sparkPos[i * 3 + 2] += sparkVel[i * 3 + 2] * dt;
        sparkVel[i * 3 + 1] -= 14.0 * dt;
      }
    }
    sparkGeo.attributes.position.needsUpdate = true;
    sparkGeo.attributes.aLife.needsUpdate = true;

    // Update Spin Shockwave Ring
    if (shockRing.visible) {
      shockAge += dt * 2.2;
      const sc = 0.6 + shockAge * 5.2;
      shockRing.scale.set(sc, sc, sc);
      waveMat.opacity = Math.max(0, (1.0 - shockAge) * 0.85);
      if (shockAge >= 1.0) shockRing.visible = false;
    }

    // Update Energy Bolt Projectiles
    for (let i = 0; i < bolts.length; i++) {
      const b = bolts[i];
      if (!b.active) continue;
      b.life -= dt;
      b.pos.addScaledVector(b.vel, dt);
      b.mesh.position.copy(b.pos);

      let hit = b.life <= 0 || b.pos.y <= getCityGroundY(b.pos.x, b.pos.z) + 0.15;
      if (!hit) {
        for (let c = 0; c < city.colliders.length; c++) {
          const box = city.colliders[c];
          if (b.pos.x > box.minX && b.pos.x < box.maxX && b.pos.z > box.minZ && b.pos.z < box.maxZ && b.pos.y < box.maxY) {
            hit = true;
            break;
          }
        }
      }
      if (!hit) {
        for (let n = 0; n < city.npcs.length; n++) {
          const npc = city.npcs[n];
          if (npc.state === 'down' || npc.state === 'standby') continue;
          if (Math.hypot(npc.pos.x - b.pos.x, npc.pos.z - b.pos.z) < 1.15 && Math.abs(b.pos.y - (npc.pos.y + 1.0)) < 1.3) {
            const ko = city.damageNpc(npc, 45, b.vel.clone().normalize(), {
              onNpcKo: (koNpc) => {
                rewardNpcKo(koNpc);
                if (callbacks.onKill) callbacks.onKill(koNpc);
              }
            });
            if (!ko && npc.role === 'police') addWanted(1);
            if (callbacks.onImpact) callbacks.onImpact();
            hit = true;
            break;
          }
        }
      }
      if (!hit) {
        for (let k = 0; k < vehicles.cars.length; k++) {
          const car = vehicles.cars[k];
          if (car.isPlayerDriven) continue;
          if (Math.hypot(car.pos.x - b.pos.x, car.pos.z - b.pos.z) < 1.9 && Math.abs(b.pos.y - (car.pos.y + 0.9)) < 1.3) {
            vehicles.damageCar(car, 35, b.vel.clone().normalize());
            addWanted(1);
            if (callbacks.onImpact) callbacks.onImpact();
            hit = true;
            break;
          }
        }
      }
      if (hit) {
        emitSparks(b.pos, 10);
        b.active = false;
        b.mesh.visible = false;
      }
    }

    // Animate Sword Swings & Crescent Arc
    if (state.attackTimer > 0 && !player.inVehicle) {
      state.attackTimer = Math.max(0, state.attackTimer - dt);
      const p = 1.0 - state.attackTimer / Math.max(0.01, state.attackDuration);
      adventurer.handSword.visible = true;
      adventurer.backHilt.visible = false;
      adventurer.backCrossguard.visible = false;
      adventurer.slashArc.visible = true;

      if (state.attackMode === 'spin') {
        adventurer.bodyPivot.rotation.y = p * Math.PI * 2.0;
        adventurer.rightArm.rotation.set(-1.35, 0, -1.2);
        adventurer.slashArc.rotation.set(0, p * Math.PI * 2.0, 0);
        adventurer.slashMat.uniforms.uSpinMode.value = 1.0;
        adventurer.slashMat.uniforms.uOpacity.value = Math.sin(p * Math.PI) * 0.95;
        if (!state.hitApplied && p > 0.30) {
          state.hitApplied = true;
          applyMeleeStrike(player, 4.9, 65, true, callbacks);
        }
      } else {
        const swingDir = state.comboIndex === 2 ? -1 : 1;
        const arcAngle = (-1.15 + p * 2.3) * swingDir;
        adventurer.bodyPivot.rotation.y = arcAngle * 0.28;
        adventurer.rightArm.rotation.set(-1.35 + Math.sin(p * Math.PI) * 0.4, arcAngle * 0.85, -0.35 * swingDir);
        adventurer.slashArc.rotation.set(0.18 * swingDir, -arcAngle + Math.PI * 0.5, state.comboIndex === 3 ? 0.35 : -0.20 * swingDir);
        adventurer.slashMat.uniforms.uSpinMode.value = 0.0;
        adventurer.slashMat.uniforms.uOpacity.value = Math.sin(p * Math.PI) * 0.88;
        if (!state.hitApplied && p > 0.35) {
          state.hitApplied = true;
          applyMeleeStrike(player, 3.6, state.comboIndex === 3 ? 52 : 34, false, callbacks);
        }
      }
    } else {
      adventurer.handSword.visible = false;
      adventurer.backHilt.visible = true;
      adventurer.backCrossguard.visible = true;
      adventurer.slashArc.visible = false;
      adventurer.bodyPivot.rotation.y = THREE.MathUtils.lerp(adventurer.bodyPivot.rotation.y, 0, Math.min(1, 14 * dt));
    }
  }

  function hurtPlayer(dmg, attacker, callbacks = {}) {
    if (state.invulnTimer > 0) return;
    state.invulnTimer = 0.65;
    state.health = Math.max(0, state.health - dmg);
    state.cameraShake = 0.25;
    if (state.health <= 0) {
      // Respawn safely without hard-locking gameplay
      state.health = state.maxHealth;
      state.wantedStars = 0;
      state.wantedDecay = 0;
      if (callbacks.onKnockout) callbacks.onKnockout();
    }
  }

  return {
    state,
    triggerLightAttack,
    triggerSpinAttack,
    triggerEnergyShot,
    addWanted,
    hurtPlayer,
    update
  };
}

// ==================== main.js ====================
// ============================================================================
// 1. RENDERER, SCENE, CAMERA & BABYLON HDR MSAA POST-PROCESSING RESOLVE
// ============================================================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.35, 16000);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
const dpr = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(dpr);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const rtWidth = Math.max(1, Math.floor(window.innerWidth * dpr));
const rtHeight = Math.max(1, Math.floor(window.innerHeight * dpr));
const msaaTarget = new THREE.WebGLRenderTarget(rtWidth, rtHeight, {
  type: THREE.HalfFloatType,
  samples: 4
});

const composer = new EffectComposer(renderer, msaaTarget);
const renderPass = new RenderPass(scene, camera);
const sceneStats = { calls: 0, triangles: 0 };
const origRenderPassRender = renderPass.render.bind(renderPass);
renderPass.render = function (...args) {
  origRenderPassRender(...args);
  sceneStats.calls = renderer.info.render.calls;
  sceneStats.triangles = renderer.info.render.triangles;
};
composer.addPass(renderPass);

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.22,  // subtle natural bloom
  0.28,
  2.6    // high HDR threshold: only solar disc, water glint, streetlamps & magma
);
composer.addPass(bloomPass);

// Babylon Exact Resolve Pass: Exposure + Balance + Sun Veil + Stephen Hill ACES + Warm Trim + Purkinje Night + Vignette + sRGB + Dither
const resolvePass = new ShaderPass({
  uniforms: {
    tDiffuse: { value: null },
    uSunScreenUv: { value: new THREE.Vector2(0.8, 0.7) },
    uSunInView: { value: 0.0 },
    uSunColor: ATMO_UNIFORMS.uSunColor,
    uNightFactor: ATMO_UNIFORMS.uNightFactor,
    uExposure: { value: 1.0 },
    uBalance: { value: new THREE.Vector3(1.0, 1.0, 1.0) },
    uContrast: { value: 1.05 },
    uSaturation: { value: 1.18 },
    uWarmSat: { value: 1.0 },
    uLift: { value: 0.0015 },
    uVignette: { value: 0.14 },
    uAspect: { value: window.innerWidth / Math.max(window.innerHeight, 1) },
    uNightGrade: { value: new THREE.Vector4(0.88, 0.98, 1.16, 0.62) },
    uNightRange: { value: new THREE.Vector3(0.0, 0.05, 0.36) },
    uDither: { value: 1.0 }
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform vec2 uSunScreenUv;
    uniform float uSunInView;
    uniform vec3 uSunColor;
    uniform float uNightFactor;
    uniform float uExposure;
    uniform vec3 uBalance;
    uniform float uContrast;
    uniform float uSaturation;
    uniform float uWarmSat;
    uniform float uLift;
    uniform float uVignette;
    uniform float uAspect;
    uniform vec4 uNightGrade;
    uniform vec3 uNightRange;
    uniform float uDither;
    varying vec2 vUv;

    const vec3 LUMA = vec3(0.2126, 0.7152, 0.0722);

    vec3 RRTAndODTFit(vec3 v) {
      vec3 a = v * (v + 0.0245786) - 0.000090537;
      vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081;
      return a / b;
    }

    vec3 tmACES(vec3 color) {
      const mat3 ACES_IN = mat3(
        vec3(0.59719, 0.07600, 0.02840),
        vec3(0.35458, 0.90834, 0.13383),
        vec3(0.04823, 0.01566, 0.83777)
      );
      const mat3 ACES_OUT = mat3(
        vec3(1.60475, -0.10208, -0.00327),
        vec3(-0.53108, 1.10813, -0.07276),
        vec3(-0.07367, -0.00605, 1.07602)
      );
      return clamp(ACES_OUT * RRTAndODTFit(ACES_IN * (color / 0.6)), 0.0, 1.0);
    }

    float ignDither(vec2 p) {
      return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715))));
    }

    void main() {
      vec4 tex = texture2D(tDiffuse, vUv);
      vec3 c = tex.rgb;

      // Subtle optical sun veil in linear HDR before tone mapping
      if (uSunInView > 0.01) {
        vec2 delta = (vUv - uSunScreenUv) * vec2(uAspect, 1.0);
        float veil = exp(-length(delta) * 3.8) * 0.065 * uSunInView * (1.0 - uNightFactor);
        c += uSunColor * veil;
      }

      // Calibrated mode exposure & white balance -> Exact Stephen Hill ACES Filmic
      c = max(c * uExposure * uBalance, 0.0);
      c = tmACES(c);

      // Display-linear contrast about 0.18 mid-grey + selective warm saturation trim
      c = 0.18 * pow(max(c, vec3(1e-6)) / 0.18, vec3(uContrast));
      float warm = smoothstep(0.1, 0.5, (c.r - c.b) / max(max(c.r, max(c.g, c.b)), 1e-4));
      c = mix(vec3(dot(c, LUMA)), c, uSaturation * mix(1.0, uWarmSat, warm));
      c = clamp(c, 0.0, 1.0);

      // Purkinje scotopic night grade: dims/cools moonlight while preserving warm windows, lamps & lava
      if (uNightRange.x > 0.001) {
        float nl = dot(c, LUMA);
        float nm = uNightRange.x * (1.0 - smoothstep(uNightRange.y, uNightRange.z, nl));
        c = mix(c, mix(vec3(nl), c, uNightGrade.a) * uNightGrade.rgb, nm);
      }

      // Subtle shadow lift + aspect-aware fourth-power lens vignette
      c += uLift * (1.0 - c) * (1.0 - c);
      vec2 q = (vUv - 0.5) * vec2(uAspect, 1.0) / length(vec2(uAspect, 1.0) * 0.5);
      float r2 = dot(q, q);
      c *= 1.0 - uVignette * r2 * r2;

      // IEC sRGB encoding + triangular IGN dither to eliminate 8-bit sky/haze banding
      c = mix(c * 12.92, 1.055 * pow(max(c, vec3(1e-6)), vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));
      float d1 = ignDither(gl_FragCoord.xy);
      float d2 = ignDither(gl_FragCoord.xy + vec2(37.0, 17.0));
      c += (d1 + d2 - 1.0) * (uDither / 255.0);

      gl_FragColor = vec4(clamp(c, 0.0, 1.0), tex.a);
    }
  `
});
composer.addPass(resolvePass);

// ============================================================================
// 2. LIGHTING & BABYLON PRE-BAKED SKY-DRIVEN IBL

const hemiLight = new THREE.HemisphereLight(0xa9bcd9, 0xb9a27c, 0.35);

const sunLight = new THREE.DirectionalLight(0xfff4e2, 2.5);

function showToast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove('show'), 2200);
}

const sfxCallbacks = {
  onSlash: () => playSlashSfx(false),
  onSpin: () => playSlashSfx(true),
  onBolt: () => playBoltSfx(),
  onImpact: () => playImpactSfx(),
  onKill: (npc) => showToast(`+$${npc.cashReward || 25}`),
  onPlayerHit: (dmg, attacker) => {
    combat.hurtPlayer(dmg, attacker, {
      onKnockout: () => {
        showToast('Revived at Overlook!');
        resetToIconicVista();
      }
    });
  },
  onCrime: (stars) => combat.addWanted(stars)
};

function exitActiveCar() {
  if (!player.inVehicle || !player.activeCar) return false;
  const exitPos = vehicles.exitCar(player.activeCar);
  player.inVehicle = false;
  player.activeCar = null;
  adventurer.root.visible = true;
  if (exitPos) player.pos.copy(exitPos);
  player.vel.set(0, 0, 0);
  player.onGround = true;
  camState.targetDist = Math.min(camState.targetDist, 7.6);
  showToast('Exited Vehicle');
  return true;
}

function hijackOrExitCar() {
  if (player.inVehicle) {
    return exitActiveCar();
  }
  const near = vehicles.findNearestCar(player.pos, 5.8);
  if (!near) {
    showToast('No car nearby');
    return false;
  }
  const res = vehicles.enterOrRobCar(near.car);
  player.inVehicle = true;
  player.activeCar = near.car;
  player.gliding = false;
  adventurer.root.visible = false;
  camState.targetDist = Math.max(camState.targetDist, 9.2);
  camState.targetPitch = Math.max(camState.targetPitch, 0.16);
  if (res.stolen) {
    combat.addWanted(1);
    playHijackSfx();
    showToast(`Robbed ${res.label}! +1 ★`);
  } else {
    showToast(`Driving ${res.label}`);
  }
  return true;
}

function warpPlayer(x, z, yaw, camYaw, camPitch, camDist, toastMsg) {
  if (player.inVehicle) exitActiveCar();
  camState.freePos = null;
  camState.freeLook = null;
  player.pos.set(x, getCityGroundY(x, z), z);
  player.vel.set(0, 0, 0);
  player.yaw = yaw;
  player.onGround = true;
  player.gliding = false;
  player.stamina = 1.0;
  player.exhausted = false;
  camState.yaw = camState.targetYaw = camYaw;
  camState.pitch = camState.targetPitch = camPitch;
  camState.dist = camState.targetDist = camDist;
  if (toastMsg) showToast(toastMsg);
}

function resetToIconicVista() {
  warpPlayer(
    VISTA_STATE.playerPos.x,
    VISTA_STATE.playerPos.z,
    VISTA_STATE.playerYaw,
    VISTA_STATE.camYaw,
    VISTA_STATE.camPitch,
    VISTA_STATE.camDist,
    'Great Plateau Overlook'
  );
  player.pos.y = getTerrainHeight(player.pos.x, player.pos.z);
}

// Keyboard & Pointer Controls
window.addEventListener('keydown', (e) => {
  const code = e.code;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(code)) {
    e.preventDefault();
  }
  if (code === 'Space' && !keys[code] && !player.inVehicle) {
    handleJumpOrGlide();
  }
  if ((code === 'KeyE' || code === 'KeyF') && !keys[code]) hijackOrExitCar();
  if (code === 'KeyJ' && !keys[code]) combat.triggerLightAttack(player, sfxCallbacks);
  if (code === 'KeyK' && !keys[code]) combat.triggerSpinAttack(player, sfxCallbacks);
  if (code === 'KeyR' && !keys[code]) combat.triggerEnergyShot(player, player.inVehicle ? player.activeCar.yaw : player.yaw, sfxCallbacks);
  if (code === 'KeyG' && !keys[code] && player.inVehicle) playHornSfx();
  if (code === 'KeyC' && !keys[code]) teleportToCity();
  if (code === 'KeyB' && !keys[code]) teleportToMarina();
  if (code === 'KeyN' && !keys[code]) teleportToHighway();
  if (code === 'KeyV') resetToIconicVista();
  if (code === 'KeyM') toggleAudio();
  if (code === 'KeyH') toggleHUD();
  keys[code] = true;
});

window.addEventListener('keyup', (e) => {
  keys[e.code] = false;
});

function handleJumpOrGlide() {
  if (player.inVehicle) return;
  if (player.onGround) {
    player.vel.y = 10.8;
    player.onGround = false;
    player.gliding = false;
  } else if (!player.gliding && player.stamina > 0.08 && !player.exhausted) {
    player.gliding = true;
    if (player.vel.y < -2.0) player.vel.y = -2.0;
    showToast('Paraglider Deployed');
  } else if (player.gliding) {
    player.gliding = false;
  }
}

renderer.domElement.addEventListener('mousedown', (e) => {
  if (e.button === 2) {
    combat.triggerSpinAttack(player, sfxCallbacks);
    return;
  }
  camState.dragging = true;
  camState.dragDist = 0;
  camState.lastX = e.clientX;
  camState.lastY = e.clientY;
});

  if (e.button === 0 && camState.dragging && camState.dragDist < 6) {
    combat.triggerLightAttack(player, sfxCallbacks);
  }
  camState.dragging = false;
});

window.addEventListener('mousemove', (e) => {
  if (!camState.dragging && document.pointerLockElement !== renderer.domElement) return;
  const dx = document.pointerLockElement === renderer.domElement ? e.movementX : (e.clientX - camState.lastX);
  const dy = document.pointerLockElement === renderer.domElement ? e.movementY : (e.clientY - camState.lastY);
  camState.dragDist += Math.hypot(dx, dy);
  camState.lastX = e.clientX;
  camState.lastY = e.clientY;
  camState.targetYaw -= dx * 0.0052;
  camState.targetPitch = clamp(camState.targetPitch + dy * 0.0046, -0.55, 1.12);
});

renderer.domElement.addEventListener('wheel', (e) => {
  camState.targetDist = clamp(camState.targetDist + e.deltaY * 0.008, 3.8, 22.0);
}, { passive: true });

// Touch Controls
let camTouchId = null;
renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    camTouchId = e.touches[0].identifier;
    camState.lastX = e.touches[0].clientX;
    camState.lastY = e.touches[0].clientY;
  }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier === camTouchId) {
      const dx = t.clientX - camState.lastX;
      const dy = t.clientY - camState.lastY;
      camState.lastX = t.clientX;
      camState.lastY = t.clientY;
      camState.targetYaw -= dx * 0.006;
      camState.targetPitch = clamp(camState.targetPitch + dy * 0.005, -0.55, 1.12);
    }
  }
}, { passive: true });

const touchPad = document.getElementById('touch-pad');
const touchKnob = document.getElementById('touch-knob');
let joyTouchId = null;
touchPad.addEventListener('touchstart', (e) => {
  e.stopPropagation();
  joyTouchId = e.changedTouches[0].identifier;
}, { passive: true });
touchPad.addEventListener('touchmove', (e) => {
  e.stopPropagation();
  for (const t of e.changedTouches) {
    if (t.identifier === joyTouchId) {
      const rect = touchPad.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const maxR = rect.width * 0.36;
      let dx = t.clientX - cx;
      let dy = t.clientY - cy;
      const dist = Math.hypot(dx, dy);
      if (dist > maxR) {
        dx = (dx / dist) * maxR;
        dy = (dy / dist) * maxR;
      }
      touchKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      touchInput.x = dx / maxR;
      touchInput.y = dy / maxR;
    }
  }
}, { passive: true });
const resetJoy = () => {
  joyTouchId = null;
  touchInput.x = 0;
  touchInput.y = 0;
  touchKnob.style.transform = 'translate(0px, 0px)';
};
touchPad.addEventListener('touchend', resetJoy);
touchPad.addEventListener('touchcancel', resetJoy);

document.getElementById('touch-sprint').addEventListener('touchstart', (e) => { e.preventDefault(); touchInput.sprint = true; });

let dayTime = 0.06;
let dayRunning = true;
let daySpeed = 1;
const DAY_CYCLE_SEC = 150.0;
let pinnedMode = null;
let lastDayHudMs = -1000;
let activeDayState = null;
let todSliderDragging = false;
const MODE_DAYTIME = { morning: 0.0, afternoon: 0.16, golden: 0.34, blue: 0.65 };
const MODE_LABELS = { morning: 'Morning', afternoon: 'Afternoon', golden: 'Golden Hour', blue: 'Night' };

function syncDaylightHud(force = false) {
  if (todText) {
    todText.textContent = pinnedMode
      ? `${MODE_LABELS[pinnedMode] || pinnedMode} \u00B7 Locked`
      : formatTimeOfDay(dayTime);
  }
  if (todSlider && (force || !todSliderDragging)) {
    todSlider.value = String(Math.round(((dayTime % 1.0) + 1.0) % 1.0 * 1000));
  }
  if (todPlayBtn) {
    const running = dayRunning && !pinnedMode;
    todPlayBtn.textContent = running ? 'Pause' : 'Play';
    todPlayBtn.classList.toggle('active', !running);
  }
  if (todSpeedBtn) {
    todSpeedBtn.textContent = `${daySpeed}x`;
    todSpeedBtn.classList.toggle('active', daySpeed > 1);
  }
  modePillEls.forEach((el) => {
    el.classList.toggle('active', el.dataset.mode === pinnedMode);
  });
}

function applyDaylight(tSec, forceHud = false) {
  const spec = pinnedMode ? { a: pinnedMode, b: pinnedMode, k: 0 } : dayNightSpec(dayTime);
  const st = daylight.update(spec, {
    sunLight,
    hemiLight,
    camPos: camera.position,
    fov: camera.fov,
    viewH: window.innerHeight,
    t: tSec
  });
  activeDayState = st;
  sunLight.castShadow = st.keyIntensity > 0.04;

  const u = resolvePass.uniforms;
  u.uExposure.value = st.exposure;
  u.uBalance.value.set(st.grade.balance[0], st.grade.balance[1], st.grade.balance[2]);
  u.uContrast.value = st.grade.contrast;
  u.uSaturation.value = st.grade.saturation;
  u.uWarmSat.value = st.grade.warmSat;
  u.uNightRange.value.x = st.night;

  const nowMs = performance.now();
  if (forceHud || nowMs - lastDayHudMs >= 150) {
    lastDayHudMs = nowMs;
    syncDaylightHud(forceHud);
  }
}

if (todSlider) {
  todSlider.addEventListener('pointerdown', () => { todSliderDragging = true; });
  window.addEventListener('pointerup', () => { todSliderDragging = false; });
  todSlider.addEventListener('input', (e) => {
    pinnedMode = null;
    dayTime = clamp(parseFloat(e.target.value) / 1000.0, 0.0, 1.0);
    applyDaylight(ATMO_UNIFORMS.uTime.value, true);
  });
}
if (todPlayBtn) {
  todPlayBtn.addEventListener('click', () => {
    if (pinnedMode) {
      pinnedMode = null;
      dayRunning = true;
    } else {
      dayRunning = !dayRunning;
    }
    applyDaylight(ATMO_UNIFORMS.uTime.value, true);
  });
}
if (todSpeedBtn) {
  todSpeedBtn.addEventListener('click', () => {
    daySpeed = daySpeed === 1 ? 3 : daySpeed === 3 ? 8 : 1;
    syncDaylightHud(true);
  });
}
modePillEls.forEach((btn) => {

    applyDaylight(ATMO_UNIFORMS.uTime.value, true);
  });
});

// 6. PROCEDURAL WEB AUDIO SOUNDSCAPE (WIND + SPARSE PIANO)
// ============================================================================
let audioCtx = null;
let audioRunning = false;
let windGain = null;
let pianoTimer = null;

function toggleAudio() {
  const btn = document.getElementById('btn-audio');
  if (!audioRunning) {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bufSize = audioCtx.sampleRate * 3;
        const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        let lastOut = 0;
        for (let i = 0; i < bufSize; i++) {
          const white = Math.random() * 2 - 1;
          data[i] = (lastOut + 0.02 * white) / 1.02;
          lastOut = data[i];
          data[i] *= 2.4;
        }
        const noiseSrc = audioCtx.createBufferSource();
        noiseSrc.buffer = buffer;
        noiseSrc.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 340;
        filter.Q.value = 0.85;

        windGain = audioCtx.createGain();
        windGain.gain.value = 0.0;

        noiseSrc.connect(filter);
        filter.connect(windGain);
        windGain.connect(audioCtx.destination);
        noiseSrc.start();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      windGain.gain.setTargetAtTime(0.11, audioCtx.currentTime, 0.8);
      audioRunning = true;
      btn.textContent = 'Audio: On';
      btn.classList.add('active');
      scheduleBotWPianoNote();
      showToast('Ambient Soundscape On');
    } catch {
      showToast('Audio unavailable');
    }
  } else {
    if (windGain && audioCtx) {
      windGain.gain.setTargetAtTime(0.0, audioCtx.currentTime, 0.4);
    }
    clearTimeout(pianoTimer);
    audioRunning = false;
    btn.textContent = 'Audio: Off';
    btn.classList.remove('active');
  }
}

const PIANO_FREQS = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99];
function scheduleBotWPianoNote() {
  if (!audioRunning || !audioCtx) return;
  const playPhrase = () => {
    if (!audioRunning) return;
    const notesInPhrase = Math.random() < 0.55 ? 2 : 3;
    for (let n = 0; n < notesInPhrase; n++) {
      const delay = n * (0.45 + Math.random() * 0.55);
      const freq = PIANO_FREQS[Math.floor(Math.random() * PIANO_FREQS.length)];
      const t0 = audioCtx.currentTime + delay;

      const osc = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.value = freq;
      osc2.type = 'triangle';
      osc2.frequency.value = freq * 2.0;

      const g2 = audioCtx.createGain();
      g2.gain.value = 0.08;

      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.055, t0 + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.4);

      osc.connect(gain);
      osc2.connect(g2);
      g2.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(t0);
      osc2.start(t0);
      osc.stop(t0 + 3.5);
      osc2.stop(t0 + 3.5);
    }
    pianoTimer = setTimeout(scheduleBotWPianoNote, 3200 + Math.random() * 4800);
  };
  playPhrase();
}

function playTone(freqStart, freqEnd, dur, type = 'triangle', vol = 0.08) {
  if (!audioRunning || !audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freqStart, now);
  osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), now + dur);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.linearRampToValueAtTime(vol, now + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + dur + 0.02);
}

function playSlashSfx(isSpin = false) {
