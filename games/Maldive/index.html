                    uniform float uTime;
                    uniform vec3 uSunDir;
                    uniform vec3 uMoonDir;
                    uniform vec3 uSunColor;

                    float sandHash(vec2 p) {
                        vec3 p3 = fract(vec3(p.xyx) * 0.1031);
                        p3 += dot(p3, p3.yzx + 33.33);
                        return fract((p3.x + p3.y) * p3.z);
                    }
                    float sandNoise(vec2 p) {
                        vec2 i = floor(p);
                        vec2 f = fract(p);
                        f = f * f * (3.0 - 2.0 * f);
                        return mix(
                            mix(sandHash(i), sandHash(i + vec2(1.0, 0.0)), f.x),
                            mix(sandHash(i + vec2(0.0, 1.0)), sandHash(i + vec2(1.0, 1.0)), f.x),
                            f.y
                        );
                    }
                ` + shader.fragmentShader.replace(
                    '#include <color_fragment>',
                    `#include <color_fragment>
                    float h = vSandWorldPos.y;

                    // Multi-scale coral sand grain, wind-rippled beach dunes, and subtle shell/coral detritus
                    float grainFine = sandNoise(vSandWorldPos.xz * 16.0);
                    float grainMicro = sandNoise(vSandWorldPos.xz * 42.0);
                    float grainMacro = sandNoise(vSandWorldPos.xz * 1.8);
                    float sandDetailFade = 1.0 - smoothstep(0.025, 0.12, fwidth(vSandWorldPos.x) + fwidth(vSandWorldPos.z));
                    float grain = mix(grainMacro, grainFine * 0.62 + grainMicro * 0.38, sandDetailFade);

                    float swashLine = 0.05 * sin(uTime * 2.4 + vSandWorldPos.x * 0.4 + vSandWorldPos.z * 0.4);
                    float wetness = 1.0 - smoothstep(-0.06, 0.36 + swashLine, h);
                    float ripplePhase = dot(vSandWorldPos.xz, vec2(0.82, 0.57)) * 1.8
                                      + (sandNoise(vSandWorldPos.xz * 0.12) - 0.5) * 1.3
                                      + (sandNoise(vSandWorldPos.xz * 0.035) - 0.5) * 2.0;
                    float rippleFade = 1.0 - smoothstep(0.45, 1.2, fwidth(ripplePhase));
                    float rippleBand = mix(0.5, pow(0.5 + 0.5 * sin(ripplePhase), 6.0), rippleFade);
                    float windRipples = 0.5 + 0.5 * sin(ripplePhase);
                    float rippleShade = (rippleBand - 0.12) * 0.04 * (1.0 - wetness * 0.35);

                    // Authentic Maldives high-albedo warm coral-white sand & golden-tan wet swash zone
                    vec3 dryCoralSand = vec3(0.84, 0.78, 0.67) * (0.91 + 0.12 * grain + 0.02 * windRipples + rippleShade);
                    vec3 wetShoreSand = vec3(0.50, 0.44, 0.35) * (0.92 + 0.10 * grain + rippleShade * 0.6);
                    vec3 inlandVegetatedSand = vec3(0.58, 0.56, 0.44) * (0.88 + 0.16 * grain);

                    vec3 sandCol = mix(dryCoralSand, wetShoreSand, wetness);
                    float shellSpecks = step(0.995, sandHash(floor(vSandWorldPos.xz * 5.0)));
                    sandCol += vec3(0.045, 0.032, 0.016) * shellSpecks * (1.0 - wetness * 0.8);

                    // Subtle organic coastal soil blend at the highest central palm grove
                    float inlandMask = smoothstep(1.15, 1.85, h);
                    sandCol = mix(sandCol, inlandVegetatedSand, inlandMask * 0.45);

                    // Subtle quartz/aragonite crystal micro-sparkles on sunlit dry coral sand
                    vec3 viewDir = normalize(cameraPosition - vSandWorldPos);
                    float sparkleCell = sandHash(floor(vSandWorldPos.xz * 65.0) + floor(viewDir.xz * 14.0));
                    float sparkle = step(0.988, sparkleCell) * (1.0 - wetness * 0.8) * max(0.0, uSunDir.y);
                    sandCol += vec3(0.95, 0.90, 0.78) * sparkle * 0.35;

                    diffuseColor.rgb *= sandCol;
                    `
                ).replace(
                    '#include <normal_fragment_maps>',
                    `#include <normal_fragment_maps>
                    float bumpPhaseX = vSandWorldPos.x * 12.0 + sin(vSandWorldPos.z * 6.0) * 0.4;
                    float bumpPhaseZ = vSandWorldPos.z * 10.0 + sin(vSandWorldPos.x * 5.0) * 0.3;
                    float rippleSlope = cos(ripplePhase) * 1.8 * mix(0.002, 0.006, wetness);
                    float grainSlope = 0.0007;
                    float bumpGradX = (rippleSlope * 0.82
                                    + grainSlope * (cos(bumpPhaseX) * 12.0 + cos(bumpPhaseZ) * cos(vSandWorldPos.x * 5.0) * 1.5)) * sandDetailFade;
                    float bumpGradZ = (rippleSlope * 0.57
                                    + grainSlope * (cos(bumpPhaseX) * cos(vSandWorldPos.z * 6.0) * 2.4 + cos(bumpPhaseZ) * 10.0)) * sandDetailFade;
                    normal = normalize(normal + mat3(viewMatrix) * vec3(-bumpGradX, 0.0, -bumpGradZ));
                    `
                ).replace(
                    '#include <roughnessmap_fragment>',
                    `#include <roughnessmap_fragment>
                    roughnessFactor = mix(0.58, 0.16, wetness) + rippleBand * 0.035;
                    `
                ).replace(
                    '#include <opaque_fragment>',
                    `vec3 sandViewDirection = normalize(-vViewPosition);
                    vec3 sandSunDirection = normalize(mat3(viewMatrix) * uSunDir);
                    vec3 sandMoonDirection = normalize(mat3(viewMatrix) * uMoonDir);
                    float sunWetSpec = pow(max(dot(normal, normalize(sandSunDirection + sandViewDirection)), 0.0), 110.0)
                                     * wetness * smoothstep(-0.06, 0.08, uSunDir.y) * 0.12;
                    float moonWetSpec = pow(max(dot(normal, normalize(sandMoonDirection + sandViewDirection)), 0.0), 90.0)
                                      * wetness * smoothstep(-0.06, 0.08, uMoonDir.y) * 0.08;
                    outgoingLight += uSunColor * sunWetSpec + vec3(0.48, 0.68, 1.0) * moonWetSpec;
                    #include <opaque_fragment>
                    `
                );
            };

            const terrainMesh = new THREE.Mesh(geo, sandMat);
            terrainMesh.receiveShadow = true;
            scene.add(terrainMesh);
        }

        function createAAAOcean() {
            // Preserve dense near-shore water while stretching the outer mesh well beyond the visible horizon.
            const oceanRadius = 3200;
            const oceanFarRadius = 200000;
            const oceanGeo = new THREE.PlaneGeometry(oceanRadius * 2, oceanRadius * 2, 520, 520);
            oceanGeo.rotateX(-Math.PI / 2);

            // Keep the detailed inner waves unchanged and progressively spread only the distant vertices.
            const pos = oceanGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                let x = pos.getX(i);
                let z = pos.getZ(i);
                const r = Math.sqrt(x * x + z * z);
                if (r > 0.001) {
                    const normR = r / oceanRadius;
                    const nearWarpedR = Math.pow(normR, 1.42) * oceanRadius;
                    const farFieldBlend = smoothstep(0.78, 1.0, normR);
                    const warpedR = nearWarpedR + farFieldBlend * (oceanFarRadius - oceanRadius);
                    const scale = warpedR / r;
                    pos.setX(i, x * scale);
                    pos.setZ(i, z * scale);
                }
            }
            oceanGeo.computeVertexNormals();

            oceanMat = new THREE.ShaderMaterial({
                vertexShader: OCEAN_VERTEX_SHADER,
                fragmentShader: OCEAN_FRAGMENT_SHADER,
                uniforms: {
                    uTime: { value: 0 },
                    uWaveScale: { value: STATE.waveScale },
                    uCloudCoverage: { value: STATE.cloudCoverage },
                    uCumulusCoverage: { value: STATE.cumulusCoverage },
                    uCumulusSeed: { value: CUMULUS_SEED },
                    uSunDir: { value: STATE.sunDirection },
                    uMoonDir: { value: STATE.moonDirection },
                    uSunColor: { value: STATE.sunColor },
                    uSkyTopColor: { value: STATE.skyTopColor },
                    uSkyHorizonColor: { value: STATE.skyHorizonColor }
                },
                transparent: true,
                depthWrite: true
            });

            oceanMesh = new THREE.Mesh(oceanGeo, oceanMat);
            oceanMesh.position.y = 0.0;
            oceanMesh.renderOrder = 10;
            scene.add(oceanMesh);
        }

        // ============================================================================
        // 5. PROCEDURAL PALM TREES, STRONG WIND SWAY & TROPICAL FLORA
        // ============================================================================
        function createPalmLeafMaterial(isPalmFrond = true) {
            const mat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.48,
                metalness: 0.02,
                vertexColors: true,
                side: THREE.DoubleSide,
                alphaTest: 0.5
            });

            mat.onBeforeCompile = (shader) => {
                shader.uniforms.uTime = { value: 0 };
                shader.uniforms.uSunDir = { value: STATE.sunDirection };
                shader.uniforms.uIsPalmFrond = { value: isPalmFrond ? 1.0 : 0.0 };
                mat.userData.shader = shader;

                shader.vertexShader = `
                    uniform float uTime;
                    varying vec2 vLeafUV;
                    varying vec3 vLeafWorldPos;
                ` + shader.vertexShader.replace(
                    '#include <uv_vertex>',
                    `#include <uv_vertex>
                    vLeafUV = uv;`
                ).replace(
                    '#include <begin_vertex>',
                    `#include <begin_vertex>
                    #ifdef USE_INSTANCING
                    vec4 wPos = modelMatrix * instanceMatrix * vec4(transformed, 1.0);
                    #else
                    vec4 wPos = modelMatrix * vec4(transformed, 1.0);
                    #endif
                    vLeafWorldPos = wPos.xyz;
                    float distFromCrown = length(transformed.xz);

                    // Strong prevailing trade-wind gusts + high-frequency leaflet flutter
                    float treePhase = wPos.x * 0.09 + wPos.z * 0.07;
                    float strongGust = sin(uTime * 2.1 + treePhase) * 0.55
                                     + sin(uTime * 0.95 - treePhase * 0.6) * 0.35
                                     + 0.42;
                    float whipTurbulence = sin(uTime * 5.8 + wPos.x * 0.45 + wPos.z * 0.35 + distFromCrown * 0.9) * 0.24
                                         + cos(uTime * 9.2 + distFromCrown * 1.8) * 0.10;

                    float flexFactor = pow(distFromCrown * 0.24, 1.45);
                    transformed.y += (strongGust * 0.45 + whipTurbulence) * flexFactor;
                    transformed.x += (strongGust * 0.75 + whipTurbulence * 0.5) * flexFactor;
                    transformed.z += (strongGust * 0.32 + whipTurbulence * 0.35) * flexFactor;

                    // Sync crown base translation with the bending palm trunk top in strong wind
                    float crownSwayX = (sin(uTime * 1.85 + treePhase) * 0.48 + 0.38) * 0.52;
                    float crownSwayZ = (cos(uTime * 1.45 + treePhase * 0.8) * 0.30 + 0.18) * 0.52;
                    transformed.x += crownSwayX;
                    transformed.z += crownSwayZ;
                    `
                );

                shader.fragmentShader = `
                    uniform float uIsPalmFrond;
                    uniform vec3 uSunDir;
                    varying vec2 vLeafUV;
                    varying vec3 vLeafWorldPos;
                ` + shader.fragmentShader.replace(
                    '#include <color_fragment>',
                    `#include <color_fragment>
                    if (uIsPalmFrond > 0.5) {
                        // Procedural alpha-cutout pinnae leaflets so every palm frond is composed of ~48 crisp individual leaflets
                        float sideX = abs(vLeafUV.x - 0.5) * 2.0;
                        float alongZ = clamp(vLeafUV.y, 0.0, 1.0);

                        // Central woody rachis spine tapers from base to tip
                        float rachisWidth = mix(0.085, 0.014, alongZ);
                        if (sideX > rachisWidth) {
                            // Angle individual leaflets forward toward the frond tip
                            float leafletPhase = fract(alongZ * 42.0 - pow(sideX, 0.85) * 3.4);
                            float leafletCenterDist = abs(leafletPhase - 0.5) * 2.0;

                            // Taper each individual leaflet to a sharp botanical point at its outer tip
                            float normSpan = clamp((sideX - rachisWidth) / max(0.05, 1.0 - rachisWidth), 0.0, 1.0);
                            float maxLeafWidth = (1.0 - pow(normSpan, 1.45)) * 0.82;

                            if (leafletCenterDist > maxLeafWidth || alongZ > 0.985) {
                                discard;
                            }

                            // Subtle V-fold shading along each individual leaflet rib
                            float ribShade = 0.82 + 0.26 * (1.0 - leafletCenterDist / max(0.01, maxLeafWidth));
                            diffuseColor.rgb *= ribShade;
                        } else {
                            // Woody yellowish-green central petiole/rachis stem
                            diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.28, 0.34, 0.14), 0.65);
                        }
                    }

                    // Botanical translucent subsurface scattering when backlit by the sun
                    vec3 viewDir = normalize(cameraPosition - vLeafWorldPos);
                    float backScatter = pow(max(0.0, dot(viewDir, -uSunDir)), 2.5) * max(0.0, uSunDir.y);
                    diffuseColor.rgb += vec3(0.26, 0.42, 0.08) * (0.25 + 0.75 * backScatter) * max(0.0, uSunDir.y) * 0.45;
                    `
                );
            };

            frondMaterials.push(mat);
            return mat;
        }

        function createWindTrunkMaterial() {
            const trunkMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.92,
                metalness: 0.0,
                vertexColors: true
            });

            trunkMat.onBeforeCompile = (shader) => {
                shader.uniforms.uTime = { value: 0 };
                trunkMat.userData.shader = shader;

                shader.vertexShader = `
                    uniform float uTime;
                ` + shader.vertexShader.replace(
                    '#include <begin_vertex>',
                    `#include <begin_vertex>
                    vec4 wPos = modelMatrix * vec4(transformed, 1.0);
                    float hNorm = clamp(transformed.y / 9.4, 0.0, 1.0);
                    float bendFactor = pow(hNorm, 1.85);
                    float treePhase = (modelMatrix[3].x) * 0.09 + (modelMatrix[3].z) * 0.07;

                    float swayX = (sin(uTime * 1.85 + treePhase) * 0.48 + 0.38) * 0.52;
                    float swayZ = (cos(uTime * 1.45 + treePhase * 0.8) * 0.30 + 0.18) * 0.52;
                    transformed.x += swayX * bendFactor;
                    transformed.z += swayZ * bendFactor;
                    transformed.y -= (abs(swayX) + abs(swayZ)) * 0.08 * bendFactor;
                    `
                );
            };

            trunkMaterials.push(trunkMat);
            return trunkMat;
        }

        function buildPalmFrondGeometry() {
            const length = 5.5;
            const segmentsL = 28;
            const segmentsW = 8;
            const geo = new THREE.PlaneGeometry(1.65, length, segmentsW, segmentsL);
            geo.translate(0, length / 2, 0);
            geo.rotateX(Math.PI / 2); // Extend outward along +Z

            const pos = geo.attributes.position;
            const colors = new Float32Array(pos.count * 3);

            for (let i = 0; i < pos.count; i++) {
                let x = pos.getX(i);
                let y = pos.getY(i);
                let z = pos.getZ(i);

                const t = Math.max(0.0, Math.min(1.0, z / length));
                const widthProfile = Math.sin(Math.pow(t, 0.58) * Math.PI) * (1.0 - t * 0.14);
                const edgeFactor = Math.abs(x) / 0.825;

                x *= widthProfile;
                // Graceful arching coconut frond profile with natural drooping pinnae tips
                y = Math.sin(t * Math.PI * 0.65) * 0.82 - Math.pow(t, 2.05) * 2.15 - Math.pow(edgeFactor, 1.35) * 0.38;

                pos.setXYZ(i, x, y, z);

                // Rich, sunlit tropical palm chlorophyll greens with warm golden-olive tips
                const crownAO = smoothstep(0.0, 0.22, t);
                const tipSunWarmth = smoothstep(0.65, 1.0, t);
                const spineHighlight = 1.0 - smoothstep(0.0, 0.25, edgeFactor);

                const r = 0.085 + 0.145 * crownAO + 0.110 * tipSunWarmth + 0.045 * spineHighlight;
                const g = 0.175 + 0.265 * crownAO + 0.045 * tipSunWarmth + 0.065 * spineHighlight;
                const b = 0.035 + 0.065 * crownAO - 0.015 * tipSunWarmth + 0.015 * spineHighlight;

                colors[i * 3]     = r;
                colors[i * 3 + 1] = g;
                colors[i * 3 + 2] = b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            return geo;
        }

        const sharedTrunkMat = createWindTrunkMaterial();
        const sharedFrondGeo = buildPalmFrondGeometry();
        const sharedFrondMat = createPalmLeafMaterial(true);

        // Shared coconut geometry and materials (one batch per colour for all palms)
        const sharedCocoGeo = new THREE.SphereGeometry(0.19, 8, 8);
        const sharedCocoMats = [
            new THREE.MeshStandardMaterial({ color: 0x5c441e, roughness: 0.65 }),
            new THREE.MeshStandardMaterial({ color: 0x657c24, roughness: 0.45 })
        ];

        function isNearCampOrCabin(x, z, clearance = 14.0) {
            const fireDx = x - CAMPFIRE_POS.x;
            const fireDz = z - CAMPFIRE_POS.z;
            const cabDx = x - CABIN_SITE.x;
            const cabDz = z - CABIN_SITE.z;
            const cabinRadius = clearance + 6.5;
            return (fireDx * fireDx + fireDz * fireDz < clearance * clearance) ||
                   (cabDx * cabDx + cabDz * cabDz < cabinRadius * cabinRadius);
        }

        function createPalmTree(x, z, scale, leanAngle, leanAmount, heightMultiplier = 1.0) {
            const groundY = getIslandHeight(x, z);
            if (groundY < 0.26 || isNearCampOrCabin(x, z, 18.0)) return;

            treeLocations.push({ x, z });

            const treeGroup = new THREE.Group();
            treeGroup.position.set(x, groundY - 0.15, z);
            treeGroup.scale.setScalar(scale);

            // Variable trunk height ranging from young palms to towering ancient royal coconut trees
            const height = 9.4 * heightMultiplier;
            const trunkSegs = 28;
            const radSegs = 12;
            const topRad = 0.12 * Math.pow(heightMultiplier, 0.25);
            const botRad = 0.42 * Math.pow(heightMultiplier, 0.35);
            const trunkGeo = new THREE.CylinderGeometry(topRad, botRad, height, radSegs, trunkSegs, false);
            trunkGeo.translate(0, height / 2, 0);

            const pos = trunkGeo.attributes.position;
            const trunkColors = new Float32Array(pos.count * 3);
            const dirX = Math.cos(leanAngle);
            const dirZ = Math.sin(leanAngle);

            for (let i = 0; i < pos.count; i++) {
                let vx = pos.getX(i);
                let vy = pos.getY(i);
                let vz = pos.getZ(i);

                const t = Math.max(0.0, Math.min(1.0, vy / height));
                // Graceful S-curve / J-curve coastal coconut trunk profile
                const bend = (Math.pow(t, 1.65) + 0.15 * Math.sin(t * Math.PI)) * leanAmount;
                const ringWave = Math.sin(t * 95.0 * heightMultiplier);
                const rootFlare = (1.0 - smoothstep(0.0, 0.14, t)) * 0.28;
                const ringBulge = 1.0 + 0.048 * ringWave + rootFlare;

                vx = vx * ringBulge + dirX * bend;
                vz = vz * ringBulge + dirZ * bend;
                vy = vy - Math.pow(t, 2.2) * (leanAmount * 0.16);

                pos.setXYZ(i, vx, vy, vz);

                const endAO = (0.65 + 0.35 * smoothstep(0.0, 0.14, t)) * (1.0 - 0.38 * smoothstep(0.84, 1.0, t));
                const barkNoise = valueNoise2D(vx * 8.0 + x, vy * 3.5 + z);
                const ringShade = endAO * (0.78 + 0.22 * ringWave) * (0.85 + 0.30 * barkNoise);
                trunkColors[i * 3]     = ringShade * 0.46;
                trunkColors[i * 3 + 1] = ringShade * 0.41;
                trunkColors[i * 3 + 2] = ringShade * 0.35;
            }
            trunkGeo.setAttribute('color', new THREE.BufferAttribute(trunkColors, 3));
            trunkGeo.computeVertexNormals();

            const trunkMesh = new THREE.Mesh(trunkGeo, sharedTrunkMat);
            trunkMesh.castShadow = true;
            trunkMesh.receiveShadow = true;
            treeGroup.add(trunkMesh);

            const crownGroup = new THREE.Group();
            const topBend = leanAmount;
            crownGroup.position.set(
                dirX * topBend,
                height - leanAmount * 0.16,
                dirZ * topBend
            );
            crownGroup.rotation.z = -dirX * 0.20;
            crownGroup.rotation.x = dirZ * 0.20;

            // Scale crown slightly so towering trees have majestic proportional canopies
            const crownScale = 0.88 + 0.22 * Math.min(1.8, heightMultiplier);
            crownGroup.scale.setScalar(crownScale);

            // Abundant clusters of golden-green & ripe brown coconuts under the crown
            for (let c = 0; c < 9; c++) {
                const a = (c / 9) * Math.PI * 2;
                const coco = new THREE.Mesh(sharedCocoGeo, sharedCocoMats[c % 2]);
                coco.scale.set(1.0, 1.25, 1.0);
                coco.position.set(Math.cos(a) * 0.27, -0.15 - (c % 3) * 0.09, Math.sin(a) * 0.27);
                coco.castShadow = true;
                crownGroup.add(coco);
                batchableMeshes.push(coco);
            }

            const numFronds = 22;
            for (let f = 0; f < numFronds; f++) {
                const frondMesh = new THREE.Mesh(sharedFrondGeo, sharedFrondMat);
                const azimuth = (f / numFronds) * Math.PI * 2 + hash2D(f, x) * 0.24;
                const tier = f % 4;

                frondMesh.rotation.y = azimuth;
                frondMesh.rotation.x = -0.54 + tier * 0.24;
                frondMesh.rotation.z = (hash2D(f, z) - 0.5) * 0.26;
                frondMesh.scale.setScalar(0.82 + tier * 0.08);
                frondMesh.castShadow = true;
                frondMesh.receiveShadow = true;
                crownGroup.add(frondMesh);
                batchableMeshes.push(frondMesh);
            }

            treeGroup.add(crownGroup);
            scene.add(treeGroup);
        }

        const flowerColors = [0xf43f5e, 0xfbbf24, 0xec4899, 0xf97316];
        const sharedFlowerGeo = new THREE.DodecahedronGeometry(0.11, 0);
        const sharedFlowerMats = flowerColors.map(c => new THREE.MeshStandardMaterial({
            color: c,
            roughness: 0.4,
            emissive: c,
            emissiveIntensity: 0.12
        }));

        function createCoastalBush(x, z, scale, hasFlowers = false) {
            const groundY = getIslandHeight(x, z);
            if (groundY < 0.32 || isNearCampOrCabin(x, z, 9.5)) return;

            bushLocations.push({ x, z });

            const bushGroup = new THREE.Group();
            bushGroup.position.set(x, groundY - 0.06, z);
            bushGroup.scale.setScalar(scale);

            const frondCount = 13;
            for (let i = 0; i < frondCount; i++) {
                const frond = new THREE.Mesh(sharedFrondGeo, sharedFrondMat);
                const ang = (i / frondCount) * Math.PI * 2 + hash2D(i, x) * 0.35;
                const tier = i % 3;
                frond.position.set(Math.cos(ang) * 0.16, 0.12 + tier * 0.09, Math.sin(ang) * 0.16);
                frond.rotation.y = ang;
                frond.rotation.x = -0.42 + tier * 0.22;
                frond.rotation.z = (hash2D(i, z) - 0.5) * 0.25;
                const s = 0.28 + tier * 0.07 + hash2D(x, i) * 0.09;
                frond.scale.set(s * 1.38, s * 0.92, s * 0.74);
                frond.castShadow = true;
                frond.receiveShadow = true;
                bushGroup.add(frond);
                batchableMeshes.push(frond);
            }

            // Tropical hibiscus / Plumeria blossoms dotting the bush canopy
            if (hasFlowers) {
                const fMat = sharedFlowerMats[Math.floor(hash2D(x, z) * sharedFlowerMats.length)];
                for (let f = 0; f < 7; f++) {
                    const fl = new THREE.Mesh(sharedFlowerGeo, fMat);
                    const fa = (f / 7) * Math.PI * 2 + hash2D(f, z);
                    const fr = 0.35 + hash2D(x, f) * 0.65;
                    fl.position.set(Math.cos(fa) * fr, 0.32 + hash2D(f, x) * 0.38, Math.sin(fa) * fr);
                    bushGroup.add(fl);
                    batchableMeshes.push(fl);
                }
            }

            scene.add(bushGroup);
        }

        function createTropicalVegetation() {
            // 135 Coconut Palm Trees with dramatic height variation (young palms, medium groves, and towering 24m king palms)
            const totalTrees = 135;
            const palmGroves = [
                { x: -48.0, z: -32.0, spread: 24.0, count: 25 },
                { x: -70.0, z:  30.0, spread: 22.0, count: 23 },
                { x: -18.0, z:  60.0, spread: 19.0, count: 20 },
                { x:  20.0, z: -48.0, spread: 25.0, count: 24 },
                { x:  74.0, z: -30.0, spread: 22.0, count: 23 },
                { x: 118.0, z:  42.0, spread: 25.0, count: 20 }
            ];
            let groveIndex = 0;
            let groveStart = 0;
            for (let i = 0; i < totalTrees; i++) {
                while (groveIndex < palmGroves.length - 1 && i >= groveStart + palmGroves[groveIndex].count) {
                    groveStart += palmGroves[groveIndex].count;
                    groveIndex++;
                }
                const grove = palmGroves[groveIndex];
                const localIndex = i - groveStart;
                const angle = localIndex * 2.39996 + hash2D(i, 4.1) * 0.8;
                const radius = Math.sqrt(hash2D(i, 6.2)) * grove.spread;
                const px = grove.x + Math.cos(angle) * radius;
                const pz = grove.z + Math.sin(angle) * radius;

                const h = getIslandHeight(px, pz);
                if (h > 0.38) {
                    const distFromCenter = Math.sqrt(px * px + pz * pz);
                    const outAngle = Math.atan2(pz, px) + (hash2D(i, 2.7) - 0.5) * 0.75;

                    // Create striking multi-tier height variation:
                    // - 20% Towering King Coconut Trees (1.5x to 2.25x height)
                    // - 55% Mature Island Palms (0.9x to 1.4x height)
                    // - 25% Young Coastal Palms (0.55x to 0.85x height)
                    const hRoll = hash2D(i, 11.7);
                    let heightMult = 1.0;
                    let scale = 0.9 + hash2D(i, 8.3) * 0.38;
                    if (hRoll > 0.78) {
                        heightMult = 1.55 + hash2D(i, 19.3) * 0.72; // Towering giants!
                        scale = 1.05 + hash2D(i, 8.3) * 0.35;
                    } else if (hRoll < 0.25) {
                        heightMult = 0.58 + hash2D(i, 14.2) * 0.28; // Young low palms
                        scale = 0.72 + hash2D(i, 8.3) * 0.25;
                    } else {
                        heightMult = 0.92 + hash2D(i, 16.8) * 0.52;
                    }

                    const lean = (1.3 + smoothstep(10.0, 75.0, distFromCenter) * 2.8) * Math.pow(heightMult, 0.65);
                    createPalmTree(px, pz, scale, outAngle, lean, heightMult);
                }
            }

            // 210 Lush Coastal Bushes, Scaevola Shrubs, and Flowering Hibiscus thickets
            const totalBushes = 210;
            for (let i = 0; i < totalBushes; i++) {
                const angle = i * 2.39996 + hash2D(i, 9.1) * 0.35;
                const radius = 3.0 + Math.sqrt(i / totalBushes) * 84.0;
                let bx = Math.cos(angle) * radius + (hash2D(i, 1.3) - 0.5) * 9.0;
                let bz = Math.sin(angle) * radius + (hash2D(i, 7.7) - 0.5) * 9.0;

                if (i % 5 === 0) {
                    bx += 38.0;
                    bz += 14.0;
                } else if (i % 7 === 0) {
                    bx -= 42.0;
                    bz += 20.0;
                }

                const bScale = 0.65 + hash2D(bx, bz) * 1.15;
                const hasFlowers = (i % 3 === 0);
                createCoastalBush(bx, bz, bScale, hasFlowers);
            }
        }

        // ============================================================================
        // 5B. 3D UNDERWATER CORAL REEFS, MARINE LIFE & SOARING SEAGULLS
        // ============================================================================
        function createUnderwaterCoralReefs() {
            const reefGroup = new THREE.Group();

            // Shared procedural coral materials (bioluminescent-tinted tropical coral hues)
            const coralPalette = [
                0xe05368, // Rose Pink Staghorn
                0xf28538, // Sunset Orange Brain Coral
                0x8b5cf6, // Royal Violet Sea Fan
                0x2dd4bf, // Turquoise Table Acropora
                0xeab308, // Golden Yellow Porites
                0xec4899  // Magenta Reef Cluster
            ];

            const coralMaterials = coralPalette.map(hex => new THREE.MeshStandardMaterial({
                color: hex,
                roughness: 0.65,
                metalness: 0.05
            }));

            // 1. Brain / Boulder Coral geometry
            const brainGeo = new THREE.IcosahedronGeometry(1.0, 2);
            const bPos = brainGeo.attributes.position;
            for (let i = 0; i < bPos.count; i++) {
                let vx = bPos.getX(i), vy = bPos.getY(i), vz = bPos.getZ(i);
                const rib = Math.sin(vx * 8.0 + vz * 8.0) * 0.12 + valueNoise2D(vx * 4.0, vz * 4.0) * 0.18;
                bPos.setXYZ(i, vx * (1.0 + rib), Math.max(-0.2, vy * (0.72 + rib)), vz * (1.0 + rib));
            }
            brainGeo.computeVertexNormals();

            // 2. Table / Plate Acropora Coral geometry
            const tableGeo = new THREE.CylinderGeometry(1.4, 0.35, 0.55, 14, 2);
            const tPos = tableGeo.attributes.position;
            for (let i = 0; i < tPos.count; i++) {
                let vx = tPos.getX(i), vy = tPos.getY(i), vz = tPos.getZ(i);
                const ang = Math.atan2(vz, vx);
                const ruffle = 1.0 + Math.sin(ang * 7.0) * 0.18 + Math.cos(ang * 11.0) * 0.10;
                tPos.setXYZ(i, vx * ruffle, vy, vz * ruffle);
            }
            tableGeo.computeVertexNormals();

            // 3. Branching Staghorn Coral cluster helper
            const branchGeo = new THREE.CylinderGeometry(0.08, 0.18, 1.35, 7, 3);
            branchGeo.translate(0, 0.65, 0);

            // Distribute 240 coral reef colonies in the crystal-clear shallow lagoon around the island
            for (let i = 0; i < 240; i++) {
                const angle = i * 2.39996 + (hash2D(i, 3.3) - 0.5) * 0.25;
                const dist = 70.0 + hash2D(i, 7.1) * 145.0;
                let cx = Math.cos(angle) * dist;
                let cz = Math.sin(angle) * dist;

                // Cluster extra coral gardens near the eastern sandbar lagoon & shoreline cove
                if (i % 3 === 0) {
                    cx = 40.0 + (hash2D(i, 1.9) - 0.2) * 115.0;
                    cz = 15.0 + (hash2D(i, 5.4) - 0.5) * 95.0;
                }

                const seabedY = getIslandHeight(cx, cz);
                // Keep the shipwreck site clear of coral so the hull reads clearly
                if (Math.hypot(cx - WRECK_SITE.x, cz - WRECK_SITE.z) < 18.0) continue;
                // Place corals only submerged in shallow-to-mid lagoon water (-4.2m to -0.45m)
                if (seabedY < -0.45 && seabedY > -4.2) {
                    const mat = coralMaterials[i % coralMaterials.length];
                    const type = i % 3;
                    const scale = 0.75 + hash2D(cx, cz) * 1.45;

                    if (type === 0) {
                        const coral = new THREE.Mesh(brainGeo, mat);
                        coral.position.set(cx, seabedY + 0.15 * scale, cz);
                        coral.scale.set(scale * 1.2, scale * 0.85, scale);
                        coral.rotation.y = hash2D(i, 2.1) * Math.PI * 2;
                        reefGroup.add(coral);
                    } else if (type === 1) {
                        const coral = new THREE.Mesh(tableGeo, mat);
                        coral.position.set(cx, seabedY + 0.28 * scale, cz);
                        coral.scale.set(scale * 1.3, scale, scale * 1.3);
                        coral.rotation.y = hash2D(i, 8.4) * Math.PI * 2;
                        reefGroup.add(coral);
                    } else {
                        const stagGroup = new THREE.Group();
                        stagGroup.position.set(cx, seabedY, cz);
                        stagGroup.scale.setScalar(scale);
                        for (let b = 0; b < 5; b++) {
                            const br = new THREE.Mesh(branchGeo, mat);
                            const ba = (b / 5) * Math.PI * 2 + hash2D(b, i) * 0.4;
                            br.rotation.y = ba;
                            br.rotation.z = 0.28 + (b % 2) * 0.22;
                            stagGroup.add(br);
                        }
                        reefGroup.add(stagGroup);
                    }
                }
            }

            reefGroup.traverse((o) => { if (o.isMesh) batchableMeshes.push(o); });
            scene.add(reefGroup);
        }

        function createMarineLife() {
            // 1. Graceful Maldives Manta Rays gliding through the turquoise lagoon
            const mantaGeo = new THREE.PlaneGeometry(3.4, 2.6, 16, 12);
            mantaGeo.rotateX(-Math.PI / 2);
            const mPos = mantaGeo.attributes.position;
            for (let i = 0; i < mPos.count; i++) {
                let x = mPos.getX(i);
                let z = mPos.getZ(i);
                // Diamond-wing manta silhouette with sweeping pectoral fins & slender tail
                const span = Math.abs(x) / 1.7;
                const foreAft = z / 1.3;
                const wingLength = Math.max(0.08, 1.0 - Math.pow(span, 0.85));
                z *= wingLength;
                if (span < 0.08 && foreAft < -0.2) {
                    z -= 1.2; // Slender whip tail
                }
                const bodyThickness = Math.max(0.0, (1.0 - span * 1.2) * (1.0 - Math.abs(foreAft))) * 0.22;
                mPos.setXYZ(i, x, bodyThickness, z);
            }
            mGeoNormals(mantaGeo);

            const mantaMat = new THREE.MeshStandardMaterial({
                color: 0x162436,
                roughness: 0.35,
                side: THREE.DoubleSide
            });

            mantaMat.onBeforeCompile = (shader) => {
                shader.uniforms.uTime = { value: 0 };
                mantaMat.userData.shader = shader;
                shader.vertexShader = `
                    uniform float uTime;
                ` + shader.vertexShader.replace(
                    '#include <begin_vertex>',
                    `#include <begin_vertex>
                    float wingSpan = abs(transformed.x);
                    float flap = sin(uTime * 3.2 - wingSpan * 1.15) * pow(wingSpan * 0.58, 1.5) * 0.55;
                    transformed.y += flap;
                    `
                );
            };
            frondMaterials.push(mantaMat);

            const mantaPaths = [
                { cx:  65, cz:  48, rx: 38, rz: 28, speed: 0.24, depth: -1.15, phase: 0.0 },
                { cx:  98, cz:  12, rx: 44, rz: 32, speed: 0.20, depth: -1.35, phase: 2.1 },
                { cx: -45, cz:  78, rx: 36, rz: 26, speed: 0.22, depth: -1.25, phase: 4.2 },
                { cx:  25, cz: -85, rx: 42, rz: 30, speed: 0.19, depth: -1.40, phase: 1.3 },
                { cx: 145, cz:  65, rx: 35, rz: 25, speed: 0.25, depth: -1.10, phase: 3.7 }
            ];

            mantaPaths.forEach(spec => {
                const manta = new THREE.Mesh(mantaGeo, mantaMat);
                scene.add(manta);
                marineLifeAgents.push({ mesh: manta, type: 'manta', ...spec });
            });

            // 2. Colorful Schools of Tropical Reef Fish (Yellow Tangs, Blue Damselfish, Moorish Idols)
            const fishGeo = new THREE.ConeGeometry(0.16, 0.65, 5);
            fishGeo.rotateX(Math.PI / 2);
            fishGeo.scale(0.45, 1.0, 1.0);

            const fishColors = [0xfacc15, 0x38bdf8, 0xf97316, 0xf43f5e];
            const schoolCenters = [
                { cx:  54, cz:  36, rx: 14, rz: 12, speed: 0.55, depth: -0.75, phase: 0.5, col: 0 },
                { cx:  78, cz:  26, rx: 18, rz: 14, speed: 0.48, depth: -0.90, phase: 1.8, col: 1 },
                { cx: 118, cz:  46, rx: 16, rz: 15, speed: 0.52, depth: -0.80, phase: 3.1, col: 2 },
                { cx: -28, cz:  68, rx: 16, rz: 14, speed: 0.46, depth: -0.85, phase: 4.4, col: 3 },
                { cx:  38, cz: -66, rx: 15, rz: 15, speed: 0.50, depth: -0.95, phase: 2.6, col: 0 },
                { cx: -68, cz: -38, rx: 17, rz: 13, speed: 0.44, depth: -1.05, phase: 5.2, col: 1 }
            ];

            schoolCenters.forEach(s => {
                // Each school is one merged mesh (fish baked in local space) so it still swims as a unit
                const fMat = new THREE.MeshStandardMaterial({
                    color: fishColors[s.col],
                    roughness: 0.3,
                    emissive: fishColors[s.col],
                    emissiveIntensity: 0.18
                });

                const fishParts = [];
                for (let f = 0; f < 18; f++) {
                    const sc = 0.75 + hash2D(f, s.phase) * 0.55;
                    const fishPos = new THREE.Vector3(
                        (hash2D(f, s.cx) - 0.5) * 4.2,
                        (hash2D(f, s.cz) - 0.5) * 0.45,
                        (hash2D(s.cx, f) - 0.5) * 4.2
                    );
                    fishParts.push({
                        geometry: fishGeo,
                        matrix: new THREE.Matrix4().compose(fishPos, new THREE.Quaternion(), new THREE.Vector3(sc, sc, sc))
                    });
                }

                const schoolMesh = new THREE.Mesh(mergeGeometryParts(fishParts), fMat);
                scene.add(schoolMesh);
                marineLifeAgents.push({ mesh: schoolMesh, type: 'school', ...s });
            });
        }

        function mGeoNormals(geo) {
            geo.computeVertexNormals();
        }

        function createSeagulls() {
            // Custom V-wing seagull geometry with vertex-shader wing flapping
            const gullGeo = new THREE.PlaneGeometry(2.1, 0.52, 8, 2);
            gullGeo.rotateX(-Math.PI / 2);
            const gPos = gullGeo.attributes.position;
            const gCols = new Float32Array(gPos.count * 3);

            for (let i = 0; i < gPos.count; i++) {
                let x = gPos.getX(i);
                let z = gPos.getZ(i);
                const span = Math.abs(x) / 1.05;
                // Swept-back gull wing profile with dark wingtips
                const sweep = Math.sin(span * Math.PI * 0.85) * 0.22 - Math.pow(span, 1.8) * 0.35;
                const chordScale = Math.max(0.15, 1.0 - Math.pow(span, 1.4));
                z = z * chordScale + sweep;
                const dihedral = Math.sin(span * Math.PI) * 0.14;
                gPos.setXYZ(i, x, dihedral, z);

                // White seagull plumage with slate-grey outer primaries and black wingtips
                const tipDark = smoothstep(0.78, 0.96, span);
                const c = 0.96 - tipDark * 0.78;
                gCols[i * 3]     = c;
                gCols[i * 3 + 1] = c;
                gCols[i * 3 + 2] = c + 0.02;
            }
            gullGeo.setAttribute('color', new THREE.BufferAttribute(gCols, 3));
            gullGeo.computeVertexNormals();

            const gullMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.6,
                vertexColors: true,
                side: THREE.DoubleSide
            });

            gullMat.onBeforeCompile = (shader) => {
                shader.uniforms.uTime = { value: 0 };
                gullMat.userData.shader = shader;
                shader.vertexShader = `
                    uniform float uTime;
                ` + shader.vertexShader.replace(
                    '#include <begin_vertex>',
                    `#include <begin_vertex>
                    vec4 wPos = modelMatrix * vec4(0.0, 0.0, 0.0, 1.0);
                    float birdPhase = wPos.x * 0.15 + wPos.z * 0.15;
                    float span = abs(transformed.x);
                    float flap = sin(uTime * 6.8 + birdPhase) * pow(span, 1.35) * 0.42;
                    transformed.y += flap;
                    `
                );
            };
            frondMaterials.push(gullMat);

            for (let i = 0; i < 18; i++) {
                const gull = new THREE.Mesh(gullGeo, gullMat);
                gull.castShadow = true;
                scene.add(gull);

                seagullAgents.push({
                    mesh: gull,
                    cx: (hash2D(i, 1.1) - 0.35) * 140.0,
                    cz: (hash2D(i, 2.2) - 0.4) * 110.0,
                    rx: 28.0 + hash2D(i, 3.3) * 65.0,
                    rz: 24.0 + hash2D(i, 4.4) * 55.0,
                    baseY: 13.5 + hash2D(i, 5.5) * 18.0,
                    speed: 0.28 + hash2D(i, 6.6) * 0.22,
                    phase: i * 1.15
                });
            }
        }

        // ============================================================================
        // 5C. SHIPWRECK BUILDER, STATIC BATCHING & GEOMETRY MERGING
        // ============================================================================
        // Half-submerged on the flat north-east shelf (seabed about -1.9 m, footprint spread about 0.26 m)
        const WRECK_SITE = { x: 168.0, z: -82.0, yaw: 1.2217, scale: 1.2 };
        const WRECK_HULL = { length: 22.0, beam: 6.8, depth: 4.4, stations: 24, quarter: 9 };

        function lerp3(a, b, t) {
            return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
        }

        // Deck (sheer) height: highest at bow and stern, lower amidships
        function wreckSheerBase(s, depth) {
            return depth * (0.82 + 0.18 * Math.pow(Math.abs(2.0 * s - 1.0), 2.0));
        }

        // Broken-back zone amidships where the hull has snapped and sagged
        function wreckBreakZone(s) {
            return smoothstep(0.40, 0.46, s) * (1.0 - smoothstep(0.54, 0.60, s));
        }

        // Profile of one hull station, shared by the hull, deck and frame geometry
        function wreckStation(i) {
            const { length, beam, depth, stations } = WRECK_HULL;
            const s = i / stations;
            const brk = wreckBreakZone(s);
            return {
                s,
                brk,
                x: (s - 0.5) * length,
                halfBeam: (beam * 0.5) * Math.max(0.16, Math.pow(Math.sin(Math.PI * Math.pow(s, 0.85)), 0.5)),
                sheer: wreckSheerBase(s, depth) - brk * 1.1 + (valueNoise2D(i * 1.37 + 3.1, 2.7) - 0.5) * 0.22,
                keel: 0.30 * Math.pow(Math.abs(2.0 * s - 1.0), 2.4) - brk * 0.35
            };
        }

        // Point j on a station's cross-section: 0 = port sheer, K = keel, 2K = starboard sheer
        function wreckSectionPoint(st, j) {
            const K = WRECK_HULL.quarter;
            const side = j <= K ? -1.0 : 1.0;
            const theta = (j <= K ? (K - j) : (j - K)) / K * (Math.PI / 2);
            return new THREE.Vector3(
                st.x,
                st.keel + (st.sheer - st.keel) * (1.0 - Math.cos(theta)),
                side * st.halfBeam * Math.pow(Math.sin(theta), 0.72)
            );
        }

        // Lofted, open-topped hull with rounded bilges and per-vertex weathering colours
        function buildWreckHullGeometry() {
            const { stations, quarter } = WRECK_HULL;
            const M = 2 * quarter + 1;
            const woodDark = [0.20, 0.14, 0.09];
            const woodGrey = [0.42, 0.36, 0.28];
            const bleached = [0.56, 0.47, 0.34];
            const algae = [0.17, 0.26, 0.15];
            const barnacle = [0.66, 0.64, 0.58];
            const positions = [];
            const colors = [];

            for (let i = 0; i <= stations; i++) {
                const st = wreckStation(i);
                for (let j = 0; j < M; j++) {
                    const p = wreckSectionPoint(st, j);
                    positions.push(p.x, p.y, p.z);

                    // Sun-bleached planks at the top, algae and barnacles low on the hull
                    const t = Math.min(1.0, Math.max(0.0, (p.y - st.keel) / Math.max(0.001, st.sheer - st.keel)));
                    const n = valueNoise2D(p.x * 0.9 + j * 0.37, p.y * 1.7 + i * 0.13);
                    let c = lerp3(woodDark, woodGrey, smoothstep(0.0, 0.8, t));
                    c = lerp3(c, bleached, smoothstep(0.7, 1.0, t) * 0.55);
                    c = lerp3(c, algae, (1.0 - smoothstep(0.0, 0.35, t)) * smoothstep(0.35, 0.7, n) * 0.75);
                    if (n > 0.8 && t < 0.5) c = lerp3(c, barnacle, 0.55);
                    const grain = 0.86 + 0.26 * n;
                    colors.push(c[0] * grain, c[1] * grain, c[2] * grain);
                }
            }

            const indices = [];
            for (let i = 0; i < stations; i++) {
                for (let j = 0; j < M - 1; j++) {
                    const a = i * M + j;
                    const b = a + 1;
                    const d = (i + 1) * M + j;
                    const c = d + 1;
                    indices.push(a, d, b, b, d, c);
                }
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geo.setIndex(indices);
            geo.computeVertexNormals();
            return geo;
        }

        // Planked deck strips at the stern castle and forecastle only; the amidships deck is open
        function buildWreckDeckGeometry() {
            const { stations, quarter } = WRECK_HULL;
            const positions = [];
            for (let i = 0; i < stations; i++) {
                const sMid = (i + 0.5) / stations;
                if (sMid > 0.38 && sMid < 0.6) continue;
                const a = wreckSectionPoint(wreckStation(i), 0);
                const b = wreckSectionPoint(wreckStation(i), 2 * quarter);
                const c = wreckSectionPoint(wreckStation(i + 1), 2 * quarter);
                const d = wreckSectionPoint(wreckStation(i + 1), 0);
                positions.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z, a.x, a.y, a.z, c.x, c.y, c.z, d.x, d.y, d.z);
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.computeVertexNormals();
            return geo;
        }

        // Exposed frames: thin bands following the hull cross-section, pushed slightly outside the planking
        function buildWreckRibGeometry() {
            const { stations, quarter } = WRECK_HULL;
            const M = 2 * quarter + 1;
            const halfW = 0.14;
            const positions = [];
            for (let i = 1; i < stations; i += 3) {
                const st = wreckStation(i);
                if (st.brk > 0.5) continue; // no frames survive in the broken section
                const center = new THREE.Vector3(st.x, (st.keel + st.sheer) * 0.5, 0.0);
                const pts = [];
                for (let j = 0; j < M; j++) {
                    const p = wreckSectionPoint(st, j);
                    const n = p.clone().sub(center).normalize();
                    pts.push(p.addScaledVector(n, 0.16));
                }
                for (let j = 0; j < M - 1; j++) {
                    const p0 = pts[j];
                    const p1 = pts[j + 1];
                    const A = [p0.x - halfW, p0.y, p0.z];
                    const B = [p0.x + halfW, p0.y, p0.z];
                    const C = [p1.x + halfW, p1.y, p1.z];
                    const D = [p1.x - halfW, p1.y, p1.z];
                    positions.push(...A, ...B, ...C, ...A, ...C, ...D);
                }
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.computeVertexNormals();
            return geo;
        }

        // Keel line following the hull rocker
        function buildWreckKeelCurve() {
            const pts = [];
            for (let i = 0; i <= WRECK_HULL.stations; i += 2) {
                const st = wreckStation(i);
                pts.push(new THREE.Vector3(st.x, st.keel + 0.1, 0.0));
            }
            return new THREE.CatmullRomCurve3(pts);
        }

        // Square sail that hangs from its yard (top edge at y = 0), billowed in x, torn along the bottom edge
        function buildTatteredSailGeometry(width, height, seed) {
            const geo = new THREE.PlaneGeometry(width, height, 12, 8);
            const pos = geo.attributes.position;
            for (let k = 0; k < pos.count; k++) {
                const x = pos.getX(k);
                const y = pos.getY(k);
                const bottom = y < -height * 0.5 + 1e-3;
                const tear = bottom ? hash2D(x * 3.7 + seed, seed) * 0.95 : 0.0;
                const billow = Math.sin(x * 1.1 + seed) * 0.42 + Math.sin(y * 0.9 + x * 0.5) * 0.18;
                pos.setXYZ(k, x, y - tear, billow);
            }
            geo.rotateY(Math.PI / 2);
            geo.translate(0, -height * 0.5, 0);
            geo.computeVertexNormals();
            return geo;
        }

        // Straight spar between two points (rBottom at `from`, rTop at `to`)
        function addWreckSpar(parent, from, to, rBottom, rTop, mat, radialSegs) {
            const dir = new THREE.Vector3().subVectors(to, from);
            const len = dir.length();
            const geo = new THREE.CylinderGeometry(rTop, rBottom, len, radialSegs, 1);
            geo.translate(0, len * 0.5, 0);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(from);
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            parent.add(mesh);
            return mesh;
        }

        function buildShipwreckGroup() {
            const { length, depth } = WRECK_HULL;
            const group = new THREE.Group();
            group.rotation.set(0.10, WRECK_SITE.yaw, 0.03, 'YXZ'); // list (roll), heading, slight pitch
            group.scale.setScalar(WRECK_SITE.scale);
            group.position.set(WRECK_SITE.x, 0.0, WRECK_SITE.z);

            const darkTimberMat = new THREE.MeshStandardMaterial({ color: 0x3b2818, roughness: 0.92 });
            const bleachedTimberMat = new THREE.MeshStandardMaterial({ color: 0x5c4632, roughness: 0.88 });
            const tatteredSailMat = new THREE.MeshStandardMaterial({ color: 0xc2b59b, roughness: 0.9, side: THREE.DoubleSide });
            const hullMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9, vertexColors: true, side: THREE.DoubleSide });
            const wreckDeckMat = new THREE.MeshStandardMaterial({ color: 0x4a3420, roughness: 0.9, side: THREE.DoubleSide });
            const ribMat = new THREE.MeshStandardMaterial({ color: 0x6b5a44, roughness: 0.85, side: THREE.DoubleSide });

            const addMesh = (geo, mat, name) => {
                const mesh = new THREE.Mesh(geo, mat);
                if (name) mesh.name = name;
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                group.add(mesh);
                return mesh;
            };

            addMesh(buildWreckHullGeometry(), hullMat, 'wreckHull');
            addMesh(buildWreckDeckGeometry(), wreckDeckMat);
            addMesh(buildWreckRibGeometry(), ribMat);
            addMesh(new THREE.TubeGeometry(buildWreckKeelCurve(), 48, 0.18, 6, false), darkTimberMat);

            // Two snapped masts with splintered tops, yards and tattered sails
            const deckY = (s) => wreckSheerBase(s, depth);
            const mastSpecs = [
                { s: 0.60, height: 11.6, lean: [-0.05, 0.10], snap: 0.84 },
                { s: 0.32, height: 8.6, lean: [0.06, -0.22], snap: 0.70 }
            ];
            const mastTops = [];
            mastSpecs.forEach((m, idx) => {
                const base = new THREE.Vector3((m.s - 0.5) * length, deckY(m.s), 0.0);
                const dir = new THREE.Vector3(m.lean[0], 1.0, m.lean[1]).normalize();
                const top = base.clone().addScaledVector(dir, m.height * m.snap);
                mastTops.push(top);
                addWreckSpar(group, base, top, 0.24, 0.13, bleachedTimberMat, 8);

                const spike = top.clone().addScaledVector(dir, 0.8).add(new THREE.Vector3(0.22, 0.0, 0.12));
                addWreckSpar(group, top, spike, 0.13, 0.0, bleachedTimberMat, 6);

                const yardCenter = base.clone().addScaledVector(dir, m.height * 0.62);
                addWreckSpar(
                    group,
                    yardCenter.clone().add(new THREE.Vector3(0.0, 0.0, -3.7)),
                    yardCenter.clone().add(new THREE.Vector3(0.0, 0.3, 3.6)),
                    0.09, 0.07, darkTimberMat, 7
                );

                const sail = addMesh(buildTatteredSailGeometry(6.8, m.height * 0.42, idx * 3.1 + 1.0), tatteredSailMat);
                sail.position.copy(yardCenter);
            });

            // Bowsprit out past the bow
            const bowBase = new THREE.Vector3((0.92 - 0.5) * length, deckY(0.92) - 0.2, 0.0);
            addWreckSpar(group, bowBase, bowBase.clone().add(new THREE.Vector3(6.2, 1.1, 0.0)), 0.22, 0.08, bleachedTimberMat, 7);

            // Surviving rigging lines from mast tops to the deck
            const deckPoint = (s) => new THREE.Vector3((s - 0.5) * length, deckY(s) + 0.15, 0.0);
            const rigPositions = [];
            const addRigLine = (a, b) => rigPositions.push(a.x, a.y, a.z, b.x, b.y, b.z);
            addRigLine(mastTops[0], deckPoint(0.90));
            addRigLine(mastTops[0], deckPoint(0.08));
            addRigLine(mastTops[1], deckPoint(0.62));
            addRigLine(mastTops[1], deckPoint(0.12));
            const rigGeo = new THREE.BufferGeometry();
            rigGeo.setAttribute('position', new THREE.Float32BufferAttribute(rigPositions, 3));
            group.add(new THREE.LineSegments(rigGeo, new THREE.LineBasicMaterial({ color: 0x2b2118 })));

            return group;
        }

        // Drops the wreck so its lowest hull point sits just below the seabed (keel buried in sand).
        // The waterline (y = 0) then cuts through roughly the middle of the hull.
        function seatWreckOnSeabed(group, embed) {
            group.position.y = 0.0;
            group.updateMatrixWorld(true);
            const hull = group.getObjectByName('wreckHull');
            const pos = hull.geometry.attributes.position;
            const v = new THREE.Vector3();
            let worstDrop = -Infinity;
            for (let k = 0; k < pos.count; k++) {
                v.fromBufferAttribute(pos, k).applyMatrix4(group.matrixWorld);
                worstDrop = Math.max(worstDrop, getIslandHeight(v.x, v.z) - v.y);
            }
            group.position.y = worstDrop - embed;
            group.updateMatrixWorld(true);
        }

        // Bakes the current world matrices of static meshes into THREE.InstancedMesh batches,
        // one draw call per geometry + material + shadow flags. Frustum culling is disabled
        // because r128 bounds only cover a single instance.
        function batchStaticMeshes(meshes) {
            if (!meshes.length) return;
            scene.updateMatrixWorld(true);

            const buckets = new Map();
            meshes.forEach((mesh) => {
                const key = [mesh.geometry.uuid, mesh.material.uuid, mesh.castShadow, mesh.receiveShadow].join('|');
                if (!buckets.has(key)) buckets.set(key, []);
                buckets.get(key).push(mesh);
            });

            buckets.forEach((items) => {
                const ref = items[0];
                const batch = new THREE.InstancedMesh(ref.geometry, ref.material, items.length);
                batch.castShadow = ref.castShadow;
                batch.receiveShadow = ref.receiveShadow;
                batch.frustumCulled = false;
                items.forEach((mesh, idx) => {
                    batch.setMatrixAt(idx, mesh.matrixWorld);
                    if (mesh.parent) mesh.parent.remove(mesh);
                });
                batch.instanceMatrix.needsUpdate = true;
                scene.add(batch);
            });
        }

        // Merges geometries, each with its own transform, into one non-indexed BufferGeometry
        function mergeGeometryParts(parts) {
            const geos = parts.map((part) => {
                const g = part.geometry.index ? part.geometry.toNonIndexed() : part.geometry.clone();
                g.applyMatrix4(part.matrix);
                return g;
            });
            const total = geos.reduce((sum, g) => sum + g.attributes.position.count, 0);
            const merged = new THREE.BufferGeometry();
            ['position', 'normal', 'color'].forEach((name) => {
                if (!geos[0].attributes[name]) return;
                const itemSize = geos[0].attributes[name].itemSize;
                const data = new Float32Array(total * itemSize);
                let offset = 0;
                geos.forEach((g) => {
                    const arr = g.attributes[name].array;
                    data.set(arr, offset);
                    offset += arr.length;
                });
                merged.setAttribute(name, new THREE.BufferAttribute(data, itemSize));
            });
            return merged;
        }

        function createShipwreckAndProps() {
            // ========================================================================
            // 1. WEATHERED GALLEON / SCHOONER SHIPWRECK, HALF-SUBMERGED ON THE NE SHELF
            // ========================================================================
            const wreckGroup = buildShipwreckGroup();
            scene.add(wreckGroup);
            seatWreckOnSeabed(wreckGroup, 0.12);

            // Shared timber materials for the pier, cabin, outriggers and driftwood below
            const darkTimberMat = new THREE.MeshStandardMaterial({ color: 0x3b2818, roughness: 0.92 });
            const bleachedTimberMat = new THREE.MeshStandardMaterial({ color: 0x5c4632, roughness: 0.88 });

            // ========================================================================
            // 2. MALDIVES OVERWATER THATCH BUNGALOW & TIMBER BOARDWALK PIER
            // ========================================================================
            const pierGroup = new THREE.Group();
            const px = 42.0, pz = 28.0;
            pierGroup.position.set(px, 0.0, pz);
            pierGroup.rotation.y = -0.58; // Extend from sandy beach out into the turquoise lagoon

            const deckMat = new THREE.MeshStandardMaterial({ color: 0x785b3c, roughness: 0.85 });
            const thatchMat = new THREE.MeshStandardMaterial({ color: 0x9c7e44, roughness: 0.92 });
            const lanternMat = new THREE.MeshStandardMaterial({
                color: 0xffb74d,
                emissive: 0xff9800,
                emissiveIntensity: 1.8
            });

            // Boardwalk stilts & planks (26m long walkway)
            const postGeo = new THREE.CylinderGeometry(0.14, 0.16, 4.2, 8);
            const plankGeo = new THREE.BoxGeometry(2.6, 0.12, 0.42);
            for (let d = 0; d <= 26; d += 2.2) {
                for (let side = -1; side <= 1; side += 2) {
                    const post = new THREE.Mesh(postGeo, darkTimberMat);
                    post.position.set(side * 1.15, 0.2, d);
                    post.castShadow = true;
                    pierGroup.add(post);
                }
                // Glowing pier lanterns every 6.6 meters
                if (d > 4 && Math.round(d) % 6 === 0) {
                    const lPost = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 1.4, 6), darkTimberMat);
                    lPost.position.set(1.22, 2.2, d);
                    pierGroup.add(lPost);

                    const lantern = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), lanternMat);
                    lantern.position.set(1.22, 2.95, d);
                    pierGroup.add(lantern);
                }
            }
            for (let d = 0; d <= 26; d += 0.52) {
                const plank = new THREE.Mesh(plankGeo, deckMat);
                plank.position.set(0, 1.55, d);
                plank.receiveShadow = true;
                plank.castShadow = true;
                pierGroup.add(plank);
            }

            // Overwater Thatch Pavilion / Bungalow at the end of the boardwalk (d = 30)
            const hutDeck = new THREE.Mesh(new THREE.BoxGeometry(8.2, 0.22, 8.2), deckMat);
            hutDeck.position.set(0, 1.6, 30.2);
            hutDeck.castShadow = true;
            hutDeck.receiveShadow = true;
            pierGroup.add(hutDeck);

            // Corner support pillars for the pavilion
            for (let cx = -3.4; cx <= 3.4; cx += 6.8) {
                for (let cz = 26.8; cz <= 33.6; cz += 6.8) {
                    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.20, 6.2, 8), darkTimberMat);
                    pillar.position.set(cx, 1.8, cz);
                    pillar.castShadow = true;
                    pierGroup.add(pillar);
                }
            }

            // Timber cabin walls & tiered palm-thatch pyramid roof
            const cabinWalls = new THREE.Mesh(new THREE.BoxGeometry(5.2, 2.8, 5.2), bleachedTimberMat);
            cabinWalls.position.set(0, 3.0, 30.2);
            cabinWalls.castShadow = true;
            cabinWalls.receiveShadow = true;
            pierGroup.add(cabinWalls);

            const roofTier1 = new THREE.Mesh(new THREE.ConeGeometry(6.8, 2.6, 4), thatchMat);
            roofTier1.position.set(0, 5.2, 30.2);
            roofTier1.rotation.y = Math.PI / 4;
            roofTier1.castShadow = true;
            pierGroup.add(roofTier1);

            const roofTier2 = new THREE.Mesh(new THREE.ConeGeometry(3.8, 1.8, 4), thatchMat);
            roofTier2.position.set(0, 6.4, 30.2);
            roofTier2.rotation.y = Math.PI / 4;
            roofTier2.castShadow = true;
            pierGroup.add(roofTier2);

            scene.add(pierGroup);
            pierGroup.children.forEach((o) => { if (o.isMesh) batchableMeshes.push(o); });

            // Warm point light inside the overwater bungalow that illuminates the lagoon at dusk/night
            const hutWorldLightPos = new THREE.Vector3(0, 3.2, 26.0).applyAxisAngle(new THREE.Vector3(0, 1, 0), -0.58).add(new THREE.Vector3(px, 0, pz));
            const hutLight = new THREE.PointLight(0xff9d3b, 6.0, 38.0, 1.6);
            hutLight.position.copy(hutWorldLightPos);
            scene.add(hutLight);
            dynamicLights.push({ light: hutLight, baseIntensity: 7.5, phase: 0.0 });

            // ========================================================================
            // 3. BEACHED OUTRIGGER CANOES, DRIFTWOOD LOGS & FLICKERING CAMPFIRE
            // ========================================================================
            const canoeSpots = [
                { x: 64.0, z: 34.0, rotY: 0.85 },
                { x: -38.0, z: 48.0, rotY: -1.25 }
            ];
            canoeSpots.forEach(cs => {
                const cy = getIslandHeight(cs.x, cs.z);
                const canoeGroup = new THREE.Group();
                canoeGroup.position.set(cs.x, cy + 0.18, cs.z);
                canoeGroup.rotation.y = cs.rotY;

                const bodyGeo = new THREE.CylinderGeometry(0.45, 0.35, 5.6, 10, 8);
                bodyGeo.rotateZ(Math.PI / 2);
                bodyGeo.scale(1.0, 0.65, 0.85);
                const body = new THREE.Mesh(bodyGeo, bleachedTimberMat);
                body.castShadow = true;
                canoeGroup.add(body);

                const outriggerFloat = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 4.2, 8), darkTimberMat);
                outriggerFloat.rotation.z = Math.PI / 2;
                outriggerFloat.position.set(0, -0.05, 1.65);
                canoeGroup.add(outriggerFloat);

                for (let s = -1.2; s <= 1.2; s += 2.4) {
                    const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.75, 6), darkTimberMat);
                    strut.rotation.x = Math.PI / 2;
                    strut.position.set(s, 0.1, 0.82);
                    canoeGroup.add(strut);
                }
                scene.add(canoeGroup);
            });

            // Sun-bleached driftwood logs & giant clam shells along the high-tide mark
            const driftLogGeo = new THREE.CylinderGeometry(0.18, 0.28, 4.8, 7);
            driftLogGeo.rotateZ(Math.PI / 2);
            for (let d = 0; d < 24; d++) {
                const ang = (d / 24) * Math.PI * 2 + 0.2;
                let dx = Math.cos(ang) * (54.0 + hash2D(d, 3.1) * 32.0);
                let dz = Math.sin(ang) * (54.0 + hash2D(d, 8.7) * 32.0);
                if (d % 4 === 0) {
                    dx = 95.0 + hash2D(d, 2.3) * 45.0;
                    dz = 28.0 + (hash2D(d, 5.9) - 0.5) * 28.0;
                }
                const dy = getIslandHeight(dx, dz);
                if (dy > 0.12 && dy < 0.85 && !isNearCampOrCabin(dx, dz, 11.0)) {
                    const log = new THREE.Mesh(driftLogGeo, bleachedTimberMat);
                    log.position.set(dx, dy + 0.08, dz);
                    log.rotation.y = hash2D(dx, dz) * Math.PI * 2;
                    log.rotation.z = (hash2D(dz, dx) - 0.5) * 0.15;
                    log.scale.setScalar(0.65 + hash2D(d, 4.4) * 0.85);
                    log.castShadow = true;
                    log.receiveShadow = true;
                    scene.add(log);
                    batchableMeshes.push(log);
                }
            }

            // Cozy Beach Campfire with grounded Stone Hearth, Natural Firewood Logs & Barbeque Spit-Roast Rig
            const fireX = CAMPFIRE_POS.x, fireZ = CAMPFIRE_POS.z;
            const fireY = getIslandHeight(fireX, fireZ);
            const fireGroup = new THREE.Group();
            fireGroup.position.set(fireX, fireY + 0.02, fireZ);

            const fireStoneMat = new THREE.MeshStandardMaterial({ color: 0x4b4843, roughness: 0.92 });
            const charredBarkMat = new THREE.MeshStandardMaterial({ color: 0x2a1b10, roughness: 0.94 });
            const splitHeartwoodMat = new THREE.MeshStandardMaterial({ color: 0x7c5330, roughness: 0.85 });
            const emberBedMat = new THREE.MeshStandardMaterial({
                color: 0xff5500,
                emissive: 0xff2a00,
                emissiveIntensity: 2.3,
                roughness: 0.65
            });
            const ironBBQMat = new THREE.MeshStandardMaterial({ color: 0x1f2429, roughness: 0.45, metalness: 0.78 });
            const roastMeatMat = new THREE.MeshStandardMaterial({ color: 0x9e3f19, roughness: 0.42 });
            const roastGoldenMat = new THREE.MeshStandardMaterial({ color: 0xd97724, roughness: 0.38 });
            const herbPepperMat = new THREE.MeshStandardMaterial({ color: 0x2e6f28, roughness: 0.55 });

            // 1. Ring of natural beach fire-stones enclosing the bonfire pit
            for (let s = 0; s < 14; s++) {
                const sa = (s / 14) * Math.PI * 2;
                const sr = 1.05 + (s % 2) * 0.06;
                const stone = new THREE.Mesh(new THREE.DodecahedronGeometry(0.20 + (s % 3) * 0.03, 1), fireStoneMat);
                stone.scale.set(1.2, 0.72, 1.0);
                stone.position.set(Math.cos(sa) * sr, 0.09, Math.sin(sa) * sr);
                stone.rotation.y = sa + 0.4;
                stone.castShadow = true;
                stone.receiveShadow = true;
                fireGroup.add(stone);
            }

            // 2. Glowing bed of red-hot charcoal embers at the center of the pit
            const emberMound = new THREE.Mesh(new THREE.CylinderGeometry(0.68, 0.92, 0.16, 14), emberBedMat);
            emberMound.position.y = 0.07;
            fireGroup.add(emberMound);

            for (let c = 0; c < 12; c++) {
                const ca = c * 2.39996;
                const cr = Math.sqrt(c / 12) * 0.68;
                const coal = new THREE.Mesh(new THREE.DodecahedronGeometry(0.11, 0), c % 3 === 0 ? charredBarkMat : emberBedMat);
                coal.scale.set(1.2, 0.65, 0.95);
                coal.position.set(Math.cos(ca) * cr, 0.13, Math.sin(ca) * cr);
                coal.rotation.set(c * 0.7, c * 1.1, 0);
                fireGroup.add(coal);
            }

            // 3. Grounded base logs lying flat across the ember bed (no upside-down floating cones!)
            const baseLogSpecs = [
                { x:  0.00, y: 0.15, z: -0.22, rotY:  0.22, len: 1.65, r: 0.13 },
                { x:  0.00, y: 0.15, z:  0.22, rotY:  0.14, len: 1.60, r: 0.125 },
                { x: -0.18, y: 0.27, z:  0.00, rotY:  1.72, len: 1.55, r: 0.12 },
                { x:  0.20, y: 0.27, z:  0.02, rotY: -1.42, len: 1.50, r: 0.115 }
            ];
            baseLogSpecs.forEach((spec, idx) => {
                const logMesh = new THREE.Mesh(new THREE.CylinderGeometry(spec.r * 0.94, spec.r, spec.len, 9), idx % 2 === 0 ? charredBarkMat : darkTimberMat);
                logMesh.rotation.order = 'YXZ';
                logMesh.rotation.y = spec.rotY;
                logMesh.rotation.z = Math.PI / 2;
                logMesh.position.set(spec.x, spec.y, spec.z);
                logMesh.castShadow = true;
                logMesh.receiveShadow = true;
                fireGroup.add(logMesh);

                // Glowing charred inner core on the base logs
                const endDisk = new THREE.Mesh(new THREE.CylinderGeometry(spec.r * 0.76, spec.r * 0.76, spec.len + 0.01, 8), splitHeartwoodMat);
                endDisk.rotation.copy(logMesh.rotation);
                endDisk.position.copy(logMesh.position);
                fireGroup.add(endDisk);
            });

            // 4. Properly oriented teepee firewood logs with thick base planted on the ground & leaning inward to the center
            const teepeeLogs = 7;
            for (let l = 0; l < teepeeLogs; l++) {
                const la = (l / teepeeLogs) * Math.PI * 2 + 0.18;

            // Crispy grill-sear stripes on the whole roasted fish

            // Suspended Iron Grill Grate over the front coals with Sizzling steaks & fish fillets
