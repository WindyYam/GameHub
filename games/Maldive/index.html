<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Maldives Atoll — AAA Ocean & Day/Night Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Fast Loading Screen Overlay -->
    <div id="loading-screen" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-title">Maldives Atoll</div>
        <div class="loading-subtitle">Preparing tropical paradise...</div>
    </div>

    <!-- 3D WebGL Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Bottom Interactive Control Deck -->
    <div class="fixed bottom-3 left-1/2 -translate-x-1/2 z-10 w-[92vw] max-w-md">
        <div class="glass-panel rounded-2xl p-3 sm:p-4 text-white transition-all duration-300">
            <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-2.5 min-w-0">
                    <button id="play-pause-btn" onclick="toggleAutoCycle()" class="w-8 h-8 shrink-0 rounded-lg bg-cyan-500/20 hover:bg-cyan-500/35 border border-cyan-400/40 flex items-center justify-center text-cyan-300 transition" title="Toggle Auto Day/Night Cycle">
                        <svg id="icon-play" class="w-4 h-4 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="icon-pause" class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <div class="min-w-0">
                        <div class="flex items-baseline gap-2">
                            <span id="time-display" class="text-base sm:text-lg font-bold tracking-tight font-mono text-white">14:30</span>
                            <span id="phase-label" class="truncate text-[10px] sm:text-xs font-medium text-cyan-300 uppercase tracking-wider">Tropical Midday</span>
                        </div>
                    </div>
                </div>
                <button id="control-deck-toggle" type="button" aria-expanded="false" aria-controls="control-deck-details" aria-label="Expand controls" title="Expand controls" class="shrink-0 flex items-center gap-1.5 rounded-lg border border-white/10 bg-white/5 px-2.5 py-1.5 text-[11px] text-slate-200 hover:bg-white/10 transition">
                    <span id="control-deck-toggle-label" class="hidden sm:inline">Controls</span>
                    <svg id="control-deck-toggle-icon" class="w-3.5 h-3.5 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></svg>
                </button>
            </div>

            <div id="control-deck-details" class="hidden mt-3 space-y-2.5">
                <div class="flex items-center justify-between gap-2">
                    <span class="text-[10px] text-slate-400">Drag to set time</span>
                    <div class="flex flex-wrap justify-end gap-1">
                        <button onclick="jumpToTime(6.15)" class="px-2 py-1 rounded-lg bg-white/5 hover:bg-white/15 border border-white/10 text-[10px] text-amber-300 transition">Sunrise</button>
                        <button onclick="jumpToTime(13.0)" class="px-2 py-1 rounded-lg bg-white/5 hover:bg-white/15 border border-white/10 text-[10px] text-sky-300 transition">Noon</button>
                        <button onclick="jumpToTime(18.0)" class="px-2 py-1 rounded-lg bg-white/5 hover:bg-white/15 border border-white/10 text-[10px] text-pink-300 transition">Sunset</button>
                        <button onclick="jumpToTime(23.5)" class="px-2 py-1 rounded-lg bg-white/5 hover:bg-white/15 border border-white/10 text-[10px] text-indigo-300 transition">Midnight</button>
                    </div>
                </div>

                <div class="relative">
                    <input id="time-slider" type="range" min="0" max="24" step="0.01" value="13.5" class="time-track">
                    <div class="flex justify-between text-[9px] text-slate-400 font-mono mt-1 px-0.5">
                        <span>00:00</span>
                        <span>06:00</span>
                        <span>12:00</span>
                        <span>18:00</span>
                        <span>24:00</span>
                    </div>
                </div>

                <div class="flex items-center justify-between gap-2 pt-1 border-t border-white/10">
                    <span class="text-[10px] text-slate-400">Camera</span>
                    <div class="flex flex-wrap justify-end gap-1">
                        <button onclick="setCameraPreset('aerial')" class="px-2 py-0.5 rounded-lg bg-cyan-500/20 hover:bg-cyan-500/35 border border-cyan-400/40 text-[10px] text-cyan-200 font-medium transition" title="Elevated Aerial Photo Angle">Aerial Photo</button>
                        <button onclick="setCameraPreset('villas')" class="px-2 py-0.5 rounded-lg bg-white/5 hover:bg-white/15 border border-white/10 text-[10px] text-slate-300 transition" title="Overwater Bungalow Pier">Water Villas</button>
                        <button onclick="setCameraPreset('distantIsland')" class="px-2 py-0.5 rounded-lg bg-white/5 hover:bg-white/15 border border-white/10 text-[10px] text-slate-300 transition" title="Distant Sandbar Island">Distant Atoll</button>
                        <button onclick="setCameraPreset('beach')" class="px-2 py-0.5 rounded-lg bg-white/5 hover:bg-white/15 border border-white/10 text-[10px] text-slate-300 transition" title="Beachfront Pavilion">Beach Club</button>
                    </div>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 pt-2 border-t border-white/10">
                    <div class="flex flex-col gap-1">
                        <div class="flex justify-between text-[11px]">
                            <span class="text-slate-300">Ocean Swell</span>
                            <span id="wave-val" class="text-cyan-300 font-mono">1.0x</span>
                        </div>
                        <input id="wave-slider" type="range" min="0.15" max="2.2" step="0.05" value="1.0">
                    </div>

                    <div class="flex flex-col gap-1">
                        <div class="flex justify-between text-[11px]">
                            <span class="text-slate-300">High Clouds</span>
                            <span id="cloud-val" class="text-cyan-300 font-mono">10%</span>
                        </div>
                        <input id="cloud-slider" type="range" min="0.0" max="0.95" step="0.02" value="0.1">
                    </div>

                    <div class="flex flex-col gap-1">
                        <div class="flex justify-between text-[11px]">
                            <span class="text-slate-300">Cumulus Towers</span>
                            <span id="cumulus-val" class="text-cyan-300 font-mono">75%</span>
                        </div>
                        <input id="cumulus-slider" type="range" min="0.0" max="1.0" step="0.02" value="0.75">
                    </div>

                    <div class="flex flex-col gap-1">
                        <div class="flex justify-between text-[11px]">
                            <span class="text-slate-300">Cycle Speed</span>
                            <span id="speed-val" class="text-cyan-300 font-mono">0.1x</span>
                        </div>
                        <input id="speed-slider" type="range" min="0.05" max="4.0" step="0.05" value="0.1">
                    </div>

                    <div class="flex flex-col gap-1 col-span-2 sm:col-span-1">
                        <div class="flex justify-between text-[11px]">
                            <span class="text-slate-300">Device Mode</span>
                            <span id="mobile-val" class="text-cyan-300 font-mono">Desktop</span>
                        </div>
                        <div class="flex gap-1">
                            <button id="mode-desktop" onclick="setIsMobile(false)" class="flex-1 py-1 rounded bg-white/5 hover:bg-white/15 border border-white/10 text-[10px] text-slate-300 transition">Desktop</button>
                            <button id="mode-mobile" onclick="setIsMobile(true)" class="flex-1 py-1 rounded bg-white/5 hover:bg-white/15 border border-white/10 text-[10px] text-slate-300 transition">Mobile</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modular Game Scripts -->
    <script src="./js/core.js?v=20261024l"></script>
    <script src="./js/shaders.js?v=20261024l"></script>
    <script src="./js/props.js?v=20261024l"></script>
    <script src="./js/flora.js?v=20261024l"></script>
    <script src="./js/fauna.js?v=20261024l"></script>
    <script src="./js/cabin.js?v=20261024l"></script>
    <script src="./js/environment.js?v=20261024l"></script>
    <script src="./js/atmosphere.js?v=20261024l"></script>
    <script src="./js/ui.js?v=20261024l"></script>
    <script src="./js/main.js?v=20261024l"></script>
</body>
</html>
