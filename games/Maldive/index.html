            const potArm = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.03, 0.72, 6), ironBBQMat);
            potArm.position.set(-forkSpan + 0.25, 1.02, -0.25);
            potArm.rotation.z = -0.95;
            potArm.rotation.y = 0.4;
            bbqGroup.add(potArm);

            const bbqPot = new THREE.Mesh(new THREE.SphereGeometry(0.18, 10, 10), ironBBQMat);
            bbqPot.scale.set(1.0, 0.88, 1.0);
            bbqPot.position.set(-0.68, 0.78, -0.36);
            bbqPot.castShadow = true;
            bbqGroup.add(bbqPot);

            // Carved Wooden Bench Logs around the campfire for tribal gatherings
            const benchSpots = [
                { x: -1.85, z:  1.45, rotY:  0.68 },
                { x:  2.05, z:  1.25, rotY: -0.78 }
            ];
            benchSpots.forEach(bs => {
                const bench = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.24, 2.25, 10), bleachedTimberMat);
                bench.rotation.order = 'YXZ';
                bench.rotation.y = bs.rotY;
                bench.rotation.z = Math.PI / 2;
                bench.position.set(bs.x, 0.20, bs.z);
                bench.castShadow = true;
                bench.receiveShadow = true;
                fireGroup.add(bench);
            });

            const flameVertexShader = `
                uniform float uTime;
                uniform float uPhase;
                varying vec2 vUv;
                varying float vFlameHeight;
                void main() {
                    vec3 p = position;
                    float h = clamp(position.y + 0.5, 0.0, 1.0);
                    float sway = sin(uTime * 8.0 + h * 7.0 + uPhase) * 0.085
                               + sin(uTime * 4.5 - h * 5.0 + uPhase * 1.7) * 0.045;
                    p.x += sway * h;
                    p.z += cos(uTime * 7.2 + h * 8.0 + uPhase) * 0.055 * h;
                    p.xz *= 1.0 + sin(uTime * 8.5 + h * 6.0 + uPhase) * 0.075 * h;
                    vUv = uv;
                    vFlameHeight = h;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
                }
            `;
            const flameFragmentShader = `
                uniform float uTime;
                uniform float uPhase;
                uniform float uCore;
                varying vec2 vUv;
                varying float vFlameHeight;

                float hash21(vec2 p) {
                    p = fract(p * vec2(123.34, 456.21));
                    p += dot(p, p + 45.32);
                    return fract(p.x * p.y);
                }
                float noise(vec2 p) {
                    vec2 i = floor(p);
                    vec2 f = fract(p);
                    f = f * f * (3.0 - 2.0 * f);
                    return mix(
                        mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x),
                        mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), f.x),
                        f.y
                    );
                }
                float fbm(vec2 p) {
                    float value = 0.0;
                    float amplitude = 0.5;
                    for (int i = 0; i < 3; i++) {
                        value += noise(p) * amplitude;
                        p *= 2.03;
                        amplitude *= 0.5;
                    }
                    return value;
                }
                void main() {
                    float h = vFlameHeight;
                    vec2 flowUv = vec2(vUv.x * 7.0 + uPhase, vUv.y * 4.5 - uTime * 1.8);
                    float turbulence = fbm(flowUv);
                    float tongues = noise(vec2(vUv.x * 13.0 + uPhase * 1.9, vUv.y * 5.0 - uTime * 2.7));
                    float tip = 0.79 + (turbulence - 0.5) * 0.28 + (tongues - 0.5) * 0.12;
                    float alpha = smoothstep(0.015, 0.13, h) * (1.0 - smoothstep(tip - 0.08, tip + 0.08, h));
                    alpha *= 0.78 + turbulence * 0.32;

                    vec3 color = mix(
                        vec3(0.82, 0.018, 0.001),
                        vec3(1.7, 0.28, 0.012),
                        smoothstep(0.12, 0.82, h)
                    );
                    float hotCore = uCore * (1.0 - smoothstep(0.08, 0.72, h));
                    color = mix(color, vec3(2.0, 1.25, 0.22), hotCore * (0.72 + tongues * 0.28));
                    color *= 0.78 + turbulence * 0.36 + (tongues - 0.5) * 0.18;
                    gl_FragColor = vec4(color * alpha, alpha);
                }
            `;
            const flameGeometry = new THREE.ConeGeometry(0.5, 1.0, 16, 12);
            const flameCount = 8;
            for (let f = 0; f < flameCount; f++) {
                const isCore = f >= 5;
                const phase = f * 1.71;
                const width = isCore ? 0.55 + hash2D(f, 1.3) * 0.12 : 0.82 + hash2D(f, 2.8) * 0.24;
                const height = isCore ? 1.35 + hash2D(f, 4.7) * 0.35 : 1.65 + hash2D(f, 6.1) * 0.55;
                const angle = f * 2.39996;
                const radius = isCore ? 0.12 : 0.24 + hash2D(f, 8.2) * 0.14;
                const material = new THREE.ShaderMaterial({
                    uniforms: {
                        uTime: { value: 0 },
                        uPhase: { value: phase },
                        uCore: { value: isCore ? 1.0 : 0.24 }
                    },
                    vertexShader: flameVertexShader,
                    fragmentShader: flameFragmentShader,
                    transparent: true,
                    depthWrite: false,
                    depthTest: true,
                    side: THREE.DoubleSide,
                    blending: THREE.AdditiveBlending,
                    toneMapped: false
                });
                const flame = new THREE.Mesh(flameGeometry, material);
                flame.position.set(Math.cos(angle) * radius, height * 0.47, Math.sin(angle) * radius);
                flame.scale.set(width, height, width);
                fireGroup.add(flame);
                flameMeshes.push({ mesh: flame, material, phase, width, height });
                fireRenderItems.push({ mesh: flame, distance: 0 });
            }

            const sparkGeometry = new THREE.SphereGeometry(0.045, 6, 6);
            for (let i = 0; i < 9; i++) {
                const phase = i / 9;
                const material = new THREE.MeshBasicMaterial({
                    color: i % 3 === 0 ? 0xffe28a : 0xff8a32,
                    transparent: true,
                    opacity: 0,
                    depthWrite: false,
                    depthTest: true,
                    blending: THREE.AdditiveBlending,
                    toneMapped: false
                });
                const spark = new THREE.Mesh(sparkGeometry, material);
                fireGroup.add(spark);
                fireSparks.push({ mesh: spark, material, phase });
                fireRenderItems.push({ mesh: spark, distance: 0 });
            }
            fireGroup.scale.setScalar(1.3);
            scene.add(fireGroup);

            const smokeGroup = new THREE.Group();
            smokeGroup.position.set(fireX, fireY + 0.05, fireZ);
            const smokeCanvas = document.createElement('canvas');
            smokeCanvas.width = 128;
            smokeCanvas.height = 128;
            const smokeContext = smokeCanvas.getContext('2d');
            if (!smokeContext) throw new Error('Could not create the campfire smoke texture.');
            const smokeImage = smokeContext.createImageData(smokeCanvas.width, smokeCanvas.height);
            for (let y = 0; y < smokeCanvas.height; y++) {
                for (let x = 0; x < smokeCanvas.width; x++) {
                    const nx = (x / 63.5) - 1.0;
                    const ny = (y / 63.5) - 1.0;
                    const radius = Math.sqrt(nx * nx + ny * ny);
                    const cloudNoise = valueNoise2D(nx * 5.2 + 14.7, ny * 5.2 - 6.3);
                    const detailNoise = valueNoise2D(nx * 12.0 - 2.4, ny * 12.0 + 8.1);
                    const edge = 0.88 + (cloudNoise - 0.5) * 0.38;
                    const density = 1.0 - smoothstep(edge * 0.42, edge, radius);
                    const alpha = Math.pow(Math.max(0, density), 1.35) * (0.38 + cloudNoise * 0.38 + detailNoise * 0.24);
                    const pixel = (y * smokeCanvas.width + x) * 4;
                    smokeImage.data[pixel] = 255;
                    smokeImage.data[pixel + 1] = 255;
                    smokeImage.data[pixel + 2] = 255;
                    smokeImage.data[pixel + 3] = Math.round(alpha * 255);
                }
            }
            smokeContext.putImageData(smokeImage, 0, 0);
            const smokeTexture = new THREE.CanvasTexture(smokeCanvas);
            const smokePlaneGeometry = new THREE.PlaneGeometry(1, 1);
            const smokeCount = 13;
            for (let i = 0; i < smokeCount; i++) {
                const smokeMat = new THREE.MeshBasicMaterial({
                    map: smokeTexture,
                    color: 0x959c99,
                    transparent: true,
                    opacity: 0,
                    depthWrite: false,
                    depthTest: true,
                    side: THREE.DoubleSide,
                    toneMapped: false
                });
                const puff = new THREE.Mesh(smokePlaneGeometry, smokeMat);
                smokeGroup.add(puff);
                smokePuffs.push({ mesh: puff, material: smokeMat, phase: i / smokeCount, distance: 0 });
                fireRenderItems.push({ mesh: puff, distance: 0 });
            }
            scene.add(smokeGroup);

            const fireLight = new THREE.PointLight(0xff5722, 11.0, 40.0, 1.5);
            fireLight.position.set(fireX, fireY + 1.6, fireZ);
            scene.add(fireLight);
            dynamicLights.push({ light: fireLight, baseIntensity: 14.0, phase: 2.4 });
        }

        // ============================================================================
        // 5D. HIGH-DETAIL WOODEN TRIBAL CABIN, INTERIOR & ARTIFACTS BESIDE THE FIRE
        // ============================================================================
        function createTribalRugTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Woven pandanus reed base
            ctx.fillStyle = '#b9935a';
            ctx.fillRect(0, 0, 256, 256);

            // Fine cross-hatch weave lines
            ctx.strokeStyle = 'rgba(82, 54, 24, 0.25)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 256; i += 6) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 256); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(256, i); ctx.stroke();
            }

            // Tribal borders in crimson terracotta, charcoal & ochre
            ctx.strokeStyle = '#7c2d12';
            ctx.lineWidth = 12;
            ctx.strokeRect(18, 18, 220, 220);

            ctx.strokeStyle = '#1c1917';
            ctx.lineWidth = 5;
            ctx.strokeRect(32, 32, 192, 192);

            // Geometric tribal diamond & chevron motifs
            const colors = ['#991b1b', '#0f766e', '#d97706', '#1c1917'];
            for (let r = 0; r < 3; r++) {
                const rad = 75 - r * 22;
                ctx.fillStyle = colors[r % colors.length];
                ctx.beginPath();
                ctx.moveTo(128, 128 - rad);
                ctx.lineTo(128 + rad, 128);
                ctx.lineTo(128, 128 + rad);
                ctx.lineTo(128 - rad, 128);
                ctx.closePath();
                ctx.fill();
            }

            // Corner tribal sun/chevron ticks
            ctx.strokeStyle = '#fef3c7';
            ctx.lineWidth = 3;
            for (let i = 44; i <= 212; i += 14) {
                ctx.beginPath();
                ctx.moveTo(i, 20);
                ctx.lineTo(i + 7, 28);
                ctx.lineTo(i + 14, 20);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(i, 236);
                ctx.lineTo(i + 7, 228);
                ctx.lineTo(i + 14, 236);
                ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.encoding = THREE.sRGBEncoding;
            return tex;
        }

        function createHayStrawTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Warm sun-cured golden hay base
            ctx.fillStyle = '#c89d4c';
            ctx.fillRect(0, 0, 256, 256);

            // Thousands of layered golden straw/hay stalks running down the roof pitch
            const hayPalette = ['#e2be6b', '#d4a84f', '#b58938', '#8c6422', '#edd082', '#9e742b'];
            for (let i = 0; i < 1600; i++) {
                ctx.strokeStyle = hayPalette[i % hayPalette.length];
                ctx.lineWidth = 1 + (i % 2);
                const x = (hash2D(i, 1.3) * 256);
                const y = (hash2D(i, 7.9) * 256);
                const len = 18 + hash2D(i, 3.7) * 28;
                const tilt = (hash2D(i, 5.1) - 0.5) * 4.5;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + tilt, y + len);
                ctx.stroke();
            }

            // Horizontal bundle shadow bands where hay sheaves overlap
            for (let y = 32; y < 256; y += 64) {
                const grad = ctx.createLinearGradient(0, y - 10, 0, y + 12);
                grad.addColorStop(0, 'rgba(58, 38, 12, 0.0)');
                grad.addColorStop(0.5, 'rgba(42, 26, 8, 0.42)');
                grad.addColorStop(1, 'rgba(58, 38, 12, 0.0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, y - 10, 256, 22);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(3, 2);
            tex.encoding = THREE.sRGBEncoding;
            return tex;
        }

        function createTribalMaskTexture(seedHue = 0) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Dark carved ironwood base
            ctx.fillStyle = '#3a2212';
            ctx.fillRect(0, 0, 128, 256);

            // Tribal warpaint stripes & chevrons
            const accent = seedHue === 0 ? '#dc2626' : (seedHue === 1 ? '#0ea5e9' : '#eab308');
            ctx.strokeStyle = accent;
            ctx.lineWidth = 8;
            for (let y = 30; y < 230; y += 36) {
                ctx.beginPath();
                ctx.moveTo(12, y);
                ctx.lineTo(64, y + 18);
                ctx.lineTo(116, y);
                ctx.stroke();
            }

            // White lime-ash tribal dots
            ctx.fillStyle = '#f8fafc';
            for (let y = 24; y < 235; y += 18) {
                ctx.beginPath(); ctx.arc(22, y, 3.5, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(106, y, 3.5, 0, Math.PI * 2); ctx.fill();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.encoding = THREE.sRGBEncoding;
            return tex;
        }

            const turquoiseGemMat = new THREE.MeshStandardMaterial({
                color: 0x2dd4bf,
                emissive: 0x0d9488,
                emissiveIntensity: 0.85,
                roughness: 0.25
            });
            const emberGlowMat = new THREE.MeshStandardMaterial({
                color: 0xff6d00,
                emissive: 0xff3d00,
                emissiveIntensity: 2.2,
                roughness: 0.5
            });
            const gourdGlowMat = new THREE.MeshStandardMaterial({
                color: 0xffca64,
                emissive: 0xff8f00,
                emissiveIntensity: 2.0,
                roughness: 0.4
            });

            const addPart = (mesh, parent = cabinGroup) => {
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                parent.add(mesh);
                return mesh;
            };

            const floorY = 0.62;
            const wallH = 2.65;
            const cabinW = 6.2;   // X: -3.1 to +3.1
            const cabinD = 5.0;   // Z: -2.5 (back) to +2.5 (front wall)
            const porchD = 2.15;  // Z: +2.5 to +4.65 (front veranda facing campfire)

            // ====================================================================
            // 1. ELEVATED TIMBER FOUNDATION STILTS, FLOOR PLANKS & VERANDA STEPS
            // ====================================================================
            const stiltGeo = new THREE.CylinderGeometry(0.15, 0.19, 1.35, 8);
            const stiltX = [-2.95, -1.0, 1.0, 2.95];
            const stiltZ = [-2.35, 0.0, 2.35, 4.45];
            stiltX.forEach(sx => {
                stiltZ.forEach(sz => {
                    const stilt = addPart(new THREE.Mesh(stiltGeo, darkLogMat));
                    stilt.position.set(sx, floorY - 0.52, sz);
                });
            });

            // Cross-bearer foundation joists & rope lashings
            const joistGeo = new THREE.CylinderGeometry(0.11, 0.11, cabinW + 0.5, 8);
            joistGeo.rotateZ(Math.PI / 2);
            stiltZ.forEach(sz => {
                const joist = addPart(new THREE.Mesh(joistGeo, darkLogMat));
                joist.position.set(0, floorY - 0.12, sz);
            });

            // Individual bevelled hardwood floor planks (interior + front veranda porch)
            const totalDepth = cabinD + porchD;
            const numPlanks = 26;
            const plankDepth = totalDepth / numPlanks;
            const floorPlankGeo = new THREE.BoxGeometry(cabinW + 0.3, 0.10, plankDepth - 0.025);
            for (let i = 0; i < numPlanks; i++) {
                const pz = -2.5 + (i + 0.5) * plankDepth;
                const plank = addPart(new THREE.Mesh(floorPlankGeo, i % 2 === 0 ? plankFloorMat : medWoodMat));
                plank.position.set((hash2D(i, 1.7) - 0.5) * 0.06, floorY, pz);
            }

            // Wide front veranda entry steps leading toward the campfire
            for (let s = 0; s < 3; s++) {
                const stepW = 2.55;
                const stepLog = addPart(new THREE.Mesh(new THREE.BoxGeometry(stepW, 0.11, 0.34), plankFloorMat));
                stepLog.position.set(0, floorY - (s + 1) * 0.17, 4.78 + s * 0.34);

                for (let side = -1; side <= 1; side += 2) {
                    const stringer = addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.09, 0.45, 6), darkLogMat));
                    stringer.position.set(side * (stepW * 0.46), floorY - (s + 1) * 0.17 - 0.12, 4.78 + s * 0.34);
                }
            }

            // ====================================================================
            // 2. LOG & BAMBOO-FRAMED CABIN WALLS (OPEN FRONT DOOR & LARGE WINDOWS)
            // ====================================================================
            const cornerPostGeo = new THREE.CylinderGeometry(0.15, 0.17, wallH + 0.25, 10);
            const lashingRingGeo = new THREE.TorusGeometry(0.165, 0.028, 6, 12);
            lashingRingGeo.rotateX(Math.PI / 2);

            const mainCorners = [
                [-3.0, -2.4], [3.0, -2.4], // Back corners
                [-3.0,  2.4], [3.0,  2.4], // Front wall corners
                [-1.12, 2.4], [1.12, 2.4], // Wide open doorway posts
                [-3.0,  4.45], [3.0, 4.45], // Porch outer corners
                [-1.25, 4.45], [1.25, 4.45] // Porch entry posts
            ];
            mainCorners.forEach(([cx, cz], idx) => {
                const isPorch = cz > 3.0;
                const pH = isPorch ? wallH - 0.22 : wallH + 0.15;
                const post = addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.16, pH, 9), darkLogMat));
                post.position.set(cx, floorY + pH * 0.5, cz);

                // Hemp rope lashings at base and top of every structural column
                const lashTop = addPart(new THREE.Mesh(lashingRingGeo, ropeLashMat));
                lashTop.position.set(cx, floorY + pH - 0.18, cz);
                const lashBot = addPart(new THREE.Mesh(lashingRingGeo, ropeLashMat));
                lashBot.position.set(cx, floorY + 0.16, cz);
            });

            // Helper to stack horizontal notched timber logs between two points
            const addLogWallSegment = (x1, z1, x2, z2, yStart, yEnd, logRadius = 0.105) => {
                const dx = x2 - x1;
                const dz = z2 - z1;
                const len = Math.hypot(dx, dz);
                const ang = Math.atan2(dx, dz);
                const stepY = logRadius * 1.82;
                const count = Math.max(1, Math.floor((yEnd - yStart) / stepY));
                for (let i = 0; i < count; i++) {
                    const ly = yStart + (i + 0.5) * stepY;
                    const logGeo = new THREE.CylinderGeometry(logRadius * 0.95, logRadius, len, 8);
                    logGeo.rotateX(Math.PI / 2);
                    const logMesh = addPart(new THREE.Mesh(logGeo, i % 2 === 0 ? medWoodMat : darkLogMat));
                    logMesh.position.set((x1 + x2) * 0.5, ly, (z1 + z2) * 0.5);
                    logMesh.rotation.y = ang;
                }
            };

            // Back Wall (Z = -2.4): full height with central horizontal bamboo slat window
            addLogWallSegment(-3.0, -2.4, 3.0, -2.4, floorY + 0.05, floorY + 1.15);
            addLogWallSegment(-3.0, -2.4, -1.3, -2.4, floorY + 1.15, floorY + wallH);
            addLogWallSegment( 1.3, -2.4,  3.0, -2.4, floorY + 1.15, floorY + wallH);
            addLogWallSegment(-3.0, -2.4, 3.0, -2.4, floorY + 2.15, floorY + wallH);

            // Back window vertical bamboo bars
            for (let bx = -1.05; bx <= 1.05; bx += 0.35) {
                const bar = addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.05, 6), bambooMat));
                bar.position.set(bx, floorY + 1.65, -2.4);
            }

            // Left Wall (X = -3.0) & Right Wall (X = +3.0): wainscot logs + wide open view windows with propped thatch shutters
            [-3.0, 3.0].forEach(wx => {
                // Lower log wall up to waist height
                addLogWallSegment(wx, -2.4, wx, 2.4, floorY + 0.05, floorY + 1.05);
                // Corner wall piers flanking the large side window
                addLogWallSegment(wx, -2.4, wx, -1.15, floorY + 1.05, floorY + wallH);
                addLogWallSegment(wx,  1.15, wx,  2.4, floorY + 1.05, floorY + wallH);
                // Top wall plate lintel
                addLogWallSegment(wx, -2.4, wx, 2.4, floorY + 2.18, floorY + wallH);

                // Propped-open woven bamboo window shutter & support struts
                const sideSign = Math.sign(wx);
                const shutterGroup = new THREE.Group();
                shutterGroup.position.set(wx + sideSign * 0.08, floorY + 2.15, 0.0);
                shutterGroup.rotation.z = sideSign * 1.12; // Propped outward to invite viewing inside
                const shutterFrame = addPart(new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.15, 2.25), bambooMat), shutterGroup);
                shutterFrame.position.set(0, -0.55, 0);
                cabinGroup.add(shutterGroup);
            });

            // Front Wall (Z = +2.4): Wide 2.24m open entryway in the center + low side half-walls so the interior is completely visible
            addLogWallSegment(-3.0, 2.4, -1.12, 2.4, floorY + 0.05, floorY + 1.05);
            addLogWallSegment( 1.12, 2.4,  3.0, 2.4, floorY + 0.05, floorY + 1.05);
            addLogWallSegment(-3.0, 2.4,  3.0, 2.4, floorY + 2.25, floorY + wallH);

            // Porch handrail balusters & bamboo rails on left & right sides of the veranda
            [-3.0, 3.0].forEach(px => {
                addLogWallSegment(px, 2.4, px, 4.45, floorY + 0.78, floorY + 0.95, 0.075);
                for (let bz = 2.75; bz <= 4.15; bz += 0.45) {
                    const bal = addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.80, 6), bambooMat));
                    bal.position.set(px, floorY + 0.42, bz);
                }
            });
            // Front porch left & right railings flanking the steps
            addLogWallSegment(-3.0, 4.45, -1.25, 4.45, floorY + 0.78, floorY + 0.95, 0.075);
            addLogWallSegment( 1.25, 4.45,  3.0, 4.45, floorY + 0.78, floorY + 0.95, 0.075);

            // ====================================================================
            // 3. EXPOSED TIMBER ROOF TRUSSES, LAYERED PALM-THATCH ROOF & TOTEM GABLE
            // ====================================================================
            const eaveY = floorY + wallH;
            const ridgeY = eaveY + 1.95;
            const roofZStart = -3.05;
            const roofZEnd = 5.05;
            const roofLen = roofZEnd - roofZStart;
            const roofCenterZ = (roofZStart + roofZEnd) * 0.5;

            // Heavy carved ridgepole beam extending out past the front & back gables with horn finials
            const ridgeGeo = new THREE.CylinderGeometry(0.13, 0.14, roofLen + 0.9, 8);
            ridgeGeo.rotateX(Math.PI / 2);
            const ridgeBeam = addPart(new THREE.Mesh(ridgeGeo, darkLogMat));
            ridgeBeam.position.set(0, ridgeY, roofCenterZ);

            // Exposed A-frame timber rafters & collar ties visible from inside the cabin
            const slopeSpan = 3.95;
            const slopeAngle = Math.atan2(ridgeY - (eaveY - 0.25), slopeSpan);
            const rafterLen = Math.hypot(slopeSpan, ridgeY - (eaveY - 0.25));

            for (let rz = -2.7; rz <= 4.7; rz += 0.92) {
                for (let side = -1; side <= 1; side += 2) {
                    const rafterGeo = new THREE.CylinderGeometry(0.065, 0.075, rafterLen, 6);
                    const rafter = addPart(new THREE.Mesh(rafterGeo, medWoodMat));
                    rafter.position.set(side * slopeSpan * 0.5, (ridgeY + eaveY - 0.25) * 0.5, rz);
                    rafter.rotation.z = side * (Math.PI / 2 - slopeAngle);
                }
                // Horizontal collar tie beam & king-post strut
                const collar = addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 3.8, 6), darkLogMat));
                collar.rotation.z = Math.PI / 2;
                collar.position.set(0, eaveY + 0.72, rz);

                const kingPost = addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 1.18, 6), darkLogMat));
                kingPost.position.set(0, eaveY + 1.32, rz);
            }

            // Horizontal bamboo purlins across the rafters
            for (let p = 0.2; p <= 0.88; p += 0.22) {
                for (let side = -1; side <= 1; side += 2) {
                    const purlinGeo = new THREE.CylinderGeometry(0.04, 0.04, roofLen, 6);
                    purlinGeo.rotateX(Math.PI / 2);
                    const purlin = addPart(new THREE.Mesh(purlinGeo, bambooMat));
                    purlin.position.set(side * p * slopeSpan, mix(ridgeY, eaveY - 0.25, p) + 0.05, roofCenterZ);
                }
            }

            // Multi-tiered overlapping Golden Hay / Straw Thatch Roof with thick bundled sheaves & shaggy eave fringe
            const tiers = 5;
            for (let side = -1; side <= 1; side += 2) {
                for (let t = 0; t < tiers; t++) {
                    const t0 = t / tiers;
                    const t1 = (t + 1.14) / tiers;
                    const segSpan = (t1 - t0) * rafterLen;
                    const tMid = (t0 + t1) * 0.5;
                    const tierMat = t % 2 === 0 ? thatchRoofMat : thatchUnderMat;

                    // Thick sculpted hay layer with natural organic sag & bundled straw volume
                    const hayGeo = new THREE.BoxGeometry(segSpan, 0.18, roofLen + 0.28, 6, 2, 14);
                    const hPos = hayGeo.attributes.position;
                    for (let k = 0; k < hPos.count; k++) {
                        const vx = hPos.getX(k);
                        const vy = hPos.getY(k);
                        const vz = hPos.getZ(k);
                        const bundleRipple = Math.sin(vz * 4.5 + t * 1.7) * 0.035 + (valueNoise2D(vx * 3.2, vz * 3.2) - 0.5) * 0.045;
                        const eaveTuft = (vx * side > segSpan * 0.35) ? Math.sin(vz * 14.0 + t) * 0.04 : 0.0;
                        hPos.setY(k, vy + bundleRipple + eaveTuft);
                    }
                    hayGeo.computeVertexNormals();

                    const thatchSlab = addPart(new THREE.Mesh(hayGeo, tierMat));
                    const midX = side * tMid * slopeSpan;
                    const midY = mix(ridgeY + 0.14, eaveY - 0.24, tMid) + (tiers - t) * 0.04;
                    thatchSlab.position.set(midX, midY, roofCenterZ);
                    thatchSlab.rotation.z = -side * (slopeAngle - 0.025);
                }

                // Shaggy overhanging golden hay fringe tufts along the lower drip eaves
                const eaveX = side * (slopeSpan + 0.12);
                const eaveDropY = eaveY - 0.26;
                for (let fz = roofZStart + 0.25; fz <= roofZEnd - 0.25; fz += 0.38) {
                    const tuft = addPart(new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.48, 6), thatchRoofMat));
                    tuft.scale.set(0.65, 1.0, 1.35);
                    tuft.position.set(eaveX, eaveDropY, fz);
                    tuft.rotation.z = side * (Math.PI - 0.48);
                }
            }

            // Bundled Golden Hay Ridge Cap & Crossed Timber Hold-Down Spars along the Roof Crest
            const ridgeHayBundleGeo = new THREE.CylinderGeometry(0.28, 0.28, roofLen + 0.36, 12, 16);
            ridgeHayBundleGeo.rotateX(Math.PI / 2);
            const rPos = ridgeHayBundleGeo.attributes.position;
            for (let k = 0; k < rPos.count; k++) {
                const vz = rPos.getZ(k);
                const pinch = 1.0 - 0.14 * Math.pow(Math.sin(vz * 2.8), 2.0);
                rPos.setX(k, rPos.getX(k) * pinch);
                rPos.setY(k, rPos.getY(k) * pinch);
            }
            ridgeHayBundleGeo.computeVertexNormals();
            const ridgeHayCap = addPart(new THREE.Mesh(ridgeHayBundleGeo, thatchRoofMat));
            ridgeHayCap.position.set(0, ridgeY + 0.22, roofCenterZ);

            // Traditional crossed wooden wind-weights (katsuogi / thatch rider spars) pinning the hay ridge
            for (let rz = roofZStart + 0.65; rz <= roofZEnd - 0.65; rz += 1.15) {
                const lashRing = addPart(new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.026, 6, 12), ropeLashMat));
                lashRing.position.set(0, ridgeY + 0.22, rz);
                for (let side = -1; side <= 1; side += 2) {
                    const riderSpar = addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.045, 0.95, 6), darkLogMat));
                    riderSpar.position.set(side * 0.18, ridgeY + 0.36, rz);
                    riderSpar.rotation.z = -side * 0.62;
                }
            }

            // Carved Spirit-Bird Gable Crest & Crossed Ceremonial Horns above the front veranda
            for (let side = -1; side <= 1; side += 2) {
                const horn = addPart(new THREE.Mesh(new THREE.ConeGeometry(0.11, 1.45, 7), boneMat));
                horn.position.set(side * 0.35, ridgeY + 0.42, roofZEnd + 0.25);
                horn.rotation.z = -side * 0.55;
                horn.rotation.x = 0.22;
            }
            const sunDiscGable = addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.09, 14), terracottaMat));
            sunDiscGable.rotation.x = Math.PI / 2;
            sunDiscGable.position.set(0, ridgeY - 0.32, roofZEnd + 0.05);
            const sunGem = addPart(new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 10), turquoiseGemMat));
            sunGem.position.set(0, ridgeY - 0.32, roofZEnd + 0.10);

            // ====================================================================
            // 4. DETAILED CABIN INTERIOR (RUG, BED, WORKBENCH, BRAZIER & LANTERNS)
            // ====================================================================
            // 4A. Woven Pandanus Floor Mat with geometric tribal patterns
            const rugMat = new THREE.MeshStandardMaterial({
                map: createTribalRugTexture(),
                roughness: 0.88
            });
            const rugMesh = addPart(new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.025, 2.7), rugMat));
            rugMesh.position.set(0.0, floorY + 0.06, 0.05);

            // 4B. Raised Timber & Bamboo Sleeping Platform / Bed (Left side of cabin interior, X = -1.85)
            const bedGroup = new THREE.Group();
            bedGroup.position.set(-1.82, floorY + 0.05, -0.85);
            cabinGroup.add(bedGroup);

            const bedW = 1.65, bedL = 2.65, bedH = 0.48;
            for (let bx of [-bedW * 0.45, bedW * 0.45]) {
                for (let bz of [-bedL * 0.45, bedL * 0.45]) {
                    const leg = addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.08, bedH, 7), darkLogMat), bedGroup);
                    leg.position.set(bx, bedH * 0.5, bz);
                }
            }
            const bedFrame = addPart(new THREE.Mesh(new THREE.BoxGeometry(bedW, 0.09, bedL), medWoodMat), bedGroup);
            bedFrame.position.set(0, bedH, 0);

            // Animal pelt / hide throw & woven pandanus mattress
            const mattress = addPart(new THREE.Mesh(new THREE.BoxGeometry(bedW - 0.14, 0.12, bedL - 0.16), ropeLashMat), bedGroup);
            mattress.position.set(0, bedH + 0.09, 0);

            const furPelt = addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.68, 0.74, 0.05, 9), peltMat), bedGroup);
            furPelt.scale.set(1.0, 1.0, 1.35);
            furPelt.position.set(0.04, bedH + 0.16, 0.15);

            // Traditional carved wooden tribal headrest / pillow & rolled woven blanket
            const pillowRoll = addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 1.15, 10), terracottaMat), bedGroup);
            pillowRoll.rotation.z = Math.PI / 2;
            pillowRoll.position.set(0, bedH + 0.22, -0.95);

            // 4C. Shaman / Navigator's Workbench Table (Right side of cabin interior, X = +1.78)
            const tableGroup = new THREE.Group();
            tableGroup.position.set(1.78, floorY + 0.05, -0.55);
            cabinGroup.add(tableGroup);

            const tabW = 1.45, tabL = 2.35, tabH = 0.78;
            for (let tx of [-tabW * 0.42, tabW * 0.42]) {
                for (let tz of [-tabL * 0.42, tabL * 0.42]) {
                    const tLeg = addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.075, tabH, 7), darkLogMat), tableGroup);
                    tLeg.position.set(tx, tabH * 0.5, tz);
                }
            }
            const tableTop = addPart(new THREE.Mesh(new THREE.BoxGeometry(tabW, 0.08, tabL), plankFloorMat), tableGroup);
            tableTop.position.set(0, tabH, 0);

            // Carved wooden stool beside the workbench
            const stool = addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.22, 0.46, 10), darkLogMat), tableGroup);
            stool.position.set(-0.92, 0.23, 0.15);

            // 4D. Micronesian / Polynesian Stick-Chart Wave Navigator Gadget on the Workbench!
            const chartGroup = new THREE.Group();
            chartGroup.position.set(-0.12, tabH + 0.06, -0.35);
            chartGroup.rotation.y = 0.18;
            tableGroup.add(chartGroup);

            // Perimeter bamboo frame + diagonal curved ocean-swell sticks
            const stickPaths = [
                [[-0.38, -0.45], [0.38, -0.45]],
                [[-0.38,  0.45], [0.38,  0.45]],
                [[-0.38, -0.45], [-0.38, 0.45]],
                [[ 0.38, -0.45], [ 0.38, 0.45]],
                [[-0.38, -0.45], [0.38,  0.45]],
                [[-0.38,  0.45], [0.38, -0.45]],
                [[-0.38,  0.0],  [0.38,  0.0]],
                [[ 0.0,  -0.45], [0.0,   0.45]]
            ];
            stickPaths.forEach(([p1, p2]) => {
                const sdx = p2[0] - p1[0], sdz = p2[1] - p1[1];
                const slen = Math.hypot(sdx, sdz);
                const stick = addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, slen, 5), bambooMat), chartGroup);
                stick.rotation.x = Math.PI / 2;
                stick.rotation.z = -Math.atan2(sdx, sdz);
                stick.position.set((p1[0] + p2[0]) * 0.5, 0.015, (p1[1] + p2[1]) * 0.5);
            });
            // Cowrie shell & turquoise island markers tied at stick intersections
            const shellNodes = [[0, 0], [-0.22, -0.26], [0.24, 0.28], [-0.24, 0.25], [0.28, -0.18], [0, 0.32]];
            shellNodes.forEach(([nx, nz], idx) => {
                const shell = addPart(new THREE.Mesh(new THREE.SphereGeometry(0.032, 7, 7), idx === 0 ? turquoiseGemMat : boneMat), chartGroup);
                shell.scale.set(1.2, 0.65, 0.9);
                shell.position.set(nx, 0.028, nz);
            });

            // 4E. Stone Mortar & Pestle with Bioluminescent Herbal Paste + Painted Gourd Vessels on Workbench
            const mortar = addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.13, 0.16, 10), stoneMat), tableGroup);
            mortar.position.set(0.24, tabH + 0.11, 0.52);
            const herbalPaste = addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.12, 0.05, 10), turquoiseGemMat), tableGroup);
            herbalPaste.position.set(0.24, tabH + 0.17, 0.52);
            const pestle = addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.048, 0.28, 7), stoneMat), tableGroup);
            pestle.position.set(0.28, tabH + 0.24, 0.54);
            pestle.rotation.z = -0.42;

            // Gourd water bottle & ceramic tribal bowl
            const gourdBot = addPart(new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 10), terracottaMat), tableGroup);
            gourdBot.position.set(-0.26, tabH + 0.16, 0.72);
            const gourdTop = addPart(new THREE.Mesh(new THREE.SphereGeometry(0.095, 9, 9), terracottaMat), tableGroup);
            gourdTop.position.set(-0.26, tabH + 0.32, 0.72);
            const gourdNeck = addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.09, 7), ropeLashMat), tableGroup);
            gourdNeck.position.set(-0.26, tabH + 0.25, 0.72);

            // 4F. Back Storage Shelves with Tribal Skulls, Conch Shells, Coiled Rope & Scrolls
            for (let shY of [floorY + 1.05, floorY + 1.68]) {
                const shelf = addPart(new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.06, 0.42), plankFloorMat));
                shelf.position.set(0.0, shY, -2.14);

                for (let side = -0.8; side <= 0.8; side += 1.6) {
                    const bracket = addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.35, 6), darkLogMat));
                    bracket.position.set(side, shY - 0.14, -2.20);
                    bracket.rotation.x = 0.6;
                }
            }
            // Artifacts on shelves: Conch shell horn, terracotta urns, glowing crystal Cluster
            for (let p = 0; p < 4; p++) {
                const pot = addPart(new THREE.Mesh(new THREE.SphereGeometry(0.15, 9, 9), p % 2 === 0 ? terracottaMat : bambooMat));
                pot.scale.set(1.0, 1.2, 1.0);
                pot.position.set(-0.72 + p * 0.48, floorY + 1.22, -2.12);

        function createCoastalRocks() {
            const rockMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.88,
                metalness: 0.02,
                vertexColors: true
            });

            const rockClusters = [
                { x: -72.0, z: -42.0, count: 7, spread: 8.0, scale: 1.45 },
                { x:  66.0, z: -52.0, count: 6, spread: 7.2, scale: 1.30 },
                { x: -55.0, z:  62.5, count: 6, spread: 6.5, scale: 1.20 },
                { x: 152.0, z:  54.0, count: 6, spread: 6.2, scale: 1.10 },
                { x: -115.0, z: 48.0, count: 5, spread: 6.0, scale: 1.25 }
            ];

            const rockParts = [];
            rockClusters.forEach((cluster, cIdx) => {
                for (let i = 0; i < cluster.count; i++) {
                    const rx = cluster.x + (hash2D(cIdx, i * 3.1) - 0.5) * cluster.spread;
                    const rz = cluster.z + (hash2D(i * 7.3, cIdx) - 0.5) * cluster.spread;
                    const ry = getIslandHeight(rx, rz);

                    const rockGeo = new THREE.DodecahedronGeometry(1.1, 3);
                    const pos = rockGeo.attributes.position;
                    const colors = new Float32Array(pos.count * 3);
                    for (let v = 0; v < pos.count; v++) {
                        let vx = pos.getX(v);
                        let vy = pos.getY(v);
                        let vz = pos.getZ(v);
                        const n = fbm2D(vx * 2.4 + i * 3.1, vz * 2.4 + cIdx * 5.7);
                        const strata = Math.sin(vy * 9.0 + n * 4.0) * 0.08;
                        vx *= (0.78 + 0.42 * n + strata);
                        vy *= (0.48 + 0.28 * n);
                        vz *= (0.78 + 0.42 * n - strata);
                        pos.setXYZ(v, vx, vy, vz);

                        // Weathered coastal coral limestone coloration (warm sun-bleached top, dark wet base)
                        const wetMask = smoothstep(-0.4, 0.25, vy);
                        const shade = (0.32 + 0.42 * wetMask) * (0.75 + 0.35 * n);
                        colors[v * 3]     = shade * 0.92;
                        colors[v * 3 + 1] = shade * 0.86;
                        colors[v * 3 + 2] = shade * 0.76;
                    }
                    rockGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                    rockGeo.computeVertexNormals();

                    const s = cluster.scale * (0.55 + hash2D(rx, rz) * 0.9);
                    const rockMatrix = new THREE.Matrix4().compose(
                        new THREE.Vector3(rx, ry + s * 0.12, rz),
                        new THREE.Quaternion().setFromEuler(new THREE.Euler(0, hash2D(rz, rx) * Math.PI * 2, 0)),
                        new THREE.Vector3(s * 1.35, s * 0.72, s)
                    );
                    rockParts.push({ geometry: rockGeo, matrix: rockMatrix });
                }
            });

            // All rocks share one material, so they are merged into a single mesh
            const rockMesh = new THREE.Mesh(mergeGeometryParts(rockParts), rockMat);
            rockMesh.castShadow = true;
            rockMesh.receiveShadow = true;
            scene.add(rockMesh);
        }

        // ============================================================================
        // 6. DYNAMIC 24-HOUR SOLAR, LUNAR & ATMOSPHERIC CYCLE UPDATE
        // ============================================================================
        // Day/night palette colours are allocated once here instead of every frame
        const DAY_NIGHT_COLORS = {
            noonSun: new THREE.Color(0xfff8eb),
            goldenHour: new THREE.Color(0xff6b2b),
            dayTop: new THREE.Color(0x062b68),
            dayHor: new THREE.Color(0x397cca),
            sunTop: new THREE.Color(0x16193b),
            sunHor: new THREE.Color(0xe05a1e),
            nitTop: new THREE.Color(0x03091e),
            nitHor: new THREE.Color(0x0d1b35),
            groundDay: new THREE.Color(0x9e8f75),
            groundNight: new THREE.Color(0x24354b)
        };

        function updateDayNightAtmosphere(hours) {
            // Convert 0..24h to strictly periodic 2*PI solar angle so 24:00 and 00:00 are 100% identical
            const solarAngle = ((hours - 6.0) / 24.0) * Math.PI * 2.0;
            const sunY = Math.sin(solarAngle);
            const sunX = Math.cos(solarAngle);
            // Use integer harmonic (1.0 * solarAngle) instead of 0.5 * solarAngle so sunZ is periodic over 24h!
            const sunZ = 0.32 * Math.sin(solarAngle + 0.4);

            STATE.sunDirection.set(sunX, sunY, sunZ).normalize();
            STATE.moonDirection.set(-sunX, -sunY, -sunZ).normalize();
            skyMat.uniforms.uSkyRotation.value = solarAngle;

            sunLight.position.copy(STATE.sunDirection).multiplyScalar(CELESTIAL_LIGHT_DISTANCE);
            moonLight.position.copy(STATE.moonDirection).multiplyScalar(CELESTIAL_LIGHT_DISTANCE);

            const dayFactor = smoothstep(-0.10, 0.28, sunY);
            const twilightFactor = smoothstep(-0.20, 0.06, sunY) * (1.0 - smoothstep(0.04, 0.34, sunY));
            const nightFactor = 1.0 - smoothstep(-0.14, 0.04, sunY);

            const noonSunCol = DAY_NIGHT_COLORS.noonSun;
            const goldenHourCol = DAY_NIGHT_COLORS.goldenHour;
            STATE.sunColor.copy(noonSunCol).lerp(goldenHourCol, twilightFactor * 0.92);

            sunLight.color.copy(STATE.sunColor);
            sunLight.intensity = Math.max(0.0, smoothstep(-0.06, 0.28, sunY) * 3.4 + twilightFactor * 0.85);

            moonLight.intensity = nightFactor * 1.05;

            // Sky Top & Horizon Colors synced for Ocean Fresnel reflections
            const dayTop = DAY_NIGHT_COLORS.dayTop;
            const dayHor = DAY_NIGHT_COLORS.dayHor;
            const sunTop = DAY_NIGHT_COLORS.sunTop;
            const sunHor = DAY_NIGHT_COLORS.sunHor;
            const nitTop = DAY_NIGHT_COLORS.nitTop;
            const nitHor = DAY_NIGHT_COLORS.nitHor;

            STATE.skyTopColor.copy(nitTop).lerp(dayTop, dayFactor).lerp(sunTop, twilightFactor * 0.8);
            STATE.skyHorizonColor.copy(nitHor).lerp(dayHor, dayFactor).lerp(sunHor, twilightFactor * 0.9);

            // Warm coral-sand bounce light from below + tropical sky fill from above
            const groundDay = DAY_NIGHT_COLORS.groundDay;
            const groundNight = DAY_NIGHT_COLORS.groundNight;
            hemiLight.color.copy(STATE.skyHorizonColor);
            hemiLight.groundColor.copy(groundNight).lerp(groundDay, dayFactor);
            hemiLight.intensity = 0.42 + dayFactor * 0.56 + twilightFactor * 0.28;

            renderer.toneMappingExposure = 0.84 + dayFactor * 0.14 + twilightFactor * 0.08;

            updateClockUI(hours);
        }

        function updateClockUI(hours) {
            const wrappedH = ((hours % 24) + 24) % 24;
            const hh = Math.floor(wrappedH);
            const mm = Math.floor((wrappedH - hh) * 60);
            const formatted = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;

            const timeDisplay = document.getElementById('time-display');
            const phaseLabel = document.getElementById('phase-label');
            const timeSlider = document.getElementById('time-slider');

            if (timeDisplay && timeDisplay.textContent !== formatted) timeDisplay.textContent = formatted;
            if (timeSlider && document.activeElement !== timeSlider) {
                const sliderValue = wrappedH.toFixed(2);
                if (timeSlider.value !== sliderValue) timeSlider.value = sliderValue;
            }

            if (phaseLabel) {
                let phase = 'Starlit Night';
                if (wrappedH >= 5.2 && wrappedH < 7.2) phase = 'Golden Sunrise';
                else if (wrappedH >= 7.2 && wrappedH < 11.0) phase = 'Morning Lagoon';
                else if (wrappedH >= 11.0 && wrappedH < 15.5) phase = 'Tropical Midday';
                else if (wrappedH >= 15.5 && wrappedH < 17.3) phase = 'Warm Afternoon';
                else if (wrappedH >= 17.3 && wrappedH < 19.2) phase = 'Magenta Sunset';
                else if (wrappedH >= 19.2 && wrappedH < 20.5) phase = 'Blue Dusk';
                if (phaseLabel.textContent !== phase) phaseLabel.textContent = phase;
            }
        }

        // ============================================================================
        // 7. UI CONTROLS & CAMERA PRESETS
        // ============================================================================
        function setupUIControls() {
            const timeSlider = document.getElementById('time-slider');
            const waveSlider = document.getElementById('wave-slider');
            const cloudSlider = document.getElementById('cloud-slider');
            const cumulusSlider = document.getElementById('cumulus-slider');
            const speedSlider = document.getElementById('speed-slider');
            const deckToggle = document.getElementById('control-deck-toggle');
            const deckDetails = document.getElementById('control-deck-details');
            const deckToggleLabel = document.getElementById('control-deck-toggle-label');
            const deckToggleIcon = document.getElementById('control-deck-toggle-icon');

            deckToggle.addEventListener('click', () => {
                const expanded = deckToggle.getAttribute('aria-expanded') !== 'true';
                deckToggle.setAttribute('aria-expanded', String(expanded));
                deckToggle.setAttribute('aria-label', expanded ? 'Collapse controls' : 'Expand controls');
                deckToggle.title = expanded ? 'Collapse controls' : 'Expand controls';
                deckToggleLabel.textContent = expanded ? 'Close' : 'Controls';
                deckToggleIcon.classList.toggle('rotate-180', expanded);
                deckDetails.classList.toggle('hidden', !expanded);
            });

            timeSlider.addEventListener('input', (e) => {
                STATE.timeOfDay = parseFloat(e.target.value);
                updateDayNightAtmosphere(STATE.timeOfDay);
            });

            waveSlider.addEventListener('input', (e) => {
                STATE.waveScale = parseFloat(e.target.value);
                oceanMat.uniforms.uWaveScale.value = STATE.waveScale;
                document.getElementById('wave-val').textContent = STATE.waveScale.toFixed(2) + 'x';
            });

            cloudSlider.addEventListener('input', (e) => {
                STATE.cloudCoverage = parseFloat(e.target.value);
                skyMat.uniforms.uCloudCoverage.value = STATE.cloudCoverage;
                oceanMat.uniforms.uCloudCoverage.value = STATE.cloudCoverage;
                document.getElementById('cloud-val').textContent = Math.round(STATE.cloudCoverage * 100) + '%';
            });

            cumulusSlider.addEventListener('input', (e) => {
                STATE.cumulusCoverage = parseFloat(e.target.value);
                skyMat.uniforms.uCumulusCoverage.value = STATE.cumulusCoverage;
                oceanMat.uniforms.uCumulusCoverage.value = STATE.cumulusCoverage;
                document.getElementById('cumulus-val').textContent = Math.round(STATE.cumulusCoverage * 100) + '%';
            });

            speedSlider.addEventListener('input', (e) => {
                STATE.cycleSpeed = parseFloat(e.target.value);
                document.getElementById('speed-val').textContent = STATE.cycleSpeed.toFixed(1) + 'x';
            });
        }

        function toggleAutoCycle() {
            STATE.autoCycle = !STATE.autoCycle;
            document.getElementById('icon-play').classList.toggle('hidden', STATE.autoCycle);
            document.getElementById('icon-pause').classList.toggle('hidden', !STATE.autoCycle);
        }

        function jumpToTime(targetHour) {
            STATE.timeOfDay = targetHour;
            updateDayNightAtmosphere(STATE.timeOfDay);
        }

        function setCameraPreset(presetName) {
            document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`cam-${presetName}`);
            if (activeBtn) activeBtn.classList.add('active');

            STATE.cameraAnimating = true;
            if (presetName === 'overview') {
                STATE.cameraTargetPos.set(145, 34, 155);
                STATE.cameraTargetLook.set(12, 3.5, 4);
            } else if (presetName === 'beach') {
                STATE.cameraTargetPos.set(92, 4.2, 52);
                STATE.cameraTargetLook.set(8, 5.5, 4);
            } else if (presetName === 'reef') {
                // Close lagoon vantage point looking down into the living 3D coral gardens & swimming manta rays
                STATE.cameraTargetPos.set(74, 6.8, 58);
                STATE.cameraTargetLook.set(62, -1.2, 36);
            } else if (presetName === 'shipwreck') {
                // Starboard-beam view of the listing galleon, half-submerged on the north-east shelf
                STATE.cameraTargetPos.set(189, 7.5, -74.5);
                STATE.cameraTargetLook.set(168, 0.8, -82);
            } else if (presetName === 'village') {
                // Scenic view of the overwater thatch bungalow pier, outrigger canoes & beach campfire
                STATE.cameraTargetPos.set(74, 8.2, 52);
                STATE.cameraTargetLook.set(48, 2.8, 18);
            } else if (presetName === 'cabin') {
                // Close view showcasing the grand wooden tribal cabin with its golden hay roof, totem pole & BBQ campfire
                STATE.cameraTargetPos.set(60.5, 5.2, 30.8);
                STATE.cameraTargetLook.set(43.5, 3.6, 13.5);
            } else if (presetName === 'cabinInterior') {
                // Veranda threshold view looking directly inside the spacious cabin at the bed, stick-chart navigator, masks & brazier
                STATE.cameraTargetPos.set(49.2, 4.15, 19.6);
                STATE.cameraTargetLook.set(40.5, 3.10, 10.5);
            } else if (presetName === 'sky') {
                // Low-angle beach view tilting directly upward through the wind-swept palm canopy into the clouds & Milky Way
                STATE.cameraTargetPos.set(-14.5, 2.8, 24.5);
                STATE.cameraTargetLook.set(4.0, 15.5, -4.0);
            } else if (presetName === 'horizon') {
                // Beachfront view framed directly toward the towering giant tropical cumulus horizon clouds
                STATE.cameraTargetPos.set(-88, 3.8, -58);
                STATE.cameraTargetLook.set(160, 28.0, 115);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ============================================================================
        // 8. MAIN ANIMATION LOOP
        // ============================================================================
        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.1);
            STATE.elapsedTime += dt;

            // Advance 24h cycle if auto-cycle is enabled
            if (STATE.autoCycle) {
                STATE.timeOfDay = (STATE.timeOfDay + dt * STATE.cycleSpeed) % 24.0;
                updateDayNightAtmosphere(STATE.timeOfDay);
            }

            // Smooth camera preset transitions
            if (STATE.cameraAnimating) {
                camera.position.lerp(STATE.cameraTargetPos, dt * 3.2);
                controls.target.lerp(STATE.cameraTargetLook, dt * 3.2);
                if (camera.position.distanceTo(STATE.cameraTargetPos) < 0.15) {
                    STATE.cameraAnimating = false;
                }
            }

            // Soft ocean/terrain floor so camera never clips underwater while allowing full upward sky tilt
            const groundUnderCam = getIslandHeight(camera.position.x, camera.position.z);
            const minCamY = Math.max(1.15, groundUnderCam + 0.75);
            if (camera.position.y < minCamY) {
                camera.position.y = minCamY;
            }

            controls.update();
            skyMesh.position.copy(camera.position);
            oceanMesh.position.x = camera.position.x;
            oceanMesh.position.z = camera.position.z;

            // Update Shader Uniforms
            skyMat.uniforms.uTime.value = STATE.elapsedTime;
            oceanMat.uniforms.uTime.value = STATE.elapsedTime;

            if (sandMat && sandMat.userData.shader) {
                sandMat.userData.shader.uniforms.uTime.value = STATE.elapsedTime;
            }

            for (let i = 0; i < frondMaterials.length; i++) {
                const sh = frondMaterials[i].userData.shader;
                if (sh) sh.uniforms.uTime.value = STATE.elapsedTime;
            }

            for (let i = 0; i < trunkMaterials.length; i++) {
                const sh = trunkMaterials[i].userData.shader;
                if (sh) sh.uniforms.uTime.value = STATE.elapsedTime;
            }

            // Animate Underwater Marine Life (Manta Rays & Reef Fish Schools)
            const t = STATE.elapsedTime;
            for (let i = 0; i < marineLifeAgents.length; i++) {
                const a = marineLifeAgents[i];
                const ang = t * a.speed + a.phase;
                const nx = a.cx + Math.cos(ang) * a.rx;
                const nz = a.cz + Math.sin(ang * 0.85) * a.rz;
                const dx = -Math.sin(ang) * a.rx * a.speed;
                const dz = Math.cos(ang * 0.85) * 0.85 * a.rz * a.speed;

                const groundH = getIslandHeight(nx, nz);
                const safeY = Math.min(-0.38, Math.max(groundH + 0.35, a.depth + Math.sin(t * 1.2 + a.phase) * 0.12));

                a.mesh.position.set(nx, safeY, nz);
                a.mesh.rotation.y = Math.atan2(dx, dz);
            }

            // Animate Soaring Seagulls wheeling and banking in the tropical wind
            for (let i = 0; i < seagullAgents.length; i++) {
                const g = seagullAgents[i];
                const ang = t * g.speed + g.phase;
                const gx = g.cx + Math.cos(ang) * g.rx + Math.sin(ang * 0.5) * 8.0;
                const gz = g.cz + Math.sin(ang) * g.rz;
                const gy = g.baseY + Math.sin(t * 0.9 + g.phase) * 2.4;

                const dx = -Math.sin(ang) * g.rx * g.speed + Math.cos(ang * 0.5) * 4.0 * g.speed;
                const dz = Math.cos(ang) * g.rz * g.speed;

                g.mesh.position.set(gx, gy, gz);
                g.mesh.rotation.y = Math.atan2(dx, dz);
                g.mesh.rotation.z = Math.sin(ang) * 0.24; // Natural banking tilt on turns
            }

            // Animate Bamboo Wind Chimes, Hanging Gourd Lanterns & Barbeque Spit-Roast
            for (let i = 0; i < windChimeGroups.length; i++) {
                const wc = windChimeGroups[i];
                wc.group.rotation.z = Math.sin(t * 2.3 + wc.phase) * 0.09 + 0.03;
                wc.group.rotation.x = Math.cos(t * 1.8 + wc.phase) * 0.06;
            }
            if (bbqSpitRod) {
                bbqSpitRod.rotation.x = t * 0.65;
            }

            // Animate flickering Beach Campfire, Cabin Lanterns & Overwater Bungalow Lights (strongest at dusk & night)
            const nightGlowBoost = 1.0 - smoothstep(-0.05, 0.28, STATE.sunDirection.y) * 0.65;
            for (let i = 0; i < dynamicLights.length; i++) {
                const dl = dynamicLights[i];
                const flicker = 0.84 + 0.16 * Math.sin(t * 11.0 + dl.phase) * Math.cos(t * 17.3);
                dl.light.intensity = dl.baseIntensity * flicker * nightGlowBoost;
            }
            for (let i = 0; i < flameMeshes.length; i++) {
                const fm = flameMeshes[i];
                const flicker = 0.92 + 0.12 * Math.sin(t * 13.0 + fm.phase);
                fm.material.uniforms.uTime.value = t;
                fm.mesh.scale.set(fm.width * flicker, fm.height * flicker, fm.width * flicker);
                fm.mesh.rotation.y = t * 0.65 + fm.phase;
            }
            for (let i = 0; i < fireSparks.length; i++) {
                const spark = fireSparks[i];
                const life = (t * 0.38 + spark.phase) % 1.0;
                const angle = spark.phase * Math.PI * 2.0 + t * 0.7;
                const spread = 0.12 + life * 0.7;
                spark.mesh.position.set(
                    Math.cos(angle) * spread,
                    0.78 + life * 2.4,
                    Math.sin(angle) * spread
                );
                const fadeIn = smoothstep(0.0, 0.08, life);
                const fadeOut = 1.0 - smoothstep(0.72, 1.0, life);
                spark.material.opacity = 0.95 * fadeIn * fadeOut;
                const size = 0.45 + (1.0 - life) * 0.65;
                spark.mesh.scale.setScalar(size);
            }
            camera.getWorldPosition(smokeCameraPosition);
            for (let i = 0; i < smokePuffs.length; i++) {
                const puff = smokePuffs[i];
                const life = (t * 0.24 + puff.phase) % 1.0;
                const drift = life * 2.8;
                const turbulence = 0.18 + life * 1.05;
                const fadeIn = smoothstep(0.0, 0.14, life);
                const fadeOut = 1.0 - smoothstep(0.78, 1.0, life);
                puff.mesh.position.set(
                    Math.sin(t * 0.55 + puff.phase * 6.0) * turbulence + drift,
                    1.5 + life * 7.0,
                    Math.cos(t * 0.42 + puff.phase * 5.0) * turbulence * 0.7 - life * 0.9
                );
                puff.mesh.scale.set(1.25 + life * 2.9, 1.4 + life * 2.7, 1);
                puff.material.opacity = 0.34 * fadeIn * fadeOut;
                puff.mesh.quaternion.copy(camera.quaternion);
                puff.mesh.rotateZ(Math.sin(t * 0.22 + puff.phase * 6.0) * 0.16);
            }
            for (let i = 0; i < fireRenderItems.length; i++) {
                const item = fireRenderItems[i];
                item.mesh.getWorldPosition(smokeWorldPosition);
                item.distance = smokeCameraPosition.distanceToSquared(smokeWorldPosition);
            }
            fireRenderItems.sort((a, b) => b.distance - a.distance);
            for (let i = 0; i < fireRenderItems.length; i++) {
                fireRenderItems[i].mesh.renderOrder = 11 + i;
            }

            renderer.render(scene, camera);
        }

        window.onload = function () {
            initScene();
            setupUIControls();
            updateDayNightAtmosphere(STATE.timeOfDay);
            animate();
        };
    </script>
