<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nite Mart Reserve — a luxury convenience store in the rain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050407; --panel:rgba(14,11,10,.66); --panel-edge:rgba(216,180,106,.28); --text:#f4ede0; --muted:#b8a98e;
  --gold:#d8b46a; --gold-ink:#1a1408; --cyan:#3ff0ff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --panel:rgba(250,246,238,.84); --panel-edge:rgba(120,90,40,.28); --text:#1d160c; --muted:#6b5a3c; } }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --panel:rgba(14,11,10,.66); --panel-edge:rgba(216,180,106,.28); --text:#f4ede0; --muted:#b8a98e; } }
:root[data-theme="dark"]{ --panel:rgba(14,11,10,.66); --panel-edge:rgba(216,180,106,.28); --text:#f4ede0; --muted:#b8a98e; }
*,*::before,*::after{box-sizing:inherit}
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{ height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--text); font-family:"Zen Kaku Gothic New","Hiragino Sans","Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
#app{ position:fixed; inset:0; touch-action:none; }
#app canvas{ display:block; width:100%; height:100%; cursor:grab; }
#app canvas.grabbing{ cursor:grabbing; } #app canvas.pointing{ cursor:pointer; }
.hud{ position:fixed; z-index:2; pointer-events:none; } .hud > *{ pointer-events:auto; }
.card{ background:var(--panel); border:1px solid var(--panel-edge); backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px) saturate(1.2); }
#title{ top:calc(14px + env(safe-area-inset-top,0px)); left:14px; padding:12px 18px 12px; border-radius:4px 18px 4px 18px; }
#title h1{ margin:0; font-family:"Playfair Display",Georgia,serif; font-weight:700; font-size:24px; line-height:1; letter-spacing:.06em; }
#title h1 span{ display:block; font-style:italic; font-weight:500; font-size:13px; letter-spacing:.02em; color:var(--gold); margin-top:5px; }
#basket{ top:calc(14px + env(safe-area-inset-top,0px)); right:14px; background:#120e08; color:var(--gold); border:1px solid rgba(216,180,106,.55); border-radius:3px 14px 3px 14px;
  padding:9px 16px; font-weight:700; font-size:13.5px; box-shadow:0 10px 30px rgba(0,0,0,.45); display:flex; gap:10px; align-items:baseline; }
#basket b{ font-family:"Playfair Display",Georgia,serif; font-size:22px; color:#f4e3b8; }
#basket.bump{ animation:bump .35s ease; } @keyframes bump{ 40%{ transform:scale(1.07);} }
#controls{ left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom,0px)); border-radius:14px; padding:8px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; justify-content:center; max-width:calc(100% - 20px); }
#controls .group{ display:flex; gap:4px; padding:2px; border-radius:10px; background:rgba(216,180,106,.08); }
button{ font:inherit; font-size:13px; font-weight:700; color:var(--text); background:transparent; border:1px solid transparent; border-radius:8px; padding:7px 11px; cursor:pointer; white-space:nowrap; }
button:hover{ background:rgba(216,180,106,.16); }
button[aria-pressed="true"]{ background:var(--gold); color:var(--gold-ink); }
button:focus-visible, input:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
#controls label{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; padding:0 8px; color:var(--muted); }
input[type=range]{ width:110px; accent-color:var(--gold); }
#hint{ left:50%; transform:translateX(-50%); bottom:calc(76px + env(safe-area-inset-bottom,0px)); font-size:12.5px; color:rgba(244,237,224,.75); text-shadow:0 1px 6px #000; white-space:nowrap; transition:opacity .8s; }
#tip{ position:fixed; z-index:3; pointer-events:none; padding:8px 12px; border-radius:3px 10px 3px 10px; font-size:13px; font-weight:700; background:rgba(14,11,8,.92); color:#f4ede0; border:1px solid rgba(216,180,106,.35); transform:translate(14px,14px); opacity:0; transition:opacity .15s; max-width:250px; }
#tip small{ display:block; font-weight:500; color:#b8a98e; font-size:12px; margin-top:2px; }
#tip .price{ color:var(--gold); margin-left:6px; }
#toast{ position:fixed; z-index:3; left:50%; top:calc(78px + env(safe-area-inset-top,0px)); transform:translate(-50%,-8px); opacity:0; transition:all .3s; pointer-events:none; background:rgba(14,11,8,.92); color:#f4ede0; padding:8px 16px; border-radius:20px; font-size:13px; font-weight:700; border:1px solid rgba(216,180,106,.35); }
#toast.show{ opacity:1; transform:translate(-50%,0); }
#loading{ position:fixed; inset:0; z-index:5; display:grid; place-items:center; background:#050407; color:#d8b46a; font-family:"Playfair Display",Georgia,serif; font-style:italic; font-size:18px; letter-spacing:.03em; transition:opacity .7s; }
#loading.gone{ opacity:0; pointer-events:none; }
#err{ display:none; position:fixed; inset:0; z-index:6; place-items:center; text-align:center; padding:24px; background:#050407; color:#f4ede0; }
@media (max-width:640px){
  #title{ padding:9px 12px; } #title h1{ font-size:18px; } #title h1 span{ display:none; }
  #controls{ bottom:calc(8px + env(safe-area-inset-bottom,0px)); }
  #hint{ bottom:calc(122px + env(safe-area-inset-bottom,0px)); font-size:11.5px; }
  input[type=range]{ width:80px; } button{ padding:7px 9px; font-size:12.5px; }
}
@media (prefers-reduced-motion: reduce){ #basket.bump{ animation:none; } #toast, #tip{ transition:none; } }
</style>
</head>
<body>
<div id="app" aria-label="Interactive 3D scene of a luxury convenience store at night in the rain"></div>
<div id="title" class="hud card"><h1>NITE MART<span>Reserve · fine foods, open all night</span></h1></div>
<div id="basket" class="hud" aria-live="polite"><span>Basket</span><b id="bcount">0</b><span id="btotal">¥0</span></div>
<div id="hint" class="hud">Drag to look around, scroll or pinch to zoom, click anything on a shelf or anything that glows</div>
<nav id="controls" class="hud card" aria-label="Scene controls">
  <div class="group" role="group" aria-label="Camera">
    <button data-view="street" aria-pressed="true">Street</button>
    <button data-view="door" aria-pressed="false">Entrance</button>
    <button data-view="inside" aria-pressed="false">Inside</button>
    <button data-view="lounge" aria-pressed="false">Lounge</button>
    <button data-view="upstairs" aria-pressed="false">Upstairs</button>
    <button data-view="alley" aria-pressed="false">Alley</button>
  </div>
  <label>Rain <input id="rain" type="range" min="0" max="100" value="70" aria-label="Rain intensity"></label>
  <div class="group">
    <button id="lights" aria-pressed="true">Store lights</button>
    <button id="bolt">Lightning</button>
    <button id="sound" aria-pressed="false">Sound</button>
    <button id="quality" aria-pressed="true">High quality</button>
  </div>
</nav>
<div id="tip"></div><div id="toast"></div>
<div id="loading">Polishing the marble and baking the light…</div>
<div id="err">This scene needs WebGL 2. Try a recent desktop browser with hardware acceleration turned on.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lights/RectAreaLightUniformsLib.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FXAAShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
(async function(){
'use strict';
if(!window.THREE){ document.getElementById('err').style.display='grid'; return; }
const V3=THREE.Vector3, TAU=Math.PI*2;
const F=0.15, CEIL=4.4, HW=12, DEP=16, FL2=5.0, CEIL2=8.7, ROOF=9.0;
const HOLE={x0:2,x1:6,z0:-6,z1:-2}, KEEP=[];          // store floor height, ceiling, half width, depth
const isMobile = matchMedia('(pointer:coarse)').matches || innerWidth < 700;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SERIF='"Playfair Display","Bodoni 72",Didot,Georgia,serif';
let _s=90211;
function rnd(){ _s|=0; _s=_s+0x6D2B79F5|0; let t=Math.imul(_s^_s>>>15,1|_s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }
const R=(a,b)=>a+rnd()*(b-a), pick=a=>a[Math.floor(rnd()*a.length)];

// ---------- renderer
let renderer;
try{ renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'}); }catch(e){ document.getElementById('err').style.display='grid'; return; }
renderer.setPixelRatio(Math.min(devicePixelRatio,isMobile?0.85:1.25));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.shadowMap.autoUpdate=false;
document.getElementById('app').appendChild(renderer.domElement);
const WGL2=renderer.capabilities.isWebGL2, maxAniso=renderer.capabilities.getMaxAnisotropy();
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x05070f); scene.fog=new THREE.FogExp2(0x0a0d1c,0.022);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,0.1,260);

// ---------- helpers
function makeTex(w,h,draw,o={}){ const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); draw(g,w,h); const t=new THREE.CanvasTexture(c); if(o.srgb!==false) t.encoding=THREE.sRGBEncoding; t.anisotropy=Math.min(8,maxAniso); if(o.repeat){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(o.repeat[0],o.repeat[1]); } return t; }
const std=o=>new THREE.MeshStandardMaterial(o), basic=o=>new THREE.MeshBasicMaterial(o);
function add(geo,mat,x=0,y=0,z=0,parent=scene){ const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); parent.add(m); return m; }
function box(w,h,d,mat,x,y,z,parent){ return add(new THREE.BoxGeometry(w,h,d),mat,x,y,z,parent); }
function boxB(w,h,d,mat,x,y,z,parent){ return box(w,h,d,mat,x,y+h/2,z,parent); }
function plane(w,h,mat,x,y,z,ry=0,parent){ const m=add(new THREE.PlaneGeometry(w,h),mat,x,y,z,parent); m.rotation.y=ry; return m; }
function flat(w,h,mat,x,y,z,parent){ const m=add(new THREE.PlaneGeometry(w,h),mat,x,y,z,parent); m.rotation.x=-Math.PI/2; return m; }
function cyl(rt,rb,h,mat,x,y,z,seg=20,parent){ return add(new THREE.CylinderGeometry(rt,rb,h,seg),mat,x,y+h/2,z,parent); }
function decal(m){ m.polygonOffset=true; m.polygonOffsetFactor=-2; m.polygonOffsetUnits=-2; return m; }
function star(g,cx,cy,r1,r2,n){ g.beginPath(); for(let i=0;i<n*2;i++){ const r=i%2?r2:r1,a=i*Math.PI/n-Math.PI/2; g.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);} g.closePath(); }
function fitText(g,t,x,y,maxW,weight,size,family){ let s=size; do{ g.font=`${weight} ${s}px ${family||'"Arial Black","Helvetica Neue",Arial,sans-serif'}`; s-=2; }while(g.measureText(t).width>maxW&&s>8); g.fillText(t,x,y); }
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function speckle(g,w,h,n,lo,hi,a,sz=2){ for(let i=0;i<n;i++){ const v=Math.floor(R(lo,hi)); g.fillStyle=`rgba(${v},${v},${v+2},${a})`; g.fillRect(R(0,w),R(0,h),sz,sz); } }
function normalFrom(canvas,strength=3,ds=1,wrap){ const w=Math.max(4,Math.floor(canvas.width/ds)),h=Math.max(4,Math.floor(canvas.height/ds)); const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); g.drawImage(canvas,0,0,w,h);
  const src=g.getImageData(0,0,w,h).data, out=g.createImageData(w,h), d=out.data, L=new Float32Array(w*h);
  for(let i=0;i<w*h;i++) L[i]=(src[i*4]*0.3+src[i*4+1]*0.59+src[i*4+2]*0.11)/255;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const xl=(x-1+w)%w,xr=(x+1)%w,yu=(y-1+h)%h,yd=(y+1)%h; const dx=(L[y*w+xr]-L[y*w+xl])*strength, dy=(L[yd*w+x]-L[yu*w+x])*strength, len=Math.hypot(dx,dy,1), i=(y*w+x)*4; d[i]=(-dx/len*.5+.5)*255; d[i+1]=(dy/len*.5+.5)*255; d[i+2]=(1/len*.5+.5)*255; d[i+3]=255; }
  g.putImageData(out,0,0); const t=new THREE.CanvasTexture(c); t.anisotropy=Math.min(8,maxAniso); if(wrap){ t.wrapS=t.wrapT=THREE.RepeatWrapping; } return t; }
function withNormal(mat,strength=3,scale=0.6,ds=1){ mat.normalMap=normalFrom(mat.map.image,strength,ds,mat.map.wrapS===THREE.RepeatWrapping); mat.normalScale.set(scale,scale); return mat; }
const clickables=[];
function interactive(obj,ia){ obj.userData.ia=ia; clickables.push(obj); return obj; }

// ---------- luxury textures & materials
function veins(g,w,h,n,cols,lw){ for(let i=0;i<n;i++){ g.strokeStyle=pick(cols); g.lineWidth=R(lw[0],lw[1]); g.globalAlpha=R(.25,.8); g.beginPath(); let x=R(-w*.2,w), y=R(-h*.2,h); g.moveTo(x,y); const a=R(-.6,.6)+(rnd()<.5?0:Math.PI); for(let k=0;k<14;k++){ x+=Math.cos(a+R(-.7,.7))*w*.06; y+=Math.sin(a+R(-.7,.7))*w*.06; g.lineTo(x,y);} g.stroke(); } g.globalAlpha=1; }
const marbleWTex=makeTex(1024,512,(g,w,h)=>{ const gr=g.createLinearGradient(0,0,w,h); gr.addColorStop(0,'#f3f1ec'); gr.addColorStop(1,'#e6e3dc'); g.fillStyle=gr; g.fillRect(0,0,w,h); speckle(g,w,h,6000,200,240,.3,2); g.filter='blur(1.2px)'; veins(g,w,h,30,['#9a958c','#b8b2a6','#c9a86a'],[0.6,2.4]); g.filter='none'; veins(g,w,h,12,['#8a857c'],[0.4,1]); });
const walnutTex=makeTex(512,512,(g,w,h)=>{ g.fillStyle='#3f2416'; g.fillRect(0,0,w,h); for(let x=0;x<w;x+=2){ const v=R(-14,14); g.fillStyle=`rgba(${110+v},${66+v*.6},${40+v*.4},${R(.15,.5)})`; g.beginPath(); g.moveTo(x,0); for(let y=0;y<=h;y+=16) g.lineTo(x+Math.sin(y*.02+x*.05)*3,y); g.lineTo(x+2,h); g.lineTo(x+2,0); g.fill(); } for(let i=0;i<10;i++){ g.strokeStyle='rgba(30,15,8,.35)'; g.lineWidth=R(1,3); g.beginPath(); const cx=R(0,w),cy=R(0,h); g.ellipse(cx,cy,R(4,10),R(20,60),0,0,TAU); g.stroke(); } },{repeat:[1,1]});
walnutTex.wrapS=walnutTex.wrapT=THREE.RepeatWrapping;
const graniteTex=makeTex(512,512,(g,w,h)=>{ g.fillStyle='#0f1012'; g.fillRect(0,0,w,h); speckle(g,w,h,26000,20,70,.6,2); speckle(g,w,h,2500,120,200,.5,2); speckle(g,w,h,600,160,210,.8,1); },{repeat:[1,1]});
const onyxTex=makeTex(1024,512,(g,w,h)=>{ const gr=g.createLinearGradient(0,0,w,h); gr.addColorStop(0,'#f5c77a'); gr.addColorStop(.5,'#ffdca0'); gr.addColorStop(1,'#e9a957'); g.fillStyle=gr; g.fillRect(0,0,w,h); g.filter='blur(3px)'; for(let i=0;i<60;i++){ g.strokeStyle=pick(['rgba(255,240,210,.5)','rgba(190,110,40,.35)','rgba(140,70,20,.25)']); g.lineWidth=R(4,22); g.beginPath(); let x=R(0,w),y=R(0,h); g.moveTo(x,y); for(let k=0;k<8;k++){ x+=R(-80,80); y+=R(-40,40); g.quadraticCurveTo(x+R(-40,40),y+R(-40,40),x,y);} g.stroke(); } g.filter='none'; });
const M={
  brass: std({color:0xd6ab5e,metalness:1,roughness:0.24}),
  brushed: std({color:0xc79b52,metalness:1,roughness:0.38}),
  chrome: std({color:0xffffff,metalness:1,roughness:0.1}),
  frame: std({color:0x2a2622,metalness:0.85,roughness:0.3}),
  darkMetal: std({color:0x23252b,metalness:0.7,roughness:0.4}),
  black: std({color:0x111214,roughness:0.5}),
  white: std({color:0xeeeeea,roughness:0.45}),
  marbleW: withNormal(std({map:marbleWTex,roughness:0.12,metalness:0}),2,0.25),
  walnut: withNormal(std({map:walnutTex,roughness:0.42,metalness:0}),4,0.5),
  granite: withNormal(std({map:graniteTex,roughness:0.18,metalness:0.1}),2,0.3),
  plinth: std({color:0x1a1512,roughness:0.4}),
  leather: std({color:0x3b2216,roughness:0.42}),
  velvet: new THREE.MeshPhysicalMaterial({color:0x1d4636,roughness:0.85,sheen:new THREE.Color(0x5fa184)}),
  concrete: std({color:0x4b4e55,roughness:0.9}),
  wall: std({color:0x23262e,roughness:0.85}),
  ledWarm: basic({color:new THREE.Color(1.9,1.45,0.95),toneMapped:false}),
  glass: std({color:0x4a5a66,metalness:1,roughness:0.03,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false,envMapIntensity:1.6}),
};
M.glass.userData.noGI=true;
const glowTex=makeTex(128,128,g=>{ const gr=g.createRadialGradient(64,64,0,64,64,64); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.22,'rgba(255,255,255,.5)'); gr.addColorStop(.55,'rgba(255,255,255,.12)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,128,128); });
function glow(color,size,x,y,z,op=.6,parent){ const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false})); s.scale.set(size,size,1); s.position.set(x,y,z); (parent||scene).add(s); return s; }
function glassPane(w,h,x,y,z,ry=0,parent){ const m=plane(w,h,M.glass,x,y,z,ry,parent); m.material.side=THREE.DoubleSide; return m; }
const neonMat=tex=>basic({map:tex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false,side:THREE.DoubleSide});
function neonTex(w,h,color,draw){ return makeTex(w,h,g=>{ g.lineCap='round'; g.lineJoin='round'; for(const [c,lw,blur,a] of [[color,h*.07,h*.25,.35],[color,h*.035,h*.09,.95],['#ffffff',h*.012,h*.02,.9]]){ g.save(); g.strokeStyle=c; g.fillStyle=c; g.lineWidth=lw; g.shadowColor=color; g.shadowBlur=blur; g.globalAlpha=a; draw(g,w,h); g.restore(); } }); }
const haloTex=makeTex(8,64,g=>{ const gr=g.createLinearGradient(0,0,0,64); gr.addColorStop(0,'rgba(255,255,255,0)'); gr.addColorStop(.5,'rgba(255,255,255,1)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,8,64); });
function neonBar(x1,x2,y,z,color,parent,halo=0.3){ const L=Math.abs(x2-x1),cx=(x1+x2)/2,g=new THREE.Group(),c=new THREE.Color(color);
  const tube=add(new THREE.CylinderGeometry(0.014,0.014,L,8),basic({color:c.clone().multiplyScalar(1.6),toneMapped:false}),cx,y,z,g); tube.rotation.z=Math.PI/2;
