<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海辺駅 · Umibe Station diorama</title>
<style>
:root{
  --ui-bg:rgba(250,247,241,.8);--ui-fg:#2b2723;--ui-dim:#6f675d;--ui-line:rgba(43,39,35,.16);
  --ui-on:#2b2723;--ui-on-fg:#f7f2e8;--accent:#c4476b;--tip-bg:#2b2723;--tip-fg:#f7f2e8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ui-bg:rgba(22,25,34,.78);--ui-fg:#ece7dc;--ui-dim:#a39b8e;--ui-line:rgba(236,231,220,.18);--ui-on:#ece7dc;--ui-on-fg:#161922;--accent:#ee8aa8;--tip-bg:#ece7dc;--tip-fg:#161922;}}
:root[data-theme="dark"]{--ui-bg:rgba(22,25,34,.78);--ui-fg:#ece7dc;--ui-dim:#a39b8e;--ui-line:rgba(236,231,220,.18);--ui-on:#ece7dc;--ui-on-fg:#161922;--accent:#ee8aa8;--tip-bg:#ece7dc;--tip-fg:#161922;}
:root[data-night="1"]{--ui-bg:rgba(16,19,28,.8);--ui-fg:#ece7dc;--ui-dim:#a39b8e;--ui-line:rgba(236,231,220,.18);--ui-on:#ece7dc;--ui-on-fg:#161922;--accent:#ee8aa8;--tip-bg:#ece7dc;--tip-fg:#161922;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:#c9ccd1;color:var(--ui-fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#f1f2f4 0%,#c4c8ce 100%)}
#c{width:100%;height:100%;display:block;touch-action:none;outline:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 55%,rgba(0,0,0,.16) 100%)}
#title{position:fixed;left:max(18px,env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));pointer-events:none;display:flex;align-items:baseline;gap:12px;color:var(--ui-fg);text-shadow:0 1px 0 rgba(255,255,255,.12)}
#title .jp{font:600 34px/1 "Yu Mincho","Hiragino Mincho ProN","Noto Serif JP","Noto Serif CJK JP",serif;letter-spacing:.08em}
#title .en{font-size:13px;color:var(--ui-dim);letter-spacing:.02em}
#status{position:fixed;right:max(18px,env(safe-area-inset-right,0px));top:calc(18px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--ui-bg);border:1px solid var(--ui-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;pointer-events:none}
#status i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(196,71,107,.5)}70%{box-shadow:0 0 0 8px rgba(196,71,107,0)}100%{box-shadow:0 0 0 0 rgba(196,71,107,0)}}
@media (prefers-reduced-motion:reduce){#status i{animation:none}}
#panel{position:fixed;left:50%;transform:translateX(-50%);width:max-content;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;max-width:min(94vw,860px);padding:10px 14px;border-radius:16px;background:var(--ui-bg);border:1px solid var(--ui-line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,0,0,.14)}
.btns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
button{font:inherit;color:var(--ui-fg);background:transparent;border:1px solid var(--ui-line);border-radius:9px;padding:7px 12px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
button:hover:not(:disabled){border-color:var(--ui-fg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"],button.primary:not(:disabled){background:var(--ui-on);color:var(--ui-on-fg);border-color:var(--ui-on)}
button:disabled{opacity:.5;cursor:default}
.sl{display:flex;align-items:center;gap:8px;color:var(--ui-dim);font-size:13px}
.sl input{width:108px;accent-color:var(--accent)}
#tip{position:fixed;pointer-events:none;transform:translate(14px,16px);background:var(--tip-bg);color:var(--tip-fg);padding:5px 9px;border-radius:7px;font-size:12px;max-width:260px;opacity:0;transition:opacity .12s;white-space:nowrap}
#tip.show{opacity:.94}
#bubble{position:fixed;pointer-events:none;transform:translate(-50%,-100%) translateY(-6px);background:#fffdf7;color:#2b2723;padding:6px 11px;border-radius:12px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.2);opacity:0;transition:opacity .15s;white-space:nowrap}
#bubble.show{opacity:1}
#toast{position:fixed;left:50%;transform:translate(-50%,8px);bottom:calc(112px + env(safe-area-inset-bottom,0px));background:var(--ui-on);color:var(--ui-on-fg);padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;font-size:13px;max-width:88vw;text-align:center}
#toast.show{opacity:.96;transform:translate(-50%,0)}
#hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));color:var(--ui-dim);font-size:13px;opacity:0;transition:opacity .8s;pointer-events:none;text-align:center;padding:0 16px}
#hint.show{opacity:1}
@media (max-width:640px){#title .jp{font-size:26px}#title .en{display:none}#panel{padding:8px 10px;gap:6px 10px}.sl input{width:84px}#toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}}
</style>
</head>
<body>
<div id="stage"><canvas id="c" tabindex="0" aria-label="Interactive 3D diorama of a seaside railway station under cherry blossoms"></canvas></div>
<div id="vig"></div>
<div id="title"><span class="jp">海辺駅</span><span class="en">Umibe Station, spring</span></div>
<div id="status"><i></i><span id="statusTxt">Train arriving</span></div>
<div id="hint">Drag to orbit, pinch or scroll to zoom, tap the train, the tree, the lanterns, the people</div>
<div id="tip"></div><div id="bubble"></div><div id="toast" role="status" aria-live="polite"></div>
<div id="panel">
  <div class="btns">
    <button id="btnTrain" class="primary" type="button">Train is running</button>
    <button id="btnFollow" type="button" aria-pressed="false">Follow train</button>
    <button id="btnOrbit" type="button" aria-pressed="false">Orbit</button>
    <button id="btnSound" type="button" aria-pressed="false">Sound</button>
    <button id="btnReset" type="button">Reset view</button>
  </div>
  <label class="sl">Day to night <input id="time" type="range" min="0" max="1" step="0.005" value="0"></label>
  <label class="sl">Waves <input id="waves" type="range" min="0" max="2.5" step="0.05" value="1"></label>
  <label class="sl">Breeze <input id="wind" type="range" min="0" max="3" step="0.05" value="1.3"></label>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
const T=THREE, V3=T.Vector3, TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const srand=mulberry32(20261010);
const sr=(a,b)=>a+srand()*(b-a);
const pickOf=a=>a[(srand()*a.length)|0];
const rr=(a,b)=>a+Math.random()*(b-a);
const col=h=>new T.Color(h).convertSRGBToLinear();
const XL=-24, XC=(XL+11)/2, XW=11-XL;   // west edge of the block and its centre/width
const JP='"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP","Noto Serif CJK JP","Source Han Serif JP","MS PMincho",serif';

/* ---------- renderer / scene / camera ---------- */
const canvas=$('c');
const lite=/[?&]lite/.test((window.location&&window.location.search)||'');
const coarse=lite||!!(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches);
const renderer=new T.WebGLRenderer({canvas:canvas,antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(lite?0.75:Math.min(window.devicePixelRatio||1,coarse?1.6:2));
renderer.outputEncoding=T.sRGBEncoding;
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=T.PCFSoftShadowMap;
renderer.localClippingEnabled=true;
renderer.setClearColor(0x000000,0);
const MAXANI=Math.min(8,renderer.capabilities.getMaxAnisotropy());
const scene=new T.Scene();
const camera=new T.PerspectiveCamera(32,1,0.1,400);
const HOME_TARGET=new V3(-6.0,0.6,4.6);
const HOME_DIR=new V3(0.59,0.43,0.675).normalize();
function homeDistance(aspect){return Math.max(56,80/aspect);}

/* ---------- lights ---------- */
const hemi=new T.HemisphereLight(0xe6edff,0x8a7a68,0.62); scene.add(hemi);
const sun=new T.DirectionalLight(0xfff0dc,1.9);
sun.castShadow=true;
sun.shadow.mapSize.set(lite?1024:coarse?2048:4096,lite?1024:coarse?2048:4096);
{const c=sun.shadow.camera;c.left=-38;c.right=38;c.top=38;c.bottom=-38;c.near=1;c.far=150;}
sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.04;
sun.target.position.set(-6,0,3); scene.add(sun); scene.add(sun.target);
const fillL=new T.DirectionalLight(0x9db8ff,0.25); fillL.position.set(14,10,-12); scene.add(fillL);
const lampL=[];
function addLamp(x,y,z,color,k,dist){const l=new T.PointLight(color,0,dist,2);l.position.set(x,y,z);scene.add(l);lampL.push({l:l,k:k});return l;}
const glowMats=[];

/* ---------- canvas texture helpers ---------- */
function canvasTex(w,h,draw,rep){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); draw(g,w,h);
  const t=new T.CanvasTexture(c); t.encoding=T.sRGBEncoding; t.anisotropy=MAXANI;
  if(rep){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}
  return t;
}
function repTex(t,rx,ry){const c=t.clone();c.needsUpdate=true;c.wrapS=c.wrapT=T.RepeatWrapping;c.repeat.set(rx,ry);return c;}
function speckle(g,w,h,n,cols,r0,r1,alpha){
  alpha=alpha==null?1:alpha;
  for(let i=0;i<n;i++){
    g.globalAlpha=alpha*(0.35+0.65*srand());
    g.fillStyle=cols[(srand()*cols.length)|0];
    const r=r0+srand()*(r1-r0);
    g.beginPath(); g.ellipse(srand()*w,srand()*h,r,r*(0.55+srand()*0.5),srand()*3,0,TAU); g.fill();
  }
  g.globalAlpha=1;
}

/* ---------- textures ---------- */
const texSoil=canvasTex(2048,256,(g,w,h)=>{
  const gr=g.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,'#3a2a1d');gr.addColorStop(.25,'#4a3423');gr.addColorStop(.5,'#5a4230');gr.addColorStop(.75,'#46372b');gr.addColorStop(1,'#2e231a');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
  for(let k=0;k<8;k++){
    g.strokeStyle=k%2?'rgba(20,12,6,.22)':'rgba(140,105,70,.18)'; g.lineWidth=2+srand()*5; g.beginPath();
    const y0=26+k*28; for(let x=0;x<=w;x+=20){const y=y0+Math.sin(x*0.011+k*1.7)*7+srand()*3; x?g.lineTo(x,y):g.moveTo(x,y);} g.stroke();
  }
  speckle(g,w,h,2600,['#2b1f16','#6e5640','#8a7a68','#4b4034','#a2927b'],1,4.2,.9);
  speckle(g,w,h,140,['#8a857a','#615e57','#a39c8c','#6f6a60'],4,12,.95);
  for(let i=0;i<60;i++){g.strokeStyle='rgba(30,20,10,.5)';g.lineWidth=1;g.beginPath();let x=srand()*w,y=srand()*40;g.moveTo(x,y);for(let k=0;k<6;k++){x+=sr(-8,8);y+=sr(4,14);g.lineTo(x,y);}g.stroke();}
  g.fillStyle='#4a6a2a'; g.fillRect(0,0,w,9);
  for(let x=0;x<w;x+=3){g.fillStyle=['#5d8132','#3f5c22','#709a3c','#4a6a28','#85a347'][(srand()*5)|0];g.fillRect(x,0,3,7+srand()*17);}
});
const texGround=canvasTex(1024,1024,(g,w,h)=>{
  g.fillStyle='#6a5a45'; g.fillRect(0,0,w,h);
  for(let i=0;i<90;i++){
    const x=srand()*w,y=srand()*h,r=50+srand()*150,c=['96,128,60','76,108,48','112,94,70','132,122,100','86,70,52','120,140,70'][(srand()*6)|0];
    const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,'rgba('+c+',.6)'); gr.addColorStop(1,'rgba('+c+',0)');
    g.fillStyle=gr; g.fillRect(x-r,y-r,r*2,r*2);
  }
  speckle(g,w,h,7000,['#3d3125','#8a7a62','#a39a86','#5a6e38','#6f8a40'],.8,3.4,.8);
  speckle(g,w,h,500,['#8d887d','#6a665e','#aaa292'],2.5,7,.9);
},[3.4,2]);
const texGravel=canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#6f685d'; g.fillRect(0,0,w,h);
  speckle(g,w,h,1800,['#4a443b','#8c8577','#a69f8f','#5c564b','#7d7667','#3a352e'],1,3.6,.95);
},[1,1]);
const texStone=canvasTex(512,256,(g,w,h)=>{
  g.fillStyle='#4f4d47'; g.fillRect(0,0,w,h);
  const rows=4,rh=h/rows;
  for(let r=0;r<rows;r++){
    let x=-srand()*110;
    while(x<w){
      const bw=95+srand()*95,c=100+((srand()*42)|0);
      g.fillStyle='rgb('+c+','+(c-2)+','+(c-9)+')'; g.fillRect(x+2.5,r*rh+2.5,bw-5,rh-5);
      for(let k=0;k<50;k++){g.fillStyle=srand()<.5?'rgba(0,0,0,.07)':'rgba(255,255,255,.07)';g.fillRect(x+srand()*bw,r*rh+srand()*rh,2+srand()*6,2+srand()*4);}
      x+=bw;
    }
  }
  speckle(g,w,h,70,['rgba(80,110,50,.7)'],2,9,.5);
},[1,1]);
const texPlat=canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#5b574f'; g.fillRect(0,0,w,h);
  speckle(g,w,h,5000,['#3e3a33','#7a746a','#8d867a','#4c4840'],1,3,.9);
  g.strokeStyle='rgba(20,18,14,.45)'; g.lineWidth=2;
  for(let i=0;i<=4;i++){g.beginPath();g.moveTo(i*128,0);g.lineTo(i*128,h);g.stroke();g.beginPath();g.moveTo(0,i*128);g.lineTo(w,i*128);g.stroke();}
},[5,2.6]);
const texPlank=canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#2e1f15'; g.fillRect(0,0,w,h);
  const pw=40;
  for(let x=0;x<w;x+=pw){
    const c=58+((srand()*26)|0);
    g.fillStyle='rgb('+(c+16)+','+(c-2)+','+(c-18)+')'; g.fillRect(x+1,0,pw-2,h);
    for(let k=0;k<22;k++){g.strokeStyle='rgba(20,10,4,'+(.07+srand()*.1)+')';g.lineWidth=1;g.beginPath();const gx=x+4+srand()*(pw-8);g.moveTo(gx,0);g.bezierCurveTo(gx+sr(-4,4),h*.3,gx+sr(-4,4),h*.6,gx+sr(-4,4),h);g.stroke();}
    g.fillStyle='rgba(0,0,0,.4)'; g.fillRect(x,0,2,h);
  }
  speckle(g,w,h,120,['rgba(150,140,125,.35)'],3,14,.4);
},[1,1]);
const texRoof=canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#3d4247'; g.fillRect(0,0,w,h);
  const tw=16,th=22;
  for(let r=0;r<Math.ceil(h/th);r++){
    for(let x=0;x<w;x+=tw){
      const v=(srand()*22)|0;
      g.fillStyle='rgb('+(78+v)+','+(86+v)+','+(94+v)+')';
      g.beginPath();g.moveTo(x,r*th);g.lineTo(x+tw,r*th);g.lineTo(x+tw,(r+1)*th);g.quadraticCurveTo(x+tw/2,(r+1)*th+7,x,(r+1)*th);g.closePath();g.fill();
      g.fillStyle='rgba(255,255,255,.09)'; g.fillRect(x+tw*.3,r*th,tw*.25,th*.8);
    }
    g.fillStyle='rgba(0,0,0,.4)'; g.fillRect(0,(r+1)*th-2,w,3);
  }
  for(let x=0;x<w;x+=tw){g.fillStyle='rgba(0,0,0,.4)';g.fillRect(x,0,1.5,h);}
  speckle(g,w,h,40,['rgba(90,120,60,.6)'],2,8,.45);
},[1,1]);
function signTex(main,sub,o){
  o=o||{};
  return canvasTex(o.w||512,o.h||256,(g,w,h)=>{
    g.fillStyle=o.bg||'#ece6d3'; g.fillRect(0,0,w,h);
    g.strokeStyle=o.fg||'#17120e'; g.lineWidth=o.border||9; g.strokeRect(11,11,w-22,h-22);
    g.fillStyle=o.fg||'#17120e'; g.textAlign='center'; g.textBaseline='middle';
    g.font='700 '+Math.round(h*(sub?.46:.56))+'px '+JP; g.fillText(main,w/2,h*(sub?.4:.52));
    if(sub){g.font='600 '+Math.round(h*.13)+'px '+JP;g.fillText(sub,w/2,h*.8);}
    speckle(g,w,h,160,['rgba(120,100,70,.5)'],1,6,.25);
  });
}
const texBlob=canvasTex(256,256,(g,w,h)=>{
  const gr=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
  gr.addColorStop(0,'rgba(0,0,0,.65)');gr.addColorStop(.55,'rgba(0,0,0,.35)');gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
});
const texWater=canvasTex(512,512,(g,w,h)=>{
  const gr=g.createLinearGradient(0,0,w,0); gr.addColorStop(0,'#2f9aa8'); gr.addColorStop(.5,'#3fb2bd'); gr.addColorStop(1,'#2a8fa0');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
  for(let i=0;i<180;i++){
    const x=srand()*w,y=srand()*h,len=30+srand()*100;
    g.strokeStyle='rgba('+(srand()<.6?'220,250,255':'15,80,100')+','+(.08+srand()*.2)+')'; g.lineWidth=1+srand()*3;
    for(const dy of [0,-h,h]){g.beginPath();g.moveTo(x,y+dy);g.bezierCurveTo(x+10,y+dy+len*.3,x-10,y+dy+len*.7,x+4,y+dy+len);g.stroke();}
  }
},[1,4]);
const texFoam=canvasTex(512,512,(g,w,h)=>{
  g.clearRect(0,0,w,h);
  for(let i=0;i<70;i++){
    const x=srand()*w,y=srand()*h,len=40+srand()*90;
    g.strokeStyle='rgba(255,255,255,'+(.25+srand()*.4)+')'; g.lineWidth=1+srand()*2.5;
    for(const dy of [0,-h,h]){g.beginPath();g.moveTo(x,y+dy);g.quadraticCurveTo(x+14,y+dy+len/2,x-4,y+dy+len);g.stroke();}
  }
},[1,3]);
const texResin=canvasTex(512,256,(g,w,h)=>{
  const gr=g.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,'#a6ecea');gr.addColorStop(.22,'#43bac6');gr.addColorStop(.65,'#14788f');gr.addColorStop(1,'#0a4358');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
  for(let i=0;i<70;i++){g.strokeStyle='rgba(255,255,255,'+(.15+srand()*.3)+')';g.lineWidth=1;g.beginPath();g.arc(srand()*w,srand()*h,1+srand()*3,0,TAU);g.stroke();}
  for(let i=0;i<10;i++){const x=srand()*w,gg=g.createLinearGradient(x,0,x+40,h);gg.addColorStop(0,'rgba(255,255,255,.14)');gg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gg;g.fillRect(x,0,18+srand()*30,h);}
  g.save(); g.beginPath(); g.rect(0,h*.86,w,h*.14); g.clip();
  speckle(g,w,h,260,['#7b6a4f','#9b8a6a','#4a4538','#b5a583'],2,8,.95); g.restore();
});

function windify(mat,kind){

        'vec3 transformed=vec3(position);\n#ifdef USE_INSTANCING\nfloat ph=instanceMatrix[3].x*0.9+instanceMatrix[3].z*0.7;\n#else\nfloat ph=0.0;\n#endif\nfloat sw=sin(uTime*2.4+ph)*0.6+sin(uTime*5.1+ph*1.7)*0.25+uGust*1.1;\nfloat hh=position.y;\ntransformed.x+=sw*hh*hh*uWind*2.4;\ntransformed.z+=sw*hh*hh*uWind*-0.8;');

  const i=pathIdx(s),f=(s-CUM[i])/(CUM[i+1]-CUM[i]); return out.lerpVectors(PTS[i],PTS[i+1],f);

}

    } else {
      const step=Math.min(d,P.speed*dt);
      r.position.x+=dx/d*step; r.position.z+=dz/d*step;
      const ty=Math.atan2(dx,dz); let diff=ty-P.yaw; diff=Math.atan2(Math.sin(diff),Math.cos(diff)); P.yaw+=diff*Math.min(1,dt*9);
      P.phase+=step*13; P.moving=true;
    }
  } else {
    let diff=P.face-P.yaw; diff=Math.atan2(Math.sin(diff),Math.cos(diff)); P.yaw+=diff*Math.min(1,dt*3);
    P.idle+=dt; if(P.state==='waiting'&&Math.random()<dt*0.12)P.face=rr(-0.7,0.7);
  }
  r.rotation.y=P.yaw;
  const a=P.moving?Math.sin(P.phase)*0.7:0;
  P.legL.rotation.x=a; P.legR.rotation.x=-a;
  P.armL.rotation.x=-a*0.8; P.armR.rotation.x=a*0.8;
  P.armL.rotation.z=0.04; P.armR.rotation.z=-0.04;

    if(P.wave<=0)P.armR.rotation.z=-0.04;
  }
  r.position.y=groundYP(P,r.position.x,r.position.z);
}

/* =====================================================================
   TRAIN DISPATCHER
   ===================================================================== */
const S_STOP=sForX(-7.5);          // loco-centre arc position at the platform
const S_END=PL+TRAIN_REAR+0.6;     // fully inside the left tunnel
const V_CRUISE=4.2,A_BRAKE=1.1,A_ACC=0.9;
const train={phase:'arrive',s:S_STOP-15,v:3.6,travel:0,t:0,sub:'',away:0,steamT:0,doorsManual:false,boardCount:0};
const timers=[];
function after(sec,fn){timers.push({at:sec,fn:fn});}
let clock=0;
function runTimers(dt){
  clock+=dt;
  for(let i=timers.length-1;i>=0;i--){if(clock>=timers[i].at){const f=timers[i].fn;timers.splice(i,1);f();}}
}
function setDoors(open){coaches.forEach(c=>c.doors.forEach(d=>{d.target=open?1:0;}));}
function beginDwell(){
  train.phase='dwell'; train.sub='settle'; train.t=0; train.v=0; train.steamT=3;
  placeCars(train.s,0,0); refreshDoorPoints(); chime();
  after(clock+1.2,()=>{train.sub='open';setDoors(true);});
  after(clock+1.8,()=>{
    const ins=people.filter(p=>p.state==='inTrain');
    ins.forEach((p,i)=>{p.car=(i%3);p.door=(i>>1)&1;});
    ins.forEach((p,i)=>after(clock+i*0.5+rr(0,0.25),()=>alight(p)));
    const waiting=people.filter(p=>p.state==='waiting').slice(0,8);
    waiting.forEach((p,i)=>after(clock+1.5+i*0.5+rr(0,0.25),()=>board(p)));
    train.boardCount=ins.length+waiting.length;
    train.minDwell=clock+6;
  });
}
function endDwellNow(){ // close doors, whistle, go
  if(train.sub==='closing'||train.phase!=='dwell')return;
  train.sub='closing'; setDoors(false);
  after(clock+1.6,()=>{whistleBlow(true);});
  after(clock+2.6,()=>{train.phase='depart';train.steamT=2.5;});
}
function updateTrainFSM(dt,time){
  const vPrev=train.v;
  if(train.phase==='arrive'){
    const rem=Math.max(0,S_STOP-train.s);
    const target=Math.min(V_CRUISE,Math.sqrt(2*A_BRAKE*rem)+0.12);
    train.v+=clamp(target-train.v,-A_BRAKE*dt*1.6,A_ACC*dt*1.4);
    train.s+=train.v*dt;
    if(train.s>=S_STOP-0.01&&rem<0.4&&train.v<0.3){train.s=S_STOP;train.v=0;beginDwell();}
  } else if(train.phase==='dwell'){
    train.v=0; train.t+=dt;
    if(train.sub==='open'&&train.minDwell&&clock>train.minDwell&&busy===0&&timers.length===0)endDwellNow();
  } else if(train.phase==='depart'){
    train.v=Math.min(V_CRUISE*0.9,train.v+A_ACC*0.8*dt); train.s+=train.v*dt;
    if(train.s>S_END){train.phase='away';train.away=rr(7,10);trainG.visible=false;train.v=0;}
  } else if(train.phase==='away'){
    train.away-=dt; if(train.away<=0)callTrain();
  }
  train.travel+=train.v*dt;
  return vPrev;
}
function callTrain(){
  train.phase='arrive'; train.sub=''; train.s=-TRAIN_REAR-1+0.0; train.v=V_CRUISE*0.9; trainG.visible=true;
  placeCars(train.s,0,0);
}
function departNow(){
  if(train.phase==='away'){train.away=0;return true;}
  if(train.phase==='dwell'){
    if(train.sub==='settle'){train.sub='open';setDoors(true);}
    // anyone still queued boards instantly
    for(let i=timers.length-1;i>=0;i--){const f=timers[i].fn;timers.splice(i,1);f();}
    after(clock+1.2,endDwellNow);
    return true;
  }
  return false;
}
function statusText(){
  if(train.phase==='arrive')return 'Train arriving';
  if(train.phase==='dwell'){
    if(train.sub==='closing')return 'Doors closing';
    const w=people.filter(p=>p.state==='waiting').length; return train.sub==='settle'?'Train stopped':'Boarding · '+w+' on the platform';
  }
  if(train.phase==='depart')return 'Departing';
  return 'Next train in '+Math.max(1,Math.ceil(train.away))+'s';
}

    case 'station':case 'door':stationDoorState.hold=4;toast('海辺駅 · Umibe Station');break;
    case 'clock':{const d=new Date();toast('🕰 '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));break;}
    case 'pole':case 'bird':scareBirds();toast('Sparrows scatter!');break;
    case 'postbox':toast('✉ Letter posted');if(postbox){postbox.scale.set(1.15,0.9,1.15);}break;
    case 'river':ripple(h.point.x,h.point.z);break;
    case 'boat':if(window.__sea)window.__sea.kick();toast('The boat rocks on the swell');break;
    case 'beach':ripple(h.point.x,h.point.z);break;
    default:toast(d.toast||d.label);
  }
}
let down=null;
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};introDone=true;});
canvas.addEventListener('pointerup',e=>{
  if(!down)return; const dx=e.clientX-down.x,dy=e.clientY-down.y,dt=performance.now()-down.t; down=null;
  if(dx*dx+dy*dy<36&&dt<500){const h=pick(e.clientX,e.clientY);if(h)doHit(h);}
});
let hoverReq=null;
canvas.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'||down){tipEl.classList.remove('show');return;}
  hoverReq={x:e.clientX,y:e.clientY};
});
canvas.addEventListener('pointerleave',()=>{hoverReq=null;tipEl.classList.remove('show');canvas.style.cursor='';});
function updateHover(){
  if(!hoverReq)return; const h=pick(hoverReq.x,hoverReq.y);
  if(h){canvas.style.cursor='pointer';tipEl.textContent=h.object.userData.hit.label||'';tipEl.style.left=hoverReq.x+'px';tipEl.style.top=hoverReq.y+'px';tipEl.classList.add('show');}
  else{canvas.style.cursor='';tipEl.classList.remove('show');}
  hoverReq=null;
}

/* ---------- controls ---------- */
const controls=new T.OrbitControls(camera,canvas);
controls.touches={ONE:T.TOUCH.ROTATE,TWO:T.TOUCH.DOLLY_PAN};
controls.enableDamping=true; controls.dampingFactor=0.07; controls.minDistance=5; controls.maxDistance=110; controls.maxPolarAngle=Math.PI*0.495; controls.screenSpacePanning=true;
controls.autoRotateSpeed=0.7;
let introDone=false,introT=0,follow=false,followBlend=0;
controls.addEventListener('start',()=>{introDone=true;$('hint').classList.remove('show');});
function resetView(){
  const a=canvas.clientWidth/Math.max(1,canvas.clientHeight);
  controls.target.copy(HOME_TARGET); camera.position.copy(HOME_TARGET).addScaledVector(HOME_DIR,homeDistance(a)); controls.update();
}
function resize(){
  const w=canvas.clientWidth||window.innerWidth,h=canvas.clientHeight||window.innerHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize',()=>{resize();if(!introDone)resetView();});

/* ---------- buttons ---------- */
const btnTrain=$('btnTrain'),btnFollow=$('btnFollow'),btnOrbit=$('btnOrbit'),btnSound=$('btnSound'),btnReset=$('btnReset');
function syncTrainBtn(){
  const ph=train.phase; btnTrain.textContent=ph==='dwell'?'Send it off':ph==='away'?'Call a train':'Train is running';
  btnTrain.disabled=!(ph==='dwell'||ph==='away');
}
btnTrain.addEventListener('click',()=>{departNow();});
btnFollow.addEventListener('click',()=>{follow=!follow;btnFollow.setAttribute('aria-pressed',follow);if(follow)introDone=true;});
btnOrbit.addEventListener('click',()=>{controls.autoRotate=!controls.autoRotate;btnOrbit.setAttribute('aria-pressed',controls.autoRotate);});
btnSound.addEventListener('click',()=>{audio.on=!audio.on;btnSound.setAttribute('aria-pressed',audio.on);if(audio.on){audio.init();audio.chime();}});
btnReset.addEventListener('click',()=>{follow=false;btnFollow.setAttribute('aria-pressed',false);controls.autoRotate=false;btnOrbit.setAttribute('aria-pressed',false);resetView();});
$('time').addEventListener('input',e=>{applyTime(parseFloat(e.target.value));});
$('wind').addEventListener('input',e=>{wind=parseFloat(e.target.value);});
$('waves').addEventListener('input',e=>{waveAmt=parseFloat(e.target.value);});
$('waves').addEventListener('pointerdown',e=>e.stopPropagation());
['time','wind'].forEach(id=>$(id).addEventListener('pointerdown',e=>e.stopPropagation()));

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
const _hp=new V3(),_fv=new V3(),_prevT=new V3(),_proj=new V3();
let lastMs=0,statusAcc=0;
function stepPeople(dt,time){
  for(let i=0;i<people.length;i++){
    const P=people[i];
    if(P.state==='inStation'){P.timer-=dt;if(P.timer<=0)emerge(P);}
    updatePerson(P,dt,time);
  }
}
function frame(ms){
  requestAnimationFrame(frame);
  const time=ms/1000; let dt=lastMs?Math.min(0.05,time-lastMs):0.016; lastMs=time; if(dt<=0)dt=0.001;
  // train
  runTimers(dt);
  updateTrainFSM(dt,time);
  const vn=clamp(train.v/4,0,1);
  if(trainG.visible){placeCars(train.s,time,vn);updateCarWheels(train.travel);}
  updateDoors(dt);
  emitFromTrain(dt); updateSmoke(dt);
  // people & station
  stepPeople(dt,time); updateStationDoor(dt);
  // ambience
  updateBirds(dt,time); updatePetals(dt,time); updateRipples(dt);
  waterTopMat.map.offset.y+=dt*(0.07+0.04*waveAmt); foamMat.map.offset.y+=dt*(0.12+0.06*waveAmt);
  tideT+=dt; const tide=Math.sin(tideT*TAU/44); tideRising=Math.cos(tideT*TAU/44)>0; curLevel=-0.15+0.11*tide;
  waterU.uLevel.value=curLevel; tidePlane.constant=curLevel; seaMesh.position.y=curLevel; waterTop.position.y=curLevel; foam.position.y=curLevel+0.05; waterBox.scale.y=(curLevel+1.5)/1.35; waterBox.position.y=-1.5+(curLevel+1.5)/2;
  foamMat.opacity=0.38+0.22*Math.sin(time*0.9)*waveAmt*0.6+0.12*(tide>0.4?tide:0); waterU.uWave.value=waveAmt*(0.8+0.5*gustV); foamMat.map.offset.x=Math.sin(time*0.3)*0.02;
  {const d=new Date(),sec=d.getSeconds()+d.getMilliseconds()/1000,mi=d.getMinutes()+sec/60,hr=(d.getHours()%12)+mi/60;clockHands.s.rotation.z=-sec/60*TAU;clockHands.m.rotation.z=-mi/60*TAU;clockHands.h.rotation.z=-hr/12*TAU;}
  gustV=clamp(0.5+0.5*(Math.sin(time*0.7)+Math.sin(time*1.9+1.2)*0.6)/1.6,0,1);windNow=wind*(0.55+1.1*gustV);windU.uTime.value=time;windU.uWind.value=windNow;windU.uGust.value=gustV;
  shake.amp*=Math.exp(-dt*1.9);
  canopy.rotation.z=Math.sin(time*0.55)*0.014*windNow+Math.sin(time*17)*0.045*shake.amp;
  canopy.rotation.x=Math.cos(time*0.43)*0.01*windNow+Math.cos(time*15)*0.03*shake.amp;
  swayers.forEach((s,i)=>{s.rotation.z=Math.sin(time*1.3+i)*0.07*windNow;s.rotation.x=Math.cos(time*1.1+i)*0.06*windNow;});
  if(postbox){postbox.scale.x+=(1-postbox.scale.x)*Math.min(1,dt*8);postbox.scale.y+=(1-postbox.scale.y)*Math.min(1,dt*8);postbox.scale.z=postbox.scale.x;}
  updateSea(dt,time); updateExt(dt,time);
  // overlay
  if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.classList.remove('show');}
  if(bubbleT>0&&bubbleP){
    bubbleT-=dt;_hp.set(bubbleP.root.position.x,bubbleP.root.position.y+0.95,bubbleP.root.position.z).project(camera);
    bubbleEl.style.left=((_hp.x*0.5+0.5)*canvas.clientWidth)+'px';bubbleEl.style.top=((-_hp.y*0.5+0.5)*canvas.clientHeight)+'px';
    if(bubbleT<=0){bubbleEl.classList.remove('show');bubbleP=null;}
  }
  statusAcc+=dt; if(statusAcc>0.25){statusAcc=0;statusEl.textContent=statusText()+'  ·  tide '+(tideRising?'rising':'falling');syncTrainBtn();}
  // camera
  if(!introDone){introT=Math.min(1,introT+dt/3.2);const e=1-Math.pow(1-introT,3),a=canvas.clientWidth/Math.max(1,canvas.clientHeight);
    controls.target.copy(HOME_TARGET);camera.position.copy(HOME_TARGET).addScaledVector(new V3(0.35,0.55,0.76).lerp(HOME_DIR,e).normalize(),homeDistance(a)*lerp(1.28,1,e));if(introT>=1)introDone=true;}
  if(follow&&trainG.visible){loco.root.getWorldPosition(_fv);_fv.y=1.0;_prevT.copy(controls.target);controls.target.lerp(_fv,1-Math.exp(-dt*2.5));camera.position.add(_prevT.negate().add(controls.target));}
  controls.update();
  updateHover();
  renderer.render(scene,camera);
}

/* ---------- environment reflections for metals ---------- */
let envTex=null;
function buildEnv(){
  try{
    const g=new T.SphereGeometry(50,32,16),pos=g.attributes.position,cols=new Float32Array(pos.count*3),top=new T.Color(0xc4d6f2),hor=new T.Color(0xf4efe6),bot=new T.Color(0x5f574c),c=new T.Color();
    for(let i=0;i<pos.count;i++){const y=pos.getY(i)/50;if(y>0)c.copy(hor).lerp(top,Math.pow(y,0.6));else c.copy(hor).lerp(bot,Math.pow(-y,0.5));cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;}
    g.setAttribute('color',new T.BufferAttribute(cols,3));
    const es=new T.Scene(); es.add(new T.Mesh(g,new T.MeshBasicMaterial({vertexColors:true,side:T.BackSide})));
    const spot=new T.Mesh(new T.SphereGeometry(7,12,8),new T.MeshBasicMaterial({color:new T.Color(5,4.6,4)})); spot.position.set(-22,36,26); es.add(spot);
    const pm=new T.PMREMGenerator(renderer); envTex=pm.fromScene(es,0.04).texture; pm.dispose();
    metalMats.forEach(m=>{m.envMap=envTex;m.envMapIntensity=0.9;m.needsUpdate=true;});
  }catch(e){envTex=null;}
}
/* ---------- boot ---------- */
buildEnv();
resize(); resetView(); applyTime(0);
stepPeople(0.01,0); syncTrainBtn();
placeCars(train.s,0,0); updateCarWheels(0);
setTimeout(()=>{$('hint').classList.add('show');},900);
setTimeout(()=>{$('hint').classList.remove('show');},9500);
window.__umibe={train:train,people:people,applyTime:applyTime,departNow:departNow,callTrain:callTrain,camera:camera,controls:controls,scene:scene,PL:PL,S_STOP:S_STOP,loco:loco,coaches:coaches,canopy:canopy,blossoms:blossoms,trainG:trainG,doorPts:doorPts};
requestAnimationFrame(frame);
})();
</script>
