<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argentina vs Spain (0-0) - 2026 World Cup Final - Splendid Night Match</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #081216;
            font-family: 'VT323', monospace;
        }
        #canvas-wrap {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        canvas {
            display: block;
            width: 100vw !important;
            height: 100vh !important;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        .pixel-font {
            font-family: 'Press Start 2P', monospace;
        }
        .hud-bar {
            background: rgba(10, 17, 29, 0.90);
            backdrop-filter: blur(6px);
            border: 2px solid #38bdf8;
            box-shadow: 0 4px 0 #075985, 0 10px 28px rgba(0,0,0,0.75);
        }
        .hud-btn {
            background: #1e293b;
            border: 1px solid #475569;
            box-shadow: 0 2px 0 #0f172a;
            transition: all 0.1s ease;
        }
        .hud-btn:hover {
            background: #334155;
            border-color: #94a3b8;
        }
        .hud-btn.active, .hud-btn:active {
            background: #0284c7;
            border-color: #7dd3fc;
            color: #fff;
            transform: translateY(1px);
        }
        .goal-popup {
            animation: goalBounce 0.35s infinite alternate;
        }
        .kickoff-popup {
            animation: kickoffPulse 0.45s infinite alternate;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        @keyframes kickoffPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.025) translateY(-2px); }
        }
        @keyframes goalBounce {
            0% { transform: scale(1) translateY(0); }
            100% { transform: scale(1.04) translateY(-4px); }
        }
    </style>
</head>
<body class="text-white">

    <!-- WebGL Viewport -->
    <div id="canvas-wrap">
        <!-- Optional Floating Carrier Tag (Off by default to match reference image cleanly) -->
        <div id="carrier-tag" class="fixed pointer-events-none z-10 hidden -translate-x-1/2 -translate-y-full">
            <div class="px-2 py-0.5 rounded bg-slate-950/90 border border-amber-400 flex items-center gap-1.5 shadow-md">
                <span id="tag-num" class="pixel-font text-[8px] px-1 py-0.5 rounded bg-sky-400 text-slate-950 font-bold">#10</span>

        </div>
        <!-- Interactive Player Hover Tag -->

                <span id="hover-num" class="pixel-font text-[9px] px-1.5 py-0.5 rounded font-bold bg-sky-400 text-slate-950">#10</span>

                </div>
            </div>

    </div>

    <!-- Top-Right Compact Live Match Ticker (Leaves Top-Left 3D Scoreboard 100% Unobstructed!) -->
    <div class="fixed top-2.5 right-2.5 z-20 flex items-center gap-2 pointer-events-auto">
        <div class="hud-bar px-3 py-1.5 rounded-lg flex items-center gap-2.5 text-sm">
            <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>

    <!-- 2026 World Cup Final Squads Modal Drawer -->

        </div>
    </div>

    <!-- Compact Bottom Control Bar (Never stacks vertically; swipeable single row on mobile with collapse toggle) -->
    <div id="bottom-ui-wrapper" class="fixed bottom-2 left-1/2 -translate-x-1/2 z-20 pointer-events-auto max-w-[96vw] flex flex-col items-center gap-1 transition-all duration-200">
        <!-- Collapse / Expand Toggle Tab -->
        <button id="btn-toggle-hud" class="hud-btn px-2.5 py-0.5 rounded-full text-[9px] text-slate-300 hover:text-white flex items-center gap-1 shadow-md bg-slate-900/90 border border-slate-600">
            <span id="hud-toggle-icon">▼</span>
            <span id="hud-toggle-text">HIDE</span>
        </button>

        <!-- Main Single-Row Control Bar -->
        <div id="bottom-hud-bar" class="hud-bar px-2 py-1 sm:px-3 sm:py-1.5 rounded-lg flex flex-nowrap items-center gap-1 sm:gap-1.5 text-xs overflow-x-auto no-scrollbar max-w-full shadow-2xl">
            <button id="btn-atk-arg" class="hud-btn shrink-0 px-2 py-1 rounded text-sky-300 font-bold">⚽ ARG<span class="hidden sm:inline"> ATTACK</span></button>
            <button id="btn-atk-esp" class="hud-btn shrink-0 px-2 py-1 rounded text-red-300 font-bold">⚽ ESP<span class="hidden sm:inline"> ATTACK</span></button>
            <button id="btn-wave" class="hud-btn shrink-0 px-2 py-1 rounded text-yellow-300 font-bold">🙌 WAVE</button>

            <button id="btn-goal-esp" class="hud-btn shrink-0 px-2 py-1 rounded text-amber-300 font-bold">🎆 GOAL ESP</button>
            <span class="text-slate-600 mx-0.5 shrink-0">|</span>
            <button id="btn-corner" class="hud-btn shrink-0 px-2 py-1 rounded text-emerald-300 font-bold" title="Trigger Corner Kick">🚩 CORNER</button>
            <button id="btn-throw" class="hud-btn shrink-0 px-2 py-1 rounded text-orange-300 font-bold" title="Trigger Throw-in">🤾 THROW</button>
            <button id="btn-goalkick" class="hud-btn shrink-0 px-2 py-1 rounded text-teal-300 font-bold" title="Trigger Goal Kick">🥅 GOAL KICK</button>
            <span class="text-slate-600 mx-0.5 shrink-0">|</span>
            <button id="cam-ref" class="hud-btn active shrink-0 px-2 py-1 rounded">REF<span class="hidden sm:inline"> VIEW</span></button>
            <button id="cam-ball" class="hud-btn shrink-0 px-2 py-1 rounded"><span class="hidden sm:inline">FOLLOW </span>BALL</button>
            <span class="text-slate-600 mx-0.5 shrink-0">|</span>
            <button id="px-125" class="hud-btn active shrink-0 px-2 py-1 rounded" title="High-Res Fine Pixel Art (1.25x)">1.25x</button>
            <button id="px-100" class="hud-btn shrink-0 px-2 py-1 rounded" title="Ultra-Crisp Native HD (1.0x)">1.0x</button>
            <button id="px-165" class="hud-btn shrink-0 px-2 py-1 rounded" title="Classic 16-Bit Pixel Art (1.65x)">1.65x</button>
            <button id="btn-gi" class="hud-btn active shrink-0 px-2 py-1 rounded text-emerald-300">GI: HIGH</button>
            <button id="btn-tag" class="hud-btn active shrink-0 px-2 py-1 rounded text-amber-300">TAG: ON</button>
            <button id="btn-audio" class="hud-btn active shrink-0 px-2 py-1 rounded text-cyan-300">🔊 SOUND</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    window.onload = function () {
        // ============================================================================
        // 1. HD-2D PIXEL ART RENDERER & ISOMETRIC CAMERA RIG
        // ============================================================================
        const wrap = document.getElementById('canvas-wrap');
        const renderer = new THREE.WebGLRenderer({
            antialias: false,
            powerPreference: 'high-performance'
        });
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.LinearToneMapping;
        renderer.toneMappingExposure = 1.14;
        wrap.appendChild(renderer.domElement);

        // Deep Stadium Midnight Night Sky
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050912);
        scene.fog = new THREE.FogExp2(0x050912, 0.0011);

        let frustumSize = 92;
        const camera = new THREE.OrthographicCamera(-45, 45, 45, -45, 1, 600);

        const viewState = {
            mode: 'ref',
            yaw: Math.PI * 0.25,     // 45 deg isometric view
            pitch: 0.903,            // ~33.0 deg elevation
            zoom: 1.00,
            target: new THREE.Vector3(0, 0, 0),
            pan: new THREE.Vector3(0, 0, 0),
            pixelScale: 1.25,        // Crisp pixel-art texels
            giEnabled: true,
            showTag: true,
            focusPlayer: null
        };

        function updateCanvasSize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const rw = Math.max(480, Math.floor((w * dpr) / viewState.pixelScale));
            const rh = Math.max(320, Math.floor((h * dpr) / viewState.pixelScale));

            renderer.setPixelRatio(1);
            renderer.setSize(rw, rh, false);

            const aspect = w / h;
            camera.left   = -frustumSize * aspect / 2;
            camera.right  =  frustumSize * aspect / 2;
            camera.top    =  frustumSize / 2;
            camera.bottom = -frustumSize / 2;
            camera.updateProjectionMatrix();
        }
        updateCanvasSize();
        window.addEventListener('resize', updateCanvasSize);

        // ============================================================================
        // 2. BALANCED SPLENDID NIGHT FLOODLIGHT RIG
        // ============================================================================
        const giLights = [];

        // Night Ambient Fill (Deep twilight blue sky + dark turf fill)
        const hemiLight = new THREE.HemisphereLight(0x2d4668, 0x14320a, 0.26);
        const stadiumAmbient = new THREE.AmbientLight(0xfff6ea, 0.14);
        scene.add(stadiumAmbient);
        hemiLight.position.set(0, 140, 0);
        scene.add(hemiLight);

        // Main Stadium Key Floodlight (from Top-Right Tower)
        const keyLight = new THREE.DirectionalLight(0xfffaea, 0.94);
        keyLight.position.set(45, 120, -55);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 4096;
        keyLight.shadow.mapSize.height = 4096;
        keyLight.shadow.camera.near = 20;
        keyLight.shadow.camera.far = 300;
        keyLight.shadow.bias = -0.00025;
        const dBound = 92;
        keyLight.shadow.camera.left = -dBound;
        keyLight.shadow.camera.right = dBound;
        keyLight.shadow.camera.top = dBound;
        keyLight.shadow.camera.bottom = -dBound;
        scene.add(keyLight);

        // Secondary Soft Blue Cross Floodlight (from Top-Left Tower)
        const crossLight = new THREE.DirectionalLight(0xb4d4f8, 0.20);
        crossLight.position.set(-55, 95, 45);
        scene.add(crossLight);
        giLights.push(crossLight);

        // Ground Grass Emerald Bounce Light
        const turfBounceLight = new THREE.DirectionalLight(0x184a0c, 0.10);
        turfBounceLight.position.set(0, -60, 0);
        scene.add(turfBounceLight);
        giLights.push(turfBounceLight);

        // ============================================================================
        // 3. PROCEDURAL TEXTURES & VIBRANT NIGHT TURF
        // ============================================================================
        function pxHash(x, y) {
            let n = (x * 374761393 + y * 668265263) ^ (x * 1274126177);
            n = (n ^ (n >> 13)) * 1274126177;
            return ((n ^ (n >> 16)) >>> 0) / 4294967295;
        }

        function makePixelTex(canvas, repeatX = 1, repeatY = 1) {
            const t = new THREE.CanvasTexture(canvas);
            t.magFilter = THREE.NearestFilter;
            t.minFilter = THREE.NearestFilter;
            t.generateMipmaps = false;
            t.encoding = THREE.sRGBEncoding;
            if (repeatX > 1 || repeatY > 1) {
                t.wrapS = THREE.RepeatWrapping;
                t.wrapT = THREE.RepeatWrapping;
                t.repeat.set(repeatX, repeatY);
            }
            t.needsUpdate = true;
            return t;
        }

        const PITCH_W = 54;
        const PITCH_L = 78;
        const RUN_SPEED_THRESHOLD = 1.5;
        const APRON_W = 66;
        const APRON_L = 90;

        // VIBRANT LUSH EMERALD PITCH TEXTURE MATCHING REFERENCE IMAGE UNDER FLOODLIGHTS
        function buildHighResPitchTexture() {
            const c = document.createElement('canvas');
            c.width = 1440;
            c.height = 2048;
            const ctx = c.getContext('2d');

            const w = c.width;
            const h = c.height;
            const px = 112;
            const py = 138;
            const pw = w - px * 2;
            const ph = h - py * 2;
            const mx = w / 2;
            const my = h / 2;

            // 1. Concrete / Asphalt Track Outer Apron
            ctx.fillStyle = '#26303c';
            ctx.fillRect(0, 0, w, h);

            // Turf Apron border inside track
            ctx.fillStyle = '#1e5e12';
            ctx.fillRect(px - 36, py - 36, pw + 72, ph + 72);

            // 2. 16 Alternating Deep Emerald Cut Grass Stripes
            const stripes = 16;
            const sh = ph / stripes;

            for (let i = 0; i < stripes; i++) {
                const isLight = (i % 2 === 0);
                const sy = Math.floor(py + i * sh);
                const sHeight = Math.ceil(sh);

                let baseHex = isLight ? '#72c21c' : '#4e9b14';
                ctx.fillStyle = baseHex;
                ctx.fillRect(px, sy, pw, sHeight);
            }

            // Stadium Night Floodlight Vignette Glow
            const floodGlow = ctx.createRadialGradient(mx, my, 80, mx, my, pw * 0.72);
            floodGlow.addColorStop(0.0, 'rgba(255, 255, 240, 0.08)');
            floodGlow.addColorStop(0.5, 'rgba(240, 250, 255, 0.03)');
            floodGlow.addColorStop(1.0, 'rgba(6, 20, 8, 0.20)');
            ctx.fillStyle = floodGlow;
            ctx.fillRect(px, py, pw, ph);

            // 3. Dense Grass Blades & Micro Pixel Tufts with Floodlight Dew Sheen
            for (let y = py; y < py + ph; y += 2) {
                for (let x = px; x < px + pw; x += 2) {
                    const r = pxHash(x >> 1, y >> 1);

                    const dTopGoal = Math.hypot(x - mx, y - (py + 40));
                    const dBotGoal = Math.hypot(x - mx, y - (py + ph - 40));
                    if ((dTopGoal < 100 || dBotGoal < 100) && r < 0.22) {
                        ctx.fillStyle = '#647c2e';
                        ctx.fillRect(x, y, 2, 2);
                        continue;
                    }

                    if (r < 0.16) {
                        ctx.fillStyle = 'rgba(12, 38, 8, 0.26)';
                        ctx.fillRect(x, y, 2, 2);
                    } else if (r > 0.86) {
                        ctx.fillStyle = 'rgba(185, 250, 110, 0.22)';
                        ctx.fillRect(x, y, 2, 3);
                    } else if (r > 0.48 && r < 0.52) {
                        ctx.fillStyle = 'rgba(95, 185, 30, 0.15)';
                        ctx.fillRect(x, y, 2, 2);
                    }
                }
            }

            // 4. Perimeter Contact Shadow
            ctx.strokeStyle = 'rgba(8, 26, 10, 0.52)';
            ctx.lineWidth = 14;
            ctx.strokeRect(px - 6, py - 6, pw + 12, ph + 12);

            // 5. Crisp Pure White Chalk Lines with Drop Shadow Underlay
            ctx.strokeStyle = 'rgba(10, 36, 8, 0.58)';
            ctx.lineWidth = 11;
            drawCorrectPitchMarkings(ctx, px + 2, py + 2, pw, ph, mx + 2, my + 2, false);

            ctx.strokeStyle = '#ffffff';
            ctx.fillStyle = '#ffffff';
            ctx.lineWidth = 8;
            drawCorrectPitchMarkings(ctx, px, py, pw, ph, mx, my, true);

            return makePixelTex(c);
        }

        function drawCorrectPitchMarkings(ctx, px, py, pw, ph, mx, my, fillSpots) {
            ctx.strokeRect(px, py, pw, ph);

            // Halfway line (Connects Left Touchline to Right Touchline)
            ctx.beginPath();
            ctx.moveTo(px, my);
            ctx.lineTo(px + pw, my);
            ctx.stroke();

            // Center circle & Center kickoff spot
            ctx.beginPath();
            ctx.arc(mx, my, 160, 0, Math.PI * 2);
            ctx.stroke();
            if (fillSpots) {
                ctx.beginPath();
                ctx.arc(mx, my, 11, 0, Math.PI * 2);
                ctx.fill();
            }

            // Penalty Boxes & 6-Yard Boxes
            const penW = 620;
            const penH = 280;
            const sixW = 310;
            const sixH = 105;

            // Top Goal Area (Spain Goal, Top-Right in isometric view)
            ctx.strokeRect(mx - penW / 2, py, penW, penH);
            ctx.strokeRect(mx - sixW / 2, py, sixW, sixH);
            if (fillSpots) {
                ctx.beginPath(); ctx.arc(mx, py + 195, 10, 0, Math.PI * 2); ctx.fill();
            }
            ctx.beginPath(); ctx.arc(mx, py + 195, 135, 0.65, Math.PI - 0.65); ctx.stroke();

            // Bottom Goal Area (Argentina Goal, Bottom-Left in isometric view)
            ctx.strokeRect(mx - penW / 2, py + ph - penH, penW, penH);
            ctx.strokeRect(mx - sixW / 2, py + ph - sixH, sixW, sixH);
            if (fillSpots) {
                ctx.beginPath(); ctx.arc(mx, py + ph - 195, 10, 0, Math.PI * 2); ctx.fill();
            }
            ctx.beginPath(); ctx.arc(mx, py + ph - 195, 135, Math.PI + 0.65, -0.65); ctx.stroke();

            // 4 Corner Arcs
            const cr = 40;
            ctx.beginPath(); ctx.arc(px, py, cr, 0, Math.PI / 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(px + pw, py, cr, Math.PI / 2, Math.PI); ctx.stroke();
            ctx.beginPath(); ctx.arc(px + pw, py + ph, cr, Math.PI, Math.PI * 1.5); ctx.stroke();
            ctx.beginPath(); ctx.arc(px, py + ph, cr, Math.PI * 1.5, Math.PI * 2); ctx.stroke();
        }

        // Concrete Tier Material
        function buildConcreteStepTexture(isEven) {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 64;
            const ctx = c.getContext('2d');
            ctx.fillStyle = isEven ? '#485567' : '#394353';
            ctx.fillRect(0, 0, 256, 64);

            for (let y = 0; y < 64; y += 2) {
                for (let x = 0; x < 256; x += 2) {
                    const r = pxHash(x, y + (isEven ? 23 : 71));
                    if (r < 0.22) {
                        ctx.fillStyle = 'rgba(10, 15, 26, 0.32)';
                        ctx.fillRect(x, y, 2, 2);
                    } else if (r > 0.80) {
                        ctx.fillStyle = 'rgba(226, 232, 240, 0.16)';
                        ctx.fillRect(x, y, 2, 2);
                    }
                }
            }
            ctx.fillStyle = 'rgba(240, 246, 255, 0.26)';
            ctx.fillRect(0, 0, 256, 5);
            ctx.fillStyle = 'rgba(6, 10, 20, 0.60)';
            ctx.fillRect(0, 52, 256, 12);

            return makePixelTex(c, 8, 1);
        }

        // Aisle Stairways with Yellow Safety Nosings
        function buildStairTexture() {
            const c = document.createElement('canvas');
            c.width = 64; c.height = 64;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#647285';
            ctx.fillRect(0, 0, 64, 64);

            for (let y = 0; y < 64; y += 16) {
                ctx.fillStyle = '#78889d';
                ctx.fillRect(0, y, 64, 10);
                ctx.fillStyle = '#fbbf24';
                ctx.fillRect(4, y + 1, 56, 2);
                ctx.fillStyle = '#141d28';
                ctx.fillRect(0, y + 10, 64, 6);
            }
            return makePixelTex(c, 1, 1);
        }

        // Stadium Exterior Architectural Facade
        function buildExteriorFacadeTexture() {
            const c = document.createElement('canvas');
            c.width = 512; c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#141c28';
            ctx.fillRect(0, 0, 512, 256);

            for (let by = 16; by < 240; by += 52) {
                for (let bx = 12; bx < 500; bx += 32) {
                    const r = pxHash(bx, by);
                    ctx.fillStyle = (r > 0.65) ? '#1c2e46' : '#0c1626';
                    ctx.fillRect(bx, by, 24, 36);

                    if (r > 0.80) {
                        ctx.fillStyle = 'rgba(254, 240, 138, 0.28)';
                        ctx.fillRect(bx + 4, by + 6, 16, 14);
                    } else if (r < 0.24) {
                        ctx.fillStyle = 'rgba(56, 189, 248, 0.20)';
                        ctx.fillRect(bx + 4, by + 8, 16, 12);
                    }
                    ctx.strokeStyle = '#384656';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(bx, by, 24, 36);
                }
                ctx.fillStyle = '#080e18';
                ctx.fillRect(0, by + 38, 512, 14);
            }
            return makePixelTex(c, 2, 1);
        }

        // Concourse Paving
        function buildConcoursePavingTexture() {
            const c = document.createElement('canvas');

            const ctx = c.getContext('2d');
            ctx.fillStyle = '#18202c';
            ctx.fillRect(0, 0, 256, 256);

            for (let y = 0; y < 256; y += 4) {
                for (let x = 0; x < 256; x += 4) {
                    const r = pxHash(x, y);
                    if (r < 0.25) {
                        ctx.fillStyle = '#101620';
                        ctx.fillRect(x, y, 4, 4);
                    } else if (r > 0.80) {
                        ctx.fillStyle = '#222c3b';
                        ctx.fillRect(x, y, 4, 4);
                    }
                }
            }
            ctx.strokeStyle = 'rgba(6, 10, 16, 0.52)';
            ctx.lineWidth = 2;
            for (let i = 0; i <= 256; i += 32) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 256); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(256, i); ctx.stroke();

        // ============================================================================
        // COMPREHENSIVE WEB AUDIO SFX & AUDIENCE ENGINE (Zero External Assets)
        // ============================================================================
        let audioCtx = null;
        let masterGain = null;
        let isAudioMuted = false;
        let stadiumAmbienceNode = null;
        let stadiumAmbienceGain = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.gain.setValueAtTime(isAudioMuted ? 0.0001 : 1.0, audioCtx.currentTime);
                masterGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            return audioCtx;
        }

        function toggleMasterAudio(muted) {
            isAudioMuted = muted;
            if (masterGain && audioCtx) {
                masterGain.gain.setValueAtTime(muted ? 0.0001 : 1.0, audioCtx.currentTime);
            }
        }

        // 1. Continuous Ambient Stadium Audience (Chanting, Murmur, World Cup Final Atmosphere)
        function startStadiumAmbience() {
            try {
                const ctx = getAudioContext();
                if (!ctx || stadiumAmbienceNode) return;

                // 4 seconds stereo loop of live stadium audience murmur & subtle chanting
                const len = Math.floor(ctx.sampleRate * 4.2);
                const buf = ctx.createBuffer(2, len, ctx.sampleRate);
                const left = buf.getChannelData(0);
                const right = buf.getChannelData(1);

                let lastL = 0, lastR = 0;
                for (let i = 0; i < len; i++) {
                    const whiteL = Math.random() * 2 - 1;
                    const whiteR = Math.random() * 2 - 1;
                    // Lowpass random walk for authentic stadium acoustic roar
                    lastL = (lastL + 0.045 * whiteL) / 1.045;
                    lastR = (lastR + 0.045 * whiteR) / 1.045;

                    // Organic crowd chanting modulation in stands
                    const timeSec = i / ctx.sampleRate;
                    const chant = 1.0 + 0.24 * Math.sin(timeSec * Math.PI * 1.5) * Math.cos(timeSec * Math.PI * 0.75);
                    left[i] = lastL * chant;
                    right[i] = lastR * chant;
                }

                // Seamless looping crossfade at edges
                const fadeLen = 2500;
                for (let i = 0; i < fadeLen; i++) {
                    const t = i / fadeLen;
                    left[i] = left[i] * t + left[len - fadeLen + i] * (1 - t);
                    right[i] = right[i] * t + right[len - fadeLen + i] * (1 - t);
                }

                const src = ctx.createBufferSource();
                src.buffer = buf;
                src.loop = true;

                // Bandpass filter shaping authentic human crowd resonance
                const bpf = ctx.createBiquadFilter();
                bpf.type = 'bandpass';
                bpf.frequency.value = 750;
                bpf.Q.value = 0.9;

                stadiumAmbienceGain = ctx.createGain();
                stadiumAmbienceGain.gain.setValueAtTime(0.14, ctx.currentTime);

                src.connect(bpf);
                bpf.connect(stadiumAmbienceGain);
                stadiumAmbienceGain.connect(masterGain || ctx.destination);

                src.start(0);
                stadiumAmbienceNode = src;
            } catch (e) {}
        }

        function playWhistleSound(type = 'kickoff') {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const now = ctx.currentTime;
                const blasts = (type === 'goal')
                    ? [
                        { start: now + 0.0, dur: 0.13, vol: 0.28 },
                        { start: now + 0.17, dur: 0.13, vol: 0.28 },
                        { start: now + 0.35, dur: 0.44, vol: 0.34 }
                    ]
                    : (type === 'stoppage')
                    ? [
                        { start: now + 0.0, dur: 0.22, vol: 0.28 }
                    ]
                    : [
                        { start: now + 0.0, dur: 0.16, vol: 0.25 },
                        { start: now + 0.20, dur: 0.35, vol: 0.32 }
                    ];

                blasts.forEach(b => {
                    const osc1 = ctx.createOscillator();
                    const osc2 = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(2850, b.start);
                    osc1.frequency.exponentialRampToValueAtTime(2950, b.start + b.dur);
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(3120, b.start);
                    osc2.frequency.exponentialRampToValueAtTime(3220, b.start + b.dur);
                    gain.gain.setValueAtTime(0.001, b.start);
                    gain.gain.linearRampToValueAtTime(b.vol, b.start + 0.02);
                    gain.gain.setValueAtTime(b.vol, b.start + b.dur - 0.04);
                    gain.gain.exponentialRampToValueAtTime(0.001, b.start + b.dur);
                    osc1.connect(gain);
                    osc2.connect(gain);
                    gain.connect(masterGain || ctx.destination);
                    osc1.start(b.start);
                    osc2.start(b.start);
                    osc1.stop(b.start + b.dur);
                    osc2.stop(b.start + b.dur);
                });
            } catch (e) {}
        }

        // 1. Kick & Pass Impact Sound (crisp leather boot impact & punchy pop)
        function playKickSound(type = 'pass') {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const now = ctx.currentTime;

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                if (type === 'shot') {
                    // Deep powerful strike
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(175, now);
                    osc.frequency.exponentialRampToValueAtTime(38, now + 0.14);
                    gain.gain.setValueAtTime(0.42, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                } else {
                    // Snappy crisp pass
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(240, now);
                    osc.frequency.exponentialRampToValueAtTime(55, now + 0.08);
                    gain.gain.setValueAtTime(0.28, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                }

                // Boot leather impact transient noise
                const bufSize = Math.floor(ctx.sampleRate * 0.025);
                const noiseBuf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
                const out = noiseBuf.getChannelData(0);
                for (let i = 0; i < bufSize; i++) {
                    out[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.25));
                }
                const noise = ctx.createBufferSource();
                noise.buffer = noiseBuf;
                const noiseFilter = ctx.createBiquadFilter();
                noiseFilter.type = 'bandpass';
                noiseFilter.frequency.value = (type === 'shot') ? 1200 : 1800;
                noiseFilter.Q.value = 1.8;
                const noiseGain = ctx.createGain();
                noiseGain.gain.setValueAtTime(type === 'shot' ? 0.32 : 0.20, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);

                noise.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(masterGain || ctx.destination);

                osc.connect(gain);
                gain.connect(masterGain || ctx.destination);

                osc.start(now);
                osc.stop(now + 0.16);
                noise.start(now);
                noise.stop(now + 0.04);
            } catch (e) {}
        }

        // 4. Massive Stadium Goal Cheer & Celebration Roar (Sustained 4.6s Frenzy + Air Horns + Net Swoosh)
        function playGoalSound(team = 'ARG') {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const now = ctx.currentTime;

                // A) Swell continuous stadium audience ambience during the goal cheer
                if (stadiumAmbienceGain) {
                    stadiumAmbienceGain.gain.cancelScheduledValues(now);
                    stadiumAmbienceGain.gain.setValueAtTime(stadiumAmbienceGain.gain.value, now);
                    stadiumAmbienceGain.gain.linearRampToValueAtTime(0.38, now + 0.35);
                    stadiumAmbienceGain.gain.setValueAtTime(0.38, now + 3.8);
                    stadiumAmbienceGain.gain.linearRampToValueAtTime(0.14, now + 4.8);
                }

                // B) Massive multi-band crowd eruption roar (4.6 seconds of stadium ecstasy)
                const cheerDur = 4.6;
                const cheerLen = Math.floor(ctx.sampleRate * cheerDur);
                const cheerBuf = ctx.createBuffer(2, cheerLen, ctx.sampleRate);
                const cL = cheerBuf.getChannelData(0);
                const cR = cheerBuf.getChannelData(1);

                for (let i = 0; i < cheerLen; i++) {
                    const t = i / cheerLen;
                    let env = 1.0;
                    if (t < 0.05) {
                        env = t / 0.05; // Rapid 0.2s roar explosion
                    } else if (t > 0.72) {
                        env = (1 - t) / 0.28; // Tapering as celebration wraps up
                    }
                    // Rhythmic cheer pulses inside crowd
                    const chantBeat = Math.sin((i / ctx.sampleRate) * Math.PI * 4.0);
                    const chantMod = 1.0 + 0.35 * Math.max(0, chantBeat);
                    cL[i] = (Math.random() * 2 - 1) * env * chantMod;
                    cR[i] = (Math.random() * 2 - 1) * env * chantMod;
                }

                const cheerSrc = ctx.createBufferSource();
                cheerSrc.buffer = cheerBuf;

                const vocalFilter = ctx.createBiquadFilter();
                vocalFilter.type = 'lowpass';
                vocalFilter.frequency.setValueAtTime(1000, now);
                vocalFilter.frequency.linearRampToValueAtTime(2800, now + 0.35);
                vocalFilter.frequency.setValueAtTime(2500, now + 3.2);
                vocalFilter.frequency.linearRampToValueAtTime(1100, now + cheerDur);

                const cheerGain = ctx.createGain();
                cheerGain.gain.setValueAtTime(0.01, now);
                cheerGain.gain.linearRampToValueAtTime(0.48, now + 0.25);
                cheerGain.gain.setValueAtTime(0.48, now + 3.2);
                cheerGain.gain.exponentialRampToValueAtTime(0.001, now + cheerDur);

                cheerSrc.connect(vocalFilter);
                vocalFilter.connect(cheerGain);
                cheerGain.connect(masterGain || ctx.destination);
                cheerSrc.start(now);
                cheerSrc.stop(now + cheerDur + 0.05);

                // C) Stadium Celebration Air Horns ("BZZT - BZZT - BZZZZZT!")
                const hornBeats = [
                    { start: now + 0.25, dur: 0.32 },
                    { start: now + 0.68, dur: 0.32 },
                    { start: now + 1.15, dur: 0.85 }
                ];
                hornBeats.forEach(hb => {
                    [440, 554.37].forEach(f => {
                        const hornOsc = ctx.createOscillator();
                        const hornGain = ctx.createGain();
                        hornOsc.type = 'sawtooth';
                        hornOsc.frequency.setValueAtTime(f, hb.start);

                        const hornFilter = ctx.createBiquadFilter();
                        hornFilter.type = 'lowpass';
                        hornFilter.frequency.value = 1800;

                        hornGain.gain.setValueAtTime(0.001, hb.start);
                        hornGain.gain.linearRampToValueAtTime(0.09, hb.start + 0.04);
                        hornGain.gain.setValueAtTime(0.09, hb.start + hb.dur - 0.06);
                        hornGain.gain.exponentialRampToValueAtTime(0.001, hb.start + hb.dur);

                        hornOsc.connect(hornFilter);
                        hornFilter.connect(hornGain);
                        hornGain.connect(masterGain || ctx.destination);

                        hornOsc.start(hb.start);
                        hornOsc.stop(hb.start + hb.dur);
                    });
                });

                // D) Net rustle impact swoosh
                const netLen = Math.floor(ctx.sampleRate * 0.35);
                const netBuf = ctx.createBuffer(1, netLen, ctx.sampleRate);
                const netData = netBuf.getChannelData(0);
                for (let i = 0; i < netLen; i++) {
                    netData[i] = (Math.random() * 2 - 1) * (1 - i / netLen);
                }
                const netSrc = ctx.createBufferSource();
                netSrc.buffer = netBuf;
                const netFilter = ctx.createBiquadFilter();
                netFilter.type = 'bandpass';
                netFilter.frequency.setValueAtTime(1600, now);
                netFilter.frequency.exponentialRampToValueAtTime(500, now + 0.3);
                const netGain = ctx.createGain();
                netGain.gain.setValueAtTime(0.42, now);
                netGain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
                netSrc.connect(netFilter);
                netFilter.connect(netGain);
                netGain.connect(masterGain || ctx.destination);
                netSrc.start(now);
                netSrc.stop(now + 0.35);

                // E) Triple Goal Whistle Blast
                playWhistleSound('goal');
            } catch (e) {}
        }

        // 5. Crowd Wave Sound Swell
        function playCheerWaveSound() {

                for (let i = 0; i < waveLen; i++) {
                    const t = i / waveLen;
                    data[i] = (Math.random() * 2 - 1) * Math.sin(t * Math.PI);
                }
                const src = ctx.createBufferSource();
                src.buffer = buf;
                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(600, now);
                filter.frequency.linearRampToValueAtTime(1800, now + 0.9);
                filter.frequency.exponentialRampToValueAtTime(700, now + 1.9);
                filter.Q.value = 2.0;
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.28, now + 0.8);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 2.0);

                src.connect(filter);
                filter.connect(gain);
                gain.connect(masterGain || ctx.destination);
                src.start(now);
                src.stop(now + 2.05);
            } catch (e) {}
        }

        function animateCheeringCrowd(time) {
            const isGoal = matchState.goalTimer > 0;
            const isWave = matchState.waveTimer > 0;
            const spd = isGoal ? 15.0 : 6.5;
            const amp = isGoal ? 0.82 : 0.32;

            for (let i = 0; i < totalFans; i++) {
                const s = crowdSeats[i];
                let wv = Math.sin(time * spd + s.phase + (s.x + s.z) * 0.08);
                if (isWave) {
                    const ang = Math.atan2(s.z, s.x);
                    wv = Math.sin(time * 9.5 - ang * 3.0);
                }
                const jump = Math.max(0, wv) * amp;

                dummy.position.set(s.x, s.y + 0.56 + jump, s.z);
                dummy.rotation.set(0, s.rotY, 0);
                dummy.updateMatrix();
                crowdTorsos.setMatrixAt(i, dummy.matrix);

                dummy.position.set(s.x, s.y + 1.38 + jump * 1.1, s.z);
                dummy.updateMatrix();
                crowdHeads.setMatrixAt(i, dummy.matrix);

                dummy.position.set(s.x, s.y + 1.58 + jump * 1.1, s.z);
                dummy.updateMatrix();
                crowdHairs.setMatrixAt(i, dummy.matrix);
            }
            crowdTorsos.instanceMatrix.needsUpdate = true;
            crowdHeads.instanceMatrix.needsUpdate = true;
            crowdHairs.instanceMatrix.needsUpdate = true;

            wavingFlags.forEach(f => {
                const mult = isGoal ? 1.8 : 1.0;
                f.group.rotation.z = Math.sin(time * 5.5 * mult + f.phase) * 0.32 * mult;
                f.group.rotation.y = f.baseRotY + Math.cos(time * 4.2 * mult + f.phase) * 0.35;
            });
        }

        // Anti-Clipping Solver
        function solveCharacterCollisions() {
            const all = [...players, referee];
            const hw = PITCH_W / 2 + 3.0;
            const hl = PITCH_L / 2 + 3.0;

            for (let iter = 0; iter < 4; iter++) {
                for (let i = 0; i < all.length; i++) {
                    const a = all[i];
                    for (let j = i + 1; j < all.length; j++) {
                        const b = all[j];
                        const minD = a.radius + b.radius;
                        let dx = b.x - a.x;
                        let dz = b.z - a.z;
                        const dSq = dx * dx + dz * dz;
                        if (dSq < minD * minD) {
                            const d = Math.max(0.001, Math.sqrt(dSq));
                            const overlap = (minD - d) * 0.52;
                            const nx = dx / d;
                            const nz = dz / d;
                            a.x -= nx * overlap;
                            a.z -= nz * overlap;
                            b.x += nx * overlap;
                            b.z += nz * overlap;
                        }
                    }

                    goalPostColliders.forEach(gp => {
                        const dx = a.x - gp.x;
                        const dz = a.z - gp.z;
                        const minD = a.radius + gp.r;
                        const dSq = dx * dx + dz * dz;
                        if (dSq < minD * minD) {
                            const d = Math.max(0.001, Math.sqrt(dSq));
                            a.x += (dx / d) * (minD - d);
                            a.z += (dz / d) * (minD - d);
                        }
                    });

                    a.x = THREE.MathUtils.clamp(a.x, -hw, hw);
                    a.z = THREE.MathUtils.clamp(a.z, -hl, hl);
                }
            }
        }

        function detonateRocket(r) {
            scene.remove(r.mesh);

            const light = celebrationFX.lights.find(l => l.intensity <= 0.1) || celebrationFX.lights[0];

            // High-density spherical starburst explosion (115 glowing stars per burst)
            const count = 115;
            const positions = new Float32Array(count * 3);
            const colorsArr = new Float32Array(count * 3);
            const velocities = [];

            const burstTeamColors = CELEB_COLORS[r.team] || CELEB_COLORS.ARG;

            for (let i = 0; i < count; i++) {
                positions[i * 3 + 0] = r.x;
                positions[i * 3 + 1] = r.y;
                positions[i * 3 + 2] = r.z;

                const c = (Math.random() < 0.65) ? r.color : burstTeamColors[Math.floor(Math.random() * burstTeamColors.length)];
                colorsArr[i * 3 + 0] = c.r;
                colorsArr[i * 3 + 1] = c.g;
                colorsArr[i * 3 + 2] = c.b;

                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const spd = 7.0 + Math.random() * 14.0;

                velocities.push({
                    vx: spd * Math.sin(phi) * Math.cos(theta),
                    vy: spd * Math.sin(phi) * Math.sin(theta),
                    vz: spd * Math.cos(phi)

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colorsArr, 3));

            const pMesh = new THREE.Points(geo, sparkMat.clone());
            scene.add(pMesh);

            celebrationFX.sparks.push({
                mesh: pMesh,
                geo: geo,
                velocities: velocities,
                count: count,
                life: 1.9,
                maxLife: 1.9
            });

        function updateCelebration(dt, time) {
            // Fade detonation light flashes
            celebrationFX.lights.forEach(l => {
                if (l.intensity > 0) {
                    l.intensity = Math.max(0, l.intensity - dt * 6.5);
                }
            });

            // 1. Rockets
            for (let i = celebrationFX.rockets.length - 1; i >= 0; i--) {
                const r = celebrationFX.rockets[i];
                r.fuse -= dt;
                r.x += r.vx * dt;
                r.y += r.vy * dt;
                r.z += r.vz * dt;
                r.vy -= 10.0 * dt;
                r.mesh.position.set(r.x, r.y, r.z);

                if (r.fuse <= 0 || r.y > 32 || (r.vy < 0 && r.y > 22)) {
                    detonateRocket(r);
                    celebrationFX.rockets.splice(i, 1);
                }
            }

            // 2. Fireworks sparks
            for (let i = celebrationFX.sparks.length - 1; i >= 0; i--) {
                const sp = celebrationFX.sparks[i];
                sp.life -= dt;
                const pos = sp.geo.attributes.position.array;

                for (let j = 0; j < sp.count; j++) {
                    const vel = sp.velocities[j];
                    vel.vy -= 9.5 * dt; // gentle gravity
                    vel.vx *= Math.pow(0.90, dt * 30); // atmospheric drag
                    vel.vz *= Math.pow(0.90, dt * 30);

                    pos[j * 3 + 0] += vel.vx * dt;
                    pos[j * 3 + 1] += vel.vy * dt;
                    pos[j * 3 + 2] += vel.vz * dt;
                }
                sp.geo.attributes.position.needsUpdate = true;
                sp.mesh.material.opacity = Math.max(0, sp.life / sp.maxLife);

                if (sp.life <= 0) {
                    scene.remove(sp.mesh);
                    sp.geo.dispose();
                    sp.mesh.material.dispose();
                    celebrationFX.sparks.splice(i, 1);
                }
            }

            // 3. Audience ribbons & confetti
            for (let i = celebrationFX.ribbons.length - 1; i >= 0; i--) {
                const rb = celebrationFX.ribbons[i];
                rb.life -= dt;
                rb.vy -= 9.5 * dt; // gravity
                rb.vx *= Math.pow(0.86, dt * 25);
                rb.vz *= Math.pow(0.86, dt * 25);
                if (rb.vy < -3.5) rb.vy = -3.5; // flutter terminal velocity

                const flutter = Math.sin(time * 8 + rb.flutterPhase) * 1.5;

                rb.mesh.position.x += (rb.vx + flutter * 0.4) * dt;
                rb.mesh.position.y += rb.vy * dt;
                rb.mesh.position.z += (rb.vz + flutter * 0.4) * dt;

                rb.mesh.rotation.x += rb.rotSpeedX * dt;
                rb.mesh.rotation.y += rb.rotSpeedY * dt;
                rb.mesh.rotation.z += rb.rotSpeedZ * dt;

                if (rb.mesh.position.y <= 0.15) {
                    rb.mesh.position.y = 0.15;
                    rb.vy = 0;
                    rb.vx = 0;
                    rb.vz = 0;
                }

                if (rb.life <= 0) {
                    scene.remove(rb.mesh);
                    rb.mesh.material.dispose();
                    celebrationFX.ribbons.splice(i, 1);
                }
            }
        }
