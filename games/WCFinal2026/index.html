            let minDist = 38; // screen pixel radius threshold

            for (let i = 0; i < all.length; i++) {
                const p = all[i];
                hoverProjVec.set(p.x, 1.8, p.z).project(camera);
                const sx = (hoverProjVec.x *  0.5 + 0.5) * window.innerWidth;
                const sy = (hoverProjVec.y * -0.5 + 0.5) * window.innerHeight;
                const d = Math.hypot(mx - sx, my - sy);
                if (d < minDist) {
                    minDist = d;
                    closest = p;
                }
            }

            hoveredPlayer = closest;
            if (hoveredPlayer && hoverTagEl) {
                renderer.domElement.style.cursor = 'pointer';
                const isArg = hoveredPlayer.team === 'ARG';
                const isEsp = hoveredPlayer.team === 'ESP';

                if (hoverCardEl) {
                    hoverCardEl.className = isArg 
                        ? 'px-2.5 py-1 rounded-lg bg-slate-950/95 border-2 border-sky-400 flex items-center gap-2 shadow-2xl backdrop-blur-md'
                        : (isEsp 
                            ? 'px-2.5 py-1 rounded-lg bg-slate-950/95 border-2 border-amber-400 flex items-center gap-2 shadow-2xl backdrop-blur-md'
                            : 'px-2.5 py-1 rounded-lg bg-slate-950/95 border-2 border-yellow-300 flex items-center gap-2 shadow-2xl backdrop-blur-md');
                }
                if (hoverNumEl) {
                    hoverNumEl.className = isArg
                        ? 'pixel-font text-[9px] px-1.5 py-0.5 rounded font-bold bg-sky-400 text-slate-950'
                        : (isEsp
                            ? 'pixel-font text-[9px] px-1.5 py-0.5 rounded font-bold bg-red-600 text-yellow-200'
                            : 'pixel-font text-[9px] px-1.5 py-0.5 rounded font-bold bg-yellow-400 text-slate-950');
                    hoverNumEl.textContent = hoveredPlayer.role === 'REF' ? 'REF' : `#${hoveredPlayer.num}`;
                }
                if (hoverNameEl) {
                    hoverNameEl.textContent = hoveredPlayer.name || hoveredPlayer.shortName;
                }
                if (hoverRoleEl) {
                    const teamLabel = hoveredPlayer.team === 'REF' ? 'MATCH OFFICIAL' : (hoveredPlayer.team === 'ARG' ? 'ARGENTINA' : 'SPAIN');
                    hoverRoleEl.textContent = `${teamLabel} • ${hoveredPlayer.role}`;
                }
            } else {
                renderer.domElement.style.cursor = 'default';
                if (hoverTagEl) hoverTagEl.classList.add('hidden');
            }
        }

        function updateOverlayTags(time) {
            const active = viewState.focusPlayer || ball.carrier;
            if (viewState.showTag && active && active !== hoveredPlayer) {
                projVec.set(active.x, 3.1, active.z).project(camera);
                const sx = (projVec.x *  0.5 + 0.5) * window.innerWidth;
                const sy = (projVec.y * -0.5 + 0.5) * window.innerHeight;
                tagEl.style.left = `${sx}px`;
                tagEl.style.top  = `${sy}px`;
                tagEl.classList.remove('hidden');
                tagNum.textContent  = `#${active.num}`;
                tagName.textContent = active.shortName;
            } else {
                tagEl.classList.add('hidden');
            }

            if (hoveredPlayer && hoverTagEl) {
                hoverProjVec.set(hoveredPlayer.x, 3.25, hoveredPlayer.z).project(camera);
                const sx = (hoverProjVec.x *  0.5 + 0.5) * window.innerWidth;
                const sy = (hoverProjVec.y * -0.5 + 0.5) * window.innerHeight;
                hoverTagEl.style.left = `${sx}px`;
                hoverTagEl.style.top  = `${sy}px`;
                hoverTagEl.classList.remove('hidden');
            } else if (hoverTagEl) {
                hoverTagEl.classList.add('hidden');
            }

            cornerFlags.forEach((cf, i) => {
                cf.rotation.y = Math.sin(time * 6 + i) * 0.25;
            });
        }

        // ============================================================================
        // FULL SOCCER RULES ENGINE: THROW-IN, CORNER KICK & GOAL KICK
        // ============================================================================
        const setPieceState = {
            active: false,
            type: null, // 'THROW_IN' | 'CORNER_KICK' | 'GOAL_KICK'
            team: null, // 'ARG' | 'ESP'
            spotX: 0,
            spotZ: 0,
            taker: null,
            timer: 0,
            setupDuration: 1.55
        };
        window.setPieceState = setPieceState;

        function startSetPiece(type, team, spotX, spotZ) {
            if (celebrationState.active || matchState.goalTimer > 0) return;
            const hw = PITCH_W / 2;
            const hl = PITCH_L / 2;

            matchState.phase = 'SET_PIECE';
            setPieceState.active = true;
            setPieceState.type = type;
            setPieceState.team = team;
            setPieceState.timer = 0;

            playWhistleSound('stoppage');

            ball.vx = 0; ball.vy = 0; ball.vz = 0;
            ball.cooldown = 0.5;

            let taker = null;

            if (type === 'GOAL_KICK') {
                setPieceState.setupDuration = 1.65;
                setPieceState.spotX = 0;
                setPieceState.spotZ = (team === 'ESP') ? -34.5 : 34.5;
                taker = players.find(p => p.team === team && p.role === 'GK') || players[team === 'ARG' ? 0 : 11];
                setPieceState.taker = taker;

                ball.mesh.position.set(0, 0.42, setPieceState.spotZ);
                ball.shadow.position.set(0, 0.025, setPieceState.spotZ);

                taker.x = 0;
                taker.z = setPieceState.spotZ + (team === 'ARG' ? 1.6 : -1.6);
                taker.vx = 0; taker.vz = 0;
                taker.root.position.set(taker.x, 0, taker.z);
                taker.root.rotation.y = (team === 'ARG') ? Math.PI : 0;

                showKickoffBanner('🥅 GOAL KICK — ' + (team === 'ARG' ? 'ARGENTINA' : 'SPAIN'), 'Restart by #' + taker.num + ' ' + taker.shortName, 2200);
                setTicker('🥅 Ball over the defending end line! Goal kick awarded to ' + (team === 'ARG' ? 'Argentina' : 'Spain') + '!');
            } else if (type === 'CORNER_KICK') {
                setPieceState.setupDuration = 1.75;
                const signX = (spotX >= 0) ? 1 : -1;
                const signZ = (spotZ >= 0) ? 1 : -1;
                setPieceState.spotX = signX * (hw - 0.7);
                setPieceState.spotZ = signZ * (hl - 0.7);

                // Select closest attacking winger/forward
                const candidates = players.filter(p => p.team === team && p.role !== 'GK');
                candidates.sort((a, b) => Math.hypot(a.x - setPieceState.spotX, a.z - setPieceState.spotZ) - Math.hypot(b.x - setPieceState.spotX, b.z - setPieceState.spotZ));
                taker = candidates[0] || players[team === 'ARG' ? 9 : 17];
                setPieceState.taker = taker;

                ball.mesh.position.set(setPieceState.spotX, 0.42, setPieceState.spotZ);
                ball.shadow.position.set(setPieceState.spotX, 0.025, setPieceState.spotZ);

                taker.x = setPieceState.spotX + signX * 0.9;
                taker.z = setPieceState.spotZ + signZ * 0.9;
                taker.vx = 0; taker.vz = 0;
                taker.root.position.set(taker.x, 0, taker.z);
                const targetZ = (setPieceState.spotZ < 0) ? -hl + 9 : hl - 9;
                taker.root.rotation.y = Math.atan2(0 - taker.x, targetZ - taker.z);

                showKickoffBanner('🚩 CORNER KICK — ' + (team === 'ARG' ? 'ARGENTINA' : 'SPAIN'), 'Corner delivery by #' + taker.num + ' ' + taker.shortName, 2200);
                setTicker('🚩 Ball deflected over goal line by defender! Corner kick for ' + (team === 'ARG' ? 'Argentina' : 'Spain') + '!');
            } else {
                // THROW_IN
                setPieceState.setupDuration = 1.60;
                const signX = (spotX >= 0) ? 1 : -1;
                setPieceState.spotX = signX * (hw + 0.3);
                setPieceState.spotZ = THREE.MathUtils.clamp(spotZ, -hl + 3.0, hl - 3.0);

                const candidates = players.filter(p => p.team === team && p.role !== 'GK');
                candidates.sort((a, b) => Math.hypot(a.x - setPieceState.spotX, a.z - setPieceState.spotZ) - Math.hypot(b.x - setPieceState.spotX, b.z - setPieceState.spotZ));
                taker = candidates[0] || players[team === 'ARG' ? 1 : 12];
                setPieceState.taker = taker;

                ball.mesh.position.set(setPieceState.spotX, 0.42, setPieceState.spotZ);
                ball.shadow.position.set(setPieceState.spotX, 0.025, setPieceState.spotZ);

                taker.x = setPieceState.spotX;
                taker.z = setPieceState.spotZ;
                taker.vx = 0; taker.vz = 0;
                taker.root.position.set(taker.x, 0, taker.z);
                taker.root.rotation.y = (signX > 0) ? -Math.PI / 2 : Math.PI / 2;

                showKickoffBanner('🤾 THROW-IN — ' + (team === 'ARG' ? 'ARGENTINA' : 'SPAIN'), 'Taken on sideline by #' + taker.num + ' ' + taker.shortName, 2200);
                setTicker('🤾 Ball over the touchline! Throw-in awarded to ' + (team === 'ARG' ? 'Argentina' : 'Spain') + '!');
            }

            ball.carrier = taker;
        }
        window.startSetPiece = startSetPiece;

        function executeSetPiece() {
            const type = setPieceState.type;
            const team = setPieceState.team;
            const taker = setPieceState.taker;
            const sx = setPieceState.spotX;
            const sz = setPieceState.spotZ;
            const hw = PITCH_W / 2;
            const hl = PITCH_L / 2;

            if (type === 'THROW_IN') {
                // Find teammate inside the pitch
                const mates = players.filter(m => m.team === team && m !== taker && Math.abs(m.x) < hw - 1.5);
                mates.sort((a, b) => Math.hypot(a.x - sx, a.z - sz) - Math.hypot(b.x - sx, b.z - sz));
                const receiver = mates[0] || players.find(m => m.team === team && m !== taker);

                const dx = receiver ? (receiver.x - sx) : -Math.sign(sx) * 10;
                const dz = receiver ? (receiver.z - sz) : 0;
                const dist = Math.max(1, Math.hypot(dx, dz));

                taker.kickTimer = 0.42;
                taker.kickDuration = 0.42;
                taker.kickType = 'pass';
                taker.leftArm.rotation.x = 0.85;
                taker.rightArm.rotation.x = 0.85;
                taker.bodyPivot.rotation.x = -0.22;

                ball.mesh.position.set(sx - Math.sign(sx) * 0.85, 1.45, sz);
                const spd = Math.min(18.5, 9.5 + dist * 0.50);
                ball.vx = (dx / dist) * spd;
                ball.vz = (dz / dist) * spd;
                ball.vy = 3.4;
                ball.cooldown = 0.42;
                ball.carrier = null;
                ball.lastTouchTeam = team;
                ball.lastTouchPlayer = taker;

                playKickSound('pass');
                const who = receiver ? `to #${receiver.num} ${receiver.shortName}` : 'into play';
                setTicker(`🤾 #${taker.num} ${taker.shortName} (${team}) throws ${who}!`);
            } else if (type === 'CORNER_KICK') {
                taker.kickTimer = 0.62;
                taker.kickDuration = 0.62;
                taker.kickType = 'shot';

                const targetEndZ = (sz < 0) ? -hl : hl;
                const targetSign = (sz < 0) ? 1 : -1;
                const targetX = (Math.random() - 0.5) * 8.5;
                const targetZ = targetEndZ + targetSign * (9.5 + Math.random() * 4.5);

                const dx = targetX - sx;
                const dz = targetZ - sz;
                const dist = Math.max(1, Math.hypot(dx, dz));

                taker.kickTargetAngle = Math.atan2(dx, dz);
                taker.root.rotation.y = taker.kickTargetAngle;
                taker.vx = 0; taker.vz = 0;
                playKickSound('shot');

                ball.mesh.position.set(sx, 0.42, sz);
                ball.vx = (dx / dist) * 19.8;
                ball.vz = (dz / dist) * 19.8;
                ball.vy = 7.8;
                ball.cooldown = 0.50;
                ball.carrier = null;
                ball.lastTouchTeam = team;
                ball.lastTouchPlayer = taker;

                setTicker(`🚩 #${taker.num} ${taker.shortName} (${team}) crosses corner kick into the box!`);
            } else if (type === 'GOAL_KICK') {
                taker.kickTimer = 0.65;
                taker.kickDuration = 0.65;
                taker.kickType = 'shot';

                const targetX = (Math.random() - 0.5) * 16.0;
                const targetZ = (team === 'ARG') ? -6.0 : 6.0;
                const dx = targetX - sx;
                const dz = targetZ - sz;
                const dist = Math.max(1, Math.hypot(dx, dz));

                taker.kickTargetAngle = Math.atan2(dx, dz);
                taker.root.rotation.y = taker.kickTargetAngle;
                taker.vx = 0; taker.vz = 0;
                playKickSound('shot');

                ball.mesh.position.set(sx, 0.42, sz);
                ball.vx = (dx / dist) * 23.0;
                ball.vz = (dz / dist) * 23.0;
                ball.vy = 10.2;
                ball.cooldown = 0.55;
                ball.carrier = null;
                ball.lastTouchTeam = team;
                ball.lastTouchPlayer = taker;

                setTicker(`🥅 #${taker.num} ${taker.shortName} (${team}) launches a long goal kick downfield!`);
            }

            setPieceState.active = false;
            matchState.phase = 'PLAYING';
            setTimeout(() => {
                hideKickoffBanner();
            }, 1400);
        }

        function triggerSetPiece(type, team) {
            if (matchState.phase !== 'PLAYING') {
                setTicker('Wait for open play before triggering set piece!');
                return;
            }
            const hw = PITCH_W / 2;
            const hl = PITCH_L / 2;
            if (type === 'CORNER_KICK') {
                const signX = (Math.random() < 0.5) ? 1 : -1;
                const cornerZ = (team === 'ARG') ? (-hl + 0.6) : (hl - 0.6);
                startSetPiece('CORNER_KICK', team, signX * (hw - 0.6), cornerZ);
            } else if (type === 'THROW_IN') {
                const signX = (Math.random() < 0.5) ? 1 : -1;
                const throwZ = (Math.random() - 0.5) * 44;
                startSetPiece('THROW_IN', team, signX * hw, throwZ);
            } else if (type === 'GOAL_KICK') {
                const kickZ = (team === 'ARG') ? 34.5 : -34.5;
                startSetPiece('GOAL_KICK', team, 0, kickZ);
            }
        }
        window.triggerSetPiece = triggerSetPiece;

        function stepMatchSimulation(dt, time) {
            if (matchState.goalTimer > 0) matchState.goalTimer -= dt;
            if (matchState.waveTimer > 0) matchState.waveTimer -= dt;
            if (ball.cooldown > 0) ball.cooldown -= dt;

            const allChars = [...players, referee];

            // 1. READY_KICKOFF PHASE: Everyone in position waiting for whistle
            if (matchState.phase === 'READY_KICKOFF') {
                ball.mesh.position.set(0, 0.42, 0);
                ball.vx = 0; ball.vy = 0; ball.vz = 0;
                ball.shadow.position.set(0, 0.025, 0);

                allChars.forEach(p => {
                    const target = getKickoffPosition(p, matchState.kickoffTeam);
                    p.x = target.x;
                    p.z = target.z;
                    p.vx = 0; p.vz = 0;
                    p.root.position.set(p.x, 0, p.z);
                    p.root.rotation.y = Math.atan2(0 - p.x, 0 - p.z);
                    p.leftLeg.rotation.x = 0;
                    p.rightLeg.rotation.x = 0;
                    p.leftArm.rotation.x = 0;
                    p.rightArm.rotation.x = 0;
                    p.bodyPivot.position.set(0, 0, 0);
                    p.bodyPivot.rotation.set(0, 0, 0);
                    p.headGroup.rotation.set(0, 0, 0);
                });

                matchState.readyTimer -= dt;
                if (matchState.readyTimer <= 0) {
                    executeKickoff();
                }

                updateOverlayTags(time);
                return;
            }

            // 2. RETURNING PHASE: Players jog back to their kickoff positions
            if (matchState.phase === 'RETURNING') {
                matchState.returningTimer += dt;
                ball.mesh.position.set(0, 0.42, 0);
                ball.vx = 0; ball.vy = 0; ball.vz = 0;
                ball.shadow.position.set(0, 0.025, 0);

                let allInPosition = true;

                allChars.forEach(p => {
                    const target = getKickoffPosition(p, matchState.kickoffTeam);
                    const dx = target.x - p.x;
                    const dz = target.z - p.z;
                    const dist = Math.hypot(dx, dz);

                    if (dist > 0.45) {
                        allInPosition = false;
                        const runSpd = p.speed * 1.15;
                        const step = Math.min(dist, runSpd * dt);
                        p.vx = (dx / dist) * runSpd;
                        p.vz = (dz / dist) * runSpd;
                        p.x += (dx / dist) * step;
                        p.z += (dz / dist) * step;
                        p.root.position.set(p.x, 0, p.z);
                        p.root.rotation.y = Math.atan2(p.vx, p.vz);

                        const cyc = time * 18.0 + p.phase;
                        p.leftLeg.rotation.x  =  Math.sin(cyc) * 0.75;
                        p.rightLeg.rotation.x = -Math.sin(cyc) * 0.75;
                        p.leftArm.rotation.x  = -Math.sin(cyc) * 0.60;
                        p.rightArm.rotation.x =  Math.sin(cyc) * 0.60;
                        p.bodyPivot.position.y = Math.abs(Math.cos(cyc)) * 0.18;
                        p.headGroup.rotation.set(0, 0, 0);
                    } else {
                        // In position
                        p.x = target.x;
                        p.z = target.z;
                        p.vx = 0; p.vz = 0;
                        p.root.position.set(p.x, 0, p.z);
                        p.root.rotation.y = Math.atan2(0 - p.x, 0 - p.z);
                        p.leftLeg.rotation.x = 0;
                        p.rightLeg.rotation.x = 0;
                        p.leftArm.rotation.x = 0;
                        p.rightArm.rotation.x = 0;
                        p.bodyPivot.position.set(0, 0, 0);
                        p.bodyPivot.rotation.set(0, 0, 0);
                        p.headGroup.rotation.set(0, 0, 0);
                    }
                });

                solveCharacterCollisions();

                // Check if all players have returned, or safety timeout (5.5s)
                if (allInPosition || matchState.returningTimer > 5.5) {
                    allChars.forEach(p => {
                        const target = getKickoffPosition(p, matchState.kickoffTeam);
                        p.x = target.x; p.z = target.z;
                        p.vx = 0; p.vz = 0;
                        p.root.position.set(p.x, 0, p.z);
                        p.root.rotation.y = Math.atan2(0 - p.x, 0 - p.z);
                        p.leftLeg.rotation.x = 0; p.rightLeg.rotation.x = 0;
                        p.leftArm.rotation.x = 0; p.rightArm.rotation.x = 0;
                        p.bodyPivot.position.set(0, 0, 0);
                        p.bodyPivot.rotation.set(0, 0, 0);
                        p.headGroup.rotation.set(0, 0, 0);
                    });
                    matchState.phase = 'READY_KICKOFF';
                    matchState.readyTimer = 1.0;
                    showKickoffBanner('⚽ TEAMS IN POSITION', 'All players in position • Ready for Kick Off...');
                    setTicker('All players in position! Referee whistle ready...');
                }

                updateOverlayTags(time);
                return;
            }

            // 2.5 SET_PIECE PHASE: Throw-in, Corner Kick, or Goal Kick positioning
            if (matchState.phase === 'SET_PIECE') {
                setPieceState.timer += dt;
                const t = setPieceState.timer;
                const taker = setPieceState.taker;
                const type = setPieceState.type;
                const team = setPieceState.team;
                const hw = PITCH_W / 2;
                const hl = PITCH_L / 2;

                if (type === 'THROW_IN') {
                    if (t > 0.4 && taker) {
                        ball.mesh.position.set(taker.x, 1.88, taker.z);
                        ball.shadow.position.set(taker.x, 0.025, taker.z);
                        taker.leftArm.rotation.x = -2.45 + Math.sin(t * 5.0) * 0.12;
                        taker.rightArm.rotation.x = -2.45 + Math.sin(t * 5.0) * 0.12;
                        taker.bodyPivot.rotation.x = 0.14;
                        taker.root.rotation.y = (taker.x > 0) ? -Math.PI / 2 : Math.PI / 2;
                    } else {
                        ball.mesh.position.set(setPieceState.spotX, 0.42, setPieceState.spotZ);
                        ball.shadow.position.set(setPieceState.spotX, 0.025, setPieceState.spotZ);
                    }
                } else {
                    ball.mesh.position.set(setPieceState.spotX, 0.42, setPieceState.spotZ);
                    ball.shadow.position.set(setPieceState.spotX, 0.025, setPieceState.spotZ);
                }
                ball.vx = 0; ball.vy = 0; ball.vz = 0;

                players.forEach(p => {
                    if (p === taker) {
                        const dx = setPieceState.spotX - p.x;
                        const dz = setPieceState.spotZ - p.z;
                        const dist = Math.hypot(dx, dz);
                        if (dist > 0.35) {
                            const spd = p.speed * 1.1;
                            p.vx = (dx / dist) * spd;
                            p.vz = (dz / dist) * spd;
                            p.x += p.vx * dt;
                            p.z += p.vz * dt;
                            p.root.rotation.y = Math.atan2(p.vx, p.vz);
                        } else {
                            p.vx = 0; p.vz = 0;
                            if (type === 'THROW_IN') {
                                p.root.rotation.y = (p.x > 0) ? -Math.PI / 2 : Math.PI / 2;
                            } else if (type === 'CORNER_KICK') {
                                const boxTargetZ = (p.z < 0) ? (-hl + 10) : (hl - 10);
                                p.root.rotation.y = Math.atan2(0 - p.x, boxTargetZ - p.z);
                            } else if (type === 'GOAL_KICK') {
                                p.root.rotation.y = (p.team === 'ARG') ? Math.PI : 0;
                            }
                        }
                        return;
                    }

                    let tx = p.homeX;
                    let tz = p.homeZ;

                    if (type === 'CORNER_KICK') {
                        const targetEndZ = (setPieceState.spotZ < 0) ? -hl : hl;
                        const targetSign = (setPieceState.spotZ < 0) ? 1 : -1;
                        if (p.role === 'FWD' || p.role === 'MID') {
                            tx = p.homeX * 0.42;
                            tz = targetEndZ + targetSign * (6.0 + (p.num % 5) * 2.2);
                        } else if (p.role === 'DEF') {
                            tx = p.homeX * 0.38;
                            tz = targetEndZ + targetSign * (4.5 + (p.num % 4) * 2.0);
                        }
                    } else if (type === 'THROW_IN') {
                        const sideSign = Math.sign(setPieceState.spotX);
                        const distToSide = Math.abs(setPieceState.spotZ - p.homeZ);
                        if (distToSide < 22) {
                            tx = p.homeX * 0.5 + sideSign * 12.0;
                            tz = THREE.MathUtils.clamp(p.homeZ * 0.6 + setPieceState.spotZ * 0.4, -hl + 3, hl - 3);
                        }
                    } else if (type === 'GOAL_KICK') {
                        tx = p.homeX;
                        tz = p.homeZ * 0.65;
                    }

                    const dx = tx - p.x;
                    const dz = tz - p.z;
                    const dist = Math.hypot(dx, dz);
                    if (dist > 0.8) {
                        const spd = p.speed * 0.85;
                        p.vx = (dx / dist) * spd;
                        p.vz = (dz / dist) * spd;
                        p.x += p.vx * dt;
                        p.z += p.vz * dt;
                        p.root.rotation.y = Math.atan2(p.vx, p.vz);
                    } else {
                        p.vx = 0; p.vz = 0;
                    }
                });

                // Referee positions to observe set piece
                const rtx = THREE.MathUtils.clamp(setPieceState.spotX * 0.65, -15, 15);
                const rtz = THREE.MathUtils.clamp(setPieceState.spotZ * 0.65, -20, 20);
                const rdx = rtx - referee.x, rdz = rtz - referee.z;
                const rd = Math.hypot(rdx, rdz);
                if (rd > 1.0) {
                    referee.vx = (rdx / rd) * referee.speed;
                    referee.vz = (rdz / rd) * referee.speed;
                    referee.x += referee.vx * dt;
                    referee.z += referee.vz * dt;
                    referee.root.rotation.y = Math.atan2(rdx, rdz);
                } else {
                    referee.vx = 0; referee.vz = 0;
                    referee.root.rotation.y = Math.atan2(setPieceState.spotX - referee.x, setPieceState.spotZ - referee.z);
                }

                solveCharacterCollisions();

                if (setPieceState.timer >= setPieceState.setupDuration) {
                    executeSetPiece();
                }

                updateOverlayTags(time);
                return;
            }

            // 3. PLAYING or CELEBRATION
            if (celebrationState.active) {
                ball.mesh.position.set(0, 0.42, 0);
                ball.vx = 0; ball.vy = 0; ball.vz = 0;
            } else {
                ball.mesh.position.x += ball.vx * dt;
                ball.mesh.position.z += ball.vz * dt;
                ball.mesh.position.y += ball.vy * dt;
            }

            if (ball.mesh.position.y > 0.42) {
                ball.vy -= 21.0 * dt;
            } else {
                ball.mesh.position.y = 0.42;
                if (Math.abs(ball.vy) > 2.0) ball.vy = -ball.vy * 0.45;
                else ball.vy = 0;
                ball.vx *= Math.pow(0.30, dt);
                ball.vz *= Math.pow(0.30, dt);
            }

            ball.mesh.rotation.z -= ball.vx * dt * 1.4;
            ball.mesh.rotation.x += ball.vz * dt * 1.4;
            ball.shadow.position.set(ball.mesh.position.x, 0.025, ball.mesh.position.z);

            const bx = ball.mesh.position.x;
            const bz = ball.mesh.position.z;
            const hw = PITCH_W / 2;
            const hl = PITCH_L / 2;

            // FULL SOCCER BOUNDARY RULES: GOAL, GOAL KICK, CORNER KICK, THROW-IN
            if (Math.abs(bz) > hl) {
                if (Math.abs(bx) < 4.8 && ball.mesh.position.y < 3.4) {
                    // GOAL! Ball entered between the goal posts under crossbar
                    if (matchState.goalTimer <= 0 && matchState.phase === 'PLAYING') {
                        playGoalSound();
                        celebrateGoal(bz < 0 ? 'ARG' : 'ESP', ball.lastTouchPlayer || ball.carrier);
                        return;
                    }
                } else {
                    // Ball exited across defending goal line outside of the goal mouth
                    if (matchState.phase === 'PLAYING' && matchState.goalTimer <= 0 && ball.cooldown <= 0) {
                        const cornerSignX = Math.sign(bx) || 1;
                        if (bz < -hl) {
                            // Ball crossed Spain's defending endline
                            if (ball.lastTouchTeam === 'ARG') {
                                // Attacking team (ARG) touched last -> GOAL KICK for Spain
                                startSetPiece('GOAL_KICK', 'ESP', 0, -34.5);
                            } else {
                                // Defending team (ESP) touched last -> CORNER KICK for Argentina
                                startSetPiece('CORNER_KICK', 'ARG', cornerSignX * (hw - 0.7), -hl + 0.7);
                            }
                            return;
                        } else {
                            // Ball crossed Argentina's defending endline
                            if (ball.lastTouchTeam === 'ESP') {
                                // Attacking team (ESP) touched last -> GOAL KICK for Argentina
                                startSetPiece('GOAL_KICK', 'ARG', 0, 34.5);
                            } else {
                                // Defending team (ARG) touched last -> CORNER KICK for Spain
                                startSetPiece('CORNER_KICK', 'ESP', cornerSignX * (hw - 0.7), hl - 0.7);
                            }
                            return;
                        }
                    } else if (matchState.phase !== 'PLAYING') {
                        ball.mesh.position.z = Math.sign(bz) * hl;
                        ball.vz = -ball.vz * 0.5;
                    }
                }
            } else if (Math.abs(bx) > hw) {
                // Ball exited across touchline (sideline) -> THROW-IN
                if (matchState.phase === 'PLAYING' && matchState.goalTimer <= 0 && ball.cooldown <= 0) {
                    const awardTeam = (ball.lastTouchTeam === 'ARG') ? 'ESP' : 'ARG';
                    const exitX = Math.sign(bx) * hw;
                    const exitZ = THREE.MathUtils.clamp(bz, -hl + 2.5, hl - 2.5);
                    startSetPiece('THROW_IN', awardTeam, exitX, exitZ);
                    return;
                } else if (matchState.phase !== 'PLAYING') {
                    ball.mesh.position.x = Math.sign(bx) * hw;
                    ball.vx = -ball.vx * 0.5;
                }
            }

            // Ball bouncing off goal posts with metallic clang
            goalPostColliders.forEach(gp => {
                const bdx = bx - gp.x;
                const bdz = bz - gp.z;
                const minD = 0.42 + gp.r;
                const dSq = bdx * bdx + bdz * bdz;
                if (dSq < minD * minD && ball.mesh.position.y < 3.5) {
                    const d = Math.max(0.001, Math.sqrt(dSq));
                    ball.mesh.position.x = gp.x + (bdx / d) * minD;
                    ball.mesh.position.z = gp.z + (bdz / d) * minD;
                    ball.vx = (bdx / d) * Math.max(14, Math.abs(ball.vx));
                    ball.vz = (bdz / d) * Math.max(14, Math.abs(ball.vz));
                    playPostClangSound();
                    setTicker('CLANG! Ball rattles off the goal post!');
                }
            });

            // ORIGINAL BALANCED TACTICAL FORMATION BEHAVIOR (No crowding: each team has 1 closest ball chaser; others hold shape)
            let cArg = null, dArg = 999;
            let cEsp = null, dEsp = 999;
            players.forEach(p => {
                if (p.role === 'GK') return;
                const d = Math.hypot(p.x - bx, p.z - bz);
                if (p.team === 'ARG' && d < dArg) { dArg = d; cArg = p; }
                if (p.team === 'ESP' && d < dEsp) { dEsp = d; cEsp = p; }
            });

            players.forEach(p => {
                if (celebrationState.active) {
                    // During goal celebration, regular match AI is suspended
                    return;
                }

                // If kicking or passing, pause in place at that spot!
                if (p.kickTimer > 0) {
                    p.vx = 0;
                    p.vz = 0;
                    return;
                }

                // ORGANIC INDIVIDUAL WANDERING & TACTICAL DRIFT (Softly following formation with natural randomness)
                if (p.wanderTimer !== undefined) {
                    p.wanderTimer -= dt;
                    if (p.wanderTimer <= 0) {
                        p.wanderTimer = 2.4 + Math.random() * 2.8;
                        const wanderRangeX = (Math.abs(p.homeX) > 10) ? 4.2 : 3.0;
                        const wanderRangeZ = (p.role === 'FWD') ? 4.5 : (p.role === 'MID' ? 3.8 : 2.8);
                        p.wanderTargetX = (Math.random() - 0.5) * wanderRangeX * 2;
                        p.wanderTargetZ = (Math.random() - 0.5) * wanderRangeZ * 2;
                    }
                    p.wanderOffsetX += (p.wanderTargetX - p.wanderOffsetX) * Math.min(1.0, dt * 1.6);
                    p.wanderOffsetZ += (p.wanderTargetZ - p.wanderOffsetZ) * Math.min(1.0, dt * 1.6);
                }

                let tx = p.homeX;
                let tz = p.homeZ;

                if (p.role === 'GK') {
                    const tx = THREE.MathUtils.clamp(bx * 0.38, -4.0, 4.0);
                    const tz = p.homeZ;
                    const gkDx = tx - p.x;
                    const gkDist = Math.abs(gkDx);
                    let gkTargetSpd = 0;
                    if (gkDist > 0.8) gkTargetSpd = p.speed;
                    else if (gkDist > 0.08) gkTargetSpd = p.speed * (gkDist / 0.8);
                    const desiredGkVx = (gkDist > 0.02) ? Math.sign(gkDx) * gkTargetSpd : 0;
                    p.vx += (desiredGkVx - p.vx) * Math.min(1.0, 9.0 * dt);
                    p.vz = 0;
                    p.x += p.vx * dt;

                    if (Math.hypot(p.x - bx, p.z - bz) < 2.5 && ball.cooldown <= 0) {
                        const clearDir = (p.team === 'ARG') ? -1 : 1;
                        const spreadX = (Math.random() - 0.5) * 16;
                        ball.vx = spreadX;
                        ball.vz = clearDir * (15 + Math.random() * 10);
                        ball.vy = 6.2 + Math.random() * 2.5;
                        ball.cooldown = 0.42;
                        ball.carrier = null;
                        ball.lastTouchTeam = p.team;
                        ball.lastTouchPlayer = p;
                        p.diveTimer = 0.55;
                        p.diveDir = Math.sign(bx - p.x) || 1;
                        p.kickTimer = 0.52;
                        p.kickDuration = 0.52;
                        p.kickType = 'shot';
                        p.kickTargetAngle = Math.atan2(spreadX, clearDir * 20);
                        p.vx = 0; p.vz = 0;
                        playSaveSound();
                        setTicker(`Save by #${p.num} ${p.shortName} (${p.team})!`);
                    }
                } else if (p === cArg || p === cEsp) {
                    // Active ball chaser (only 1 player per team moves to the ball)
                    tx = bx;
                    tz = bz;
                } else {
                    // STRETCHED FORMATION WITH ORGANIC RANDOM DRIFT (Wide pitch coverage, no crowding)
                    let pushZ = 0;
                    if (p.team === 'ARG') {
                        // Argentina defends +Z (goal at +39), attacks -Z (Spain goal at -39)
                        const atkProgress = THREE.MathUtils.clamp((18 - bz) / 46.0, 0, 1);
                        const defDrop = THREE.MathUtils.clamp((bz - 4) / 32.0, 0, 1);
                        if (p.role === 'FWD') {
                            pushZ = -atkProgress * 28.5 + defDrop * 5.5;
                        } else if (p.role === 'MID') {
                            pushZ = -atkProgress * 25.0 + defDrop * 7.5;
                        } else if (p.role === 'DEF') {
                            pushZ = -atkProgress * 22.5 + defDrop * 7.5;
                        }
                    } else {
                        // Spain defends -Z (goal at -39), attacks +Z (Argentina goal at +39)
                        const atkProgress = THREE.MathUtils.clamp((bz - (-18)) / 46.0, 0, 1);
                        const defDrop = THREE.MathUtils.clamp((-bz - 4) / 32.0, 0, 1);
                        if (p.role === 'FWD') {
                            pushZ = atkProgress * 28.5 - defDrop * 5.5;
                        } else if (p.role === 'MID') {
                            pushZ = atkProgress * 25.0 - defDrop * 7.5;
                        } else if (p.role === 'DEF') {
                            pushZ = atkProgress * 22.5 - defDrop * 7.5;
                        }
                    }

                    // Stretched lateral width with organic drift
                    const shiftX = (bx / hw) * 4.5;
                    const wX = (p.wanderOffsetX || 0);
                    const wZ = (p.wanderOffsetZ || 0);
                    tx = THREE.MathUtils.clamp(p.homeX + shiftX + wX, -hw + 2.4, hw - 2.4);
                    tz = THREE.MathUtils.clamp(p.homeZ + pushZ + wZ, -hl + 2.8, hl - 2.8);

                    // Soft teammate anti-crowding repulsion (guarantees players maintain clear spacing)
                    players.forEach(other => {
                        if (other !== p && other.team === p.team && other.role !== 'GK') {
                            const odx = tx - other.x;
                            const odz = tz - other.z;
                            const distSq = odx * odx + odz * odz;
                            const minDist = 6.2;
                            if (distSq < minDist * minDist && distSq > 0.04) {
                                const od = Math.sqrt(distSq);
                                const force = ((minDist - od) / minDist) * 2.2;
                                tx += (odx / od) * force;
                                tz += (odz / od) * force;
                            }
                        }
                    });
                    tx = THREE.MathUtils.clamp(tx, -hw + 2.2, hw - 2.2);
                    tz = THREE.MathUtils.clamp(tz, -hl + 2.6, hl - 2.6);
                }

                const dx = tx - p.x;
                const dz = tz - p.z;
                const dist = Math.hypot(dx, dz);

                // Smooth physical deceleration / arrival curve (no sudden speed snapping)
                let targetSpd = 0;
                if (dist > 1.6) {
                    targetSpd = p.speed;
                } else if (dist > 0.12) {
                    const norm = (dist - 0.12) / 1.48;
                    targetSpd = p.speed * norm * norm; // Quadratic ease-out deceleration
                } else {
                    targetSpd = 0;
                }

                const desiredVx = (dist > 0.04) ? (dx / dist) * targetSpd : 0;
                const desiredVz = (dist > 0.04) ? (dz / dist) * targetSpd : 0;
                const accel = (targetSpd > 0.2) ? 8.5 : 6.5;
                p.vx += (desiredVx - p.vx) * Math.min(1.0, accel * dt);
                p.vz += (desiredVz - p.vz) * Math.min(1.0, accel * dt);
                p.x += p.vx * dt;
                p.z += p.vz * dt;

                // Interception / Kicking with foot strike animation and pause
                if (Math.hypot(bx - p.x, bz - p.z) < 1.45 && ball.mesh.position.y < 1.8 && ball.cooldown <= 0 && matchState.goalTimer <= 0) {
                    ball.cooldown = 0.35;
                    ball.carrier = p;
                    ball.lastTouchTeam = p.team;
                    ball.lastTouchPlayer = p;

                    const oppGoalZ = (p.team === 'ARG') ? -hl : hl;
                    const distGoal = Math.abs(oppGoalZ - p.z);

                    if (distGoal < 24 && Math.random() < 0.65) {
                        const aimX = (Math.random() < 0.72) ? (Math.random() - 0.5) * 7.2 : (Math.random() - 0.5) * 15.0;
                        const sdx = aimX - p.x;
                        const sdz = oppGoalZ - p.z;
                        const sl = Math.hypot(sdx, sdz);

                        p.kickDuration = 0.62;
                        p.kickTimer = 0.62;
                        p.kickType = 'shot';
                        p.kickTargetAngle = Math.atan2(sdx, sdz);
                        p.root.rotation.y = p.kickTargetAngle;
                        p.vx = 0; p.vz = 0; // Pause at the place!

                        p.pendingKick = {
                            isShot: true,
                            vx: (sdx / sl) * 31,
                            vz: (sdz / sl) * 31,
                            vy: 4.8 + Math.random() * 3.2,
                            text: `#${p.num} ${p.shortName} (${p.team}) blasts a shot toward goal!`
                        };
                    } else {
                        // Varied, realistic passing options (through balls, wide switches, combination passes)
                        const mates = players.filter(m => m.team === p.team && m !== p && m.role !== 'GK');
                        let targetMate = null;
                        const roll = Math.random();
                        if (roll < 0.45) {
                            // Forward attacking pass to teammate in front
                            const fwdMates = mates.filter(m => (p.team === 'ARG' ? m.z < p.z : m.z > p.z));
                            if (fwdMates.length > 0) targetMate = fwdMates[Math.floor(Math.random() * fwdMates.length)];
                        } else if (roll < 0.75) {
                            // Wide switch to opposite flank winger/fullback
                            const wideMates = mates.filter(m => Math.sign(m.x) !== Math.sign(p.x) && Math.abs(m.x) > 9);
                            if (wideMates.length > 0) targetMate = wideMates[Math.floor(Math.random() * wideMates.length)];
                        }
                        if (!targetMate) {
                            targetMate = mates[Math.floor(Math.random() * mates.length)];
                        }

                        const pdx = targetMate.x - p.x;
                        const pdz = targetMate.z - p.z;
                        const pl = Math.max(1, Math.hypot(pdx, pdz));
                        const spd = Math.min(26, 13 + pl * 0.45);
                        const varX = (Math.random() - 0.5) * 2.2;
                        const varZ = (Math.random() - 0.5) * 2.2;

                        p.kickDuration = 0.56;
                        p.kickTimer = 0.56;
                        p.kickType = 'pass';
                        p.kickTargetAngle = Math.atan2(pdx, pdz);
                        p.root.rotation.y = p.kickTargetAngle;
                        p.vx = 0; p.vz = 0; // Pause at the place!

                        p.pendingKick = {
                            isShot: false,
                            vx: ((pdx + varX) / pl) * spd,
                            vz: ((pdz + varZ) / pl) * spd,
                            vy: (pl > 18) ? 5.2 : 1.4,
                            text: `#${p.num} ${p.shortName} passes to #${targetMate.num} ${targetMate.shortName}`
                        };
                    }
                }
            });

            const rtx = THREE.MathUtils.clamp(bx * 0.45 + 4, -15, 15);
            const rtz = THREE.MathUtils.clamp(bz * 0.45, -20, 20);
            const rdx = rtx - referee.x, rdz = rtz - referee.z;
            const rd = Math.hypot(rdx, rdz);
            let rTargetSpd = 0;
            if (rd > 1.8) rTargetSpd = referee.speed;
            else if (rd > 0.2) rTargetSpd = referee.speed * ((rd - 0.2) / 1.6);
            const desiredRvx = (rd > 0.05) ? (rdx / rd) * rTargetSpd : 0;
            const desiredRvz = (rd > 0.05) ? (rdz / rd) * rTargetSpd : 0;
            referee.vx += (desiredRvx - referee.vx) * Math.min(1.0, 7.5 * dt);
            referee.vz += (desiredRvz - referee.vz) * Math.min(1.0, 7.5 * dt);
            referee.x += referee.vx * dt;
            referee.z += referee.vz * dt;

            solveCharacterCollisions();

            // Scorer Victory Stunt Simulation & Teammates Mob
            if (celebrationState.active && celebrationState.scorer) {
                const s = celebrationState.scorer;
                celebrationState.timer += dt;
                const ct = celebrationState.timer;

                // Move scorer running along field
                const tdx = celebrationState.targetX - s.x;
                const tdz = celebrationState.targetZ - s.z;
                const tdist = Math.hypot(tdx, tdz);
                if (tdist > 0.4) {
                    const runSpd = (ct < 1.3) ? 14.5 : ((ct < 3.5) ? 9.5 : 3.5);
                    s.vx = (tdx / tdist) * runSpd;
                    s.vz = (tdz / tdist) * runSpd;
                    s.x += s.vx * dt;
                    s.z += s.vz * dt;
                    s.root.rotation.y = Math.atan2(s.vx, s.vz);
                } else {
                    s.vx *= 0.5;
                    s.vz *= 0.5;
                }
                s.root.position.set(s.x, 0, s.z);

                // Reset pivots before applying current stunt
                s.bodyPivot.rotation.set(0, 0, 0);
                s.bodyPivot.position.set(0, 0, 0);
                s.leftArm.rotation.set(0, 0, 0);
                s.rightArm.rotation.set(0, 0, 0);
                s.headGroup.rotation.set(0, 0, 0);

                if (ct < 1.3) {
                    // STUNT 1: VICTORY SPRINT WITH UPRISING HANDS OVERHEAD
                    const stride = time * 26.0;
                    s.leftLeg.rotation.x  =  Math.sin(stride) * 0.95;
                    s.rightLeg.rotation.x = -Math.sin(stride) * 0.95;

                    const wave = Math.sin(time * 12.0) * 0.25;
                    s.leftArm.rotation.x  = -2.75 + wave;
                    s.rightArm.rotation.x = -2.75 - wave;
                    s.leftArm.rotation.z  = -0.45; // V-shape triumph
                    s.rightArm.rotation.z =  0.45;
                    s.bodyPivot.position.y = Math.abs(Math.cos(stride)) * 0.25;
                    s.headGroup.rotation.x = -0.35; // looking up at sky/fans

                } else if (ct < 2.4) {
                    // STUNT 2: ACROBATIC HIGH LEAP & FULL 360° BACKFLIP
                    const progress = (ct - 1.3) / 1.1; // 0 to 1
                    const jumpY = Math.sin(progress * Math.PI) * 3.0; // high jump
                    s.bodyPivot.position.y = jumpY;
                    s.bodyPivot.rotation.x = progress * Math.PI * 2; // full 360° flip

                    if (progress > 0.15 && progress < 0.85) {
                        // Tucked mid-air flip pose
                        s.leftLeg.rotation.x  = -1.3;
                        s.rightLeg.rotation.x = -1.3;
                        s.leftArm.rotation.x  = -1.6;
                        s.rightArm.rotation.x = -1.6;
                    } else {
                        // Extension & landing
                        s.leftLeg.rotation.x  = 0;
                        s.rightLeg.rotation.x = 0;
                        s.leftArm.rotation.x  = -2.5;
                        s.rightArm.rotation.x = -2.5;
                        s.leftArm.rotation.z  = -0.5;
                        s.rightArm.rotation.z =  0.5;
                    }

                } else if (ct < 3.5) {
                    // STUNT 3: HIGH LEAP & 360° TORNADO SPIN TWIST
                    const progress = (ct - 2.4) / 1.1; // 0 to 1
                    const jumpY = Math.sin(progress * Math.PI) * 2.2;
                    s.bodyPivot.position.y = jumpY;
                    s.bodyPivot.rotation.y = progress * Math.PI * 2; // full horizontal spin

                    // Airplane wings celebratory spin pose
                    s.leftArm.rotation.x  = 0;
                    s.rightArm.rotation.x = 0;
                    s.leftArm.rotation.z  = -1.45;
                    s.rightArm.rotation.z =  1.45;

                    s.leftLeg.rotation.x  = Math.sin(time * 16.0) * 0.4;
                    s.rightLeg.rotation.x = -Math.sin(time * 16.0) * 0.4;

                } else {
                    // STUNT 4: EPIC TURF KNEE SLIDE & BOTH HANDS SKY POINT
                    s.bodyPivot.position.y = -0.25;
                    s.bodyPivot.rotation.x = -0.45; // leaned proudly back

                    s.leftLeg.rotation.x  = -1.15;
                    s.rightLeg.rotation.x = -1.15;

                    const pump = Math.sin(time * 10.0) * 0.15;
                    s.leftArm.rotation.x  = -2.65 + pump;
                    s.rightArm.rotation.x = -2.65 - pump;
                    s.leftArm.rotation.z  = -0.30;
                    s.rightArm.rotation.z =  0.30;
                    s.headGroup.rotation.x = -0.40; // chin up pointing to heavens
                }

                // Teammates mob and celebrate around scorer
                players.forEach(p => {
                    if (p === s || p.role === 'GK') return;
                    if (p.team === celebrationState.team) {
                        const mdx = s.x - p.x;
                        const mdz = s.z - p.z;
                        const mdist = Math.hypot(mdx, mdz);
                        if (mdist > 3.0) {
                            p.vx = (mdx / mdist) * p.speed * 1.15;
                            p.vz = (mdz / mdist) * p.speed * 1.15;
                            p.x += p.vx * dt;
                            p.z += p.vz * dt;
                            p.root.rotation.y = Math.atan2(p.vx, p.vz);
                            const stride = time * 20.0 + p.phase;
                            p.leftLeg.rotation.x  =  Math.sin(stride) * 0.75;
                            p.rightLeg.rotation.x = -Math.sin(stride) * 0.75;
                            p.leftArm.rotation.x  = -2.3;
                            p.rightArm.rotation.x = -2.3;
                            p.bodyPivot.position.y = Math.abs(Math.cos(stride)) * 0.18;
                        } else {
                            p.vx *= 0.5; p.vz *= 0.5;
                            p.root.rotation.y = Math.atan2(s.x - p.x, s.z - p.z);
                            p.bodyPivot.position.y = Math.abs(Math.sin(time * 9.0 + p.phase)) * 0.55;
                            p.leftArm.rotation.x  = -2.5 + Math.sin(time * 10.0 + p.phase) * 0.3;
                            p.rightArm.rotation.x = -2.5 - Math.cos(time * 10.0 + p.phase) * 0.3;
                            p.leftArm.rotation.z  = -0.35;
                            p.rightArm.rotation.z =  0.35;
                            p.leftLeg.rotation.x  = 0;
                            p.rightLeg.rotation.x = 0;
                        }
                        p.root.position.set(p.x, 0, p.z);
                    } else {
                        // Conceding team slows and stops
                        p.vx *= 0.85; p.vz *= 0.85;
                        p.root.position.set(p.x, 0, p.z);
                        p.headGroup.rotation.x = 0.25; // looking down
                    }
                });
            }

                        allChars.forEach(p => {
                if (celebrationState.active && (p === celebrationState.scorer || (p.team === celebrationState.team && p.role !== 'GK'))) {
                    // Handled by celebration choreography above
                    return;
                }
                if (setPieceState.active && setPieceState.type === 'THROW_IN' && p === setPieceState.taker && setPieceState.timer > 0.4) {
                    p.root.position.set(p.x, 0, p.z);
                    p.root.rotation.y = (p.x > 0) ? -Math.PI / 2 : Math.PI / 2;
                    p.leftArm.rotation.x = -2.45 + Math.sin(time * 4) * 0.1;
                    p.rightArm.rotation.x = -2.45 + Math.sin(time * 4) * 0.1;
                    p.leftArm.rotation.z = -0.15;
                    p.rightArm.rotation.z = 0.15;
                    p.leftLeg.rotation.x = 0;
                    p.rightLeg.rotation.x = 0;
                    p.bodyPivot.rotation.x = 0.14;
                    p.bodyPivot.position.y = 0;
                    return;
                }
                p.root.position.set(p.x, 0, p.z);
                const currentSpd = Math.hypot(p.vx, p.vz);
                // Continuous exponentially smoothed speed (zero jitter / popping at edges)
                p.smoothSpeed = THREE.MathUtils.lerp(p.smoothSpeed || 0, currentSpd, Math.min(1.0, 9.0 * dt));

                // Continuous walk/run weight using smoothstep hermite interpolation from 0.25 to 3.2 m/s
                const walkWeight = THREE.MathUtils.smoothstep(p.smoothSpeed, 0.25, 3.2);

                // Smooth body orientation (shortest-arc interpolation, smoothly turns between heading and ball)
                if (p.kickTimer <= 0) {
                    const desiredHeading = (walkWeight > 0.18)
                        ? Math.atan2(p.vx, p.vz)
                        : Math.atan2(bx - p.x, bz - p.z);
                    let diffAngle = desiredHeading - p.root.rotation.y;
                    diffAngle = Math.atan2(Math.sin(diffAngle), Math.cos(diffAngle));
                    p.root.rotation.y += diffAngle * Math.min(1.0, 8.5 * dt);
                }

                // Dynamic head tracking: player's head looks toward the action and camera
                const ballAngle = Math.atan2(bx - p.x, bz - p.z);
                let headAngle = ballAngle - p.root.rotation.y;
                headAngle = Math.atan2(Math.sin(headAngle), Math.cos(headAngle));
                p.headGroup.rotation.y = THREE.MathUtils.clamp(headAngle, -0.65, 0.65);

                if (p.diveTimer > 0) {
                    p.diveTimer -= dt;
                    p.bodyPivot.rotation.z = p.diveDir * 1.15;
                    p.bodyPivot.position.y = 0.25;
                } else if (p.kickTimer <= 0) {
                    p.bodyPivot.rotation.z = 0;
                    if (walkWeight > 0.01) {
                        // Continuous stride frequency & amplitude scaled smoothly by walkWeight
                        const strideRate = 8.0 + walkWeight * 8.5;
                        p.stridePhase = (p.stridePhase || 0) + strideRate * dt;
                        const s = Math.sin(p.stridePhase + p.phase);
                        p.leftLeg.rotation.x  =  s * 0.78 * walkWeight;
                        p.rightLeg.rotation.x = -s * 0.78 * walkWeight;
                        p.leftArm.rotation.x  = -s * 0.60 * walkWeight;
                        p.rightArm.rotation.x =  s * 0.60 * walkWeight;
                        p.bodyPivot.position.y = Math.abs(Math.cos(p.stridePhase + p.phase)) * 0.18 * walkWeight;
                    } else {
                        // Smoothly ease limbs to natural standing ready stance
                        p.leftLeg.rotation.x *= 0.75;
                        p.rightLeg.rotation.x *= 0.75;
                        p.leftArm.rotation.x *= 0.75;
                        p.rightArm.rotation.x *= 0.75;
                        p.bodyPivot.position.y *= 0.75;
                        if (Math.abs(p.leftLeg.rotation.x) < 0.005) {
                            p.leftLeg.rotation.x = 0;
                            p.rightLeg.rotation.x = 0;
                            p.leftArm.rotation.x = 0;
                            p.rightArm.rotation.x = 0;
                            p.bodyPivot.position.y = 0;
                        }
                    }
                }

                // DEDICATED SOCCER KICK & PASS ANIMATION (Windup, Foot Strike & Ball Launch, Follow-Through Pause, Recovery)
                if (p.kickTimer > 0) {
                    p.kickTimer -= dt;
                    const dur = p.kickDuration || 0.60;
                    const progress = THREE.MathUtils.clamp(1 - (p.kickTimer / dur), 0, 1);
                    const isShot = (p.kickType === 'shot');

                    // Player pauses at the place while kicking: zero velocity and maintain position
                    p.vx = 0;
                    p.vz = 0;
                    p.root.position.set(p.x, 0, p.z);
                    if (p.kickTargetAngle !== undefined) {
                        p.root.rotation.y = p.kickTargetAngle;
                    }

                    // BALL IMPACT & LAUNCH: Ball launches when kicking foot contacts ball (progress >= 0.32)
                    if (progress >= 0.32 && p.pendingKick) {
                        const kAngle = p.kickTargetAngle || p.root.rotation.y;
                        ball.mesh.position.set(p.x + Math.sin(kAngle) * 0.82, 0.42, p.z + Math.cos(kAngle) * 0.82);
                        ball.vx = p.pendingKick.vx;
                        ball.vz = p.pendingKick.vz;
                        ball.vy = p.pendingKick.vy;
                        ball.cooldown = 0.36;
                        ball.carrier = null;
                        ball.lastTouchTeam = p.team;
                        ball.lastTouchPlayer = p;
                        playKickSound(isShot ? 'shot' : 'pass');
                        setTicker(p.pendingKick.text);
                        p.pendingKick = null;
                    }

                    if (progress < 0.28) {
                        // PHASE 1: Windup & plant foot (drawing kicking foot back, leaning over plant foot)
                        const windupP = progress / 0.28;
                        p.rightLeg.rotation.x = windupP * (isShot ? 1.45 : 1.15);
                        p.rightLeg.rotation.z = 0.15;
                        p.leftLeg.rotation.x = 0.12; // Plant foot solidly on ground

                        p.bodyPivot.rotation.x = -windupP * (isShot ? 0.28 : 0.16);
                        p.bodyPivot.rotation.z = -windupP * 0.18;
                        p.bodyPivot.position.y = 0;

                        p.leftArm.rotation.x = -windupP * 0.90;
                        p.leftArm.rotation.z = windupP * 0.35;
                        p.rightArm.rotation.x = windupP * 0.70;
                        p.rightArm.rotation.z = windupP * 0.45;
                        p.headGroup.rotation.x = 0.22;
                    } else if (progress < 0.50) {
                        // PHASE 2: Explosive foot strike through the ball
                        const strikeP = (progress - 0.28) / 0.22;
                        const strikeAngle = isShot ? -1.62 : -1.30;
                        const startAngle = isShot ? 1.45 : 1.15;

                        const easeStrike = Math.sin(strikeP * Math.PI * 0.5);
                        p.rightLeg.rotation.x = startAngle + (strikeAngle - startAngle) * easeStrike;
                        p.rightLeg.rotation.z = (1 - strikeP) * 0.15;
                        p.leftLeg.rotation.x = (1 - strikeP) * 0.12;

                        p.bodyPivot.rotation.x = -0.15 + 0.40 * strikeP;
                        p.bodyPivot.rotation.z = -0.18 * (1 - strikeP);
                        p.bodyPivot.position.y = Math.sin(strikeP * Math.PI) * (isShot ? 0.24 : 0.10);

                        p.leftArm.rotation.x = -0.90 + strikeP * 1.25;
                        p.leftArm.rotation.z = 0.35 * (1 - strikeP);
                        p.rightArm.rotation.x = 0.70 - strikeP * 1.45;
                        p.rightArm.rotation.z = -0.25 * strikeP;
                        p.headGroup.rotation.x = 0.22 * (1 - strikeP);
                    } else if (progress < 0.82) {
                        // PHASE 3: THE PAUSE / FOLLOW-THROUGH HOLD (Player pauses at the place!)
                        const strikeAngle = isShot ? -1.62 : -1.30;
                        p.rightLeg.rotation.x = strikeAngle; // Kicking foot held extended in air
                        p.rightLeg.rotation.z = 0;
                        p.leftLeg.rotation.x = 0.05; // Plant foot solid
                        p.bodyPivot.rotation.x = 0.25; // Torso leaning forward in follow-through
                        p.bodyPivot.rotation.z = 0;
                        p.bodyPivot.position.y = 0;
                        p.leftArm.rotation.x = 0.35;
                        p.rightArm.rotation.x = -0.75;
                        p.headGroup.rotation.x = -0.12; // Looking downfield at ball flight
                    } else {
                        // PHASE 4: Recovery back to neutral ready stance
                        const recP = (progress - 0.82) / 0.18;
                        const strikeAngle = isShot ? -1.62 : -1.30;
                        p.rightLeg.rotation.x = strikeAngle * (1 - recP);
                        p.rightLeg.rotation.z = 0;
                        p.leftLeg.rotation.x = 0;
                        p.bodyPivot.rotation.set(0, 0, 0);
                        p.bodyPivot.position.y = 0;
                        p.leftArm.rotation.set(0, 0, 0);
                        p.rightArm.rotation.set(0, 0, 0);
                        p.headGroup.rotation.set(0, 0, 0);
                    }
                }
            });

            updateOverlayTags(time);
        }

        // ============================================================================
        // 8. CAMERA RIG & CONTROLS
        // ============================================================================
        function updateCamera(dt) {
            if (viewState.mode === 'ball') {
                const fx = viewState.focusPlayer ? viewState.focusPlayer.x : ball.mesh.position.x * 0.7;
                const fz = viewState.focusPlayer ? viewState.focusPlayer.z : ball.mesh.position.z * 0.7;
                viewState.target.lerp(new THREE.Vector3(fx, 0, fz), Math.min(1, dt * 6));
            } else {
                viewState.target.lerp(viewState.pan, Math.min(1, dt * 6));
            }

            const dist = 180;
            camera.position.set(
                viewState.target.x + dist * Math.cos(viewState.pitch) * Math.sin(viewState.yaw),
                viewState.target.y + dist * Math.sin(viewState.pitch),
                viewState.target.z + dist * Math.cos(viewState.pitch) * Math.cos(viewState.yaw)
            );
            camera.lookAt(viewState.target);
            camera.zoom = viewState.zoom;
            camera.updateProjectionMatrix();
        }

        renderer.domElement.style.touchAction = 'none';

        // Mouse Controls with Inverted Y-Pan Fix & Hover Tooltip
        let dragging = false, rightDrag = false, px = 0, py = 0;
        let clickStartX = 0, clickStartY = 0;

        renderer.domElement.addEventListener('mousedown', e => {
            dragging = true;
            rightDrag = (e.button === 2 || e.shiftKey);
            px = e.clientX; py = e.clientY;
            clickStartX = e.clientX; clickStartY = e.clientY;
        });

        window.addEventListener('mouseup', e => {
            if (dragging && !rightDrag) {
                const moved = Math.hypot(e.clientX - clickStartX, e.clientY - clickStartY);
                // Click player on pitch to follow
                if (moved < 6 && hoveredPlayer) {
                    viewState.focusPlayer = hoveredPlayer;
                    viewState.mode = 'ball';
                    viewState.zoom = 1.75;
                    viewState.showTag = true;
                    const tagBtn = document.getElementById('btn-tag');
                    if (tagBtn) {
                        tagBtn.textContent = 'TAG: ON';
                        tagBtn.classList.add('active');
                    }
                    setTicker(`Following #${hoveredPlayer.num} ${hoveredPlayer.name} (${hoveredPlayer.team})`);
                }
            }
            dragging = false;
        });

        window.addEventListener('mousemove', e => {
            if (!dragging) {
                updateHoverState(e.clientX, e.clientY);
                return;
            }
            const dx = e.clientX - px;
            const dy = e.clientY - py;
            px = e.clientX; py = e.clientY;

            if (rightDrag) {
                const s = 0.11 / viewState.zoom;
                // Corrected vertical pan direction: +dy instead of -dy
                viewState.pan.x -= (dx * Math.cos(viewState.yaw) + dy * Math.sin(viewState.yaw)) * s;
                viewState.pan.z -= (-dx * Math.sin(viewState.yaw) + dy * Math.cos(viewState.yaw)) * s;
            } else {
                viewState.yaw -= dx * 0.006;
                viewState.pitch = THREE.MathUtils.clamp(viewState.pitch + dy * 0.005, 0.30, 1.35);
            }
        });

        renderer.domElement.addEventListener('mouseleave', () => {
            hoveredPlayer = null;
            if (hoverTagEl) hoverTagEl.classList.add('hidden');
            renderer.domElement.style.cursor = 'default';
        });

        renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
        renderer.domElement.addEventListener('wheel', e => {
            e.preventDefault();
            viewState.zoom = THREE.MathUtils.clamp(viewState.zoom * (e.deltaY > 0 ? 0.92 : 1.08), 0.70, 3.2);
        }, { passive: false });

        // ============================================================================
        // MOBILE TOUCH CONTROLS (Single-Finger Orbit/Tap, Two-Finger Pinch Zoom & Pan)
        // ============================================================================
        let touchMode = null; // 'orbit' | 'pinch_pan'
        let tPos = { x: 0, y: 0 };
        let lastPinchDist = 0;
        let lastTouchCenter = { x: 0, y: 0 };
        let touchStartTime = 0;
        let touchStartPos = { x: 0, y: 0 };

        renderer.domElement.addEventListener('touchstart', e => {
            e.preventDefault();
            if (e.touches.length === 1) {
                touchMode = 'orbit';
                tPos.x = e.touches[0].clientX;
                tPos.y = e.touches[0].clientY;
                touchStartPos.x = tPos.x;
                touchStartPos.y = tPos.y;
                touchStartTime = performance.now();
                updateHoverState(tPos.x, tPos.y);
            } else if (e.touches.length === 2) {
                touchMode = 'pinch_pan';
                const a = e.touches[0];
                const b = e.touches[1];
                lastPinchDist = Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
                lastTouchCenter.x = (a.clientX + b.clientX) * 0.5;
                lastTouchCenter.y = (a.clientY + b.clientY) * 0.5;
                if (hoverTagEl) hoverTagEl.classList.add('hidden');
            }
        }, { passive: false });

        renderer.domElement.addEventListener('touchmove', e => {
            e.preventDefault();
            if (touchMode === 'orbit' && e.touches.length === 1) {
                const cx = e.touches[0].clientX;
                const cy = e.touches[0].clientY;
                const dx = cx - tPos.x;
                const dy = cy - tPos.y;
                tPos.x = cx;
                tPos.y = cy;

                viewState.yaw -= dx * 0.007;
                viewState.pitch = THREE.MathUtils.clamp(viewState.pitch + dy * 0.006, 0.30, 1.35);
            } else if (touchMode === 'pinch_pan' && e.touches.length === 2) {
                const a = e.touches[0];
                const b = e.touches[1];
                const currentDist = Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
                const mx = (a.clientX + b.clientX) * 0.5;
                const my = (a.clientY + b.clientY) * 0.5;

                // Two-Finger Pinch Zoom
                if (lastPinchDist > 5 && currentDist > 5) {
                    const factor = currentDist / lastPinchDist;
                    viewState.zoom = THREE.MathUtils.clamp(viewState.zoom * factor, 0.70, 3.2);
                }
                lastPinchDist = currentDist;

                // Two-Finger Pan (with corrected vertical direction)
                const dx = mx - lastTouchCenter.x;
                const dy = my - lastTouchCenter.y;
                lastTouchCenter.x = mx;
                lastTouchCenter.y = my;

                const s = 0.12 / viewState.zoom;
                viewState.pan.x -= (dx * Math.cos(viewState.yaw) + dy * Math.sin(viewState.yaw)) * s;
                viewState.pan.z -= (-dx * Math.sin(viewState.yaw) + dy * Math.cos(viewState.yaw)) * s;
            }
        }, { passive: false });

        renderer.domElement.addEventListener('touchend', e => {
            if (touchMode === 'orbit' && e.touches.length === 0) {
                const elapsed = performance.now() - touchStartTime;
                const distMoved = Math.hypot(tPos.x - touchStartPos.x, tPos.y - touchStartPos.y);
                // Tap detection (<300ms, moved <14px)
                if (elapsed < 300 && distMoved < 14) {
                    updateHoverState(tPos.x, tPos.y);
                    if (hoveredPlayer) {
                        viewState.focusPlayer = hoveredPlayer;
                        viewState.mode = 'ball';
                        viewState.zoom = 1.75;
                        viewState.showTag = true;
                        const tagBtn = document.getElementById('btn-tag');
                        if (tagBtn) {
                            tagBtn.textContent = 'TAG: ON';
                            tagBtn.classList.add('active');
                        }
                        setTicker(`Following #${hoveredPlayer.num} ${hoveredPlayer.name} (${hoveredPlayer.team})`);
                    }
                }
            }
            if (e.touches.length === 1) {
                touchMode = 'orbit';
                tPos.x = e.touches[0].clientX;
                tPos.y = e.touches[0].clientY;
            } else if (e.touches.length === 0) {
                touchMode = null;
            }
        }, { passive: false });

        const toggleBtn = document.getElementById('btn-toggle-hud');
        const bottomBar = document.getElementById('bottom-hud-bar');
        const toggleIcon = document.getElementById('hud-toggle-icon');
        const toggleText = document.getElementById('hud-toggle-text');
        let hudCollapsed = false;
        if (toggleBtn && bottomBar) {
            toggleBtn.onclick = () => {
                hudCollapsed = !hudCollapsed;
                bottomBar.classList.toggle('hidden', hudCollapsed);
                if (toggleIcon) toggleIcon.textContent = hudCollapsed ? '▲' : '▼';
                if (toggleText) toggleText.textContent = hudCollapsed ? 'CONTROLS' : 'HIDE';
            };
        }

        document.getElementById('btn-atk-arg').onclick = () => triggerAttack('ARG');
        document.getElementById('btn-atk-esp').onclick = () => triggerAttack('ESP');
        const bGoalArg = document.getElementById('btn-goal-arg');
        if (bGoalArg) bGoalArg.onclick = () => celebrateGoal('ARG');
        const bGoalEsp = document.getElementById('btn-goal-esp');
        if (bGoalEsp) bGoalEsp.onclick = () => celebrateGoal('ESP');

        const bCorner = document.getElementById('btn-corner');
        if (bCorner) bCorner.onclick = () => triggerSetPiece('CORNER_KICK', Math.random() < 0.5 ? 'ARG' : 'ESP');
        const bThrow = document.getElementById('btn-throw');
        if (bThrow) bThrow.onclick = () => triggerSetPiece('THROW_IN', Math.random() < 0.5 ? 'ARG' : 'ESP');
        const bGoalKick = document.getElementById('btn-goalkick');
        if (bGoalKick) bGoalKick.onclick = () => triggerSetPiece('GOAL_KICK', Math.random() < 0.5 ? 'ARG' : 'ESP');
        document.getElementById('btn-wave').onclick = () => {
            matchState.waveTimer = 4.5;
            playCheerWaveSound();
            setTicker('Stadium crowd cheering wave in full swing!');
        };

        const drawer = document.getElementById('squad-drawer');
        document.getElementById('btn-squads').onclick = () => {
            drawer.classList.toggle('hidden');
            drawer.classList.toggle('flex');
        };
        document.getElementById('btn-close-squads').onclick = () => {
            drawer.classList.add('hidden');
            drawer.classList.remove('flex');
        };

        document.getElementById('cam-ref').onclick = () => {
            viewState.mode = 'ref';
            viewState.focusPlayer = null;
            viewState.yaw = Math.PI * 0.25;
            viewState.pitch = 0.575;
            viewState.zoom = 1.02;
            viewState.pan.set(-2.2, -0.6, -1.2);
            document.getElementById('cam-ref').classList.add('active');
            document.getElementById('cam-ball').classList.remove('active');
        };

        document.getElementById('cam-ball').onclick = () => {
            viewState.mode = 'ball';
            viewState.zoom = 1.65;
            document.getElementById('cam-ball').classList.add('active');
            document.getElementById('cam-ref').classList.remove('active');
        };

        function setPixelMode(btnId, scale) {
            ['px-125', 'px-100', 'px-165'].forEach(id => document.getElementById(id).classList.toggle('active', id === btnId));
            viewState.pixelScale = scale;
            updateCanvasSize();
        }
        document.getElementById('px-125').onclick = () => setPixelMode('px-125', 1.25);
        document.getElementById('px-100').onclick = () => setPixelMode('px-100', 1.0);
        document.getElementById('px-165').onclick = () => setPixelMode('px-165', 1.65);

        document.getElementById('btn-gi').onclick = (e) => {
            viewState.giEnabled = !viewState.giEnabled;
            giLights.forEach(l => { l.visible = viewState.giEnabled; });
            renderer.toneMappingExposure = viewState.giEnabled ? 1.0 : 0.82;
            e.currentTarget.textContent = `GI: ${viewState.giEnabled ? 'HIGH' : 'OFF'}`;
            e.currentTarget.classList.toggle('active', viewState.giEnabled);
        };

        document.getElementById('btn-tag').onclick = (e) => {
            viewState.showTag = !viewState.showTag;
            e.currentTarget.textContent = `TAG: ${viewState.showTag ? 'ON' : 'OFF'}`;
            e.currentTarget.classList.toggle('active', viewState.showTag);
        };

        const bAudio = document.getElementById('btn-audio');
        if (bAudio) {
            bAudio.onclick = (e) => {
                isAudioMuted = !isAudioMuted;
                toggleMasterAudio(isAudioMuted);
                e.currentTarget.textContent = isAudioMuted ? '🔇 MUTE' : '🔊 SOUND';
                e.currentTarget.classList.toggle('active', !isAudioMuted);
            };
        }

        // ============================================================================
        // 9. ANIMATION LOOP & LIVE TIME TICKING UP FROM 00:00
        // ============================================================================
        const clock = new THREE.Clock();
        let prevSec = Math.floor(matchState.seconds);

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            const elapsed = clock.getElapsedTime();

            if (matchState.phase === 'PLAYING' || matchState.phase === 'SET_PIECE') {
                matchState.seconds += dt;
                if (Math.floor(matchState.seconds) !== prevSec) {
                    prevSec = Math.floor(matchState.seconds);
                    redrawScoreboard();
                    const m = Math.floor(matchState.seconds / 60);
                    const s = Math.floor(matchState.seconds % 60);
                    const cStr = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                    if (matchState.goalTimer <= 0) {
                        setTicker(`${cStr} | ARGENTINA ${matchState.argScore} - ${matchState.espScore} SPAIN`);
                    }
                }
            }

            stepMatchSimulation(dt, elapsed);
            animateCheeringCrowd(elapsed);
            updateCelebration(dt, elapsed);
            updateCamera(dt);

            renderer.render(scene, camera);
        }
        // Initialize game in READY_KICKOFF phase: everyone in position waiting for kickoff whistle
        showKickoffBanner('📢 2026 WORLD CUP FINAL', 'TEAMS IN POSITION • READY FOR KICK OFF');
        setTicker('00:00 | Teams in position. Ready for Kick Off...');

        animate();
        if (window.location.search.includes('celebrate=arg')) {
            setTimeout(() => { celebrateGoal('ARG'); }, 400);
        } else if (window.location.search.includes('celebrate=esp')) {
            setTimeout(() => { celebrateGoal('ESP'); }, 400);
        }

    };

    </script>
