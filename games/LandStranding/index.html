const __mod_noise = (() => {

/**
 * Deterministic seeded PRNG, hashing, 2D/3D gradient/value noise,
 * FBM, domain-warped FBM, ridged multifractal, and Worley cellular noise.
 */

const TAU = Math.PI * 2;

function clamp(v, lo, hi) {
  return v < lo ? lo : v > hi ? hi : v;
}

function mix(a, b, t) {
  return a + (b - a) * t;
}

function smoothstep(edge0, edge1, x) {
  const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
  return t * t * (3 - 2 * t);
}

function smootherstep(edge0, edge1, x) {
  const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
  return t * t * t * (t * (t * 6 - 15) + 10);
}

function seedFromString(str) {
  let h = 2166136261 >>> 0;
  const s = String(str || 'ICELAND-01');
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function mulberry32(seed) {
  let a = seed >>> 0;
  return function next() {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hash2i(ix, iz, seed = 0) {
  let h = Math.imul(ix | 0, 374761393) ^ Math.imul(iz | 0, 668265263) ^ Math.imul(seed | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}

function hash3i(ix, iy, iz, seed = 0) {
  let h =
    Math.imul(ix | 0, 374761393) ^
    Math.imul(iy | 0, 668265263) ^
    Math.imul(iz | 0, 2147483647) ^
    Math.imul(seed | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}

function hash2(x, z, seed = 0) {
  return hash2i(Math.floor(x * 1000.37), Math.floor(z * 1000.73), seed);
}

function valueNoise2(x, z, seed = 0) {
  const ix = Math.floor(x);
  const iz = Math.floor(z);
  const fx = x - ix;
  const fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx);
  const uz = fz * fz * (3 - 2 * fz);

  const a = hash2i(ix, iz, seed);
  const b = hash2i(ix + 1, iz, seed);
  const c = hash2i(ix, iz + 1, seed);
  const d = hash2i(ix + 1, iz + 1, seed);

  return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz;
}

function fbm2(x, z, octaves = 5, seed = 0, lacunarity = 2.03, gain = 0.5) {
  let sum = 0;
  let amp = 0.5;
  let norm = 0;
  let px = x;
  let pz = z;
  for (let i = 0; i < octaves; i++) {
    sum += amp * valueNoise2(px, pz, seed + i * 101);
    norm += amp;
    // Domain rotation reduces axial grid artifacts
    const nx = px * 0.8 - pz * 0.6;
    const nz = px * 0.6 + pz * 0.8;
    px = nx * lacunarity + 17.3;
    pz = nz * lacunarity - 11.7;
    amp *= gain;
  }
  return sum / norm;
}

function ridged2(x, z, octaves = 5, seed = 0, lacunarity = 2.08, gain = 0.52) {
  let sum = 0;
  let amp = 0.5;
  let norm = 0;
  let px = x;
  let pz = z;
  let weight = 1.0;
  for (let i = 0; i < octaves; i++) {
    const n = 1.0 - Math.abs(valueNoise2(px, pz, seed + i * 137) * 2.0 - 1.0);
    const sig = n * n * weight;
    weight = clamp(sig * 1.65, 0.2, 1.0);
    sum += amp * sig;
    norm += amp;
    const nx = px * 0.8 - pz * 0.6;
    const nz = px * 0.6 + pz * 0.8;
    px = nx * lacunarity - 9.1;
    pz = nz * lacunarity + 21.4;
    amp *= gain;
  }
  return sum / norm;
}

function warpedFbm2(x, z, warpScale = 0.85, octaves = 4, seed = 0) {
  const wx = (fbm2(x, z, 3, seed + 19) - 0.5) * warpScale;
  const wz = (fbm2(x + 5.2, z - 1.3, 3, seed + 53) - 0.5) * warpScale;
  return fbm2(x + wx, z + wz, octaves, seed + 97);
}

/**
 * 2D Worley cellular noise returning { f1, f2, edge } without allocations if out is provided.
 */
function worley2(x, z, seed = 0, out = null) {
  const ix = Math.floor(x);
  const iz = Math.floor(z);
  const fx = x - ix;
  const fz = z - iz;
  let f1 = 8.0;
  let f2 = 8.0;

  for (let dz = -1; dz <= 1; dz++) {
    for (let dx = -1; dx <= 1; dx++) {
      const cx = ix + dx;
      const cz = iz + dz;
      const ox = hash2i(cx, cz, seed + 31);
      const oz = hash2i(cx, cz, seed + 997);
      const vx = dx + ox - fx;
      const vz = dz + oz - fz;
      const d = Math.hypot(vx, vz);
      if (d < f1) {
        f2 = f1;
        f1 = d;
      } else if (d < f2) {
        f2 = d;
      }
    }
  }

  const res = out || { f1: 0, f2: 0, edge: 0 };
  res.f1 = f1;
  res.f2 = f2;
  res.edge = f2 - f1;
  return res;
}

/** Minimum distance from point (px, pz) to segment (ax, az)-(bx, bz), plus segment t in [0,1]. */
function distToSegment2D(px, pz, ax, az, bx, bz, out = null) {
  const abx = bx - ax;
  const abz = bz - az;
  const apx = px - ax;
  const apz = pz - az;
  const lenSq = abx * abx + abz * abz;
  const t = lenSq > 1e-6 ? clamp((apx * abx + apz * abz) / lenSq, 0, 1) : 0;
  const cx = ax + abx * t;
  const cz = az + abz * t;
  const dx = px - cx;
  const dz = pz - cz;
  const dist = Math.hypot(dx, dz);
  if (out) {
    out.dist = dist;
    out.t = t;
    out.cx = cx;
    out.cz = cz;
    out.dx = dx;
    out.dz = dz;
    return out;
  }
  return { dist, t, cx, cz, dx, dz };
}

/** Distance & tangent along a polyline of { x, z } points. */
function distToPolyline2D(px, pz, pts, out = null) {
  let bestDist = 1e9;
  let bestTx = 0;
  let bestTz = 1;
  let bestT = 0;
  const seg = _tmpSeg;

  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i];
    const b = pts[i + 1];
    distToSegment2D(px, pz, a.x, a.z, b.x, b.z, seg);
    if (seg.dist < bestDist) {
      bestDist = seg.dist;
      const sx = b.x - a.x;
      const sz = b.z - a.z;
      const sl = Math.hypot(sx, sz) || 1;
      bestTx = sx / sl;
      bestTz = sz / sl;
      bestT = (i + seg.t) / (pts.length - 1);
    }

  const res = out || { dist: 0, tx: 0, tz: 1, t: 0 };
  res.dist = bestDist;
  res.tx = bestTx;
  res.tz = bestTz;
  res.t = bestT;
  return res;
}

const _tmpSeg = { dist: 0, t: 0, cx: 0, cz: 0, dx: 0, dz: 0 };

return { TAU, clamp, mix, smoothstep, smootherstep, seedFromString, mulberry32, hash2i, hash3i, hash2, valueNoise2, fbm2, ridged2, warpedFbm2, worley2, distToSegment2D, distToPolyline2D };
})();

const __mod_world = (() => {

  mix,
  smoothstep,
  smootherstep,
  seedFromString,
  hash2i,
  fbm2,
  ridged2,
  warpedFbm2,

  distToPolyline2D} = __mod_noise;

 * 100% Pure Procedural Infinite Icelandic World Geology & Settlement Generator.
 *
 * Every seed (default or random) runs through the exact same unified procedural
 * macro-cell generator (800m x 800m cells) creating coherent Icelandic landscapes:
 * - Stepped flat-topped basalt escarpments & concave mossy talus aprons
 * - Escarpment waterfalls pouring from recessed rock clefts into boulder plunge pools
 * - Braided glacial outflow rivers flowing naturally from waterfall plunge pools across valleys
 * - Small Icelandic coastal/valley villages (turf cottages, corrugated Nordic houses, kirkja church)
 * - Geothermal silica hot springs, steaming fumaroles, basalt column outcrops, stone cairns,
 *   weathered timber footbridges, rusted hydro-relays, and distant research outposts.
 */

const CELL_SIZE = 800;
const TRUNK_SPACING = 1600; // Infinite unbroken continental glacial trunk river spacing

let _seedInt = seedFromString(DEFAULT_SEED_STR);

 * Continuous, infinite C-infinity meandering X centerline of glacial trunk river band `bandIdx` at world `z`.
 * Never ends or disconnects across cell boundaries!

  const baseX = bandIdx * TRUNK_SPACING + (hash2i(bandIdx, 17, _seedInt + 211) - 0.5) * 140.0;
  const w1 = (fbm2(z * 0.00072 + bandIdx * 7.3, bandIdx * 3.1 + 1.7, 3, _seedInt + 223) - 0.5) * 440.0;

    valleyLow * 16.0 +
    ridgeCapped * 44.0 +
    highlandMassifH +
    broadMountainH -
    glacierTrough * 22.0 +
    (medSwell - 0.5) * 10.0 +
    rollingMound;

  const cx = Math.round(x / CELL_SIZE);
  const cz = Math.round(z / CELL_SIZE);
  const neighbors = getNeighborCells(cx, cz);
  for (let ni = 0; ni < 9; ni++) {
    const f = neighbors[ni];
    if (!f.hasEscarpment) continue;
    const relX = x - f.centerX;
    const relZ = z - f.centerZ;
    const distCell = Math.hypot(relX, relZ);
    const cellMask = 1.0 - smoothstep(280, 540, distCell);
    if (cellMask <= 0.001) continue;

    const curve = sampleEscarpmentCurve(x, z, _seedInt);
    const signedD = relX * f.nx + relZ * f.nz + curve;
    const talusU = clamp((signedD + 86.0) / 88.0, 0, 1);
    const fanRib = (fbm2(x * 0.044, z * 0.044, 3, _seedInt + 209) - 0.5) * 5.2 * talusU * (1.0 - talusU * 0.35);
    const talusH = Math.pow(talusU, 2.3) * (f.cliffHeight * 0.38) + fanRib;

    const lowerTier = smootherstep(-8.0, 13.0, signedD);
    const midTier = smootherstep(10.0, 28.0, signedD);
    const upperTier = smootherstep(24.0, 46.0, signedD);
    const strataBench = Math.sin(lowerTier * Math.PI * 4.0) * 2.1 * lowerTier * (1.0 - lowerTier);
    const mesaRaw = fbm2(x * 0.024, z * 0.024, 3, _seedInt + 227);
    const mesaSteps = (Math.floor(mesaRaw * 5.0) + smoothstep(0.18, 0.82, (mesaRaw * 5.0) % 1)) * 2.2;
    const crownCrag = ridged2(x * 0.036, z * 0.036, 3, _seedInt + 251);

    const wallH = f.cliffHeight * 0.62;
    let escarpH =
      talusH +
      lowerTier * (wallH * 0.56) +
      midTier * (wallH * 0.28) +
      upperTier * (wallH * 0.16) +
      strataBench +
      smoothstep(-5.0, 22.0, signedD) * (mesaSteps + (crownCrag - 0.5) * 7.5);

    if (f.waterfall) {
      const wRelX = x - f.waterfall.x;
      const wRelZ = z - f.waterfall.z;
      const alongWf = Math.abs(wRelX * f.tx + wRelZ * f.tz);
      const wfCleft = Math.exp(-Math.pow(alongWf / 12.0, 2)) * smoothstep(-6, 46, signedD) * 12.0;
      const plungeD = Math.hypot(x - f.waterfall.plungeX, z - f.waterfall.plungeZ);
      const plungeBasin = (1.0 - smoothstep(10, 28, plungeD)) * 5.2;
      escarpH -= (wfCleft + plungeBasin);
    }
    h += escarpH * cellMask;
  }
  return h;
}

function sampleTrunkOverSlice(bandIdx, zi) {
  const key = ((bandIdx + 256) << 18) ^ (zi + 131072);
  let v = _trunkOverCache.get(key);
  if (v !== undefined) return v;
  const z = zi * 4.0;
  const rx = getTrunkRiverX(z, bandIdx);
  // 3-point smoothed macro overburden directly along the river centerline -> zero lateral canyon wall artifacts!
  const h0 = sampleMacroHeight(rx, z);
  const hPrev = sampleMacroHeight(getTrunkRiverX(z - 8.0, bandIdx), z - 8.0);
  const hNext = sampleMacroHeight(getTrunkRiverX(z + 8.0, bandIdx), z + 8.0);
  const smoothH = h0 * 0.50 + (hPrev + hNext) * 0.25;
  v = smoothH - getTrunkWaterY(rx, z);
  if (_trunkOverCache.size > 32768) _trunkOverCache.clear();
  _trunkOverCache.set(key, v);
  return v;
}

/** Smooth, cached mountain overburden directly along the trunk river centerline at world z. */
function getTrunkCenterOverburden(z, bandIdx = 0) {
  const zf = z * 0.25;
  const zi = Math.floor(zf);
  const frac = zf - zi;
  return mix(sampleTrunkOverSlice(bandIdx, zi), sampleTrunkOverSlice(bandIdx, zi + 1), frac);
}

function getNeighborCells(cx, cz) {
  const k = ((cx + 4096) << 13) | (cz + 4096);
  let arr = _neighCache.get(k);
  if (arr) return arr;
  arr = [];
  for (let dz = -1; dz <= 1; dz++) {
    for (let dx = -1; dx <= 1; dx++) {
      arr.push(getCellFeatures(cx + dx, cz + dz));
    }
  }
  _neighCache.set(k, arr);
  return arr;
}

function getWorldSeed() {
  return _seedStr;
}

/**
 * Compute smooth organic lateral curvature along a cell's escarpment fault line
 * so the cliff edge weaves into natural headlands & recessed amphitheaters.
 */
function sampleEscarpmentCurve(x, z, seedBase) {
  const w = (warpedFbm2(x * 0.0042, z * 0.0042, 0.78, 3, seedBase + 109) - 0.5) * 112.0;
  const r = (ridged2(x * 0.015, z * 0.015, 3, seedBase + 157) - 0.5) * 20.0;
  return w + r;
}

/**
 * Deterministic macro-geology, hydrology, villages & landmarks for an 800m x 800m cell (cx, cz).
 * Purely procedural for ALL seeds — zero hardcoded special-case layouts!
 */
function getCellFeatures(cx, cz) {
  const key = `${cx},${cz}`;
  let feat = _cellCache.get(key);
  if (feat) return feat;

  const h0 = hash2i(cx, cz, _seedInt + 11);
  const h1 = hash2i(cx, cz, _seedInt + 29);
  const h2 = hash2i(cx, cz, _seedInt + 47);
  const h3 = hash2i(cx, cz, _seedInt + 71);
  const h4 = hash2i(cx, cz, _seedInt + 97);
  const h5 = hash2i(cx, cz, _seedInt + 131);
  const h6 = hash2i(cx, cz, _seedInt + 167);
  const h7 = hash2i(cx, cz, _seedInt + 199);

  const originX = cx * CELL_SIZE;
  const originZ = cz * CELL_SIZE;
  const isOriginCell = cx === 0 && cz === 0;

  // 1. Stepped Basalt Escarpment (~76% of all cells; always present near origin valley)
  const hasEscarpment = isOriginCell || h0 > 0.24;
  // Normal (nx, nz) points FROM the mossy valley UP onto the basalt escarpment plateau
  const angle = (h1 - 0.5) * Math.PI * 2.0;
  const nx = Math.cos(angle);
  const nz = Math.sin(angle);
  const tx = -nz; // Tangent along escarpment wall
  const tz = nx;

  // Offset escarpment center slightly to one side so a generous mossy valley lies in front of it
  const centerX = originX + nx * (70 + (h2 - 0.5) * 110) + tx * ((h3 - 0.5) * 140);
  const centerZ = originZ + nz * (70 + (h2 - 0.5) * 110) + tz * ((h3 - 0.5) * 140);
  const cliffHeight = 72 + h4 * 56; // 72m..128m dramatic Icelandic basalt cliff walls

  // 2. Waterfall & Hydrologically Connected Tributary Stream merging seamlessly into the Infinite Trunk River!
  const hasRiver = isOriginCell || h2 > 0.26;
  const hasWaterfall = hasEscarpment && hasRiver && (isOriginCell || h3 > 0.30);

  let waterfall = null;
  const riverPts = [];

  if (hasWaterfall) {
    // Place waterfall notch right on the curved escarpment edge (keep clear of trunk river channel)
    const alongT = (h5 - 0.5) * 160;
    const approxX = centerX + tx * alongT;
    const approxZ = centerZ + tz * alongT;
    const curveOff = sampleEscarpmentCurve(approxX, approxZ, _seedInt);
    const wfX = approxX - nx * curveOff;
    const wfZ = approxZ - nz * curveOff;

    // Valley floor plunge pool directly out in front of the cliff face (-nx, -nz)
    const plungeX = wfX - nx * 24.0;
    const plungeZ = wfZ - nz * 24.0;

    waterfall = {
      x: wfX,
      z: wfZ,
      plungeX,
      plungeZ,
      nx: -nx, // Points OUT from cliff toward valley plunge pool
      nz: -nz,
      cliffHeight,
      yaw: Math.atan2(-nx, -nz)
    };

    // Route waterfall outflow tributary smoothly downstream to CONNECT DIRECTLY into the nearest infinite trunk river!
    const tBand = Math.round(plungeX / TRUNK_SPACING);
    const estZ = plungeZ - nz * 240.0 + (h6 > 0.5 ? 95.0 : -95.0);
    const confZ = estZ;
    const confX = getTrunkRiverX(confZ, tBand);
    const confDxDz = (getTrunkRiverX(confZ + 6.0, tBand) - getTrunkRiverX(confZ - 6.0, tBand)) / 12.0;
    const confTlen = Math.hypot(confDxDz, 1.0);
    const confDirX = confDxDz / confTlen;
    const confDirZ = 1.0 / confTlen;
    // Pick downstream merge tangent consistent with approach direction
    const approachDot = (confX - plungeX) * confDirX + (confZ - plungeZ) * confDirZ;
    const mergeSign = approachDot >= 0 ? 1.0 : -1.0;

    // Cubic Hermite curve: exits plunge pool along (-nx, -nz) -> merges smoothly tangent-aligned into trunk river!
    const distToConf = clamp(Math.hypot(confX - plungeX, confZ - plungeZ), 120.0, 950.0);
    const m0x = -nx * distToConf * 0.55;
    const m0z = -nz * distToConf * 0.55;
    const m1x = confDirX * mergeSign * distToConf * 0.45;
    const m1z = confDirZ * mergeSign * distToConf * 0.45;
    // Extend slightly into trunk river center so water sheets overlap seamlessly at the confluence!
    const endX = confX + confDirX * mergeSign * 18.0;
    const endZ = confZ + confDirZ * mergeSign * 18.0;

    const steps = 10;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const t2 = t * t;
      const t3 = t2 * t;
      const h00 = 2 * t3 - 3 * t2 + 1;
      const h10 = t3 - 2 * t2 + t;
      const h01 = -2 * t3 + 3 * t2;
      const h11 = t3 - t2;
      const px = h00 * plungeX + h10 * m0x + h01 * endX + h11 * m1x;
      const pz = h00 * plungeZ + h10 * m0z + h01 * endZ + h11 * m1z;
      const meander = Math.sin(t * Math.PI * 2.0 + h1 * 4.0) * 18.0 * Math.sin(t * Math.PI);
      const perpX = -(endZ - plungeZ) / Math.max(distToConf, 1.0);
      const perpZ = (endX - plungeX) / Math.max(distToConf, 1.0);
      riverPts.push({
        x: px + perpX * meander,
        z: pz + perpZ * meander
      });
    }
  }

  // Helper: check distance from BOTH the waterfall tributary AND the infinite continental trunk river!
  const riverDistAt = (px, pz) => {
    let bestD = getNearestTrunkDist(px, pz);
    if (riverPts.length >= 2) {
      distToPolyline2D(px, pz, riverPts, _polyTmp);
      if (_polyTmp.dist < bestD) bestD = _polyTmp.dist;
    }
    return bestD;
  };

  // 3. Small Icelandic Village (~58% of cells; always spawned in origin cell valley so players can discover it!)
  let village = null;
  const hasVillage = isOriginCell || h5 > 0.42;
  if (hasVillage) {
    // Place village in the scenic valley in front of the cliff, offset safely to one side of the river
    const vSide = h6 > 0.5 ? -1 : 1; // Opposite side of river drift for natural scenic balance
    let vx = originX - nx * (155 + h3 * 90) + tx * (vSide * (78 + h7 * 75));
    let vz = originZ - nz * (155 + h3 * 90) + tz * (vSide * (78 + h7 * 75));

    // Nudge smoothly away if too close to river channel
    if (riverDistAt(vx, vz) < 42) {
      vx += tx * vSide * 58;
      vz += tz * vSide * 58;
    }

    const houseCount = 6 + Math.floor(h7 * 3); // 6..8 traditional Icelandic turf cottages, barns & black kirkja church
    const buildings = [];
    const baseYaw = Math.atan2(nx, nz); // Oriented organically relative to valley & escarpment

    // Iconic Black-Timber Icelandic Church (Búðakirkja style) standing prominently on village eastern edge
    buildings.push({
      kind: 'church',
      x: vx + tx * 21.0 + nx * 6.0,
      z: vz + tz * 21.0 + nz * 6.0,
      yaw: baseYaw + Math.PI * 0.5 + (h1 - 0.5) * 0.35,
      radius: 8.5
    });

    // Organic Icelandic hamlet cluster: mostly low-slung mossy turf farmhouses + 2-3 weathered silver-timber barns
    const villageLanePts = [
      { x: vx - tx * 34 - nx * 16, z: vz - tz * 34 - nz * 16 },
      { x: vx - tx * 10 - nx * 6,  z: vz - tz * 10 - nz * 6 },
      { x: vx + tx * 8  - nx * 2,  z: vz + tz * 8  - nz * 2 },
      { x: vx + tx * 22 + nx * 1,  z: vz + tz * 22 + nz * 1 }
    ];

    for (let b = 0; b < houseCount; b++) {
      // Arrange turf houses along gentle arc behind the lane, timber barns slightly forward by the paddock!
      const isFrontBarn = b < 2;
      const along = ((b / Math.max(houseCount - 1, 1)) - 0.5) * 48.0 + (hash2i(cx * 17 + b, cz, _seedInt + 401) - 0.5) * 8.0;
      const depth = isFrontBarn
        ? -13.0 - hash2i(b, cz * 19, _seedInt + 419) * 10.0
        : 4.0 + hash2i(cx, b * 23, _seedInt + 421) * 18.0;
      const bx = vx + tx * along + nx * depth;
      const bz = vz + tz * along + nz * depth;

      let overlap = false;
      for (const ex of buildings) {
        if (Math.hypot(ex.x - bx, ex.z - bz) < 12.0) {
          overlap = true;
          break;
        }
      }
      if (overlap || riverDistAt(bx, bz) < 22) continue;

      const styleR = hash2i(cx + b * 7, cz + b * 13, _seedInt + 439);
      const kind = isFrontBarn ? 'weathered_barn' : (styleR < 0.78 ? 'turf_cottage' : 'weathered_barn');
      const roofStyle = hash2i(b, cx * 19 + cz * 23, _seedInt + 467);
      // Orient cottages & barns naturally toward the open valley/lane (baseYaw + PI) with organic variation
      buildings.push({
        kind,
        x: bx,
        z: bz,
        yaw: baseYaw + Math.PI + (isFrontBarn ? (b === 0 ? 0.22 : -0.18) : (hash2i(b, cx, _seedInt + 491) - 0.5) * 0.55),
        scale: 0.90 + hash2i(cz, b, _seedInt + 509) * 0.24,
        roofStyle,
        hasSmoke: kind === 'turf_cottage' && b < 4,
        radius: 5.8
      });
    }

    // Subtle rustic dark-iron yard lanterns (quiet in daylight, warm glow at dusk/night)
    const lamps = [];
    for (let l = 0; l < 3; l++) {
      const pt = villageLanePts[l];
      lamps.push({ x: pt.x + nx * 3.8, z: pt.z + nz * 3.8 });
    }

    village = {
      x: vx,
      z: vz,
      radius: 44.0,
      yaw: baseYaw,
      tx,
      tz,
      nx,
      nz,
      lanePts: villageLanePts,
      buildings,
      lamps
    };
  }

  // 4. Bridges Research Outpost Dome + Trail Guide Beacons (~45% of cells, well separated from village)
  const outposts = [];
  const beacons = [];
  if (h0 > 0.52 || (isOriginCell && h4 > 0.35)) {
    const oSide = h6 > 0.5 ? 1 : -1;
    let ox = originX - nx * (190 + h4 * 75) + tx * (oSide * (125 + h2 * 65));
    let oz = originZ - nz * (190 + h4 * 75) + tz * (oSide * (125 + h2 * 65));
    if (village && Math.hypot(ox - village.x, oz - village.z) < 95) {
      ox += tx * oSide * 90;
      oz += tz * oSide * 90;
    }
    if (riverDistAt(ox, oz) > 26) {
      outposts.push({ x: ox, z: oz, yaw: h1 * Math.PI * 2 });
      for (let b = 1; b <= 5; b++) {
        const bx = ox - tx * oSide * b * 28 + nx * Math.sin(b * 0.7) * 10;
        const bz = oz - tz * oSide * b * 28 + nz * Math.sin(b * 0.7) * 10;
        if (riverDistAt(bx, bz) > 16) {
          beacons.push({ x: bx, z: bz, kind: b === 3 ? 'amber' : 'cyan' });
        }
      }
    }
  }

  // 5. Weathered Rusted Hydro-Relay / Weather Station (~62% of cells, often perched on a mossy knoll near river)
  const relays = [];
  if (isOriginCell || h1 > 0.38) {
    const rSide = h6 > 0.5 ? 1 : -1;
    let rx = originX - nx * (95 + h7 * 75) + tx * (rSide * (70 + h3 * 70));
    let rz = originZ - nz * (95 + h7 * 75) + tz * (rSide * (70 + h3 * 70));
    if (riverDistAt(rx, rz) < 20) {
      rx += tx * rSide * 28;
      rz += tz * rSide * 28;
    }
    if (!village || Math.hypot(rx - village.x, rz - village.z) > 48) {
      relays.push({ x: rx, z: rz, yaw: h4 * Math.PI * 2 });
    }
  }

  // 6. Geothermal Hot Springs (steaming milky-turquoise pools with sinter crust) & Fumaroles
  const hotSprings = [];
  const fumaroles = [];
  if (h4 > 0.32 || isOriginCell) {
    const hsCount = 1 + (h7 > 0.65 ? 1 : 0);
    for (let i = 0; i < hsCount; i++) {
      const hsx = originX - nx * (115 + hash2i(cx + i, cz, _seedInt + 601) * 145) + tx * ((hash2i(cx, cz + i, _seedInt + 617) - 0.5) * 320);
      const hsz = originZ - nz * (115 + hash2i(cx + i, cz, _seedInt + 601) * 145) + tz * ((hash2i(cx, cz + i, _seedInt + 617) - 0.5) * 320);
      if (riverDistAt(hsx, hsz) > 24 && (!village || Math.hypot(hsx - village.x, hsz - village.z) > 52)) {
        hotSprings.push({ x: hsx, z: hsz, radius: 5.5 + hash2i(i, cx, _seedInt + 641) * 4.5 });
      }
    }
  }
  if (h3 > 0.38) {
    const count = 2 + Math.floor(h2 * 3);
    for (let i = 0; i < count; i++) {
      const fx = originX - nx * (90 + hash2i(cx + i, cz, _seedInt + 313) * 190) + tx * ((hash2i(cx, cz + i, _seedInt + 521) - 0.5) * 380);
      const fz = originZ - nz * (90 + hash2i(cx + i, cz, _seedInt + 313) * 190) + tz * ((hash2i(cx, cz + i, _seedInt + 521) - 0.5) * 380);
      if (riverDistAt(fx, fz) > 18) fumaroles.push({ x: fx, z: fz });
    }
  }

  // 7. Hexagonal Basalt Column Clusters (iconic Svartifoss/Reynisdrangar volcanic organ pipes!)
  const basaltColumns = [];
  if (hasEscarpment) {
    const colCount = 3 + Math.floor(h5 * 3);
    for (let i = 0; i < colCount; i++) {
      const along = (hash2i(cx * 17 + i, cz * 29, _seedInt + 701) - 0.5) * 320;
      const ax = centerX + tx * along;
      const az = centerZ + tz * along;
      const cOff = sampleEscarpmentCurve(ax, az, _seedInt);
      // Nestled right at the rocky foot of the escarpment talus
      const bx = ax - nx * (cOff + 34 + hash2i(i, cx, _seedInt + 719) * 28);
      const bz = az - nz * (cOff + 34 + hash2i(i, cx, _seedInt + 719) * 28);
      if (riverDistAt(bx, bz) > 18 && (!village || Math.hypot(bx - village.x, bz - village.z) > 45)) {
        basaltColumns.push({
          x: bx,
          z: bz,
          scale: 0.85 + hash2i(cz, i, _seedInt + 733) * 0.75,
          seed: cx * 97 + cz * 53 + i * 19
        });
      }
    }
  }

  // 8. Natural Winding Footpath linking Village -> River Crossing / Valley Trail -> Outpost
  const pathPts = [];
  const bridges = [];
  const cairns = [];

  if (village) {
    const targetX = outposts.length > 0 ? outposts[0].x : (waterfall ? waterfall.plungeX - nx * 95 : village.x + tx * 160);
    const targetZ = outposts.length > 0 ? outposts[0].z : (waterfall ? waterfall.plungeZ - nz * 95 : village.z + tz * 160);
    const dx = targetX - village.x;
    const dz = targetZ - village.z;
    const len = Math.hypot(dx, dz) || 1;
    const pnx = -dz / len;
    const pnz = dx / len;
    for (let i = 0; i <= 7; i++) {
      const f = i / 7;
      const sway = Math.sin(f * Math.PI * 1.8 + h0 * 3.0) * 16.0 * Math.sin(f * Math.PI);
      const px = mix(village.x, targetX, f) + pnx * sway;
      const pz = mix(village.z, targetZ, f) + pnz * sway;
      pathPts.push({ x: px, z: pz });
    }

    // Place a weathered timber footbridge if the river passes within walkable distance of the village
    if (riverPts.length >= 4) {
      const midIdx = Math.min(4, riverPts.length - 2);
      const ra = riverPts[midIdx];
      const rb = riverPts[midIdx + 1];
      const mx = (ra.x + rb.x) * 0.5;
      const mz = (ra.z + rb.z) * 0.5;
      const rtx = rb.x - ra.x;
      const rtz = rb.z - ra.z;
      const rYaw = Math.atan2(rtx, rtz);
      bridges.push({ x: mx, z: mz, yaw: rYaw, span: 20.0 });
    }

    // Traditional stacked basalt stone traveler cairns (vörður) along trail
    for (let c = 1; c <= 4; c++) {
      const pt = pathPts[Math.min(c * 2 - 1, pathPts.length - 1)];
      if (pt && riverDistAt(pt.x, pt.z) > 16) {
        cairns.push({
          x: pt.x + pnx * (c % 2 === 0 ? 3.5 : -3.5),
          z: pt.z + pnz * (c % 2 === 0 ? 3.5 : -3.5),
          seed: cx * 41 + cz * 73 + c * 17
        });
      }
    }
  } else {
    // Wilderness trail cairns even in uninhabited highland cells
    for (let c = 0; c < 3; c++) {
      const cxp = originX - nx * (120 + c * 55) + tx * ((hash2i(cx + c, cz, _seedInt + 811) - 0.5) * 220);
      const czp = originZ - nz * (120 + c * 55) + tz * ((hash2i(cx, cz + c, _seedInt + 827) - 0.5) * 220);
      if (riverDistAt(cxp, czp) > 18) {
        cairns.push({ x: cxp, z: czp, seed: cx * 31 + cz * 67 + c * 23 });
      }
    }
  }

  // 9. Procedural Orographic Cliff-Clinging Mist Banks along the cell's basalt escarpment crest
  const cliffMist = [];
  if (hasEscarpment) {
    const mistCount = 6;
    for (let m = 0; m < mistCount; m++) {
      const along = ((m / (mistCount - 1)) - 0.5) * 440;
      const ax = centerX + tx * along;
      const az = centerZ + tz * along;
      const cOff = sampleEscarpmentCurve(ax, az, _seedInt);
      const mx = ax - nx * (cOff + 14.0);
      const mz = az - nz * (cOff + 14.0);
      cliffMist.push({
        x: mx,
        z: mz,
        yOffset: cliffHeight * (0.72 + hash2i(m, cx * 13 + cz * 19, _seedInt + 907) * 0.24),
        sx: 78 + hash2i(m, 1, _seedInt + 911) * 68,
        sy: 26 + hash2i(m, 2, _seedInt + 911) * 16,
        op: 0.28 + hash2i(m, 3, _seedInt + 911) * 0.14
      });
    }
  }

  feat = {
    cx,
    cz,
    hasEscarpment,
    nx,
    nz,
    tx,
    tz,
    centerX,
    centerZ,
    cliffHeight,
    hasRiver,
    riverPts,
    waterfall,
    village,
    outposts,
    relays,
    beacons,
    hotSprings,
    fumaroles,
    basaltColumns,

 * - Dry-stacked mossy volcanic basalt rubble stone walls (for authentic turf-house walls!)

  const woodH = new Float32Array(size * size);

  const tarH = new Float32Array(size * size);

      const rowOffset = (Math.floor(v * 7) % 2) * 0.5;
      tileWorley((u + rowOffset * 0.14) % 1.0, (v * 1.45) % 1.0, 7, 2521, wStone);

        stoneBuf[idx + 2] = clamp(Math.round(stoneShade + 3), 0, 255);

  };
}

  float totalFog = clamp(max(baseAir, baseAir * 0.32 + cloudFog), 0.0, maxFog);

  // Harmonize fog inscattering with sky storm luminance: sunlit silver crests on overcast/parting days -> brooding Nordic storm slate in gales!
  float sunBreak = (1.0 - uNightFactor) * mix(0.26, 0.03, smoothstep(0.35, 0.96, uCloudDarkness));
  vec3 stormSlate = mix(uFogLowColor, uSkyHorizon * mix(0.68, 0.52, uCloudDarkness), smoothstep(0.45, 0.95, uCloudDarkness) * 0.48);
  vec3 airCol = mix(uFogColor * vec3(0.90, 0.96, 1.04), stormSlate * 0.94, stormAmt * 0.55);
  vec3 cloudBelly = mix(uFogColor * 0.86, stormSlate * 0.92, 0.50);
  vec3 cloudCrest = mix(stormSlate * mix(1.16, 1.01, uCloudDarkness), vec3(0.87, 0.91, 0.95) * uSunColor, sunBreak);
  vec3 cloudCol = mix(cloudBelly, cloudCrest, clamp(avgLit, 0.0, 1.0));

  float cloudMix = clamp(cloudFog / max(totalFog, 0.001), 0.0, 1.0);
  vec3 scatterCol = mix(airCol, cloudCol, cloudMix);

  // Subtle emerald-teal mist tint when Aurora Borealis shines at night
  scatterCol += vec3(0.012, 0.048, 0.036) * uAuroraStrength * uNightFactor;

  return mix(col, scatterCol, totalFog);
}

vec3 sampleOdradekScan(vec3 worldPos, vec3 worldNorm) {
  if (uScanStrength <= 0.001 || uScanRadius < 0.0) return vec3(0.0);
  float d = length(worldPos.xz - uScanOrigin.xz);
  float ringD = (d - uScanRadius) * 0.26;
  float ring = exp(-(ringD * ringD));
  float trail = smoothstep(uScanRadius - 26.0, uScanRadius, d) * (1.0 - smoothstep(uScanRadius, uScanRadius + 4.0, d));
  float gridX = abs(fract(worldPos.x * 0.35) - 0.5);
  float gridZ = abs(fract(worldPos.z * 0.35) - 0.5);
  float topo = smoothstep(0.46, 0.495, max(gridX, gridZ));
  float steep = 1.0 - smoothstep(0.38, 0.75, worldNorm.y);
  vec3 scanCol = mix(vec3(0.05, 0.85, 1.0), vec3(1.0, 0.52, 0.12), steep);
  float intensity = (ring * 1.35 + trail * (0.28 + topo * 0.45)) * uScanStrength;
  return scanCol * intensity;
}
`;

/**
 * Inject Icelandic dual-layer aerial perspective, rain darkening/gloss,
 * and Odradek scan pulse into standard PBR materials.
 */
function enhanceMaterialWithAtmo(mat, { cacheKey, windSway = 0.0, wetnessBoost = 0.65 } = {}) {
  mat.fog = false;
  mat.customProgramCacheKey = () => `ls_atmo_${cacheKey || 'std'}_${windSway > 0 ? 'wind' : 'nowind'}`;
  const prevCompile = mat.onBeforeCompile;

  mat.onBeforeCompile = (shader, renderer) => {
    if (prevCompile) prevCompile(shader, renderer);
    Object.assign(shader.uniforms, ATMO_UNIFORMS);

    shader.vertexShader = shader.vertexShader
      .replace(
        '#include <common>',
        /* glsl */`
        #include <common>
        varying vec3 vLsWorldPos;
        varying vec3 vLsWorldNorm;
        uniform float uTime;
        uniform vec2 uWindDir;
        uniform float uWindStrength;
        `
      )
      .replace(
        '#include <begin_vertex>',
        /* glsl */`
        #include <begin_vertex>
        ${windSway > 0 ? /* glsl */`
        {
          vec2 wOrigin = (modelMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xz;
          float instSeed = position.x * 0.7 + position.z * 0.5;
          #ifdef USE_INSTANCING
            vec4 instCol = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
            wOrigin = (modelMatrix * instCol).xz;
            instSeed += instCol.x * 0.37 + instCol.z * 0.41;
          #endif
          // Sustained directional wind bend + long-lasting rolling gust waves (8-14s fronts!) + natural blade flutter
          float gustFront = 0.54 + 0.46 * sin(uTime * 0.46 - dot(wOrigin, uWindDir) * 0.042);
          float longSurge = 0.72 + 0.28 * sin(uTime * 0.21 - dot(wOrigin, uWindDir) * 0.016 + 1.4);
          float sustained = (0.30 + 0.44 * gustFront * longSurge) * uWindStrength;
          float flutter = sin(uTime * (2.0 + uWindStrength * 1.1) + instSeed) * (0.20 + 0.10 * gustFront);
          float bend = clamp(position.y, 0.0, 1.5) * ${windSway.toFixed(4)} * (sustained + flutter);
          transformed.x += bend * uWindDir.x;
          transformed.z += bend * uWindDir.y;
          transformed.y -= abs(bend) * 0.12;
        }` : ''}
        `
      )
      .replace(
        '#include <project_vertex>',
        /* glsl */`
        #include <project_vertex>
        {
          vec4 lsWp = vec4(transformed, 1.0);
          vec3 lsWn = objectNormal;
          #ifdef USE_INSTANCING
            lsWp = instanceMatrix * lsWp;
            lsWn = mat3(instanceMatrix) * lsWn;
          #endif
          lsWp = modelMatrix * lsWp;
          vLsWorldPos = lsWp.xyz;
          vLsWorldNorm = normalize(mat3(modelMatrix) * lsWn);
        }
        `
      );

    shader.fragmentShader = shader.fragmentShader
      .replace(
        '#include <common>',
        /* glsl */`
        #include <common>
        varying vec3 vLsWorldPos;
        varying vec3 vLsWorldNorm;
        ${ATMO_GLSL_PARS}
        `
      )
      .replace(
        '#include <roughnessmap_fragment>',
        /* glsl */`
        #include <roughnessmap_fragment>
        roughnessFactor = mix(roughnessFactor, max(0.18, roughnessFactor * 0.45), uRainWetness * ${wetnessBoost.toFixed(3)});
        `
      )
      .replace(
        '#include <dithering_fragment>',
        /* glsl */`
        gl_FragColor.rgb += sampleOdradekScan(vLsWorldPos, normalize(vLsWorldNorm));
        gl_FragColor.rgb = applyIcelandAtmo(gl_FragColor.rgb, vLsWorldPos);
        #include <dithering_fragment>
        `
      );
  };
  return mat;
}

/**
 * Sky Dome with Volumetric-Shaded Sculpted Icelandic Nimbostratus Storm Clouds,
 * Beer-Lambert Self-Shadowing, Silver-Lining Directional Scattering,
 * Twinkling Starfield, Lunar Halo, and 3D Ray-Marched Aurora Borealis.
 */
function createSkyDome() {
  const skyGeo = new THREE.SphereGeometry(12000, 64, 40);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: {
      ...ATMO_UNIFORMS
    },
    vertexShader: /* glsl */`
      varying vec3 vDir;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vDir = position;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */`
      ${ATMO_GLSL_PARS}
      uniform float uSiderealAngle;
      varying vec3 vDir;

      vec2 hash22(vec2 p) {
        vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.xx + p3.yz) * p3.zy) * 2.0 - 1.0;
      }

      float hash21(vec2 p) {
        vec3 p3 = fract(vec3(p.xyx) * 0.1031);
        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.x + p3.y) * p3.z);
      }

      float hash31(vec3 p) {
        p = fract(p * 0.1031);
        p += dot(p, p.yzx + 33.33);
        return fract((p.x + p.y) * p.z);
      }

      // Smooth quintic 2D gradient noise (zero grid artifacts)
      float gnoise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
        float a = dot(hash22(i + vec2(0.0, 0.0)), f - vec2(0.0, 0.0));
        float b = dot(hash22(i + vec2(1.0, 0.0)), f - vec2(1.0, 0.0));
        float c = dot(hash22(i + vec2(0.0, 1.0)), f - vec2(0.0, 1.0));
        float d = dot(hash22(i + vec2(1.0, 1.0)), f - vec2(1.0, 1.0));
        return clamp(mix(mix(a, b, u.x), mix(c, d, u.x), u.y) * 0.72 + 0.5, 0.0, 1.0);
      }

      float cloudFbm(vec2 p) {
        float v = 0.0;
        float a = 0.5;
        mat2 r = mat2(0.80, -0.60, 0.60, 0.80);
        for (int i = 0; i < 4; i++) {
          v += a * gnoise(p);
          p = r * p * 2.03 + vec2(13.7, -7.9);
          a *= 0.5;
        }
        return v;
      }

      float cloudDensityAt(vec2 uv, vec2 drift, float cov) {
        // Domain-warped billowing storm cumulus/nimbostratus structure
        vec2 w = vec2(
          cloudFbm(uv * 0.48 + drift * 0.45) - 0.5,
          cloudFbm(uv * 0.48 + vec2(4.7, -3.1) + drift * 0.45) - 0.5
        );
        float base = cloudFbm(uv * 0.78 + w * 0.92 + drift);
        float billow = cloudFbm(uv * 1.85 - drift * 0.35 + w * 0.45 + vec2(8.3, 2.1));
        float fine = gnoise(uv * 4.4 + drift * 1.4);
        float field = base * 0.62 + billow * 0.28 + fine * 0.10;
        float thresh = mix(0.68, 0.22, cov);
        return smoothstep(thresh, thresh + 0.44, field);
      }

      // Rodrigues rotation around Iceland's North Celestial Pole (64.15 deg N above northern horizon -Z!)
      // Stars & Milky Way wheel counter-clockwise around Polaris as Earth rotates 360 deg per 24 game hours!
      vec3 toIcelandCelestial(vec3 rd) {
        const vec3 NCP = vec3(0.0, 0.89994, -0.43601); // sin(64.15 deg), -cos(64.15 deg)
        float c = cos(uSiderealAngle);
        float s = sin(uSiderealAngle);
        return rd * c + cross(NCP, rd) * s + NCP * dot(NCP, rd) * (1.0 - c);
      }

      // Photorealistic Milky Way Galaxy (golden-silver star clouds, Great Rift dark dust lanes & subtle nebulae!)
      vec3 renderMilkyWay(vec3 celDir, float elev) {
        if (uNightFactor < 0.08 || elev < -0.02) return vec3(0.0);
        // Real Galactic Plane tilted ~62.9 deg to Celestial Equator so the band arches dynamically over Iceland!
        vec3 galNorth = normalize(vec3(0.42, 0.45, 0.788));
        vec3 galCore  = normalize(vec3(-0.76, -0.28, 0.585));
        vec3 galEast = normalize(cross(galNorth, galCore));

        float gLat = dot(celDir, galNorth);
        float gLon = atan(dot(celDir, galEast), dot(celDir, galCore));

        float bandBroad = exp(-gLat * gLat * 14.0);
        float bandCore  = exp(-gLat * gLat * 42.0);
        if (bandBroad < 0.008) return vec3(0.0);

        // Seamless 2D galactic coordinates for star clouds & dark dust rifts
        vec2 gUv = vec2(gLon * 2.15, gLat * 7.2);
        vec2 w = vec2(
          cloudFbm(gUv * 0.75 + vec2(3.1, -1.7)) - 0.5,
          cloudFbm(gUv * 0.75 + vec2(-4.3, 2.9)) - 0.5
        );
        float starCloud = cloudFbm(gUv * 1.45 + w * 1.1);
        float fineDust  = cloudFbm(gUv * 3.8 - w * 0.8 + vec2(7.4, -2.2));

        // Iconic Great Rift dark dust lane splitting the Milky Way down the middle
        float riftD = (gLat + (w.y * 0.14)) * 9.5;
        float riftBand = exp(-(riftD * riftD));
        float riftMask = smoothstep(0.32, 0.74, cloudFbm(gUv * 2.1 + vec2(11.2, -5.4) + w * 0.9)) * riftBand;

        // Warm golden-amber Galactic Core bulge vs cool silvery-blue outer Milky Way arms
        float coreBulge = pow(clamp(dot(celDir, galCore) * 0.5 + 0.5, 0.0, 1.0), 3.4);
        vec3 outerArmCol = vec3(0.24, 0.34, 0.52);
        vec3 coreGoldCol = vec3(0.72, 0.58, 0.40);
        vec3 nebulaPink  = vec3(0.56, 0.24, 0.42);

        float nebulaKnots = smoothstep(0.64, 0.86, fineDust) * bandCore * (0.4 + 0.6 * coreBulge);
        vec3 galCol = mix(outerArmCol, coreGoldCol, coreBulge * 0.82);
        galCol = mix(galCol, nebulaPink, nebulaKnots * 0.38);

        float lum = (bandBroad * (0.28 + 0.85 * starCloud) + bandCore * (0.45 + 0.75 * fineDust) * (0.65 + 0.85 * coreBulge));
        lum *= (1.0 - riftMask * 0.76);

        // Dense fine unresolved galactic star shimmer sprinkled along the band
        vec3 gp = celDir * 360.0;
        vec3 gc = floor(gp);
        float gh = hash31(gc);
        float microStar = step(0.91, gh) * (1.0 - smoothstep(0.0, 0.28, length(fract(gp) - 0.5))) * bandCore * (1.0 - riftMask * 0.65);

        float horizFade = smoothstep(-0.01, 0.16, elev);
        float nightVis = smoothstep(0.14, 0.82, uNightFactor) * (1.0 - uCloudCoverage * 0.86);
        return (galCol * lum * 0.34 + vec3(0.86, 0.91, 1.0) * microStar * 0.72) * horizFade * nightVis;
      }

      vec3 renderStars(vec3 celDir, float elev) {
        if (uNightFactor < 0.08 || elev < 0.005) return vec3(0.0);
        vec3 p = celDir * 220.0;
        vec3 cell = floor(p);
        vec3 f = fract(p) - 0.5;
        float h = hash31(cell);
        vec3 acc = vec3(0.0);
        if (h >= 0.962) {
          float size = mix(0.10, 0.24, fract(h * 71.3));
          float d = length(f - (vec3(hash31(cell + 1.1), hash31(cell + 2.3), hash31(cell + 3.7)) - 0.5) * 0.45);
          float star = 1.0 - smoothstep(0.0, size, d);
          float twinkle = 0.68 + 0.32 * sin(uTime * (2.2 + h * 5.0) + h * 90.0);
          vec3 tint = mix(vec3(0.75, 0.86, 1.0), vec3(1.0, 0.90, 0.78), fract(h * 19.7));
          acc += tint * star * star * twinkle * 1.55;
        }
        // Subtle crisp Polaris (North Star) anchored at Iceland's North Celestial Pole!
        const vec3 NCP = vec3(0.0, 0.89994, -0.43601);
        float polCos = max(dot(celDir, NCP), 0.0);
        acc += vec3(0.96, 0.95, 0.88) * smoothstep(0.99992, 0.999995, polCos) * 2.2;
        return acc * smoothstep(0.005, 0.14, elev) * smoothstep(0.10, 0.80, uNightFactor);
      }

      vec3 renderAurora(vec3 rd) {
        if (uAuroraStrength <= 0.005 || rd.y < -0.02) return vec3(0.0);
        float t = uAuroraTime;
        vec3 accum = vec3(0.0);
        float horizFade = smoothstep(-0.02, 0.10, rd.y) * (1.0 - smoothstep(0.30, 0.96, rd.y));
        if (horizFade <= 0.001) return vec3(0.0);

        float dither = hash21(gl_FragCoord.xy + fract(t) * 37.0) / 28.0;
        for (int i = 0; i < 28; i++) {
          float fi = float(i) / 28.0 + dither;
          float alt = 1.05 + fi * 1.55;
          float rayLen = alt / max(rd.y + 0.16, 0.07);
          vec2 p = rd.xz * rayLen;

          float warp = gnoise(p * 0.55 + vec2(t * 0.04, -t * 0.03)) * 2.1;
          float waveA = sin(p.x * 0.58 + p.y * 0.34 + t * 0.18 + warp);
          float waveB = sin(p.x * 1.05 - p.y * 0.72 - t * 0.14 + warp * 1.3);

          float ribbonA = exp(-waveA * waveA * 4.4);
          float ribbonB = exp(-(waveB + 0.3) * (waveB + 0.3) * 5.2) * 0.72;
          float curtain = max(ribbonA, ribbonB);

          float rays = 0.42 + 1.05 * pow(gnoise(vec2(p.x * 4.8 + p.y * 3.1 + t * 0.24, p.y * 1.5 - t * 0.12)), 1.7);
          float macroPatch = smoothstep(0.16, 0.72, gnoise(p * 0.34 - vec2(t * 0.03, 0.0)));
          float density = curtain * rays * macroPatch;

          vec3 emerald = vec3(0.08, 1.00, 0.42);
          vec3 teal = vec3(0.06, 0.80, 0.88);
          vec3 violet = vec3(0.68, 0.16, 0.92);
          vec3 altCol = mix(emerald, teal, smoothstep(0.0, 0.44, fi));
          altCol = mix(altCol, violet, smoothstep(0.40, 0.90, fi));

          float vertWeight = smoothstep(0.0, 0.10, fi) * exp(-fi * 1.75) * (1.0 - fi * 0.30);
          accum += altCol * density * vertWeight * 0.175;
        }
        return accum * uAuroraStrength * horizFade;
      }

      void main() {
        vec3 rd = normalize(vDir);
        float elev = clamp(rd.y, -0.25, 1.0);

        // Base Nordic Rayleigh/Mie sky gradient
        float hMix = pow(clamp(1.0 - max(elev, 0.0), 0.0, 1.0), 2.1);
        vec3 sky = mix(uSkyZenith, uSkyHorizon, hMix);

        float sunCos = max(dot(rd, uSunDir), 0.0);
        float sunScatter = pow(sunCos, 5.0) * 0.44 + pow(sunCos, 36.0) * 0.50;
        float sunDisc = smoothstep(0.9993, 0.99985, sunCos) * (1.0 - smoothstep(0.45, 0.92, uCloudCoverage));
        sky += uSunColor * (sunScatter * (1.0 - uCloudCoverage * 0.48) + sunDisc * 4.2) * (1.0 - uNightFactor * 0.92);

        // Night Milky Way Galaxy & rotating Icelandic starfield (rotates around Polaris 64.15 deg N; Aurora stays Earth-fixed!)
        vec3 celDir = toIcelandCelestial(rd);
        sky += renderMilkyWay(celDir, rd.y);
        sky += renderStars(celDir, rd.y);
        float moonCos = max(dot(rd, uMoonDir), 0.0);
        float moonDisc = smoothstep(0.99945, 0.9998, moonCos) * uNightFactor;
        float moonHalo = pow(moonCos, 24.0) * 0.22 * uNightFactor;
        sky += vec3(0.75, 0.86, 1.0) * (moonDisc * 2.5 + moonHalo) * (1.0 - uCloudCoverage * 0.72);

        vec3 aurora = renderAurora(rd);

        // Fast 4-step 3D Volumetric-Shaded Icelandic Storm Clouds (~6x faster, identical dramatic rolling storm billows!)
        if (rd.y > -0.02) {
          vec2 drift = uWindDir * (uTime * 0.011);
          vec2 sunStep = normalize(vec2(uSunDir.x + 0.55, uSunDir.z - 0.10)) * 0.24;

          float accumTrans = 1.0;
          vec3 accumLight = vec3(0.0);

          float upperLeftStorm = (1.0 - smoothstep(-0.45, 0.42, rd.x * 0.85 - rd.y * 0.16)) * smoothstep(0.03, 0.20, rd.y);
          float rightSilverBreak = smoothstep(-0.14, 0.56, rd.x * 0.85 - rd.z * 0.22 + (sunCos - 0.12) * 0.48);

          // Shared macro domain warp computed once per sky pixel instead of per slab
          vec2 baseUv = rd.xz * (1.0 / (max(rd.y, 0.025) + 0.24)) * 0.88;
          vec2 sharedWarp = vec2(
            (cloudFbm(baseUv * 0.68 + drift * 0.7) - 0.5) * 1.55,
            (cloudFbm(baseUv * 0.68 + vec2(4.7, 3.2) + drift * 0.7) - 0.5) * 1.55
          );

          for (int i = 0; i < 4; i++) {
            float fi = float(i) / 3.0;
            float hSlab = mix(0.68, 1.55, fi);
            vec2 pUv = baseUv * hSlab + drift * mix(1.4, 0.6, fi);
            vec2 w = sharedWarp * mix(1.0, 0.72, fi);

            float nMacro = cloudFbm(pUv * 1.05 + w);
            float nPuff  = gnoise(pUv * 2.75 - w * 0.45 + vec2(6.4, -2.8));

            float billow = clamp((nMacro - 0.5) * 2.6 + 0.5, 0.0, 1.0) * 0.72 +
                           clamp((nPuff  - 0.5) * 2.2 + 0.5, 0.0, 1.0) * 0.28;
            float rawField = billow + upperLeftStorm * 0.22 * (1.0 - fi * 0.65) * uCloudDarkness;

            // Clear days (low coverage) keep wide blue sky with a few crisp scattered white cumulus clouds!
            float thresh = mix(0.74, 0.24, uCloudCoverage);
            float dens = smoothstep(thresh, thresh + mix(0.22, 0.42, uCloudCoverage), rawField);

            if (dens > 0.01) {
              float dLitRaw = cloudFbm((pUv + sunStep * (1.1 + fi)) * 1.05 + w);
              float dLit = clamp((dLitRaw - 0.5) * 2.6 + 0.5, 0.0, 1.0);
              float shadowDens = smoothstep(thresh, thresh + 0.38, dLit);

              float heightLit = mix(0.14, 1.0, pow(fi, 0.78));
              float beer = exp(-shadowDens * (1.35 + 1.55 * uCloudDarkness)) * heightLit;
              float edgeRim = clamp((billow - dLit) * 2.2 + 0.25, 0.0, 1.0);

              // Fair-weather sunlit white cumulus with soft sky-blue shaded undersides vs moody dark Icelandic storm clouds
              vec3 darkBelly = mix(vec3(0.42, 0.52, 0.66), vec3(0.036, 0.046, 0.056), smoothstep(0.12, 0.75, uCloudDarkness));
              vec3 midStorm  = mix(vec3(0.74, 0.80, 0.88), vec3(0.24,  0.29,  0.34),  smoothstep(0.12, 0.75, uCloudDarkness));
              vec3 silverLit = mix(vec3(1.00, 0.97, 0.91), vec3(0.92,  0.95,  0.98),  smoothstep(0.12, 0.75, uCloudDarkness));

              float bellyCore = smoothstep(0.42, 0.85, billow) * (1.0 - fi * 0.72) * uCloudDarkness;
              vec3 stepCol = mix(midStorm, darkBelly, clamp(bellyCore * 0.92 + (1.0 - beer) * mix(0.24, 0.48, uCloudDarkness), 0.0, 1.0));
              float silverAmt = clamp(
                rightSilverBreak * (0.28 + 0.72 * fi) * (1.0 - bellyCore * 0.78) +
                pow(beer, 1.20) * mix(0.84, 0.58, uCloudDarkness) +
                edgeRim * 0.26 * (1.0 - bellyCore * 0.6),
                0.0,
                1.0
              );
              stepCol = mix(stepCol, silverLit, silverAmt);
              stepCol *= mix(uSunColor * 1.06, mix(vec3(0.88, 0.92, 0.96), uSunColor * 1.12, 0.45), smoothstep(0.15, 0.75, uCloudDarkness));

              vec3 nightStep = mix(vec3(0.012, 0.018, 0.026), vec3(0.056, 0.074, 0.102), clamp(beer * 1.1 + rightSilverBreak * 0.3, 0.0, 1.0));
              nightStep += aurora * 0.24;
              stepCol = mix(stepCol, nightStep, uNightFactor);
              stepCol += vec3(0.68, 0.80, 1.0) * uLightning * (0.35 + 0.65 * beer);

              float stepAlpha = dens * mix(0.56, 0.42, fi) * clamp(0.45 + uCloudCoverage * 0.65, 0.0, 1.0);
              accumLight += accumTrans * stepCol * stepAlpha;
              accumTrans *= (1.0 - stepAlpha);
              if (accumTrans < 0.03) break;
            }
          }

          float totalAlpha = clamp((1.0 - accumTrans) * smoothstep(-0.02, 0.055, rd.y), 0.0, 0.98);
          vec3 finalCloud = accumLight / max(1.0 - accumTrans, 0.001);

          sky += aurora * (1.0 - totalAlpha * 0.72);
          sky = mix(sky, finalCloud, totalAlpha);
        } else {
          sky += aurora;
        }

  // 16 independent rolling gust waves x 10 overlapping ultra-soft cloud billboards per wave (160 puffs, 1 draw call!)
  // Bottom-anchored cleanly above 5-point local terrain footprint -> lush billowing clouds with ZERO low-poly shapes & ZERO hard cuts!
  const WAVE_COUNT = 16;
  const PUFFS_PER_WAVE = 10;
  const TOTAL_WAVE_PUFFS = WAVE_COUNT * PUFFS_PER_WAVE;

  const waveGeo = new THREE.PlaneGeometry(1, 1);
  // aWave: x = seed, y = puffFade, z = width, w = height
  const waveAttr = new Float32Array(TOTAL_WAVE_PUFFS * 4);
  const waveAttrBuf = new THREE.InstancedBufferAttribute(waveAttr, 4);
  waveGeo.setAttribute('aWave', waveAttrBuf);

  const stormWaves = [];
  for (let w = 0; w < WAVE_COUNT; w++) {
    const puffs = [];
    for (let p = 0; p < PUFFS_PER_WAVE; p++) {
      const latFrac = (p / (PUFFS_PER_WAVE - 1)) - 0.5; // -0.5..+0.5 across the rolling wave front
      puffs.push({
        latOff: latFrac * (22.0 + Math.random() * 14.0) + (Math.random() - 0.5) * 4.5,
        alongOff: -Math.abs(latFrac) * 6.0 + (Math.random() - 0.5) * 9.0,
        yLift: 0.25 + Math.random() * 1.4,
        w: 10.5 + Math.random() * 10.0,
        h: 4.0 + Math.random() * 3.8,
        seed: Math.random() * 90.0,
        phaseOff: (Math.random() - 0.5) * 0.14
      });
    }
    stormWaves.push({
      x: 0,
      z: 0,
      speed: 7.2 + Math.random() * 4.4, // brisk rolling storm-cloud wave front
      age: w / WAVE_COUNT,              // evenly staggered -> wave after wave continuously rolls over random ground spots!
      life: 9.5 + Math.random() * 6.5,
      init: false,
      puffs
    });
  }

  const waveMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    uniforms: {
      ...ATMO_UNIFORMS,
      uRainIntensity: { value: 0.0 }
    },
    vertexShader: /* glsl */`
      attribute vec4 aWave;
      uniform float uRainIntensity;
      varying vec2 vUv;
      varying float vFade;
      varying float vSeed;
      varying vec3 vWorldPos;

      void main() {
        vUv = uv;
        vSeed = aWave.x;
        vec3 center = (instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
        vec3 camRight = vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]);
        vec3 camUp = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);
        // Bottom-anchored upright-biased cloud billboard (0..h cleanly above ground -> soft fluffy mist, zero sharp cuts!)
        vec3 upAxis = normalize(mix(vec3(0.0, 1.0, 0.0), camUp, 0.34));
        vec3 wp = center + camRight * (position.x * aWave.z) + upAxis * ((position.y + 0.5) * aWave.w);
        vWorldPos = wp;

        float d = length(center - cameraPosition);
        float nearF = smoothstep(5.0, 15.0, d);
        float farF = 1.0 - smoothstep(68.0, 112.0, d);
        float stormGate = smoothstep(0.60, 0.98, uRainIntensity);
        vFade = nearF * farF * aWave.y * stormGate;

        gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      varying vec2 vUv;
      varying float vFade;
      varying float vSeed;
      varying vec3 vWorldPos;
      ${ATMO_GLSL_PARS}

      void main() {
        if (vFade <= 0.002) discard;

        // Ultra-soft Gaussian elliptical cloud silhouette + deep bottom feathering (zero quad or ground edges!)
        vec2 c = (vUv - 0.5) * 2.0;
        float r2 = dot(c, c);
        if (r2 >= 0.95) discard;
        float radial = exp(-r2 * 2.95) * (1.0 - smoothstep(0.28, 0.95, r2));
        float baseSoft = smoothstep(0.0, 0.40, vUv.y);

        vec2 q = vUv * vec2(1.65, 2.45) + vec2(vSeed, vSeed * 0.41);
        vec2 warp = vec2(
          atmoGNoise(q * 1.4 + streamFlow * 0.65) - 0.5,
          atmoGNoise(q * 1.4 + vec2(4.3, -2.7) + streamFlow * 0.65) - 0.5
        ) * 0.55;
        float cloudMacro = atmoFbm(q + warp + streamFlow * 0.90);
        float streamFine = atmoFbm(vUv * vec2(2.3, 5.8) + warp * 0.6 + streamFlow * 1.55 + vec2(vSeed * 0.3, 1.9));
        float density = smoothstep(0.22, 0.78, cloudMacro * 0.60 + streamFine * 0.40);

        float alpha = radial * baseSoft * density * vFade * 0.25;
        if (alpha < 0.004) discard;

        // Soft 3D cloud self-shading harmonized with storm sky luminance
        float topLit = smoothstep(0.14, 0.88, vUv.y + (cloudMacro - 0.5) * 0.34);
        vec3 darkBelly = mix(uFogColor * 0.78, vec3(0.035, 0.055, 0.080), uNightFactor * 0.88);
        vec3 brightCrest = mix(uFogLowColor * mix(1.14, 1.02, uCloudDarkness), vec3(0.085, 0.125, 0.175), uNightFactor * 0.85);

  const waveMesh = new THREE.InstancedMesh(waveGeo, waveMat, TOTAL_WAVE_PUFFS);
  waveMesh.frustumCulled = false;
  waveMesh.renderOrder = 14;
  scene.add(waveMesh);

  // 4. Ultra-Thin Short-Range Wind-Blown Water-Stream Filaments Peeling Off the Player's Suit & Pack!
  const DROPLET_COUNT = 88;
  const dropletGeo = new THREE.PlaneGeometry(1, 1);
  const dropletSeeds = new Float32Array(DROPLET_COUNT * 4);
  for (let i = 0; i < DROPLET_COUNT; i++) {
    dropletSeeds[i * 4] = i / DROPLET_COUNT;
    dropletSeeds[i * 4 + 1] = 0.78 + Math.random() * 0.72;
    dropletSeeds[i * 4 + 2] = (Math.random() - 0.5) * 0.48;
    dropletSeeds[i * 4 + 3] = 0.92 + Math.random() * 0.84;
  }
  dropletGeo.setAttribute('aDrop', new THREE.InstancedBufferAttribute(dropletSeeds, 4));

  const playerDropletMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    uniforms: {
      ...ATMO_UNIFORMS,
      uRainIntensity: { value: 0.0 }
    },
    vertexShader: /* glsl */`
      attribute vec4 aDrop;
      uniform float uTime;
      uniform vec3 uPlayerPos;
      uniform vec2 uWindDir;
      uniform float uWindStrength;
      uniform float uRainIntensity;
      varying vec2 vUv;
      varying float vFade;
      varying float vSeed;

      void main() {
        vUv = uv;
        float lifeSpeed = (1.85 + uWindStrength * 0.75) * aDrop.y;
        float age = fract(uTime * lifeSpeed + aDrop.x);
        float seed = aDrop.x * 73.1;
        vSeed = seed;

        vec3 windAxis = normalize(vec3(uWindDir.x, 0.0, uWindDir.y));
        vec3 sideAxis = vec3(-windAxis.z, 0.0, windAxis.x);

        // Short-range wind-sheared stream trajectory peeling cleanly off hood, shoulders & cargo pack
        float travel = pow(max(age, 0.0001), 0.80) * (0.18 + uWindStrength * 0.42);
        float dropArc = age * (0.04 + fract(seed * 3.7) * 0.08) - age * age * 0.24;
        float spreadSide = aDrop.z + sin(seed * 5.3 + age * 4.5) * (0.02 + age * 0.07);
        float depthOff = (fract(seed * 1.9) - 0.5) * 0.26;

        vec3 center = uPlayerPos
          + vec3(0.0, aDrop.w + dropArc, 0.0)
          + sideAxis * spreadSide
          + windAxis * (depthOff + travel);

        vec3 camUp = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);
        vec3 streamDir = normalize(vec3(windAxis.x, -0.14 - age * 0.22, windAxis.z));
        vec3 toCam = cameraPosition - center;
        vec3 toCamN = length(toCam) > 0.001 ? normalize(toCam) : vec3(0.0, 0.0, 1.0);
        vec3 rawUp = cross(toCamN, streamDir);
        vec3 safeUp = length(rawUp) > 0.001 ? normalize(rawUp) : camUp;

        // Delicate thin wind-stream filament (sleek length 0.14..0.34m, razor-thin 0.006..0.014m -> zero chunky droplets!)
        float lenSize = mix(0.14, 0.34, age) * (0.75 + fract(seed * 7.1) * 0.55);
        float thinSize = mix(0.006, 0.014, age) * (0.80 + fract(seed * 11.3) * 0.45);
        vec3 wp = center + streamDir * (position.x * lenSize) + safeUp * (position.y * thinSize);

        float lifeFade = smoothstep(0.0, 0.16, age) * (1.0 - smoothstep(0.45, 1.0, age));
        float rainGate = smoothstep(0.55, 0.96, uRainIntensity);
        vFade = lifeFade * rainGate;

        gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      varying vec2 vUv;
      varying float vFade;
      varying float vSeed;
      ${ATMO_GLSL_PARS}

      void main() {
        if (vFade <= 0.004) discard;
        vec2 uvC = clamp(vUv, 0.0, 1.0);
        // Ultra-thin Gaussian cross-section + smooth tapered stream ends (reads as wispy wind-blown water stream!)
        float dy = (uvC.y - 0.5) * 2.0;
        float crossBlur = exp(-dy * dy * 4.8) * (1.0 - smoothstep(0.20, 1.0, abs(dy)));
        float alongTaper = pow(max(sin(uvC.x * 3.14159265), 0.0), 1.45);
        float wisp = 0.72 + 0.28 * sin(uvC.x * 11.0 - uTime * 18.0 + vSeed);
        float alpha = crossBlur * alongTaper * wisp * vFade * 0.19;
        if (alpha < 0.006) discard;
        vec3 col = mix(mix(uFogLowColor * 1.15, vec3(0.80, 0.85, 0.90) * uSunColor, 0.42), vec3(0.14, 0.22, 0.32), uNightFactor * 0.82);
        gl_FragColor = vec4(col, alpha);
      }
    `
  });

  const playerDropletMesh = new THREE.InstancedMesh(dropletGeo, playerDropletMat, DROPLET_COUNT);
  playerDropletMesh.frustumCulled = false;
  playerDropletMesh.renderOrder = 16;
  scene.add(playerDropletMesh);

  const _dummy = new THREE.Object3D();
  const _clearOut = { baseY: 0, clearFade: 1 };

  function spawnRandomSpot(obj, anchorX, anchorZ, minR, maxR, windX, windZ, biasUpwind) {
    const ang = Math.random() * Math.PI * 2;
    const rad = minR + Math.sqrt(Math.random()) * (maxR - minR);
    obj.x = anchorX + Math.cos(ang) * rad - (biasUpwind ? windX * (maxR * 0.42) : 0);
    obj.z = anchorZ + Math.sin(ang) * rad - (biasUpwind ? windZ * (maxR * 0.42) : 0);
    obj.age = biasUpwind ? 0.0 : obj.age;
    obj.init = true;
  }

  // Sample 5-point terrain footprint so flowing cloud billboards stay cleanly above rolling ground & fade gently near sheer cliffs!
  function evalTerrainClearance(px, pz, halfR, puffH) {
    const cH = getTerrainHeight(px, pz);
    const hE = getTerrainHeight(px + halfR, pz);
    const hW = getTerrainHeight(px - halfR, pz);
    const hN = getTerrainHeight(px, pz - halfR);
    const hS = getTerrainHeight(px, pz + halfR);
    const maxH = Math.max(cH, hE, hW, hN, hS);
    const minH = Math.min(cH, hE, hW, hN, hS);
    const relief = maxH - minH;
    const t = Math.min(1, Math.max(0, (relief - puffH * 0.55) / Math.max(puffH * 0.95, 2.2)));
    _clearOut.baseY = maxH + 0.12;
    _clearOut.clearFade = 1.0 - t * t * (3.0 - 2.0 * t);
    return _clearOut;
  }

  function update(camera, rainIntensity, playerPos, dt = 0.016) {
    const safeDt = Math.min(dt || 0.016, 0.05);
    const windX = ATMO_UNIFORMS.uWindDir.value.x;
    const windZ = ATMO_UNIFORMS.uWindDir.value.y;
    const sideX = -windZ;
    const sideZ = windX;
    const windStr = ATMO_UNIFORMS.uWindStrength.value;

    const ax = playerPos ? playerPos.x : camera.position.x;
    const az = playerPos ? playerPos.z : camera.position.z;

    rainMat.uniforms.uCamPos.value.copy(camera.position);
    rainMat.uniforms.uRainIntensity.value = rainIntensity;
    rainMesh.visible = rainIntensity > 0.02;

    // Update Wave-After-Wave Flowing Storm Cloud Billboards
    waveMat.uniforms.uRainIntensity.value = rainIntensity;
    waveMesh.visible = rainIntensity > 0.58;
    if (waveMesh.visible) {
      let idx = 0;
      for (let w = 0; w < WAVE_COUNT; w++) {
        const wave = stormWaves[w];
        if (!wave.init) {
          spawnRandomSpot(wave, ax, az, 12.0, 92.0, windX, windZ, false);
        } else {
          const step = wave.speed * (0.58 + windStr * 0.62) * safeDt;
          wave.x += windX * step;
          wave.z += windZ * step;
          wave.age += safeDt / wave.life;
          if (wave.age >= 1.0 || Math.hypot(wave.x - ax, wave.z - az) > 108.0) {
            spawnRandomSpot(wave, ax, az, 14.0, 86.0, windX, windZ, true);
          }
        }

        const baseLife = Math.min(1, Math.max(0, wave.age));
        const waveFade = Math.pow(Math.max(Math.sin(baseLife * Math.PI), 0.0), 0.72);
        const swellScale = 0.78 + 0.42 * Math.sin(baseLife * Math.PI);

        for (let p = 0; p < PUFFS_PER_WAVE; p++) {
          const pf = wave.puffs[p];
          const px = wave.x + sideX * pf.latOff + windX * pf.alongOff;
          const pz = wave.z + sideZ * pf.latOff + windZ * pf.alongOff;
          const pw = pf.w * swellScale;
          const ph = pf.h * swellScale;
          const clr = evalTerrainClearance(px, pz, pw * 0.36, ph);
          const puffFade = Math.min(1, Math.max(0, waveFade + pf.phaseOff * waveFade)) * clr.clearFade;

          _dummy.position.set(px, clr.baseY + pf.yLift, pz);
          _dummy.rotation.set(0, 0, 0);
          _dummy.scale.set(1, 1, 1);
          _dummy.updateMatrix();
          waveMesh.setMatrixAt(idx, _dummy.matrix);

          waveAttr[idx * 4] = pf.seed;
          waveAttr[idx * 4 + 1] = puffFade;
          waveAttr[idx * 4 + 2] = pw;
          waveAttr[idx * 4 + 3] = ph;
          idx++;
        }
      }
      waveMesh.instanceMatrix.needsUpdate = true;
      waveAttrBuf.needsUpdate = true;
    }

    playerDropletMat.uniforms.uRainIntensity.value = rainIntensity;
    playerDropletMesh.visible = rainIntensity > 0.50;
  }

  return { update };
}

return { createWeatherFX };
})();

// --- terrain.js ---
const __mod_terrain = (() => {
const {clamp,
  mix,
  smoothstep,
  hash2i,
  fbm2,
  ridged2} = __mod_noise;
const {CELL_SIZE,
  getCellFeatures,
  sampleWorld,
  getTerrainHeight,
  getTerrainNormal} = __mod_world;
const {ATMO_UNIFORMS, ATMO_GLSL_PARS, enhanceMaterialWithAtmo} = __mod_atmosphere;
/**
 * High-Performance Infinite 4-LOD Terrain Chunk Streamer + Far Horizon Mountain Ring,
 * Branched Non-Repeating Triplanar Basalt & Woolly Moss PBR Shader,
 * Multi-Scale Basalt Boulders, Small Cobbles & Volcanic Stone Clusters,
 * and Multi-Colored Icelandic Lupin Drifts, Sparse Grass, Bushes & Cotton Grass.
 */




const CHUNK_SIZE = 160;
const GRID_RADIUS = 6; // 13 x 13 live chunks = 2080m x 2080m high-detail terrain before far horizon ring!
const LOD_SEGS = [72, 48, 32, 20]; // Crisp silhouette geometry even 1km+ away (zero low-poly pyramids!)
const SKIRT_DROP = 18.0;
const MAX_BUILDS_PER_FRAME = 2;

function getLodForRing(ringDist) {
  if (ringDist <= 1) return 0; // 0..240m: 72x72 (2.2m grid)
  if (ringDist <= 2) return 1; // 240..400m: 48x48 (3.3m grid)
  if (ringDist <= 4) return 2; // 400..720m: 32x32 (5.0m grid)
  return 3;                    // 720..1040m: 20x20 (8.0m grid)
}

/**
 * Build local-space terrain chunk geometry with edge skirts.
 * Samples sampleWorld ONCE per vertex and derives smooth normals directly from the height grid (5x faster!).
 */
function buildChunkGeometry(cx, cz, segs) {
  const worldOriginX = cx * CHUNK_SIZE;
  const worldOriginZ = cz * CHUNK_SIZE;
  const gridN = segs + 1;
  const step = CHUNK_SIZE / segs;
  const mainVertCount = gridN * gridN;
  const skirtVertCount = gridN * 4;
  const totalVerts = mainVertCount + skirtVertCount;

  const positions = new Float32Array(totalVerts * 3);
  const normals = new Float32Array(totalVerts * 3);
  const surfAttr = new Float32Array(totalVerts * 4);
  const hydroAttr = new Float32Array(totalVerts * 4);
  const caveAttr = new Float32Array(totalVerts * 3);

  const tmpSample = {
    height: 0, moss: 0, cliff: 0, path: 0, scree: 0,
    riverDepth: 0, riverMask: 0, flowX: 0, flowZ: 1, snow: 0, glacier: 0, wetness: 0, hummockAO: 0.5,
    caveSignedD: 99, caveWaterY: 16, caveOverburden: 0
  };

  for (let iz = 0; iz <= segs; iz++) {
    const lz = (iz / segs - 0.5) * CHUNK_SIZE;
    const wz = worldOriginZ + lz;
    for (let ix = 0; ix <= segs; ix++) {
      const lx = (ix / segs - 0.5) * CHUNK_SIZE;
      const wx = worldOriginX + lx;
      const vi = iz * gridN + ix;

      sampleWorld(wx, wz, tmpSample);

      positions[vi * 3] = lx;
      positions[vi * 3 + 1] = tmpSample.height;
      positions[vi * 3 + 2] = lz;

      surfAttr[vi * 4] = tmpSample.glacier || 0;
      surfAttr[vi * 4 + 1] = tmpSample.cliff;
      surfAttr[vi * 4 + 2] = tmpSample.path;
      surfAttr[vi * 4 + 3] = tmpSample.scree;

      hydroAttr[vi * 4] = tmpSample.wetness;
      hydroAttr[vi * 4 + 1] = tmpSample.riverMask;
      hydroAttr[vi * 4 + 2] = tmpSample.hummockAO;
      hydroAttr[vi * 4 + 3] = tmpSample.snow;

      caveAttr[vi * 3] = tmpSample.caveSignedD;
      caveAttr[vi * 3 + 1] = tmpSample.caveWaterY;
      caveAttr[vi * 3 + 2] = tmpSample.caveOverburden;
    }
  }

  // Compute smooth analytical grid normals from neighboring heights (matches border vertices across chunks!)
  for (let iz = 0; iz <= segs; iz++) {
    const wz = worldOriginZ + (iz / segs - 0.5) * CHUNK_SIZE;
    for (let ix = 0; ix <= segs; ix++) {
      const wx = worldOriginX + (ix / segs - 0.5) * CHUNK_SIZE;
      const vi = iz * gridN + ix;

      const hL = ix > 0 ? positions[(vi - 1) * 3 + 1] : getTerrainHeight(wx - step, wz);
      const hR = ix < segs ? positions[(vi + 1) * 3 + 1] : getTerrainHeight(wx + step, wz);
      const hD = iz > 0 ? positions[(vi - gridN) * 3 + 1] : getTerrainHeight(wx, wz - step);
      const hU = iz < segs ? positions[(vi + gridN) * 3 + 1] : getTerrainHeight(wx, wz + step);

      const nx = hL - hR;
      const ny = 2.0 * step;
      const nz = hD - hU;
      const invLen = 1.0 / Math.sqrt(nx * nx + ny * ny + nz * nz);
      normals[vi * 3] = nx * invLen;
      normals[vi * 3 + 1] = ny * invLen;
      normals[vi * 3 + 2] = nz * invLen;
    }
  }

  const indices = new Uint32Array(segs * segs * 6 + segs * 4 * 6);
  let ip = 0;
  for (let iz = 0; iz < segs; iz++) {
    for (let ix = 0; ix < segs; ix++) {
      const a = iz * gridN + ix;
      const b = a + 1;
      const c = a + gridN;
      const d = c + 1;
      indices[ip++] = a; indices[ip++] = c; indices[ip++] = b;
      indices[ip++] = b; indices[ip++] = c; indices[ip++] = d;
    }
  }

  let sv = mainVertCount;
  const addSkirtStrip = (edgeIndices, reverseWinding) => {
    const startSv = sv;
    for (let i = 0; i < edgeIndices.length; i++) {
      const src = edgeIndices[i];
      positions[sv * 3] = positions[src * 3];
      positions[sv * 3 + 1] = positions[src * 3 + 1] - SKIRT_DROP;
      positions[sv * 3 + 2] = positions[src * 3 + 2];
      normals[sv * 3] = normals[src * 3];
      normals[sv * 3 + 1] = normals[src * 3 + 1];
      normals[sv * 3 + 2] = normals[src * 3 + 2];
      for (let k = 0; k < 4; k++) {
        surfAttr[sv * 4 + k] = surfAttr[src * 4 + k];
        hydroAttr[sv * 4 + k] = hydroAttr[src * 4 + k];
      }
      for (let k = 0; k < 3; k++) {
        caveAttr[sv * 3 + k] = caveAttr[src * 3 + k];
      }
      sv++;
    }
    for (let i = 0; i < edgeIndices.length - 1; i++) {
      const t0 = edgeIndices[i];
      const t1 = edgeIndices[i + 1];
      const b0 = startSv + i;
      const b1 = startSv + i + 1;
      if (reverseWinding) {
        indices[ip++] = t0; indices[ip++] = t1; indices[ip++] = b0;
        indices[ip++] = t1; indices[ip++] = b1; indices[ip++] = b0;
      } else {
        indices[ip++] = t0; indices[ip++] = b0; indices[ip++] = t1;
        indices[ip++] = t1; indices[ip++] = b0; indices[ip++] = b1;
      }
    }
  };

  const topEdge = [];
  const botEdge = [];
  const leftEdge = [];
  const rightEdge = [];
  for (let i = 0; i <= segs; i++) {
    topEdge.push(i);
    botEdge.push(segs * gridN + i);
    leftEdge.push(i * gridN);
    rightEdge.push(i * gridN + segs);
  }
  // Outward-facing skirt winding (closes 100% of LOD chunk-border sky cracks on steep cliffs!)
  addSkirtStrip(topEdge, true);
  addSkirtStrip(botEdge, false);
  addSkirtStrip(leftEdge, false);
  addSkirtStrip(rightEdge, true);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
  geo.setAttribute('aSurf', new THREE.BufferAttribute(surfAttr, 4));
  geo.setAttribute('aHydro', new THREE.BufferAttribute(hydroAttr, 4));
  geo.setAttribute('aCave', new THREE.BufferAttribute(caveAttr, 3));
  geo.setIndex(new THREE.BufferAttribute(indices, 1));
  geo.computeBoundingSphere();
  return geo;
}

/** Build organically jagged volcanic basalt boulder geometry (detail=2 -> 320 tris). */
function createNaturalBasaltRockGeo(seed = 101, detail = 2, verticalBias = 0.84) {
  const geo = new THREE.IcosahedronGeometry(1.0, detail);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();

  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const nx = v.x;
    const ny = v.y;

  const blades = 36;

  const colors = [];

  for (let i = 0; i < blades; i++) {

    // Spread across a natural 2.0m meadow patch so adjacent patches weave seamlessly into a continuous grassy carpet!
    const rad = Math.sqrt(hash2i(i, 13, 801)) * 1.02;
    const h = 0.16 + hash2i(i, 17, 801) * 0.24;
    const arch = 0.08 + hash2i(i, 19, 801) * 0.16;
    const w = 0.011 + hash2i(i, 23, 801) * 0.008;
    const dx = Math.cos(ang);
    const dz = Math.sin(ang);
    const px = -dz * w;
    const pz = dx * w;
    const bx = dx * rad;
    const bz = dz * rad;

    const kind = hash2i(i, 29, 801);
    const baseCol = [0.085, 0.125, 0.032];
    // Vibrant sunlit olive-gold & chartreuse grass matching Death Stranding reference foreground!
    const midCol = kind > 0.70 ? [0.34, 0.34, 0.11] : kind > 0.30 ? [0.22, 0.31, 0.072] : [0.18, 0.27, 0.082];
    const tipCol = kind > 0.70 ? [0.54, 0.50, 0.16] : kind > 0.30 ? [0.38, 0.45, 0.12] : [0.29, 0.38, 0.12];

    const p1x = bx + dx * arch * 0.45;
    const p1z = bz + dz * arch * 0.45;
    const p2x = bx + dx * arch * 1.05;
    const p2z = bz + dz * arch * 1.05;

    pos.push(
      bx - px, 0.0, bz - pz,
      bx + px, 0.0, bz + pz,
      p1x - px * 0.52, h * 0.55, p1z - pz * 0.52,

    );
    const nCols = [baseCol, baseCol, midCol, tipCol];
    for (let k = 0; k < 4; k++) {
      norm.push(dx * 0.20, 0.96, dz * 0.20);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(norm, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.setIndex(idx);
  return geo;

/**
 * Build lightweight multi-colored Icelandic Lupin cluster (58 tris) with an `aPetalMask` vertex attribute:
 * - aPetalMask = 0.0 on stems & palmate basal leaves (always stays dusty blue-green!)
 * - aPetalMask = 1.0 on flower florets (tinted per-instance across violet, sky-blue, rose-pink, plum & white!)
 */
function createLupinClusterGeo() {
  const pos = [];
  const norm = [];
  const colors = [];
  const petalMask = [];
  const idx = [];
  let vBase = 0;

  const pushTri = (ax, ay, az, bx, by, bz, cx, cy, cz, col, nx, ny, nz, isPetal) => {
    pos.push(ax, ay, az, bx, by, bz, cx, cy, cz);
    for (let k = 0; k < 3; k++) {
      norm.push(nx, ny, nz);
      colors.push(col[0], col[1], col[2]);
      petalMask.push(isPetal);
    }
    idx.push(vBase, vBase + 1, vBase + 2);
    vBase += 3;
  };

  // 10 dusty blue-green palmate basal leaves (aPetalMask = 0)
  const leaves = 10;
  for (let i = 0; i < leaves; i++) {
    const a = (i / leaves) * Math.PI * 2 + hash2i(i, 3, 851) * 0.4;
    const r0 = 0.04 + hash2i(i, 5, 851) * 0.14;
    const len = 0.17 + hash2i(i, 7, 851) * 0.12;
    const h0 = 0.05 + hash2i(i, 9, 851) * 0.10;
    const dx = Math.cos(a);
    const dz = Math.sin(a);
    const px = -dz * 0.055;
    const pz = dx * 0.055;
    const bx = dx * r0;
    const bz = dz * r0;
    const shade = 0.80 + hash2i(i, 11, 851) * 0.34;
    pushTri(
      bx - px, h0 * 0.5, bz - pz,
      bx + px, h0 * 0.5, bz + pz,
      bx + dx * len, h0 + 0.05, bz + dz * len,
      [0.15 * shade, 0.26 * shade, 0.15 * shade],
      dx * 0.25, 0.94, dz * 0.25,
      0.0
    );
  }

  // 3 graceful lupin floral spires of varied height & lean (58 tris total!)
  const stems = [
    { ox: 0.0,   oz: 0.0,   h: 0.74, leanX: 0.04,  leanZ: 0.02 },
    { ox: 0.15,  oz: -0.10, h: 0.60, leanX: 0.08,  leanZ: -0.05 },
    { ox: -0.14, oz: 0.09,  h: 0.54, leanX: -0.07, leanZ: 0.06 }
  ];

  for (let s = 0; s < stems.length; s++) {
    const st = stems[s];
    const stemBaseH = st.h * 0.34;
    const bloomH = st.h * 0.66;

    const sw = 0.016;
    const mx = st.ox + st.leanX * 0.5;
    const mz = st.oz + st.leanZ * 0.5;
    pushTri(st.ox - sw, 0, st.oz, st.ox + sw, 0, st.oz, mx, st.h * 0.75, mz, [0.16, 0.25, 0.13], 0, 0.5, 0.85, 0.0);

    // 6 compact whorled tiers x 3 delicate florets (reads botanically fine even 1m from camera!)
    const tiers = 6;
    for (let t = 0; t < tiers; t++) {
      const f = t / (tiers - 1);
      const y = stemBaseH + f * bloomH;
      const cx = st.ox + st.leanX * (0.35 + f * 0.65);
      const cz = st.oz + st.leanZ * (0.35 + f * 0.65);
      const radius = mix(0.080, 0.024, Math.pow(f, 0.80));
      const florets = 3;

      // Subtle vertical value gradient from richer deeper lower florets to pale bud tip
      const lum = mix(0.74, 1.06, f);
      for (let k = 0; k < florets; k++) {
        const a = (k / florets) * Math.PI * 2 + t * 1.05 + s * 1.3;
        const dx = Math.cos(a);
        const dz = Math.sin(a);
        const px = -dz * radius * 0.68;
        const pz = dx * radius * 0.68;
        const tipX = cx + dx * radius;
        const tipZ = cz + dz * radius;
        const tipY = y + mix(0.02, 0.055, f);
        const vShade = lum * (0.86 + hash2i(t * 7 + k, s, 863) * 0.28);
        pushTri(
          cx - px, y - 0.02, cz - pz,
          cx + px, y - 0.02, cz + pz,
          tipX, tipY, tipZ,
          [vShade, vShade, vShade],
          dx * 0.65, 0.72, dz * 0.65,
          1.0
        );
      }
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(norm, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.setAttribute('aPetalMask', new THREE.Float32BufferAttribute(petalMask, 1));
  geo.setIndex(idx);
  return geo;
}

/**

function createIcelandicBushGeo() {
  const pos = [];
  const norm = [];
  const colors = [];
  const idx = [];
  let vBase = 0;

  const pushTri = (ax, ay, az, bx, by, bz, cx, cy, cz, col, nx, ny, nz) => {

    }
    idx.push(vBase, vBase + 1, vBase + 2);
    vBase += 3;
  };

  // 12 low spreading woody twigs + 96 tiny fine dark olive-sage heather sprigs forming a soft organic mound
  const branches = 12;
  for (let b = 0; b < branches; b++) {
    const a = (b / branches) * Math.PI * 2 + hash2i(b, 1, 901) * 0.42;
    const reach = 0.24 + hash2i(b, 2, 901) * 0.26;
    const bh = 0.18 + hash2i(b, 3, 901) * 0.20;
    const dx = Math.cos(a);
    const dz = Math.sin(a);
    const px = -dz * 0.011;
    const pz = dx * 0.011;
    pushTri(-px, 0, -pz, px, 0, pz, dx * reach * 0.9, bh * 0.85, dz * reach * 0.9, [0.045, 0.040, 0.028], 0, 0.85, 0.5);

    for (let l = 0; l < 8; l++) {
      const f = 0.16 + (l / 8) * 0.90;
      const domeY = Math.sin(clamp(f * 0.92, 0.08, 0.96) * Math.PI) * bh * 1.15 + 0.03;
      const spread = 0.07 + hash2i(b * 13 + l, 4, 901) * 0.14;
      const la = a + (hash2i(b, l * 7, 901) - 0.5) * 3.0;
      const lx = dx * reach * f + Math.cos(la) * spread * 0.55;
      const lz = dz * reach * f + Math.sin(la) * spread * 0.55;
      const ly = Math.max(0.025, domeY + (hash2i(l, b, 907) - 0.45) * 0.10);

      // Tiny fine leaf sprig (3..4cm wide, 6..11cm long -> zero origami triangles!)
      const ldx = Math.cos(la);
      const ldz = Math.sin(la);
      const halfW = 0.020 + hash2i(l, b * 3, 911) * 0.016;
      const lpx = -ldz * halfW;
      const lpz = ldx * halfW;
      const lLen = 0.068 + hash2i(b, l, 911) * 0.046;
      const tipUp = 0.038 + hash2i(b + l, 7, 919) * 0.048;

      const tint = hash2i(b * 19 + l, 5, 919);
      const radialAO = mix(0.42, 1.14, clamp(Math.hypot(lx, lz) / 0.44 * 0.45 + ly / 0.34 * 0.72, 0, 1));
      let cr, cg, cb;
      if (tint < 0.46) {
        // Natural rich dark Icelandic bilberry / crowberry shrub green
        cr = 0.068 * radialAO; cg = 0.135 * radialAO; cb = 0.048 * radialAO;

      } else {
        // Vibrant russet-red / copper-crimson Nordic autumn heather & berry leaves (matches reference foreground!)
        cr = 0.34 * radialAO; cg = 0.092 * radialAO; cb = 0.036 * radialAO;
      }
      pushTri(
        lx - lpx, ly, lz - lpz,
        lx + lpx, ly, lz + lpz,
        lx + ldx * lLen, ly + tipUp, lz + ldz * lLen,
        [cr, cg, cb],
        ldx * 0.35, 0.90, ldz * 0.35
      );
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(norm, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.setIndex(idx);
