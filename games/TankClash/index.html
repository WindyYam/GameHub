<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Clash — WW2 Armor Physics & Ballistics Simulation (Tiger I, Sherman, T-34-85)</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/math/SimplexNoise.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/SSAOShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/Pass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/SSAOPass.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111418;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 1;
        }
        #canvas-container canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            filter: saturate(1.14) contrast(1.07) brightness(0.98);
        }
        #canvas-container::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(8,14,24,0.38) 100%);
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .hud-panel {
            background: rgba(12, 16, 22, 0.48);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.40);
        }
        .hud-btn {
            background: rgba(20, 26, 35, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.15s ease;
        }
        /* Mobile Portrait Orientation Prompt Overlay */
        @media (max-width: 900px) and (orientation: portrait) {
            body.is-mobile #portrait-orientation-prompt {
                display: flex !important;
            }
        }
        .hud-btn:hover {
            background: rgba(51, 65, 85, 0.95);
            border-color: rgba(248, 250, 252, 0.6);
            transform: translateY(-1px);
        }
        .hud-btn.active {
            background: rgba(217, 119, 6, 0.9);
            border-color: rgba(251, 191, 36, 0.9);
            color: #fff;
        }
        /* TZF 9b Sniper Reticle Overlay */
        #sniper-overlay {
            pointer-events: none;
            z-index: 10;
            background: radial-gradient(circle, transparent 36%, rgba(0,0,0,0.96) 40%);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="text-slate-100">

    <!-- 3D WebGL Canvas -->
    <div id="canvas-container"></div>

    <!-- Gunner TZF 9b Optical Sight Overlay (Hidden unless in Sniper Mode) -->
    <div id="sniper-overlay" class="hidden fixed inset-0 flex items-center justify-center pointer-events-none">
        <svg class="w-full h-full max-w-[900px] max-h-[900px]" viewBox="0 0 600 600">
            <!-- Outer Sight Ring -->
            <circle cx="300" cy="300" r="265" stroke="rgba(20, 25, 30, 0.9)" stroke-width="6" fill="none"/>
            <!-- Range Scale Arc -->
            <circle cx="300" cy="300" r="235" stroke="rgba(255,255,255,0.45)" stroke-width="1" stroke-dasharray="4 8" fill="none"/>
            <!-- German TZF 9b Triangles & Stadia Lines -->
            <line x1="60" y1="300" x2="255" y2="300" stroke="#111" stroke-width="2.2"/>
            <line x1="345" y1="300" x2="540" y2="300" stroke="#111" stroke-width="2.2"/>
            <line x1="60" y1="300" x2="255" y2="300" stroke="rgba(255,255,255,0.75)" stroke-width="1"/>
            <line x1="345" y1="300" x2="540" y2="300" stroke="rgba(255,255,255,0.75)" stroke-width="1"/>
            <!-- Center Aiming Chevron (Main Triangle) -->
            <polygon points="300,300 291,322 309,322" fill="rgba(15,15,15,0.95)" stroke="rgba(255,255,255,0.7)" stroke-width="0.8"/>
            <!-- Side Mil Triangles -->
            <polygon points="270,300 265,312 275,312" fill="rgba(15,15,15,0.9)"/>
            <polygon points="240,300 236,309 244,309" fill="rgba(15,15,15,0.9)"/>
            <polygon points="330,300 325,312 335,312" fill="rgba(15,15,15,0.9)"/>
            <polygon points="360,300 356,309 364,309" fill="rgba(15,15,15,0.9)"/>
            <!-- Ballistic Drop Marks for 8.8cm PzGr. 39 -->
            <line x1="292" y1="335" x2="308" y2="335" stroke="#fbbf24" stroke-width="1.3"/>
            <text x="315" y="338" fill="#fbbf24" font-size="9" font-family="monospace">800m</text>
            <line x1="290" y1="355" x2="310" y2="355" stroke="#fbbf24" stroke-width="1.3"/>
            <text x="315" y="358" fill="#fbbf24" font-size="9" font-family="monospace">1200m</text>
            <line x1="288" y1="380" x2="312" y2="380" stroke="#fbbf24" stroke-width="1.3"/>
            <text x="315" y="383" fill="#fbbf24" font-size="9" font-family="monospace">1600m</text>
            <!-- Sight Telemetry -->
            <text id="sniper-telemetry-text" x="225" y="110" fill="#fbbf24" font-size="12" font-family="monospace" font-weight="bold">TZF 9b — 8.8cm KwK 36 L/56 (773 m/s)</text>
        </svg>
    </div>

    <!-- First Person Turret Aim Sight Overlay (Shown in FPV Mode) -->
    <div id="fpv-overlay" class="hidden fixed inset-0 pointer-events-none flex items-center justify-center z-10">
        <svg class="w-full h-full max-w-[800px] max-h-[800px] pointer-events-none" viewBox="0 0 600 600">
            <!-- Vignette Ring Frame -->
            <circle cx="300" cy="300" r="275" stroke="rgba(16, 185, 129, 0.28)" stroke-width="1.5" stroke-dasharray="6 12" fill="none"/>
            <circle cx="300" cy="300" r="285" stroke="rgba(15, 23, 42, 0.45)" stroke-width="6" fill="none"/>
            <!-- Stadiametric / Mil Crosshair Lines -->
            <line x1="130" y1="300" x2="270" y2="300" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.85"/>
            <line x1="330" y1="300" x2="470" y2="300" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.85"/>
            <line x1="300" y1="150" x2="300" y2="270" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.85"/>
            <line x1="300" y1="330" x2="300" y2="450" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.85"/>
            <!-- Mil Sub-ticks -->
            <line x1="210" y1="294" x2="210" y2="306" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.7"/>
            <line x1="240" y1="296" x2="240" y2="304" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.7"/>
            <line x1="360" y1="296" x2="360" y2="304" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.7"/>
            <line x1="390" y1="294" x2="390" y2="306" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.7"/>
            <!-- Ballistic Drop Ticks (KwK 36 773 m/s) -->
            <line x1="294" y1="340" x2="306" y2="340" stroke="#fbbf24" stroke-width="1.4"/>
            <text x="312" y="343" fill="#fbbf24" font-size="9" font-family="monospace">400m</text>
            <line x1="290" y1="360" x2="310" y2="360" stroke="#fbbf24" stroke-width="1.4"/>
            <text x="315" y="363" fill="#fbbf24" font-size="9" font-family="monospace">800m</text>
            <line x1="286" y1="385" x2="314" y2="385" stroke="#fbbf24" stroke-width="1.4"/>
            <text x="319" y="388" fill="#fbbf24" font-size="9" font-family="monospace">1200m</text>
            <!-- Center Aim Reticle Circle & Dot -->
            <circle cx="300" cy="300" r="14" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.9" fill="none"/>
            <circle cx="300" cy="300" r="2.5" fill="#34d399"/>
            <!-- Telemetry / Zoom Status -->
            <text id="fpv-gun-telemetry" x="300" y="245" text-anchor="middle" fill="#6ee7b7" font-size="11" font-family="monospace" font-weight="bold">8.8cm KwK 36 L/56 • 773 M/S</text>
            <text id="fpv-svg-range" x="300" y="485" text-anchor="middle" fill="#38bdf8" font-size="11" font-family="monospace" font-weight="bold">RANGE: 120m</text>
            <text id="fpv-svg-zoom" x="300" y="505" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="monospace">OPTICAL 1.0× [HOLD RMB / SCROLL: 3.5× ZOOM]</text>
        </svg>
    </div>

    <!-- DUAL BALLISTIC RETICLE HUD (Camera Target Crosshair + Actual 8.8cm Gun Bore Reticle) -->
    <div id="external-reticle" class="fixed inset-0 pointer-events-none z-10 overflow-hidden">
        <!-- 1. Camera Target Crosshair (Where Player is Aiming in 3D Space) -->
        <div id="camera-aim-reticle" class="absolute -translate-x-1/2 -translate-y-1/2 w-9 h-9 rounded-full border-2 border-white/75 flex items-center justify-center shadow-sm" style="left: 50%; top: 50%;">
            <div class="w-1.5 h-1.5 bg-white rounded-full"></div>
            <div class="absolute -top-2 w-0.5 h-2 bg-white/75"></div>
            <div class="absolute -bottom-2 w-0.5 h-2 bg-white/75"></div>
            <div class="absolute -left-2 w-2 h-0.5 bg-white/75"></div>
            <div class="absolute -right-2 w-2 h-0.5 bg-white/75"></div>
            <span id="aim-range-tag" class="absolute top-10 text-[10px] mono font-bold text-white/90 bg-slate-900/75 px-1.5 py-0.5 rounded whitespace-nowrap">120m</span>
        </div>

        <!-- 2. Actual 8.8cm KwK 36 Gun Bore Reticle (Dynamic Ballistic Circle converging onto Target) -->
        <div id="gun-bore-reticle" class="absolute -translate-x-1/2 -translate-y-1/2 w-7 h-7 rounded-full border-2 border-emerald-400 flex items-center justify-center transition-colors duration-75" style="left: 50%; top: 50%;">
            <div id="gun-bore-dot" class="w-2 h-2 bg-emerald-400 rounded-full"></div>
        </div>
    </div>

    <!-- Combat Status HUD Pill (Minimal translucent 1-line bar on top of screen) -->
    <div id="combat-mini-hud" class="fixed top-2.5 left-1/2 -translate-x-1/2 z-20 pointer-events-none flex items-center gap-2.5 px-3.5 py-1 rounded-full bg-black/40 backdrop-blur-md border border-white/10 text-[11px] mono text-slate-200 shadow-md whitespace-nowrap">
        <span>⚡ <strong id="mob-speed" class="text-white font-bold">0.0</strong> km/h</span>
        <span class="text-slate-600">|</span>
        <span>💥 <strong id="mob-reload" class="text-emerald-400 font-bold">READY</strong></span>
        <span class="text-slate-600">|</span>
        <span>🎯 <strong id="mob-hits" class="text-amber-300 font-bold">Hits: 0</strong></span>
    </div>

    <!-- TOP BAR: Tank Designation & Quick Camera Controls -->
    <div class="fixed top-2 left-2 right-2 md:top-3 md:left-3 md:right-3 z-20 flex items-center justify-between gap-2 pointer-events-none">
        <!-- Title Badge (Hidden on mobile to maximize viewport) -->
        <div class="hud-panel px-3 py-2 rounded-xl pointer-events-auto hidden md:flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-slate-800/80 border border-slate-600 flex flex-col items-center justify-center shrink-0">
                <span id="tank-badge-num" class="mono text-xs font-bold text-amber-400 leading-none">3818</span>
                <span id="tank-badge-sub" class="text-[8px] text-slate-400 tracking-wider mt-0.5">TIGER I</span>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <h1 id="tank-hud-name" class="font-extrabold text-sm tracking-tight text-white">Pz.Kpfw. VI Tiger Ausf. E</h1>
                    <span id="tank-nation-tag" class="text-[9px] mono uppercase px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/40">🇩🇪 Germany</span>
                </div>
                <p id="tank-hud-desc" class="text-[10px] text-slate-300">8.8 cm KwK 36 L/56 • 57 t • Dual-Reticle Ballistics</p>
            </div>
        </div>

        <!-- Tank Selection Switcher (Center) -->
        <div id="panel-tank-selector" class="hud-panel px-1.5 py-1 rounded-full md:rounded-xl pointer-events-auto flex items-center gap-1 shadow-lg ml-auto">
            <button data-tank="tiger" class="hud-btn tank-select-btn active px-2.5 py-1 rounded-lg text-[11px] font-bold flex items-center gap-1 text-amber-300 hover:text-white" title="Pz.VI Tiger I [Key: 1]">
                <span>🇩🇪</span><span>Tiger I</span>
            </button>
            <button data-tank="sherman" class="hud-btn tank-select-btn px-2.5 py-1 rounded-lg text-[11px] font-bold flex items-center gap-1 text-lime-300 hover:text-white opacity-70" title="M4 Sherman [Key: 2]">
                <span>🇺🇸</span><span>Sherman</span>
            </button>
            <button data-tank="t34" class="hud-btn tank-select-btn px-2.5 py-1 rounded-lg text-[11px] font-bold flex items-center gap-1 text-red-300 hover:text-white opacity-70" title="T-34-85 [Key: 3]">
                <span>🇵🇱</span><span>T-34-85</span>
            </button>
        </div>

        <!-- Mode & Camera Switchers -->
        <div id="panel-views" class="hud-panel px-2 py-1 rounded-full md:rounded-xl pointer-events-auto flex items-center gap-1 transition-all ml-auto">
            <div id="panel-views-content" class="flex items-center gap-1">
                <button id="cam-orbit" class="hud-btn active px-2.5 py-1 rounded-lg text-[11px] font-semibold" title="Follow Aim Camera">📷 Follow</button>
                <button id="cam-fpv" class="hud-btn px-2.5 py-1 rounded-lg text-[11px] font-semibold text-emerald-300" title="First-Person Gunner Mode">🎯 FPV</button>
                <button id="btn-time-cycle" class="hud-btn px-2.5 py-1 rounded-lg text-[11px] font-semibold text-amber-300" title="Cycle Day / Night (T)">☀️ <span id="hud-time-label">10:30</span></button>
                <button id="btn-restart" class="hud-btn px-2.5 py-1 rounded-lg text-[11px] font-bold text-amber-300 hover:text-white" title="Restart with New Seed [Key: R]">🔄 Reset [R]</button>
                <span id="hud-seed-display" class="mono text-[10px] text-amber-300/90 font-semibold px-2 py-0.5 rounded bg-amber-500/10 border border-amber-500/30 hidden lg:inline-block">Seed: ...</span>
                <button id="audio-toggle" class="hud-btn px-2 py-1 rounded-lg text-[11px] font-semibold text-emerald-400" title="Toggle Sound">🔊</button>
                <button id="btn-fullscreen-landscape" class="hud-btn px-2 py-1 rounded-lg text-[11px] font-semibold text-amber-300" title="Toggle Fullscreen Landscape">⛶</button>
            </div>
        </div>
    </div>

    <!-- MOBILE CONTROLS OVERLAY (Translucent, compact and non-intrusive) -->
    <div id="mobile-controls-wrapper" class="hidden">
        <!-- 1. Virtual Analog Joystick for Tank Driving & Steering (Bottom-Left) -->
        <div id="mobile-joystick-container" class="fixed bottom-4 left-4 z-30 pointer-events-auto select-none touch-none transition-opacity duration-200">
            <div id="joystick-base" class="relative w-28 h-28 rounded-full bg-black/30 border border-emerald-500/35 backdrop-blur-sm shadow-xl flex items-center justify-center touch-none">
                <!-- Inner Crosshair Guide -->
                <div class="absolute inset-2.5 rounded-full border border-dashed border-emerald-500/20 pointer-events-none"></div>
                <span class="absolute top-1 text-[9px] text-emerald-400/50 font-bold pointer-events-none">▲</span>
                <span class="absolute bottom-1 text-[9px] text-emerald-400/50 font-bold pointer-events-none">▼</span>
                <span class="absolute left-1 text-[9px] text-emerald-400/50 font-bold pointer-events-none">◄</span>
                <span class="absolute right-1 text-[9px] text-emerald-400/50 font-bold pointer-events-none">►</span>
                <!-- Joystick Draggable Thumb Puck -->
                <div id="joystick-knob" class="absolute w-12 h-12 rounded-full bg-emerald-500/50 border border-emerald-300/80 shadow-md flex items-center justify-center pointer-events-none" style="left: 50%; top: 50%; transform: translate(-50%, -50%);">
                    <div class="w-3.5 h-3.5 rounded-full bg-emerald-200/80"></div>
                </div>
            </div>
        </div>

        <!-- 2. Mobile Combat Action Pad (Bottom-Right, Translucent & Compact) -->
        <div id="mobile-actions" class="fixed bottom-4 right-4 z-30 pointer-events-auto flex flex-col items-end gap-1.5 select-none touch-none transition-opacity duration-200">
            <!-- Top auxiliary row: Zoom, Smoke, Bow MG -->
            <div class="flex items-center gap-1.5">
                <button id="mob-btn-time" class="h-8 px-2 bg-slate-900/40 border border-yellow-400/40 active:bg-yellow-600/50 text-yellow-300 font-semibold text-[10px] rounded-lg flex items-center gap-1 backdrop-blur-sm touch-none active:scale-95"><span>☀️</span><span id="mob-time-label">Day</span></button>
                <button id="mob-btn-restart" class="h-8 px-2 bg-slate-900/40 border border-amber-400/40 active:bg-amber-600/50 text-amber-300 font-semibold text-[10px] rounded-lg flex items-center gap-1 backdrop-blur-sm touch-none active:scale-95"><span>🔄</span><span>Reset</span></button>
                <button id="mob-btn-zoom" class="h-8 px-2 bg-slate-900/40 border border-sky-400/40 active:bg-sky-600/50 text-sky-300 font-semibold text-[10px] rounded-lg flex items-center gap-1 backdrop-blur-sm touch-none active:scale-95">
                    <span>🔍</span>
                    <span>Zoom</span>
                </button>
                <button id="mob-btn-smoke" class="h-8 px-2 bg-slate-900/40 border border-slate-400/30 active:bg-slate-600/50 text-slate-200 font-semibold text-[10px] rounded-lg flex items-center gap-1 backdrop-blur-sm touch-none active:scale-95">
                    <span>💨</span>
                    <span>Smoke</span>
                </button>
                <button id="mob-fire-bow" class="h-8 px-2 bg-slate-900/40 border border-orange-400/40 active:bg-orange-600/50 text-orange-400 font-semibold text-[10px] rounded-lg flex items-center gap-1 backdrop-blur-sm touch-none active:scale-95">
                    <span>🎯</span>
                    <span>Bow MG</span>
                </button>
            </div>
            <!-- Primary fire row: Coax MG and 8.8cm Cannon -->
            <div class="flex items-center gap-2">
                <button id="mob-fire-coax" class="h-12 w-12 bg-slate-900/45 border border-amber-400/60 active:bg-amber-600/60 text-amber-300 font-bold text-xs rounded-xl flex flex-col items-center justify-center backdrop-blur-sm touch-none active:scale-95">
                    <span class="text-xs">🔥</span>
                    <span class="text-[8px] mono font-bold">COAX</span>
                </button>
                <button id="mob-fire-88" class="h-13 px-4 py-2 bg-red-950/45 border-2 border-amber-400/90 active:bg-amber-500/60 active:scale-95 text-amber-300 font-extrabold rounded-2xl flex flex-col items-center justify-center backdrop-blur-sm touch-none shadow-lg">
                    <span class="text-sm leading-none">💥</span>
                    <span id="mob-fire-caliber" class="text-[10px] mono font-extrabold text-white uppercase tracking-wider">8.8cm</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Portrait Orientation Helper Prompt (Shown on mobile devices held in portrait) -->
    <div id="portrait-orientation-prompt" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center select-none hidden pointer-events-auto">
        <div class="w-16 h-16 rounded-2xl border-2 border-dashed border-amber-400/70 flex items-center justify-center mb-4">
            <span class="text-3xl animate-bounce">📱</span>
        </div>
        <h2 class="text-lg font-bold text-white mb-2">Rotate to Landscape</h2>
        <p class="text-xs text-slate-300 max-w-xs mb-5">Please turn your device horizontally for the best tank combat visibility and joystick control.</p>
        <button id="btn-request-landscape" class="px-5 py-2.5 bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 font-extrabold text-xs rounded-xl shadow-lg transition-transform flex items-center gap-2">
            <span>⛶</span>
            <span>Switch to Landscape</span>
        </button>
    </div>

    <!-- Modularized Tiger Tank Simulation Scripts -->
    <script src="js/audio.js"></script>
    <script src="js/shaders.js"></script>
    <script src="js/environment.js"></script>
    <script src="js/tankTiger.js"></script>
    <script src="js/tankSherman.js"></script>
    <script src="js/tankT34.js"></script>
    <script src="js/tankModel.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
