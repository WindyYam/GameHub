<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battle of the Ringed Giant — a starship diorama</title>
<style>
  html,body{margin:0;height:100%;background:#02030a;overflow:hidden;font-family:'Segoe UI','Trebuchet MS',Tahoma,sans-serif;color:#cfe6ff;user-select:none}
  canvas{display:block;outline:none;touch-action:none}
  #hud{position:fixed;left:26px;top:20px;pointer-events:none;text-shadow:0 2px 14px #000}
  #hud h1{margin:0;font-size:20px;letter-spacing:.26em;font-weight:300;text-transform:uppercase;color:#9fd8ff}
  #hud p{margin:6px 0 0;font-size:11.5px;opacity:.62;letter-spacing:.12em;text-transform:uppercase}
  #hint{position:fixed;left:26px;bottom:18px;font-size:11px;opacity:.5;letter-spacing:.07em;pointer-events:none;text-shadow:0 1px 8px #000}
  #tools{position:fixed;left:20px;bottom:50px;display:flex;flex-direction:column;gap:7px;align-items:flex-start}
  #tools button{font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#bfe3ff;background:rgba(8,16,30,.6);border:1px solid rgba(120,190,255,.28);border-radius:2px;padding:6px 12px;cursor:pointer;backdrop-filter:blur(6px);transition:all .2s}
  #tools button:hover{background:rgba(20,50,90,.7);border-color:rgba(150,210,255,.8)}
  #tools button.on{border-color:#8fd0ff;color:#fff;box-shadow:0 0 12px rgba(90,170,255,.3) inset}
  #stats{position:fixed;right:22px;bottom:18px;text-align:right;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7fb4e0;text-shadow:0 1px 8px #000;pointer-events:none;line-height:1.7}
  #stats b{color:#e6f4ff;font-weight:400}
  #toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(10px);opacity:0;transition:all .5s;font-size:14px;letter-spacing:.1em;color:#d8efff;text-shadow:0 0 14px #2a7bd0,0 2px 10px #000;pointer-events:none;text-align:center;max-width:70vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #loading{position:fixed;inset:0;background:#02030a;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#7fb8e8;letter-spacing:.3em;font-size:12px;text-transform:uppercase;transition:opacity 1.4s;z-index:9}
  #loading.gone{opacity:0;pointer-events:none}
  #loading i{width:46px;height:2px;background:linear-gradient(90deg,transparent,#8fd0ff,transparent);box-shadow:0 0 14px 3px rgba(120,190,255,.6);animation:ld .9s infinite alternate}
  @keyframes ld{from{transform:scaleX(.3);opacity:.4}to{transform:scaleX(1.4);opacity:1}}
</style>
</head>
<body>
<div id="loading"><i></i><span>Spooling up the hyperdrive…</span></div>
<div id="hud"><h1>Battle of the Ringed Giant</h1><p>a miniature in orbit · two flagships · one very bad day</p></div>
<div id="tools"></div>
<div id="hint">drag · orbit &nbsp;|&nbsp; wheel / pinch · zoom &nbsp;|&nbsp; right-drag · pan &nbsp;|&nbsp; C · camera angles</div>
<div id="stats"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
(() => {
'use strict';
if (!window.THREE || !THREE.OrbitControls) {
  document.getElementById('loading').innerHTML = '<span>Three.js failed to load (network?)</span>';
  return;
}

/* =====================================================================
   STEP 1 — CORE: renderer, HDR bloom pipeline, camera, lights, frame loop,
            deep-space dome (nebula + stars)
   ===================================================================== */

// ---------- math / random ----------
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rad = d => d * Math.PI / 180;
const damp = (cur, tgt, k, dt) => lerp(cur, tgt, 1 - Math.exp(-k * dt));
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(20260917);            // deterministic scene layout
const rr = (a, b) => a + (b - a) * rand();
const pick = arr => arr[Math.floor(rand() * arr.length)];
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const rnd = Math.random;                      // run-time (non-layout) randomness

// ---------- noise ----------
function hash(x, y, s = 0) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
function vnoise(x, y, s = 0, px = 0, py = 0) {
  const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0;
  let ix = x0, iy = y0, jx = x0 + 1, jy = y0 + 1;
  if (px) { ix = ((ix % px) + px) % px; jx = ((jx % px) + px) % px; }
  if (py) { iy = ((iy % py) + py) % py; jy = ((jy % py) + py) % py; }
  const a = hash(ix, iy, s), b = hash(jx, iy, s), c = hash(ix, jy, s), d = hash(jx, jy, s);
  const u = fade(fx), v = fade(fy);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, oct = 4, s = 0, px = 0, py = 0) {
  let a = .5, f = 1, sum = 0, n = 0;
  for (let i = 0; i < oct; i++) { sum += a * vnoise(x * f, y * f, s + i * 17, px * f, py * f); n += a; a *= .5; f *= 2; }
  return sum / n;
}

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
const DPR = Math.min(window.devicePixelRatio || 1, 1.75);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;     // tone mapping happens in the final pass (HDR bloom)
renderer.physicallyCorrectLights = true;        // lights in lux / candela with inverse-square falloff
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);
const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 1.5, 60000);
const CAM_HOME = V3(0, 190, 1400), CAM_TARGET = V3(0, -4, 0);
camera.position.copy(CAM_HOME);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
controls.target.copy(CAM_TARGET);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 30; controls.maxDistance = 3000;
controls.autoRotateSpeed = 0.3;
controls.update();

const updaters = [];
const onFrame = fn => updaters.push(fn);

// ---------- HDR post pipeline (own bloom chain + grade) ----------
const isGL2 = renderer.capabilities.isWebGL2;
const rtOpts = { type: THREE.HalfFloatType, format: THREE.RGBAFormat, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: true };
const mkRT = (w, h, ms) => {
  const t = (ms && isGL2) ? new THREE.WebGLMultisampleRenderTarget(w, h, rtOpts) : new THREE.WebGLRenderTarget(w, h, { ...rtOpts, depthBuffer: false });
  if (ms && isGL2) t.samples = 4;
  return t;
};
const BLOOM_LEVELS = 6;
let sceneRT, bloomRTs = [];
function buildTargets() {
  const w = Math.floor(innerWidth * DPR), h = Math.floor(innerHeight * DPR);
  if (sceneRT) { sceneRT.dispose(); bloomRTs.forEach(r => r.dispose()); }
  sceneRT = mkRT(w, h, true);
  bloomRTs = [];
  for (let i = 0; i < BLOOM_LEVELS; i++) bloomRTs.push(mkRT(Math.max(2, w >> (i + 1)), Math.max(2, h >> (i + 1)), false));
}
buildTargets();

const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadScene = new THREE.Scene();
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
quad.frustumCulled = false; quadScene.add(quad);
const FS_VERT = 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}';
function fsPass(mat, target) { quad.material = mat; renderer.setRenderTarget(target); renderer.render(quadScene, quadCam); }

const downMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: null }, texel: { value: new THREE.Vector2() }, first: { value: 0 }, thr: { value: 1.0 }, knee: { value: 0.6 } },
  vertexShader: FS_VERT, depthTest: false, depthWrite: false,
  fragmentShader: `
    uniform sampler2D tex; uniform vec2 texel; uniform float first,thr,knee; varying vec2 vUv;
    vec3 pf(vec3 c){ if(first<.5) return c; c=min(c,vec3(24.)); float br=max(c.r,max(c.g,c.b)); float s=clamp(br-thr+knee,0.,2.*knee); s=s*s/(4.*knee+1e-4); return c*(max(br-thr,s)/max(br,1e-4)); }
    vec3 S(vec2 o){ return pf(texture2D(tex,vUv+o*texel).rgb); }
    void main(){
      vec3 a=S(vec2(-2,2)),b=S(vec2(0,2)),c=S(vec2(2,2)),d=S(vec2(-2,0)),e=S(vec2(0,0)),f=S(vec2(2,0)),g=S(vec2(-2,-2)),h=S(vec2(0,-2)),i=S(vec2(2,-2));
      vec3 j=S(vec2(-1,1)),k=S(vec2(1,1)),l=S(vec2(-1,-1)),m=S(vec2(1,-1));
      gl_FragColor=vec4(e*.125+(a+c+g+i)*.03125+(b+d+f+h)*.0625+(j+k+l+m)*.125,1.);
    }`
});
const upMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: null }, texel: { value: new THREE.Vector2() }, w: { value: 1 } },
  vertexShader: FS_VERT, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending,
  fragmentShader: `
    uniform sampler2D tex; uniform vec2 texel; uniform float w; varying vec2 vUv;
    vec3 S(vec2 o){ return texture2D(tex,vUv+o*texel).rgb; }
    void main(){
      vec3 c=S(vec2(-1,1))+S(vec2(1,1))+S(vec2(-1,-1))+S(vec2(1,-1))+2.*(S(vec2(0,1))+S(vec2(0,-1))+S(vec2(-1,0))+S(vec2(1,0)))+4.*S(vec2(0));
      gl_FragColor=vec4(c/16.*w,1.);
    }`
});
const finalMat = new THREE.ShaderMaterial({
  uniforms: {
    tScene: { value: null }, tBloom: { value: null }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2() },
    uExposure: { value: 0.82 }, uBloom: { value: 0.32 }, uBlur: { value: 3.5 }, uVignette: { value: 0.62 },
    uGrain: { value: 0.03 }, uAberr: { value: 0.0018 }, uFlash: { value: 0 }
  },
  vertexShader: FS_VERT, depthTest: false, depthWrite: false,
  fragmentShader: `
    uniform sampler2D tScene,tBloom; uniform vec2 uRes; uniform float uTime,uExposure,uBloom,uBlur,uVignette,uGrain,uAberr,uFlash; varying vec2 vUv;
    float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
    vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }
    vec3 toSRGB(vec3 c){ return mix(c*12.92, 1.055*pow(c,vec3(1./2.4))-.055, step(.0031308,c)); }
    void main(){
      vec2 uv=vUv; vec2 cc=uv-.5;
      // miniature tilt-shift: sharp focal band, soft top / bottom
      float d=abs(uv.y-.5); float band=smoothstep(.2,.62,d);
      float rad=uBlur*band*(uRes.y/1000.);
      vec3 col=vec3(0.); float wsum=0.;
      vec2 px=1./uRes; float ab=uAberr*dot(cc,cc)*4.;
      for(int i=0;i<14;i++){
        float fi=float(i); float a=fi*2.39996; float r=sqrt((fi+.5)/14.)*rad;
        vec2 o=vec2(cos(a),sin(a))*r*px;
        vec3 s=vec3(texture2D(tScene,uv+o+cc*ab).r,texture2D(tScene,uv+o).g,texture2D(tScene,uv+o-cc*ab).b);
        float wt=1.+dot(s,vec3(.3));
        col+=s*wt; wsum+=wt;
      }
      col/=wsum;
      col+=texture2D(tBloom,uv).rgb*uBloom;
      col+=vec3(1.,.8,.6)*uFlash;
      col*=uExposure;
      vec3 t=aces(col);
      float l=dot(t,vec3(.2126,.7152,.0722));
      t=mix(t,t*vec3(.88,1.0,1.16),1.-smoothstep(0.,.5,l));           // cold shadows
      t=mix(t,t*vec3(1.07,1.0,.92),smoothstep(.4,.95,l));              // warm highlights
      t=mix(vec3(l),t,1.1);
      t*=1.-uVignette*smoothstep(.3,.98,length(cc*vec2(1.1,1.25)));
      t=toSRGB(t);
      t+=(h21(uv*uRes+fract(uTime)*91.7)-.5)*uGrain;
      gl_FragColor=vec4(t,1.);
    }`
});
const finalUniforms = finalMat.uniforms;

function renderFrame() {
  renderer.setRenderTarget(sceneRT); renderer.clear();
  renderer.render(scene, camera);
  let src = sceneRT;
  for (let i = 0; i < BLOOM_LEVELS; i++) {
    downMat.uniforms.tex.value = src.texture;
    downMat.uniforms.texel.value.set(1 / src.width, 1 / src.height);
    downMat.uniforms.first.value = i === 0 ? 1 : 0;
    fsPass(downMat, bloomRTs[i]); src = bloomRTs[i];
  }
  for (let i = BLOOM_LEVELS - 1; i > 0; i--) {
    upMat.uniforms.tex.value = bloomRTs[i].texture;
    upMat.uniforms.texel.value.set(1 / bloomRTs[i].width, 1 / bloomRTs[i].height);
    upMat.uniforms.w.value = 1.0;
    fsPass(upMat, bloomRTs[i - 1]);
  }
  finalUniforms.tScene.value = sceneRT.texture;
  finalUniforms.tBloom.value = bloomRTs[0].texture;
  finalUniforms.uRes.value.set(sceneRT.width, sceneRT.height);
  fsPass(finalMat, null);
}

let fovMul = 1;                                   // camera director widens the lens for some shots
const baseFov = () => innerWidth / innerHeight < 1.3 ? 34 * Math.min(1.9, 1.3 / (innerWidth / innerHeight)) : 34;
function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.fov = baseFov() * fovMul;
  camera.updateProjectionMatrix();
  buildTargets();
}
addEventListener('resize', onResize);
onResize();

// ---------- UI helpers ----------
const toastEl = document.getElementById('toast');
let toastTimer = 0;
function toast(msg, ms = 3200) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms); }

// ---------- lights ----------
// physically motivated rig (physicallyCorrectLights): the star is the dominant light, the ringed giant and the
// nebula bounce soft coloured light into the shadows, and image-based lighting (built from the real sky at the
// end of the file) supplies ambient + reflections. Both directional lights cast shadows.
const hemi = new THREE.HemisphereLight(0x4f6fb8, 0x180c20, 0.12); scene.add(hemi);
const keyLight = new THREE.DirectionalLight(0xc9dbff, 1.5);          // nebula / planet-shine bounce from the camera side
keyLight.position.set(-825, 750, 950); keyLight.target.position.set(0, 0, 0);
keyLight.castShadow = true; keyLight.shadow.mapSize.set(2048, 2048);
Object.assign(keyLight.shadow.camera, { left: -700, right: 700, top: 700, bottom: -700, near: 10, far: 3200 });
keyLight.shadow.bias = -0.0006; keyLight.shadow.normalBias = 0.35;
scene.add(keyLight, keyLight.target);
const sunLight = new THREE.DirectionalLight(0xffe2bd, 6.5); scene.add(sunLight, sunLight.target);   // the star: direction set once the sun is positioned
sunLight.castShadow = true; sunLight.shadow.mapSize.set(4096, 4096);
Object.assign(sunLight.shadow.camera, { left: -680, right: 680, top: 680, bottom: -680, near: 10, far: 3600 });
sunLight.shadow.bias = -0.0005; sunLight.shadow.normalBias = 0.3;
const fillLight = new THREE.DirectionalLight(0x5a7cff, 0.5); fillLight.position.set(420, -120, 260); scene.add(fillLight);

// explosion lights: a small pool re-used by every blast (fixed count => no shader recompiles); inverse-square falloff
const BLAST_LIGHTS = [];
const BLAST_CD = 22;                                              // peak → candela
for (let i = 0; i < 4; i++) { const l = new THREE.PointLight(0xff9a50, 0, 190, 2); l.userData = { t: 9, dur: 1, peak: 0 }; scene.add(l); BLAST_LIGHTS.push(l); }

// ---------- deep-space dome: nebula + stars (follows the camera, never parallaxes) ----------
const SKY = {};
(() => {
  SKY.uniforms = { uTime: { value: 0 }, uSunDir: { value: V3(0, 1, 0) }, uGalDir: { value: V3(0, 1, 0) }, uHoleDir: { value: V3(0, 1, 0) } };
  const mat = new THREE.ShaderMaterial({
    uniforms: SKY.uniforms, side: THREE.BackSide, depthTest: false, depthWrite: false, fog: false,
    vertexShader: 'varying vec3 vDir; void main(){ vDir=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
    fragmentShader: `
      varying vec3 vDir; uniform float uTime; uniform vec3 uSunDir,uGalDir,uHoleDir;
      float h(vec3 p){ p=fract(p*.3183099+.1); p*=17.; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
      float n3(vec3 x){ vec3 i=floor(x),f=fract(x); f=f*f*(3.-2.*f);
        return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),
                   mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z); }
      float fbm(vec3 p){ float a=.5,s=0.; for(int i=0;i<5;i++){ s+=a*n3(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=.5; } return s; }
      void main(){
        vec3 d=normalize(vDir);
        vec3 col=vec3(.002,.003,.009);
        // dust clouds
        float c1=fbm(d*2.4+vec3(3.,1.,7.)), c2=fbm(d*5.5+vec3(9.,4.,2.)+c1);
        float m1=smoothstep(.42,.78,c1);
        col+=mix(vec3(.004,.01,.03),vec3(.03,.01,.04),fbm(d*1.4+5.))*m1*.4;
        col+=vec3(.002,.018,.03)*smoothstep(.5,.85,c2)*m1*.35;
        // thin band of milky haze
        float band=exp(-pow(dot(d,normalize(vec3(.25,.9,.35)))*3.5,2.));
        col+=vec3(.025,.03,.05)*band*(.4+fbm(d*8.))*.5;
        // glows around the big landmarks
        col+=vec3(.03,.045,.14)*pow(max(dot(d,uGalDir),0.),12.)*.5;
        col+=vec3(.3,.16,.07)*pow(max(dot(d,uSunDir),0.),40.)*.15;
        col+=vec3(.5,.2,.08)*pow(max(dot(d,uHoleDir),0.),160.)*.15;
        gl_FragColor=vec4(col,1.);
      }`
  });
  const dome = new THREE.Mesh(new THREE.SphereGeometry(4600, 48, 32), mat);
  dome.renderOrder = -20; dome.frustumCulled = false; scene.add(dome); SKY.dome = dome;

  // star points
  const N = 9000, pos = new Float32Array(N * 3), col = new Float32Array(N * 3), siz = new Float32Array(N), ph = new Float32Array(N);
  const tints = [[.75, .85, 1], [1, 1, 1], [1, .92, .8], [1, .75, .55], [.6, .75, 1]];
  for (let i = 0; i < N; i++) {
    const u = rand() * 2 - 1, a = rand() * 6.2832, s = Math.sqrt(1 - u * u);
    pos.set([s * Math.cos(a) * 4400, u * 4400, s * Math.sin(a) * 4400], i * 3);
    const t = pick(tints), b = Math.pow(rand(), 3.2) * 1.8 + .25; col.set([t[0] * b, t[1] * b, t[2] * b], i * 3);
    siz[i] = rand() < .03 ? rr(2.6, 4) : rr(.9, 2); ph[i] = rand() * 40;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('aCol', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(siz, 1)); g.setAttribute('aPh', new THREE.BufferAttribute(ph, 1));
  SKY.starMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uPix: { value: DPR } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
    vertexShader: `attribute vec3 aCol; attribute float aSize,aPh; uniform float uTime,uPix; varying vec3 vC;
      void main(){ float tw=.78+.22*sin(uTime*(1.2+fract(aPh)*2.)+aPh); vC=aCol*tw; gl_PointSize=aSize*uPix; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `varying vec3 vC; void main(){ vec2 p=gl_PointCoord-.5; float r=length(p)*2.; float a=1.-smoothstep(0.,1.,r); gl_FragColor=vec4(vC*a*a*1.6,1.); }`
  });
  SKY.stars = new THREE.Points(g, SKY.starMat); SKY.stars.frustumCulled = false; SKY.stars.renderOrder = -19; scene.add(SKY.stars);
  onFrame((dt, t) => {
    dome.position.copy(camera.position); SKY.stars.position.copy(camera.position);
    SKY.uniforms.uTime.value = t; SKY.starMat.uniforms.uTime.value = t;
  });
})();

// ---------- frame loop ----------
const clock = new THREE.Clock();
let T = 0, timeScale = 1;
function frame() {
  requestAnimationFrame(frame);
  const rdt = Math.min(clock.getDelta(), 0.05), dt = rdt * timeScale; T += dt;
  controls.update();
  for (let i = 0; i < updaters.length; i++) updaters[i](dt, T, rdt);
  finalUniforms.uTime.value = T;
  renderFrame();
}

/* =====================================================================
   STEP 2 — THE BACKDROP: sun · ringed giant + moons · black hole · spiral galaxy
            (placed from the home camera's view so the composition matches the concept art)
   ===================================================================== */

const GLSL_NOISE = `
  float h11(float n){ return fract(sin(n*127.1)*43758.5453); }
  float h21_(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
  float h31(vec3 p){ return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453); }
  float n1(float x){ float i=floor(x),f=fract(x); f=f*f*(3.-2.*f); return mix(h11(i),h11(i+1.),f); }
  float n2(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f); return mix(mix(h21_(i),h21_(i+vec2(1,0)),f.x),mix(h21_(i+vec2(0,1)),h21_(i+vec2(1,1)),f.x),f.y); }
  float f2(vec2 p){ float a=.5,s=0.; for(int i=0;i<5;i++){ s+=a*n2(p); p=p*2.02+vec2(5.2,1.3); a*=.5; } return s; }
  float n3(vec3 x){ vec3 i=floor(x),f=fract(x); f=f*f*(3.-2.*f);
    return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
               mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z); }
  float f3(vec3 p){ float a=.5,s=0.; for(int i=0;i<5;i++){ s+=a*n3(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=.5; } return s; }
  mat2 rot2(float a){ float c=cos(a),s=sin(a); return mat2(c,s,-s,c); }
`;
const RING_GLSL = `
  float ringDensity(float r){
    float x=(r-1.24)/1.06; if(x<0.||x>1.) return 0.;
    float d=.14;
    d=mix(d,.95,smoothstep(.12,.2,x));
    d=mix(d,.04,smoothstep(.5,.54,x));
    d=mix(d,.62,smoothstep(.6,.64,x));
    d*=1.-.9*(1.-smoothstep(0.,.015,abs(x-.9)));
    d*=smoothstep(0.,.05,x)*(1.-smoothstep(.95,1.,x));
    d*=.6+.55*n1(x*70.)+.25*n1(x*260.);
    return clamp(d,0.,1.);
  }
`;

const homeCam = new THREE.PerspectiveCamera(34, 16 / 9, 1.5, 60000);
homeCam.position.copy(CAM_HOME); homeCam.lookAt(CAM_TARGET); homeCam.updateMatrixWorld(); homeCam.updateProjectionMatrix();
const BG_DIST = 20000, BG_K = BG_DIST / 2800 * 1.8;   // sizes below were authored for 2800; the extra 1.8 makes the bodies loom larger
const BG = {};
function skyAt(nx, ny, dist = BG_DIST) { return V3(nx, ny, .5).unproject(homeCam).sub(CAM_HOME).normalize().multiplyScalar(dist).add(CAM_HOME); }

const billboards = [];
const BB_VERT = 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }';
function makeBillboard(frag, size, { blending = THREE.AdditiveBlending, premult = false, order = 0 } = {}) {
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } }, transparent: true, depthWrite: false, blending, premultipliedAlpha: premult, fog: false,
    vertexShader: BB_VERT, fragmentShader: 'varying vec2 vUv; uniform float uTime;' + GLSL_NOISE + frag
  });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat);
  m.scale.setScalar(size); m.renderOrder = order; m.frustumCulled = false; scene.add(m); billboards.push(m);
  return m;
}
onFrame((dt, t) => { for (const b of billboards) { b.quaternion.copy(camera.quaternion); b.material.uniforms.uTime.value = t; } });

// azimuth 0 = the home camera's heading, positive = to the right; degrees
function skyDir(az, el, dist = BG_DIST) {
  const a = az * Math.PI / 180, e = el * Math.PI / 180;
  return V3(Math.sin(a) * Math.cos(e), Math.sin(e), -Math.cos(a) * Math.cos(e)).multiplyScalar(dist).add(CAM_HOME);
}
const BG_POS = {
  planet: skyAt(.62, .66), sun: skyDir(-60, 3), hole: skyDir(125, -2), galaxy: skyDir(-145, 4)
};
SKY.uniforms.uSunDir.value.copy(BG_POS.sun.clone().sub(CAM_HOME).normalize());
SKY.uniforms.uGalDir.value.copy(BG_POS.galaxy.clone().sub(CAM_HOME).normalize());
SKY.uniforms.uHoleDir.value.copy(BG_POS.hole.clone().sub(CAM_HOME).normalize());
sunLight.position.copy(BG_POS.sun).normalize().multiplyScalar(1800); sunLight.target.position.set(0, 0, 0);   // parallel rays seen from the battle; kept close so the shadow frustum fits

// ---------- the sun: granulated disc, corona, rays, diffraction spikes ----------
BG.sun = makeBillboard(`
  void main(){
    const float SZ=7.;
    vec2 p=(vUv-.5)*2.*SZ; float r=length(p);
    float edge=1.-smoothstep(SZ*.5,SZ,r);
    vec2 dir=p/max(r,1e-3);
    float disc=1.-smoothstep(.97,1.,r);
    float mu=sqrt(max(1.-r*r,0.));
    float gran=f2(p*5.+uTime*.15)*.6+f2(p*14.-uTime*.2)*.4;
    vec3 surf=mix(vec3(5.,2.8,.9),vec3(9.,7.,4.),smoothstep(.15,.9,mu)*(.55+.9*gran));
    float d=max(r-1.,0.);
    float glow=exp(-d*2.6)*.8+exp(-d*.9)*.16;
    float rays=f2(dir*3.2+vec2(r*.08,uTime*.03))*1.5; rays*=rays;
    float spikes=(exp(-abs(p.x)*9.)*exp(-abs(p.y)*.35)+exp(-abs(p.y)*9.)*exp(-abs(p.x)*.35))*.5;
    vec3 halo=(vec3(1.,.62,.28)*glow+vec3(1.,.8,.55)*rays*exp(-d*.9)*.9+vec3(1.,.9,.7)*spikes*.9)*(1.-disc);
    gl_FragColor=vec4((surf*disc+halo*.85)*edge*.7,1.);
  }`, 150 * 7 * BG_K, { order: -4 });
BG.sun.position.copy(BG_POS.sun);

// ---------- black hole: lensed accretion disk, photon ring, doppler-boosted turbulence ----------
BG.hole = makeBillboard(`
  void main(){
    vec2 p=rot2(.34)*((vUv-.5)*2.);
    float R0=.2, r=length(p), lr=r/R0;
    float inc=.17;
    vec2 dp=vec2(p.x,p.y/inc); float rho=length(dp);
    float rin=R0*1.35, rout=.93;
    float band=smoothstep(rin,rin*1.25,rho)*(1.-smoothstep(rout*.5,rout,rho));
    float spin=uTime*.7/pow(max(rho/R0,1.),1.5);
    vec2 dd=rot2(spin)*(dp/max(rho,1e-3));
    float turb=f2(dd*3.5+vec2(rho*14.,0.))*.9+.3;
    float streak=f2(vec2(rho*60.,3.)+dd*1.2);
    float dop=1.+.8*(-dp.x/max(rho,1e-3));
    float heat=1.-smoothstep(rin,rout,rho);
    vec3 dcol=mix(vec3(1.,.36,.09),vec3(1.,.9,.7),pow(heat,1.5))*(1.+4.*heat*heat);
    vec3 disk=dcol*band*turb*(.45+streak)*dop*dop*2.6;
    float front=step(dp.y,0.);
    float inShadow=1.-smoothstep(R0*.97,R0,r);
    // lensed image of the far side of the disk wrapping over / under the shadow
    vec2 dirp=p/max(r,1e-3);
    float spin2=uTime*.5/pow(max(lr,1.),1.5);
    float tex=.65+.7*f2(rot2(spin2)*dirp*4.+vec2(lr*6.,0.));
    float topArc=exp(-pow((lr-1.13)/.24,2.))*(.35+1.0*smoothstep(-.3,1.,p.y/R0));
    float botArc=exp(-pow((lr-1.09)/.13,2.))*.45*smoothstep(.2,-1.,p.y/R0);
    float sideDop=1.+.7*(-p.x/max(r,1e-3));
    vec3 arcCol=mix(vec3(1.,.5,.16),vec3(1.,.95,.8),.55);
    vec3 arcs=arcCol*(topArc*1.5+botArc)*tex*sideDop*3.2;
    vec3 photon=vec3(1.,.95,.85)*exp(-pow((lr-1.015)/.028,2.))*6.;
    vec3 halo=vec3(1.,.5,.2)*exp(-(lr-1.)*3.2)*.2*step(1.,lr)+vec3(.55,.65,1.)*exp(-lr*.9)*.03;
    vec3 col=disk*(1.-front)*(1.-inShadow)+arcs+photon+halo*(1.-inShadow);
    vec3 fdisk=disk*front;
    float fcov=clamp(dot(fdisk,vec3(.33))*3.,0.,1.);
    float a=inShadow*(1.-fcov);
    float edge=1.-smoothstep(.8,1.,length((vUv-.5)*2.));
    gl_FragColor=vec4((col+fdisk)*edge*.55,a);
  }`, 620 * BG_K, { blending: THREE.NormalBlending, premult: true, order: -6 });
BG.hole.position.copy(BG_POS.hole);

// ---------- spiral galaxy ----------
BG.galaxy = makeBillboard(`
  void main(){
    vec2 p=(vUv-.5)*2.;
    vec2 q=rot2(.62)*p; q.y/=.58;
    float r=length(q);
    float wob=f2(q*3.+7.)*.9;
    float ph=2.*atan(q.y,q.x)-5.2*log(r+.03)+uTime*.015+wob;
    float arm=pow(.5+.5*cos(ph),2.2);
    float fall=smoothstep(1.,.25,r)*smoothstep(0.,.1,r);
    float bulge=exp(-r*r*34.)*1.9+exp(-r*5.)*.55;
    float dust=smoothstep(.55,.9,f2(q*6.+vec2(arm*2.,3.)))*smoothstep(.12,.3,r)*.85;
    float dots=step(.965,h21_(floor(q*130.)))*arm*fall*1.6;
    float hii=step(.93,f2(q*22.+3.))*arm*smoothstep(.3,.8,r);
    vec3 core=vec3(1.25,.95,.6);
    vec3 armc=mix(vec3(.28,.42,1.15),vec3(.8,.6,1.),f2(q*3.));
    vec3 col=core*bulge+armc*arm*fall*.95*(1.-dust)+vec3(1.,.4,.6)*hii*fall*1.3+vec3(.9,.95,1.)*dots;
    col*=1.-dust*.55;
    float edge=1.-smoothstep(.82,1.,length(p));
    gl_FragColor=vec4(col*edge*1.15,1.);
  }`, 520 * BG_K, { order: -7 });
BG.galaxy.position.copy(BG_POS.galaxy);

// ---------- the ringed giant (own lighting from the sun, ring shadow on the globe and globe shadow on the rings) ----------
(() => {
  const R = 215 * BG_K, sunW = BG_POS.sun.clone().sub(BG_POS.planet).normalize();
  const axis = V3(-.404, .867, .292).applyQuaternion(homeCam.quaternion).normalize();
  const group = new THREE.Group(); group.position.copy(BG_POS.planet); group.scale.setScalar(R);
  group.quaternion.setFromUnitVectors(V3(0, 1, 0), axis); group.updateMatrixWorld(true);
  const sunO = sunW.clone().applyQuaternion(group.quaternion.clone().invert());
  const vert = `varying vec3 vNw,vPo,vWp; void main(){ vPo=position; vNw=mat3(modelMatrix)*normal; vWp=(modelMatrix*vec4(position,1.)).xyz; gl_Position=projectionMatrix*viewMatrix*vec4(vWp,1.); }`;
  const U = () => ({ uTime: { value: 0 }, uSunW: { value: sunW.clone() }, uSunO: { value: sunO.clone() } });
  const planetMat = new THREE.ShaderMaterial({
    uniforms: U(), vertexShader: vert, fog: false,
    fragmentShader: 'varying vec3 vNw,vPo,vWp; uniform vec3 uSunW,uSunO; uniform float uTime;' + GLSL_NOISE + RING_GLSL + `
      void main(){
        vec3 N=normalize(vNw), P=normalize(vPo);
        float warp=f3(P*3.+vec3(0.,uTime*.01,0.))*.5+f3(P*9.)*.15;
        float v=P.y*7.5+warp*1.1;
        float b1=n1(v*1.7), b2=n1(v*5.+3.);
        vec3 cA=vec3(.86,.74,.52), cB=vec3(.72,.56,.36), cC=vec3(.95,.88,.7), cD=vec3(.56,.42,.28);
        vec3 alb=mix(mix(cA,cB,b1),mix(cC,cD,b2),.45);
        alb*=.85+.3*f3(P*vec3(30.,6.,30.));
        alb*=mix(1.,.78,smoothstep(.55,1.,abs(P.y)));
        vec3 V=normalize(cameraPosition-vWp), L=normalize(uSunW);
        float ndl=dot(N,L);
        // the atmosphere wraps and softens the terminator, which turns warm where sunlight grazes a long slant path
        float lit=smoothstep(-.10,.42,ndl)*.55+max(ndl,0.)*.45;
        vec3 Lo=normalize(uSunO); float rs=1.;
        float t=-vPo.y/Lo.y;
        if(abs(Lo.y)>.001&&t>0.){ vec3 Q=vPo+Lo*t; rs=1.-ringDensity(length(Q.xz))*.92; }
        float nv=max(dot(N,V),0.), fres=pow(1.-nv,3.);
        vec3 sunC=vec3(1.7,1.55,1.35);
        vec3 diff=alb*lit*rs*sunC;
        diff*=mix(vec3(1.),vec3(1.28,.78,.5),exp(-pow(ndl/.2,2.))*.7);
        // limb in-scattering: Rayleigh phase x slant path, brightest on the sunlit limb
        float cs=dot(-V,L), ray=.75*(1.+cs*cs), path=1./(nv+.18);
        vec3 atm=vec3(.34,.5,.95)*ray*smoothstep(-.15,.5,ndl)*(1.-exp(-path*path*.045))*.55*fres*2.2;
        vec3 col=diff+alb*vec3(.015,.02,.04)+vec3(.9,.7,.4)*fres*lit*.35+atm+vec3(.15,.25,.5)*fres*.1;
        gl_FragColor=vec4(col,1.);
      }`
  });
  const planet = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 64), planetMat); planet.frustumCulled = false; group.add(planet);
  const ringGeo = new THREE.RingGeometry(1.24, 2.3, 160, 1); ringGeo.rotateX(-Math.PI / 2);
  const ringMat = new THREE.ShaderMaterial({
    uniforms: U(), vertexShader: vert, transparent: true, depthWrite: false, side: THREE.DoubleSide, fog: false,
    fragmentShader: 'varying vec3 vNw,vPo,vWp; uniform vec3 uSunO,uSunW;' + GLSL_NOISE + RING_GLSL + `
      float hg(float c,float g){ return (1.-g*g)/pow(1.+g*g-2.*g*c,1.5); }
      void main(){
        float r=length(vPo.xz); float dens=ringDensity(r);
        vec3 Lo=normalize(uSunO);
        float b=dot(vPo,Lo), c=dot(vPo,vPo)-1., disc=b*b-c, sh=1.;
        if(disc>0.&&(-b-sqrt(disc))>0.) sh=.07;
        float x=(r-1.24)/1.06;
        vec3 base=mix(vec3(.82,.7,.5),vec3(.95,.88,.72),n1(x*30.))*(.7+.5*n1(x*140.));
        // icy particles: strong forward scattering (the lit rings glow when seen against the sun) plus a diffuse back lobe;
        // thin regions transmit more light than dense ones
        vec3 V=normalize(cameraPosition-vWp);
        float cs=dot(-normalize(uSunW),V);
        float ph=min(mix(hg(cs,-.2),hg(cs,.62),.35)*.55,2.6);
        float trans=1.+(1.-dens)*.6;
        gl_FragColor=vec4(base*sh*vec3(2.2,2.0,1.7)*(.45+ph)*trans,dens*.93);
      }`
  });
  const ring = new THREE.Mesh(ringGeo, ringMat); ring.frustumCulled = false; ring.renderOrder = -3; group.add(ring);
  scene.add(group);

  const moonMat = tint => new THREE.ShaderMaterial({
    uniforms: { uSunW: { value: sunW.clone() }, uTint: { value: tint } }, vertexShader: vert, fog: false,
    fragmentShader: 'varying vec3 vNw,vPo,vWp; uniform vec3 uSunW,uTint;' + GLSL_NOISE + `
      void main(){
        vec3 N=normalize(vNw), V=normalize(cameraPosition-vWp), L=normalize(uSunW);
        float n=f3(vPo*5.)*.6+f3(vPo*18.)*.4, cr=smoothstep(.45,.55,f3(vPo*9.+3.));
        vec3 alb=uTint*(.55+.7*n)*(.8+.2*cr);
        // Lommel-Seeliger regolith: dusty bodies stay bright towards the limb and at full phase instead of falling off like Lambert
        float ndl=max(dot(N,L),0.), ndv=max(dot(N,V),.02);
        float l=ndl/(ndl+ndv)*2.1*smoothstep(0.,.06,dot(N,L)+.04);
        gl_FragColor=vec4(alb*l*vec3(2.2,2.,1.8)+alb*.02,1.);
      }`
  });
  BG.moons = [
    { r: .17, orbit: 2.75, ph: 3.9, inc: .05, sp: .006, m: new THREE.Mesh(new THREE.SphereGeometry(1, 40, 28), moonMat(V3(.85, .78, .7))) },
    { r: .12, orbit: 3.3, ph: 5.1, inc: .5, sp: .004, m: new THREE.Mesh(new THREE.SphereGeometry(1, 40, 28), moonMat(V3(.6, .6, .66))) }
  ];
  for (const mo of BG.moons) { mo.m.scale.setScalar(mo.r); mo.m.frustumCulled = false; group.add(mo.m); }
  onFrame((dt, t) => {
    planetMat.uniforms.uTime.value = t;
    for (const mo of BG.moons) { const a = mo.ph + t * mo.sp; mo.m.position.set(Math.cos(a) * mo.orbit, Math.sin(a) * mo.orbit * Math.sin(mo.inc), Math.sin(a) * mo.orbit * Math.cos(mo.inc)); }
  });
  BG.planetGroup = group;
})();

/* =====================================================================
   STEP 3 — THE FLAGSHIPS: texture toolkit → hull lofts (coarse mass) →
            superstructure, deck greebles, turrets, hangar bays, engine bells
   ===================================================================== */

// ---------- texture toolkit ----------
function canvasTex(size, paint, { srgb = true, repeat = [1, 1] } = {}) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d', { willReadFrequently: true }); paint(g, size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = maxAniso;
  if (srgb) t.encoding = THREE.sRGBEncoding;
  t.repeat.set(repeat[0], repeat[1]);
  return t;
}
function pixelFill(g, size, fn) {
  const img = g.getImageData(0, 0, size, size), d = img.data;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const o = (y * size + x) * 4, c = fn(x / size, y / size, x, y, d[o], d[o + 1], d[o + 2]);
    d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
}
const rgb = (r, g, b) => `rgb(${r | 0},${g | 0},${b | 0})`;
const cl255 = v => clamp(v, 0, 255);
const TILE = 30;                                  // world units covered by one hull-texture tile

// recursive plating: bsp-split panels with seams, vents, hatches and rivets, then weathering
function hullTexture(base, { grime = .5, tint = [1, 1, 1], accentRows = null } = {}) {
  return canvasTex(1024, (g, S) => {
    g.fillStyle = rgb(base[0], base[1], base[2]); g.fillRect(0, 0, S, S);
    function panel(x, y, w, h) {
      const t = rr(-.13, .13), a = t > 0 ? 255 : 0;
      g.fillStyle = `rgba(${a},${a},${a},${Math.abs(t)})`; g.fillRect(x, y, w, h);
      g.strokeStyle = 'rgba(0,0,0,.6)'; g.lineWidth = 2.5; g.strokeRect(x + 1, y + 1, w - 2, h - 2);
      g.strokeStyle = 'rgba(255,255,255,.17)'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(x + 4, y + h - 4); g.lineTo(x + 4, y + 4); g.lineTo(x + w - 4, y + 4); g.stroke();
      const r = rand();
      if (r < .14 && w > 50 && h > 50) {                          // vent slits
        const n = 3 + (rand() * 5 | 0); g.fillStyle = 'rgba(0,0,0,.5)';
        for (let i = 0; i < n; i++) g.fillRect(x + w * .18, y + h * (.2 + i * .6 / n), w * .64, 3);
      } else if (r < .24 && w > 50 && h > 50) {                   // hatch
        g.strokeStyle = 'rgba(0,0,0,.55)'; g.lineWidth = 2; g.strokeRect(x + w * .25, y + h * .25, w * .5, h * .5);
        g.fillStyle = 'rgba(255,255,255,.1)'; g.fillRect(x + w * .25 + 2, y + h * .25 + 2, w * .5 - 4, 3);
      } else if (r < .34) {                                       // rivet row
        g.fillStyle = 'rgba(0,0,0,.4)'; for (let i = 0; i < w - 14; i += 11) g.fillRect(x + 9 + i, y + h - 9, 2.5, 2.5);
      } else if (r < .38 && accentRows) {                         // painted stripe
        g.fillStyle = accentRows; g.fillRect(x + 4, y + h * .42, w - 8, h * .16);
      }
    }
    function split(x, y, w, h, d) {
      if (d < 5 && w > 64 && h > 64 && (d < 2 || rand() < .62)) {
        if (w > h) { const c = rr(.36, .64) * w; split(x, y, c, h, d + 1); split(x + c, y, w - c, h, d + 1); }
        else { const c = rr(.36, .64) * h; split(x, y, w, c, d + 1); split(x, y + c, w, h - c, d + 1); }
      } else panel(x, y, w, h);
    }
    split(0, 0, S, S, 0);
    pixelFill(g, S, (u, v, x, y, r, gg, b) => {
      const n = fbm(u * 8, v * 8, 4, 31, 8, 8), st = fbm(u * 48, v * 4, 3, 41, 48, 4), dust = fbm(u * 90, v * 90, 2, 51, 90, 90);
      const m = (.78 + n * .5) * (1 - Math.max(0, st - .55) * grime * 1.6) * (.92 + dust * .16);
      return [cl255(r * m * tint[0]), cl255(gg * m * tint[1]), cl255(b * m * tint[2])];
    });
  });
}
// lit windows: sparse rows of tiny lights (emissive map)
function windowTexture(cols, density) {
  return canvasTex(512, (g, S) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, S, S);
    for (let r = 0; r < 64; r++) {
      if (rand() > density) continue;
      const y = r * 8 + 2, run = 3 + (rand() * 20 | 0), c = pick(cols); let x = rr(0, S - 120);
      for (let i = 0; i < run; i++) { if (rand() < .82) { g.fillStyle = c; g.fillRect(x + i * 7, y, 5, 3); } }
    }
    for (let i = 0; i < 70; i++) { g.fillStyle = pick(cols); g.fillRect(rr(0, S), rr(0, S), 9, 4); }
  });
}
// derive a tangent-space normal map and a packed roughness (G) / metalness (B) map from the plating albedo:
// seams and grime read as recessed, rough, bare metal; fresh paint stays smooth and dielectric
function deriveHullMaps(albedo, { rough = .5, metal = .3, relief = 2.6 } = {}) {
  const S = albedo.image.width, src = albedo.image.getContext('2d').getImageData(0, 0, S, S).data;
  const H = new Float32Array(S * S);
  for (let i = 0; i < S * S; i++) H[i] = (src[i * 4] * .299 + src[i * 4 + 1] * .587 + src[i * 4 + 2] * .114) / 255;
  const at = (x, y) => H[((y + S) % S) * S + ((x + S) % S)];

const BOLT_VERT = `
  uniform float uTime; attribute vec3 aStart,aVel,aCol; attribute vec4 aPar;
  varying vec2 vC; varying vec3 vCol; varying float vI;
  void main(){
    float life=aPar.y;
    #ifdef LOOP
      float age=mod(uTime+aPar.x,life);
    #else
      float age=uTime-aPar.x;
    #endif
    vec3 dir=normalize(aVel);
    vec3 head=aStart+aVel*age;
    float dist=length(cameraPosition-head);
    float len=max(aPar.z,dist*.004), wid=max(aPar.w,dist*.0011);
    vec3 p=mix(head-dir*len,head,position.x);
    vec3 toC=cameraPosition-p; vec3 side=cross(dir,toC); float sl=length(side); side=sl>1e-4?side/sl:vec3(0.,1.,0.);
    p+=side*position.y*wid;
    vC=position.xy; vCol=aCol;
    #ifdef LOOP
      float alive=1.; vI=smoothstep(0.,life*.07,age)*(1.-smoothstep(life*.88,life,age));
    #else
      float alive=step(0.,age)*step(age,life); vI=alive;
    #endif
    gl_Position=projectionMatrix*viewMatrix*vec4(p,1.);
    if(alive<.5) gl_Position=vec4(2.,2.,2.,1.);
  }`;
const BOLT_FRAG = `
  varying vec2 vC; varying vec3 vCol; varying float vI;
  void main(){
    float a=abs(vC.y);
    float core=exp(-a*a*10.), glow=exp(-a*a*2.4);

  }`;

const PART_VERT = `
  uniform float uTime,uDrag; attribute vec3 aPos,aVel; attribute vec4 aPar,aCol;
  varying vec2 vUv; varying float vK; varying vec4 vCol;
  void main(){
    float age=uTime-aPar.x, k=age/aPar.y;
