            { shirtColor: 0xe2e8f0, shortsColor: 0x1e293b, hairColor: 0x292524, shoeColor: 0xef4444, isJersey: true, hairStyle: 0, role: 'C',  homeOff: [-16.5, 1.2], homeDef: [-18.2, 6.2] }
        ];

        const players = [];
            teamAConfigs.forEach((cfg, idx) => {
                const char = createHumanoid(cfg);
                char.root.position.set(cfg.homeOff[0], 0.18, cfg.homeOff[1]);
                players.push({
                    id: idx,
                    team: 0, // Team A attacks Right Hoop (+X)
                    char,
                    homeOff: new THREE.Vector3(cfg.homeOff[0], 0.18, cfg.homeOff[1]),
                    homeDef: new THREE.Vector3(cfg.homeDef[0], 0.18, cfg.homeDef[1]),
                    target: new THREE.Vector3(cfg.homeOff[0], 0.18, cfg.homeOff[1]),
                    cutOffset: new THREE.Vector3(),
                    phase: idx * 1.3,
                    jumpY: 0
                });
            });

            teamBConfigs.forEach((cfg, idx) => {
                const char = createHumanoid(cfg);
                char.root.position.set(cfg.homeDef[0], 0.18, cfg.homeDef[1]);
                players.push({
                    id: idx + 5,
                    team: 1, // Team B attacks Left Hoop (-X)
                    char,
                    homeOff: new THREE.Vector3(cfg.homeOff[0], 0.18, cfg.homeOff[1]),
                    homeDef: new THREE.Vector3(cfg.homeDef[0], 0.18, cfg.homeDef[1]),
                    target: new THREE.Vector3(cfg.homeDef[0], 0.18, cfg.homeDef[1]),
                    cutOffset: new THREE.Vector3(),
                    phase: (idx + 5) * 1.3,
                    jumpY: 0
                });
            });

            // Live Basketball Game State Machine
            const game = {
                offenseTeam: 0,
                carrier: players[0],
                state: 'DRIBBLE', // 'DRIBBLE' | 'DRIVE' | 'SHOOT' | 'LOOSE' (ball airborne or on the floor)
                stateTimer: 0,
                passesDone: 0,
                scoreA: 24,
                scoreB: 22,
                ballFree: false,      // true while nobody holds the ball (airborne or loose)
                plan: null,           // 'pass' | 'drive', decided once per dribble
                receiver: null,
                shotInFlight: false,
                shotTeam: 0,
                shotHoop: null,
                reboundPending: false,
                lastTouch: null,
                touchGrace: 0,        // seconds the last toucher cannot catch their own throw
                blockClaimTeam: -1,   // team barred from picking up the ball right after a made basket
                blockClaimTimer: 0,
                targetHoop: rightHoop,
                netRippleTimer: 0
            };

            // Ball physics in scene units; gravity is scaled so the 5.05-unit rim matches a real 3.05 m rim
            const BALL_R = 0.34;
            const FLOOR_BALL_Y = 0.18 + BALL_R;
            const GRAVITY = 16.3;
            const DRIBBLE_PUSH = 4.0;                    // minimum upward speed the hand gives on each bounce
            const BALL_HOLD_K = 60, BALL_HOLD_C = 11;    // spring pulling the held ball toward the hand
            const RIM_R = 0.46, RIM_TUBE = 0.065;
            const RIM_IN_R = RIM_R - RIM_TUBE - BALL_R * 0.5;   // ball centre inside this radius = clean swish
            const RIM_OUT_R = RIM_R + RIM_TUBE + BALL_R * 0.5;  // ball centre beyond this radius = no contact
            const allHoops = [leftHoop, rightHoop];
            const ballVel = new THREE.Vector3();
            const lastHandPt = new THREE.Vector3();

            function getHandPoint(p, overhead) {
                const root = p.char.root.position;
                const yaw = p.char.root.rotation.y;
                const fwd = overhead ? 0.2 : 0.55;
                const side = overhead ? 0 : 0.3;
                return new THREE.Vector3(
                    root.x + Math.sin(yaw) * fwd + Math.cos(yaw) * side,
                    root.y + (overhead ? 2.35 : 1.0),
                    root.z + Math.cos(yaw) * fwd - Math.sin(yaw) * side
                );
            }

            // Launch velocity that reaches `to` after `time` seconds under gravity
            function launchVelocity(from, to, time) {
                return new THREE.Vector3(
                    (to.x - from.x) / time,
                    (to.y - from.y) / time + 0.5 * GRAVITY * time,
                    (to.z - from.z) / time
                );
            }

            function releaseBall(passer, nextState, grace) {
                game.carrier = null;
                game.ballFree = true;
                game.plan = null;
                game.lastTouch = passer;
                game.touchGrace = grace;
                game.state = nextState;
                game.stateTimer = 0;
            }

            function claimBall(p) {
                const teamChanged = p.team !== game.offenseTeam;
                const rebound = game.reboundPending;
                game.ballFree = false;
                game.carrier = p;
                game.plan = null;
                lastHandPt.copy(getHandPoint(p, false));
                game.lastTouch = p;
                game.touchGrace = 0;
                game.shotInFlight = false;
                game.reboundPending = false;
                game.state = 'DRIBBLE';
                game.stateTimer = 0;
                if (teamChanged) {
                    game.offenseTeam = p.team;
                    game.passesDone = 0;
                    setPlayStatus(p.team === 0 ? 'Street Team picks it up and takes over!' : 'Park Team picks it up and takes over!');
                } else if (rebound) {
                    setPlayStatus('Rebound secured! Keep the possession.');
                } else {
                    setPlayStatus('Clean catch!');
                }
            }

            // A loose ball is only picked up by a player who reaches it
            function checkBallClaims() {
                if (!game.ballFree) return;
                let best = null, bestDist = 1.05;
                const y = ballGroup.position.y;
                if (y < 0.3 || y > 2.7) return;
                players.forEach(p => {
                    if (p === game.lastTouch && game.touchGrace > 0) return;
                    if (game.blockClaimTimer > 0 && p.team === game.blockClaimTeam) return;
                    const d = Math.hypot(p.char.root.position.x - ballGroup.position.x, p.char.root.position.z - ballGroup.position.z);
                    if (d < bestDist) { bestDist = d; best = p; }
                });
                if (best) claimBall(best);
            }

            function scoreShot() {
                if (game.shotTeam === 0) {
                    game.scoreA += 2;
                    scoreAEl.textContent = game.scoreA;
                } else {
                    game.scoreB += 2;
                    scoreBEl.textContent = game.scoreB;
                }
                game.netRippleTimer = 0.55;
                game.shotInFlight = false;
                game.blockClaimTeam = game.shotTeam;
                game.blockClaimTimer = 1.5;
                game.state = 'LOOSE';
                setPlayStatus('🔥 SWISH! Nothing but net! (+2 PTS)');
            }

            // Integrates ball motion with gravity, floor/backboard/rim collisions, and the hand spring
            function stepBallPhysics(dt) {
                const holder = game.ballFree ? null : game.carrier;
                const overhead = !!holder && game.state === 'SHOOT';
                const steps = Math.max(1, Math.ceil(dt / (1 / 120)));
                const h = dt / steps;
                const pos = ballGroup.position;
                let landed = false;
                let hand = null, handVel = null;
                if (holder) {
                    // Hand velocity is measured once per frame, so the spring tracks a moving hand without lag
                    hand = getHandPoint(holder, overhead);
                    handVel = hand.clone().sub(lastHandPt).divideScalar(Math.max(dt, 1e-4));
                    lastHandPt.copy(hand);
                }

                for (let i = 0; i < steps; i++) {
                    const px0 = pos.x, py0 = pos.y;

                    if (holder) {
                        ballVel.x += (BALL_HOLD_K * (hand.x - pos.x) + BALL_HOLD_C * (handVel.x - ballVel.x)) * h;
                        ballVel.z += (BALL_HOLD_K * (hand.z - pos.z) + BALL_HOLD_C * (handVel.z - ballVel.z)) * h;
                        if (overhead) {
                            ballVel.y += (BALL_HOLD_K * (hand.y - pos.y) + BALL_HOLD_C * (handVel.y - ballVel.y)) * h;
                        } else {
                            ballVel.y -= GRAVITY * h;
                        }
                    } else {
                        ballVel.y -= GRAVITY * h;
                    }
                    pos.addScaledVector(ballVel, h);

                    if (pos.y < FLOOR_BALL_Y) {
                        pos.y = FLOOR_BALL_Y;
                        if (ballVel.y < 0) {
                            const impact = -ballVel.y;
                            if (holder) {
                                ballVel.y = Math.max(impact * 0.8, DRIBBLE_PUSH);
                            } else {
                                ballVel.y = impact > 1.0 ? impact * 0.6 : 0;
                                landed = true;
                            }
                        }
                        if (!holder) {
                            const roll = Math.exp(-1.6 * h);
                            ballVel.x *= roll;
                            ballVel.z *= roll;
                        }
                    }

                    if (!holder) {
                        if (Math.abs(pos.x) > 19.9) { pos.x = Math.sign(pos.x) * 19.9; ballVel.x *= -0.5; }
                        if (Math.abs(pos.z) > 10.9) { pos.z = Math.sign(pos.z) * 10.9; ballVel.z *= -0.5; }

                        allHoops.forEach(hp => {
                            // Backboard: the ball bounces off the court-facing surface inside the board's extent
                            const plane = hp.boardFaceX + hp.boardDir * BALL_R;
                            if ((px0 - plane) * hp.boardDir > 0 && (pos.x - plane) * hp.boardDir <= 0 &&
                                Math.abs(pos.z) < 1.7 && pos.y > 4.7 && pos.y < 7.0) {
                                pos.x = plane;
                                ballVel.x = -ballVel.x * 0.55;
                            }

                            // Rim: crossing the rim plane downward either drops through, or bounces off the iron
                            const rim = hp.rimPos;
                            if (py0 > rim.y && pos.y <= rim.y && ballVel.y < 0) {
                                const dx = pos.x - rim.x, dz = pos.z - rim.z;
                                const d = Math.hypot(dx, dz);
                                if (d < RIM_IN_R) {
                                    if (hp === game.shotHoop && game.shotInFlight) scoreShot();
                                    ballVel.x *= 0.7;   // net drag
                                    ballVel.z *= 0.7;
                                } else if (d < RIM_OUT_R) {
                                    const nx = dx / d, nz = dz / d;
                                    const vn = ballVel.x * nx + ballVel.z * nz;
                                    if (vn < 0) {
                                        ballVel.x -= 1.45 * vn * nx;
                                        ballVel.z -= 1.45 * vn * nz;
                                    }
                                    ballVel.y = -ballVel.y * 0.35;
                                    pos.y = rim.y + 0.01;
                                    if (hp === game.shotHoop && game.shotInFlight) setPlayStatus('Rim! It rattles...');
                                }
                            }
                        });
                    }
                }

                if (landed) {
                    game.state = 'LOOSE';
                    if (game.shotInFlight) {
                        game.shotInFlight = false;
                        game.reboundPending = true;
                        setPlayStatus('Missed! Battle for the rebound!');
                    }
                }
            }

            // Passes and shots are launched with a velocity; gravity and collisions do the rest
            function launchPass(passer, receiver) {
                const from = ballGroup.position.clone();
                const rp = receiver.char.root.position;
                // Lead the receiver a little toward the spot they are running to
                const lead = new THREE.Vector3(receiver.target.x - rp.x, 0, receiver.target.z - rp.z);
                if (lead.length() > 3) lead.setLength(3);
                const aim = new THREE.Vector3(
                    rp.x + lead.x + (Math.random() - 0.5) * 1.0,
                    1.2,
                    rp.z + lead.z + (Math.random() - 0.5) * 1.0
                );
                const horiz = Math.hypot(aim.x - from.x, aim.z - from.z);
                const T = THREE.MathUtils.clamp(horiz / 9, 0.45, 1.1);
                const vel = launchVelocity(from, aim, T);
                vel.multiplyScalar(1 + (Math.random() - 0.5) * 0.06);
                ballVel.copy(vel);
                releaseBall(passer, 'LOOSE', 0.6);
                setPlayStatus(passer.team === 0 ? 'Street Team crisp pass across court!' : 'Park Team swinging the rock!');
            }

            function launchShot(shooter, hoop) {
                const from = ballGroup.position.clone();
                const rim = hoop.rimPos;
                const horiz = Math.hypot(rim.x - from.x, rim.z - from.z);
                const T = THREE.MathUtils.clamp(horiz / 8.5, 0.7, 1.1);
                // Random aim error inside the rim; whether it drops is decided by the rim collision
                const ang = Math.random() * Math.PI * 2;
                const rad = Math.sqrt(Math.random()) * 0.32;
                const aim = new THREE.Vector3(rim.x + Math.cos(ang) * rad, rim.y, rim.z + Math.sin(ang) * rad);
                const vel = launchVelocity(from, aim, T);
                vel.multiplyScalar(1 + (Math.random() - 0.5) * 0.03);
                ballVel.copy(vel);
                game.shotHoop = hoop;
                game.shotTeam = shooter.team;
                game.shotInFlight = true;
                releaseBall(shooter, 'LOOSE', 0.6);
                setPlayStatus('Shot is up...');
            }

            ballGroup.position.copy(getHandPoint(game.carrier, false));
            ballVel.set(0, 0, 0);

            const scoreAEl = document.getElementById('score-a');
            const scoreBEl = document.getElementById('score-b');
            const statusEl = document.getElementById('play-status');

            function setPlayStatus(text) {
                statusEl.textContent = text;
            }

            // Hard body constraint: torsos are ~0.9 wide, so centres must stay 1.0 apart on the floor
            function separatePlayers() {
                const MIN_SEP = 1.0;
                for (let iter = 0; iter < 4; iter++) {
                    let overlapped = false;
                    for (let i = 0; i < players.length; i++) {
                        for (let j = i + 1; j < players.length; j++) {
                            const a = players[i].char.root.position;
                            const b = players[j].char.root.position;
                            const dx = b.x - a.x, dz = b.z - a.z;
                            const d = Math.hypot(dx, dz);
                            if (d >= MIN_SEP) continue;
                            overlapped = true;
                            // Exactly stacked players get an arbitrary separating axis
                            const nx = d > 1e-4 ? dx / d : 1;
                            const nz = d > 1e-4 ? dz / d : 0;
                            const push = (MIN_SEP - d) * 0.5;
                            a.x -= nx * push; a.z -= nz * push;
                            b.x += nx * push; b.z += nz * push;
                        }
                    }
                    players.forEach(p => {
                        const pos = p.char.root.position;
                        pos.x = THREE.MathUtils.clamp(pos.x, -19.5, 19.5);
                        pos.z = THREE.MathUtils.clamp(pos.z, -10.5, 10.5);
                    });
                    if (!overlapped) break;
                }
            }

            function updateBasketballSimulation(dt, elapsed) {
                game.stateTimer += dt;
                game.touchGrace = Math.max(0, game.touchGrace - dt);
                game.blockClaimTimer = Math.max(0, game.blockClaimTimer - dt);
                const hoop = game.offenseTeam === 0 ? rightHoop : leftHoop;
                game.targetHoop = hoop;

                // Periodically refresh off-ball cutting offsets so all 10 players move organically
                if (Math.floor((elapsed - dt) * 0.7) < Math.floor(elapsed * 0.7)) {
                    players.forEach(p => {
                        p.cutOffset.set((Math.random() - 0.5) * 5.2, 0, (Math.random() - 0.5) * 4.4);
                    });
                }

                // State transitions
                if (game.state === 'DRIBBLE') {
                    if (game.stateTimer > 1.7 && !game.plan) {
                        const teammates = players.filter(p => p.team === game.offenseTeam && p !== game.carrier);
                        if (game.passesDone < 2 && Math.random() < 0.72) {
                            game.plan = 'pass';
                            game.receiver = teammates[Math.floor(Math.random() * teammates.length)];
                        } else {
                            game.plan = 'drive';
                        }
                    }
                    if (game.plan === 'drive') {
                        game.plan = null;
                        game.state = 'DRIVE';
                        game.stateTimer = 0;
                        setPlayStatus(game.offenseTeam === 0 ? 'Driving into the painted key!' : 'Fast break drive to the hoop!');
                    } else if (game.plan === 'pass' && ballGroup.position.y > 0.9) {
                        // Release near the top of the dribble so the pass leaves the hand
                        launchPass(game.carrier, game.receiver);
                        game.passesDone++;
                    }
                } else if (game.state === 'DRIVE') {
                    const attackSpot = new THREE.Vector3(
                        hoop.rimPos.x + (game.offenseTeam === 0 ? -5.5 : 5.5),
                        0.18,
                        (Math.sin(elapsed * 2) * 3.5)
                    );
                    game.carrier.target.copy(attackSpot);
                    if (game.carrier.char.root.position.distanceTo(attackSpot) < 2.2 || game.stateTimer > 1.8) {
                        // Elevate for Jump Shot!
                        game.state = 'SHOOT';
                        game.stateTimer = 0;
                        lastHandPt.copy(getHandPoint(game.carrier, true));
                        setPlayStatus('Elevating for the jump shot...');
                    }
                } else if (game.state === 'SHOOT') {
                    // Shooter jump arc
                    game.carrier.jumpY = Math.sin(Math.min(1, game.stateTimer / 0.65) * Math.PI) * 1.15;
                    if (game.stateTimer >= 0.45) {
                        launchShot(game.carrier, hoop);
                    }
                }
                // LOOSE: the ball is in flight or on the floor; physics and the pickup rule drive it

                // Animate net ripple when a shot goes through
                if (game.netRippleTimer > 0) {
                    game.netRippleTimer -= dt;
                    const s = 1 + Math.sin(game.netRippleTimer * 28) * 0.28;
                    hoop.netMesh.scale.set(s, 1 - (s - 1) * 0.4, s);
                } else {
                    leftHoop.netMesh.scale.set(1, 1, 1);
                    rightHoop.netMesh.scale.set(1, 1, 1);
                }

                // While the ball is loose, the nearest player on each team goes to pick it up
                const chasers = new Set();
                if (game.ballFree) {
                    [0, 1].forEach(team => {
                        let best = null, bestDist = Infinity;
                        players.forEach(p => {
                            if (p.team !== team) return;
                            const d = Math.hypot(p.char.root.position.x - ballGroup.position.x, p.char.root.position.z - ballGroup.position.z);
                            if (d < bestDist) { bestDist = d; best = p; }
                        });
                        if (best) chasers.add(best);
                    });
                }

                // Update all 10 Players' Positions, Anti-Clumping Spacing & 2-Joint Limb Animations
                players.forEach(p => {
                    const isOffense = p.team === game.offenseTeam;
                    const isCarrier = (p === game.carrier) && (game.state === 'DRIBBLE' || game.state === 'DRIVE');

                    if (chasers.has(p)) {
                        p.target.set(
                            THREE.MathUtils.clamp(ballGroup.position.x, -19.5, 19.5),
                            0.18,
                            THREE.MathUtils.clamp(ballGroup.position.z, -10.5, 10.5)
                        );
                    } else if (!isCarrier && !(p === game.carrier && game.state === 'SHOOT')) {
                        if (isOffense) {
                            p.target.copy(p.homeOff).add(p.cutOffset);
                        } else {
                            // Defenders stay near their assigned zone/man with wide spacing
                            const man = players[(p.id + 5) % 10];
                            p.target.copy(p.homeDef).lerp(man.char.root.position, 0.38);
                            p.target.y = 0.18;
                        }
                    } else if (game.state === 'DRIBBLE') {
                        p.target.copy(p.homeOff).add(p.cutOffset.clone().multiplyScalar(0.45));
                    }

                    // Personal-space repulsion so players never bunch up in a pile
                    players.forEach(other => {
                        if (other !== p && !chasers.has(p)) {
                            const sepX = p.char.root.position.x - other.char.root.position.x;
                            const sepZ = p.char.root.position.z - other.char.root.position.z;
                            const d = Math.hypot(sepX, sepZ);
                            if (d < 3.4 && d > 0.001) {
                                const push = (3.4 - d) * 1.4;
                                p.target.x += (sepX / d) * push;
                                p.target.z += (sepZ / d) * push;
                            }
                        }
                    });

                    // Keep players inside court bounds
                    p.target.x = THREE.MathUtils.clamp(p.target.x, -19.5, 19.5);
                    p.target.z = THREE.MathUtils.clamp(p.target.z, -10.5, 10.5);

                    const pos = p.char.root.position;
                    const dx = p.target.x - pos.x;
                    const dz = p.target.z - pos.z;
                    const dist = Math.hypot(dx, dz);
                    const moveSpeed = chasers.has(p) ? 6.4 : (isCarrier ? 6.0 : 5.2);

                    if (dist > 0.18) {
                        pos.x += (dx / dist) * Math.min(dist, moveSpeed * dt);
                        pos.z += (dz / dist) * Math.min(dist, moveSpeed * dt);
                    }
                    // A shooter who has released the ball lands smoothly
                    if (p !== game.carrier) p.jumpY = Math.max(0, (p.jumpY || 0) - dt * 3);
                    pos.y = 0.18 + (p.jumpY || 0);

                    // Face the ball or hoop
                    const lookTarget = isCarrier ? hoop.rimPos : ballGroup.position;
                    const targetYaw = Math.atan2(lookTarget.x - pos.x, lookTarget.z - pos.z);
                    p.char.root.rotation.y = targetYaw;

                    // Articulated Running & Knee Flexion
                    const stridePhase = elapsed * 10.5 + p.phase;
                    const isMoving = dist > 0.25;
                    const stride = isMoving ? Math.sin(stridePhase) * 0.62 : Math.sin(elapsed * 3 + p.phase) * 0.08;
                    p.char.leftLeg.rotation.x = stride;
                    p.char.rightLeg.rotation.x = -stride;

                    if (p.char.leftLeg.userData.knee) {
                        p.char.leftLeg.userData.knee.rotation.x = isMoving ? Math.max(0.1, -Math.cos(stridePhase) * 0.65) : 0.18;
                        p.char.rightLeg.userData.knee.rotation.x = isMoving ? Math.max(0.1, Math.cos(stridePhase) * 0.65) : 0.18;
                    }

                    if (isCarrier) {
                        // Active Dribbling Shoulder + Elbow Flexion & Ball Bounce
                        // The arm pushes the ball down as it meets the floor and lifts as it rises (ball height is from physics)
                        const bounce = 1 - THREE.MathUtils.clamp((ballGroup.position.y - FLOOR_BALL_Y) / 0.8, 0, 1);
                        p.char.rightArm.rotation.x = -0.55 + bounce * 0.35;
                        if (p.char.rightArm.userData.elbow) p.char.rightArm.userData.elbow.rotation.x = -0.85 + bounce * 0.55;
                        p.char.leftArm.rotation.x = -0.35;
                        if (p.char.leftArm.userData.elbow) p.char.leftArm.userData.elbow.rotation.x = -0.55;
                    } else if (p === game.carrier && game.state === 'SHOOT') {
                        // Follow-through shooting arms raised high
                        p.char.rightArm.rotation.x = -2.6;
                        if (p.char.rightArm.userData.elbow) p.char.rightArm.userData.elbow.rotation.x = -0.25;
                        p.char.leftArm.rotation.x = -2.35;
                        if (p.char.leftArm.userData.elbow) p.char.leftArm.userData.elbow.rotation.x = -0.35;
                    } else if (!isOffense && pos.distanceTo(ballGroup.position) < 6.0) {
                        // Active Athletic Defensive Stance
                        p.char.leftArm.rotation.x = -1.35 + Math.sin(elapsed * 8 + p.phase) * 0.22;
                        p.char.rightArm.rotation.x = -1.35 - Math.sin(elapsed * 8 + p.phase) * 0.22;
                        if (p.char.leftArm.userData.elbow) p.char.leftArm.userData.elbow.rotation.x = -0.65;
                        if (p.char.rightArm.userData.elbow) p.char.rightArm.userData.elbow.rotation.x = -0.65;
                    } else {
                        p.char.leftArm.rotation.x = -stride * 0.65;
                        p.char.rightArm.rotation.x = stride * 0.65;
                        if (p.char.leftArm.userData.elbow) p.char.leftArm.userData.elbow.rotation.x = -0.45;
                        if (p.char.rightArm.userData.elbow) p.char.rightArm.userData.elbow.rotation.x = -0.45;
                    }
                });

                separatePlayers();

                // Physics runs after players move so the hand spring tracks current hand positions
                stepBallPhysics(dt);
                checkBallClaims();
                ballMesh.rotation.x += (ballVel.z * dt) / BALL_R;
                ballMesh.rotation.z -= (ballVel.x * dt) / BALL_R;

                // Sync ground shadow under ball
                ballShadow.position.x = ballGroup.position.x;
                ballShadow.position.z = ballGroup.position.z;
                const hScale = Math.max(0.35, 1.15 - ballGroup.position.y * 0.1);
                ballShadow.scale.setScalar(hScale);
            }

            // ============================================================================
            // 11. PARK LIFE SIMULATION: BLEACHER FANS, BENCH + GOLDEN RETRIEVER,
            //     SWIMMING DUCKS, SCOOTER KIDS, PLAYGROUND & PEDESTRIANS
            // ============================================================================
            // A. 3 Bleacher Spectators cheering & watching the ball
            const spectators = [];
            const specData = [
                { x: -3.2, row: 1, shirt: 0x64748b, shorts: 0x334155 },
                { x: 0.4,  row: 2, shirt: 0x2563eb, shorts: 0x1e293b },
                { x: 3.6,  row: 0, shirt: 0x3b82f6, shorts: 0x1f2937 }
            ];
            specData.forEach((s, idx) => {
                const fan = createHumanoid({ shirtColor: s.shirt, shortsColor: s.shorts, scale: 0.92, hairStyle: idx });
                const y = 0.22 + s.row * 0.62;
                const z = -14.2 + (0.85 - s.row * 0.85) + 0.15;
                fan.root.position.set(0.5 + s.x, y, z);
                fan.leftLeg.rotation.x = -Math.PI / 2.1;
                fan.rightLeg.rotation.x = -Math.PI / 2.1;
                if (fan.leftLeg.userData.knee) {
                    fan.leftLeg.userData.knee.rotation.x = Math.PI / 2.2;
                    fan.rightLeg.userData.knee.rotation.x = Math.PI / 2.2;
                }
                spectators.push({ fan, phase: idx * 2.1 });
            });

            // B. Man in Blue Jacket & Cap + Sculpted Golden Retriever on Lakeside Bench (x: -6.2, z: 16.8)
            const benchMan = createHumanoid({
                shirtColor: 0x1e3a5f,
                shortsColor: 0x2c353d,
                hairColor: 0x1e293b,
                hasCap: true,
                capColor: 0x1e3a5f,
                scale: 0.95
            });
            benchMan.root.position.set(-7.0, 0.34, 16.95);
            benchMan.leftLeg.rotation.x = -Math.PI / 2.1;
            benchMan.rightLeg.rotation.x = -Math.PI / 2.1;
            if (benchMan.leftLeg.userData.knee) {
                benchMan.leftLeg.userData.knee.rotation.x = Math.PI / 2.2;
                benchMan.rightLeg.userData.knee.rotation.x = Math.PI / 2.2;
            }

            // Sculpted Organic Golden Retriever sitting next to him on the bench
            const dogGroup = new THREE.Group();
            dogGroup.position.set(-5.25, 0.78, 16.85);
            scene.add(dogGroup);

            const furMat = toonMat(0xd99b4e);
            const chestFurMat = toonMat(0xe8b56b);
            const earMat = toonMat(0xb3772e);
            const noseMat = toonMat(0x1c1917);

            const dogTorso = addOutlinedMesh(new THREE.CylinderGeometry(0.24, 0.28, 0.68, 10), furMat, dogGroup, 0.09);
            dogTorso.position.set(0, 0.34, -0.04);
            dogTorso.rotation.x = -0.38;

            const dogChest = addOutlinedMesh(new THREE.SphereGeometry(0.25, 10, 8), chestFurMat, dogGroup, 0.08);
            dogChest.position.set(0, 0.44, 0.14);

            // Front Paws & Hind Haunches
            for (let sx of [-0.14, 0.14]) {
                const frontLeg = addOutlinedMesh(new THREE.CylinderGeometry(0.065, 0.055, 0.46, 8), furMat, dogGroup, 0.09);
                frontLeg.position.set(sx, 0.22, 0.20);
                const haunch = addOutlinedMesh(new THREE.SphereGeometry(0.15, 8, 8), furMat, dogGroup, 0.09);
                haunch.scale.set(0.8, 1.1, 1.2);
                haunch.position.set(sx * 1.2, 0.16, -0.18);
            }

            const dogHead = new THREE.Group();
            dogHead.position.set(0, 0.76, 0.16);
            dogGroup.add(dogHead);

            const cranium = addOutlinedMesh(new THREE.SphereGeometry(0.23, 12, 10), furMat, dogHead, 0.09);
            cranium.scale.set(0.95, 0.92, 1.05);

            const snout = addOutlinedMesh(new THREE.CylinderGeometry(0.09, 0.13, 0.26, 10), chestFurMat, dogHead, 0.09);
            snout.rotation.x = Math.PI / 2;
            snout.position.set(0, -0.04, 0.22);

            const nose = new THREE.Mesh(new THREE.SphereGeometry(0.045, 6, 6), noseMat);
            nose.position.set(0, 0.01, 0.35);
            dogHead.add(nose);

            for (let sx of [-1, 1]) {
                const ear = addOutlinedMesh(new THREE.SphereGeometry(0.11, 8, 8), earMat, dogHead, 0.09);
                ear.scale.set(0.45, 1.35, 0.82);
                ear.position.set(sx * 0.21, -0.04, -0.02);
                ear.rotation.z = sx * -0.22;
            }

            const dogTail = addOutlinedMesh(new THREE.CylinderGeometry(0.045, 0.08, 0.52, 8), earMat, dogGroup, 0.1);
            dogTail.rotation.x = -1.1;
            dogTail.position.set(0, 0.18, -0.42);

            // Second seated visitor on upper-right bench (x: 20.5, z: -19.2)
            const rightBenchPerson = createHumanoid({ shirtColor: 0x1e293b, shortsColor: 0x334155, scale: 0.92 });
            rightBenchPerson.root.position.set(20.5, 0.34, -19.05);
            rightBenchPerson.leftLeg.rotation.x = -Math.PI / 2.1;
            rightBenchPerson.rightLeg.rotation.x = -Math.PI / 2.1;
            if (rightBenchPerson.leftLeg.userData.knee) {
                rightBenchPerson.leftLeg.userData.knee.rotation.x = Math.PI / 2.2;
                rightBenchPerson.rightLeg.userData.knee.rotation.x = Math.PI / 2.2;
            }

            // C. Two Sculpted Mallard Ducks Swimming in the Bottom-Left Lake
            const ducks = [];
            function createDuck(isMale = true) {
                const dGroup = new THREE.Group();
                const bodyMat = toonMat(isMale ? 0x8c7a6b : 0x73573d);
                const wingMat = toonMat(isMale ? 0x6e5d4f : 0x5c432d);
                const headMat = toonMat(isMale ? 0x156e43 : 0x634832);
                const billMat = toonMat(0xeab308);
                const ringMat = toonMat(0xf8fafc);

                // Sculpted Ellipsoid Duck Body & Upturned Tail
                const body = addOutlinedMesh(new THREE.SphereGeometry(0.42, 12, 10), bodyMat, dGroup, 0.1);
                body.scale.set(0.82, 0.58, 1.32);
                body.position.y = 0.14;

                const wings = addOutlinedMesh(new THREE.SphereGeometry(0.36, 10, 8), wingMat, dGroup, 0.08);
                wings.scale.set(0.92, 0.48, 1.05);
                wings.position.set(0, 0.20, -0.04);

                const tail = addOutlinedMesh(new THREE.ConeGeometry(0.16, 0.32, 6), bodyMat, dGroup, 0.1);
                tail.position.set(0, 0.24, -0.52);
                tail.rotation.x = -0.85;

                // Graceful Neck, White Collar Ring, Iridescent Green Head & Beak
                const neck = addOutlinedMesh(new THREE.CylinderGeometry(0.12, 0.15, 0.34, 10), headMat, dGroup, 0.1);
                neck.position.set(0, 0.36, 0.34);
                neck.rotation.x = 0.22;

                if (isMale) {
                    const neckRing = new THREE.Mesh(new THREE.CylinderGeometry(0.145, 0.15, 0.06, 10), ringMat);
                    neckRing.position.set(0, 0.28, 0.32);
                    neckRing.rotation.x = 0.22;
                    dGroup.add(neckRing);
                }

                const head = addOutlinedMesh(new THREE.SphereGeometry(0.165, 10, 10), headMat, dGroup, 0.1);
                head.scale.set(0.92, 0.95, 1.12);
                head.position.set(0, 0.52, 0.38);

                const bill = addOutlinedMesh(new THREE.ConeGeometry(0.095, 0.26, 8), billMat, dGroup, 0.1);
                bill.rotation.x = Math.PI / 2;
                bill.scale.set(1.1, 1.0, 0.55);
                bill.position.set(0, 0.50, 0.58);

                // Water wake rings around duck
                const wake = new THREE.Mesh(
                    new THREE.RingGeometry(0.52, 0.74, 16),
                    new THREE.MeshBasicMaterial({ color: 0xdff6ff, side: THREE.DoubleSide, transparent: true, opacity: 0.78 })
                );
                wake.rotation.x = -Math.PI / 2;
                wake.position.y = 0.03;
                dGroup.add(wake);

                scene.add(dGroup);
                return { group: dGroup, wake };
            }
            ducks.push({ ...createDuck(true),  cx: -21.5, cz: 30.5, rx: 3.8, rz: 2.2, speed: 0.52, phase: 0 });
            ducks.push({ ...createDuck(false), cx: -21.5, cz: 30.5, rx: 3.8, rz: 2.2, speed: 0.52, phase: -0.65 });

            // D. Three Kids Riding Kick Scooters along the Upper-Right Sidewalk (Z = -17.5)
            const scooterRiders = [];
            // Riders heading toward each other step to opposite sides of the lane, pass, then return
            const SCOOTER_LANE_Z = -17.5;
            const SCOOTER_SIDESTEP = 1.0;
            const SCOOTER_SEE = 4;
            const scooterConfigs = [
                { startX: 12, shirt: 0xec4899, helmet: 0xf472b6 },
                { startX: 22, shirt: 0x2563eb, helmet: 0x38bdf8 },
                { startX: 31, shirt: 0x4d7c0f, helmet: 0xa3e635 }
            ];
            scooterConfigs.forEach((sc, idx) => {
                const kid = createHumanoid({
                    shirtColor: sc.shirt,
                    shortsColor: 0x1e293b,
                    scale: 0.76,
                    hasHelmet: true,
                    helmetColor: sc.helmet
                });

                // Attach Kick Scooter Mesh to Kid
                const scooter = new THREE.Group();
                const metalMat = toonMat(0x94a3b8);
                const deck = addOutlinedMesh(new THREE.BoxGeometry(0.42, 0.1, 1.55), toonMat(0x334155), scooter, 0.1);
                deck.position.set(0, 0.22, 0);
                const stem = addOutlinedMesh(new THREE.CylinderGeometry(0.06, 0.06, 1.45, 6), metalMat, scooter, 0.1);
                stem.position.set(0, 0.92, 0.65);
                const bars = addOutlinedMesh(new THREE.CylinderGeometry(0.05, 0.05, 0.85, 6), metalMat, scooter, 0.1);
                bars.rotation.z = Math.PI / 2;
                bars.position.set(0, 1.62, 0.65);

                kid.root.add(scooter);
                kid.leftArm.rotation.x = -1.1;
                kid.rightArm.rotation.x = -1.1;
                kid.root.position.set(sc.startX, 0.18, -17.5);
                kid.root.rotation.y = Math.PI / 2;
                scooterRiders.push({ kid, x: sc.startX, z: SCOOTER_LANE_Z, dir: 1, yaw: Math.PI / 2, idx, phase: idx * 1.7 });
            });

            // E. Playground Kids: Swinging Kids + Child Sliding Down Blue Slide
            swingPivots.forEach((pivot, idx) => {
                const swinger = createHumanoid({
                    shirtColor: idx === 0 ? 0xf59e0b : 0xec4899,
                    shortsColor: 0x1e3a8a,
                    scale: 0.68
                });
                swinger.root.position.set(0, -3.55, 0.1);
                swinger.leftLeg.rotation.x = -1.1;
                swinger.rightLeg.rotation.x = -1.1;
                swinger.leftArm.rotation.x = -0.8;
                swinger.rightArm.rotation.x = -0.8;
                pivot.add(swinger.root);
            });

            const slideKid = createHumanoid({ shirtColor: 0x3b82f6, shortsColor: 0xfacc15, scale: 0.68 });
            let slideProgress = 0;

            // F. Walking Pedestrians around the Park Paths
            const walkers = [
                {
                    char: createHumanoid({ shirtColor: 0x475569, shortsColor: 0x1e293b, scale: 0.9 }),
                    x1: -12, z1: -22.5, x2: 6, z2: -15.5, speed: 0.22, t: 0.2
                },
                {
                    char: createHumanoid({ shirtColor: 0xfacc15, shortsColor: 0x1e3a8a, scale: 0.72 }),
                    x1: -34, z1: -4.5, x2: -29, z2: 3.5, speed: 0.28, t: 0.6
                },
                {
                    char: createHumanoid({ shirtColor: 0x15803d, shortsColor: 0x1e293b, scale: 0.9 }),
                    x1: -39, z1: -1.5, x2: -31, z2: 6.5, speed: 0.2, t: 0.4
                },
                {
                    char: createHumanoid({ shirtColor: 0x2563eb, shortsColor: 0x1e293b, scale: 0.9 }),
                    x1: 25, z1: 14.5, x2: 29, z2: -4.5, speed: 0.18, t: 0.1
                },
                {
                    char: createHumanoid({ shirtColor: 0x9ca3af, shortsColor: 0x1f2937, scale: 0.9 }),
                    x1: 12, z1: -27.5, x2: 28, z2: -27.5, speed: 0.21, t: 0.5
                }
            ];

            // ============================================================================
            // 12. UI EVENT LISTENERS & CAMERA PRESET TRANSITIONS
            // ============================================================================
            const camTargetPos = new THREE.Vector3(78, 72, 78);
            const camTargetLook = new THREE.Vector3(0, 0, 0);
            let targetZoom = referenceZoom();
            let isTransitioningCam = false;

            const camPresets = {
                reference:  { pos: [78, 72, 78],  look: [0, 0, 0],       get zoom() { return referenceZoom(); } },
                court:      { pos: [55, 52, 55],  look: [1, 1.5, 0],     zoom: 1.75 },
                lake:       { pos: [48, 42, 65],  look: [-9, 0.5, 21],   zoom: 2.15 },
                playground: { pos: [35, 48, 45],  look: [-35, 1.5, -11], zoom: 2.05 },
                follow:     { pos: [65, 58, 65],  look: [0, 1, 0],       zoom: 1.85 }
            };

            document.querySelectorAll('.cam-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    cameraMode = btn.dataset.cam;
                    const preset = camPresets[cameraMode];
                    camTargetPos.set(...preset.pos);
                    camTargetLook.set(...preset.look);
                    targetZoom = preset.zoom;
                    isTransitioningCam = true;
                });
            });

            // Pixel-Art Filter Toggle
            const btnPixel = document.getElementById('btn-pixel');
            btnPixel.addEventListener('click', () => {
                const isPixel = document.body.classList.toggle('pixel-mode');
                btnPixel.classList.toggle('active', isPixel);
                pixelScale = isPixel ? 0.52 : 1.0;
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2) * pixelScale);
            });

            // 2D Ink Outline Toggle
            const btnOutlines = document.getElementById('btn-outlines');
            btnOutlines.addEventListener('click', () => {
                outlinesEnabled = !outlinesEnabled;
                btnOutlines.classList.toggle('active', outlinesEnabled);
                outlineMeshes.forEach(m => { m.visible = outlinesEnabled; });
            });

            // Time-of-Day Lighting Toggle
            let timeMode = 0; // 0: Afternoon, 1: Golden Hour, 2: Night Park Lights
            const btnTime = document.getElementById('btn-time');
            btnTime.addEventListener('click', () => {
                timeMode = (timeMode + 1) % 3;
                if (timeMode === 0) {
                    btnTime.textContent = '☀️ Afternoon';
                    ambientLight.color.setHex(0xdcedc8);
                    ambientLight.intensity = 0.3;
                    dirLight.color.setHex(0xfff1c1);
                    dirLight.intensity = 1.15;
                    lampPointLights.forEach(l => { l.intensity = 0; });
                } else if (timeMode === 1) {
                    btnTime.textContent = '🌅 Golden Hour';
                    ambientLight.color.setHex(0xfed7aa);
                    ambientLight.intensity = 0.55;
                    dirLight.color.setHex(0xfb923c);
                    dirLight.intensity = 1.25;
                    lampPointLights.forEach(l => { l.intensity = 0.4; });
                } else {
                    btnTime.textContent = '🌙 Night Court';
                    ambientLight.color.setHex(0x1e293b);
                    ambientLight.intensity = 0.48;
                    dirLight.color.setHex(0x64748b);
                    dirLight.intensity = 0.35;
                    lampPointLights.forEach(l => { l.intensity = 1.35; });
                }
            });

            document.getElementById('speed-slider').addEventListener('input', e => {
                simSpeed = parseFloat(e.target.value);
            });

            window.addEventListener('resize', () => {
                const newAspect = window.innerWidth / window.innerHeight;
                camera.left = -frustumSize * newAspect / 2;
                camera.right = frustumSize * newAspect / 2;
                camera.top = frustumSize / 2;
                camera.bottom = -frustumSize / 2;
                if (cameraMode === 'reference') {
                    targetZoom = referenceZoom();
                    camera.zoom = targetZoom;
                }
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // ============================================================================
            // 13. MAIN ANIMATION LOOP
            // ============================================================================
            const clock = new THREE.Clock();
            let elapsed = 0;

            function animate() {
                requestAnimationFrame(animate);
                const rawDt = Math.min(0.05, clock.getDelta());
                const dt = rawDt * simSpeed;
                elapsed += dt;

                // 1. Update 5v5 Basketball Match Simulation
                updateBasketballSimulation(dt, elapsed);

                // 2. Bleacher Spectators track ball & cheer
                spectators.forEach((sp, i) => {
                    const lookYaw = Math.atan2(
                        ballGroup.position.x - sp.fan.root.position.x,
                        ballGroup.position.z - sp.fan.root.position.z
                    );
                    sp.fan.headGroup.rotation.y = THREE.MathUtils.clamp(lookYaw, -0.7, 0.7);
                    const cheer = game.netRippleTimer > 0 ? Math.sin(elapsed * 18 + sp.phase) * 0.8 - 1.6 : -0.3 + Math.sin(elapsed * 3 + sp.phase) * 0.15;
                    sp.fan.leftArm.rotation.x = cheer;
                    sp.fan.rightArm.rotation.x = cheer;
                });

                // 3. Lakeside Man petting & Golden Retriever wagging tail
                benchMan.rightArm.rotation.x = -0.65 + Math.sin(elapsed * 4) * 0.2;
                dogTail.rotation.y = Math.sin(elapsed * 14) * 0.45;
                dogHead.rotation.y = Math.sin(elapsed * 2.2) * 0.28;

                // 4. Lake Water Sparkles, Shoreline Foam & Swimming Ducks
                sparkles.forEach(sp => {
                    sp.mesh.scale.x = 0.45 + 0.55 * Math.sin(elapsed * 3.5 + sp.phase);
                    sp.mesh.position.x = sp.baseX + Math.sin(elapsed * 1.8 + sp.phase) * 0.35;
                });
                foamSquares.forEach(fm => {
                    fm.mesh.position.z = fm.baseZ + Math.sin(elapsed * 2.4 + fm.phase) * 0.22;
                });
                ducks.forEach(d => {
                    const angle = elapsed * d.speed + d.phase;
                    const nx = d.cx + Math.cos(angle) * d.rx;
                    const nz = d.cz + Math.sin(angle * 2) * d.rz;
                    const dx = nx - d.group.position.x;
                    const dz = nz - d.group.position.z;
                    if (Math.hypot(dx, dz) > 0.001) {
                        d.group.rotation.y = Math.atan2(dx, dz);
                    }
                    d.group.position.set(nx, -0.22 + Math.sin(elapsed * 4 + d.phase) * 0.035, nz);
                    d.wake.scale.setScalar(0.92 + Math.sin(elapsed * 5 + d.phase) * 0.16);
                });

                // 5. Kids on Kick Scooters gliding along right sidewalk
                scooterRiders.forEach(sr => {
                    sr.x += sr.dir * dt * 5.2;
                    if (sr.x > 33) sr.dir = -1;
                    if (sr.x < 8) sr.dir = 1;
                });
                // Riders heading at each other sidestep to opposite sides of the lane, pass, then return
                scooterRiders.forEach(sr => {
                    let target = SCOOTER_LANE_Z;
                    scooterRiders.forEach(other => {
                        if (other === sr || other.dir === sr.dir) return;
                        const gap = (other.x - sr.x) * sr.dir;
                        if (gap > 0 && gap < SCOOTER_SEE && target === SCOOTER_LANE_Z) {
                            target = SCOOTER_LANE_Z + (sr.idx < other.idx ? -SCOOTER_SIDESTEP : SCOOTER_SIDESTEP);
                        }
                    });
                    const zBefore = sr.z;
                    sr.z += (target - sr.z) * (1 - Math.exp(-dt * 8));
                    // Heading follows the actual velocity so the rider turns into the sidestep and back out of it
                    const vz = dt > 0 ? (sr.z - zBefore) / dt : 0;
                    const desiredYaw = Math.atan2(sr.dir * 5.2, vz);
                    const diff = Math.atan2(Math.sin(desiredYaw - sr.yaw), Math.cos(desiredYaw - sr.yaw));
                    sr.yaw += diff * (1 - Math.exp(-dt * 12));
                });
                scooterRiders.forEach(sr => {
                    sr.kid.root.position.x = sr.x;
                    sr.kid.root.position.z = sr.z;
                    sr.kid.root.rotation.y = sr.yaw;
                    sr.kid.rightLeg.rotation.x = Math.sin(elapsed * 9 + sr.phase) * 0.55;
                });

                // 6. Playground Swings & Slide Child Loop
                swingPivots.forEach((pivot, idx) => {
                    pivot.rotation.x = Math.sin(elapsed * 2.8 + idx * 1.8) * 0.52;
                });

                slideProgress = (slideProgress + dt * 0.42) % 1;
                if (slideProgress < 0.55) {
                    // Sliding down the blue chute
                    const t = slideProgress / 0.55;
                    slideKid.root.position.set(-33.8, 2.5 - t * 2.2, -13.6 + t * 3.6);
                    slideKid.root.rotation.y = 0;
                    slideKid.leftLeg.rotation.x = -0.9;
                    slideKid.rightLeg.rotation.x = -0.9;
                    slideKid.leftArm.rotation.x = -1.8;
                    slideKid.rightArm.rotation.x = -1.8;
                } else {
                    // Running back around to climb the ladder
                    const t = (slideProgress - 0.55) / 0.45;
                    slideKid.root.position.set(-33.8 - Math.sin(t * Math.PI) * 1.4, 0.25 + t * 2.2, -10.0 - t * 3.6);
                    slideKid.root.rotation.y = Math.PI;
                    slideKid.leftLeg.rotation.x = Math.sin(elapsed * 12) * 0.6;
                    slideKid.rightLeg.rotation.x = -Math.sin(elapsed * 12) * 0.6;
                }

                // 7. Strolling Pedestrians & Road Car
                walkers.forEach((w, idx) => {
                    w.t += dt * w.speed;
                    const pingPong = 0.5 - 0.5 * Math.cos(w.t * Math.PI);
                    const nx = THREE.MathUtils.lerp(w.x1, w.x2, pingPong);
                    const nz = THREE.MathUtils.lerp(w.z1, w.z2, pingPong);
                    const dx = nx - w.char.root.position.x;
                    const dz = nz - w.char.root.position.z;
                    if (Math.hypot(dx, dz) > 0.001) {
                        w.char.root.rotation.y = Math.atan2(dx, dz);
                    }
                    w.char.root.position.set(nx, 0.18, nz);
                    const step = Math.sin(elapsed * 7 + idx);
                    w.char.leftLeg.rotation.x = step * 0.48;
                    w.char.rightLeg.rotation.x = -step * 0.48;
                    w.char.leftArm.rotation.x = -step * 0.35;
                    w.char.rightArm.rotation.x = step * 0.35;
                });

                cruisingCar.position.x -= dt * 8.5;
                if (cruisingCar.position.x < -53) cruisingCar.position.x = 53;

                // 8. Smooth Camera Preset / Follow-Ball Tracking
                if (cameraMode === 'follow') {
                    controls.target.lerp(ballGroup.position, 0.08);
                    camera.zoom = THREE.MathUtils.lerp(camera.zoom, targetZoom, 0.06);
                    camera.updateProjectionMatrix();
                } else if (isTransitioningCam) {
                    camera.position.lerp(camTargetPos, 0.08);
                    controls.target.lerp(camTargetLook, 0.08);
                    camera.zoom = THREE.MathUtils.lerp(camera.zoom, targetZoom, 0.08);
                    camera.updateProjectionMatrix();
                    if (camera.position.distanceTo(camTargetPos) < 0.25 && Math.abs(camera.zoom - targetZoom) < 0.02) {
                        isTransitioningCam = false;
                    }
                }

                controls.update();
                renderer.render(scene, camera);
            }

            animate();
        };
    </script>
</body>
</html>
