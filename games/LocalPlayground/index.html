<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isometric 2D-Style Park Basketball Scene — Three.js</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #18241b;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .pixel-mode canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .retro-font {
            font-family: 'Press Start 2P', monospace;
        }
        .hud-panel {
            background: rgba(20, 28, 24, 0.88);
            border: 2px solid #3f5e46;
            box-shadow: 0 4px 0 #0d1410, 0 8px 20px rgba(0,0,0,0.45);
            backdrop-filter: blur(6px);
        }
        .retro-btn {
            background: #2b4231;
            border: 2px solid #537a5a;
            box-shadow: 0 3px 0 #142017;
            transition: all 0.1s ease;
        }
        .retro-btn:hover {
            background: #385740;
            transform: translateY(-1px);
            box-shadow: 0 4px 0 #142017;
        }
        .retro-btn:active, .retro-btn.active {
            background: #d97724;
            border-color: #f6ad55;
            transform: translateY(2px);
            box-shadow: 0 1px 0 #142017;
            color: #fff;
        }
        .cam-btn {
            flex-shrink: 0;
            white-space: nowrap;
        }
        .camera-bar {
            scrollbar-width: none;
        }
        .camera-bar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- Top Scoreboard & Live Event Banner -->
    <div class="fixed top-3 left-3 right-3 flex flex-wrap items-center justify-between gap-1 pointer-events-none z-10">
        <!-- Live Scoreboard -->
        <div class="hud-panel rounded-xl px-3 py-2 flex items-center gap-3 pointer-events-auto text-white">
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-red-500 inline-block border border-white"></span>
                <div>
                    <div class="text-[10px] text-emerald-300 uppercase font-bold tracking-wider">Street Red/Blue</div>
                    <div id="score-a" class="retro-font text-lg text-amber-300">24</div>
                </div>
            </div>
            <div class="text-xs font-bold text-gray-400 px-1">VS</div>
            <div class="flex items-center gap-2">
                <div>
                    <div class="text-[10px] text-emerald-300 uppercase font-bold tracking-wider text-right">Park White/Dark</div>
                    <div id="score-b" class="retro-font text-lg text-amber-300 text-right">22</div>
                </div>
                <span class="w-3 h-3 rounded-full bg-gray-100 inline-block border border-gray-500"></span>
            </div>
            <div class="border-l border-emerald-800 pl-3 ml-1 hidden xl:block">
                <div class="text-[10px] uppercase text-emerald-400 font-semibold">Play-by-Play AI</div>
                <div id="play-status" class="text-xs font-semibold text-amber-100 min-w-[175px]">Point guard dribbling top key...</div>
            </div>
        </div>

        <!-- Render Style & Lighting Controls -->
        <div class="hud-panel rounded-xl px-2.5 py-1.5 flex flex-wrap items-center gap-1.5 pointer-events-auto text-xs text-white">
            <button id="btn-pixel" class="retro-btn px-2 py-1.5 rounded-lg font-semibold">Pixel 2D Art</button>
            <button id="btn-outlines" class="retro-btn active px-2 py-1.5 rounded-lg font-semibold">Ink Borders</button>
            <button id="btn-time" class="retro-btn px-2 py-1.5 rounded-lg font-semibold">☀️ Afternoon</button>
            <div class="flex items-center gap-1.5 pl-2 border-l border-emerald-800">
                <span class="text-emerald-300 font-medium">Speed</span>
                <input id="speed-slider" type="range" min="0.2" max="2.5" step="0.1" value="1.0" class="w-16 accent-amber-500 cursor-pointer">
            </div>
        </div>
    </div>

    <!-- Bottom Camera Preset Bar -->
    <div class="camera-bar fixed bottom-3 left-1/2 -translate-x-1/2 hud-panel rounded-xl px-2 py-1.5 flex flex-nowrap items-center justify-center gap-1 z-10 text-xs text-white max-w-[96vw] overflow-x-auto">
        <span class="text-emerald-300 font-bold uppercase tracking-wider mr-1 hidden md:inline">Camera:</span>
        <button data-cam="reference" class="cam-btn retro-btn active px-2 py-1.5 rounded-lg font-semibold">📐 Reference Isometric</button>
        <button data-cam="court" class="cam-btn retro-btn px-2 py-1.5 rounded-lg font-semibold">🏀 Court Action</button>
        <button data-cam="lake" class="cam-btn retro-btn px-2 py-1.5 rounded-lg font-semibold">🦆 Waterfront & Dog</button>
        <button data-cam="playground" class="cam-btn retro-btn px-2 py-1.5 rounded-lg font-semibold">🛝 Playground</button>
        <button data-cam="follow" class="cam-btn retro-btn px-2 py-1.5 rounded-lg font-semibold">🎥 Follow Ball</button>
    </div>

    <script>
        window.onload = function () {
            // ============================================================================
            // 1. SCENE, ISOMETRIC CAMERA & PIXEL-ART / CEL-SHADED RENDERER SETUP
            // ============================================================================
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x527a48);

            let pixelScale = 1.0;
            let outlinesEnabled = true;
            let simSpeed = 1.0;
            let cameraMode = 'reference';

            const aspect = window.innerWidth / window.innerHeight;
            const frustumSize = 86;
            const camera = new THREE.OrthographicCamera(
                -frustumSize * aspect / 2,
                frustumSize * aspect / 2,
                frustumSize / 2,
                -frustumSize / 2,
                -200,
                500
            );

            // Exact isometric match to reference image:
            // Camera sits at (+X, +Y, +Z) looking at origin.
            // Screen-Right = (+X - Z), Screen-Down = (+X + Z).
            // Court long axis runs along X (top-left = -X, bottom-right = +X)
            // Court width runs along Z (top-right bleachers = -Z, bottom-left lake = +Z)
            camera.position.set(78, 72, 78);
            camera.lookAt(0, 0, 0);
            camera.zoom = referenceZoom();
            camera.updateProjectionMatrix();

            // Zoom that keeps the whole square diorama in view. Its isometric diamond spans about
            // ±73 units horizontally and ±40 vertically, so the width sets the limit on wide screens.
            function referenceZoom() {
                const a = window.innerWidth / window.innerHeight;
                return Math.min((frustumSize * a / 2) / 80, (frustumSize / 2) / 46);
            }

            const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2) * pixelScale);
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.NoToneMapping;
            renderer.toneMappingExposure = 1.05;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 0, 0);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.maxPolarAngle = Math.PI / 2.15;
            controls.minZoom = 0.55;
            controls.maxZoom = 3.5;

            // ============================================================================
            // 2. MATERIALS & PROCEDURAL TEXTURES
            // ============================================================================
            const outlineMeshes = [];
            const outlineMat = new THREE.MeshBasicMaterial({
                color: 0x161a1d,
                side: THREE.BackSide
            });

            function finishColorTexture(texture) {
                texture.encoding = THREE.sRGBEncoding;
                texture.magFilter = THREE.LinearFilter;
                texture.minFilter = THREE.LinearMipmapLinearFilter;
                texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
                return texture;
            }

            // Adds per-pixel brightness noise so flat procedural fills read as real surfaces
            function addSurfaceGrain(ctx, w, h, amount) {
                const img = ctx.getImageData(0, 0, w, h);
                const d = img.data;
                for (let i = 0; i < d.length; i += 4) {
                    const n = (Math.random() - 0.5) * amount * 255;
                    d[i] = Math.min(255, Math.max(0, d[i] + n));
                    d[i + 1] = Math.min(255, Math.max(0, d[i + 1] + n));
                    d[i + 2] = Math.min(255, Math.max(0, d[i + 2] + n));
                }
                ctx.putImageData(img, 0, 0);
            }

            // Name kept from the cel-shaded version so call sites stay unchanged; now a physically lit material.
            function toonMat(colorHex, extra = {}) {
                return new THREE.MeshStandardMaterial({
                    color: colorHex,
                    roughness: 0.85,
                    metalness: 0,
                    ...extra
                });
            }

            // Helper to add a 3D mesh with an optional ink border hull (hidden unless Ink Borders is on)
            function addOutlinedMesh(geometry, material, parent, outlineThickness = 0.09, castShadow = true, receiveShadow = true) {
                const mesh = new THREE.Mesh(geometry, material);
                mesh.castShadow = castShadow;
                mesh.receiveShadow = receiveShadow;

                if (outlineThickness > 0) {
                    const outline = new THREE.Mesh(geometry, outlineMat);
                    outline.scale.setScalar(1 + outlineThickness);
                    outline.castShadow = false;
                    outline.receiveShadow = false;
                    outline.visible = outlinesEnabled;
                    mesh.add(outline);
                    outlineMeshes.push(outline);
                }
                if (parent) parent.add(mesh);
                return mesh;
            }

            // Procedural Basketball Court Texture matching the reference image
            function createCourtTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 576;
                const ctx = canvas.getContext('2d');

                // Outer border apron (dark slate/teal green)
                ctx.fillStyle = '#3b6654';
                ctx.fillRect(0, 0, 1024, 576);

                // Subtle pixel stipple on apron
                for (let i = 0; i < 6000; i++) {
                    ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.05)';
                    ctx.fillRect((Math.random() * 1024) | 0, (Math.random() * 576) | 0, 3, 3);
                }

                const padX = 56;
                const padY = 44;
                const cW = 1024 - padX * 2;
                const cH = 576 - padY * 2;

                // Main playing court green
                ctx.fillStyle = '#4d7c5b';
                ctx.fillRect(padX, padY, cW, cH);

                // Subtle worn pixel texture on court
                for (let i = 0; i < 9000; i++) {
                    ctx.fillStyle = i % 2 === 0 ? 'rgba(130, 185, 130, 0.06)' : 'rgba(30, 50, 38, 0.06)';
                    ctx.fillRect(padX + ((Math.random() * cW) | 0), padY + ((Math.random() * cH) | 0), 4, 4);
                }
                addSurfaceGrain(ctx, 1024, 576, 0.05);

                // Regulation geometry (94ft x 50ft court) scaled to the canvas
                const ft = cW / 94;
                const cy = 288;
                const keyLen = 19 * ft;
                const keyHalfW = 8 * ft;
                const keyY = cy - keyHalfW;
                const keyH = keyHalfW * 2;
                const ftLineL = padX + keyLen;
                const ftLineR = 1024 - ftLineL;
                const ftR = 6 * ft;
                const centerR = 6 * ft;
                // Basket centers match the rim world x (±18.63) in createBasketballHoop
                const basketL = 512 - 18.63 * (1024 / 46);
                const basketR = 1024 - basketL;
                const arcR = 23.75 * ft;
                const cornerY = padY + 3 * ft;
                const cornerDx = Math.sqrt(arcR * arcR - (cy - cornerY) ** 2);
                const theta = Math.atan2(cy - cornerY, cornerDx);

                // Terracotta Red Keys (Left & Right)
                ctx.fillStyle = '#995247';
                ctx.fillRect(padX, keyY, keyLen, keyH);
                ctx.fillRect(1024 - padX - keyLen, keyY, keyLen, keyH);

                // Center Circle Terracotta Red
                ctx.beginPath();
                ctx.arc(512, cy, centerR, 0, Math.PI * 2);
                ctx.fillStyle = '#995247';
                ctx.fill();

                // Crisp White Court Lines
                ctx.strokeStyle = '#e8ece6';
                ctx.lineWidth = 6;

                // Outer boundary
                ctx.strokeRect(padX, padY, cW, cH);

                // Half-court line
                ctx.beginPath();
                ctx.moveTo(512, padY);
                ctx.lineTo(512, 576 - padY);
                ctx.stroke();

                // Center circle outline
                ctx.beginPath();
                ctx.arc(512, cy, centerR, 0, Math.PI * 2);
                ctx.stroke();

                // Keys and free-throw circles (the half-circle bulges toward the center)
                ctx.strokeRect(padX, keyY, keyLen, keyH);
                ctx.strokeRect(1024 - padX - keyLen, keyY, keyLen, keyH);
                ctx.beginPath();
                ctx.arc(ftLineL, cy, ftR, -Math.PI / 2, Math.PI / 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(ftLineR, cy, ftR, Math.PI / 2, Math.PI * 1.5);
                ctx.stroke();

                // Left 3-Point line: straight corners parallel to the sidelines, then an arc around the basket
                ctx.beginPath();
                ctx.moveTo(padX, cornerY);
                ctx.lineTo(basketL + cornerDx, cornerY);
                ctx.arc(basketL, cy, arcR, -theta, theta);
                ctx.lineTo(padX, 576 - cornerY);
                ctx.stroke();

                // Right 3-Point line (mirror of the left, arc runs through the inside of the court)
                ctx.beginPath();
                ctx.moveTo(1024 - padX, cornerY);
                ctx.lineTo(basketR - cornerDx, cornerY);
                ctx.arc(basketR, cy, arcR, Math.PI + theta, Math.PI - theta, true);
                ctx.lineTo(1024 - padX, 576 - cornerY);
                ctx.stroke();

                return finishColorTexture(new THREE.CanvasTexture(canvas));
            }

            // Procedural Park Grass Texture
            function createGrassTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#456c3c';
                ctx.fillRect(0, 0, 512, 512);

                const colors = ['#3b6234', '#4d7440', '#587f45', '#365b2f'];
                for (let i = 0; i < 8000; i++) {
                    ctx.fillStyle = colors[i % colors.length];
                    const x = (Math.random() * 512) | 0;
                    const y = (Math.random() * 512) | 0;
                    ctx.fillRect(x, y, 3, 2);
                }
                addSurfaceGrain(ctx, 512, 512, 0.07);
                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(10, 7);
                return finishColorTexture(tex);
            }

            // Procedural Chain-Link Fence Diamond Texture
            function createChainLinkTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 64;
                canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, 64, 64);
                ctx.strokeStyle = 'rgba(38, 58, 46, 0.78)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, 32); ctx.lineTo(32, 0); ctx.lineTo(64, 32); ctx.lineTo(32, 64); ctx.closePath();
                ctx.stroke();

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                return finishColorTexture(tex);
            }
            const baseFenceTex = createChainLinkTexture();

            // Procedural Paved Stone Walkway Texture
            function createPavementTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#c2baa6';
                ctx.fillRect(0, 0, 128, 128);
                ctx.strokeStyle = '#9e9583';
                ctx.lineWidth = 3;
                ctx.strokeRect(2, 2, 60, 60);
                ctx.strokeRect(66, 2, 60, 60);
                ctx.strokeRect(2, 66, 60, 60);
                ctx.strokeRect(66, 66, 60, 60);
                addSurfaceGrain(ctx, 128, 128, 0.06);

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                return finishColorTexture(tex);
            }
            const basePavementTex = createPavementTexture();

            // Procedural Deep Teal/Cerulean River Water Texture matching reference image
            function createWaterTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                const grad = ctx.createLinearGradient(0, 0, 0, 512);
                grad.addColorStop(0.0, '#286d87');
                grad.addColorStop(0.25, '#2d758d');
                grad.addColorStop(0.5, '#317a91');
                grad.addColorStop(0.75, '#2d758d');
                grad.addColorStop(1.0, '#286d87');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 512, 512);

                const waveColors = [
                    'rgba(111, 190, 211, 0.22)',
                    'rgba(20, 66, 91, 0.2)',
                    'rgba(142, 210, 225, 0.16)',
                    'rgba(35, 91, 116, 0.2)'
                ];
                for (let i = 0; i < 520; i++) {
                    ctx.fillStyle = waveColors[i % waveColors.length];
                    const x = (Math.random() * 512) | 0;
                    const y = (Math.random() * 512) | 0;
                    const w = 6 + Math.random() * 18;
                    const h = 1 + Math.random() * 2;
                    ctx.fillRect(x, y, w, h);
                }

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(2.72, 1.6);
                return finishColorTexture(tex);
            }

            // Procedural Slate Shingle Roof Texture for Utility House
            function createRoofShingleTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#48545e';
                ctx.fillRect(0, 0, 256, 256);

                for (let y = 0; y < 256; y += 16) {
                    ctx.fillStyle = (y / 16) % 2 === 0 ? '#3f4a54' : '#505d68';
                    ctx.fillRect(0, y, 256, 14);
                    ctx.fillStyle = '#2d353c';
                    ctx.fillRect(0, y + 14, 256, 2);
                    const offset = ((y / 16) % 2) * 16;
                    for (let x = offset; x < 256; x += 32) {
                        ctx.fillRect(x, y, 2, 16);
                    }
                }
                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                return finishColorTexture(tex);
            }
            const roofShingleTex = createRoofShingleTexture();

            // ============================================================================
            // 3. LIGHTING (SUNNY AFTERNOON / GOLDEN HOUR / NIGHT PARK LIGHTS)
            // ============================================================================
            const hemiLight = new THREE.HemisphereLight(0xcfe6ff, 0x4a5e3a, 0.5);
            scene.add(hemiLight);

            const ambientLight = new THREE.AmbientLight(0xdcedc8, 0.3);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xfff1c1, 1.15);
            dirLight.position.set(-45, 78, -32);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 4096;
            dirLight.shadow.mapSize.height = 4096;
            const d = 68;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            dirLight.shadow.camera.near = 10;
            dirLight.shadow.camera.far = 190;
            dirLight.shadow.bias = -0.0005;
            scene.add(dirLight);

            const lampPointLights = [];
            const lampBulbs = [];

            // ============================================================================
            // 4. WORLD GROUND, SIDEWALKS, LAKE, ROAD & CENTRAL BASKETBALL COURT
            // ============================================================================
        // 4. WORLD GROUND, SIDEWALKS, LAKE, ROAD & CENTRAL BASKETBALL COURT
        // ============================================================================
        // Base Park Lawn — Carved so it strictly terminates at the Z = 19.6 shoreline
        // exposing the deep cerulean/teal river basin in the bottom-left corner!
        const grassGeo = new THREE.BoxGeometry(100, 2, 69.5);
        const grassMat = toonMat(0xffffff, { map: createGrassTexture() });
        const grassMesh = new THREE.Mesh(grassGeo, grassMat);
        grassMesh.position.set(0, -1, -15.25); // Square diorama: X ±50, Z -50 to +19.5
        grassMesh.receiveShadow = true;
        scene.add(grassMesh);

        // Wooden plinth that makes the park read as a square miniature board
        const plinthMat = toonMat(0x6b4e35);
        addOutlinedMesh(new THREE.BoxGeometry(104, 6, 104), plinthMat, scene, 0.02, false, true).position.set(0, -4, 0);

        // Central Basketball Court Slab
        const courtW = 46;
            const courtD = 26;
            const courtGeo = new THREE.BoxGeometry(courtW, 0.28, courtD);
            const courtMat = toonMat(0xffffff, { map: createCourtTexture() });
            const courtSlab = addOutlinedMesh(courtGeo, courtMat, scene, 0.008, false, true);
            courtSlab.position.set(0, 0.05, 0);

            // Helper for paved stone paths
            function addPathBox(x, z, w, d, rotY = 0) {
                const tex = basePavementTex.clone();
                tex.needsUpdate = true;
                tex.repeat.set(w / 3.5, d / 3.5);
                const mat = toonMat(0xffffff, { map: tex });
                const mesh = addOutlinedMesh(new THREE.BoxGeometry(w, 0.22, d), mat, scene, 0.015, false, true);
                mesh.position.set(x, 0.04, z);
                mesh.rotation.y = rotY;
                return mesh;
            }

            // Surrounding Paved Walkways matching reference layout
            addPathBox(0, 16.5, 58, 4.2);   // Bottom-Left Lakeside Path (+Z)
            addPathBox(4, -17.5, 68, 4.4);  // Upper-Right Scooter & Bleacher Path (-Z)
            addPathBox(14, -27.5, 56, 3.6); // Far Upper-Right Sidewalk by Road
            addPathBox(-27.5, -2, 4.2, 40); // Top-Left Crosswalk Path (-X)
            addPathBox(27.5, 0, 4.2, 38);   // Bottom-Right Crosswalk Path (+X)
            addPathBox(-38, 2, 22, 3.4);    // Path to Playground

            // ============================================================================
            // 5. BASKETBALL HOOPS, CHAIN-LINK FENCING & 3-TIER BLEACHERS
            // ============================================================================
            function createBasketballHoop(xPos, dir) {
                const hoopGroup = new THREE.Group();
                hoopGroup.position.set(xPos, 0, 0);
                scene.add(hoopGroup);

                const poleMat = toonMat(0x283038);
                const boardMat = toonMat(0xf4f6f8);
                const redMat = toonMat(0xd9483b);
                const rimMat = toonMat(0xe8612c);

                // Heavy Base & Vertical Support Post
                const base = addOutlinedMesh(new THREE.BoxGeometry(1.1, 0.45, 1.1), poleMat, hoopGroup, 0.08);
                base.position.set(0, 0.22, 0);

                const post = addOutlinedMesh(new THREE.CylinderGeometry(0.24, 0.28, 6.2, 10), poleMat, hoopGroup, 0.08);
                post.position.set(0, 3.1, 0);

                // Angled Overhang Arm
                const arm = addOutlinedMesh(new THREE.BoxGeometry(2.1, 0.26, 0.26), poleMat, hoopGroup, 0.08);
                arm.position.set(dir * 0.95, 5.85, 0);

                // Rectangular Backboard with Dark Border
                const boardX = dir * 1.95;
                const board = addOutlinedMesh(new THREE.BoxGeometry(0.18, 2.3, 3.4), boardMat, hoopGroup, 0.06);

            const canopyGeoCache = new Map();

            // Deterministic lumps keep duplicated icosahedron vertices welded together
            function canopyLump(x, y, z) {
                return 1 + 0.12 * Math.sin(x * 3.1 + y * 2.3) * Math.cos(z * 2.7 - x * 1.3) + 0.06 * Math.sin(y * 5.7 + z * 4.1);
            }

            function getCanopyGeometry(r) {
                if (canopyGeoCache.has(r)) return canopyGeoCache.get(r);
                const geo = new THREE.IcosahedronGeometry(r, 2);
                const pos = geo.attributes.position;
                const nor = geo.attributes.normal;
                const colors = new Float32Array(pos.count * 3);
                const c = new THREE.Color();
                for (let i = 0; i < pos.count; i++) {
                    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
                    const k = canopyLump(x, y, z);
                    pos.setXYZ(i, x * k, y * k, z * k);
                    const len = Math.hypot(x, y, z);
                    const nx = x / len, ny = y / len, nz = z / len;
                    nor.setXYZ(i, nx, ny, nz);
                    const lit = nx * canopyLightDir.x + ny * canopyLightDir.y + nz * canopyLightDir.z;
                    const t = THREE.MathUtils.clamp((lit + 0.25) / 1.25 + (k - 1) * 1.2, 0, 1);
                    if (t < 0.5) c.copy(canopyShadow).lerp(canopyMid, t * 2);
                    else c.copy(canopyMid).lerp(canopyLit, (t - 0.5) * 2);
                    colors.set([c.r, c.g, c.b], i * 3);
                }
                geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                pos.needsUpdate = true;
                nor.needsUpdate = true;
                canopyGeoCache.set(r, geo);
                return geo;
            }
