<!DOCTYPE html>
<html lang="en">
<head>

<meta name="theme-color" content="#d8dedb">
<title>Qingxi | A living canal town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#d8dedb;color:var(--ink);font:13px/1.5 'DM Sans',sans-serif}button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
#world{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}

@media(prefers-reduced-motion:reduce){#loading{transition:none}}

<button class="tool" id="reset" aria-label="Reset view" data-tip="Reset view"><i data-lucide="home"></i></button>
<div class="divider"></div><label class="daylight"><i data-lucide="sun"></i><input id="day" type="range" min="0" max="1" step="0.0006944444444444445" value="0.625" aria-label="Time of day"><i data-lucide="moon"></i></label>
<div class="divider"></div>
<button class="tool" id="sound" aria-label="Enable ambient sound" data-tip="Ambient sound" aria-pressed="false"><i data-lucide="volume-x"></i></button>
<button class="tool" id="photo" aria-label="Save scene image" data-tip="Save image"><i data-lucide="camera"></i></button>
</div>
<section id="inspector" aria-label="Town resident"><div class="person-head"><h2 id="person-name"></h2><button id="close" class="tool" aria-label="Close resident details" data-tip="Close"><i data-lucide="x"></i></button></div><div id="occupation" class="occupation"></div><p id="activity" aria-live="polite"></p><button id="follow" aria-pressed="false"><i data-lucide="locate-fixed"></i><span>Follow resident</span></button></section>
