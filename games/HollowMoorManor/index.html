<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hollow Moor Manor — a Halloween diorama</title>
<style>
  html,body{margin:0;height:100%;background:#05060d;overflow:hidden;font-family:Georgia,'Palatino Linotype',serif;color:#e8d9b8;user-select:none}
  canvas{display:block;outline:none}
  #hud{position:fixed;left:26px;top:20px;pointer-events:none;text-shadow:0 2px 14px #000}
  #hud h1{margin:0;font-size:21px;letter-spacing:.18em;font-weight:400;text-transform:uppercase;color:#f3c77a}
  #hud p{margin:5px 0 0;font-size:12px;opacity:.7;font-style:italic;letter-spacing:.04em}
  #hint{position:fixed;left:26px;bottom:18px;font-size:11px;opacity:.55;letter-spacing:.06em;pointer-events:none;text-shadow:0 1px 8px #000}
  #tools{position:fixed;right:20px;top:18px;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
  #tools button{font:inherit;font-size:11.5px;letter-spacing:.08em;color:#f0dcae;background:rgba(18,14,24,.62);border:1px solid rgba(243,199,122,.28);border-radius:3px;padding:6px 12px;cursor:pointer;backdrop-filter:blur(6px);transition:all .2s}
  #tools button:hover{background:rgba(60,40,24,.7);border-color:rgba(243,199,122,.7)}
  #tools button.on{border-color:#f3c77a;color:#fff3cf;box-shadow:0 0 12px rgba(243,160,60,.25) inset}
  #secrets{position:fixed;right:22px;bottom:18px;text-align:right;font-size:11px;letter-spacing:.1em;color:#b9a77d;text-shadow:0 1px 8px #000;pointer-events:none}
  #secrets b{color:#f3c77a;font-weight:400}
  #toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(10px);opacity:0;transition:all .5s;font-style:italic;font-size:15px;letter-spacing:.06em;color:#ffe2a8;text-shadow:0 0 14px #c5651c,0 2px 10px #000;pointer-events:none;text-align:center;max-width:70vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #loading{position:fixed;inset:0;background:#05060d;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#c9a96a;letter-spacing:.2em;font-size:13px;text-transform:uppercase;transition:opacity 1.4s;z-index:9}
  #loading.gone{opacity:0;pointer-events:none}
  #loading i{width:9px;height:14px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#ffb347;box-shadow:0 0 18px 6px rgba(255,150,40,.55);animation:fl .35s infinite alternate}
  @keyframes fl{to{transform:scale(1.15,.85) translateX(1px);opacity:.82}}
</style>
</head>
<body>
<div id="loading"><i></i><span>Lighting the candles…</span></div>
<div id="hud"><h1>Hollow Moor Manor</h1><p>All Hallows' Eve · a miniature in the forest · full moon</p></div>
<div id="tools"></div>
<div id="hint">drag · orbit &nbsp;|&nbsp; wheel · zoom &nbsp;|&nbsp; right-drag · pan &nbsp;|&nbsp; poke things — the night is full of secrets</div>
<div id="secrets"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
(() => {
'use strict';
if (!window.THREE || !THREE.OrbitControls) {
  document.getElementById('loading').innerHTML = '<span>Three.js failed to load (network?)</span>';
  return;
}

/* =====================================================================
   STEP 1 — CORE: renderer, HDR post pipeline, sky + moon, lights,
            noise/texture toolkit, terrain + plinth
   ===================================================================== */

// ---------- math / random ----------
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rad = d => d * Math.PI / 180;
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(20261031);            // deterministic scene layout
const rr = (a, b) => a + (b - a) * rand();
const pick = arr => arr[Math.floor(rand() * arr.length)];
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

// ---------- noise ----------
function hash(x, y, s = 0) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
function vnoise(x, y, s = 0, px = 0, py = 0) {
  const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0;
  let ix = x0, iy = y0, jx = x0 + 1, jy = y0 + 1;
  if (px) { ix = ((ix % px) + px) % px; jx = ((jx % px) + px) % px; }
  if (py) { iy = ((iy % py) + py) % py; jy = ((jy % py) + py) % py; }
  const a = hash(ix, iy, s), b = hash(jx, iy, s), c = hash(ix, jy, s), d = hash(jx, jy, s);
  const u = fade(fx), v = fade(fy);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
// px,py = period in lattice cells at the base octave (0 = not tileable)
function fbm(x, y, oct = 4, s = 0, px = 0, py = 0) {
  let a = .5, f = 1, sum = 0, n = 0;
  for (let i = 0; i < oct; i++) { sum += a * vnoise(x * f, y * f, s + i * 17, px * f, py * f); n += a; a *= .5; f *= 2; }
  return sum / n;
}

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
const DPR = Math.min(window.devicePixelRatio || 1, 1.75);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;     // tone mapping happens in the final pass (HDR bloom)
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);
const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
const HORIZON = new THREE.Color(0.018, 0.028, 0.07);
scene.fog = new THREE.FogExp2(HORIZON.getHex(), 0.0054);
scene.fog.color.copy(HORIZON);
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.5, 3000);
const CAM_HOME = V3(-6, 66, 140), CAM_TARGET = V3(4, 17, -3);
camera.position.copy(CAM_HOME);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.copy(CAM_TARGET);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 12; controls.maxDistance = 190;
controls.maxPolarAngle = rad(88); controls.minPolarAngle = rad(18);
controls.autoRotateSpeed = 0.35;
controls.update();

const updaters = [];
const onFrame = fn => updaters.push(fn);

// ---------- HDR post pipeline (own bloom chain + grade) ----------
const isGL2 = renderer.capabilities.isWebGL2;
const rtOpts = { type: THREE.HalfFloatType, format: THREE.RGBAFormat, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: true };
const mkRT = (w, h, ms) => {
  const t = (ms && isGL2) ? new THREE.WebGLMultisampleRenderTarget(w, h, rtOpts) : new THREE.WebGLRenderTarget(w, h, { ...rtOpts, depthBuffer: false });
  if (ms && isGL2) t.samples = 4;
  return t;
};
const BLOOM_LEVELS = 6;
let sceneRT, bloomRTs = [];
function buildTargets() {
  const w = Math.floor(innerWidth * DPR), h = Math.floor(innerHeight * DPR);
  if (sceneRT) { sceneRT.dispose(); bloomRTs.forEach(r => r.dispose()); }
  sceneRT = mkRT(w, h, true);
  bloomRTs = [];
  for (let i = 0; i < BLOOM_LEVELS; i++) bloomRTs.push(mkRT(Math.max(2, w >> (i + 1)), Math.max(2, h >> (i + 1)), false));
}
buildTargets();

const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadScene = new THREE.Scene();
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
quad.frustumCulled = false; quadScene.add(quad);
const FS_VERT = 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}';
function fsPass(mat, target) { quad.material = mat; renderer.setRenderTarget(target); renderer.render(quadScene, quadCam); }

const downMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: null }, texel: { value: new THREE.Vector2() }, first: { value: 0 }, thr: { value: 1.0 }, knee: { value: 0.6 } },
  vertexShader: FS_VERT, depthTest: false, depthWrite: false,
  fragmentShader: `
    uniform sampler2D tex; uniform vec2 texel; uniform float first,thr,knee; varying vec2 vUv;
    vec3 pf(vec3 c){ if(first<.5) return c; c=min(c,vec3(24.)); float br=max(c.r,max(c.g,c.b)); float s=clamp(br-thr+knee,0.,2.*knee); s=s*s/(4.*knee+1e-4); return c*(max(br-thr,s)/max(br,1e-4)); }
    vec3 S(vec2 o){ return pf(texture2D(tex,vUv+o*texel).rgb); }
    void main(){
      vec3 a=S(vec2(-2,2)),b=S(vec2(0,2)),c=S(vec2(2,2)),d=S(vec2(-2,0)),e=S(vec2(0,0)),f=S(vec2(2,0)),g=S(vec2(-2,-2)),h=S(vec2(0,-2)),i=S(vec2(2,-2));
      vec3 j=S(vec2(-1,1)),k=S(vec2(1,1)),l=S(vec2(-1,-1)),m=S(vec2(1,-1));
      gl_FragColor=vec4(e*.125+(a+c+g+i)*.03125+(b+d+f+h)*.0625+(j+k+l+m)*.125,1.);
    }`
});
const upMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: null }, texel: { value: new THREE.Vector2() }, w: { value: 1 } },
  vertexShader: FS_VERT, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending,
  fragmentShader: `
    uniform sampler2D tex; uniform vec2 texel; uniform float w; varying vec2 vUv;
    vec3 S(vec2 o){ return texture2D(tex,vUv+o*texel).rgb; }
    void main(){
      vec3 c=S(vec2(-1,1))+S(vec2(1,1))+S(vec2(-1,-1))+S(vec2(1,-1))+2.*(S(vec2(0,1))+S(vec2(0,-1))+S(vec2(-1,0))+S(vec2(1,0)))+4.*S(vec2(0));
      gl_FragColor=vec4(c/16.*w,1.);
    }`
});
const finalMat = new THREE.ShaderMaterial({
  uniforms: {
    tScene: { value: null }, tBloom: { value: null }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2() },
    uExposure: { value: 1.0 }, uBloom: { value: 0.45 }, uBlur: { value: 5.0 }, uVignette: { value: 0.55 },
    uGrain: { value: 0.035 }, uAberr: { value: 0.0016 }, uFlash: { value: 0 }
  },
  vertexShader: FS_VERT, depthTest: false, depthWrite: false,
  fragmentShader: `
    uniform sampler2D tScene,tBloom; uniform vec2 uRes; uniform float uTime,uExposure,uBloom,uBlur,uVignette,uGrain,uAberr,uFlash; varying vec2 vUv;
    float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
    vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }
    vec3 toSRGB(vec3 c){ return mix(c*12.92, 1.055*pow(c,vec3(1./2.4))-.055, step(.0031308,c)); }
    void main(){
      vec2 uv=vUv; vec2 cc=uv-.5;
      // tilt-shift: soft foreground, softer far top, sharp focal band
      float d=uv.y-.52; float band=d<0.? smoothstep(.12,.52,-d) : smoothstep(.2,.55,d)*.55;
      float rad=uBlur*band*(uRes.y/1000.);
      vec3 col=vec3(0.); float wsum=0.;
      vec2 px=1./uRes; float ab=uAberr*dot(cc,cc)*4.;
      for(int i=0;i<14;i++){
        float fi=float(i); float a=fi*2.39996; float r=sqrt((fi+.5)/14.)*rad;
        vec2 o=vec2(cos(a),sin(a))*r*px;
        vec3 s=vec3(texture2D(tScene,uv+o+cc*ab).r,texture2D(tScene,uv+o).g,texture2D(tScene,uv+o-cc*ab).b);
        float wt=1.+dot(s,vec3(.3));
        col+=s*wt; wsum+=wt;
      }
      col/=wsum;
      col+=texture2D(tBloom,uv).rgb*uBloom;
      col+=vec3(.55,.62,.9)*uFlash;
      col*=uExposure;
      vec3 t=aces(col);
      float l=dot(t,vec3(.2126,.7152,.0722));
      t=mix(t,t*vec3(.9,1.0,1.14),1.-smoothstep(0.,.45,l));          // cold shadows
      t=mix(t,t*vec3(1.08,1.0,.9),smoothstep(.35,.9,l));              // warm highlights
      t=mix(vec3(l),t,1.08);
      t*=1.-uVignette*smoothstep(.28,.95,length(cc*vec2(1.1,1.25)));
      t=toSRGB(t);
      t+=(h21(uv*uRes+fract(uTime)*91.7)-.5)*uGrain;
      gl_FragColor=vec4(t,1.);
    }`
});
const finalUniforms = finalMat.uniforms;

function renderFrame() {
  renderer.setRenderTarget(sceneRT); renderer.clear();
  renderer.render(scene, camera);
  let src = sceneRT;
  for (let i = 0; i < BLOOM_LEVELS; i++) {
    downMat.uniforms.tex.value = src.texture;
    downMat.uniforms.texel.value.set(1 / src.width, 1 / src.height);
    downMat.uniforms.first.value = i === 0 ? 1 : 0;
    fsPass(downMat, bloomRTs[i]); src = bloomRTs[i];
  }
  for (let i = BLOOM_LEVELS - 1; i > 0; i--) {
    upMat.uniforms.tex.value = bloomRTs[i].texture;
    upMat.uniforms.texel.value.set(1 / bloomRTs[i].width, 1 / bloomRTs[i].height);
    upMat.uniforms.w.value = 1.0;
    fsPass(upMat, bloomRTs[i - 1]);
  }
  finalUniforms.tScene.value = sceneRT.texture;
  finalUniforms.tBloom.value = bloomRTs[0].texture;
  finalUniforms.uRes.value.set(sceneRT.width, sceneRT.height);
  fsPass(finalMat, null);
}

function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  // keep the whole diorama in frame on narrow screens
  camera.fov = innerWidth / innerHeight < 1.2 ? 32 * Math.min(1.9, 1.2 / (innerWidth / innerHeight)) : 32;
  camera.updateProjectionMatrix();
  buildTargets();
}
addEventListener('resize', onResize);
onResize();

// ---------- texture toolkit ----------
function canvasTex(size, paint, { srgb = true, repeat = [1, 1] } = {}) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); paint(g, size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = maxAniso;
  if (srgb) t.encoding = THREE.sRGBEncoding;
  t.repeat.set(repeat[0], repeat[1]);
  return t;
}
// per-pixel painter: fn(u,v,x,y) -> [r,g,b] (0..255)
function pixelFill(g, size, fn) {
  const img = g.getImageData(0, 0, size, size), d = img.data;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const o = (y * size + x) * 4, c = fn(x / size, y / size, x, y, d[o], d[o + 1], d[o + 2]);
    d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
}
const rgb = (r, g, b) => `rgb(${r | 0},${g | 0},${b | 0})`;
const cl255 = v => clamp(v, 0, 255);

const TEX = {};

// dressed ashlar: rows of blocks, grime streaks and moss at the base of each tile
TEX.stone = canvasTex(1024, (g, S) => {
  const rowsN = 16, rh = S / rowsN;
  g.fillStyle = '#17151a'; g.fillRect(0, 0, S, S);
  for (let r = 0; r < rowsN; r++) {
    let x = -rand() * 80; const widths = [];
    let tot = 0; while (tot < S) { const w = rr(95, 210); widths.push(w); tot += w; }
    const k = S / tot;
    let cx = 0;
    for (const w0 of widths) {
      const w = w0 * k, base = rr(-22, 22), warm = rr(-8, 10);
      const R = 98 + base + warm, G = 92 + base, B = 94 + base - warm * .6;
      const grad = g.createLinearGradient(0, r * rh, 0, (r + 1) * rh);
      grad.addColorStop(0, rgb(R * 1.18, G * 1.18, B * 1.18)); grad.addColorStop(.18, rgb(R, G, B)); grad.addColorStop(1, rgb(R * .78, G * .78, B * .82));
      g.fillStyle = grad; g.fillRect(cx + 2.5, r * rh + 2.5, w - 5, rh - 5);
      cx += w;
    }
  }
  pixelFill(g, S, (u, v, x, y, r, gg, b) => {
    const n = fbm(u * 8, v * 8, 4, 3, 8, 8), n2 = fbm(u * 40, v * 40, 2, 9, 40, 40);
    const streak = fbm(u * 24, v * 2, 3, 11, 24, 2);
    let m = .72 + n * .6 + (n2 - .5) * .35 - Math.max(0, streak - .55) * .8;
    let R = r * m, G = gg * m, B = b * m;
    const moss = smooth(.55, .9, fbm(u * 6, v * 6, 4, 21, 6, 6)) * smooth(.45, 1, v) * .85;   // lower half of tile
    R = lerp(R, 38, moss * .6); G = lerp(G, 66, moss * .65); B = lerp(B, 30, moss * .6);
    return [cl255(R), cl255(G), cl255(B)];
  });
});

TEX.slate = canvasTex(512, (g, S) => {
  const rows = 16, rh = S / rows, cols = 8, cw = S / cols;
  g.fillStyle = '#0c0e14'; g.fillRect(0, 0, S, S);
  for (let r = 0; r < rows; r++) for (let c = -1; c < cols; c++) {
    const off = (r % 2) * cw / 2, jit = rr(-9, 9), x = c * cw + off, y = r * rh;
    const L = 52 + rr(-12, 14);
    const grad = g.createLinearGradient(0, y, 0, y + rh * 1.35);
    grad.addColorStop(0, rgb(L * .8, L * .86, L * 1.1)); grad.addColorStop(.7, rgb(L * 1.1, L * 1.18, L * 1.5)); grad.addColorStop(1, rgb(8, 9, 14));
    g.fillStyle = grad; g.fillRect(x + 1.5, y, cw - 3, rh * 1.35 - 1);
    g.fillStyle = `rgba(0,0,0,${rr(0, .25)})`; g.fillRect(x + cw * rr(.2, .8), y, 1.5, rh);
  }
  pixelFill(g, S, (u, v, x, y, r, gg, b) => {
    const n = fbm(u * 6, v * 6, 4, 5, 6, 6), lichen = smooth(.62, .85, fbm(u * 12, v * 12, 3, 8, 12, 12));
    const m = .7 + n * .7;
    return [cl255(lerp(r * m, 60, lichen * .5)), cl255(lerp(gg * m, 84, lichen * .55)), cl255(lerp(b * m, 66, lichen * .4))];
  });
});

TEX.cobble = canvasTex(1024, (g, S) => {
  g.fillStyle = '#0d0c0e'; g.fillRect(0, 0, S, S);
  const N = 12, cs = S / N;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const cx = (i + .5 + rr(-.1, .1)) * cs, cy = (j + .5 + rr(-.1, .1)) * cs;
    const rx = cs * rr(.36, .46), ry = cs * rr(.34, .45), L = rr(66, 120), t = rr(-6, 8);
    g.save(); g.translate(cx, cy); g.rotate(rr(-.5, .5));
    const grad = g.createRadialGradient(-rx * .2, -ry * .3, 2, 0, 0, rx * 1.05);
    grad.addColorStop(0, rgb(L * 1.25 + t, L * 1.2, L * 1.22 - t)); grad.addColorStop(.8, rgb(L, L * .96, L * .98)); grad.addColorStop(1, rgb(L * .5, L * .48, L * .5));
    g.fillStyle = grad; g.beginPath(); g.ellipse(0, 0, rx, ry, 0, 0, 7); g.fill(); g.restore();
  }
  pixelFill(g, S, (u, v, x, y, r, gg, b) => {
    const n = fbm(u * 20, v * 20, 3, 4, 20, 20), w = fbm(u * 5, v * 5, 3, 7, 5, 5);
    const m = .75 + n * .5;
    const moss = smooth(.55, .8, w) * (r < 40 ? 1 : .35);      // moss mostly in the joints
    return [cl255(lerp(r * m, 36, moss * .6)), cl255(lerp(gg * m, 62, moss * .7)), cl255(lerp(b * m, 30, moss * .6))];
  });
});

TEX.bark = canvasTex(512, (g, S) => {
  pixelFill(g, S, (u, v) => {
    const ridge = fbm(u * 10, v * 1.5, 4, 2, 10, 2), fine = fbm(u * 48, v * 6, 3, 6, 48, 6), crack = Math.abs(fbm(u * 14, v * 2, 3, 12, 14, 2) - .5) * 2;
    let m = .35 + ridge * .9 + (fine - .5) * .4 - smooth(.0, .18, .18 - crack) * .5;
    const moss = smooth(.5, .78, fbm(u * 5, v * 3, 4, 30, 5, 3));
    const R = lerp(70 * m, 38, moss * .75), G = lerp(54 * m, 70, moss * .8), B = lerp(44 * m, 30, moss * .7);
    return [cl255(R), cl255(G), cl255(B)];
  });
});

TEX.wood = canvasTex(1024, (g, S) => {
  pixelFill(g, S, (u, v) => {
    const warp = fbm(u * 3, v * 12, 3, 1, 3, 12) * 4;
    const grain = fbm(u * 2 + warp * .2, v * 90, 3, 5, 2, 90);
    const plank = Math.floor(v * 6), pv = hash(plank, 3) * .35;
    const edge = smooth(0, .012, Math.abs(((v * 6) % 1) - .5) * -2 + 1) < .5 ? .35 : 1;
    const m = (.45 + grain * .75 + pv) * edge;
    return [cl255(78 * m), cl255(46 * m), cl255(28 * m)];
  });
});

TEX.soil = canvasTex(512, (g, S) => {

// scales a BoxGeometry's UVs so a texture tile covers `tile` world units
function boxUV(geo, w, h, d, tile = 6) {
  const uv = geo.attributes.uv, dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) {
    const k = f * 4 + i;
    uv.setXY(k, uv.getX(k) * dims[f][0] / tile, uv.getY(k) * dims[f][1] / tile);
  }
  uv.needsUpdate = true; return geo;
}

    fragmentShader: `

      float n3(vec3 x){ vec3 i=floor(x),f=fract(x); f=f*f*(3.-2.*f);
        return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),

      float fb(vec3 p){ float a=.5,s=0.; for(int i=0;i<5;i++){ s+=a*n3(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=.5; } return s; }

// ---------- layout constants ----------
const PLATEAU = 2.6;              // mansion terrace height
const EX = 52, EZ = 38;           // diorama half extents
const CLOCK = V3(41, 0, -6), CLOCK_Y = 4.6;   // clock tower site (terrain is levelled here)
const BASE_Y = -3.4;

// path from the front edge, through the gate, up to the manor stairs
const pathPts = [[-6.5, 27.5], [-5.6, 22], [-4.8, 16.5], [-3.6, 11.5], [-1.2, 7.5], [0, 4.6], [0, -4.5]];
const pathCurve = new THREE.CatmullRomCurve3(pathPts.map(p => V3(p[0], 0, p[1])), false, 'catmullrom', 0.5);
const pathSamples = pathCurve.getSpacedPoints(90);
function distToPath(x, z) {
  let best = 1e9;
  for (let i = 0; i < pathSamples.length; i++) { const p = pathSamples[i], d = (p.x - x) ** 2 + (p.z - z) ** 2; if (d < best) best = d; }
  return Math.sqrt(best);
}

// ---------- terrain ----------
function heightAt(x, z) {
  const tr = smooth(-3.5, 2.8, z);
  let h = lerp(PLATEAU, 0.2, tr);
  h += smooth(-21, -29, z) * (7 + 4 * fbm(x * .08 + 3, z * .08, 3));                 // rear wooded slope
  h += smooth(24, 34, Math.abs(x)) * (3.2 + 3 * fbm(x * .1, z * .1 + 7, 3));          // side berms
  const d = Math.hypot((x + 27) * .92, z + 15);                                       // crag hill, back left
  const crag = smooth(12, 3, d); h += Math.pow(crag, .8) * 8.5 * (.72 + .55 * fbm(x * .18, z * .18, 4, 6));
  const near = smooth(1.2, 4.2, distToPath(x, z));
  const mansionFlat = smooth(-3, -6, z) * smooth(24, 19, Math.abs(x)) * smooth(-22, -19, z);
  h += (fbm(x * .16, z * .16, 4, 5) - .5) * 1.1 * (.2 + .8 * near) * (1 - mansionFlat);
  return lerp(h, CLOCK_Y, smooth(12, 7, Math.hypot(x - CLOCK.x, z - CLOCK.z)));
}

const terrain = (() => {
  const SX = 330, SZ = 240, g = new THREE.PlaneGeometry(EX * 2, EZ * 2, SX, SZ);
  g.rotateX(-Math.PI / 2);
  const pos = g.attributes.position, col = new Float32Array(pos.count * 3), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), y = heightAt(x, z);
    pos.setY(i, y);
    const dp = distToPath(x, z);
    const n = fbm(x * .25, z * .25, 3, 2), n2 = fbm(x * 1.2, z * 1.2, 2, 8);
    const slope = Math.abs(heightAt(x + .6, z) - y) + Math.abs(heightAt(x, z + .6) - y);
    // moss green → dead-leaf brown → cold rock on slopes; darker under the forest
    c.setRGB(.14 + n * .12, .24 + n * .12, .11 + n * .05);
    c.lerp(new THREE.Color(.2, .15, .09), smooth(.3, .8, n2) * .55);

  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * EX, uv.getY(i) * EZ);

    const m = new THREE.Mesh(new THREE.PlaneGeometry(s, s), new THREE.MeshBasicMaterial({ map: mt, color: new THREE.Color(.20, .27, .44).multiplyScalar(rr(.8, 1.3)), transparent: true, opacity: rr(.16, .3), depthWrite: false }));
    m.rotation.x = -Math.PI / 2; m.rotation.z = rand() * 6.28; m.position.set(x, gy(x, z) + rr(.5, 1.6), z); m.renderOrder = 3; scene.add(m); FX.mist.push({ m, sp: rr(-.03, .03), dx: rr(-.15, .15), dz: rr(-.1, .1), x, z, op: m.material.opacity });
  }
  onFrame((dt, t) => { FX.mist.forEach(f => { f.m.rotation.z += f.sp * dt; f.m.position.x = f.x + Math.sin(t * .08 + f.dx * 20) * 2.2; f.m.position.z = f.z + Math.cos(t * .06 + f.dz * 20) * 1.6; }); });
})();

// --- falling leaves
(() => {
  const N = 70, lg = new THREE.PlaneGeometry(.22, .3), lm = new THREE.InstancedMesh(lg, new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide, roughness: .9 }), N), L = [], d = new THREE.Object3D(), c = new THREE.Color();
  const pal = [[.7, .3, .05], [.75, .45, .08], [.5, .15, .04], [.6, .5, .1]];
  for (let i = 0; i < N; i++) { L.push({ x: OLD_TREE.x + rr(-8, 8), y: rr(2, 12), z: OLD_TREE.z + rr(-6, 6), s: rr(.25, .55), sw: rr(1, 2.5), ph: rr(0, 9), rt: [rr(1, 3), rr(1, 3), rr(1, 3)] }); const p = pick(pal); c.setRGB(...p); lm.setColorAt(i, c); }
  lm.instanceColor.needsUpdate = true; scene.add(lm);
  onFrame((dt, t) => {
    L.forEach((l, i) => {
      l.y -= l.s * dt * 1.4; l.x += Math.sin(t * l.sw + l.ph) * dt * .8 + dt * .45; l.z += Math.cos(t * l.sw * .8 + l.ph) * dt * .5;
      if (l.y < gy(l.x, l.z) + .1) { l.x = OLD_TREE.x + rr(-8, 8); l.y = rr(9, 13); l.z = OLD_TREE.z + rr(-6, 6); }
      d.position.set(l.x, l.y, l.z); d.rotation.set(t * l.rt[0] + l.ph, t * l.rt[1], t * l.rt[2]); d.updateMatrix(); lm.setMatrixAt(i, d.matrix);
    });
    lm.instanceMatrix.needsUpdate = true;
  });
})();

// --- bokeh glow of far-off lamps behind the diorama (blurred by the tilt-shift pass)
(() => {
  for (let i = 0; i < 16; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex2, color: new THREE.Color(1, .45, .12).multiplyScalar(rr(.12, .3)), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, fog: false }));
    s.scale.setScalar(rr(14, 34)); s.position.set(rr(-170, 170), rr(-3, 18), rr(-220, -140)); scene.add(s);
  }
})();

// --- the hanging lantern on the old tree (pendulum)
const TLAN = {};
(() => {
  const att = TREE.group.localToWorld(TREE.lantern.clone());
  const piv = new THREE.Group(); piv.position.copy(att); scene.add(piv);
  const chain = mesh(new THREE.CylinderGeometry(.012, .012, 1.3, 4), M.iron, piv, 0, -.65, 0);
  for (let i = 0; i < 9; i++) { const l = mesh(new THREE.TorusGeometry(.05, .012, 4, 8), M.iron, piv, 0, -.1 - i * .14, 0); l.rotation.y = i % 2 ? 0 : Math.PI / 2; }
  void chain;
  const lan = makeLantern(1.3); lan.position.y = -2.15; piv.add(lan);
  const L = new THREE.PointLight(0xffa850, 3.0, 17, 1.7); L.position.y = -1.6; piv.add(L); lan.userData.flame.light = L; lan.userData.flame.li = 3.0;
  TLAN.piv = piv; TLAN.kick = 0;
  onFrame((dt, t) => {
    TLAN.kick = Math.max(0, TLAN.kick - dt * .25);
    const gust = Math.max(0, Math.sin(t * .17)) * .08 + TLAN.kick * .5;
    piv.rotation.z = Math.sin(t * 1.2) * (.06 + gust); piv.rotation.x = Math.sin(t * .9 + 1) * (.04 + gust * .6);
  });
  clickable(piv, () => { TLAN.kick = 1; toast('The lantern swings, and shadows crawl across the tree.'); });
})();

// --- zombie / skeleton hands clawing out of graves
const HANDS = [];
(() => {
  const picks = [A.graves[2], A.graves[9], A.graves[17], A.graves[24], A.graves[30]].filter(Boolean);
  picks.forEach((g, k) => {
    const grp = new THREE.Group(), x = g.x + rr(-.4, .4), z = g.z + 1.1; grp.position.set(x, gy(x, z) - .05, z); grp.rotation.y = rr(0, 6);
    const fore = mesh(limbGeo(-.9, .055, .07), HM.skin, grp, 0, -.2, 0); const palm = mesh(SPH, HM.skin, grp, 0, .72, 0); palm.scale.set(.1, .06, .08);
    const fingers = []; for (let f = 0; f < 5; f++) { const fp = Gp(grp, (f - 2) * .04, .73, 0); mesh(limbGeo(-.13, .012, .008, 5), HM.skin, fp, 0, 0, 0); fp.rotation.z = (f - 2) * -.12; fingers.push(fp); }
    scene.add(grp); HANDS.push({ grp, fingers, ph: rr(0, 40), x, z, cycle: rr(14, 24), off: rr(0, 20) });
    clickable(grp, () => toast('A hand grabs your ankle\u2026 then politely lets go.'));
  });
  onFrame((dt, t) => HANDS.forEach(h => {
    const k = ((t + h.off) % h.cycle) / h.cycle, up = smooth(.0, .08, k) * (1 - smooth(.18, .26, k));
    h.grp.position.y = gy(h.x, h.z) - .9 + up * .95; h.grp.rotation.z = Math.sin(t * 1.5 + h.ph) * .1 * up; h.grp.rotation.x = Math.sin(t * 1.2 + h.ph) * .08;
    h.fingers.forEach((f, i) => { f.rotation.x = (Math.sin(t * 6 + i * .8 + h.ph) * .5 + .5) * 1.1 * up; });
  }));
})();

// --- Morse-code window in the belfry (S.O.S.)
(() => {
  const w = A.litWindows.filter(w => Math.abs(w.ry) < .01 && w.pos.y > 26).sort((a, b) => b.pos.y - a.pos.y)[0]
    || A.litWindows.slice().sort((a, b) => b.pos.y - a.pos.y)[0];
  const n = V3(Math.sin(w.ry), 0, Math.cos(w.ry));
  const cover = new THREE.Mesh(archGlow(w.w, w.h), new THREE.MeshBasicMaterial({ color: 0x07050a })); cover.position.copy(w.pos).addScaledVector(n, .02).add(V3(0, -w.h / 2, 0)); cover.position.addScaledVector(n, .02); cover.rotation.y = w.ry; cover.visible = false; scene.add(cover);
  const seq = [];
  const dit = .22, dah = dit * 3, gap = dit, letterGap = dit * 3, wordGap = dit * 10;
  const mk = (arr) => { arr.forEach((u, i) => { seq.push({ on: true, d: u === 's' ? dit : dah }); seq.push({ on: false, d: i === arr.length - 1 ? letterGap : gap }); }); };
  mk(['s', 's', 's']); mk(['d', 'd', 'd']); mk(['s', 's', 's']); seq.push({ on: false, d: wordGap });
  const total = seq.reduce((a, s) => a + s.d, 0), period = total + 20;
  onFrame((dt, t) => {
    let k = t % period, on = true;
    if (k < total) { for (const s of seq) { if (k < s.d) { on = s.on; break; } k -= s.d; } } else on = true;
    // "on" blocks = window dark (a figure covering it), so the light itself flashes S.O.S.
    cover.visible = k >= 0 && (t % period) < total ? !on : false;
  });
  clickable(cover, () => secret('morse', 'The belfry window blinks \u2022\u2022\u2022 \u2014\u2014\u2014 \u2022\u2022\u2022 \u2014 someone up there is asking for candy.'));
  A.morse = cover;
  // an invisible, always-clickable proxy so the secret works even while the window is lit
  const proxy = new THREE.Mesh(archGlow(w.w, w.h), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })); proxy.position.copy(cover.position); proxy.rotation.y = w.ry; scene.add(proxy);
  clickable(proxy, () => secret('morse', 'The belfry window blinks \u2022\u2022\u2022 \u2014\u2014\u2014 \u2022\u2022\u2022 \u2014 someone up there is asking for candy.'));
})();

// --- lightning
const LIGHT = { t: -1, bolt: null, nextAt: 28, thunder: 0 };
(() => {
  function boltLine(a, b, depth, out, jit) {
    if (depth === 0) { out.push(a.clone(), b.clone()); return; }
    const m = a.clone().add(b).multiplyScalar(.5); m.x += rr(-jit, jit); m.z += rr(-jit, jit);
    boltLine(a, m, depth - 1, out, jit * .55); boltLine(m, b, depth - 1, out, jit * .55);
    if (depth > 2 && rand() < .45) { const e = m.clone().add(V3(rr(-14, 14), rr(-22, -8), rr(-8, 8))); boltLine(m, e, depth - 2, out, jit * .5); }
  }
  const mat = new THREE.LineBasicMaterial({ color: new THREE.Color(2.2, 2.6, 4.2), transparent: true, blending: THREE.AdditiveBlending, fog: false, depthWrite: false });
  LIGHT.strike = () => {
    if (LIGHT.bolt) scene.remove(LIGHT.bolt);
    const x = rr(-70, -30) * (rand() < .5 ? 1 : -.8), top = V3(x, 120, rr(-120, -80)), bot = V3(x + rr(-10, 10), 0, top.z + rr(-6, 6)), pts = []; boltLine(top, bot, 7, pts, 14);
    const g = new THREE.BufferGeometry().setFromPoints(pts); LIGHT.bolt = new THREE.LineSegments(g, mat); LIGHT.bolt.frustumCulled = false; scene.add(LIGHT.bolt);
    LIGHT.t = 0; LIGHT.thunder = 1.2 + rand();
  };
  const pat = [[0, 1], [.07, .12], [.13, .9], [.3, .15], [.38, .55], [.55, .08], [.75, 0]];
  const baseMoon = moonLight.intensity, baseHemi = hemi.intensity;
  onFrame((dt, t) => {
    LIGHT.nextAt -= dt; if (LIGHT.nextAt < 0) { LIGHT.strike(); LIGHT.nextAt = rr(45, 90); }
    let f = 0;
    if (LIGHT.t >= 0) {
      LIGHT.t += dt; for (let i = 0; i < pat.length - 1; i++) if (LIGHT.t >= pat[i][0] && LIGHT.t < pat[i + 1][0]) { f = lerp(pat[i][1], pat[i + 1][1], (LIGHT.t - pat[i][0]) / (pat[i + 1][0] - pat[i][0])); break; }
      if (LIGHT.t > .8) { LIGHT.t = -1; if (LIGHT.bolt) LIGHT.bolt.visible = false; }
      else if (LIGHT.bolt) { LIGHT.bolt.visible = f > .06; mat.opacity = clamp(f * 1.3, 0, 1); }
    }
    if (LIGHT.thunder > 0 && LIGHT.t < 0) { LIGHT.thunder -= dt; if (LIGHT.thunder <= 0) toast('\u2026 a long, low rumble rolls over the hollow.'); }
    finalUniforms.uFlash.value = f * .1; moonLight.intensity = baseMoon + f * 3.5; hemi.intensity = baseHemi + f * 1.6; skyUniforms.uMoonBoost.value = 1 + f * 2.2; A.lightMul = 1 - .9 * clamp(f * 1.6, 0, 1);
  });
})();

// --- an occasional shooting star
(() => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(40, .35), new THREE.MeshBasicMaterial({ color: new THREE.Color(2, 2.2, 3), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, fog: false })); m.visible = false; scene.add(m);
  let tmr = 20, life = -1, from = V3(), to = V3();
  onFrame((dt, t) => {
    tmr -= dt; if (tmr < 0) { tmr = rr(25, 55); life = 0; const a = rr(.2, 1.1), r = 700; from.set(-Math.cos(a) * r, 380 + rr(0, 120), -Math.sin(a) * r * .8 - 200); to.copy(from).add(V3(rr(250, 380), -rr(70, 150), rr(-60, 60))); }
    if (life >= 0) { life += dt / 1.0; if (life > 1) { life = -1; m.visible = false; } else { m.visible = true; m.position.lerpVectors(from, to, life); m.lookAt(camera.position); m.rotateZ(Math.atan2(to.y - from.y, Math.hypot(to.x - from.x, to.z - from.z)) * -1 + 0); m.material.opacity = Math.sin(life * Math.PI); } }
  });
})();

// --- door, pumpkin, spider interactions
A.doorTarget = 1; A.slam = 0;
onFrame((dt, t) => {
  A.slam -= dt; if (A.slam < 0 && A.slam > -dt && A.doorTarget === 0 && A.autoSlam) { A.doorTarget = 1; A.autoSlam = false; }
  A.doorAng = damp(A.doorAng, A.doorTarget ? rad(62) : .03, A.doorTarget ? 1.4 : 7, dt);
  A.doorOpen = damp(A.doorOpen, A.doorTarget, 3, dt);
  if (!A.autoSlam && A.doorTarget && t > (A.nextSlam ??= rr(70, 110))) { A.doorTarget = 0; A.autoSlam = true; A.slam = 6; A.nextSlam = t + rr(80, 120); toast('A sudden gust slams the door shut!'); }
});
A.doors.forEach(d => clickable(d.grp, () => { A.doorTarget = A.doorTarget ? 0 : 1; A.autoSlam = false; secret('door', A.doorTarget ? 'The great door creaks open\u2026' : 'The great door groans shut.'); }));
const JOKES = ['“Trick or treat?”  — the pumpkin grins.', '“I\u2019m feeling a bit gourd-y.”', '“Please don\u2019t carve me twice.”', '“Light my fire, baby.”'];
PGROUPS.forEach(p => clickable(p, () => { secret('pumpkin', pick(JOKES)); PK.forEach(k => k.ph += 3); }));
SPIDERS.forEach(sp => clickable(sp.g, () => secret('spider', 'Itsy bitsy spider climbs up the spout\u2026 (it is actually quite friendly)')));

// =================== input: click picking, UI ===================
(() => {
  const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), dom = renderer.domElement; let down = null, hov = 0;
  function pick_(e) { mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(mouse, camera); const hits = ray.intersectObjects(CLICK, true); for (const h of hits) { let o = h.object; while (o) { if (o.userData.click) return o.userData.click; o = o.parent; } } return null; }
  dom.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
  dom.addEventListener('pointerup', e => { if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 5) { const f = pick_(e); if (f) f(); } down = null; });
  dom.addEventListener('pointermove', e => { if ((++hov) % 4) return; dom.style.cursor = pick_(e) ? 'pointer' : ''; });
})();
(() => {
  const tools = document.getElementById('tools');
  const btn = (label, fn, toggled) => { const b = document.createElement('button'); b.textContent = label; if (toggled) b.classList.add('on'); b.onclick = () => { const r = fn(b); if (r !== undefined) b.classList.toggle('on', !!r); }; tools.appendChild(b); return b; };
  btn('Auto-orbit', () => { controls.autoRotate = !controls.autoRotate; return controls.autoRotate; });
  btn('Lightning (L)', () => LIGHT.strike());
  btn('Wake the bats (B)', () => { A.batBurst = 1; toast('The bats burst from the belfry!'); });
  btn('Wake the owl (O)', () => { owlFly(); toast('The owl spreads its wings\u2026'); });
  btn('Door', () => { A.doorTarget = A.doorTarget ? 0 : 1; A.autoSlam = false; });
  btn('Mist', b => { const on = !FX.mist[0].m.visible; FX.mist.forEach(f => f.m.visible = on); return on; }, true);
  btn('Fireflies', () => { const on = !FX.fireflies.visible; FX.fireflies.visible = on; return on; }, true);
  btn('Depth of field', () => { const on = finalUniforms.uBlur.value < 1; finalUniforms.uBlur.value = on ? 5 : 0; return on; }, true);
  btn('Reset view (R)', () => { camera.position.copy(CAM_HOME); controls.target.copy(CAM_TARGET); controls.update(); });
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'l') LIGHT.strike(); else if (k === 'b') { A.batBurst = 1; } else if (k === 'o') owlFly(); else if (k === 'r') { camera.position.copy(CAM_HOME); controls.target.copy(CAM_TARGET); controls.update(); } else if (k === ' ') { controls.autoRotate = !controls.autoRotate; e.preventDefault(); }
  });
  const oldStrike = LIGHT.strike; LIGHT.strike = () => { oldStrike(); secret('storm', 'Thunder and lightning \u2014 very, very frightening.'); };
})();

// cinematic intro: glide in from a higher, farther view
(() => {
  const from = V3(-70, 92, 170), to = CAM_HOME.clone(); let k = 0; controls.enabled = false;
  onFrame((dt) => { if (k >= 1) return; k = Math.min(1, k + dt / 5.5); const e = k * k * (3 - 2 * k); camera.position.lerpVectors(from, to, e); controls.target.copy(CAM_TARGET); camera.lookAt(CAM_TARGET); if (k >= 1) { controls.enabled = true; controls.update(); } });
})();

Object.values(B).forEach(flush); Object.values(GB).forEach(flush);

window.__hm = { THREE, scene, camera, controls, finalUniforms, renderer, OWL, WITCH, GHOSTS, A, TREE, HUMANS, LIGHT };
frame();
setTimeout(() => document.getElementById('loading').classList.add('gone'), 400);
})();
</script>
