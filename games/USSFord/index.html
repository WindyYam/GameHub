<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVN-78 USS Gerald R. Ford — Isometric Tactical Flight Ops</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b2239;
            font-family: 'Inter', sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .hud-glass {
            background: rgba(8, 19, 34, 0.72);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(125, 211, 252, 0.22);
            box-shadow: 0 10px 28px -4px rgba(0, 0, 0, 0.55);
        }
        .hud-btn {
            background: linear-gradient(180deg, rgba(16, 36, 62, 0.88) 0%, rgba(10, 23, 42, 0.94) 100%);
            border: 1px solid rgba(56, 189, 248, 0.32);
            transition: all 0.16s ease;
        }
        .hud-btn:hover {
            background: linear-gradient(180deg, rgba(26, 58, 98, 0.95) 0%, rgba(14, 34, 64, 1) 100%);
            border-color: rgba(125, 211, 252, 0.85);
            transform: translateY(-1px);
        }
        .hud-btn-active {
            background: linear-gradient(180deg, rgba(14, 116, 144, 0.9) 0%, rgba(15, 76, 117, 0.96) 100%);
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body class="text-slate-100">

    <!-- 3D Viewport -->
    <div id="canvas-container"></div>

    <!-- Top-Right Compact Tactical Bar -->
    <div id="hud-top" class="fixed top-3 right-3 z-20 flex flex-col items-end gap-2 pointer-events-auto">
        <div class="hud-glass rounded-xl px-3.5 py-2.5 flex flex-wrap items-center gap-3">
            <div class="flex items-center gap-2 pr-2 border-r border-sky-400/20">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <div>
                    <div class="mono text-[10px] text-sky-400 font-bold tracking-wider leading-none">CVN-78 • TRUE ORTHO ISOMETRIC</div>
                    <div class="text-xs font-bold text-white leading-tight mt-0.5">USS GERALD R. FORD</div>
                </div>
            </div>

            <div class="flex items-center gap-1.5 text-[11px] font-medium">
                <button data-cam="iso" class="cam-btn hud-btn hud-btn-active px-2.5 py-1 rounded-lg">Ortho Isometric</button>
                <button data-cam="bow" class="cam-btn hud-btn px-2.5 py-1 rounded-lg">Bow Cats</button>
                <button data-cam="island" class="cam-btn hud-btn px-2.5 py-1 rounded-lg">Island</button>
                <button data-cam="stern" class="cam-btn hud-btn px-2.5 py-1 rounded-lg">Landing</button>
            </div>

            <div class="flex items-center gap-1 text-[11px] font-medium pl-1 border-l border-sky-400/20">
                <button data-time="day" class="time-btn hud-btn hud-btn-active px-2 py-1 rounded-lg">Day</button>
                <button data-time="sunset" class="time-btn hud-btn px-2 py-1 rounded-lg">Dusk</button>
                <button id="btn-toggle-roster" class="hud-btn hud-btn-active px-2 py-1 rounded-lg text-sky-300 mono text-[10px]">ROSTER</button>
                <button id="btn-toggle-hud" class="hud-btn px-2 py-1 rounded-lg text-sky-300 mono text-[10px]" title="Toggle HUD">HUD</button>
            </div>
        </div>

        <div id="hud-log-pill" class="hud-glass rounded-lg px-3 py-1.5 flex items-center gap-2 text-[11px] mono">
            <span class="text-sky-400 font-bold">PRI-FLY:</span>
            <span id="ops-status-log" class="text-slate-200">PERSISTENT AIR WING • ZERO POP-IN • CLICK ANY AIRCRAFT</span>
        </div>
    </div>

    <!-- Collapsible Right-Side Persistent Air Wing Roster & Unit Command Panel -->
    <div id="hud-roster" class="fixed top-28 right-3 z-20 w-72 pointer-events-auto flex flex-col gap-2">
        <div class="hud-glass rounded-xl p-3 flex flex-col gap-2">
            <div class="flex items-center justify-between border-b border-sky-400/20 pb-1.5">
                <div class="mono text-[11px] font-bold text-sky-300 tracking-wide">CVW-8 PERSISTENT ROSTER</div>
                <span id="roster-summary" class="mono text-[10px] text-emerald-400 font-semibold">22 UNITS TRACKED</span>
            </div>

            <!-- Selected Aircraft Detail & Direct Action Bar -->
            <div id="selected-unit-panel" class="bg-slate-950/75 border border-sky-400/30 rounded-lg p-2 flex flex-col gap-1.5">
                <div class="flex items-center justify-between">
                    <span id="sel-callsign" class="mono text-xs font-bold text-amber-300">VMFA-211 #201</span>
                    <span id="sel-type" class="mono text-[10px] px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-300">F-35C</span>
                </div>
                <div class="flex items-center justify-between text-[11px]">
                    <span class="text-slate-400">STATE:</span>
                    <span id="sel-state" class="mono font-semibold text-emerald-400">PARKED</span>
                </div>
                <div class="flex items-center gap-1.5 mt-0.5">
                    <button id="btn-unit-action" class="hud-btn flex-1 py-1 px-2 rounded text-[10px] mono font-bold text-amber-300">
                        TAXI & LAUNCH
                    </button>
                    <button id="btn-unit-follow" class="hud-btn py-1 px-2 rounded text-[10px] mono text-sky-300">
                        FOLLOW: OFF
                    </button>
                </div>
            </div>

            <!-- Scrollable Live Aircraft List -->
            <div id="roster-list" class="max-h-56 overflow-y-auto pr-1 flex flex-col gap-1 text-[11px] mono"></div>
        </div>
    </div>

    <!-- Bottom-Left Compact Flight Ops Trigger Bar -->
    <div id="hud-bottom" class="fixed bottom-3 left-3 z-20 pointer-events-auto">
        <div class="hud-glass rounded-xl p-2 flex items-center gap-2">
            <button id="btn-launch" class="hud-btn py-1.5 px-3 rounded-lg flex items-center gap-2 text-xs font-semibold text-white">
                <span class="w-2 h-2 rounded-full bg-amber-400 shadow-[0_0_6px_#fbbf24]"></span>
                <span>LAUNCH NEXT PARKED JET</span>
            </button>
            <button id="btn-recover" class="hud-btn py-1.5 px-3 rounded-lg flex items-center gap-2 text-xs font-semibold text-white">
                <span class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_6px_#34d399]"></span>
                <span>RECOVER AIRBORNE JET</span>
            </button>
            <button id="btn-heli" class="hud-btn py-1.5 px-3 rounded-lg flex items-center gap-2 text-xs font-semibold text-white">
                <span class="w-2 h-2 rounded-full bg-sky-400 shadow-[0_0_6px_#38bdf8]"></span>
                <span>CYCLE SEAHAWK SORTIE</span>
            </button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // ============================================================================
        // 1. SCENE & TRUE ORTHOGRAPHIC ISOMETRIC CAMERA PIPELINE
        // ============================================================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x091c33);
        scene.fog = new THREE.FogExp2(0x0e2848, 0.00015);

        const ORTHO_FRUSTUM_HEIGHT = 186;
        const aspect = window.innerWidth / window.innerHeight;
        const camera = new THREE.OrthographicCamera(
            (-ORTHO_FRUSTUM_HEIGHT * aspect) / 2,
            ( ORTHO_FRUSTUM_HEIGHT * aspect) / 2,
             ORTHO_FRUSTUM_HEIGHT / 2,
            -ORTHO_FRUSTUM_HEIGHT / 2,
            -2000,
            4000
        );

        // Reference framing matching desktop reference photo:
        // Elevated aerial perspective looking from starboard bow quarter aft
        const CAMERA_PRESETS = {
            iso:    { pos: new THREE.Vector3(-248, 198, 238), target: new THREE.Vector3(-3, 10, -5), zoom: 1.15 },
            bow:    { pos: new THREE.Vector3(-190, 145, 260), target: new THREE.Vector3(0, 12, 82),  zoom: 2.15 },
            island: { pos: new THREE.Vector3(-230, 155, 45),  target: new THREE.Vector3(-22, 22, -52), zoom: 2.35 },
            stern:  { pos: new THREE.Vector3(-210, 155, -165), target: new THREE.Vector3(6, 12, -55), zoom: 1.85 }
        };
        camera.position.copy(CAMERA_PRESETS.iso.pos);
        camera.zoom = CAMERA_PRESETS.iso.zoom;
        camera.updateProjectionMatrix();

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.02;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.copy(CAMERA_PRESETS.iso.target);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.maxPolarAngle = Math.PI * 0.47;
        controls.minZoom = 0.55;
        controls.maxZoom = 4.5;

        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.15,
            0.35,
            0.88
        );
        composer.addPass(bloomPass);
        composer.addPass(new OutputPass());

        let desiredCamPos = null;
        let desiredCamTarget = null;
        let desiredCamZoom = null;
        let followUnit = null;

        controls.addEventListener('start', () => {
            desiredCamPos = null;
            desiredCamTarget = null;
            desiredCamZoom = null;
        });

        function setStatusLog(text) {
            const el = document.getElementById('ops-status-log');
            if (el) el.textContent = text;
        }

        // ============================================================================
        // 2. CRISP MARITIME DAYLIGHT LIGHTING
        // ============================================================================
        // Calibrated daylight illumination matching reference photo
        const hemiLight = new THREE.HemisphereLight(0xb4d8fc, 0x142234, 0.52);
        scene.add(hemiLight);

        // Crisp sunlight casting sharp, clean shadows from island and aircraft
        const sunLight = new THREE.DirectionalLight(0xfffaed, 3.25);
        sunLight.position.set(150, 280, -85);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 4096;
        sunLight.shadow.mapSize.height = 4096;
        sunLight.shadow.camera.near = 50;
        sunLight.shadow.camera.far = 700;
        const shadowD = 210;
        sunLight.shadow.camera.left = -shadowD;
        sunLight.shadow.camera.right = shadowD;
        sunLight.shadow.camera.top = shadowD;
        sunLight.shadow.camera.bottom = -shadowD;
        sunLight.shadow.bias = -0.00018;
        sunLight.shadow.normalBias = 0.02;
        scene.add(sunLight);

        // Subtle sky fill on the shadow side
        const fillLight = new THREE.DirectionalLight(0x6aa2d8, 0.22);
        fillLight.position.set(-180, 80, 140);
        scene.add(fillLight);

        // ============================================================================
        // 3. FLIGHT DECK TEXTURE & MAPS (HIGH-FIDELITY NON-SKID & MARKINGS)
        // ============================================================================
        const DECK_MIN_X = -40;
        const DECK_MAX_X = 44;
        const DECK_MIN_Z = -155;
        const DECK_MAX_Z = 155;

        // Shared aircraft national insignia generator
        function createUSNavyInsigniaTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, 256, 128);

            // Navy blue background disc
            ctx.fillStyle = '#1e3a8a';
            ctx.beginPath();
            ctx.arc(128, 64, 46, 0, Math.PI * 2);
            ctx.fill();

            // Flanking white bars
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(20, 48, 216, 32);

            // Red center horizontal stripe
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(20, 58, 216, 12);

            // Re-draw circle outline and central star
            ctx.fillStyle = '#1e3a8a';
            ctx.beginPath();
            ctx.arc(128, 64, 44, 0, Math.PI * 2);
            ctx.fill();

            // Five point white star
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                const aOuter = -Math.PI / 2 + (i * Math.PI * 2) / 5;
                const aInner = aOuter + Math.PI / 5;
                const rOuter = 38;
                const rInner = 15;
                const ox = 128 + Math.cos(aOuter) * rOuter;
                const oy = 64 + Math.sin(aOuter) * rOuter;
                const ix = 128 + Math.cos(aInner) * rInner;
                const iy = 64 + Math.sin(aInner) * rInner;
                if (i === 0) ctx.moveTo(ox, oy);
                else ctx.lineTo(ox, oy);
                ctx.lineTo(ix, iy);
            }
            ctx.closePath();
            ctx.fill();

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }
        const usNavyInsigniaTex = createUSNavyInsigniaTexture();

        function createFlightDeckMaps() {
            const width = 2048;
            const height = 4096;

            const colorCanvas = document.createElement('canvas');
            colorCanvas.width = width;
            colorCanvas.height = height;
            const ctx = colorCanvas.getContext('2d');

            const bumpCanvas = document.createElement('canvas');
            bumpCanvas.width = width;
            bumpCanvas.height = height;
            const bCtx = bumpCanvas.getContext('2d');

            const toPx = (x) => ((x - DECK_MIN_X) / (DECK_MAX_X - DECK_MIN_X)) * width;
            const toPy = (z) => (1.0 - (z - DECK_MIN_Z) / (DECK_MAX_Z - DECK_MIN_Z)) * height;

            // 1. Authentic deep charcoal non-skid aggregate coat (MIL-PRF-24667)
            ctx.fillStyle = '#22262e';
            ctx.fillRect(0, 0, width, height);

            bCtx.fillStyle = '#808080';
            bCtx.fillRect(0, 0, width, height);

            // Longitudinal roller application tooth texture
            for (let x = 0; x < width; x += 18) {
                ctx.fillStyle = (x % 36 === 0) ? 'rgba(255,255,255,0.018)' : 'rgba(0,0,0,0.024)';
                ctx.fillRect(x, 0, 9, height);
                bCtx.fillStyle = (x % 36 === 0) ? '#8a8a8a' : '#757575';
                bCtx.fillRect(x, 0, 3, height);
            }

            // High-traffic taxiway non-skid tonal variation (subtle dark slate)
            const trafficGrad = ctx.createRadialGradient(toPx(-5), toPy(15), 60, toPx(-2), toPy(0), 1100);
            trafficGrad.addColorStop(0, 'rgba(46, 52, 62, 0.22)');
            trafficGrad.addColorStop(0.65, 'rgba(38, 43, 52, 0.10)');
            trafficGrad.addColorStop(1, 'rgba(30, 34, 41, 0.0)');
            ctx.fillStyle = trafficGrad;
            ctx.fillRect(0, 0, width, height);

            // Fine aggregate non-skid grain stipple (120,000 micro-particles)
            for (let i = 0; i < 90000; i++) {
                const rx = Math.random() * width;
                const ry = Math.random() * height;
                const isBright = Math.random() > 0.52;
                ctx.fillStyle = isBright ? 'rgba(226,232,240,0.028)' : 'rgba(12,16,22,0.045)';
                ctx.fillRect(rx, ry, 2 + Math.random() * 3, 2 + Math.random() * 6);
                bCtx.fillStyle = isBright ? '#949494' : '#6a6a6a';
                bCtx.fillRect(rx, ry, 2, 2);
            }

            // 2. Realistic Cruciform Tie-Down Pad-Eyes (~20-ft grid across flight deck)
            function drawPadEye(px, py) {
                // Color map: outer rim, inner socket, metallic cruciform star
                ctx.save();
                ctx.beginPath();
                ctx.arc(px, py, 6.2, 0, Math.PI * 2);
                ctx.fillStyle = '#1c2026';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(px, py, 5.0, 0, Math.PI * 2);
                ctx.strokeStyle = '#5a6472';
                ctx.lineWidth = 1.2;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(px, py, 3.8, 0, Math.PI * 2);
                ctx.fillStyle = '#14171d';
                ctx.fill();

                // Cruciform star
                ctx.fillStyle = '#8f9baa';
                ctx.fillRect(px - 1.0, py - 3.8, 2.0, 7.6);
                ctx.fillRect(px - 3.8, py - 1.0, 7.6, 2.0);
                ctx.restore();

                // Bump map: depression with raised center
                bCtx.save();
                bCtx.beginPath();
                bCtx.arc(px, py, 6.0, 0, Math.PI * 2);
                bCtx.fillStyle = '#545454';
                bCtx.fill();
                bCtx.fillStyle = '#9e9e9e';
                bCtx.fillRect(px - 1.0, py - 3.0, 2.0, 6.0);
                bCtx.fillRect(px - 3.0, py - 1.0, 6.0, 2.0);
                bCtx.restore();
            }

            for (let gz = -148; gz <= 148; gz += 4.2) {
                const rowOffset = (Math.abs(Math.round(gz / 4.2)) % 2) * 2.1;
                for (let gx = -35 + rowOffset; gx <= 39; gx += 4.2) {
                    // Check if within deck perimeter
                    const px = toPx(gx);
                    const py = toPy(gz);
                    if (px > 70 && px < width - 70 && py > 65 && py < height - 65) {
                        drawPadEye(px, py);
                    }
                }
            }

            // 3. Angled Landing Runway with Heavy Rubber Skid Accumulation
            const rStartX = toPx(-4.5), rStartY = toPy(-152);
            const rEndX   = toPx(36.5),  rEndY   = toPy(42);
            const rAngle  = Math.atan2(rEndY - rStartY, rEndX - rStartX);
            const rLen    = Math.hypot(rEndX - rStartX, rEndY - rStartY);

            ctx.save();
            ctx.translate(rStartX, rStartY);
            ctx.rotate(rAngle);

            // Runway asphalt bed
            const trapGrad = ctx.createLinearGradient(0, 0, rLen, 0);
            trapGrad.addColorStop(0.0, 'rgba(26, 30, 36, 0.28)');
            trapGrad.addColorStop(0.20, 'rgba(14, 17, 21, 0.65)'); // touchdown zone
            trapGrad.addColorStop(0.55, 'rgba(20, 24, 29, 0.45)');
            trapGrad.addColorStop(0.95, 'rgba(140, 150, 162, 0.08)');
            ctx.fillStyle = trapGrad;
            ctx.fillRect(0, -215, rLen, 430);

            // Touchdown Zone Heavy Rubber Skid Burn Marks
            for (let s = 0; s < 450; s++) {
                const sProgress = 0.08 + Math.random() * 0.72;
                const sx = sProgress * rLen;
                const sy = (Math.random() - 0.5) * 320 * (1.0 - Math.abs(sProgress - 0.3) * 0.85);
                const sLen = 80 + Math.random() * 320;
                const sThick = 2.5 + Math.random() * 6.5;

                ctx.fillStyle = (s % 5 === 0) ? 'rgba(226,232,240,0.06)' : 'rgba(8,10,14,0.22)';
                ctx.fillRect(sx, sy, sLen, sThick);

                bCtx.save();
                bCtx.translate(rStartX, rStartY);
                bCtx.rotate(rAngle);
                bCtx.fillStyle = '#5c5c5c';
                bCtx.fillRect(sx, sy, sLen, sThick);
                bCtx.restore();
            }

            // Boundary tramlines
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, -222, rLen, 16);
            ctx.fillRect(0, -196, rLen, 12);
            ctx.fillStyle = '#eab308';
            ctx.fillRect(0, -178, rLen, 7);

            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 204, rLen, 16);
            ctx.fillRect(0, 182, rLen, 10);

            // Runway threshold chevrons
            for (let t = -180; t <= 165; t += 32) {
                ctx.fillStyle = '#f8fafc';
                ctx.fillRect(14, t, 58, 14);
            }

            // High-visibility dashed centerline (white & yellow alternating)
            for (let d = 85; d < rLen - 40; d += 110) {
                ctx.fillStyle = '#f8fafc';
                ctx.fillRect(d, -9, 66, 18);
                ctx.fillStyle = '#facc15';
                ctx.fillRect(d + 66, -5, 24, 10);
            }

            // 4 Arresting Gear wire markings & guide tramlines
            for (let w = 0; w < 4; w++) {
                const wx = 240 + w * 125;
                ctx.fillStyle = '#eab308';
                ctx.fillRect(wx - 2, -185, 12, 370);
                ctx.fillStyle = '#1e242c';
                ctx.fillRect(wx + 2, -180, 4, 360);
            }
            ctx.restore();

            // Safety foul line (alternating red and white dash)
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(toPx(-14.0), toPy(-150));
            ctx.lineTo(toPx(16.0),  toPy(48));
            ctx.lineWidth = 16;
            ctx.strokeStyle = '#dc2626';
            ctx.stroke();
            ctx.setLineDash([36, 36]);
            ctx.strokeStyle = '#f8fafc';
            ctx.stroke();
            ctx.restore();

            // 4. Catapult Tracks with EMALS Center Slot Runners
            function drawCatapultTrack(x1, z1, x2, z2) {
                const p1x = toPx(x1), p1y = toPy(z1);
                const p2x = toPx(x2), p2y = toPy(z2);
                ctx.save();

                // Track trough shadow
                ctx.beginPath();
                ctx.moveTo(p1x, p1y); ctx.lineTo(p2x, p2y);
                ctx.lineWidth = 58;
                ctx.strokeStyle = 'rgba(165, 175, 188, 0.12)';
                ctx.stroke();

                // Outer boundary stripes
                ctx.beginPath();
                ctx.moveTo(p1x - 22, p1y); ctx.lineTo(p2x - 22, p2y);
                ctx.moveTo(p1x + 22, p1y); ctx.lineTo(p2x + 22, p2y);
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#f8fafc';
                ctx.stroke();

                // Inner yellow hazard dashes
                ctx.beginPath();
                ctx.moveTo(p1x - 14, p1y); ctx.lineTo(p2x - 14, p2y);
                ctx.moveTo(p1x + 14, p1y); ctx.lineTo(p2x + 14, p2y);
                ctx.lineWidth = 5;
                ctx.setLineDash([26, 18]);
                ctx.strokeStyle = '#facc15';
                ctx.stroke();
                ctx.setLineDash([]);

                // EMALS steel slot runner
                ctx.beginPath();

            // Clean runway touchdown zone at stern without arcade numbers

        // ============================================================================
        // 4. OCEAN & HYDRODYNAMIC WAKE (TRACE) SHADER
        // ============================================================================
        // Realistic open ocean optics: Gerstner physical wave synthesis, deep absorption,
        // SSS aeration glow, sharp sun glint, and multi-component carrier wake
        const oceanUniforms = {
            uTime: { value: 0 },
            uSunDir: { value: new THREE.Vector3(-0.55, 0.78, 0.35).normalize() },
            uSunColor: { value: new THREE.Color(0xfffef2) },
            uDeepColor: { value: new THREE.Color(0x06182c) },      // Deep Atlantic dark indigo
            uMidColor: { value: new THREE.Color(0x0d2844) },       // Swell body oceanic blue
            uSkyColor: { value: new THREE.Color(0x3d6b94) },       // Maritime sky reflection
            uWakeTurquoise: { value: new THREE.Color(0x138e88) },  // Subsurface aeration turquoise
            uFoamWhite: { value: new THREE.Color(0xd6e5f0) }       // Aerated pure white froth
        };

        const oceanMaterial = new THREE.ShaderMaterial({
            uniforms: oceanUniforms,
            vertexShader: `
                uniform float uTime;
                varying vec3 vWorldPos;
                varying vec3 vNormal;
                varying float vWaveHeight;
                varying float vChop;

                void addGerstnerWave(
                    vec2 dir, float steepness, float wavelength, float speed,
                    vec2 pos, float time,
                    inout vec3 p, inout vec3 n
                ) {
                    float k = 6.2831853 / wavelength;
                    float c = sqrt(9.81 / k) * speed;
                    float f = k * (dot(dir, pos) - c * time);
                    float a = steepness / k;

                    p.x += dir.x * (a * cos(f));
                    p.y += a * sin(f);
                    p.z += dir.y * (a * cos(f));

                    n.x -= dir.x * (steepness * sin(f));
                    n.y -= steepness * cos(f);
                    n.z -= dir.y * (steepness * sin(f));
                }

                void main() {
                    vec4 wp = modelMatrix * vec4(position, 1.0);
                    vec2 posXZ = wp.xz;
                    float t = uTime;

                    vec3 wavePos = vec3(0.0);
                    vec3 waveNorm = vec3(0.0, 1.0, 0.0);

                    // 5 Layered Gerstner wave octaves: Broad oceanic swells + wind chop + cross-seas
                    addGerstnerWave(vec2(0.55, 0.83), 0.22, 145.0, 1.25, posXZ, t, wavePos, waveNorm);
                    addGerstnerWave(vec2(-0.62, 0.78), 0.16, 68.0, 1.65, posXZ, t, wavePos, waveNorm);
                    addGerstnerWave(vec2(0.82, 0.45), 0.11, 32.0, 2.20, posXZ, t, wavePos, waveNorm);
                    addGerstnerWave(vec2(-0.35, 0.94), 0.07, 16.0, 2.85, posXZ, t, wavePos, waveNorm);
                    addGerstnerWave(vec2(0.92, -0.38), 0.04, 8.5, 3.40, posXZ, t, wavePos, waveNorm);

                    // Smoothly damp vertical displacement under the carrier hull so the ship doesn't clip
                    float hullDistX = abs(wp.x);
                    float hullDistZ = abs(wp.z);
                    float hullMask = smoothstep(18.0, 36.0, hullDistX) + smoothstep(145.0, 175.0, hullDistZ);
                    hullMask = clamp(hullMask, 0.25, 1.0);

                    wp.xyz += wavePos * hullMask;
                    vWorldPos = wp.xyz;
                    vNormal = normalize(waveNorm);
                    vWaveHeight = wavePos.y;
                    vChop = wavePos.y * hullMask;

                    gl_Position = projectionMatrix * viewMatrix * wp;
                }
            `,
            fragmentShader: `
                uniform float uTime;
                uniform vec3 uSunDir;
                uniform vec3 uSunColor;
                uniform vec3 uDeepColor;
                uniform vec3 uMidColor;
                uniform vec3 uSkyColor;
                uniform vec3 uWakeTurquoise;
                uniform vec3 uFoamWhite;

                varying vec3 vWorldPos;
                varying vec3 vNormal;
                varying float vWaveHeight;
                varying float vChop;

                float hash21(vec2 p) {
                    p = fract(p * vec2(234.34, 435.345));
                    p += dot(p, p + 34.23);
                    return fract(p.x * p.y);
                }

                float noise(vec2 p) {
                    vec2 i = floor(p);
                    vec2 f = fract(p);
                    f = f * f * (3.0 - 2.0 * f);
                    float a = hash21(i);
                    float b = hash21(i + vec2(1.0, 0.0));
                    float c = hash21(i + vec2(0.0, 1.0));
                    float d = hash21(i + vec2(1.0, 1.0));
                    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
                }

                float fbm(vec2 p) {
                    float v = 0.0;
                    v += 0.500 * noise(p);
                    v += 0.250 * noise(p * 2.02 + vec2(1.2, 3.4));
                    v += 0.125 * noise(p * 4.04 - vec2(2.3, 1.1));
                    v += 0.062 * noise(p * 8.08 + vec2(0.7, 4.2));
                    return v;
                }

                float wakeTurbulence(vec2 p, float speed) {
                    vec2 q = p + vec2(0.0, uTime * speed);
                    float n1 = noise(q * 0.45);
                    float n2 = noise(q * 1.15 + vec2(n1 * 1.2, -n1 * 0.8));
                    float n3 = noise(q * 2.85 - vec2(n2 * 1.4, n2 * 1.1));
                    return n2 * 0.6 + n3 * 0.4;
                }

                void main() {
                    float x = vWorldPos.x;
                    float z = vWorldPos.z;
                    float absX = abs(x);

                    // Flow relative to carrier forward motion (+Z direction)
                    float flowZ = z - uTime * 24.0;
                    vec2 flowUV = vec2(x * 0.55, flowZ * 0.35);

                    // Micro-capillary surface normal perturbation
                    float nEps = 0.45;
                    float hC = fbm(flowUV);
                    float hR = fbm(flowUV + vec2(nEps, 0.0));
                    float hU = fbm(flowUV + vec2(0.0, nEps));
                    vec3 rippleNormal = normalize(vec3((hC - hR) * 2.2, 1.0, (hC - hU) * 2.2));
                    vec3 normal = normalize(mix(vNormal, rippleNormal, 0.45));

                    // View direction & Fresnel
                    vec3 viewDir = normalize(cameraPosition - vWorldPos);
                    float NdotV = max(dot(viewDir, normal), 0.0);
                    float fresnel = pow(1.0 - NdotV, 4.0);

                    // Base deep water gradient with wave crest illumination
                    float waveSlope = clamp((normal.y - 0.7) / 0.3, 0.0, 1.0);
                    vec3 oceanCol = mix(uDeepColor, uMidColor, waveSlope * 0.85 + vWaveHeight * 0.15);

                    // Subsurface scattering on wave crests
                    float sss = pow(max(dot(viewDir, -uSunDir), 0.0), 3.0) * smoothstep(0.1, 0.9, vWaveHeight);
                    oceanCol += uWakeTurquoise * sss * 0.35;

                    // Maritime sky reflection
                    oceanCol = mix(oceanCol, uSkyColor, fresnel * 0.55);

                    // Sun specular glint
                    vec3 halfVec = normalize(uSunDir + viewDir);
                    float NdotH = max(dot(normal, halfVec), 0.0);
                    float sunGlint = pow(NdotH, 160.0) * 1.85;
                    float sunShimmer = pow(NdotH, 28.0) * 0.22;
                    oceanCol += uSunColor * (sunGlint + sunShimmer);

                    // Natural ocean swell surface (deep pure navy matching reference photo)
                    float subtleShimmer = fbm(vec2(x * 0.25 + z * 0.15, z * 0.45 - uTime * 16.0));
                    float waveGlint = smoothstep(0.88, 0.96, subtleShimmer + vWaveHeight * 0.20) * 0.12;
                    oceanCol = mix(oceanCol, uSkyColor * 1.2, waveGlint);

                    // -------------------------------------------------------------------------
                    // HYDRODYNAMIC WAKE & TRACE SYSTEM
                    // -------------------------------------------------------------------------
                    float totalWhiteFoam = 0.0;
                    float totalTurquoise = 0.0;

                    // Carrier hull profile half-width as function of Z
                    float hullHalfW = 20.5;
                    if (z > 70.0) {
                        float tb = clamp((z - 70.0) / 78.0, 0.0, 1.0);
                        hullHalfW = mix(20.5, 0.8, pow(tb, 1.35));
                    } else if (z < -95.0) {
                        float ts = clamp((-95.0 - z) / 55.0, 0.0, 1.0);
                        hullHalfW = mix(20.5, 16.5, ts);
                    }

                    float distFromBow = 148.0 - z;

                    // 1. Bow stem wave & outward breaking V-wave (crisp peeling foam with turquoise aeration)
                    if (z <= 153.0 && z >= 25.0) {
                        float bowWaveAngle = 0.42;
                        float bowWaveDist = abs(absX - (distFromBow * bowWaveAngle + 0.8));
                        float bowWaveRibbon = exp(-pow(bowWaveDist / (2.0 + distFromBow * 0.022), 2.0));
                        bowWaveRibbon *= smoothstep(153.0, 144.0, z); // sharp onset right at the stem
                        bowWaveRibbon *= smoothstep(25.0, 105.0, z);  // smoothly merges into flank wash

                        float bowFroth = wakeTurbulence(vec2(absX * 2.0, z * 1.2), 34.0);
                        float bowFoam = bowWaveRibbon * smoothstep(0.22, 0.65, bowFroth);

                        totalWhiteFoam = max(totalWhiteFoam, bowFoam * 1.45);
                        totalTurquoise = max(totalTurquoise, bowWaveRibbon * 1.05);
                    }

                    // 2. Hull boundary layer waterline contact wash
                    if (z <= 147.0 && z >= -150.0) {
                        float dHull = abs(absX - hullHalfW);
                        float contactWash = exp(-pow(dHull / 2.8, 2.0));
                        float contactTurb = wakeTurbulence(vec2(absX * 2.2, z * 1.2), 28.0);
                        float contactFoam = contactWash * smoothstep(0.28, 0.68, contactTurb);

                        totalWhiteFoam = max(totalWhiteFoam, contactFoam * 1.1);
                        totalTurquoise = max(totalTurquoise, contactWash * 0.85);
                    }

                    // 3. Massive stern propeller churning wash (screws at z < -148.0)
                    if (z <= -140.0 && z >= -980.0) {
                        float distBehindStern = -148.0 - z;

                        // Wake expands outward to ~72m width
                        float wakeWidth = mix(20.0, 72.0, clamp(distBehindStern / 360.0, 0.0, 1.0));
                        float centerWash = exp(-pow(absX / wakeWidth, 2.0));

                        // Twin screw churning wash streams from the four 21-ft bronze propellers
                        float screwL = exp(-pow((x - 10.5) / (5.2 + distBehindStern * 0.035), 2.0));
                        float screwR = exp(-pow((x + 10.5) / (5.2 + distBehindStern * 0.035), 2.0));
                        float screwWash = (screwL + screwR) * 0.90;

                        // Boiling turbulence and vorticity
                        float turbSpeed = 40.0;
                        float sternFroth1 = wakeTurbulence(vec2(x * 0.48, z * 0.26), turbSpeed);
                        float sternFroth2 = wakeTurbulence(vec2(x * 1.35, z * 0.68), turbSpeed * 1.25);
                        float combinedFroth = sternFroth1 * 0.55 + sternFroth2 * 0.45;

                        // Wake length attenuation
                        float sternFade = smoothstep(-140.0, -150.0, z) * smoothstep(-980.0, -680.0, z);

                        float washFoam = (centerWash * 0.78 + screwWash * 0.65) * sternFade;
                        float foamIntensity = washFoam * smoothstep(0.20, 0.62, combinedFroth * 1.35);

                        totalWhiteFoam = max(totalWhiteFoam, foamIntensity * 1.45);
                        totalTurquoise = max(totalTurquoise, washFoam * sternFade * 1.15);

                        // Kelvin outer wake shockwave arms spreading at 19.5 degrees
                        float kelvinArm = abs(absX - (distBehindStern * 0.35 + 18.0));
                        float kelvinShock = exp(-pow(kelvinArm / (4.2 + distBehindStern * 0.02), 2.0)) * sternFade;
                        totalWhiteFoam = max(totalWhiteFoam, kelvinShock * smoothstep(0.32, 0.72, combinedFroth) * 0.85);
                    }

                    // Realistic multi-scale ocean foam lace & bubbling modulation
                    float foamLace1 = noise(vec2(x * 0.85, z * 0.55) + uTime * 4.5);
                    float foamLace2 = noise(vec2(x * 2.4, z * 1.6) - uTime * 8.5);
                    float foamPattern = foamLace1 * 0.65 + foamLace2 * 0.35;

                    // Calibrated wake brightness: natural aerated sea froth instead of harsh blown-out white
                    float foamFactor = smoothstep(0.14, 0.76, totalWhiteFoam) * (0.60 + 0.40 * foamPattern);
                    foamFactor = clamp(foamFactor, 0.0, 0.80);

                    float aquaFactor = clamp(totalTurquoise, 0.0, 0.92) * (0.70 + 0.30 * foamPattern);

                    // Blend turquoise subsurface aeration glow
                    oceanCol = mix(oceanCol, uWakeTurquoise * 0.90, aquaFactor * 0.65);

                    // Blend soft maritime froth with subtle wave lighting
                    vec3 shadedFoam = uFoamWhite * (0.84 + 0.16 * waveSlope);
                    oceanCol = mix(oceanCol, shadedFoam, foamFactor);

                    // Distance aerial perspective fog
                    float dist = length(cameraPosition - vWorldPos);
                    float fogF = 1.0 - exp(-pow(dist * 0.00024, 2.0));
                    oceanCol = mix(oceanCol, vec3(0.08, 0.22, 0.38), clamp(fogF, 0.0, 1.0));

                    gl_FragColor = vec4(oceanCol, 1.0);
                }
            `
        });

        const oceanGeo = new THREE.PlaneGeometry(2800, 2800, 240, 240);
        oceanGeo.rotateX(-Math.PI / 2);
        const oceanMesh = new THREE.Mesh(oceanGeo, oceanMaterial);
        scene.add(oceanMesh);

        // ============================================================================
        // 5. CARRIER HULL & SUPERSTRUCTURE (CVN-78 GERALD R. FORD)
        // ============================================================================
        const carrierGroup = new THREE.Group();
        scene.add(carrierGroup);

        const DECK_Y = 12.2;

        // Shared PBR Materials
        const hullGreyMat = new THREE.MeshStandardMaterial({ color: 0x8490a0, roughness: 0.50, metalness: 0.22, side: THREE.DoubleSide });
        const hullDarkGreyMat = new THREE.MeshStandardMaterial({ color: 0x4f5763, roughness: 0.62, metalness: 0.28 });
        const catwalkMat = new THREE.MeshStandardMaterial({ color: 0x5e6774, roughness: 0.66, metalness: 0.25 });
        const islandMat = new THREE.MeshStandardMaterial({ color: 0x8692a2, roughness: 0.44, metalness: 0.18 });
        const radarWhiteMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.30, metalness: 0.10 });
        const bridgeGlassMat = new THREE.MeshStandardMaterial({ color: 0x0a1422, roughness: 0.10, metalness: 0.90 });
        const nozzleDarkMat = new THREE.MeshStandardMaterial({ color: 0x22272e, roughness: 0.35, metalness: 0.85 });
        const foldHingeRedMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.50, metalness: 0.20 });
        const f35DarkMat = new THREE.MeshStandardMaterial({ color: 0x768292, roughness: 0.44, metalness: 0.22 });
        const f35LightRamMat = new THREE.MeshStandardMaterial({ color: 0x98a4b4, roughness: 0.40, metalness: 0.20 });
        const f35NoseMat = new THREE.MeshStandardMaterial({ color: 0x5a6575, roughness: 0.48, metalness: 0.18 });
        
        const fa18GreyMat = new THREE.MeshStandardMaterial({ color: 0x8a97a8, roughness: 0.44, metalness: 0.20 });
        const fa18NoseMat = new THREE.MeshStandardMaterial({ color: 0x58626f, roughness: 0.48, metalness: 0.22 });
        const e2BodyMat = new THREE.MeshStandardMaterial({ color: 0xdce3ec, roughness: 0.38, metalness: 0.20 });
        const heloDarkMat = new THREE.MeshStandardMaterial({ color: 0x2e3540, roughness: 0.48, metalness: 0.30 });
        const canopyGoldMat = new THREE.MeshStandardMaterial({ color: 0x1f242d, roughness: 0.08, metalness: 0.88 });
        const canopyBlueMat = new THREE.MeshStandardMaterial({ color: 0x0f1826, roughness: 0.10, metalness: 0.85 });
        const tireBlackMat = new THREE.MeshStandardMaterial({ color: 0x141820, roughness: 0.86, metalness: 0.08 });

        const deckContour = [
            [-18.0, 154.0],
            [ 18.0, 154.0],
            [ 23.5,  96.0],
            [ 43.0,  34.0],
            [ 43.0, -36.0],
            [ 33.5, -75.0],
            [ 27.5, -152.0],
            [-23.5, -152.0],

        ];

        const deckShape = new THREE.Shape();

            if (idx === 0) deckShape.moveTo(x, -z);
            else deckShape.lineTo(x, -z);
        });
        deckShape.closePath();

        const deckTopGeo = new THREE.ShapeGeometry(deckShape, 1);
        deckTopGeo.rotateX(-Math.PI / 2);

        const posAttr = deckTopGeo.attributes.position;
        const uvArray = new Float32Array(posAttr.count * 2);
        for (let i = 0; i < posAttr.count; i++) {
            const vx = posAttr.getX(i);

            const v = (vz - DECK_MIN_Z) / (DECK_MAX_Z - DECK_MIN_Z);
            uvArray[i * 2] = u;
            uvArray[i * 2 + 1] = v;
        }
        deckTopGeo.setAttribute('uv', new THREE.BufferAttribute(uvArray, 2));
        deckTopGeo.computeVertexNormals();

        const deckMaps = createFlightDeckMaps();
        const deckTopMat = new THREE.MeshStandardMaterial({

        });

        const flightDeckMesh = new THREE.Mesh(deckTopGeo, deckTopMat);
        flightDeckMesh.position.y = DECK_Y;
        flightDeckMesh.receiveShadow = true;
        carrierGroup.add(flightDeckMesh);

        const galleryExtrudeGeo = new THREE.ExtrudeGeometry(deckShape, { depth: 2.1, bevelEnabled: false });
        galleryExtrudeGeo.rotateX(-Math.PI / 2);
        const galleryMesh = new THREE.Mesh(galleryExtrudeGeo, hullGreyMat);

        carrierGroup.add(galleryMesh);

        function createLoftedCarrierHull() {
            const levels = [
                { y: -0.6, bowZ: 144.0, sternZ: -148.0, bowW: 0.6,  midW: 19.5, sternW: 15.0 },
                { y:  3.2, bowZ: 147.5, sternZ: -150.0, bowW: 2.8,  midW: 21.5, sternW: 18.0 },
                { y:  6.8, bowZ: 151.0, sternZ: -151.0, bowW: 8.5,  midW: 25.0, sternW: 21.0 },
                { y: 10.1, bowZ: 153.8, sternZ: -152.0, bowW: 17.5, midW: 31.0, sternW: 23.5 }
            ];

            const zSamples = 32;
            const ringVerts = [];

            levels.forEach(lvl => {
                const ring = [];
                for (let i = 0; i <= zSamples; i++) {
                    const t = i / zSamples;
                    const z = THREE.MathUtils.lerp(lvl.bowZ, lvl.sternZ, t);
                    let w;
                    if (t < 0.28) {
                        const tb = t / 0.28;
                        w = THREE.MathUtils.lerp(lvl.bowW, lvl.midW, Math.pow(tb, 0.72));
                    } else if (t > 0.78) {
                        const ts = (t - 0.78) / 0.22;
                        w = THREE.MathUtils.lerp(lvl.midW, lvl.sternW, ts);
                    } else {
                        w = lvl.midW;
                    }
                    ring.push(new THREE.Vector3(-w, lvl.y, z));
                }
                for (let i = zSamples; i >= 0; i--) {
                    const t = i / zSamples;
                    const z = THREE.MathUtils.lerp(lvl.bowZ, lvl.sternZ, t);
                    let w;
                    if (t < 0.28) {
                        const tb = t / 0.28;
                        w = THREE.MathUtils.lerp(lvl.bowW, lvl.midW, Math.pow(tb, 0.72));
                    } else if (t > 0.78) {
                        const ts = (t - 0.78) / 0.22;
                        w = THREE.MathUtils.lerp(lvl.midW, lvl.sternW, ts);
                    } else {
                        w = lvl.midW;
                    }
                    ring.push(new THREE.Vector3(w, lvl.y, z));
                }
                ringVerts.push(ring);
            });

            const verts = [];
            const indices = [];
            const ptsPerRing = ringVerts[0].length;

            ringVerts.forEach(ring => {
                ring.forEach(v => { verts.push(v.x, v.y, v.z); });
            });

            for (let r = 0; r < ringVerts.length - 1; r++) {
                for (let i = 0; i < ptsPerRing - 1; i++) {
                    const a = r * ptsPerRing + i;
                    const b = r * ptsPerRing + i + 1;
                    const c = (r + 1) * ptsPerRing + i + 1;
                    const d = (r + 1) * ptsPerRing + i;
                    // Outward-facing normals (counter-clockwise from outside)
                    indices.push(a, c, b);
                    indices.push(a, d, c);
                }
                const a = r * ptsPerRing + (ptsPerRing - 1);
                const b = r * ptsPerRing;
                const c = (r + 1) * ptsPerRing;
                const d = (r + 1) * ptsPerRing + (ptsPerRing - 1);
                indices.push(a, c, b);
                indices.push(a, d, c);
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
            geo.setIndex(indices);
            geo.computeVertexNormals();
            return new THREE.Mesh(geo, hullGreyMat);
        }

        function createRotodomeTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, 512, 512);

            // High-contrast dark navy black quadrants
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.moveTo(256, 256);
            ctx.lineTo(175, 16);
            ctx.lineTo(337, 16);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(256, 256);
            ctx.lineTo(175, 496);
            ctx.lineTo(337, 496);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 10;
            ctx.beginPath();
            ctx.arc(256, 256, 248, 0, Math.PI * 2);
            ctx.stroke();

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function spawnParticle(pos, vel, s0, s1, maxLife, colorHex = 0xf8fafc, alpha0 = 0.45) {
            const mat = new THREE.MeshBasicMaterial({
                color: colorHex,
                transparent: true,
                opacity: alpha0,
                depthWrite: false
            });
            const m = new THREE.Mesh(puffGeo, mat);
            m.position.copy(pos);
            m.scale.setScalar(s0);
            carrierGroup.add(m);
            particles.push({ mesh: m, vel: vel.clone(), s0, s1, life: 0, maxLife, alpha0 });
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life += dt;
                if (p.life >= p.maxLife) {
                    carrierGroup.remove(p.mesh);
                    p.mesh.material.dispose();
                    particles.splice(i, 1);
                    continue;
                }
                const t = p.life / p.maxLife;
                p.mesh.position.addScaledVector(p.vel, dt);
                p.mesh.scale.setScalar(THREE.MathUtils.lerp(p.s0, p.s1, t));
                p.mesh.material.opacity = p.alpha0 * (1.0 - t);
            }
        }
