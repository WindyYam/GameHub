<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVN-78 USS Gerald R. Ford — Isometric Tactical Flight Ops</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b2239;
            font-family: 'Inter', sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .hud-glass {
            background: rgba(8, 19, 34, 0.72);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(125, 211, 252, 0.22);
            box-shadow: 0 10px 28px -4px rgba(0, 0, 0, 0.55);
        }
        .hud-btn {
            background: linear-gradient(180deg, rgba(16, 36, 62, 0.88) 0%, rgba(10, 23, 42, 0.94) 100%);
            border: 1px solid rgba(56, 189, 248, 0.32);
            transition: all 0.16s ease;
        }
        .hud-btn:hover {
            background: linear-gradient(180deg, rgba(26, 58, 98, 0.95) 0%, rgba(14, 34, 64, 1) 100%);
            border-color: rgba(125, 211, 252, 0.85);
            transform: translateY(-1px);
        }
        .hud-btn-active {
            background: linear-gradient(180deg, rgba(14, 116, 144, 0.9) 0%, rgba(15, 76, 117, 0.96) 100%);
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body class="text-slate-100">

    <!-- 3D Viewport -->
    <div id="canvas-container"></div>

    <!-- Top-Right Compact Tactical Bar -->
    <div id="hud-top" class="fixed top-3 right-3 z-20 flex flex-col items-end gap-2 pointer-events-auto">
        <div class="hud-glass rounded-xl px-3.5 py-2.5 flex flex-wrap items-center gap-3">
            <div class="flex items-center gap-2 pr-2 border-r border-sky-400/20">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <div>
                    <div class="mono text-[10px] text-sky-400 font-bold tracking-wider leading-none">CVN-78 • TRUE ORTHO ISOMETRIC</div>
                    <div class="text-xs font-bold text-white leading-tight mt-0.5">USS GERALD R. FORD</div>
                </div>
            </div>

            <div class="flex items-center gap-1.5 text-[11px] font-medium">
                <button data-cam="iso" class="cam-btn hud-btn hud-btn-active px-2.5 py-1 rounded-lg">Ortho Isometric</button>
                <button data-cam="bow" class="cam-btn hud-btn px-2.5 py-1 rounded-lg">Bow Cats</button>
                <button data-cam="island" class="cam-btn hud-btn px-2.5 py-1 rounded-lg">Island</button>
                <button data-cam="stern" class="cam-btn hud-btn px-2.5 py-1 rounded-lg">Landing</button>
            </div>

            <div class="flex items-center gap-1 text-[11px] font-medium pl-1 border-l border-sky-400/20">
                <button data-time="day" class="time-btn hud-btn hud-btn-active px-2 py-1 rounded-lg">Day</button>
                <button data-time="sunset" class="time-btn hud-btn px-2 py-1 rounded-lg">Dusk</button>
                <button id="btn-toggle-roster" class="hud-btn hud-btn-active px-2 py-1 rounded-lg text-sky-300 mono text-[10px]">ROSTER</button>
                <button id="btn-toggle-hud" class="hud-btn px-2 py-1 rounded-lg text-sky-300 mono text-[10px]" title="Toggle HUD">HUD</button>
            </div>
        </div>

        <div id="hud-log-pill" class="hud-glass rounded-lg px-3 py-1.5 flex items-center gap-2 text-[11px] mono">
            <span class="text-sky-400 font-bold">PRI-FLY:</span>
            <span id="ops-status-log" class="text-slate-200">PERSISTENT AIR WING • ZERO POP-IN • CLICK ANY AIRCRAFT</span>
        </div>
    </div>

    <!-- Collapsible Right-Side Persistent Air Wing Roster & Unit Command Panel -->
    <div id="hud-roster" class="fixed top-28 right-3 z-20 w-72 pointer-events-auto flex flex-col gap-2">
        <div class="hud-glass rounded-xl p-3 flex flex-col gap-2">
            <div class="flex items-center justify-between border-b border-sky-400/20 pb-1.5">
                <div class="mono text-[11px] font-bold text-sky-300 tracking-wide">CVW-8 PERSISTENT ROSTER</div>
                <span id="roster-summary" class="mono text-[10px] text-emerald-400 font-semibold">22 UNITS TRACKED</span>
            </div>

            <!-- Selected Aircraft Detail & Direct Action Bar -->
            <div id="selected-unit-panel" class="bg-slate-950/75 border border-sky-400/30 rounded-lg p-2 flex flex-col gap-1.5">
                <div class="flex items-center justify-between">
                    <span id="sel-callsign" class="mono text-xs font-bold text-amber-300">VMFA-211 #201</span>
                    <span id="sel-type" class="mono text-[10px] px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-300">F-35C</span>
                </div>
                <div class="flex items-center justify-between text-[11px]">
                    <span class="text-slate-400">STATE:</span>
                    <span id="sel-state" class="mono font-semibold text-emerald-400">PARKED</span>
                </div>
                <div class="flex items-center gap-1.5 mt-0.5">
                    <button id="btn-unit-action" class="hud-btn flex-1 py-1 px-2 rounded text-[10px] mono font-bold text-amber-300">
                        TAXI & LAUNCH
                    </button>
                    <button id="btn-unit-follow" class="hud-btn py-1 px-2 rounded text-[10px] mono text-sky-300">
                        FOLLOW: OFF
                    </button>
                </div>
            </div>

            <!-- Scrollable Live Aircraft List -->
            <div id="roster-list" class="max-h-56 overflow-y-auto pr-1 flex flex-col gap-1 text-[11px] mono"></div>
        </div>
    </div>

    <!-- Bottom-Left Compact Flight Ops Trigger Bar -->
    <div id="hud-bottom" class="fixed bottom-3 left-3 z-20 pointer-events-auto">
        <div class="hud-glass rounded-xl p-2 flex items-center gap-2">
            <button id="btn-launch" class="hud-btn py-1.5 px-3 rounded-lg flex items-center gap-2 text-xs font-semibold text-white">
                <span class="w-2 h-2 rounded-full bg-amber-400 shadow-[0_0_6px_#fbbf24]"></span>
                <span>LAUNCH NEXT PARKED JET</span>
            </button>
            <button id="btn-recover" class="hud-btn py-1.5 px-3 rounded-lg flex items-center gap-2 text-xs font-semibold text-white">
                <span class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_6px_#34d399]"></span>
                <span>RECOVER AIRBORNE JET</span>
            </button>
            <button id="btn-heli" class="hud-btn py-1.5 px-3 rounded-lg flex items-center gap-2 text-xs font-semibold text-white">
                <span class="w-2 h-2 rounded-full bg-sky-400 shadow-[0_0_6px_#38bdf8]"></span>
                <span>CYCLE SEAHAWK SORTIE</span>
            </button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // ============================================================================
        // 1. SCENE & TRUE ORTHOGRAPHIC ISOMETRIC CAMERA PIPELINE
        // ============================================================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x091c33);
        scene.fog = new THREE.FogExp2(0x0e2848, 0.00015);

        const ORTHO_FRUSTUM_HEIGHT = 186;
        const aspect = window.innerWidth / window.innerHeight;
        const camera = new THREE.OrthographicCamera(
            (-ORTHO_FRUSTUM_HEIGHT * aspect) / 2,
            ( ORTHO_FRUSTUM_HEIGHT * aspect) / 2,
             ORTHO_FRUSTUM_HEIGHT / 2,
            -ORTHO_FRUSTUM_HEIGHT / 2,
            -2000,
            4000
        );

        // Reference framing matching desktop reference photo:
        // Elevated aerial perspective looking from starboard bow quarter aft
        const CAMERA_PRESETS = {
            iso:    { pos: new THREE.Vector3(-248, 198, 238), target: new THREE.Vector3(-3, 10, -5), zoom: 1.15 },
            bow:    { pos: new THREE.Vector3(-190, 145, 260), target: new THREE.Vector3(0, 12, 82),  zoom: 2.15 },
            island: { pos: new THREE.Vector3(-230, 155, 45),  target: new THREE.Vector3(-22, 22, -52), zoom: 2.35 },
            stern:  { pos: new THREE.Vector3(-210, 155, -165), target: new THREE.Vector3(6, 12, -55), zoom: 1.85 }
        };
        camera.position.copy(CAMERA_PRESETS.iso.pos);
        camera.zoom = CAMERA_PRESETS.iso.zoom;
        camera.updateProjectionMatrix();

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.02;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.copy(CAMERA_PRESETS.iso.target);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.maxPolarAngle = Math.PI * 0.47;
        controls.minZoom = 0.55;
        controls.maxZoom = 4.5;

        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.15,
            0.35,
            0.88
        );
        composer.addPass(bloomPass);
        composer.addPass(new OutputPass());

        let desiredCamPos = null;
        let desiredCamTarget = null;
        let desiredCamZoom = null;
        let followUnit = null;

        controls.addEventListener('start', () => {
            desiredCamPos = null;
            desiredCamTarget = null;
            desiredCamZoom = null;
        });

        function setStatusLog(text) {
            const el = document.getElementById('ops-status-log');
            if (el) el.textContent = text;
        }

        // ============================================================================
        // 2. CRISP MARITIME DAYLIGHT LIGHTING
        // ============================================================================
        // Calibrated daylight illumination matching reference photo
        const hemiLight = new THREE.HemisphereLight(0xb4d8fc, 0x142234, 0.52);
        scene.add(hemiLight);

        // Crisp sunlight casting sharp, clean shadows from island and aircraft
        const sunLight = new THREE.DirectionalLight(0xfffaed, 3.25);
        sunLight.position.set(150, 280, -85);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 4096;
        sunLight.shadow.mapSize.height = 4096;
        sunLight.shadow.camera.near = 50;
        sunLight.shadow.camera.far = 700;
        const shadowD = 210;
        sunLight.shadow.camera.left = -shadowD;
        sunLight.shadow.camera.right = shadowD;
        sunLight.shadow.camera.top = shadowD;
        sunLight.shadow.camera.bottom = -shadowD;
        sunLight.shadow.bias = -0.00018;
        sunLight.shadow.normalBias = 0.02;
        scene.add(sunLight);

        // Subtle sky fill on the shadow side
        const fillLight = new THREE.DirectionalLight(0x6aa2d8, 0.22);
        fillLight.position.set(-180, 80, 140);
        scene.add(fillLight);

        // ============================================================================
        // 3. FLIGHT DECK TEXTURE & MAPS (HIGH-FIDELITY NON-SKID & MARKINGS)
        // ============================================================================
        const DECK_MIN_X = -40;
        const DECK_MAX_X = 44;
        const DECK_MIN_Z = -155;
        const DECK_MAX_Z = 155;

        // Shared aircraft national insignia generator
        function createUSNavyInsigniaTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, 256, 128);

            // Navy blue background disc
            ctx.fillStyle = '#1e3a8a';
            ctx.beginPath();
            ctx.arc(128, 64, 46, 0, Math.PI * 2);
            ctx.fill();

            // Flanking white bars
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(20, 48, 216, 32);

            // Red center horizontal stripe
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(20, 58, 216, 12);

            // Re-draw circle outline and central star
            ctx.fillStyle = '#1e3a8a';
            ctx.beginPath();
            ctx.arc(128, 64, 44, 0, Math.PI * 2);
            ctx.fill();

            // Five point white star
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                const aOuter = -Math.PI / 2 + (i * Math.PI * 2) / 5;
                const aInner = aOuter + Math.PI / 5;
                const rOuter = 38;
                const rInner = 15;
                const ox = 128 + Math.cos(aOuter) * rOuter;
                const oy = 64 + Math.sin(aOuter) * rOuter;
                const ix = 128 + Math.cos(aInner) * rInner;
                const iy = 64 + Math.sin(aInner) * rInner;
                if (i === 0) ctx.moveTo(ox, oy);
                else ctx.lineTo(ox, oy);
                ctx.lineTo(ix, iy);
            }
            ctx.closePath();
            ctx.fill();

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }
        const usNavyInsigniaTex = createUSNavyInsigniaTexture();

        function createFlightDeckMaps() {
            const width = 2048;
            const height = 4096;

            const colorCanvas = document.createElement('canvas');
            colorCanvas.width = width;
            colorCanvas.height = height;
            const ctx = colorCanvas.getContext('2d');

            const bumpCanvas = document.createElement('canvas');
            bumpCanvas.width = width;
            bumpCanvas.height = height;
            const bCtx = bumpCanvas.getContext('2d');

            const toPx = (x) => ((x - DECK_MIN_X) / (DECK_MAX_X - DECK_MIN_X)) * width;
            const toPy = (z) => (1.0 - (z - DECK_MIN_Z) / (DECK_MAX_Z - DECK_MIN_Z)) * height;

            // 1. Sun-bleached light slate/concrete naval grey non-skid coat (#848e9a to #9aa4b0)
            ctx.fillStyle = '#86909c';
            ctx.fillRect(0, 0, width, height);

            bCtx.fillStyle = '#808080';
            bCtx.fillRect(0, 0, width, height);

            // Bright sun-faded chalking radial highlights across the flight deck
            const sunFade1 = ctx.createRadialGradient(toPx(0), toPy(55), 50, toPx(0), toPy(40), 1250);
            sunFade1.addColorStop(0.0, 'rgba(235, 241, 248, 0.34)');
            sunFade1.addColorStop(0.5, 'rgba(218, 226, 236, 0.18)');
            sunFade1.addColorStop(1.0, 'rgba(180, 190, 202, 0.0)');
            ctx.fillStyle = sunFade1;
            ctx.fillRect(0, 0, width, height);

            const sunFade2 = ctx.createRadialGradient(toPx(6), toPy(-65), 60, toPx(4), toPy(-50), 1100);
            sunFade2.addColorStop(0.0, 'rgba(232, 238, 245, 0.28)');
            sunFade2.addColorStop(0.6, 'rgba(210, 218, 228, 0.14)');
            sunFade2.addColorStop(1.0, 'rgba(180, 190, 202, 0.0)');
            ctx.fillStyle = sunFade2;
            ctx.fillRect(0, 0, width, height);

            // Longitudinal non-skid roller strips & bright aggregate streaks
            for (let x = 0; x < width; x += 14) {
                ctx.fillStyle = (x % 28 === 0) ? 'rgba(255,255,255,0.045)' : 'rgba(40,48,58,0.032)';
                ctx.fillRect(x, 0, 7, height);
                bCtx.fillStyle = (x % 28 === 0) ? '#8d8d8d' : '#747474';
                bCtx.fillRect(x, 0, 4, height);
            }

            // Welded steel deck plating seam grid & expansion joints
            ctx.lineWidth = 1.4;
            for (let gx = -38; gx <= 42; gx += 3.5) {
                const px = toPx(gx);
                ctx.strokeStyle = 'rgba(62, 70, 82, 0.24)';
                ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, height); ctx.stroke();
                bCtx.strokeStyle = '#686868';
                bCtx.beginPath(); bCtx.moveTo(px, 0); bCtx.lineTo(px, height); bCtx.stroke();
            }
            for (let gz = -150; gz <= 150; gz += 7.5) {
                const py = toPy(gz);
                const isExpansionJoint = Math.abs(gz % 30) < 1.0;
                ctx.strokeStyle = isExpansionJoint ? 'rgba(40, 46, 56, 0.48)' : 'rgba(65, 74, 86, 0.20)';
                ctx.lineWidth = isExpansionJoint ? 3.2 : 1.2;
                ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(width, py); ctx.stroke();

                if (isExpansionJoint) {
                    ctx.strokeStyle = 'rgba(230, 236, 244, 0.35)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.moveTo(0, py + 2.5); ctx.lineTo(width, py + 2.5); ctx.stroke();
                }

                bCtx.strokeStyle = isExpansionJoint ? '#424242' : '#6c6c6c';
                bCtx.lineWidth = isExpansionJoint ? 3.0 : 1.2;
                bCtx.beginPath(); bCtx.moveTo(0, py); bCtx.lineTo(width, py); bCtx.stroke();
            }

            // Fine aggregate non-skid grain stipple (bright chalky micro-particles)
            for (let i = 0; i < 95000; i++) {
                const rx = Math.random() * width;
                const ry = Math.random() * height;
                const isBright = Math.random() > 0.42;
                ctx.fillStyle = isBright ? 'rgba(248,250,252,0.065)' : 'rgba(45,52,64,0.045)';
                ctx.fillRect(rx, ry, 2 + Math.random() * 2.5, 2 + Math.random() * 5);
                bCtx.fillStyle = isBright ? '#989898' : '#686868';
                bCtx.fillRect(rx, ry, 2, 2);
            }

            // 2. Cruciform Tie-Down Pad-Eyes (~20-ft grid across flight deck)
            function drawPadEye(px, py) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(px, py, 5.8, 0, Math.PI * 2);
                ctx.fillStyle = '#5c6672';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(px, py, 4.6, 0, Math.PI * 2);
                ctx.strokeStyle = '#d8e0ea';
                ctx.lineWidth = 1.2;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(px, py, 3.4, 0, Math.PI * 2);
                ctx.fillStyle = '#333a44';
                ctx.fill();

                ctx.fillStyle = '#cbd5e1';
                ctx.fillRect(px - 0.9, py - 3.4, 1.8, 6.8);
                ctx.fillRect(px - 3.4, py - 0.9, 6.8, 1.8);
                ctx.restore();

                bCtx.save();
                bCtx.beginPath();
                bCtx.arc(px, py, 5.8, 0, Math.PI * 2);
                bCtx.fillStyle = '#525252';
                bCtx.fill();
                bCtx.fillStyle = '#a4a4a4';
                bCtx.fillRect(px - 1.0, py - 3.0, 2.0, 6.0);
                bCtx.fillRect(px - 3.0, py - 1.0, 6.0, 2.0);
                bCtx.restore();
            }

            for (let gz = -148; gz <= 148; gz += 4.2) {
                const rowOffset = (Math.abs(Math.round(gz / 4.2)) % 2) * 2.1;
                for (let gx = -35 + rowOffset; gx <= 39; gx += 4.2) {
                    const px = toPx(gx);
                    const py = toPy(gz);
                    if (px > 70 && px < width - 70 && py > 65 && py < height - 65) {
                        drawPadEye(px, py);
                    }
                }
            }

            // 2B. Dedicated Perimeter Aircraft Parking Stall Boxes, Wheel Chock T-Bars & Spot Stencils
            function drawParkingStall(x, z, rotY, spotLabel, wM = 9.6, lM = 13.5) {
                const px = toPx(x);
                const py = toPy(z);
                const pw = (wM / (DECK_MAX_X - DECK_MIN_X)) * width;
                const pl = (lM / (DECK_MAX_Z - DECK_MIN_Z)) * height;

                ctx.save();
                ctx.translate(px, py);
                ctx.rotate(-rotY);

                // Slightly brighter concrete pad tint inside parking stall
                ctx.fillStyle = 'rgba(241, 245, 249, 0.10)';
                ctx.fillRect(-pw * 0.5, -pl * 0.5, pw, pl);

                // Crisp yellow/white dashed stall boundary box
                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 4.0;
                ctx.setLineDash([18, 12]);
                ctx.strokeRect(-pw * 0.5, -pl * 0.5, pw, pl);
                ctx.setLineDash([]);

                // Corner L-brackets in bright white
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 5.0;
                const cL = 22;
                [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([sx, sy]) => {
                    const cx = sx * pw * 0.5;
                    const cy = sy * pl * 0.5;
                    ctx.beginPath();
                    ctx.moveTo(cx - sx * cL, cy);
                    ctx.lineTo(cx, cy);
                    ctx.lineTo(cx, cy - sy * cL);
                    ctx.stroke();
                });

                // Nose wheel alignment T-bar & main gear chock boxes
                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 4.5;
                ctx.beginPath();
                ctx.moveTo(0, -pl * 0.36);
                ctx.lineTo(0,  pl * 0.25);
                ctx.moveTo(-24, -pl * 0.28);
                ctx.lineTo( 24, -pl * 0.28);
                ctx.stroke();

                // Stenciled Spot Label
                ctx.save();
                ctx.translate(0, pl * 0.36);
                ctx.font = '800 22px "JetBrains Mono", monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
                ctx.fillRect(-52, -13, 104, 26);
                ctx.fillStyle = '#f8fafc';
                ctx.fillText(spotLabel, 0, 1);
                ctx.restore();

                ctx.restore();
            }

            // Starboard Forward Finger Parking Line (Spots 01–07)
            const stbdFwdParking = [
                { x: -15.2, z: 108, rot: 0.92 - Math.PI, lbl: 'SPOT 01' },
                { x: -19.2, z:  91, rot: 0.95 - Math.PI, lbl: 'SPOT 02' },
                { x: -23.2, z:  74, rot: 0.96 - Math.PI, lbl: 'SPOT 03' },
                { x: -27.2, z:  56, rot: 0.98 - Math.PI, lbl: 'SPOT 04' },
                { x: -30.5, z:  38, rot: 1.00 - Math.PI, lbl: 'SPOT 05' },
                { x: -31.8, z:  19, rot: 1.02 - Math.PI, lbl: 'SPOT 06' },

        // ============================================================================
        // 4. OCEAN & HYDRODYNAMIC WAKE (TRACE) SHADER
        // ============================================================================
        // Physically-based maritime water synthesis:
        // - Non-periodic 10-octave directional Gerstner spectrum with organic curved wavefronts
        // - Analytical vertex normal & Jacobian crest-pinch calculation
        // - Rotated-octave Simplex/Value FBM + Cellular Voronoise micro-facet slope perturbation
        // - Schlick Fresnel, anisotropic turquoise subsurface scattering, whitecaps, and Kelvin wake
        const oceanUniforms = {
            uTime: { value: 0 },
            uSunDir: { value: new THREE.Vector3(150, 280, -85).normalize() },
            uSunColor: { value: new THREE.Color(0xfffef2) },
            uDeepColor: { value: new THREE.Color(0x041325) },      // Deep abyssal Atlantic indigo-navy
            uMidColor: { value: new THREE.Color(0x0b2d4d) },       // Pelagic open-ocean blue-teal slope
            uSkyColor: { value: new THREE.Color(0x4679a3) },       // Maritime sky dome reflection
            uWakeTurquoise: { value: new THREE.Color(0x138e88) },  // Subsurface scattering & aerated turquoise
            uFoamWhite: { value: new THREE.Color(0xdcebf5) }       // Natural sunlit sea froth
        };

        const oceanMaterial = new THREE.ShaderMaterial({
            uniforms: oceanUniforms,
            vertexShader: `
                uniform float uTime;
                varying vec3 vWorldPos;
                varying vec3 vNormal;
                varying float vWaveHeight;
                varying float vCrestFactor;

                // Non-periodic 2D hash & smooth noise for spatial phase/domain warping
                float vHash(vec2 p) {
                    p = fract(p * vec2(123.34, 456.21));
                    p += dot(p, p + 45.32);
                    return fract(p.x * p.y);
                }

                float vNoise(vec2 p) {
                    vec2 i = floor(p);
                    vec2 f = fract(p);
                    vec2 u = f * f * (3.0 - 2.0 * f);
                    return mix(
                        mix(vHash(i), vHash(i + vec2(1.0, 0.0)), u.x),
                        mix(vHash(i + vec2(0.0, 1.0)), vHash(i + vec2(1.0, 1.0)), u.x),
                        u.y
                    );
                }

                // Directional Gerstner wave with curved wavefront modulation & analytical Jacobian
                void addCurvedGerstnerWave(
                    vec2 dir, float steepness, float wavelength, float speedScale,
                    vec2 warpedXZ, float phaseJitter, float time,
                    inout vec3 disp, inout vec3 tangent, inout vec3 binormal, inout float jacobian
                ) {
                    float k = 6.28318530718 / wavelength;
                    float c = sqrt(9.81 / k) * speedScale;
                    float theta = k * (dot(dir, warpedXZ) - c * time) + phaseJitter;
                    float a = steepness / k;

                    float s = sin(theta);
                    float cs = cos(theta);

                    disp.x += dir.x * (a * cs);
                    disp.y += a * s;
                    disp.z += dir.y * (a * cs);

                    // Partial derivatives for exact geometric normal and crest compression
                    float wa = k * a; // equals steepness
                    tangent.x  -= dir.x * dir.x * wa * s;
                    tangent.y  += dir.x * wa * cs;
                    tangent.z  -= dir.x * dir.y * wa * s;

                    binormal.x -= dir.x * dir.y * wa * s;
                    binormal.y += dir.y * wa * cs;
                    binormal.z -= dir.y * dir.y * wa * s;

                    // Track horizontal crest convergence (pinch)
                    jacobian -= wa * s;
                }

                void main() {
                    vec4 wp = modelMatrix * vec4(position, 1.0);
                    vec2 posXZ = wp.xz;
                    float t = uTime;

                    // Low-frequency spatial domain warp bends wavefronts organically so they never form
                    // straight parallel lines or repetitive diagonal grids across the orthographic camera
                    vec2 warp1 = vec2(
                        vNoise(posXZ * 0.0042 + vec2(t * 0.015, -t * 0.012)),
                        vNoise(posXZ * 0.0042 + vec2(19.3, 47.1) - t * 0.014)
                    ) - 0.5;
                    vec2 warp2 = vec2(
                        vNoise(posXZ * 0.0135 - vec2(t * 0.03, t * 0.02)),
                        vNoise(posXZ * 0.0135 + vec2(73.7, 11.9) + t * 0.025)
                    ) - 0.5;

                    vec2 swellXZ = posXZ + warp1 * 34.0 + warp2 * 9.5;
                    vec2 chopXZ  = posXZ + warp1 * 16.0 + warp2 * 11.0;
                    float phaseMod = (warp1.x + warp2.y) * 2.4;

                    vec3 disp = vec3(0.0);
                    vec3 tangent = vec3(1.0, 0.0, 0.0);
                    vec3 binormal = vec3(0.0, 0.0, 1.0);
                    float jacobian = 1.0;

                    // 10-Octave Non-Periodic Directional Wave Spectrum:
                    // Irrational wavelength ratios & golden-angle directional spreading prevent periodicity
                    // 1-3: Primary & secondary open-ocean swells
                    addCurvedGerstnerWave(normalize(vec2( 0.48,  0.87)), 0.145, 193.0, 1.15, swellXZ, phaseMod * 0.6,  t, disp, tangent, binormal, jacobian);

                const ring = [];
                for (let i = 0; i <= zSamples; i++) {
                    const t = i / zSamples;
                    const z = THREE.MathUtils.lerp(lvl.bowZ, lvl.sternZ, t);
                    let w;
                    if (t < 0.28) {
                        const tb = t / 0.28;
                        w = THREE.MathUtils.lerp(lvl.bowW, lvl.midW, Math.pow(tb, 0.72));
                    } else if (t > 0.78) {
                        const ts = (t - 0.78) / 0.22;
                        w = THREE.MathUtils.lerp(lvl.midW, lvl.sternW, ts);
                    } else {
                        w = lvl.midW;
                    }
                    ring.push(new THREE.Vector3(-w, lvl.y, z));
                }
                for (let i = zSamples; i >= 0; i--) {
                    const t = i / zSamples;
                    const z = THREE.MathUtils.lerp(lvl.bowZ, lvl.sternZ, t);
                    let w;
                    if (t < 0.28) {
                        const tb = t / 0.28;
                        w = THREE.MathUtils.lerp(lvl.bowW, lvl.midW, Math.pow(tb, 0.72));
                    } else if (t > 0.78) {
                        const ts = (t - 0.78) / 0.22;
                        w = THREE.MathUtils.lerp(lvl.midW, lvl.sternW, ts);
                    } else {
                        w = lvl.midW;
                    }
                    ring.push(new THREE.Vector3(w, lvl.y, z));
                }
                ringVerts.push(ring);

                for (let i = 0; i < ptsPerRing - 1; i++) {
                    const a = r * ptsPerRing + i;
                    const b = r * ptsPerRing + i + 1;
                    const c = (r + 1) * ptsPerRing + i + 1;
                    const d = (r + 1) * ptsPerRing + i;
                    // Outward-facing normals (counter-clockwise from outside)

                    indices.push(a, d, c);

        // F-35C Lightning II Carrier Strike Fighter
        // Continuous 35° swept planform, seamless stealth chines, and vertical wing folding
        function createF35C({ foldedWings = false } = {}) {
            const jet = new THREE.Group();

            // 1. Sleek Faceted Stealth Lifting Body & Integrated Radome
            const stations = [
                { z:  5.80, w: 0.05, yTop: 1.02, yBot: 0.98 },
                { z:  4.60, w: 0.62, yTop: 1.20, yBot: 0.82 },
                { z:  3.20, w: 1.15, yTop: 1.42, yBot: 0.72 },
                { z:  1.80, w: 1.45, yTop: 1.48, yBot: 0.68 },
                { z: -0.40, w: 1.50, yTop: 1.46, yBot: 0.68 },
                { z: -2.60, w: 1.35, yTop: 1.32, yBot: 0.75 },
                { z: -3.80, w: 0.70, yTop: 1.15, yBot: 0.85 }
            ];

            const bodyVerts = [];
            const bodyIndices = [];
            const numPts = 8;

            stations.forEach((s) => {
                const yMid = (s.yTop + s.yBot) * 0.5;
                const h = (s.yTop - s.yBot) * 0.5;
                bodyVerts.push(0, s.yTop, s.z);                      // 0: top spine
                bodyVerts.push(-s.w * 0.72, yMid + h * 0.5, s.z);    // 1: stbd upper shoulder
                bodyVerts.push(-s.w, yMid, s.z);                     // 2: stbd chine
                bodyVerts.push(-s.w * 0.72, yMid - h * 0.5, s.z);    // 3: stbd lower shoulder
                bodyVerts.push(0, s.yBot, s.z);                      // 4: bottom keel
                bodyVerts.push(s.w * 0.72, yMid - h * 0.5, s.z);     // 5: port lower shoulder
                bodyVerts.push(s.w, yMid, s.z);                      // 6: port chine
                bodyVerts.push(s.w * 0.72, yMid + h * 0.5, s.z);     // 7: port upper shoulder
            });

            for (let r = 0; r < stations.length - 1; r++) {
                for (let i = 0; i < numPts; i++) {
                    const iNext = (i + 1) % numPts;
                    const a = r * numPts + i;
                    const b = r * numPts + iNext;
                    const c = (r + 1) * numPts + iNext;
                    const d = (r + 1) * numPts + i;
                    bodyIndices.push(a, b, c);
                    bodyIndices.push(a, c, d);
                }
            }

            const bodyGeo = new THREE.BufferGeometry();
            bodyGeo.setAttribute('position', new THREE.Float32BufferAttribute(bodyVerts, 3));
            bodyGeo.setIndex(bodyIndices);
            bodyGeo.computeVertexNormals();
            const bodyMesh = new THREE.Mesh(bodyGeo, f35DarkMat);
            bodyMesh.castShadow = true;
            jet.add(bodyMesh);

            // Forward Radome Cap (stealth dielectric nose)
            const radomeCap = new THREE.Mesh(new THREE.ConeGeometry(0.38, 1.35, 8), f35NoseMat);
            radomeCap.rotation.x = Math.PI / 2;
            radomeCap.scale.set(1.4, 0.7, 1.0);
            radomeCap.position.set(0, 1.02, 5.15);
            jet.add(radomeCap);

            // Under-nose Sapphire EOTS Window
            const eots = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.55, 4), canopyGoldMat);
            eots.rotation.x = Math.PI / 2;
            eots.position.set(0, 0.76, 4.8);
            jet.add(eots);

            // 2. Cockpit Bubble Canopy & Ejection Seat
            const canopy = new THREE.Mesh(new THREE.SphereGeometry(0.56, 16, 12), canopyGoldMat);
            canopy.scale.set(0.72, 0.75, 2.30);
            canopy.position.set(0, 1.42, 3.10);
            jet.add(canopy);

            const canopyArch = new THREE.Mesh(new THREE.TorusGeometry(0.48, 0.035, 6, 14, Math.PI), f35LightRamMat);
            canopyArch.position.set(0, 1.40, 3.25);
            jet.add(canopyArch);

            const seat = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.35, 0.25), tireBlackMat);
            seat.position.set(0, 1.45, 2.85);
            jet.add(seat);

            // 3. Diverterless Supersonic Intakes (DSI)
            [-1, 1].forEach(side => {
                const intake = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.58, 2.8), f35DarkMat);
                intake.position.set(side * 1.32, 1.00, 1.10);
                intake.castShadow = true;
                jet.add(intake);

                // Intake forward cowl bevel
                const cowlLip = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.12, 0.8), f35LightRamMat);
                cowlLip.position.set(side * 1.32, 1.26, 2.40);
                cowlLip.rotation.y = side > 0 ? -0.28 : 0.28;
                jet.add(cowlLip);
            });

            // 4. Continuous 35° Swept Inner Wing Panels
            [-1, 1].forEach(side => {
                const innerWingGeo = new THREE.BufferGeometry();
                const v0 = [side * 1.40, 1.08,  2.20]; // Root LE
                const v1 = [side * 3.80, 1.08,  0.52]; // Hinge LE (35° sweep)
                const v2 = [side * 3.80, 1.08, -1.12]; // Hinge TE
                const v3 = [side * 1.40, 1.08, -1.76]; // Root TE (15° forward sweep)
                const b0 = [side * 1.40, 0.96,  2.20];
                const b1 = [side * 3.80, 0.96,  0.52];
                const b2 = [side * 3.80, 0.96, -1.12];
                const b3 = [side * 1.40, 0.96, -1.76];

                const verts = [
                    ...v0, ...v1, ...v2, ...v3,
                    ...b0, ...b1, ...b2, ...b3
                ];
                let indices;
                if (side === 1) {
                    indices = [
                        0, 1, 2, 0, 2, 3,
                        4, 6, 5, 4, 7, 6,
                        0, 4, 5, 0, 5, 1,
                        1, 5, 6, 1, 6, 2,
                        2, 6, 7, 2, 7, 3,
                        3, 7, 4, 3, 4, 0
                    ];
                } else {
                    indices = [
                        0, 2, 1, 0, 3, 2,
                        4, 5, 6, 4, 6, 7,
                        0, 5, 4, 0, 1, 5,
                        1, 6, 5, 1, 2, 6,
                        2, 7, 6, 2, 3, 7,
                        3, 4, 7, 3, 0, 4
                    ];
                }
                innerWingGeo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
                innerWingGeo.setIndex(indices);
                innerWingGeo.computeVertexNormals();
                const innerMesh = new THREE.Mesh(innerWingGeo, f35DarkMat);
                innerMesh.castShadow = true;
                jet.add(innerMesh);

                // Titanium Hinge Rib & Red Hydraulic Lock Pin
                const hingeStrip = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.16, 1.8), foldHingeRedMat);
                hingeStrip.position.set(side * 3.80, 1.02, -0.30);
                jet.add(hingeStrip);
            });

            // Port wing national insignia
            const insigniaDecal = new THREE.Mesh(
                new THREE.PlaneGeometry(1.4, 0.7),
                new THREE.MeshStandardMaterial({ map: usNavyInsigniaTex, transparent: true, roughness: 0.5 })
            );
            insigniaDecal.rotation.x = -Math.PI / 2;
            insigniaDecal.position.set(2.55, 1.10, -0.35);
            jet.add(insigniaDecal);

            // 5. Precision Folding Outer Wing Panels (Continuous 35° Sweep to Cropped Tip)
            const wingFoldPivots = [];
            [-1, 1].forEach(side => {
                const foldPivot = new THREE.Group();
                foldPivot.position.set(side * 3.80, 1.02, 0);

                const outerWingGeo = new THREE.BufferGeometry();
                const w0 = [0,             0.06,  0.52]; // Hinge LE
                const w1 = [side * 1.60,   0.06, -0.60]; // Tip LE (continues exact 35° sweep)
                const w2 = [side * 1.60,   0.06, -1.55]; // Tip TE
                const w3 = [0,             0.06, -1.12]; // Hinge TE
                const ub0 = [0,           -0.06,  0.52];
                const ub1 = [side * 1.60, -0.06, -0.60];
                const ub2 = [side * 1.60, -0.06, -1.55];
                const ub3 = [0,           -0.06, -1.12];

                const verts = [
                    ...w0, ...w1, ...w2, ...w3,
                    ...ub0, ...ub1, ...ub2, ...ub3
                ];
                let indices;
                if (side === 1) {
                    indices = [
                        0, 1, 2, 0, 2, 3,
                        4, 6, 5, 4, 7, 6,
                        0, 4, 5, 0, 5, 1,
                        1, 5, 6, 1, 6, 2,
                        2, 6, 7, 2, 7, 3,
                        3, 7, 4, 3, 4, 0
                    ];
                } else {
                    indices = [
                        0, 2, 1, 0, 3, 2,
                        4, 5, 6, 4, 6, 7,
                        0, 5, 4, 0, 1, 5,
                        1, 6, 5, 1, 2, 6,
                        2, 7, 6, 2, 3, 7,
                        3, 4, 7, 3, 0, 4
                    ];
                }
                outerWingGeo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
                outerWingGeo.setIndex(indices);
                outerWingGeo.computeVertexNormals();
                const outerMesh = new THREE.Mesh(outerWingGeo, f35DarkMat);
                outerMesh.castShadow = true;
                foldPivot.add(outerMesh);

                // Wingtip missile launch rail / radar sensor pod
                const rail = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 1.15), f35LightRamMat);
                rail.position.set(side * 1.60, 0, -1.07);
                foldPivot.add(rail);

                foldPivot.rotation.z = foldedWings ? (side * 1.536) : 0;
                jet.add(foldPivot);
                wingFoldPivots.push({ pivot: foldPivot, side, maxAngle: 1.536 });
            });
            jet.userData.wingFoldPivots = wingFoldPivots;
            jet.userData.wingFoldRatio = foldedWings ? 1.0 : 0.0;

            // 6. Canted All-Moving Horizontal Stabilators (35° Sweep)
            [-1.95, 1.95].forEach(side => {
                const stabShape = new THREE.Shape();
                stabShape.moveTo(0, 0.85);
                stabShape.lineTo(side * 1.65, -0.30);
                stabShape.lineTo(side * 1.65, -1.45);
                stabShape.lineTo(0, -1.15);
                stabShape.closePath();

                const stabGeo = new THREE.ExtrudeGeometry(stabShape, { depth: 0.10, bevelEnabled: false });
                stabGeo.rotateX(Math.PI / 2);
                const hTail = new THREE.Mesh(stabGeo, f35DarkMat);
                hTail.position.set(side * 0.45, 0.98, -2.80);
                hTail.castShadow = true;
                jet.add(hTail);
            });

            // 7. Twin Canted Vertical Stabilizers (20° Outward Cant)
            [-1.22, 1.22].forEach(side => {
                const finShape = new THREE.Shape();
                finShape.moveTo(0, 0);
                finShape.lineTo(0, 2.15);
                finShape.lineTo(-1.50, 2.15);
                finShape.lineTo(-2.55, 0);
                finShape.closePath();

                const finGeo = new THREE.ExtrudeGeometry(finShape, { depth: 0.12, bevelEnabled: false });
                const vTail = new THREE.Mesh(finGeo, f35DarkMat);
                vTail.rotation.y = Math.PI / 2;
                vTail.rotation.x = side * 0.35;
                vTail.position.set(side * 1.15, 1.05, -1.85);
                vTail.castShadow = true;
                jet.add(vTail);

                const finInsignia = new THREE.Mesh(
                    new THREE.PlaneGeometry(0.85, 0.42),
                    new THREE.MeshStandardMaterial({ map: usNavyInsigniaTex, transparent: true, roughness: 0.5 })
                );
                finInsignia.position.set(side * 1.48 + (side > 0 ? 0.08 : -0.08), 1.95, -3.05);
                finInsignia.rotation.y = side > 0 ? Math.PI / 2 : -Math.PI / 2;
                finInsignia.rotation.z = side > 0 ? 0.35 : -0.35;
                jet.add(finInsignia);
            });

            // 8. Pratt & Whitney F135 Low-Observable Serrated Stealth Nozzle
            const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.58, 0.68, 1.45, 16), nozzleDarkMat);
            nozzle.rotation.x = Math.PI / 2;
            nozzle.position.set(0, 0.98, -4.25);
            jet.add(nozzle);

            const burner = new THREE.Mesh(
                new THREE.ConeGeometry(0.55, 4.0, 14),
                new THREE.MeshBasicMaterial({ color: 0xff7b00, transparent: true, opacity: 0.92 })
            );
            burner.rotation.x = -Math.PI / 2;
            burner.position.set(0, 0.98, -6.3);
            burner.visible = false;
            jet.add(burner);
            jet.userData.afterburners = [burner];

            addLandingGear(jet, 3.4, 1.48, -0.8);
            return jet;
        }

        function createRotodomeTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, 512, 512);

            // High-contrast dark navy black quadrants
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.moveTo(256, 256);
            ctx.lineTo(175, 16);
            ctx.lineTo(337, 16);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(256, 256);
            ctx.lineTo(175, 496);
            ctx.lineTo(337, 496);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 10;
            ctx.beginPath();
            ctx.arc(256, 256, 248, 0, Math.PI * 2);
            ctx.stroke();

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        // Helper to test if a deck position (x, z) is inside or too close to the angled landing strip or active catapults
        function isPointInRunwayOrCatapultZone(x, z, buffer = 2.0) {
            // 1. Angled Landing Runway Foul Line Corridor: from (-4.5, -152) to (36.5, 42)
            const rAx = -4.5, rAz = -152.0;
            const rBx = 36.5, rBz = 42.0;
            const rDx = rBx - rAx, rDz = rBz - rAz;
            const rLenSq = rDx * rDx + rDz * rDz;
            const tRunway = THREE.MathUtils.clamp(((x - rAx) * rDx + (z - rAz) * rDz) / rLenSq, 0.0, 1.0);
            const closeRx = rAx + tRunway * rDx;
            const closeRz = rAz + tRunway * rDz;
            const distRunway = Math.hypot(x - closeRx, z - closeRz);
            if (distRunway < 11.8 + buffer) return true;

            // 2. Bow Catapult 1 Track: (-7.5, 44) to (-6.5, 150)
            if (z >= 40 - buffer && z <= 152 + buffer && Math.abs(x - (-7.0)) < 4.5 + buffer) return true;

            // 3. Bow Catapult 2 Track: (8.5, 38) to (7.5, 150)
            if (z >= 34 - buffer && z <= 152 + buffer && Math.abs(x - 8.0) < 4.5 + buffer) return true;

            return false;
        }

        // Project any position out of the angled runway foul line so crew never enter the landing strip
        function clampOutOfRunwayZone(pos, minClearance = 12.2) {
            const rAx = -4.5, rAz = -152.0;
            const rBx = 36.5, rBz = 42.0;
            const rDx = rBx - rAx, rDz = rBz - rAz;
            const rLenSq = rDx * rDx + rDz * rDz;
            const tRunway = THREE.MathUtils.clamp(((pos.x - rAx) * rDx + (pos.z - rAz) * rDz) / rLenSq, 0.0, 1.0);
            const closeRx = rAx + tRunway * rDx;
            const closeRz = rAz + tRunway * rDz;
            const dx = pos.x - closeRx;
            const dz = pos.z - closeRz;
            const dist = Math.hypot(dx, dz);
            if (dist < minClearance) {
                // Push toward starboard side of the foul line (negative X) unless already far port
                const pushDirX = dx < 2.0 ? -1.0 : 1.0;
                const nx = dist > 0.001 ? dx / dist : pushDirX;
                const nz = dist > 0.001 ? dz / dist : 0.0;
                pos.x = closeRx + nx * minClearance;
                pos.z = closeRz + nz * minClearance;
            }
            pos.x = THREE.MathUtils.clamp(pos.x, -33.0, 34.0);
            pos.z = THREE.MathUtils.clamp(pos.z, -142.0, 145.0);
        }

        const deckCrewList = [];

        // - Aft Starboard Helo / Fantail Apron

        // ============================================================================

        const particles = [];
        const puffGeo = new THREE.SphereGeometry(0.65, 7, 7);

        function spawnParticle(pos, vel, s0, s1, maxLife, colorHex = 0xf8fafc, alpha0 = 0.45) {
            const mat = new THREE.MeshBasicMaterial({
                color: colorHex,
                transparent: true,
                opacity: alpha0,
                depthWrite: false
            });
            const m = new THREE.Mesh(puffGeo, mat);
            m.position.copy(pos);
            m.scale.setScalar(s0);
            carrierGroup.add(m);
            particles.push({ mesh: m, vel: vel.clone(), s0, s1, life: 0, maxLife, alpha0 });
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life += dt;
                if (p.life >= p.maxLife) {
                    carrierGroup.remove(p.mesh);
                    p.mesh.material.dispose();
                    particles.splice(i, 1);
                    continue;
                }
                const t = p.life / p.maxLife;
                p.mesh.position.addScaledVector(p.vel, dt);
                p.mesh.scale.setScalar(THREE.MathUtils.lerp(p.s0, p.s1, t));
                p.mesh.material.opacity = p.alpha0 * (1.0 - t);
            }
        }

        // ============================================================================
        // 10. FLIGHT OPS & TAXI ROUTE PLANNER
        // ============================================================================
        const RUNWAY_DIR = new THREE.Vector2(36.5 - (-4.5), 42.0 - (-152.0)).normalize();
        const RUNWAY_YAW = Math.atan2(RUNWAY_DIR.x, RUNWAY_DIR.y);

        function isCatapultBusy(catIdx) {
            return airWingUnits.some(u =>
                u.catIndex === catIdx &&
                (u.state === 'TAXI_TO_CAT' || u.state === 'PRE_LAUNCH' || u.state === 'LAUNCHING')
            );
        }

        function isLandingStripBusy() {
            return airWingUnits.some(u =>
                u.state === 'APPROACH' || u.state === 'TOUCHDOWN_ROLLOUT' || u.state === 'TAXI_TO_PARK'
            );
        }

        function gatherDynamicDeckObstacles(excludeUnit) {
            const obs = deckObstacleList.map(o => ({ x: o.x, z: o.z, r: o.radius }));
            airWingUnits.forEach(other => {
                if (other === excludeUnit) return;
                if (
                    other.state === 'PARKED' ||
                    other.state === 'TAXI_TO_CAT' ||
                    other.state === 'PRE_LAUNCH' ||
                    other.state === 'TAXI_TO_PARK' ||
                    other.state === 'TOUCHDOWN_ROLLOUT'
                ) {
                    const rad = other.type === 'E-2D' ? 8.5 : 6.4;
                    obs.push({ x: other.mesh.position.x, z: other.mesh.position.z, r: rad });
                }
            });
            if (jbdCat1.targetAngle > 0.1) obs.push({ x: -7.5, z: 44.0, r: 5.8 });
            if (jbdCat2.targetAngle > 0.1) obs.push({ x:  8.5, z: 38.0, r: 5.8 });
            return obs;
        }

        function relaxControlPointsAgainstObstacles(pts, obstacles, iterations = 6) {
            for (let iter = 0; iter < iterations; iter++) {
                for (let i = 2; i < pts.length - 2; i++) {
                    const p = pts[i];
                    obstacles.forEach(ob => {
                        const dx = p.x - ob.x;
                        const dz = p.z - ob.z;
                        const dist = Math.hypot(dx, dz);
                        const minClearance = ob.r + 3.6;
                        if (dist < minClearance && dist > 0.001) {
                            const push = (minClearance - dist) * 0.65;
                            p.x += (dx / dist) * push;
                            p.z += (dz / dist) * push;
                        }
                    });
                    const prev = pts[i - 1];
                    const next = pts[i + 1];
                    p.x = THREE.MathUtils.lerp(p.x, (prev.x + next.x) * 0.5, 0.25);
                    p.z = THREE.MathUtils.lerp(p.z, (prev.z + next.z) * 0.5, 0.25);

                    p.x = THREE.MathUtils.clamp(p.x, -20.5, 22.0);
                    p.z = THREE.MathUtils.clamp(p.z, -125.0, 130.0);
                }
            }
        }

        function planTaxiRouteToCatapult(unit, chosenCat) {
            const startPos = unit.mesh.position.clone();
            const startYaw = unit.mesh.rotation.y;
            const fwdDir = new THREE.Vector3(Math.sin(startYaw), 0, Math.cos(startYaw));

            const catX = chosenCat === 1 ? -7.5 : 8.5;
            const catZ = chosenCat === 1 ? 52.0 : 46.0;

            const pullOutDist = 8.5;
            const p1 = startPos.clone().addScaledVector(fwdDir, pullOutDist);
            p1.x = THREE.MathUtils.clamp(p1.x, -21.0, 22.0);

            const controlPts = [startPos.clone(), p1];
            const corridorX = chosenCat === 1 ? -4.2 : 2.8;

            if (p1.z < catZ - 14.0) {
                const zStep1 = THREE.MathUtils.lerp(p1.z, catZ - 16.0, 0.35);
                const zStep2 = THREE.MathUtils.lerp(p1.z, catZ - 16.0, 0.72);
                controlPts.push(new THREE.Vector3(corridorX, 0, zStep1));
                controlPts.push(new THREE.Vector3(corridorX, 0, zStep2));
            } else if (p1.z > catZ - 4.0) {
                const turnX = chosenCat === 1 ? -1.5 : 1.5;
                controlPts.push(new THREE.Vector3(turnX, 0, Math.max(p1.z - 14.0, catZ - 12.0)));
                controlPts.push(new THREE.Vector3(catX,  0, catZ - 15.0));
            }

            const leadIn = new THREE.Vector3(catX, 0, catZ - 9.5);
            const endPos = new THREE.Vector3(catX, 0, catZ);
            controlPts.push(leadIn, endPos);

            const obstacles = gatherDynamicDeckObstacles(unit);
            relaxControlPointsAgainstObstacles(controlPts, obstacles, 6);

            const curve = new THREE.CatmullRomCurve3(controlPts, false, 'centripetal', 0.5);
            const totalLen = curve.getLength();
            const taxiSpeed = 13.5;
            unit.taxiCurve = curve;
            unit.taxiDuration = Math.max(4.8, totalLen / taxiSpeed);
            unit.taxiTargetRot = 0.0;
            unit.currentYaw = startYaw;
        }

        function planTaxiRouteToPark(unit) {
            const startPos = unit.mesh.position.clone();
            const startYaw = unit.mesh.rotation.y;
            const fwdDir = new THREE.Vector3(Math.sin(startYaw), 0, Math.cos(startYaw));

            const homePos = unit.homePos.clone();
            const homeYaw = unit.homeRot;
            const homeDir = new THREE.Vector3(Math.sin(homeYaw), 0, Math.cos(homeYaw));

            const p1 = startPos.clone().addScaledVector(fwdDir, 10.0);
            const controlPts = [startPos.clone(), p1];

            const streetX = homePos.x < 0 ? -5.0 : 4.5;
            const approachPos = homePos.clone().addScaledVector(homeDir, -9.5);
            approachPos.x = THREE.MathUtils.clamp(approachPos.x, -21.0, 21.0);

            const midZ1 = THREE.MathUtils.lerp(p1.z, approachPos.z, 0.35);
            const midZ2 = THREE.MathUtils.lerp(p1.z, approachPos.z, 0.72);
            controlPts.push(new THREE.Vector3(streetX, 0, midZ1));
            controlPts.push(new THREE.Vector3(streetX, 0, midZ2));
            controlPts.push(approachPos, homePos);

            const obstacles = gatherDynamicDeckObstacles(unit);
            relaxControlPointsAgainstObstacles(controlPts, obstacles, 6);

            const curve = new THREE.CatmullRomCurve3(controlPts, false, 'centripetal', 0.5);
            const totalLen = curve.getLength();
            const taxiSpeed = 13.5;
            unit.taxiCurve = curve;
            unit.taxiDuration = Math.max(5.0, totalLen / taxiSpeed);
            unit.taxiTargetRot = homeYaw;
            unit.currentYaw = startYaw;
        }

        function stepAircraftAlongTaxiSpline(unit, dt) {
            const m = unit.mesh;
            const dur = unit.taxiDuration || 6.0;
            const rawT = Math.min(unit.stateTimer / dur, 1.0);
            const s = rawT * rawT * (3.0 - 2.0 * rawT);

            if (unit.taxiCurve) {
                const pos = unit.taxiCurve.getPointAt(s);
                const tan = unit.taxiCurve.getTangentAt(s);
                m.position.copy(pos);

                let desiredYaw = Math.atan2(tan.x, tan.z);
                if (rawT > 0.88) {
                    const blend = (rawT - 0.88) / 0.12;
                    desiredYaw = lerpYaw(desiredYaw, unit.taxiTargetRot, blend);
                }

                const prevYaw = unit.currentYaw;
                unit.currentYaw = lerpYaw(unit.currentYaw, desiredYaw, Math.min(1.0, dt * 8.5));
                const yawRate = angleDiff(prevYaw, unit.currentYaw) / Math.max(dt, 0.001);

                const turnRoll = THREE.MathUtils.clamp(-yawRate * 0.018, -0.04, 0.04);
                const brakePitch = rawT > 0.85 ? Math.sin(((rawT - 0.85) / 0.15) * Math.PI) * 0.018 : 0.0;
                m.rotation.set(brakePitch, unit.currentYaw, turnRoll);
            }
            return rawT;
        }

        const rosterListEl = document.getElementById('roster-list');
        const selCallsignEl = document.getElementById('sel-callsign');
