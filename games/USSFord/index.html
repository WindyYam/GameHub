            panelPivot.add(panel);

            const hazardEdge = new THREE.Mesh(
                new THREE.BoxGeometry(9.3, 0.30, 0.35),
                new THREE.MeshStandardMaterial({ color: 0xd97706 })
            );
            hazardEdge.position.set(0, 0, -4.2);
            panelPivot.add(hazardEdge);

            group.add(panelPivot);
            carrierGroup.add(group);
            return { panelPivot, targetAngle: 0, currentAngle: 0 };
        }

        const jbdCat1 = createJBD(-7.5, 44, 0.01);
        const jbdCat2 = createJBD( 8.5, 38, -0.01);

        const wireMat = new THREE.LineBasicMaterial({ color: 0x1e293b, linewidth: 2 });
        const wirePts = [
            new THREE.Vector3(-8.5, 0.16, -95),
            new THREE.Vector3( 3.5, 0.16, -98),
            new THREE.Vector3(15.5, 0.16, -101)
        ];
        const wireGeo = new THREE.BufferGeometry().setFromPoints(wirePts);
        const arrestingWireLine = new THREE.Line(wireGeo, wireMat);
        deckAssetsGroup.add(arrestingWireLine);

        [-119, -107, -83].forEach(wz => {
            const shiftX = (wz - (-98)) * 0.21;
            const pPts = [
                new THREE.Vector3(-8.5 + shiftX, 0.15, wz + 3),
                new THREE.Vector3( 3.5 + shiftX, 0.15, wz),
                new THREE.Vector3(15.5 + shiftX, 0.15, wz - 3)
            ];
            const pLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pPts), wireMat);
            deckAssetsGroup.add(pLine);

            [-9.2 + shiftX, 16.2 + shiftX].forEach((sx, sIdx) => {
                const damper = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.48, 0.35, 10), yellowGearMat);
                damper.position.set(sx, 0.18, sIdx === 0 ? wz + 3.2 : wz - 3.2);
                deckAssetsGroup.add(damper);
            });
        });

        // ============================================================================
        // 9. PARTICLES
        // ============================================================================
        const particles = [];
        const puffGeo = new THREE.SphereGeometry(0.65, 7, 7);

        function spawnParticle(pos, vel, s0, s1, maxLife, colorHex = 0xf8fafc, alpha0 = 0.45) {
            const mat = new THREE.MeshBasicMaterial({
                color: colorHex,
                transparent: true,
                opacity: alpha0,
                depthWrite: false
            });
            const m = new THREE.Mesh(puffGeo, mat);
            m.position.copy(pos);
            m.scale.setScalar(s0);
            carrierGroup.add(m);
            particles.push({ mesh: m, vel: vel.clone(), s0, s1, life: 0, maxLife, alpha0 });
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life += dt;
                if (p.life >= p.maxLife) {
                    carrierGroup.remove(p.mesh);
                    p.mesh.material.dispose();
                    particles.splice(i, 1);
                    continue;
                }
                const t = p.life / p.maxLife;
                p.mesh.position.addScaledVector(p.vel, dt);
                p.mesh.scale.setScalar(THREE.MathUtils.lerp(p.s0, p.s1, t));
                p.mesh.material.opacity = p.alpha0 * (1.0 - t);
            }
        }

        // ============================================================================
        // 10. FLIGHT OPS & TAXI ROUTE PLANNER
        // ============================================================================
        const RUNWAY_DIR = new THREE.Vector2(36.5 - (-4.5), 42.0 - (-152.0)).normalize();
        const RUNWAY_YAW = Math.atan2(RUNWAY_DIR.x, RUNWAY_DIR.y);

        function isCatapultBusy(catIdx) {
            return airWingUnits.some(u =>
                u.catIndex === catIdx &&
                (u.state === 'TAXI_TO_CAT' || u.state === 'PRE_LAUNCH' || u.state === 'LAUNCHING')
            );
        }

        function isLandingStripBusy() {
            return airWingUnits.some(u =>
                u.state === 'APPROACH' || u.state === 'TOUCHDOWN_ROLLOUT' || u.state === 'TAXI_TO_PARK'
            );
        }

        function gatherDynamicDeckObstacles(excludeUnit) {
            const obs = deckObstacleList.map(o => ({ x: o.x, z: o.z, r: o.radius }));
            mobileDeckVehicles.forEach(vehicle => {
                obs.push({ x: vehicle.mesh.position.x, z: vehicle.mesh.position.z, r: 4.0 });
            });
            airWingUnits.forEach(other => {
                if (other === excludeUnit) return;
                if (
                    other.state === 'PARKED' ||
                    other.state === 'TAXI_TO_CAT' ||
                    other.state === 'PRE_LAUNCH' ||
                    other.state === 'TAXI_TO_PARK' ||
                    other.state === 'TOUCHDOWN_ROLLOUT'
                ) {
                    const rad = other.type === 'E-2D' ? 8.5 : 6.4;
                    obs.push({ x: other.mesh.position.x, z: other.mesh.position.z, r: rad });
                }
            });
            if (jbdCat1.targetAngle > 0.1) obs.push({ x: -7.5, z: 44.0, r: 5.8 });
            if (jbdCat2.targetAngle > 0.1) obs.push({ x:  8.5, z: 38.0, r: 5.8 });
            return obs;
        }

        function updateMobileDeckVehicles(dt, hazards) {
            const stepTime = Math.min(dt, 0.05);
            mobileDeckVehicles.forEach(vehicle => {
                let waypoint = vehicle.route[vehicle.routeIndex];
                let toX = waypoint.x - vehicle.mesh.position.x;
                let toZ = waypoint.z - vehicle.mesh.position.z;
                let goalDistance = Math.hypot(toX, toZ);
                if (goalDistance < 1.8) {
                    vehicle.routeIndex = (vehicle.routeIndex + 1) % vehicle.route.length;
                    waypoint = vehicle.route[vehicle.routeIndex];
                    toX = waypoint.x - vehicle.mesh.position.x;
                    toZ = waypoint.z - vehicle.mesh.position.z;
                    goalDistance = Math.hypot(toX, toZ);
                }

                let avoidX = 0;
                let avoidZ = 0;
                let yieldToAircraft = false;
                hazards.forEach(hazard => {
                    const dx = vehicle.mesh.position.x - hazard.x;
                    const dz = vehicle.mesh.position.z - hazard.z;
                    const distance = Math.hypot(dx, dz);
                    const clearance = hazard.radius + 3.5;
                    if (distance >= clearance) return;

                    if (hazard.urgent && distance < hazard.radius + 5.0) yieldToAircraft = true;
                    const strength = (clearance - distance) / clearance;
                    const awayX = distance > 0.001 ? dx / distance : (vehicle.routeIndex % 2 ? 1 : -1);
                    const awayZ = distance > 0.001 ? dz / distance : 0;
                    avoidX += awayX * strength;
                    avoidZ += awayZ * strength;
                });

                deckObstacleList.forEach(obstacle => {
                    const dx = vehicle.mesh.position.x - obstacle.x;
                    const dz = vehicle.mesh.position.z - obstacle.z;
                    const distance = Math.hypot(dx, dz);
                    const clearance = obstacle.radius + 3.2;
                    if (distance >= clearance || distance < 0.001) return;
                    const strength = (clearance - distance) / clearance;
                    avoidX += (dx / distance) * strength;
                    avoidZ += (dz / distance) * strength;
                });

                mobileDeckVehicles.forEach(other => {
                    if (other === vehicle) return;
                    const dx = vehicle.mesh.position.x - other.mesh.position.x;
                    const dz = vehicle.mesh.position.z - other.mesh.position.z;
                    const distance = Math.hypot(dx, dz);
                    const clearance = 6.0;
                    if (distance >= clearance || distance < 0.001) return;
                    const strength = (clearance - distance) / clearance;
                    avoidX += (dx / distance) * strength;
                    avoidZ += (dz / distance) * strength;
                });

                if (yieldToAircraft || goalDistance < 0.001) return;
                const steerX = toX / goalDistance + avoidX * 2.4;
                const steerZ = toZ / goalDistance + avoidZ * 2.4;
                const steerLength = Math.hypot(steerX, steerZ);
                if (steerLength < 0.001) return;

                const desiredYaw = Math.atan2(steerX, steerZ);
                const turnBlend = 1.0 - Math.exp(-4.0 * stepTime);
                vehicle.mesh.rotation.y = lerpYaw(vehicle.mesh.rotation.y, desiredYaw, turnBlend);
                const yawError = Math.abs(angleDiff(vehicle.mesh.rotation.y, desiredYaw));
                const driveFactor = Math.max(0.18, Math.cos(yawError));
                const driveDistance = vehicle.speed * driveFactor * stepTime;
                const moveX = Math.sin(vehicle.mesh.rotation.y) * driveDistance;
                const moveZ = Math.cos(vehicle.mesh.rotation.y) * driveDistance;
                vehicle.mesh.position.x += moveX;
                vehicle.mesh.position.z += moveZ;
            });
        }

        function relaxControlPointsAgainstObstacles(pts, obstacles, iterations = 16) {
            for (let iter = 0; iter < iterations; iter++) {
                // Relax intermediate points (skip starting point and final landing/shuttle point)
                for (let i = 1; i < pts.length - 1; i++) {
                    const p = pts[i];
                    obstacles.forEach(ob => {
                        const dx = p.x - ob.x;
                        const dz = p.z - ob.z;
                        const dist = Math.hypot(dx, dz);
                        const minClearance = ob.r + 5.2;
                        if (dist < minClearance && dist > 0.001) {
                            const push = (minClearance - dist) * 0.75;
                            p.x += (dx / dist) * push;
                            p.z += (dz / dist) * push;
                        }
                    });
                    const prev = pts[i - 1];
                    const next = pts[i + 1];
                    const smoothWeight = (i === 1 || i === pts.length - 2) ? 0.16 : 0.25;
                    p.x = THREE.MathUtils.lerp(p.x, (prev.x + next.x) * 0.5, smoothWeight);
                    p.z = THREE.MathUtils.lerp(p.z, (prev.z + next.z) * 0.5, smoothWeight);

                    p.x = THREE.MathUtils.clamp(p.x, -21.0, 22.0);
                    p.z = THREE.MathUtils.clamp(p.z, -125.0, 130.0);
                }
            }
        }

        function planTaxiRouteToCatapult(unit, chosenCat) {
            const startPos = unit.mesh.position.clone();
            const startYaw = unit.mesh.rotation.y;
            const fwdDir = new THREE.Vector3(Math.sin(startYaw), 0, Math.cos(startYaw));

            const catX = chosenCat === 1 ? -7.5 : 8.5;
            const catZ = chosenCat === 1 ? 52.0 : 46.0;

            const pullOutDist = 8.5;
            const p1 = startPos.clone().addScaledVector(fwdDir, pullOutDist);
            p1.x = THREE.MathUtils.clamp(p1.x, -21.0, 22.0);

            const controlPts = [startPos.clone(), p1];
            const corridorX = chosenCat === 1 ? -4.2 : 2.8;

            if (p1.z < catZ - 14.0) {
                const zStep1 = THREE.MathUtils.lerp(p1.z, catZ - 16.0, 0.35);
                const zStep2 = THREE.MathUtils.lerp(p1.z, catZ - 16.0, 0.72);
                controlPts.push(new THREE.Vector3(corridorX, 0, zStep1));
                controlPts.push(new THREE.Vector3(corridorX, 0, zStep2));
            } else if (p1.z > catZ - 4.0) {
                const turnX = chosenCat === 1 ? -1.5 : 1.5;
                controlPts.push(new THREE.Vector3(turnX, 0, Math.max(p1.z - 14.0, catZ - 12.0)));
                controlPts.push(new THREE.Vector3(catX,  0, catZ - 15.0));
            }

            const leadIn = new THREE.Vector3(catX, 0, catZ - 9.5);
            const endPos = new THREE.Vector3(catX, 0, catZ);
            controlPts.push(leadIn, endPos);

            const obstacles = gatherDynamicDeckObstacles(unit);
            relaxControlPointsAgainstObstacles(controlPts, obstacles, 16);

            const curve = new THREE.CatmullRomCurve3(controlPts, false, 'centripetal', 0.5);
            const totalLen = curve.getLength();
            const taxiSpeed = 13.5;
            unit.taxiCurve = curve;
            unit.taxiDuration = Math.max(2.4, totalLen / taxiSpeed);
            unit.taxiTargetRot = 0.0;
            unit.currentYaw = startYaw;
            unit.taxiAvoidOffset = new THREE.Vector2(0, 0);
            unit.prevTaxiPos = null;
        }

        function planTaxiRouteToPark(unit) {
            const startPos = unit.mesh.position.clone();
            const startYaw = unit.mesh.rotation.y;
            const fwdDir = new THREE.Vector3(Math.sin(startYaw), 0, Math.cos(startYaw));

            const homePos = unit.homePos.clone();
            const homeYaw = unit.homeRot;
            const homeDir = new THREE.Vector3(Math.sin(homeYaw), 0, Math.cos(homeYaw));

            const p1 = startPos.clone().addScaledVector(fwdDir, 10.0);
            const controlPts = [startPos.clone(), p1];

            const streetX = homePos.x < 0 ? -5.0 : 4.5;
            const approachPos = homePos.clone().addScaledVector(homeDir, -9.5);
            approachPos.x = THREE.MathUtils.clamp(approachPos.x, -21.0, 21.0);

            const midZ1 = THREE.MathUtils.lerp(p1.z, approachPos.z, 0.35);
            const midZ2 = THREE.MathUtils.lerp(p1.z, approachPos.z, 0.72);
            controlPts.push(new THREE.Vector3(streetX, 0, midZ1));
            controlPts.push(new THREE.Vector3(streetX, 0, midZ2));
            controlPts.push(approachPos, homePos);

            const obstacles = gatherDynamicDeckObstacles(unit);
            relaxControlPointsAgainstObstacles(controlPts, obstacles, 16);

            const curve = new THREE.CatmullRomCurve3(controlPts, false, 'centripetal', 0.5);
            const totalLen = curve.getLength();
            const taxiSpeed = 13.5;
            unit.taxiCurve = curve;
            unit.taxiDuration = Math.max(4.5, totalLen / taxiSpeed);
            unit.taxiTargetRot = homeYaw;
            unit.currentYaw = startYaw;
            unit.taxiAvoidOffset = new THREE.Vector2(0, 0);
            unit.prevTaxiPos = null;
        }

        function stepAircraftAlongTaxiSpline(unit, dt) {
            const m = unit.mesh;
            const dur = unit.taxiDuration || 6.0;
            const rawT = Math.min(unit.stateTimer / dur, 1.0);
            const s = rawT * rawT * (3.0 - 2.0 * rawT);

            if (unit.taxiCurve) {
                const pos = unit.taxiCurve.getPointAt(s);
                const tan = unit.taxiCurve.getTangentAt(s).normalize();

                if (!unit.taxiAvoidOffset) unit.taxiAvoidOffset = new THREE.Vector2(0, 0);

                // Real-time dynamic obstacle avoidance & steering
                const obstacles = gatherDynamicDeckObstacles(unit);
                const myRadius = unit.type === 'E-2D' ? 8.2 : 5.8;
                let targetAvoidX = 0;
                let targetAvoidZ = 0;

                // Motion lateral normal (perpendicular to taxi spline tangent)
                const normX = -tan.z;
                const normZ = tan.x;

                const curX = pos.x + unit.taxiAvoidOffset.x;
                const curZ = pos.z + unit.taxiAvoidOffset.y;

                obstacles.forEach(ob => {
                    const dx = curX - ob.x;
                    const dz = curZ - ob.z;
                    const dist = Math.hypot(dx, dz);
                    const safeDist = ob.r + myRadius + 1.2;
                    if (dist < safeDist && dist > 0.001) {
                        const overlap = safeDist - dist;
                        const pushX = dx / dist;
                        const pushZ = dz / dist;
                        // Determine which side of flight deck path obstacle lies on
                        const latSign = (pushX * normX + pushZ * normZ) >= 0 ? 1 : -1;
                        // Steer away radially & deflect laterally around obstacle
                        targetAvoidX += (pushX * 0.75 + normX * latSign * 0.65) * overlap;
                        targetAvoidZ += (pushZ * 0.75 + normZ * latSign * 0.65) * overlap;
                    }
                });

                // Smoothly taper deflection at start (pulling out of spot) and end (aligning into shuttle/spot)
                let blend = 1.0;
                if (rawT < 0.15) {
                    blend = rawT / 0.15;
                } else if (rawT > 0.82) {
                    blend = Math.max(0.0, (1.0 - rawT) / 0.18);
                }
                targetAvoidX *= blend;
                targetAvoidZ *= blend;

                // Restrict maximum lateral avoidance offset
                const maxDeflect = 6.0;
                targetAvoidX = THREE.MathUtils.clamp(targetAvoidX, -maxDeflect, maxDeflect);
                targetAvoidZ = THREE.MathUtils.clamp(targetAvoidZ, -maxDeflect, maxDeflect);

                // Smoothly interpolate avoidance offset
                const lerpFactor = Math.min(1.0, dt * 4.5);
                unit.taxiAvoidOffset.x = THREE.MathUtils.lerp(unit.taxiAvoidOffset.x, targetAvoidX, lerpFactor);
                unit.taxiAvoidOffset.y = THREE.MathUtils.lerp(unit.taxiAvoidOffset.y, targetAvoidZ, lerpFactor);

                const finalX = THREE.MathUtils.clamp(pos.x + unit.taxiAvoidOffset.x, -21.0, 22.0);
                const finalZ = THREE.MathUtils.clamp(pos.z + unit.taxiAvoidOffset.y, -125.0, 130.0);
                m.position.set(finalX, pos.y, finalZ);

                // Calculate steering orientation based on actual dynamic ground trajectory
                let desiredYaw;
                if (rawT > 0.88) {
                    const endBlend = (rawT - 0.88) / 0.12;
                    const baseYaw = Math.atan2(tan.x, tan.z);
                    desiredYaw = lerpYaw(baseYaw, unit.taxiTargetRot, endBlend);
                } else if (unit.prevTaxiPos) {
                    const moveX = finalX - unit.prevTaxiPos.x;
                    const moveZ = finalZ - unit.prevTaxiPos.z;
                    const moveDist = Math.hypot(moveX, moveZ);
                    if (moveDist > 0.015) {
                        desiredYaw = Math.atan2(moveX, moveZ);
                    } else {
                        desiredYaw = Math.atan2(tan.x, tan.z);
                    }
                } else {
                    desiredYaw = Math.atan2(tan.x, tan.z);
                }

                if (!unit.prevTaxiPos) unit.prevTaxiPos = new THREE.Vector3();
                unit.prevTaxiPos.set(finalX, pos.y, finalZ);

                const prevYaw = unit.currentYaw;
                unit.currentYaw = lerpYaw(unit.currentYaw, desiredYaw, Math.min(1.0, dt * 8.5));
                const yawRate = angleDiff(prevYaw, unit.currentYaw) / Math.max(dt, 0.001);

                const turnRoll = THREE.MathUtils.clamp(-yawRate * 0.018, -0.04, 0.04);
                const brakePitch = rawT > 0.85 ? Math.sin(((rawT - 0.85) / 0.15) * Math.PI) * 0.018 : 0.0;
                m.rotation.set(brakePitch, unit.currentYaw, turnRoll);
            }
            return rawT;
        }

        window.airWingUnits = airWingUnits;
        window.commandJetLaunch = commandJetLaunch;
        window.commandJetRecovery = commandJetRecovery;
        window.commandHeliSortie = commandHeliSortie;

        const rosterListEl = document.getElementById('roster-list');
        const selCallsignEl = document.getElementById('sel-callsign');
        const selTypeEl = document.getElementById('sel-type');
        const selStateEl = document.getElementById('sel-state');
        const btnUnitAction = document.getElementById('btn-unit-action');
        const btnUnitFollow = document.getElementById('btn-unit-follow');

        function commandJetLaunch(unit) {
            if (!unit || !unit.canCycleJet || unit.state !== 'PARKED') return false;
            let chosenCat = unit.catIndex;
            if (isCatapultBusy(chosenCat)) {
                chosenCat = chosenCat === 1 ? 2 : 1;
                if (isCatapultBusy(chosenCat)) {
                    setStatusLog(`PRI-FLY: BOTH CATAPULTS OCCUPIED — STAND BY FOR ${unit.callsign}`);
                    return false;
                }
            }
            unit.catIndex = chosenCat;
            unit.state = 'TAXI_TO_CAT';
            unit.stateTimer = 0;
            planTaxiRouteToCatapult(unit, chosenCat);
            setStatusLog(`${unit.callsign} (${unit.type}): TAXIING TO CAT ${chosenCat}`);
            renderRosterUI();
            return true;
        }

        function commandJetRecovery(unit) {
            if (!unit || !unit.canCycleJet || unit.state !== 'AIRBORNE_PATROL') return false;
            if (isLandingStripBusy()) {
                setStatusLog(`LSO: FOUL DECK — ${unit.callsign} WAVE OFF`);
                return false;
            }
            const touchdown = new THREE.Vector3(3.5, 0, -98.0);
            const approachEntry = touchdown.clone().addScaledVector(
                new THREE.Vector3(RUNWAY_DIR.x, 0, RUNWAY_DIR.y),
                -215.0
            );
            approachEntry.y = 32.0;
            unit.approachStartPosition = unit.mesh.position.clone();
            unit.approachStartRotation = unit.mesh.rotation.clone();
            unit.approachJoinDuration = Math.max(2.5, unit.mesh.position.distanceTo(approachEntry) / 85.0);
            unit.state = 'APPROACH';
            unit.stateTimer = 0;
            setStatusLog(`LSO: "${unit.callsign} ON FINAL GLIDE SLOPE — CALLING THE BALL"`);
            renderRosterUI();
            return true;
        }

        function commandHeliSortie(unit) {
            if (!unit || unit.type !== 'MH-60S') return false;
            if (unit.state === 'PARKED') {
                unit.liftoffStartY = unit.mesh.position.y;
                unit.state = 'LIFTOFF';
                unit.stateTimer = 0;
                setStatusLog(`${unit.callsign}: LIFTING OFF FOR PATROL ORBIT`);
                renderRosterUI();
                return true;
            } else if (unit.state === 'PATROL_ORBIT') {
                unit.heliReturnStartPosition = unit.mesh.position.clone();
                unit.heliReturnStartRotation = unit.mesh.rotation.clone();
                unit.heliReturnDuration = Math.max(4.0, unit.mesh.position.distanceTo(unit.homePos) / 14.0);
                unit.state = 'RETURN_APPROACH';
                unit.stateTimer = 0;
                setStatusLog(`${unit.callsign}: RETURNING TO FLIGHT DECK`);
                renderRosterUI();
                return true;
            }
            return false;
        }

        function setWingFoldRatio(mesh, ratio) {
            mesh.userData.wingFoldRatio = ratio;
            if (!mesh.userData.wingFoldPivots) return;
            mesh.userData.wingFoldPivots.forEach(w => {
                w.pivot.rotation.z = w.side * w.maxAngle * ratio;
            });
        }

        function lerpYaw(a, b, t) {
            let diff = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI;
            if (diff < -Math.PI) diff += Math.PI * 2;
            return a + diff * t;
        }

        function angleDiff(a, b) {
            let diff = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI;
            if (diff < -Math.PI) diff += Math.PI * 2;
            return diff;
        }

        function renderRosterUI() {
            if (!rosterListEl) return;
            rosterListEl.innerHTML = '';
            let countParked = 0;
            let countAirborne = 0;

            airWingUnits.forEach(u => {
                if (u.state === 'PARKED') countParked++;
                else countAirborne++;

                const item = document.createElement('div');
                const isSelected = u === selectedUnit;
                item.className = `flex items-center justify-between p-2 rounded cursor-pointer transition-all ${
                    isSelected
                        ? 'bg-transparent border border-amber-300/75 shadow-none ring-1 ring-amber-400/35'
                        : 'bg-transparent hover:bg-slate-800/20 border border-transparent hover:border-slate-400/35'
                }`;

                let badgeColor = 'text-slate-400';
                if (u.state === 'PARKED') badgeColor = 'text-slate-300';
                else if (u.state === 'AIRBORNE_PATROL') badgeColor = 'text-amber-400';
                else badgeColor = 'text-sky-300';

                item.innerHTML = `
                    <div class="flex items-center gap-2">
                        ${isSelected ? '<span class="w-2.5 h-2.5 rounded-full border border-amber-300 bg-transparent"></span>' : '<span class="w-1.5 h-1.5 rounded-full border border-slate-600 bg-transparent"></span>'}
                        <span class="font-bold ${isSelected ? 'text-slate-100 font-extrabold text-[12px]' : 'text-white'}">${u.callsign}</span>
                        <span class="text-[9px] px-1.5 py-0.2 rounded border border-slate-400/35 bg-transparent ${isSelected ? 'text-slate-200 font-bold' : 'text-slate-300'}">${u.type}</span>
                    </div>
                    <span class="text-[10px] font-bold ${isSelected ? 'text-amber-200' : badgeColor}">${u.state}</span>
                `;

                item.addEventListener('click', () => {
                    selectedUnit = u;
                    renderRosterUI();
                });
                rosterListEl.appendChild(item);
            });

            const summaryEl = document.getElementById('roster-summary');
            if (summaryEl) summaryEl.textContent = `${airWingUnits.length} UNITS • ${countParked} PARKED • ${countAirborne} AIRBORNE`;

            if (selectedUnit) {
                btnUnitAction.disabled = false;
                btnUnitFollow.disabled = false;
                selCallsignEl.textContent = selectedUnit.callsign;
                selTypeEl.textContent = selectedUnit.label;
                selStateEl.textContent = selectedUnit.state;

                if (followUnit === selectedUnit) {
                    btnUnitFollow.textContent = 'FOLLOW: ON';
                    btnUnitFollow.classList.add('hud-btn-green-active');
                } else {
                    btnUnitFollow.textContent = 'FOLLOW: OFF';
                    btnUnitFollow.classList.remove('hud-btn-green-active');
                }

                if (selectedUnit.type === 'MH-60S') {
                    btnUnitAction.textContent = selectedUnit.state === 'PARKED' ? 'LIFT OFF' : 'LAND & PARK';
                } else if (selectedUnit.canCycleJet) {
                    if (selectedUnit.state === 'PARKED') btnUnitAction.textContent = 'TAXI & LAUNCH';
                    else if (selectedUnit.state === 'AIRBORNE_PATROL') btnUnitAction.textContent = 'RECOVER / LAND';
                    else btnUnitAction.textContent = 'OPS IN PROGRESS';
                } else {
                    btnUnitAction.textContent = 'AWACS STATION';
                }
            } else {
                selCallsignEl.textContent = 'NO AIRCRAFT SELECTED';
                selTypeEl.textContent = 'NONE';
                selStateEl.textContent = 'IDLE';
                btnUnitAction.textContent = 'SELECT AIRCRAFT';
                btnUnitFollow.textContent = 'FOLLOW: OFF';
                btnUnitFollow.classList.remove('hud-btn-green-active');
                btnUnitAction.disabled = true;
                btnUnitFollow.disabled = true;
            }
        }

        btnUnitAction.addEventListener('click', () => {
            if (!selectedUnit) return;
            if (selectedUnit.type === 'MH-60S') commandHeliSortie(selectedUnit);
            else if (selectedUnit.state === 'PARKED') commandJetLaunch(selectedUnit);
            else if (selectedUnit.state === 'AIRBORNE_PATROL') commandJetRecovery(selectedUnit);
        });

        btnUnitFollow.addEventListener('click', () => {
            if (!selectedUnit) return;
            if (followUnit === selectedUnit) {
                followUnit = null;
                btnUnitFollow.textContent = 'FOLLOW: OFF';
                btnUnitFollow.classList.remove('hud-btn-green-active');
            } else {
                followUnit = selectedUnit;
                btnUnitFollow.textContent = 'FOLLOW: ON';
                btnUnitFollow.classList.add('hud-btn-green-active');
            }
        });

        selectedUnit = airWingUnits[0];
        renderRosterUI();

        let autoOpsTimer = 0;

        function updatePersistentAirWing(dt) {
            autoOpsTimer += dt;
            if (autoOpsTimer > 9.0) {
                autoOpsTimer = 0;
                if (!isCatapultBusy(1) && !isCatapultBusy(2)) {
                    const parkedJets = airWingUnits.filter(u => u.canCycleJet && u.state === 'PARKED' && u.id.startsWith('mid-jet'));
                    if (parkedJets.length > 0) {
                        const pick = parkedJets[Math.floor(Math.random() * parkedJets.length)];
                        commandJetLaunch(pick);
                    }
                }
                if (!isLandingStripBusy()) {
                    const readyToLand = airWingUnits.find(u => u.state === 'AIRBORNE_PATROL' && u.patrolLaps >= 1);
                    if (readyToLand) commandJetRecovery(readyToLand);
                }
            }

            jbdCat1.targetAngle = 0;
            jbdCat2.targetAngle = 0;

            const wPos = arrestingWireLine.geometry.attributes.position;
            let wireStretched = false;

            airWingUnits.forEach(u => {
                u.stateTimer += dt;
                const m = u.mesh;

                if (u.canCycleJet) {
                    const isCat1 = u.catIndex === 1;
                    const catStartX = isCat1 ? -7.5 : 8.5;
                    const catEndX   = isCat1 ? -6.5 : 7.5;
                    const catStartZ = isCat1 ? 52.0 : 46.0;
                    const catEndZ   = 148.0;

                    if (u.state === 'PARKED') {
                        m.position.copy(u.homePos);
                        m.rotation.set(0, u.homeRot, 0);
                        u.currentYaw = u.homeRot;
                        if (u.chocks) u.chocks.visible = true;
                        if (m.userData.gearGroup) m.userData.gearGroup.visible = true;
                        if (m.userData.afterburners) m.userData.afterburners.forEach(ab => ab.visible = false);
                        setWingFoldRatio(m, u.homeFolded ? 1.0 : 0.0);

                    } else if (u.state === 'TAXI_TO_CAT') {
                        if (u.chocks) u.chocks.visible = false;
                        const t = stepAircraftAlongTaxiSpline(u, dt);
                        if (u.homeFolded) {
                            setWingFoldRatio(m, Math.max(0.0, 1.0 - t * 2.0));
                        } else {
                            setWingFoldRatio(m, 0.0);
                        }

                        if (t >= 1.0) {
                            u.state = 'PRE_LAUNCH';
                            u.stateTimer = 0;
                            m.position.set(catStartX, 0, catStartZ);
                            m.rotation.set(0, 0, 0);
                            setStatusLog(`CAT ${u.catIndex}: ${u.callsign} LOCKED IN SHUTTLE`);
                            renderRosterUI();
                        }

                    } else if (u.state === 'PRE_LAUNCH') {
                        if (isCat1) jbdCat1.targetAngle = 0.82;
                        else jbdCat2.targetAngle = 0.82;

                        m.position.set(catStartX, 0, catStartZ);
                        m.rotation.set(0.025, 0, 0);
                        setWingFoldRatio(m, 0.0);

                        if (u.stateTimer > 0.45 && m.userData.afterburners) {
                            m.userData.afterburners.forEach(ab => {
                                ab.visible = true;
                                ab.scale.z = 0.85 + Math.sin(u.stateTimer * 45) * 0.22;
                            });
                            if (Math.random() < 0.55) {
                                spawnParticle(
                                    new THREE.Vector3(catStartX + (Math.random() - 0.5), DECK_Y + 0.8, catStartZ - 5.5),
                                    new THREE.Vector3((Math.random() - 0.5) * 4, 2.5 + Math.random() * 3, -10),
                                    0.4, 2.1, 0.6, 0xe2e8f0, 0.35
                                );
                            }
                        }

                        if (u.stateTimer >= 2.2) {
                            u.state = 'LAUNCHING';
                            u.stateTimer = 0;
                            setStatusLog(`CAT ${u.catIndex} LAUNCH! ${u.callsign} AIRBORNE`);
                            renderRosterUI();
                        }

                    } else if (u.state === 'LAUNCHING') {
                        const strokeDur = 1.45;
                        if (u.stateTimer <= strokeDur) {
                            if (isCat1) jbdCat1.targetAngle = 0.82;
                            else jbdCat2.targetAngle = 0.82;

                            const t = u.stateTimer / strokeDur;
                            const accel = t * t;
                            const cx = THREE.MathUtils.lerp(catStartX, catEndX, accel);
                            const cz = THREE.MathUtils.lerp(catStartZ, catEndZ, accel);
                            m.position.set(cx, 0, cz);
                            m.rotation.set(t > 0.82 ? -0.14 : 0, 0, 0);

                            spawnParticle(
                                new THREE.Vector3(cx, DECK_Y + 0.25, cz - 3.0),
                                new THREE.Vector3((Math.random() - 0.5) * 1.5, 0.8 + Math.random(), -6),
                                0.35, 1.8, 0.75, 0xf8fafc, 0.38
                            );
                        } else {
                            const climbT = (u.stateTimer - strokeDur) / 3.0;
                            if (climbT > 0.25 && m.userData.gearGroup) m.userData.gearGroup.visible = false;

                            const cz = catEndZ + climbT * 135;
                            const cy = Math.pow(climbT, 1.35) * 38;
                            const turnDir = isCat1 ? -1 : 1;
                            const cx = catEndX + turnDir * Math.pow(climbT, 1.8) * 55;

                            m.position.set(cx, cy, cz);
                            m.rotation.set(-0.22 * (1 - climbT * 0.5), turnDir * climbT * 0.85, -turnDir * 0.42);

                            if (climbT >= 1.0) {
                                u.state = 'AIRBORNE_PATROL';
                                u.stateTimer = 0;
                                u.patrolLaps = 0;
                                u.patrolAngle = Math.atan2(m.position.x / 145.0, m.position.z / 245.0);
                                u.patrolTransitionStartPosition = m.position.clone();
                                u.patrolTransitionStartRotation = m.rotation.clone();
                                u.patrolTransitionTimer = 0;
                                if (m.userData.afterburners) m.userData.afterburners.forEach(ab => ab.visible = false);
                                renderRosterUI();
                            }
                        }

                    } else if (u.state === 'AIRBORNE_PATROL') {
                        const angularSpeed = 0.42;
                        const prevAngle = u.patrolAngle;
                        u.patrolAngle += angularSpeed * dt;
                        if (Math.floor(u.patrolAngle / (Math.PI * 2)) > Math.floor(prevAngle / (Math.PI * 2))) {
                            u.patrolLaps++;
                        }

                        const rx = 145;
                        const rz = 245;
                        const px = Math.sin(u.patrolAngle) * rx;
                        const pz = Math.cos(u.patrolAngle) * rz;
                        const py = 42 + Math.sin(u.patrolAngle * 2) * 4.0;

                        const dx = Math.cos(u.patrolAngle) * rx;
                        const dz = -Math.sin(u.patrolAngle) * rz;
                        const heading = Math.atan2(dx, dz);

                        if (u.patrolTransitionStartPosition) {
                            u.patrolTransitionTimer = Math.min(u.patrolTransitionTimer + dt, 2.5);
                            const transitionProgress = u.patrolTransitionTimer / 2.5;
                            const easedProgress = transitionProgress * transitionProgress * (3.0 - 2.0 * transitionProgress);
                            m.position.lerpVectors(u.patrolTransitionStartPosition, new THREE.Vector3(px, py, pz), easedProgress);
                            m.rotation.x = THREE.MathUtils.lerp(u.patrolTransitionStartRotation.x, 0.03, easedProgress);
                            m.rotation.y = lerpYaw(u.patrolTransitionStartRotation.y, heading, easedProgress);
                            m.rotation.z = THREE.MathUtils.lerp(u.patrolTransitionStartRotation.z, -0.38, easedProgress);
                            if (transitionProgress >= 1.0) {
                                u.patrolTransitionStartPosition = null;
                                u.patrolTransitionStartRotation = null;
                            }
                        } else {
                            m.position.set(px, py, pz);
                            m.rotation.set(0.03, heading, -0.38);
                        }

                    } else if (u.state === 'APPROACH') {
                        const dur = 3.8;
                        if (m.userData.gearGroup) m.userData.gearGroup.visible = true;
                        setWingFoldRatio(m, 0.0);

                        const touchX = 3.5;
                        const touchZ = -98.0;
                        const approachEntry = new THREE.Vector3(
                            touchX - RUNWAY_DIR.x * 215.0,
                            32.0,
                            touchZ - RUNWAY_DIR.y * 215.0
                        );
                        const joinDuration = u.approachJoinDuration || 2.5;

                        if (u.stateTimer < joinDuration) {
                            const joinProgress = Math.min(u.stateTimer / joinDuration, 1.0);
                            const easedProgress = joinProgress * joinProgress * (3.0 - 2.0 * joinProgress);
                            m.position.lerpVectors(u.approachStartPosition, approachEntry, easedProgress);
                            m.rotation.x = THREE.MathUtils.lerp(u.approachStartRotation.x, -0.08, easedProgress);
                            m.rotation.y = lerpYaw(u.approachStartRotation.y, RUNWAY_YAW, easedProgress);
                            m.rotation.z = THREE.MathUtils.lerp(u.approachStartRotation.z, 0.0, easedProgress);
                        } else {
                            const t = Math.min((u.stateTimer - joinDuration) / dur, 1.0);
                            const distOut = (1.0 - t) * 215.0;

                            m.position.set(
                                touchX - RUNWAY_DIR.x * distOut,
                                (1.0 - t) * 32.0,
                                touchZ - RUNWAY_DIR.y * distOut
                            );
                            m.rotation.set(-0.08, RUNWAY_YAW, Math.sin(t * 10) * 0.02);

                            if (t >= 1.0) {
                                u.state = 'TOUCHDOWN_ROLLOUT';
                                u.stateTimer = 0;
                                setStatusLog(`TRAP! ${u.callsign} SNAGGED #3 WIRE`);
                                renderRosterUI();

                                for (let i = 0; i < 10; i++) {
                                    spawnParticle(
                                        new THREE.Vector3(touchX + (Math.random() - 0.5) * 2.5, DECK_Y + 0.35, touchZ + (Math.random() - 0.5) * 2.5),
                                        new THREE.Vector3((Math.random() - 0.5) * 6, 1.2 + Math.random() * 2, -5 - Math.random() * 5),
                                        0.6, 2.8, 1.0, 0xf8fafc, 0.55
                                    );
                                }
                            }
                        }

                    } else if (u.state === 'TOUCHDOWN_ROLLOUT') {
                        const dur = 1.75;
                        const t = Math.min(u.stateTimer / dur, 1.0);
                        const decel = 1.0 - Math.pow(1.0 - t, 2.6);
                        const runDist = decel * 74.0;

                        const touchX = 3.5;
                        const touchZ = -98.0;
                        const jx = touchX + RUNWAY_DIR.x * runDist;
                        const jz = touchZ + RUNWAY_DIR.y * runDist;

                        m.position.set(jx, 0, jz);
                        m.rotation.set(Math.sin(t * Math.PI) * 0.055, RUNWAY_YAW, 0);

                        wireStretched = true;
                        wPos.setXYZ(1, jx - RUNWAY_DIR.x * 4.2, 0.2, jz - RUNWAY_DIR.y * 4.2);
                        wPos.needsUpdate = true;

                        if (t >= 1.0) {
                            u.state = 'TAXI_TO_PARK';
                            u.stateTimer = 0;
                            planTaxiRouteToPark(u);
                            setStatusLog(`${u.callsign}: TAXIING BACK TO HOME SPOT & FOLDING WINGS`);
                            renderRosterUI();
                        }

                    } else if (u.state === 'TAXI_TO_PARK') {
                        const t = stepAircraftAlongTaxiSpline(u, dt);
                        if (u.homeFolded) {
                            setWingFoldRatio(m, Math.max(0.0, (t - 0.35) / 0.65));
                        }

                        if (t >= 1.0) {
                            u.state = 'PARKED';
                            u.stateTimer = 0;
                            m.position.copy(u.homePos);
                            m.rotation.set(0, u.homeRot, 0);
                            setWingFoldRatio(m, u.homeFolded ? 1.0 : 0.0);
                            setStatusLog(`${u.callsign}: SECURED AT HOME POSITION`);
                            renderRosterUI();
                        }
                    }

                } else if (u.type === 'MH-60S') {
                    if (u.state === 'LIFTOFF') {
                        const dur = 2.5;
                        const progress = Math.min(u.stateTimer / dur, 1.0);
                        const easedProgress = progress * progress * (3.0 - 2.0 * progress);
                        m.position.y = THREE.MathUtils.lerp(u.liftoffStartY || 0, 22, easedProgress);
                        m.rotation.y += dt * 0.5;
                        if (progress >= 1.0) {
                            u.state = 'PATROL_ORBIT';
                            u.stateTimer = 0;
                        }
                    } else if (u.state === 'PATROL_ORBIT') {
                        const a = u.stateTimer * 0.5;
                        const orbitProgress = Math.min(u.stateTimer / 3.0, 1.0);
                        const orbitRadius = 35.0 * orbitProgress * orbitProgress * (3.0 - 2.0 * orbitProgress);
                        m.position.x = u.homePos.x + Math.sin(a) * orbitRadius;
                        m.position.z = u.homePos.z + Math.cos(a) * orbitRadius;
                        m.position.y = 22 + Math.sin(a * 2) * 3.0 * orbitProgress;
                        m.rotation.y = lerpYaw(m.rotation.y, a + Math.PI / 2, 1.0 - Math.exp(-2.5 * dt));
                    } else if (u.state === 'RETURN_APPROACH') {
                        const duration = u.heliReturnDuration || 4.0;
                        const progress = Math.min(u.stateTimer / duration, 1.0);
                        const easedProgress = progress * progress * (3.0 - 2.0 * progress);
                        m.position.lerpVectors(u.heliReturnStartPosition, u.homePos, easedProgress);
                        m.rotation.x = THREE.MathUtils.lerp(u.heliReturnStartRotation.x, 0, easedProgress);
                        m.rotation.y = lerpYaw(u.heliReturnStartRotation.y, u.homeRot, easedProgress);
                        m.rotation.z = THREE.MathUtils.lerp(u.heliReturnStartRotation.z, 0, easedProgress);
                        if (progress >= 1.0) {
                            u.state = 'PARKED';
                            u.stateTimer = 0;
                            m.position.copy(u.homePos);
                            m.rotation.set(0, u.homeRot, 0);
                            renderRosterUI();
                        }
                    }
                }
            });

            if (!wireStretched) {
                wPos.setXYZ(1, 3.5, 0.14, -98.0);
                wPos.needsUpdate = true;
            }

            const jbd1P = jbdCat1.panelPivot.rotation;
            jbdCat1.currentAngle = THREE.MathUtils.lerp(jbdCat1.currentAngle, jbdCat1.targetAngle, dt * 4.0);
            jbd1P.x = jbdCat1.currentAngle;

            const jbd2P = jbdCat2.panelPivot.rotation;
            jbdCat2.currentAngle = THREE.MathUtils.lerp(jbdCat2.currentAngle, jbdCat2.targetAngle, dt * 4.0);
            jbd2P.x = jbdCat2.currentAngle;
        }

        // ============================================================================
        // 11. ANIMATION LOOP
        // ============================================================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const dt = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            oceanUniforms.uTime.value = elapsed;

            // Gentle realistic carrier pitch, roll & heave
            const pitch = Math.sin(elapsed * 0.48) * 0.008;
            const roll  = Math.cos(elapsed * 0.36) * 0.007;
            const heave = Math.sin(elapsed * 0.62) * 0.20;
            carrierGroup.rotation.x = pitch;
            carrierGroup.rotation.z = roll;
            carrierGroup.position.y = heave;

            // Animate waving US Flag on mast gaff
            const fPos = flagGeo.attributes.position;
            for (let i = 0; i < fPos.count; i++) {
                const vx = fPos.getX(i);
                const wave = Math.sin(vx * 0.8 - elapsed * 6.5) * ((vx + 4.8) * 0.06);
                fPos.setZ(i, wave);
            }
            fPos.needsUpdate = true;

            spinningRadars.forEach(sr => {
                sr.mesh.rotation.y += sr.speed * dt;
            });

            spinningPropsAndDomes.forEach(sp => {
                if (sp.axis === 'z') sp.mesh.rotation.z += sp.speed * dt;
                else sp.mesh.rotation.y += sp.speed * dt;
            });

            allHeliRotors.forEach(hr => {
                hr.mainRotor.rotation.y += hr.speed * dt;
                hr.tailRotor.rotation.x += hr.speed * dt * 1.5;
            });

            if (selectedUnit) {
                selectionBracket.position.copy(selectedUnit.mesh.position);
                selectionBracket.rotation.y = selectedUnit.mesh.rotation.y;
                selectionBracket.visible = true;

                // Animate tactical reticle & overhead beacon for high daylight visibility
                selectionBracket.userData.pulseTimer = (selectionBracket.userData.pulseTimer || 0) + dt;
                const pt = selectionBracket.userData.pulseTimer;
                if (selectionBracket.userData.targetRing) {
                    selectionBracket.userData.targetRing.rotation.y += dt * 0.75;
                }
                if (selectionBracket.userData.overheadBeacon) {
                    selectionBracket.userData.overheadBeacon.rotation.y += dt * 1.6;
                    const baseBeaconY = selectedUnit.type === 'E-2D' ? 7.2 : 5.4;
                    selectionBracket.userData.overheadBeacon.position.y = baseBeaconY + Math.sin(pt * 3.5) * 0.35;
                }
                if (selectionBracket.userData.deckGroup) {
                    const pulseScale = 1.0 + Math.sin(pt * 4.0) * 0.035;
                    selectionBracket.userData.deckGroup.scale.set(pulseScale, 1.0, pulseScale);
                }
            } else {
                selectionBracket.visible = false;
            }

            const activeDeckHazards = [];
            airWingUnits.forEach(u => {
                if (u.state === 'AIRBORNE_PATROL' || u.state === 'PATROL_ORBIT') return;
                if (u.mesh.position.y > 8.0) return;

                const ax = u.mesh.position.x;
                const az = u.mesh.position.z;
                const ayaw = u.mesh.rotation.y;
                const fwdX = Math.sin(ayaw);
                const fwdZ = Math.cos(ayaw);

                const isMoving = (
                    u.state === 'TAXI_TO_CAT' ||
                    u.state === 'PRE_LAUNCH' ||
                    u.state === 'LAUNCHING' ||
                    u.state === 'APPROACH' ||
                    u.state === 'TOUCHDOWN_ROLLOUT' ||
                    u.state === 'TAXI_TO_PARK' ||
                    u.state === 'LIFTOFF' ||
                    u.state === 'RETURN_APPROACH'
                );

                activeDeckHazards.push({
                    x: ax,
                    z: az,
                    fwdX,
                    fwdZ,
                    radius: isMoving ? 13.5 : 7.5,
                    urgent: isMoving
                });

                if (isMoving) {
                    const lookDist1 = (u.state === 'LAUNCHING' || u.state === 'TOUCHDOWN_ROLLOUT') ? 16.0 : 9.5;
                    const lookDist2 = (u.state === 'LAUNCHING' || u.state === 'TOUCHDOWN_ROLLOUT') ? 32.0 : 18.0;
                    activeDeckHazards.push({
                        x: ax + fwdX * lookDist1,
                        z: az + fwdZ * lookDist1,
                        fwdX,
                        fwdZ,
                        radius: 12.5,
                        urgent: true
                    });
                    activeDeckHazards.push({
                        x: ax + fwdX * lookDist2,
                        z: az + fwdZ * lookDist2,
                        fwdX,
                        fwdZ,
                        radius: 11.5,
                        urgent: true
                    });
                }
            });

            updateMobileDeckVehicles(dt, activeDeckHazards);

            deckCrewList.forEach(c => {
                const a = elapsed * c.speed + c.phase;
                const limbs = c.mesh.userData.limbs;

                const patrolX = c.stationary ? c.baseX : (c.baseX + Math.cos(a) * c.radius);
                const patrolZ = c.stationary ? c.baseZ : (c.baseZ + Math.sin(a) * c.radius);

                let curX = patrolX + c.evadeOffsetX;
                let curZ = patrolZ + c.evadeOffsetZ;

                let fleeDirX = 0;
                let fleeDirZ = 0;
                let maxUrgency = 0;

                for (let h = 0; h < activeDeckHazards.length; h++) {
                    const haz = activeDeckHazards[h];
                    const dx = curX - haz.x;
                    const dz = curZ - haz.z;
                    const dist = Math.hypot(dx, dz);

                    if (dist < haz.radius && dist > 0.0001) {
                        const urgency = (1.0 - dist / haz.radius) * (haz.urgent ? 1.8 : 0.7);
                        if (haz.urgent) maxUrgency = Math.max(maxUrgency, urgency);

                        const latX = haz.fwdZ;
                        const latZ = -haz.fwdX;
                        const sideDot = dx * latX + dz * latZ;
                        const sideSign = sideDot >= 0 ? 1.0 : -1.0;

                        const radialX = dx / dist;
                        const radialZ = dz / dist;

                        fleeDirX += (radialX * 0.55 + latX * sideSign * 0.85) * urgency;
                        fleeDirZ += (radialZ * 0.55 + latZ * sideSign * 0.85) * urgency;
                    }
                }

                const fleeMag = Math.hypot(fleeDirX, fleeDirZ);
                if (fleeMag > 0.01 && maxUrgency > 0.02) {
                    const runSpeed = 9.5 + Math.min(maxUrgency * 6.0, 6.5);
                    const targetVx = (fleeDirX / fleeMag) * runSpeed;
                    const targetVz = (fleeDirZ / fleeMag) * runSpeed;
                    c.evadeVelX = THREE.MathUtils.lerp(c.evadeVelX, targetVx, Math.min(1.0, dt * 12.0));
                    c.evadeVelZ = THREE.MathUtils.lerp(c.evadeVelZ, targetVz, Math.min(1.0, dt * 12.0));
                    c.evadeOffsetX += c.evadeVelX * dt;
                    c.evadeOffsetZ += c.evadeVelZ * dt;
                    c.isEvading = true;
                } else {
                    const offsetDist = Math.hypot(c.evadeOffsetX, c.evadeOffsetZ);
                    if (offsetDist > 0.15) {
                        const returnSpeed = 3.6;
                        const rVx = (-c.evadeOffsetX / offsetDist) * Math.min(returnSpeed, offsetDist * 3.0);
                        const rVz = (-c.evadeOffsetZ / offsetDist) * Math.min(returnSpeed, offsetDist * 3.0);
                        c.evadeVelX = THREE.MathUtils.lerp(c.evadeVelX, rVx, Math.min(1.0, dt * 6.0));
                        c.evadeVelZ = THREE.MathUtils.lerp(c.evadeVelZ, rVz, Math.min(1.0, dt * 6.0));
                        c.evadeOffsetX += c.evadeVelX * dt;
                        c.evadeOffsetZ += c.evadeVelZ * dt;
                        c.isEvading = offsetDist > 0.6;
                    } else {
                        c.evadeOffsetX = THREE.MathUtils.lerp(c.evadeOffsetX, 0, Math.min(1.0, dt * 5.0));
                        c.evadeOffsetZ = THREE.MathUtils.lerp(c.evadeOffsetZ, 0, Math.min(1.0, dt * 5.0));
                        c.evadeVelX *= 0.8;
                        c.evadeVelZ *= 0.8;
                        c.isEvading = false;
                    }
                }

                const finalPt = { x: patrolX + c.evadeOffsetX, z: patrolZ + c.evadeOffsetZ };
                clampOutOfRunwayZone(finalPt, 12.2);
                c.evadeOffsetX = finalPt.x - patrolX;
                c.evadeOffsetZ = finalPt.z - patrolZ;

                const prevX = c.mesh.position.x;
                const prevZ = c.mesh.position.z;
                c.mesh.position.set(finalPt.x, 0, finalPt.z);

                const moveDx = finalPt.x - prevX;
                const moveDz = finalPt.z - prevZ;
                const moveSpeed = Math.hypot(moveDx, moveDz) / Math.max(dt, 0.001);

                if (c.isEvading && moveSpeed > 0.8) {
                    const runHeading = Math.atan2(moveDx, moveDz);
                    c.mesh.rotation.y = lerpYaw(c.mesh.rotation.y, runHeading, Math.min(1.0, dt * 14.0));
                    if (limbs) {
                        const sprintCycle = Math.sin(elapsed * 18.0 + c.phase) * 0.95;
                        limbs.leftLeg.rotation.x = sprintCycle;
                        limbs.rightLeg.rotation.x = -sprintCycle;
                        limbs.leftArm.rotation.x = -sprintCycle * 1.1;
                        limbs.rightArm.rotation.x = sprintCycle * 1.1;
                        limbs.leftArm.rotation.z = -0.15;
                        limbs.rightArm.rotation.z = 0.15;
                    }
                } else if (c.stationary) {
                    c.mesh.rotation.y = c.baseRot + Math.sin(a * 0.7) * 0.25;
                    if (limbs) {
                        limbs.leftLeg.rotation.x = 0;
                        limbs.rightLeg.rotation.x = 0;
                        if (limbs.pose === 'MARSHAL') {
                            limbs.leftArm.rotation.x = -2.35 + Math.sin(elapsed * 4.5 + c.phase) * 0.45;
                            limbs.rightArm.rotation.x = -2.35 + Math.cos(elapsed * 4.5 + c.phase) * 0.45;
                            limbs.leftArm.rotation.z = -0.35 + Math.sin(elapsed * 4.5) * 0.25;
                            limbs.rightArm.rotation.z = 0.35 - Math.sin(elapsed * 4.5) * 0.25;
                        } else {
                            limbs.leftArm.rotation.x = -0.45;
                            limbs.rightArm.rotation.x = -0.65 + Math.sin(elapsed * 2.5 + c.phase) * 0.15;
                        }
                    }
                } else {
                    const dx = -Math.sin(a) * c.radius + c.evadeVelX * 0.2;
                    const dz =  Math.cos(a) * c.radius + c.evadeVelZ * 0.2;
                    c.mesh.rotation.y = Math.atan2(dx, dz);

                    if (limbs) {
                        const stride = Math.sin(elapsed * c.speed * 5.2 + c.phase) * 0.52;
                        limbs.leftLeg.rotation.x = stride;
                        limbs.rightLeg.rotation.x = -stride;
                        limbs.leftArm.rotation.x = -stride * 0.75;
                        limbs.rightArm.rotation.x = limbs.pose === 'CARRY' ? -0.45 : stride * 0.75;
                    }
                }
            });

            updatePersistentAirWing(dt);
            updateParticles(dt);

            if (followUnit) {
                const worldTarget = new THREE.Vector3();
                followUnit.mesh.getWorldPosition(worldTarget);
                controls.target.lerp(worldTarget, dt * 6.0);
            } else if (desiredCamPos && desiredCamTarget) {
                camera.position.lerp(desiredCamPos, dt * 3.5);
                controls.target.lerp(desiredCamTarget, dt * 3.5);
                if (desiredCamZoom !== null) {
                    camera.zoom = THREE.MathUtils.lerp(camera.zoom, desiredCamZoom, dt * 3.5);
                    camera.updateProjectionMatrix();
                }
                if (camera.position.distanceTo(desiredCamPos) < 0.4) {
                    desiredCamPos = null;
                    desiredCamTarget = null;
                    desiredCamZoom = null;
                }
            }

            controls.update();
            composer.render();
        }

        window.addEventListener('resize', () => {
            const newAspect = window.innerWidth / window.innerHeight;
            camera.left   = (-ORTHO_FRUSTUM_HEIGHT * newAspect) / 2;
            camera.right  = ( ORTHO_FRUSTUM_HEIGHT * newAspect) / 2;
            camera.top    =  ORTHO_FRUSTUM_HEIGHT / 2;
            camera.bottom = -ORTHO_FRUSTUM_HEIGHT / 2;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        const camBtns = document.querySelectorAll('.cam-btn');
        camBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                followUnit = null;
                btnUnitFollow.textContent = 'FOLLOW: OFF';
                btnUnitFollow.classList.remove('hud-btn-active');

                camBtns.forEach(b => b.classList.remove('hud-btn-active'));
                btn.classList.add('hud-btn-active');
                const key = btn.getAttribute('data-cam');
                if (CAMERA_PRESETS[key]) {
                    desiredCamPos = CAMERA_PRESETS[key].pos.clone();
                    desiredCamTarget = CAMERA_PRESETS[key].target.clone();
                    desiredCamZoom = CAMERA_PRESETS[key].zoom;
                }
            });
        });

        const timeBtns = document.querySelectorAll('.time-btn');
        timeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                timeBtns.forEach(b => b.classList.remove('hud-btn-active'));
                btn.classList.add('hud-btn-active');
                const mode = btn.getAttribute('data-time');
                if (mode === 'day') {
                    buildMaritimeEnvironment(true);
                    scene.background.setHex(0x0a223f);
                    scene.fog.color.setHex(0x0e2b4d);
                    hemiLight.color.setHex(0x7eb0ea);
                    hemiLight.groundColor.setHex(0x09213d);
                    hemiLight.intensity = 0.76;
                    sunLight.color.setHex(0xfffef5);
                    sunLight.intensity = 3.05;
                    sunLight.position.set(-135, 260, 130);
                    fillLight.color.setHex(0x5a8cb8);
                    fillLight.intensity = 0.28;
                    fillLight.position.set(160, 75, -120);
                    oceanUniforms.uSunDir.value.copy(sunLight.position).normalize();
                    oceanUniforms.uDeepColor.value.setHex(0x081f3d);
                    oceanUniforms.uMidColor.value.setHex(0x11365f);
                    oceanUniforms.uSkyColor.value.setHex(0x3e729e);
                    oceanUniforms.uWakeTurquoise.value.setHex(0x14a39b);
                    oceanUniforms.uFoamWhite.value.setHex(0xf6f9fc);
                    oceanUniforms.uSunColor.value.setHex(0xfffef5);
                } else {
                    buildMaritimeEnvironment(false);
                    scene.background.setHex(0x1a1426);
                    scene.fog.color.setHex(0x281932);
                    hemiLight.color.setHex(0xfdba74);
                    hemiLight.intensity = 0.75;
                    sunLight.color.setHex(0xfb923c);
                    sunLight.intensity = 3.2;
                    sunLight.position.set(-220, 85, -110);
                    fillLight.intensity = 0.30;
                    oceanUniforms.uSunDir.value.copy(sunLight.position).normalize();
                    oceanUniforms.uDeepColor.value.setHex(0x051122);
                    oceanUniforms.uMidColor.value.setHex(0x132842);
                    oceanUniforms.uSkyColor.value.setHex(0x4a2e52);
                    oceanUniforms.uWakeTurquoise.value.setHex(0x0e7674);
                    oceanUniforms.uFoamWhite.value.setHex(0xdbeafe);
                    oceanUniforms.uSunColor.value.setHex(0xfdba74);
                }
            });
        });

        let rosterVisible = true;
        const btnToggleRoster = document.getElementById('btn-toggle-roster');
        btnToggleRoster.addEventListener('click', () => {
            rosterVisible = !rosterVisible;
            document.getElementById('hud-roster').style.display = rosterVisible ? 'flex' : 'none';
            btnToggleRoster.classList.toggle('hud-btn-active', rosterVisible);
        });

        let hudVisible = true;
        document.getElementById('btn-toggle-hud').addEventListener('click', () => {
            hudVisible = !hudVisible;
            document.getElementById('hud-bottom').style.display = hudVisible ? 'block' : 'none';
            document.getElementById('hud-log-pill').style.display = hudVisible ? 'flex' : 'none';
            document.getElementById('hud-roster').style.display = (hudVisible && rosterVisible) ? 'flex' : 'none';
        });

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let downPos = { x: 0, y: 0 };

        renderer.domElement.addEventListener('pointerdown', (e) => {
            downPos = { x: e.clientX, y: e.clientY };
        });

        renderer.domElement.addEventListener('pointerup', (e) => {
            if (Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 6) return;
            pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);

            const meshes = airWingUnits.map(u => u.mesh);
            const hits = raycaster.intersectObjects(meshes, true);
            let pickedUnit = null;
            if (hits.length > 0) {
                let obj = hits[0].object;
                while (obj && !obj.userData.unit) obj = obj.parent;
                if (obj && obj.userData.unit) pickedUnit = obj.userData.unit;
            }
            selectedUnit = pickedUnit;
            if (selectedUnit) setStatusLog(`TRACKING ${selectedUnit.callsign} (${selectedUnit.label})`);
            else {
                followUnit = null;
                setStatusLog('NO AIRCRAFT SELECTED • CLICK ANY AIRCRAFT');
            }
            renderRosterUI();
        });

        document.getElementById('btn-launch').addEventListener('click', () => {
            const candidate = (selectedUnit && selectedUnit.canCycleJet && selectedUnit.state === 'PARKED')
                ? selectedUnit
                : airWingUnits.find(u => u.canCycleJet && u.state === 'PARKED');
            if (candidate) {
                selectedUnit = candidate;
                commandJetLaunch(candidate);
            }
        });

        document.getElementById('btn-recover').addEventListener('click', () => {
            const candidate = (selectedUnit && selectedUnit.state === 'AIRBORNE_PATROL')
                ? selectedUnit
                : airWingUnits.find(u => u.state === 'AIRBORNE_PATROL');
            if (candidate) {
                selectedUnit = candidate;
                commandJetRecovery(candidate);
            } else {
                setStatusLog('LSO: NO AIRCRAFT IN CAP ORBIT YET');
            }
        });

        document.getElementById('btn-heli').addEventListener('click', () => {
            const helis = airWingUnits.filter(u => u.type === 'MH-60S');
            const activeOrParked = helis.find(h => h.state === 'PATROL_ORBIT') || helis.find(h => h.state === 'PARKED');
            if (activeOrParked) {
                selectedUnit = activeOrParked;
                commandHeliSortie(activeOrParked);
            }
        });

        window.onload = animate;
    </script>
</body>
</html>
