        function commandJetLaunch(unit) {
            if (!unit || !unit.canCycleJet || unit.state !== 'PARKED') return false;
            let chosenCat = unit.catIndex;
            if (isCatapultBusy(chosenCat)) {
                chosenCat = chosenCat === 1 ? 2 : 1;
                if (isCatapultBusy(chosenCat)) {
                    setStatusLog(`PRI-FLY: BOTH CATAPULTS OCCUPIED — STAND BY FOR ${unit.callsign}`);
                    return false;
                }
            }
            unit.catIndex = chosenCat;
            unit.state = 'TAXI_TO_CAT';
            unit.stateTimer = 0;
            planTaxiRouteToCatapult(unit, chosenCat);
            setStatusLog(`${unit.callsign} (${unit.type}): TAXIING TO CAT ${chosenCat}`);
            renderRosterUI();
            return true;
        }

        function commandJetRecovery(unit) {
            if (!unit || !unit.canCycleJet || unit.state !== 'AIRBORNE_PATROL') return false;
            if (isLandingStripBusy()) {
                setStatusLog(`LSO: FOUL DECK — ${unit.callsign} WAVE OFF`);
                return false;
            }
            unit.state = 'APPROACH';
            unit.stateTimer = 0;
            setStatusLog(`LSO: "${unit.callsign} ON FINAL GLIDE SLOPE — CALLING THE BALL"`);
            renderRosterUI();
            return true;
        }

        function commandHeliSortie(unit) {
            if (!unit || unit.type !== 'MH-60S') return false;
            if (unit.state === 'PARKED') {
                unit.state = 'LIFTOFF';
                unit.stateTimer = 0;
                setStatusLog(`${unit.callsign}: LIFTING OFF FOR PATROL ORBIT`);
                renderRosterUI();
                return true;
            } else if (unit.state === 'PATROL_ORBIT') {
                unit.state = 'RETURN_APPROACH';
                unit.stateTimer = 0;
                setStatusLog(`${unit.callsign}: RETURNING TO FLIGHT DECK`);
                renderRosterUI();
                return true;
            }
            return false;
        }

        function setWingFoldRatio(mesh, ratio) {
            mesh.userData.wingFoldRatio = ratio;
            if (!mesh.userData.wingFoldPivots) return;
            mesh.userData.wingFoldPivots.forEach(w => {
                w.pivot.rotation.z = w.side * w.maxAngle * ratio;
            });
        }

        function lerpYaw(a, b, t) {
            let diff = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI;
            if (diff < -Math.PI) diff += Math.PI * 2;
            return a + diff * t;
        }

        function angleDiff(a, b) {
            let diff = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI;
            if (diff < -Math.PI) diff += Math.PI * 2;
            return diff;
        }

        function renderRosterUI() {
            if (!rosterListEl) return;
            rosterListEl.innerHTML = '';
            let countParked = 0;
            let countAirborne = 0;

            airWingUnits.forEach(u => {
                if (u.state === 'PARKED') countParked++;
                else countAirborne++;

                const item = document.createElement('div');
                const isSelected = u === selectedUnit;
                item.className = `flex items-center justify-between p-1.5 rounded cursor-pointer transition-colors ${
                    isSelected ? 'bg-sky-500/30 border border-sky-400/50' : 'bg-slate-900/50 hover:bg-slate-800/80'
                }`;

                let badgeColor = 'text-slate-400';
                if (u.state === 'PARKED') badgeColor = 'text-emerald-400';
                else if (u.state === 'AIRBORNE_PATROL') badgeColor = 'text-amber-400';
                else badgeColor = 'text-sky-300';

                item.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-white">${u.callsign}</span>
                        <span class="text-[9px] px-1 py-0.2 rounded bg-slate-800 text-slate-300">${u.type}</span>
                    </div>
                    <span class="text-[10px] font-semibold ${badgeColor}">${u.state}</span>
                `;

                item.addEventListener('click', () => {
                    selectedUnit = u;
                    renderRosterUI();
                });
                rosterListEl.appendChild(item);
            });

            const summaryEl = document.getElementById('roster-summary');
            if (summaryEl) summaryEl.textContent = `${airWingUnits.length} UNITS • ${countParked} PARKED • ${countAirborne} AIRBORNE`;

            if (selectedUnit) {
                selCallsignEl.textContent = selectedUnit.callsign;
                selTypeEl.textContent = selectedUnit.label;
                selStateEl.textContent = selectedUnit.state;

                if (selectedUnit.type === 'MH-60S') {
                    btnUnitAction.textContent = selectedUnit.state === 'PARKED' ? 'LIFT OFF' : 'LAND & PARK';
                } else if (selectedUnit.canCycleJet) {
                    if (selectedUnit.state === 'PARKED') btnUnitAction.textContent = 'TAXI & LAUNCH';
                    else if (selectedUnit.state === 'AIRBORNE_PATROL') btnUnitAction.textContent = 'RECOVER / LAND';
                    else btnUnitAction.textContent = 'OPS IN PROGRESS';
                } else {
                    btnUnitAction.textContent = 'AWACS STATION';
                }
            }
        }

        btnUnitAction.addEventListener('click', () => {
            if (!selectedUnit) return;
            if (selectedUnit.type === 'MH-60S') commandHeliSortie(selectedUnit);
            else if (selectedUnit.state === 'PARKED') commandJetLaunch(selectedUnit);
            else if (selectedUnit.state === 'AIRBORNE_PATROL') commandJetRecovery(selectedUnit);
        });

        const initialCat2Jet = airWingUnits.find(u => u.callsign === 'VFA-147 #301');
        const initialCat1Jet = airWingUnits.find(u => u.callsign === 'VFA-147 #302');
        const initialCapJet  = airWingUnits.find(u => u.callsign === 'VFA-87 #401');
        const initialHeli    = airWingUnits.find(u => u.callsign === 'HSC-9 #611');

        if (initialCat2Jet) commandJetLaunch(initialCat2Jet);
        if (initialCapJet) {
            initialCapJet.state = 'PARKED'; // Keep deck parked initially matching reference photo
            initialCapJet.patrolAngle = Math.PI * 1.15;
            setWingFoldRatio(initialCapJet.mesh, 0.0);
            if (initialCapJet.mesh.userData.gearGroup) initialCapJet.mesh.userData.gearGroup.visible = false;
        }
        if (initialHeli) commandHeliSortie(initialHeli);
        selectedUnit = initialCat2Jet || airWingUnits[0];
        renderRosterUI();

        let autoOpsTimer = 0;

        function updatePersistentAirWing(dt) {
            autoOpsTimer += dt;
            if (autoOpsTimer > 3.2) {
                autoOpsTimer = 0;
                if (!isCatapultBusy(1) && !isCatapultBusy(2)) {
                    const parkedJets = airWingUnits.filter(u => u.canCycleJet && u.state === 'PARKED');
                    if (parkedJets.length > 0) {
                        const pick = parkedJets[Math.floor(Math.random() * parkedJets.length)];
                        commandJetLaunch(pick);
                    }
                }
                if (!isLandingStripBusy()) {
                    const readyToLand = airWingUnits.find(u => u.state === 'AIRBORNE_PATROL' && u.patrolLaps >= 1);
                    if (readyToLand) commandJetRecovery(readyToLand);
                }
            }

            jbdCat1.targetAngle = 0;
            jbdCat2.targetAngle = 0;

            const wPos = arrestingWireLine.geometry.attributes.position;
            let wireStretched = false;

            airWingUnits.forEach(u => {
                u.stateTimer += dt;
                const m = u.mesh;

                if (u.canCycleJet) {
                    const isCat1 = u.catIndex === 1;
                    const catStartX = isCat1 ? -7.5 : 8.5;
                    const catEndX   = isCat1 ? -6.5 : 7.5;
                    const catStartZ = isCat1 ? 52.0 : 46.0;
                    const catEndZ   = 148.0;

                    if (u.state === 'PARKED') {
                        m.position.copy(u.homePos);
                        m.rotation.set(0, u.homeRot, 0);
                        u.currentYaw = u.homeRot;
                        if (u.chocks) u.chocks.visible = true;
                        if (m.userData.gearGroup) m.userData.gearGroup.visible = true;
                        if (m.userData.afterburners) m.userData.afterburners.forEach(ab => ab.visible = false);
                        setWingFoldRatio(m, u.homeFolded ? 1.0 : 0.0);

                    } else if (u.state === 'TAXI_TO_CAT') {
                        if (u.chocks) u.chocks.visible = false;
                        const t = stepAircraftAlongTaxiSpline(u, dt);
                        if (u.homeFolded) {
                            setWingFoldRatio(m, Math.max(0.0, 1.0 - t * 2.0));
                        } else {
                            setWingFoldRatio(m, 0.0);
                        }

                        if (t >= 1.0) {
                            u.state = 'PRE_LAUNCH';
                            u.stateTimer = 0;
                            m.position.set(catStartX, 0, catStartZ);
                            m.rotation.set(0, 0, 0);
                            setStatusLog(`CAT ${u.catIndex}: ${u.callsign} LOCKED IN SHUTTLE`);
                            renderRosterUI();
                        }

                    } else if (u.state === 'PRE_LAUNCH') {
                        if (isCat1) jbdCat1.targetAngle = 0.82;
                        else jbdCat2.targetAngle = 0.82;

                        m.position.set(catStartX, 0, catStartZ);
                        m.rotation.set(0.025, 0, 0);
                        setWingFoldRatio(m, 0.0);

                        if (u.stateTimer > 0.45 && m.userData.afterburners) {
                            m.userData.afterburners.forEach(ab => {
                                ab.visible = true;
                                ab.scale.z = 0.85 + Math.sin(u.stateTimer * 45) * 0.22;
                            });
                            if (Math.random() < 0.55) {
                                spawnParticle(
                                    new THREE.Vector3(catStartX + (Math.random() - 0.5), DECK_Y + 0.8, catStartZ - 5.5),
                                    new THREE.Vector3((Math.random() - 0.5) * 4, 2.5 + Math.random() * 3, -10),
                                    0.4, 2.1, 0.6, 0xe2e8f0, 0.35
                                );
                            }
                        }

                        if (u.stateTimer >= 2.2) {
                            u.state = 'LAUNCHING';
                            u.stateTimer = 0;
                            setStatusLog(`CAT ${u.catIndex} LAUNCH! ${u.callsign} AIRBORNE`);
                            renderRosterUI();
                        }

                    } else if (u.state === 'LAUNCHING') {
                        const strokeDur = 1.45;
                        if (u.stateTimer <= strokeDur) {
                            if (isCat1) jbdCat1.targetAngle = 0.82;
                            else jbdCat2.targetAngle = 0.82;

                            const t = u.stateTimer / strokeDur;
                            const accel = t * t;
                            const cx = THREE.MathUtils.lerp(catStartX, catEndX, accel);
                            const cz = THREE.MathUtils.lerp(catStartZ, catEndZ, accel);
                            m.position.set(cx, 0, cz);
                            m.rotation.set(t > 0.82 ? -0.14 : 0, 0, 0);

                            spawnParticle(
                                new THREE.Vector3(cx, DECK_Y + 0.25, cz - 3.0),
                                new THREE.Vector3((Math.random() - 0.5) * 1.5, 0.8 + Math.random(), -6),
                                0.35, 1.8, 0.75, 0xf8fafc, 0.38
                            );
                        } else {
                            const climbT = (u.stateTimer - strokeDur) / 3.0;
                            if (climbT > 0.25 && m.userData.gearGroup) m.userData.gearGroup.visible = false;

                            const cz = catEndZ + climbT * 135;
                            const cy = Math.pow(climbT, 1.35) * 38;
                            const turnDir = isCat1 ? -1 : 1;
                            const cx = catEndX + turnDir * Math.pow(climbT, 1.8) * 55;

                            m.position.set(cx, cy, cz);
                            m.rotation.set(-0.22 * (1 - climbT * 0.5), turnDir * climbT * 0.85, -turnDir * 0.42);

                            if (climbT >= 1.0) {
                                u.state = 'AIRBORNE_PATROL';
                                u.stateTimer = 0;
                                u.patrolLaps = 0;
                                u.patrolAngle = Math.atan2(m.position.x, m.position.z);
                                if (m.userData.afterburners) m.userData.afterburners.forEach(ab => ab.visible = false);
                                renderRosterUI();
                            }
                        }

                    } else if (u.state === 'AIRBORNE_PATROL') {
                        const angularSpeed = 0.42;
                        const prevAngle = u.patrolAngle;
                        u.patrolAngle += angularSpeed * dt;
                        if (Math.floor(u.patrolAngle / (Math.PI * 2)) > Math.floor(prevAngle / (Math.PI * 2))) {
                            u.patrolLaps++;
                        }

                        const rx = 145;
                        const rz = 245;
                        const px = Math.sin(u.patrolAngle) * rx;
                        const pz = Math.cos(u.patrolAngle) * rz;
                        const py = 42 + Math.sin(u.patrolAngle * 2) * 4.0;

                        const dx = Math.cos(u.patrolAngle) * rx;
                        const dz = -Math.sin(u.patrolAngle) * rz;
                        const heading = Math.atan2(dx, dz);

                        m.position.set(px, py, pz);
                        m.rotation.set(0.03, heading, -0.38);

                    } else if (u.state === 'APPROACH') {
                        const dur = 3.8;
                        const t = Math.min(u.stateTimer / dur, 1.0);
                        if (m.userData.gearGroup) m.userData.gearGroup.visible = true;
                        setWingFoldRatio(m, 0.0);

                        const touchX = 3.5;
                        const touchZ = -98.0;
                        const distOut = (1.0 - t) * 215.0;

                        m.position.set(
                            touchX - RUNWAY_DIR.x * distOut,
                            (1.0 - t) * 32.0,
                            touchZ - RUNWAY_DIR.y * distOut
                        );
                        m.rotation.set(-0.08, RUNWAY_YAW, Math.sin(t * 10) * 0.02);

                        if (t >= 1.0) {
                            u.state = 'TOUCHDOWN_ROLLOUT';
                            u.stateTimer = 0;
                            setStatusLog(`TRAP! ${u.callsign} SNAGGED #3 WIRE`);
                            renderRosterUI();

                            for (let i = 0; i < 10; i++) {
                                spawnParticle(
                                    new THREE.Vector3(touchX + (Math.random() - 0.5) * 2.5, DECK_Y + 0.35, touchZ + (Math.random() - 0.5) * 2.5),
                                    new THREE.Vector3((Math.random() - 0.5) * 6, 1.2 + Math.random() * 2, -5 - Math.random() * 5),
                                    0.6, 2.8, 1.0, 0xf8fafc, 0.55
                                );
                            }
                        }

                    } else if (u.state === 'TOUCHDOWN_ROLLOUT') {
                        const dur = 1.75;
                        const t = Math.min(u.stateTimer / dur, 1.0);
                        const decel = 1.0 - Math.pow(1.0 - t, 2.6);
                        const runDist = decel * 74.0;

                        const touchX = 3.5;
                        const touchZ = -98.0;
                        const jx = touchX + RUNWAY_DIR.x * runDist;
                        const jz = touchZ + RUNWAY_DIR.y * runDist;

                        m.position.set(jx, 0, jz);
                        m.rotation.set(Math.sin(t * Math.PI) * 0.055, RUNWAY_YAW, 0);

                        wireStretched = true;
                        wPos.setXYZ(1, jx - RUNWAY_DIR.x * 4.2, 0.2, jz - RUNWAY_DIR.y * 4.2);
                        wPos.needsUpdate = true;

                        if (t >= 1.0) {
                            u.state = 'TAXI_TO_PARK';
                            u.stateTimer = 0;
                            planTaxiRouteToPark(u);
                            setStatusLog(`${u.callsign}: TAXIING BACK TO HOME SPOT & FOLDING WINGS`);
                            renderRosterUI();
                        }

                    } else if (u.state === 'TAXI_TO_PARK') {
                        const t = stepAircraftAlongTaxiSpline(u, dt);
                        if (u.homeFolded) {
                            setWingFoldRatio(m, Math.max(0.0, (t - 0.35) / 0.65));
                        }

                        if (t >= 1.0) {
                            u.state = 'PARKED';
                            u.stateTimer = 0;
                            m.position.copy(u.homePos);
                            m.rotation.set(0, u.homeRot, 0);
                            setWingFoldRatio(m, u.homeFolded ? 1.0 : 0.0);
                            setStatusLog(`${u.callsign}: SECURED AT HOME POSITION`);
                            renderRosterUI();
                        }
                    }

                } else if (u.type === 'MH-60S') {
                    if (u.state === 'LIFTOFF') {
                        const dur = 2.5;
                        const t = Math.min(u.stateTimer / dur, 1.0);
                        m.position.y = THREE.MathUtils.lerp(0, 22, t);
                        m.rotation.y += dt * 0.5;
                        if (t >= 1.0) {
                            u.state = 'PATROL_ORBIT';
                            u.stateTimer = 0;
                        }
                    } else if (u.state === 'PATROL_ORBIT') {
                        const a = u.stateTimer * 0.5;
                        m.position.x = u.homePos.x + Math.sin(a) * 35;
                        m.position.z = u.homePos.z + Math.cos(a) * 35;
                        m.position.y = 22 + Math.sin(a * 2) * 3.0;
                        m.rotation.y = a + Math.PI / 2;
                    } else if (u.state === 'RETURN_APPROACH') {
                        const dur = 3.0;
                        const t = Math.min(u.stateTimer / dur, 1.0);
                        m.position.x = THREE.MathUtils.lerp(m.position.x, u.homePos.x, dt * 2.0);
                        m.position.z = THREE.MathUtils.lerp(m.position.z, u.homePos.z, dt * 2.0);
                        m.position.y = THREE.MathUtils.lerp(22, 0, t);
                        if (t >= 1.0) {
                            u.state = 'PARKED';
                            u.stateTimer = 0;
                            m.position.copy(u.homePos);
                            m.rotation.set(0, u.homeRot, 0);
                            renderRosterUI();
                        }
                    }
                }
            });

            if (!wireStretched) {
                wPos.setXYZ(1, 3.5, 0.14, -98.0);
                wPos.needsUpdate = true;
            }

            const jbd1P = jbdCat1.panelPivot.rotation;
            jbdCat1.currentAngle = THREE.MathUtils.lerp(jbdCat1.currentAngle, jbdCat1.targetAngle, dt * 4.0);
            jbd1P.x = jbdCat1.currentAngle;

            const jbd2P = jbdCat2.panelPivot.rotation;
            jbdCat2.currentAngle = THREE.MathUtils.lerp(jbdCat2.currentAngle, jbdCat2.targetAngle, dt * 4.0);
            jbd2P.x = jbdCat2.currentAngle;
        }

        // ============================================================================
        // 11. ANIMATION LOOP
        // ============================================================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const dt = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            oceanUniforms.uTime.value = elapsed;

            const pitch = Math.sin(elapsed * 0.48) * 0.014;
            const roll  = Math.cos(elapsed * 0.36) * 0.012;
            const heave = Math.sin(elapsed * 0.62) * 0.28;
            carrierGroup.rotation.x = pitch;
            carrierGroup.rotation.z = roll;
            carrierGroup.position.y = heave;

            spinningRadars.forEach(sr => {
                sr.mesh.rotation.y += sr.speed * dt;
            });

            spinningPropsAndDomes.forEach(sp => {
                if (sp.axis === 'z') sp.mesh.rotation.z += sp.speed * dt;
                else sp.mesh.rotation.y += sp.speed * dt;
            });

            allHeliRotors.forEach(hr => {
                hr.mainRotor.rotation.y += hr.speed * dt;
                hr.tailRotor.rotation.x += hr.speed * dt * 1.5;
            });

            if (selectedUnit) {
                const wp = new THREE.Vector3();
                selectedUnit.mesh.getWorldPosition(wp);
                selectionBracket.position.copy(wp);
                selectionBracket.rotation.y = selectedUnit.mesh.rotation.y;
                selectionBracket.visible = true;
            } else {
                selectionBracket.visible = false;
            }

            // Gather active aircraft hazards on or near the flight deck so crew can sprint out of their path
            const activeDeckHazards = [];
            airWingUnits.forEach(u => {
                if (u.state === 'AIRBORNE_PATROL' || u.state === 'PATROL_ORBIT') return;
                if (u.mesh.position.y > 8.0) return;

                const ax = u.mesh.position.x;
                const az = u.mesh.position.z;
                const ayaw = u.mesh.rotation.y;
                const fwdX = Math.sin(ayaw);
                const fwdZ = Math.cos(ayaw);

                const isMoving = (
                    u.state === 'TAXI_TO_CAT' ||
                    u.state === 'PRE_LAUNCH' ||
                    u.state === 'LAUNCHING' ||
                    u.state === 'APPROACH' ||
                    u.state === 'TOUCHDOWN_ROLLOUT' ||
                    u.state === 'TAXI_TO_PARK' ||
                    u.state === 'LIFTOFF' ||
                    u.state === 'RETURN_APPROACH'
                );

                // Current aircraft footprint hazard
                activeDeckHazards.push({
                    x: ax,
                    z: az,
                    fwdX,
                    fwdZ,
                    radius: isMoving ? 13.5 : 7.5,
                    urgent: isMoving
                });

                // Project forward path lookahead capsules so personnel clear the taxi/launch corridor early
                if (isMoving) {
                    const lookDist1 = (u.state === 'LAUNCHING' || u.state === 'TOUCHDOWN_ROLLOUT') ? 16.0 : 9.5;
                    const lookDist2 = (u.state === 'LAUNCHING' || u.state === 'TOUCHDOWN_ROLLOUT') ? 32.0 : 18.0;
                    activeDeckHazards.push({
                        x: ax + fwdX * lookDist1,
                        z: az + fwdZ * lookDist1,
                        fwdX,
                        fwdZ,
                        radius: 12.5,
                        urgent: true
                    });
                    activeDeckHazards.push({
                        x: ax + fwdX * lookDist2,
                        z: az + fwdZ * lookDist2,
                        fwdX,
                        fwdZ,
                        radius: 11.5,
                        urgent: true
                    });
                }
            });

            deckCrewList.forEach(c => {
                const a = elapsed * c.speed + c.phase;
                const limbs = c.mesh.userData.limbs;

                // Nominal patrol or station position
                const patrolX = c.stationary ? c.baseX : (c.baseX + Math.cos(a) * c.radius);
                const patrolZ = c.stationary ? c.baseZ : (c.baseZ + Math.sin(a) * c.radius);

                let curX = patrolX + c.evadeOffsetX;
                let curZ = patrolZ + c.evadeOffsetZ;

                // Check proximity against all moving/active aircraft and their forward path corridors
                let fleeDirX = 0;
                let fleeDirZ = 0;
                let maxUrgency = 0;

                for (let h = 0; h < activeDeckHazards.length; h++) {
                    const haz = activeDeckHazards[h];
                    const dx = curX - haz.x;
                    const dz = curZ - haz.z;
                    const dist = Math.hypot(dx, dz);

                    if (dist < haz.radius && dist > 0.0001) {
                        const urgency = (1.0 - dist / haz.radius) * (haz.urgent ? 1.8 : 0.7);
                        if (haz.urgent) maxUrgency = Math.max(maxUrgency, urgency);

                        // Evade laterally perpendicular to the aircraft's nose vector so crew don't run straight down the taxiway
                        const latX = haz.fwdZ;
                        const latZ = -haz.fwdX;
                        const sideDot = dx * latX + dz * latZ;
                        const sideSign = sideDot >= 0 ? 1.0 : -1.0;

                        const radialX = dx / dist;
                        const radialZ = dz / dist;

                        fleeDirX += (radialX * 0.55 + latX * sideSign * 0.85) * urgency;
                        fleeDirZ += (radialZ * 0.55 + latZ * sideSign * 0.85) * urgency;
                    }
                }

                const fleeMag = Math.hypot(fleeDirX, fleeDirZ);
                if (fleeMag > 0.01 && maxUrgency > 0.02) {
                    // Sprint away from the aircraft's path
                    const runSpeed = 9.5 + Math.min(maxUrgency * 6.0, 6.5);
                    const targetVx = (fleeDirX / fleeMag) * runSpeed;
                    const targetVz = (fleeDirZ / fleeMag) * runSpeed;
                    c.evadeVelX = THREE.MathUtils.lerp(c.evadeVelX, targetVx, Math.min(1.0, dt * 12.0));
                    c.evadeVelZ = THREE.MathUtils.lerp(c.evadeVelZ, targetVz, Math.min(1.0, dt * 12.0));
                    c.evadeOffsetX += c.evadeVelX * dt;
                    c.evadeOffsetZ += c.evadeVelZ * dt;
                    c.isEvading = true;
                } else {
                    // When aircraft has passed, jog smoothly back to assigned station
                    const offsetDist = Math.hypot(c.evadeOffsetX, c.evadeOffsetZ);
                    if (offsetDist > 0.15) {
                        const returnSpeed = 3.6;
                        const rVx = (-c.evadeOffsetX / offsetDist) * Math.min(returnSpeed, offsetDist * 3.0);
                        const rVz = (-c.evadeOffsetZ / offsetDist) * Math.min(returnSpeed, offsetDist * 3.0);
                        c.evadeVelX = THREE.MathUtils.lerp(c.evadeVelX, rVx, Math.min(1.0, dt * 6.0));
                        c.evadeVelZ = THREE.MathUtils.lerp(c.evadeVelZ, rVz, Math.min(1.0, dt * 6.0));
                        c.evadeOffsetX += c.evadeVelX * dt;
                        c.evadeOffsetZ += c.evadeVelZ * dt;
                        c.isEvading = offsetDist > 0.6;
                    } else {
                        c.evadeOffsetX = THREE.MathUtils.lerp(c.evadeOffsetX, 0, Math.min(1.0, dt * 5.0));
                        c.evadeOffsetZ = THREE.MathUtils.lerp(c.evadeOffsetZ, 0, Math.min(1.0, dt * 5.0));
                        c.evadeVelX *= 0.8;
                        c.evadeVelZ *= 0.8;
                        c.isEvading = false;
                    }
                }

                // Final world position clamped out of the angled landing runway foul line
                const finalPt = { x: patrolX + c.evadeOffsetX, z: patrolZ + c.evadeOffsetZ };
                clampOutOfRunwayZone(finalPt, 12.2);
                c.evadeOffsetX = finalPt.x - patrolX;
                c.evadeOffsetZ = finalPt.z - patrolZ;

                const prevX = c.mesh.position.x;
                const prevZ = c.mesh.position.z;
                c.mesh.position.set(finalPt.x, 0, finalPt.z);

                const moveDx = finalPt.x - prevX;
                const moveDz = finalPt.z - prevZ;
                const moveSpeed = Math.hypot(moveDx, moveDz) / Math.max(dt, 0.001);

                if (c.isEvading && moveSpeed > 0.8) {
                    // Rapid sprinting gait & forward lean when running out of an aircraft's way
                    const runHeading = Math.atan2(moveDx, moveDz);
                    c.mesh.rotation.y = lerpYaw(c.mesh.rotation.y, runHeading, Math.min(1.0, dt * 14.0));
                    if (limbs) {
                        const sprintCycle = Math.sin(elapsed * 18.0 + c.phase) * 0.95;
                        limbs.leftLeg.rotation.x = sprintCycle;
                        limbs.rightLeg.rotation.x = -sprintCycle;
                        limbs.leftArm.rotation.x = -sprintCycle * 1.1;
                        limbs.rightArm.rotation.x = sprintCycle * 1.1;
                        limbs.leftArm.rotation.z = -0.15;
                        limbs.rightArm.rotation.z = 0.15;
                    }
                } else if (c.stationary) {
                    c.mesh.rotation.y = c.baseRot + Math.sin(a * 0.7) * 0.25;
                    if (limbs) {
                        limbs.leftLeg.rotation.x = 0;
                        limbs.rightLeg.rotation.x = 0;
                        if (limbs.pose === 'MARSHAL') {
                            limbs.leftArm.rotation.x = -2.35 + Math.sin(elapsed * 4.5 + c.phase) * 0.45;
                            limbs.rightArm.rotation.x = -2.35 + Math.cos(elapsed * 4.5 + c.phase) * 0.45;
                            limbs.leftArm.rotation.z = -0.35 + Math.sin(elapsed * 4.5) * 0.25;
                            limbs.rightArm.rotation.z = 0.35 - Math.sin(elapsed * 4.5) * 0.25;
                        } else {
                            limbs.leftArm.rotation.x = -0.45;
                            limbs.rightArm.rotation.x = -0.65 + Math.sin(elapsed * 2.5 + c.phase) * 0.15;
                        }
                    }
                } else {
                    const dx = -Math.sin(a) * c.radius + c.evadeVelX * 0.2;
                    const dz =  Math.cos(a) * c.radius + c.evadeVelZ * 0.2;
                    c.mesh.rotation.y = Math.atan2(dx, dz);

                    if (limbs) {
                        const stride = Math.sin(elapsed * c.speed * 5.2 + c.phase) * 0.52;
                        limbs.leftLeg.rotation.x = stride;
                        limbs.rightLeg.rotation.x = -stride;
                        limbs.leftArm.rotation.x = -stride * 0.75;
                        limbs.rightArm.rotation.x = limbs.pose === 'CARRY' ? -0.45 : stride * 0.75;
                    }
                }
            });

            updatePersistentAirWing(dt);
            updateParticles(dt);

            if (followUnit) {
                const worldTarget = new THREE.Vector3();
                followUnit.mesh.getWorldPosition(worldTarget);
                controls.target.lerp(worldTarget, dt * 6.0);
            } else if (desiredCamPos && desiredCamTarget) {
                camera.position.lerp(desiredCamPos, dt * 3.5);
                controls.target.lerp(desiredCamTarget, dt * 3.5);
                if (desiredCamZoom !== null) {
                    camera.zoom = THREE.MathUtils.lerp(camera.zoom, desiredCamZoom, dt * 3.5);
                    camera.updateProjectionMatrix();
                }
                if (camera.position.distanceTo(desiredCamPos) < 0.4) {
                    desiredCamPos = null;
                    desiredCamTarget = null;
                    desiredCamZoom = null;
                }
            }

            controls.update();
            composer.render();
        }

        window.addEventListener('resize', () => {
            const newAspect = window.innerWidth / window.innerHeight;
            camera.left   = (-ORTHO_FRUSTUM_HEIGHT * newAspect) / 2;
            camera.right  = ( ORTHO_FRUSTUM_HEIGHT * newAspect) / 2;
            camera.top    =  ORTHO_FRUSTUM_HEIGHT / 2;
            camera.bottom = -ORTHO_FRUSTUM_HEIGHT / 2;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        const camBtns = document.querySelectorAll('.cam-btn');
        camBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                followUnit = null;
                btnUnitFollow.textContent = 'FOLLOW: OFF';
                btnUnitFollow.classList.remove('hud-btn-active');

                camBtns.forEach(b => b.classList.remove('hud-btn-active'));
                btn.classList.add('hud-btn-active');
                const key = btn.getAttribute('data-cam');
                if (CAMERA_PRESETS[key]) {
                    desiredCamPos = CAMERA_PRESETS[key].pos.clone();
                    desiredCamTarget = CAMERA_PRESETS[key].target.clone();
                    desiredCamZoom = CAMERA_PRESETS[key].zoom;
                }
            });
        });

        const timeBtns = document.querySelectorAll('.time-btn');
        timeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                timeBtns.forEach(b => b.classList.remove('hud-btn-active'));
                btn.classList.add('hud-btn-active');
                const mode = btn.getAttribute('data-time');
                if (mode === 'day') {
                    scene.background.setHex(0x091c33);
                    scene.fog.color.setHex(0x0e2848);
                    hemiLight.color.setHex(0xe0f2fe);
                    hemiLight.intensity = 1.32;
                    sunLight.color.setHex(0xfffbf2);
                    sunLight.intensity = 3.2;
                    sunLight.position.set(150, 280, -85);
                    oceanUniforms.uSunDir.value.copy(sunLight.position).normalize();
                    oceanUniforms.uDeepColor.value.setHex(0x041325);
                    oceanUniforms.uMidColor.value.setHex(0x0b2d4d);
                    oceanUniforms.uSkyColor.value.setHex(0x4679a3);
                    oceanUniforms.uWakeTurquoise.value.setHex(0x138e88);
                    oceanUniforms.uFoamWhite.value.setHex(0xdcebf5);
                    oceanUniforms.uSunColor.value.setHex(0xfffef2);
                } else {
                    scene.background.setHex(0x1a1426);
                    scene.fog.color.setHex(0x281932);
                    hemiLight.color.setHex(0xfdba74);
                    hemiLight.intensity = 0.98;
                    sunLight.color.setHex(0xfb923c);
                    sunLight.intensity = 3.3;
                    sunLight.position.set(-240, 85, -90);
                    oceanUniforms.uSunDir.value.copy(sunLight.position).normalize();
                    oceanUniforms.uDeepColor.value.setHex(0x051122);
                    oceanUniforms.uMidColor.value.setHex(0x132842);
                    oceanUniforms.uSkyColor.value.setHex(0x4a2e52);
                    oceanUniforms.uWakeTurquoise.value.setHex(0x0e7674);
                    oceanUniforms.uFoamWhite.value.setHex(0xdbeafe);
                    oceanUniforms.uSunColor.value.setHex(0xfdba74);
                }
            });
        });

        let rosterVisible = true;
        const btnToggleRoster = document.getElementById('btn-toggle-roster');
        btnToggleRoster.addEventListener('click', () => {
            rosterVisible = !rosterVisible;
            document.getElementById('hud-roster').style.display = rosterVisible ? 'flex' : 'none';
            btnToggleRoster.classList.toggle('hud-btn-active', rosterVisible);
        });

        let hudVisible = true;
        document.getElementById('btn-toggle-hud').addEventListener('click', () => {
            hudVisible = !hudVisible;
            document.getElementById('hud-bottom').style.display = hudVisible ? 'block' : 'none';
            document.getElementById('hud-log-pill').style.display = hudVisible ? 'flex' : 'none';
            document.getElementById('hud-roster').style.display = (hudVisible && rosterVisible) ? 'flex' : 'none';
        });

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let downPos = { x: 0, y: 0 };

        renderer.domElement.addEventListener('pointerdown', (e) => {
            downPos = { x: e.clientX, y: e.clientY };
        });

        renderer.domElement.addEventListener('pointerup', (e) => {
            if (Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 6) return;
            pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);

            const meshes = airWingUnits.map(u => u.mesh);
            const hits = raycaster.intersectObjects(meshes, true);
            if (hits.length > 0) {
                let obj = hits[0].object;
                while (obj && !obj.userData.unit) obj = obj.parent;
                if (obj && obj.userData.unit) {
                    selectedUnit = obj.userData.unit;
                    setStatusLog(`TRACKING ${selectedUnit.callsign} (${selectedUnit.label})`);
                    renderRosterUI();
                }
            }
        });

        document.getElementById('btn-launch').addEventListener('click', () => {
            const candidate = (selectedUnit && selectedUnit.canCycleJet && selectedUnit.state === 'PARKED')
                ? selectedUnit
                : airWingUnits.find(u => u.canCycleJet && u.state === 'PARKED');
            if (candidate) {
                selectedUnit = candidate;
                commandJetLaunch(candidate);
            }
        });

        document.getElementById('btn-recover').addEventListener('click', () => {
            const candidate = (selectedUnit && selectedUnit.state === 'AIRBORNE_PATROL')
                ? selectedUnit
                : airWingUnits.find(u => u.state === 'AIRBORNE_PATROL');
            if (candidate) {
                selectedUnit = candidate;
                commandJetRecovery(candidate);
            } else {
                setStatusLog('LSO: NO AIRCRAFT IN CAP ORBIT YET');
            }
        });

        document.getElementById('btn-heli').addEventListener('click', () => {
            const helis = airWingUnits.filter(u => u.type === 'MH-60S');
            const activeOrParked = helis.find(h => h.state === 'PATROL_ORBIT') || helis.find(h => h.state === 'PARKED');
            if (activeOrParked) {
                selectedUnit = activeOrParked;
                commandHeliSortie(activeOrParked);
            }
        });

        window.onload = animate;
    </script>
</body>
</html>
