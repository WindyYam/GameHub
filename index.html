<!DOCTYPE html>
<html lang="en">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WindyYam's GameHub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        #root {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .app-shell {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .drag-zone {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: min(30vw, 180px);
            height: 28px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.1), transparent);
            z-index: 10;
            cursor: ns-resize;
            transition: height 0.2s, background 0.2s;
        }

        .dragging .drag-zone {
            left: 0;
            transform: none;
            width: 100%;
            height: 100vh;
            background: transparent;
        }

        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            z-index: 5;
        }

        .pulling-indicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #666;
            font-family: Arial, sans-serif;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 11;
        }

        .pulling .pulling-indicator {
            opacity: 1;
        }

        .sliding-out {
            transition: transform 0.5s ease;
            transform: translateY(100%);
        }

        .game-picker {
            position: relative;
            isolation: isolate;
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            padding: clamp(32px, 6vw, 72px) 24px;
            overflow-y: auto;
            color: #eef5ff;
            background:
                linear-gradient(rgba(90, 140, 190, 0.055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(90, 140, 190, 0.055) 1px, transparent 1px),
                radial-gradient(ellipse at 50% -25%, rgba(17, 94, 125, 0.33), transparent 55%),
                #070b14;
            background-size: 44px 44px, 44px 44px, auto, auto;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
        }

        .game-picker::before,
        .game-picker::after {
            position: fixed;
            z-index: -1;
            pointer-events: none;
            content: "";
        }

        .game-picker::before {
            top: 12%;
            right: -180px;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: rgba(0, 231, 255, 0.1);
            filter: blur(110px);
            animation: ambient-drift 12s ease-in-out infinite alternate;
        }

        .game-picker::after {
            bottom: -240px;
            left: -180px;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: rgba(116, 63, 255, 0.12);
            filter: blur(125px);
        }

        @keyframes ambient-drift {
            to {
                transform: translate(-90px, 55px);
            }
        }

        .game-picker-content {
            width: min(100%, 1180px);
            margin: 0 auto;
        }

        .home-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 32px;
            margin-bottom: 42px;
        }

        .home-eyebrow,
        .home-count-label {
            color: #83a1ba;
            font-family: "Consolas", "Courier New", monospace;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .home-eyebrow {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            color: #65e8db;
        }

        .home-eyebrow::before {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #65e8db;
            box-shadow: 0 0 14px #65e8db;
            content: "";
            animation: status-pulse 2s ease-in-out infinite;
        }

        @keyframes status-pulse {
            50% {
                opacity: 0.45;
                box-shadow: 0 0 4px #65e8db;
            }
        }

        .game-picker h1 {
            margin: 0;
            font-size: clamp(42px, 7vw, 78px);
            font-weight: 750;
            letter-spacing: -0.065em;
            line-height: 0.98;
        }

        .game-picker h1 span {
            display: block;
            color: #71e9e2;
            background: linear-gradient(90deg, #72eee0 0%, #61bfff 58%, #a98bff 100%);
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .home-description {
            max-width: 520px;
            margin: 18px 0 0;
            color: #95a6b8;
            font-size: 15px;
            line-height: 1.7;
        }

        .home-count {
            flex: 0 0 auto;
            min-width: 130px;
            padding: 17px 20px;
            border: 1px solid rgba(113, 233, 226, 0.2);
            border-radius: 14px;
            background: linear-gradient(145deg, rgba(18, 37, 50, 0.82), rgba(14, 18, 32, 0.82));
            box-shadow: inset 0 1px rgba(255, 255, 255, 0.05), 0 12px 40px rgba(0, 0, 0, 0.18);
        }

        .home-count strong {
            display: block;
            margin-top: 4px;
            color: #f3fbff;
            font-size: 30px;
            letter-spacing: -0.05em;
        }

        .game-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr));
            gap: 15px;
        }

        .game-choice {
            position: relative;
            display: flex;
            min-height: 116px;
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
            overflow: hidden;
            padding: 19px 20px;
            border: 1px solid transparent;
            border-radius: 13px;
            color: #eaf3ff;
            background:
                linear-gradient(145deg, rgba(15, 25, 40, 0.97), rgba(10, 15, 26, 0.97)) padding-box,
                linear-gradient(135deg, rgba(102, 154, 186, 0.36), rgba(76, 97, 132, 0.12) 55%, rgba(100, 104, 185, 0.24)) border-box;
            font: inherit;
            text-align: left;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
            animation: card-arrive 0.55s both;
            animation-delay: var(--card-delay, 0ms);
            transition: transform 0.22s ease, box-shadow 0.22s ease, background 0.22s ease;
        }

        .game-choice::after {
            position: absolute;
            right: -55px;
            bottom: -82px;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(48, 206, 216, 0.08);
            filter: blur(25px);
            content: "";
            transition: background 0.22s ease, transform 0.3s ease;
        }

        @keyframes card-arrive {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .game-choice:hover {
            transform: translateY(-4px);
            background:
                linear-gradient(145deg, rgba(17, 36, 51, 0.99), rgba(12, 19, 34, 0.99)) padding-box,
                linear-gradient(135deg, rgba(92, 239, 221, 0.8), rgba(91, 167, 255, 0.5) 58%, rgba(176, 130, 255, 0.62)) border-box;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.34), 0 0 25px rgba(43, 206, 210, 0.11);
        }

        .game-choice:hover::after {
            transform: scale(1.45);
            background: rgba(48, 206, 216, 0.19);
        }

        .game-choice:focus-visible {
            outline: 2px solid #71e9e2;
            outline-offset: 3px;
        }

        .game-card-bottom {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .game-card-name {
            font-size: 17px;
            font-weight: 650;
            letter-spacing: -0.025em;
        }

        .game-card-launch {
            display: grid;
            width: 29px;
            height: 29px;
            flex: 0 0 auto;
            place-items: center;
            border: 1px solid rgba(124, 164, 190, 0.23);
            border-radius: 50%;
            color: #95afc2;
            font-size: 17px;
            transition: color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .game-card-launch svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 1.8;
        }

        .game-choice:hover .game-card-launch {
            transform: translate(2px, -2px);
            border-color: rgba(113, 233, 226, 0.65);
            color: #71e9e2;
        }

        @media (max-width: 640px) {
            .game-picker {
                padding: 76px 18px 32px;
            }

            .home-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 20px;
                margin-bottom: 30px;
            }

            .home-count {
                min-width: 0;
                padding: 11px 15px;
            }

            .home-count strong {
                display: inline;
                margin: 0 0 0 8px;
                font-size: 19px;
            }

            .game-list {
                grid-template-columns: repeat(auto-fill, minmax(min(100%, 165px), 1fr));
                gap: 11px;
            }

            .game-choice {
                min-height: 100px;
                padding: 15px;
            }

            .game-card-name {
                font-size: 15px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .game-picker::before,
            .home-eyebrow::before,
            .game-choice {
                animation: none;
            }

            .game-choice,
            .game-choice::after,
            .game-card-launch {
                transition: none;
            }
        }

        .quick-menu {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 20;
            width: 44px;
            height: 44px;
            padding: 0;
            border: none;
            border-radius: 50%;
            color: #8df2e8;
            border: 1px solid rgba(113, 233, 226, 0.4);
            background: rgba(8, 18, 29, 0.9);
            cursor: pointer;
            touch-action: none;
            box-shadow: 0 0 18px rgba(47, 220, 211, 0.18), 0 5px 18px rgba(0, 0, 0, 0.28);
            user-select: none;
        }

        .quick-menu:hover,
        .quick-action:hover {
            background: rgba(15, 35, 47, 0.98);
        }

        .quick-menu svg,
        .quick-action svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            vertical-align: middle;
        }

        .quick-actions {
            position: absolute;
            z-index: 19;
            display: flex;
            gap: 8px;
        }

        .quick-action {
            display: grid;
            width: 44px;
            height: 44px;
            place-items: center;
            padding: 0;
            border: 1px solid rgba(113, 233, 226, 0.35);
            border-radius: 50%;
            color: #8df2e8;
            background: rgba(8, 18, 29, 0.94);
            cursor: pointer;
            box-shadow: 0 0 16px rgba(47, 220, 211, 0.15), 0 5px 18px rgba(0, 0, 0, 0.28);
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const GameFramework = () => {
            const [startY, setStartY] = React.useState(null);
            const [pulling, setPulling] = React.useState(false);
            const [isDragging, setIsDragging] = React.useState(false);
            const [currentGame, setCurrentGame] = React.useState(null);
            const [transform, setTransform] = React.useState('translateY(0)');
            const [games, setGames] = React.useState([]);
            const [slidingOut, setSlidingOut] = React.useState(false);
            const [shuffleTimestamp, setShuffleTimestamp] = React.useState(Date.now());
            const [isFullscreen, setIsFullscreen] = React.useState(false);
            const [recentGames, setRecentGames] = React.useState([]);
            const [menuOpen, setMenuOpen] = React.useState(false);
            const [menuPosition, setMenuPosition] = React.useState(null);
            const menuPointer = React.useRef(null);
            const menuWasDragged = React.useRef(false);
            const QUEUE_SIZE = 10;

            React.useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const gameQuery = urlParams.get('game');

                fetch('api/games?t=' + Date.now())
                    .then((response) => response.json())
                    .then((data) => {
                        console.error('Game Length:', data.length);
                        
                        let initialGame = null;
                        if (gameQuery !== null) {
                            const gameByName = data.findIndex((game) => game.path.split('/').slice(-2, -1)[0] === gameQuery);
                            initialGame = gameByName !== -1 ? gameByName : parseInt(gameQuery, 10);
                            if (isNaN(initialGame) || initialGame < 0 || initialGame >= data.length) {
                                initialGame = Math.floor(Math.random() * data.length);
                            }
                        }

                        setCurrentGame(initialGame);
                        if (initialGame !== null) {
                            setRecentGames([initialGame]);
                        }
                        setGames(data);
                    })
                    .catch((error) => console.error('Error fetching games:', error));

                const handleFullscreenChange = () => {
                    setIsFullscreen(!!document.fullscreenElement);
                };
                document.addEventListener('fullscreenchange', handleFullscreenChange);
                document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

                return () => {
                    document.removeEventListener('fullscreenchange', handleFullscreenChange);
                    document.removeEventListener('webkitfullscreenchange', handleFullscreenChange);
                };
            }, []);

            React.useEffect(() => {
                const handlePopState = () => {
                    const gameQuery = new URLSearchParams(window.location.search).get('game');
                    if (gameQuery === null) {
                        setCurrentGame(null);
                        return;
                    }

                    const gameByName = games.findIndex((game) => game.path.split('/').slice(-2, -1)[0] === gameQuery);
                    const gameIndex = gameByName !== -1 ? gameByName : parseInt(gameQuery, 10);
                    if (!isNaN(gameIndex) && gameIndex >= 0 && gameIndex < games.length) {
                        setCurrentGame(gameIndex);
                    }
                };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, [games]);

            const getNextGame = () => {
                if (games.length <= 1) {
                    return currentGame;
                }

                if (games.length <= QUEUE_SIZE) {
                    let newGame;
                    do {
                        newGame = Math.floor(Math.random() * games.length);
                    } while (newGame === currentGame);
                    return newGame;
                }

                let newGame;
                do {
                    newGame = Math.floor(Math.random() * games.length);
                } while (recentGames.includes(newGame));

                const updatedQueue = [...recentGames, newGame];
                if (updatedQueue.length > QUEUE_SIZE) {
                    updatedQueue.shift();
                }
                setRecentGames(updatedQueue);

                return newGame;
            };

            const selectGame = (gameIndex) => {
                const gameName = games[gameIndex].path.split('/').slice(-2, -1)[0];
                const newUrl = new URL(window.location);
                newUrl.searchParams.set('game', gameName);
                window.history.pushState({}, '', newUrl);
                setCurrentGame(gameIndex);
                setRecentGames([gameIndex]);
                setShuffleTimestamp(Date.now());
            };

            const goHome = () => {
                const newUrl = new URL(window.location);
                newUrl.searchParams.delete('game');
                window.history.pushState({}, '', newUrl);
                setCurrentGame(null);
                setMenuOpen(false);
            };

            const toggleFullscreen = () => {
                const rootElement = document.documentElement;
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (rootElement.requestFullscreen) {
                        rootElement.requestFullscreen();
                    } else if (rootElement.webkitRequestFullscreen) {
                        rootElement.webkitRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                }
            };

            const handleMenuPointerDown = (event) => {
                event.preventDefault();
                const bounds = event.currentTarget.getBoundingClientRect();
                menuPointer.current = {
                    pointerId: event.pointerId,
                    startX: event.clientX,
                    startY: event.clientY,
                    left: bounds.left,
                    top: bounds.top
                };
                menuWasDragged.current = false;
                event.currentTarget.setPointerCapture(event.pointerId);
            };

            const handleMenuPointerMove = (event) => {
                const pointer = menuPointer.current;
                if (!pointer || pointer.pointerId !== event.pointerId) {
                    return;
                }

                const deltaX = event.clientX - pointer.startX;
                const deltaY = event.clientY - pointer.startY;
                if (Math.abs(deltaX) > 4 || Math.abs(deltaY) > 4) {
                    menuWasDragged.current = true;
                    setMenuPosition({
                        x: Math.max(0, Math.min(window.innerWidth - 44, pointer.left + deltaX)),
                        y: Math.max(0, Math.min(window.innerHeight - 44, pointer.top + deltaY))
                    });
                }
            };

            const handleMenuPointerUp = () => {
                menuPointer.current = null;
            };

            const handleMenuClick = () => {
                if (menuWasDragged.current) {
                    menuWasDragged.current = false;
                    return;
                }
                setMenuOpen((open) => !open);
            };

            const handleStart = (y) => {
                if (window.scrollY === 0) {
                    setStartY(y);
                    setIsDragging(true);
                }
            };

            const handleMove = (y) => {
                if (startY !== null) {
                    const diff = y - startY;

                    if (diff > 100) {
                        setPulling(true);
                    } else {
                        setPulling(false);
                    }

                    if (diff > 0) {
                        setTransform(`translateY(${diff}px)`);
                        return true;
                    }
                }
                return false;
            };

            const handleEnd = () => {
                if (pulling && games.length > 0) {
                    setSlidingOut(true);
                    setTimeout(() => {
                        const newGame = getNextGame();
                        setShuffleTimestamp(Date.now());
                        setCurrentGame(newGame);
                    }, 400);

                    setTimeout(() => {
                        setSlidingOut(false);
                        setTransform('translateY(0)');
                    }, 500);
                }

                setStartY(null);
                setPulling(false);
                setIsDragging(false);
                setTransform('');
            };

            const handleTouchStart = (e) => {
                handleStart(e.touches[0].clientY);
            };

            const handleTouchMove = (e) => {
                if (handleMove(e.touches[0].clientY)) {
                    e.preventDefault();
                }
            };

            const handleMouseDown = (e) => {
                handleStart(e.clientY);
            };

            const handleMouseMove = (e) => {
                if (startY !== null && handleMove(e.clientY)) {
                    e.preventDefault();
                }
            };

            if (games.length === 0) {
                return <div>Loading games...</div>;
            }

            const menuX = menuPosition ? menuPosition.x : window.innerWidth - 59;
            const menuY = menuPosition ? menuPosition.y : 15;
            const actionsAbove = menuY > window.innerHeight - 112;
            const actionsToRight = menuX < 112;

            return (
            <div className="app-shell">
                {currentGame === null ? (
                    <main className="game-picker">
                        <div className="game-picker-content">
                            <header className="home-header">
                                <div>
                                    <div className="home-eyebrow">WINDYYAM // ARCADE NETWORK</div>
                                    <h1>
                                        Choose your
                                        <span>next game.</span>
                                    </h1>
                                    <p className="home-description">
                                        A collection of games, stories, and challenges. Pick a game and jump straight in.
                                    </p>
                                </div>
                                <div className="home-count">
                                    <span className="home-count-label">Available games</span>
                                    <strong>{String(games.length).padStart(2, '0')}</strong>
                                </div>
                            </header>
                            <div className="game-list">
                                {games.map((game, index) => {
                                    const gameName = game.path.split('/').slice(-2, -1)[0];
                                    const displayName = gameName.replace(/([a-z])([A-Z])/g, '$1 $2');
                                    return (
                                        <button
                                            className="game-choice"
                                            key={game.path}
                                            style={{ '--card-delay': `${Math.min(index, 12) * 35}ms` }}
                                            onClick={() => selectGame(index)}
                                        >
                                            <span className="game-card-bottom">
                                                <span className="game-card-name">{displayName}</span>
                                                <span className="game-card-launch" aria-hidden="true">
                                                    <svg viewBox="0 0 20 20">
                                                        <path d="M6 14 14 6M7 6h7v7" />
                                                    </svg>
                                                </span>
                                            </span>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </main>
                ) : (
                    <div
                        className={`game-container ${pulling ? 'pulling' : ''} ${isDragging ? 'dragging' : ''} ${slidingOut ? 'sliding-out' : ''}`}
                        style={{ transform }}
                    >
                        <div
                            className="drag-zone"
                            onTouchStart={handleTouchStart}
                            onTouchMove={handleTouchMove}
                            onTouchEnd={handleEnd}
                            onMouseDown={handleMouseDown}
                            onMouseMove={handleMouseMove}
                            onMouseUp={handleEnd}
                            onMouseLeave={handleEnd}
                        >
                            <div className="pulling-indicator">
                                Pull to shuffle ↓
                            </div>
                        </div>
                        <iframe
                            src={`${games[currentGame].path}?_cache=${shuffleTimestamp}`}
                            className="game-frame"
                            title={`Game ${currentGame + 1}`}
                        />
                    </div>
                )}
                <button
                    className="quick-menu"
                    style={menuPosition ? { left: menuPosition.x, top: menuPosition.y, right: 'auto' } : undefined}
                    onPointerDown={handleMenuPointerDown}
                    onPointerMove={handleMenuPointerMove}
                    onPointerUp={handleMenuPointerUp}
                    onPointerCancel={handleMenuPointerUp}
                    onClick={handleMenuClick}
                    aria-label={menuOpen ? 'Close quick actions' : 'Open quick actions'}
                    aria-expanded={menuOpen}
                    title="Drag to move; click for actions"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z" />
                    </svg>
                </button>
                {menuOpen && (
                    <div
                        className="quick-actions"
                        style={{
                            left: actionsToRight ? menuX + 52 : 'auto',
                            right: actionsToRight ? 'auto' : window.innerWidth - menuX + 8,
                            top: actionsAbove ? 'auto' : menuY + 52,
                            bottom: actionsAbove ? window.innerHeight - menuY + 8 : 'auto'
                        }}
                    >
                        <button
                            className="quick-action"
                            onClick={toggleFullscreen}
                            aria-label={isFullscreen ? 'Exit fullscreen' : 'Enter fullscreen'}
                            title={isFullscreen ? 'Exit fullscreen' : 'Enter fullscreen'}
                        >
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                {isFullscreen ? (
                                    <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z" />
                                ) : (
